const ADVISOR_KNOWLEDGE = `Goalden is one personal-finance planning app with three levels — they all share the same math, so moving to a deeper level never wastes anything the user already entered. It supports India (₹) and the United States ($).
- Level 1 — Quick Calculate: a fast single-goal answer in about two minutes, for first-timers.
- Level 2 — The Full Plan (this page): a risk-profiling questionnaire that builds a multi-goal plan with recommended fund categories.
- Level 3 — The Lab: full assumption control, Monte Carlo, efficient frontier, and live real-market-data testing.
The user is currently on Level 2.

This is "Goalden — The Full Plan" (Level 2): a guided risk-profiling questionnaire that builds a multi-goal investment plan.

What it does: scores the user's risk capacity and risk tolerance, names a risk bucket, then for each goal applies a horizon-based "equity ceiling" (glide path) and recommends actual fund categories with plain-English reasons.

Screens: country -> capacity questions (income reliability, dependents, loan EMI burden, concentration) -> emergency fund status -> (optional) emergency prioritization -> budget (monthly savings capacity) -> tolerance questions (reaction to a 30% drop, market experience, impact of loss, sleep during downturns, path preference) -> risk profile -> goals hub -> plan -> optional "The Case".

Scoring: capacity and tolerance are each scored 1-4 per question. The final score is the LOWER of the two totals — capacity caps tolerance, so the app never pushes someone past their stated comfort. The score maps to a bucket.

Risk buckets (equity/debt/hybrid): Conservative 20/60/20, Moderately Conservative 35/50/15, Moderate 50/35/15, Growth-Oriented 70/20/10, Aggressive 85/10/5.

Horizon ceiling (glide path): a goal's equity is capped by its time horizon, rising through anchors at 2, 4, 7, 12 and 18 years. It can only pull equity DOWN — never above the user's own tolerance. It is a ceiling, not a floor.

Goals (each calculated separately): retirement (monthly expense, current age, retire age), education (annual fee, years, 4-year duration), house/generic (amount, years). Emergency fund: 3-6 months of expenses (partial/full) invested at the debt rate.

Calculations: same corpus/SIP engine as Level 1, plus per-goal horizon-adjusted allocation. The plan totals all goal SIPs, adds the emergency-fund SIP, and compares against monthly capacity to report a surplus or shortfall.

Assumptions (per country): India (₹): inflation 6%, education 10%, debt 7%, hybrid 10%, equity 12%, post-ret 9%, life expectancy 78, FD 6.5%. US ($): inflation 2.5%, education 5%, debt 4.5%, hybrid 7%, equity 9%, post-ret 6%, life expectancy 82, FD 4%.

Data sources: same real historical Sensex (India, FY1980-2023) / S&P 500 (US, 1928-2024) series as Level 1 for "The Case". No live market data here.

Behavior: prefer driving the real interface — navigate to the right screen, set the values, scroll the result into view, then explain what the user is looking at in plain language. Use the workspace canvas only to compare two scenarios side by side, or to show something not on the current page. Never describe a number without putting it on screen.

Choice before action (mandatory, ALWAYS the first move): The moment the user asks you to build/plan anything — even with zero numbers given yet, e.g. just "build a retirement plan for me" — before touching any field, offer this choice, and nothing else (don't ask which screen/level to use instead):
"I can either:
A) Do it all for you — I'll ask for the few numbers I actually need, then fill everything in, run the plan, and hand you a full report.
B) Walk you through it step by step — you do each screen, I explain as we go.
Which would you prefer?"
Wait for their reply. If they say "do it" / "option A" / "go ahead" / anything clearly affirmative: if they haven't given you the numbers yet, ask for the essential few in ONE consolidated message (not one field at a time) — include a quick risk-comfort question (e.g. "and how would you describe your comfort with investment risk — cautious, moderate, or aggressive?") alongside the financial numbers, since this page's whole point is a risk-profiled plan. If they answer it, you still can't skip the actual questionnaire screens (there's no shortcut field for it) — quickly click through the risk-profile screens yourself using their stated comfort level to pick each answer, narrating briefly ("since you said moderate, I'll answer these consistently"), then continue to the goal(s) and plan. If they don't answer the risk question or you can't tell, proceed anyway using a moderate default — but say so plainly in your final report ("I used a moderate risk profile since we didn't fully cover your risk comfort — you can redo the questionnaire anytime for a more tailored mix"), never silently. Once everything is set, prefer calling build_goal_plan ONCE (with country and a params object carrying the questionnaire answers, capacity and goals) instead of one set_value/add_goal call per field, narrating briefly as you go, and ALWAYS finish by calling compose_briefing so the result lands as a full report page with graphs — never just a chat summary. If build_goal_plan fails, or you need to correct a single value afterwards, use set_value/add_goal for just that correction. If they say "guide me" / "walk me through" / "option B", navigate one screen at a time and explain each question before they answer it.`;

function advisorSetValue(field, value) {
  const spec = ADVISOR_FIELDS.find(f => f.name === field);
  if (!spec) return { ok:false, error:'Unknown field "'+field+'". Valid: '+ADVISOR_FIELDS.map(f=>f.name).join(', ') };
  if (value === undefined || value === null || value === '') return { ok:false, error:'Missing value for '+field };
  if (spec.type === 'integer') {
    value = parseInt(value, 10);
    if (!isFinite(value)) return { ok:false, error:'Value for '+field+' must be a number.' };
  } else if (spec.type === 'boolean') {
    value = (value === true || value === 'true' || value === 1 || value === '1');
  }
  if (spec.enum && !spec.enum.includes(value)) return { ok:false, error:'Invalid value for '+field+'. Allowed: '+spec.enum.join(', ') };
  if (spec.min !== undefined && value < spec.min) return { ok:false, error:'Value for '+field+' is too low — it must be at least '+spec.min+'.' };
  if (spec.max !== undefined && value > spec.max) return { ok:false, error:'Value for '+field+' is too high — it must be at most '+spec.max+'.' };
  if (field.startsWith('cap_')) G.capA[parseInt(field.slice(4), 10)] = value;
  else if (field.startsWith('tol_')) G.tolA[parseInt(field.slice(4), 10)] = value;
  else if (field === 'emergencyStatus') { G.emergencyStatus = value; G.emergencyPrioritize = null; }
  else G[field] = value;
  const f = flow();
  G.si = Math.max(0, Math.min(f.length - 1, G.si));
  render();
  return { ok:true, field, value, page:f[G.si], touched:'#stage .screen' };
}

function advisorAddGoal(args) {
  const type = args.type;
  let goal;
  if (type === 'retirement') {
    if (!args.retireAge || !args.monthlyExpense || !args.currentAge) return { ok:false, error:'A retirement goal needs retireAge, monthlyExpense and currentAge.' };
    goal = { type:'retirement', label:'Retirement', retireAge:args.retireAge, monthlyExpense:args.monthlyExpense, currentAge:args.currentAge, years:Math.max(1, args.retireAge - args.currentAge), existingSavings:args.existingSavings || 0 };
  } else if (type === 'education') {
    if (!args.annualFee || !args.years) return { ok:false, error:'An education goal needs annualFee and years.' };
    goal = { type:'education', label:'Education', annualFee:args.annualFee, years:args.years, duration:4, existingSavings:args.existingSavings || 0 };
  } else {
    if (!args.amount || !args.years) return { ok:false, error:'This goal needs amount and years.' };
    const sub = type === 'house' ? 'house' : 'generic';
    goal = { type:'generic', label: sub === 'house' ? 'House' : 'Other goal', amount:args.amount, years:args.years, genSub:sub, existingSavings:args.existingSavings || 0 };
  }
  G.goals.push(goal);
  G.addingGoal = false; G.editingIndex = null;
  const f = flow();
  G.si = f.indexOf('plan');
  render();
  return { ok:true, added:goal, page:'plan' };
}

// F7a — structured description of the plan on screen, built from the app's own
// numbers (never fabricated).
function advisorReadCurrentChart() {
  if (!G.country) return { ok:false, error:'Pick your country first.' };
  const plan = buildPlan();
  const b = G.bucket ? BUCKETS[G.bucket] : null;
  const c = cfg();
  const points = [];
  if (b) points.push({ label:'risk profile', value:b.name });
  points.push({ label:'total monthly SIP', value:c.fmt(plan.totalSIP) });
  points.push({ label:'your capacity', value:c.fmt(plan.cap) });
  points.push({ label:'surplus / shortfall', value:(plan.diff>=0?'+':'−')+c.fmt(Math.abs(plan.diff))+'/mo' });
  plan.goals.forEach(function (g) { points.push({ label:g.label, value:c.fmt(g.sip)+'/mo · '+c.compact(g.corpus)+' corpus' }); });
  return { ok:true, tool:'The Full Plan', charts:[
    { kind:'plan', title:'Your plan', note:'the combined monthly plan against your capacity ('+plan.status+')', points: points },
  ] };
}
function advisorReadCurrentResult() { return advisorGetResults(); }

// Part B — cross-field sanity flags (advisory, not blocking). Check 1 is the
// clear one here: required SIP vs the user's stated monthly capacity. Checks
// 2 & 3 are skipped — Door 2 has no single household monthly-expense field
// (spending lives per-goal on retirement goals), so there is no one number to
// sanity-check against without inventing one.
function crossFieldSanity(state, country) {
  const flags = [];
  if (state.country && state.monthlyCapacity != null && state.goals && state.goals.length) {
    const plan = buildPlan();
    if (plan.totalSIP > 0 && state.monthlyCapacity > 0 && plan.totalSIP > 1.5 * state.monthlyCapacity) {
      flags.push('The plan needs about ' + cfg().fmt(Math.round(plan.totalSIP)) + '/month, but you stated ' + cfg().fmt(Math.round(state.monthlyCapacity)) + '/month — required savings are over 1.5x your stated capacity.');
    }
  }
  return flags;
}

function advisorGetResults() {
  if (!G.country) return { ok:false, error:'Need a country/currency first — ask the user whether they are in India or the United States.' };
  if (G.capA.every(x => x != null) && G.tolA.every(x => x != null)) {
    const sc = scoreBuckets();
    G.bucket = sc.bucket; G.capScore = sc.capScore; G.tolScore = sc.tolScore;
  }
  const plan = buildPlan();
  return { ok:true, result:{
    riskBucket: G.bucket ? BUCKETS[G.bucket].name : 'not yet determined',
    monthlyCapacity: plan.cap,
    emergencyFund: plan.emg.needed ? { amount:plan.emg.amount, monthlySIP:plan.emg.sip } : (plan.emg.declined ? 'declined' : 'already funded'),
    goals: plan.goals.map(g => ({ label:g.label, corpus:g.corpus, monthlySIP:g.sip })),
    totalMonthlySIP: plan.totalSIP,
    shortfallOrSurplus: plan.diff,
    status: plan.status,
  }, flags: crossFieldSanity(G, G.country) };
}

const ADVISOR_HIGHLIGHT_TARGETS = {

function advisorHighlight(name) {
  const sel = ADVISOR_HIGHLIGHT_TARGETS[name];

function resultCanvasGoals() {
  const c = cfg();
  if (!G.country) return '<div class="gr-note">Pick your country first.</div>';

function resultCanvasAlloc() {

    '<div class="alloc-return-row"><div><div class="alloc-return-label">Expected return</div><div class="alloc-return-value">'+(baseRate*100).toFixed(1)+'%</div></div>' +
    '<div><div class="alloc-return-label">After '+(c.d.inflation*100).toFixed(0)+'% inflation</div><div class="alloc-return-value" style="color:'+(baseReal>0?'#8FC79E':'#E8977A')+'">'+(baseReal*100).toFixed(1)+'%</div></div></div></div>';
}
function resultCanvasProfile() {
  if (!G.bucket) return '<div class="gr-note">Complete the risk questionnaire to see your profile.</div>';
  const b = BUCKETS[G.bucket];
  return '<div class="profile-card pc-'+b.cls+'"><div class="pc-label">Your profile</div><div class="pc-name">'+b.name+'</div><div class="pc-tagline">'+b.tagline+'</div><div class="pc-desc">'+b.desc+'</div></div>';

// F3g — the four single-scenario `show_result` kinds are retired; they're now
// Briefing sections. Each build() returns {ok, html} or {ok:false, error}.

      '<div class="alloc-return-row"><div><div class="alloc-return-label">Total monthly SIP</div><div class="alloc-return-value">'+c.fmt(plan.totalSIP)+'</div></div>' +

      '<div class="gr-note" style="margin-top:10px">'+statusLabel+' ('+(plan.diff>=0?'+':'−')+c.fmt(Math.abs(plan.diff))+'/mo)'+(b?' · '+b.name+' profile':'')+'.</div></div>', figures: figures };
  } },
  goals: { title: 'Each goal', build: function () {

    return { ok:true, html: '<div class="alloc-card"><div class="section-head">Each goal</div>'+rows+'</div>' };
  } },
  allocation: { title: 'Your allocation', build: function () {

      '<div class="alloc-flex">'+allocationDonut(b.eq, b.de, b.hy, 'bf-alloc')+'<div class="alloc-legend">'+allocationLegend(b.eq, b.de, b.hy)+'</div></div>' +
      '<div class="alloc-return-row"><div><div class="alloc-return-label">Expected return</div><div class="alloc-return-value">'+(baseRate*100).toFixed(1)+'%</div></div></div></div>' };

    return { ok:true, html: '<div class="alloc-card"><div class="section-head">Assumptions for '+c.name+'</div>'+rows+'</div>' };

  next: { title: 'What to do next', build: function () {

function executeAdvisorTool(name, args) {
  if (name === 'get_state') {
    return JSON.stringify(Object.assign({}, G, { page: flow()[G.si] || null, screens: flow() }));
  }
  if (name === 'get_results') return JSON.stringify(advisorGetResults());
  if (name === 'read_current_chart') return JSON.stringify(advisorReadCurrentChart());
  if (name === 'read_current_result') return JSON.stringify(advisorReadCurrentResult());
  if (name === 'navigate') {
    const screen = args && args.screen;
    const idx = flow().indexOf(screen);
    if (idx === -1) return JSON.stringify({ ok:false, error:'No screen named "'+screen+'". Valid: '+flow().join(', ') });
    G.si = idx;
    render();
    return JSON.stringify({ ok:true, screen, page:screen });
  }
  if (name === 'set_value') return JSON.stringify(advisorSetValue(args && args.field, args && args.value));
  if (name === 'add_goal') return JSON.stringify(advisorAddGoal(args || {}));
  if (name === 'build_goal_plan') {
    const start = performance.now();
    const country = args && args.country;
    const params = (args && args.params) || {};
    if (!['IN','US'].includes(country)) return JSON.stringify({ ok:false, error:'Invalid country. Valid: IN, US.' });
    const setFields = ['country'];
    const skipped = [];
    let r = advisorSetValue('country', country);
    if (!r.ok) return JSON.stringify({ ok:false, error:r.error, failedField:'country' });
    const goals = params.goals;
    for (const k in params) {
      if (k === 'goals') continue;
      const spec = ADVISOR_FIELDS.find(function (f) { return f.name === k; });
      if (!spec) { skipped.push(k); continue; }
      const r2 = advisorSetValue(k, params[k]);
      if (!r2.ok) return JSON.stringify({ ok:false, error:r2.error, failedField:k });
      setFields.push(k);
    }
    if (Array.isArray(goals)) {
      for (let i = 0; i < goals.length; i++) {
        const ga = advisorAddGoal(goals[i] || {});
        if (!ga.ok) return JSON.stringify({ ok:false, error:ga.error, failedField:'goals['+i+']' });
        setFields.push('goals['+i+']');
      }
    } else if (goals != null) {
      skipped.push('goals');
    }
    const results = advisorGetResults();
    console.log('[skill-metric] build_goal_plan ' + (performance.now()-start).toFixed(0) + 'ms');
    return JSON.stringify({ ok:true, results: results.result, flags: results.flags, setFields: setFields, skipped: skipped });
  }
  if (name === 'highlight') return JSON.stringify(advisorHighlight(args && args.element));
  if (name === 'scroll_to') return JSON.stringify(advisorHighlight(args && args.element));
  return JSON.stringify({ ok:false, error:'Unknown tool: '+name });
}

// F2a — human-readable narration of each tool call.
function advisorDescribeTool(name, args) {
  args = args || {};
  switch (name) {
    case 'navigate': return 'Going to ' + args.screen;
    case 'set_value': return 'Setting ' + args.field + ' to ' + args.value;
    case 'add_goal': return 'Adding your goal';
    case 'build_goal_plan': return 'Building your full plan';
    case 'get_results': return 'Building your plan';
    case 'read_current_chart': return 'Reading the plan on your screen';
    case 'read_current_result': return 'Reading your plan';
    case 'get_state': return 'Reading your answers';
    case 'highlight': case 'scroll_to': return 'Pointing you at the ' + args.element;
    case 'compose_briefing': return 'Putting together your briefing';
    default: return null;
  }
}

  placeholder: 'Ask, or tap the mic…',
  showDisclaimer: false
};

(function boot(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(STATE_KEY)||'null'); }catch(e){}
  // A stale #hash from a previous session (e.g. #plan with an empty G)
  // would otherwise let popstate jump a fresh visitor onto a blank screen —
  // wipe it before the first render lays down a clean history entry.
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(saved && typeof saved.si==='number' && saved.si>0){
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(20,40,63,.45);z-index:900;display:flex;align-items:center;justify-content:center';
    const card=document.createElement('div');
    card.style.cssText='background:#fff;border-radius:14px;padding:26px 28px;max-width:420px;width:calc(100vw - 48px);box-shadow:0 18px 50px rgba(20,40,63,.3);text-align:center';
    card.innerHTML='<div style="font-family:\'Newsreader\',serif;font-size:23px;font-weight:600;color:#14283F;margin-bottom:8px">Pick up where you left off?</div>'
      +'<div style="font-size:14px;color:rgba(20,40,63,.75);margin-bottom:20px;line-height:1.5">You were partway through your plan on this device. Resume it, or start fresh.</div>';
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:10px;justify-content:center';
    const mkBtn=(label,primary)=>{
      const b=document.createElement('button');
      b.textContent=label;
      b.style.cssText='flex:1;padding:11px 14px;border-radius:10px;border:1px solid '+(primary?'#2557C7':'rgba(20,40,63,.25)')
        +';background:'+(primary?'#2557C7':'transparent')+';color:'+(primary?'#fff':'#14283F')
        +';font-size:14px;cursor:pointer;font-family:inherit';
      return b;
    };
    const yes=mkBtn('Resume',true),no=mkBtn('Start fresh',false);
    yes.addEventListener('click',()=>{
      Object.assign(G,saved);
      // Saved si can outrun the flow if the save predates a flow change
      // (answers that add/remove screens); clamp so a restore can never
      // land on a blank screen.
      G.si=Math.max(0,Math.min(flow().length-1,G.si));
      ov.remove();render();
    });
    no.addEventListener('click',()=>{clearSavedState();ov.remove();render();});
    row.append(yes,no);
    card.append(row);
    ov.append(card);
    document.body.append(ov);
  }else{
    render();
  }
})();
