<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Goalden — your full plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/echarts.min.js"></script>
<style>
:root{
  /* White + shades of blue (Track C repalette) -- see goalden-lab.html's
     :root comment for the full rationale; same recipe applied here. */
  --bg:#F5F8FC; --ink:#14283F;--ink2:#1B3A63;--paper:#14283F;--card:#FFFFFF;
  --gold:#2557C7;--red:#A03A22;--dim:#5E7290;--ok:#2E8B6F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:'Figtree',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;line-height:1.5}
h1,h2,h3{line-height:1.25}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
:is(button,a,input,[tabindex]):focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* --- chrome --- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;flex-shrink:0}
.brand{font-family:'Newsreader',serif;font-weight:700;font-size:18px;color:var(--gold);text-decoration:none;display:inline-block}
.brand span{font-weight:400;font-style:italic;font-size:13px;color:rgba(20,40,63,.6);margin-left:6px}
.backbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(20,40,63,.2);background:transparent;color:var(--paper);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.assumpbtn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(37,87,199,.5);background:rgba(37,87,199,.12);color:var(--gold);font-family:'Newsreader',serif;font-style:italic;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.assumpbtn.show{opacity:1;pointer-events:auto}
.backbtn.show{opacity:1;pointer-events:auto}
.progress-track{padding:2px 20px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:5px}
.progress-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.progress-bar-wrap{height:4px;background:rgba(20,40,63,.12);border-radius:2px;overflow:hidden}
.progress-bar{height:100%;background:var(--gold);border-radius:2px;transition:width .35s ease;width:0%}

/* --- stage --- */
.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;padding:6px 22px 22px;display:flex;flex-direction:column;opacity:0;transform:translateX(20px);pointer-events:none;transition:opacity .28s ease,transform .28s ease;min-height:0}
/* Switching to position:relative here (needed so the active screen takes
   up real layout space) silently drops the height that inset:0 was
   providing — position:relative doesn't size an element, it only offsets
   it. Without an explicit height, a screen with enough content (extra
   sliders, an optional field, etc.) just grows past .stage's box, and
   .stage's overflow:hidden clips the excess with no scrollbar in sight —
   the exact "have to zoom out to reach the button" bug. height:100% pins
   it back to .stage's real, bounded height so .qbody's own overflow-y:auto
   actually has something to scroll within. */
.screen.active{opacity:1;transform:translateX(0);pointer-events:auto;position:relative;height:100%;min-height:0}

/* --- typography --- */
.eyebrow{font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.qtitle{font-family:'Newsreader',serif;font-weight:600;font-size:clamp(20px,6.5vw,28px);line-height:1.2;color:var(--paper);margin-bottom:7px}
.qsub{font-size:13.5px;color:rgba(20,40,63,.6);margin-bottom:20px;line-height:1.5;max-width:38ch}
.qbody{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:11px;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* A batched question screen (renderQGroup) stacks 2-3 of these inside one
   .qbody -- smaller than .qtitle since there's more than one per screen now,
   and the dashed top divider (matching Door 1's .optional-field idiom) marks
   where the next question starts. */
.qgroup-title{font-family:'Newsreader',serif;font-weight:600;font-size:17px;line-height:1.3;color:var(--paper);margin-bottom:10px}
.qgroup-item{display:flex;flex-direction:column;gap:9px}
.qgroup-item-sep{padding-top:18px;border-top:1px dashed rgba(20,40,63,.16)}

/* --- option cards --- */
.opt{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.13);border-radius:3px 15px 15px 15px;padding:16px 17px;cursor:pointer;transition:all .17s;text-align:left}
.opt:active{transform:scale(.98)}
.opt.sel{background:rgba(37,87,199,.16);border-color:var(--gold)}
.opt-main{font-size:14.5px;color:var(--paper);line-height:1.35}
.opt-tag{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);margin-top:3px}

/* --- country grid --- */
.country-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccrd{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.13);border-radius:6px 18px 6px 18px;padding:22px 12px;text-align:center;cursor:pointer;transition:all .17s}
.ccrd:active{transform:scale(.97)}
.ccrd:hover{border-color:rgba(37,87,199,.4)}
.ccrd.sel{background:rgba(37,87,199,.16);border-color:var(--gold)}
.cf{width:44px;height:44px;border-radius:50%;background:rgba(37,87,199,.14);border:1px solid rgba(37,87,199,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-family:'Newsreader',serif;font-size:22px;color:var(--gold)}
.cn{font-family:'Newsreader',serif;font-size:16px;font-weight:600;color:var(--paper)}
.cc{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}

/* --- number input --- */
.num-row{display:flex;align-items:baseline;gap:6px;padding:14px 0;border-bottom:2px solid rgba(20,40,63,.18);margin-bottom:16px}
.value-slider{margin:2px 0 14px}
.value-slider input[type=range]{width:100%;accent-color:var(--gold);height:22px;cursor:pointer}
.value-slider-labels{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}
/* Custom slider thumb + track, matching goalden.html / goalden-lab.html. */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(20,40,63,.14)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(20,40,63,.14)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);margin-top:-6px;box-shadow:0 1px 4px rgba(20,40,63,.3);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 1px 4px rgba(20,40,63,.3);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:hover::-moz-range-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22);box-shadow:0 2px 8px rgba(37,87,199,.4)}
input[type=range]:active::-moz-range-thumb{transform:scale(1.22);box-shadow:0 2px 8px rgba(37,87,199,.4)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--gold);outline-offset:2px}
input[type=range]:focus-visible::-moz-range-thumb{outline:2px solid var(--gold);outline-offset:2px}
.chips-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:2px 0 8px}
.np{font-family:'Newsreader',serif;font-size:24px;color:var(--gold)}
.ni{flex:1;background:transparent;border:none;outline:none;color:var(--paper);font-family:'Newsreader',serif;font-size:36px;font-weight:600;-moz-appearance:textfield}
.ni::-webkit-outer-spin-button,.ni::-webkit-inner-spin-button{-webkit-appearance:none}
.ns{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--paper);background:rgba(20,40,63,.08);border:1px solid rgba(20,40,63,.16);padding:8px 13px;border-radius:3px;cursor:pointer;transition:all .14s}
.chip:active{transform:scale(.95)}
.chip.sel{background:var(--gold);border-color:var(--gold);color:#fff}
.err{color:#E8977A;font-size:12px;font-family:'Spline Sans Mono',monospace;min-height:16px;margin-top:8px}

/* --- two-column form --- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fblock label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:8px}
.fblock .num-row{margin-bottom:10px}

/* --- CTA --- */
.cta-zone{padding:12px 0 2px;flex-shrink:0}
.cta{width:100%;background:var(--gold);color:#fff;border:none;border-radius:9px;font-family:'Figtree',sans-serif;font-weight:700;font-size:15.5px;padding:16px;cursor:pointer;transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.3;pointer-events:none}
.cta-ghost{width:100%;background:transparent;color:rgba(20,40,63,.5);border:1px solid rgba(20,40,63,.15);border-radius:13px;font-family:'Figtree',sans-serif;font-size:14px;padding:12px;cursor:pointer;margin-top:10px;transition:opacity .15s}

/* --- profile reveal --- */
.profile-card{border-radius:3px 20px 20px 20px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.profile-card::before{content:'';position:absolute;inset:0;opacity:.12}
.pc-conservative    {background:rgba(74,144,164,.10);border:1.5px solid #4A90A4}
.pc-mod_conservative{background:rgba(91,143,110,.10);border:1.5px solid #5B8F6E}
.pc-moderate        {background:rgba(37,87,199,.08);border:1.5px solid #2557C7}
.pc-mod_aggressive  {background:rgba(155,124,58,.12);border:1.5px solid #9B7C3A}
.pc-aggressive      {background:rgba(160,58,34,.08);border:1.5px solid #A03A22}
.pc-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(20,40,63,.65);margin-bottom:6px}
.pc-name{font-family:'Newsreader',serif;font-weight:700;font-size:28px;color:var(--paper);margin-bottom:4px}
.pc-tagline{font-family:'Newsreader',serif;font-size:15px;font-style:italic;color:rgba(20,40,63,.75);margin-bottom:14px}
.pc-desc{font-size:13.5px;color:rgba(20,40,63,.7);line-height:1.55}
.score-row{display:flex;gap:0;margin-bottom:18px}
.score-block{flex:1;padding:14px 16px;background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.1);text-align:center}
.score-block:first-child{border-radius:12px 0 0 12px;border-right:none}
.score-block:last-child{border-radius:0 12px 12px 0}
.score-num{font-family:'Newsreader',serif;font-size:30px;font-weight:700;color:var(--gold);display:block}
.score-sub{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.lower-note{font-size:12.5px;color:rgba(20,40,63,.55);background:rgba(20,40,63,.05);border-radius:8px;padding:10px 12px;margin-bottom:18px;border-left:2px solid var(--gold);line-height:1.5}

/* --- term chips --- */
.term{border-bottom:1px dashed rgba(37,87,199,.65);cursor:pointer;position:relative;display:inline}
.term-tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid rgba(37,87,199,.3);box-shadow:0 8px 20px rgba(20,40,63,.14);border-radius:9px;padding:8px 12px;font-size:11.5px;color:rgba(20,40,63,.85);z-index:10;pointer-events:none;width:200px;line-height:1.45;font-style:normal;font-family:'Figtree',sans-serif}
.term.open .term-tip{display:block}

/* --- goal pills on hub screen --- */
.goal-hub{display:flex;flex-direction:column;gap:11px}
.goal-pill{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.13);border-radius:4px 14px 14px 14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.gp-actions{display:flex;gap:6px;flex-shrink:0}
.gp-iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(20,40,63,.16);background:rgba(20,40,63,.04);color:rgba(20,40,63,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:6px;transition:all .15s}
.gp-iconbtn:hover{color:var(--paper);border-color:rgba(20,40,63,.3)}
.gp-iconbtn svg{width:100%;height:100%}
.goal-pill.done{border-color:var(--ok)}
.gp-left .gp-label{font-family:'Newsreader',serif;font-size:15px;color:var(--paper)}
.gp-left .gp-tag{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);margin-top:2px}
.gp-right{font-family:'Newsreader',serif;font-size:16px;color:var(--gold);font-weight:600;text-align:right}
.gp-right .gp-sip{font-size:12px;color:var(--dim);display:block;margin-top:1px}
.add-goal-btn{background:rgba(20,40,63,.06);border:1.5px dashed rgba(20,40,63,.2);border-radius:13px;padding:15px;text-align:center;cursor:pointer;font-size:14px;color:rgba(20,40,63,.55);transition:all .15s}
.add-goal-btn:active{transform:scale(.98)}

/* --- goal type mini grid --- */
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mg{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.13);border-radius:4px 14px 4px 14px;padding:14px;text-align:center;cursor:pointer;transition:all .17s}
.mg:active{transform:scale(.97)}
.mg:hover{border-color:rgba(37,87,199,.35)}
.mg.sel{background:rgba(37,87,199,.16);border-color:var(--gold)}
.mg-icon{width:24px;height:24px;display:block;margin-bottom:8px;color:var(--gold)}
.mg-icon svg{width:100%;height:100%}
.mg-name{font-size:13.5px;font-weight:600;color:var(--paper)}
.mg-note{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:3px}

/* --- plan results --- */
.plan-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
/* "The Case" screen -- identical styling to Door 1, kept in sync by hand
   since each file is a self-contained static page (see build notes). */
.case-cta{margin:26px 0 4px;padding:24px 20px;background:linear-gradient(135deg,rgba(37,87,199,.22),rgba(37,87,199,.06));border:2px solid rgba(37,87,199,.55);border-radius:3px 20px 20px 20px;text-align:center;position:relative;animation:caseCtaPulse 2.2s ease-in-out 3}
@keyframes caseCtaPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,87,199,.35)}50%{box-shadow:0 0 0 10px rgba(37,87,199,0)}}
.case-cta .cta-eyebrow{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-weight:600}
.case-cta .cta-q{font-family:'Newsreader',serif;font-size:19px;color:var(--paper);margin-bottom:16px;line-height:1.35;font-weight:600}
.case-cta button{background:var(--gold);color:#fff;border:none;font-family:'Figtree',sans-serif;font-weight:700;font-size:15.5px;padding:15px 30px;border-radius:3px 12px 12px 12px;cursor:pointer;box-shadow:0 4px 14px rgba(37,87,199,.3);transition:transform .15s ease}
.case-cta button:hover{transform:translateY(-1px)}
.case-cta button:after{content:" →"}
.case-wrap{padding-bottom:20px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.case-hero{padding:8px 0 20px;text-align:center}
.case-eyebrow{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.case-title{font-family:'Newsreader',serif;font-size:23px;color:var(--paper);line-height:1.3;margin-bottom:10px}
.case-sub{font-size:13.5px;color:rgba(20,40,63,.65);line-height:1.55;max-width:44ch;margin:0 auto}
.case-section{background:rgba(20,40,63,.045);border:1px solid rgba(20,40,63,.12);border-radius:2px 16px 16px 16px;padding:20px 18px;margin-bottom:16px}
.case-section h4{font-family:'Newsreader',serif;font-size:17px;color:var(--paper);margin-bottom:6px;line-height:1.3}
.case-section .case-cap{font-size:12.5px;color:rgba(20,40,63,.6);line-height:1.5;margin-bottom:14px}
.race-legend{display:flex;gap:14px;justify-content:center;margin:8px 0 14px;flex-wrap:wrap}
.race-legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(20,40,63,.6);font-family:'Spline Sans Mono',monospace}
.race-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.race-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.race-stat{background:rgba(20,40,63,.05);border-radius:3px 10px 10px 10px;padding:11px 9px;text-align:center}
.race-stat .rs-label{font-family:'Spline Sans Mono',monospace;font-size:9px;letter-spacing:.04em;color:rgba(20,40,63,.5);margin-bottom:5px}
.race-stat .rs-val{font-family:'Newsreader',serif;font-size:16px;font-weight:600}
.case-slider-row{margin:14px 0 6px}
.case-slider-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:rgba(20,40,63,.7);margin-bottom:8px}
.case-slider-label b{color:var(--gold);font-family:'Spline Sans Mono',monospace}
.case-callout{background:rgba(232,151,122,.1);border:1px solid rgba(232,151,122,.3);border-radius:3px 12px 12px 12px;padding:12px 14px;margin-top:10px;font-size:12.5px;line-height:1.5;color:rgba(20,40,63,.85)}
.case-callout.good{background:rgba(143,199,142,.1);border-color:rgba(143,199,142,.3)}
.holdbar-track{display:flex;height:26px;border-radius:3px;overflow:hidden;margin:12px 0 6px}
.holdbar-seg{transition:width .2s ease}
.holdbar-legend{display:flex;justify-content:space-between;font-size:11px;color:rgba(20,40,63,.5);font-family:'Spline Sans Mono',monospace}
.growth-chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:14px 0;font-size:12.5px}
.growth-chain .gc-node{background:rgba(37,87,199,.12);border:1px solid rgba(37,87,199,.3);border-radius:3px 9px 9px 9px;padding:7px 11px;color:rgba(20,40,63,.85)}
.growth-chain .gc-arrow{color:rgba(20,40,63,.35);font-size:14px}
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.compare-card{background:rgba(20,40,63,.05);border-radius:3px 10px 10px 10px;padding:12px}
.compare-card .cc-label{font-family:'Spline Sans Mono',monospace;font-size:9.5px;color:rgba(20,40,63,.5);margin-bottom:5px}
.compare-card .cc-val{font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:var(--paper);margin-bottom:3px}
.compare-card .cc-note{font-size:11px;color:rgba(20,40,63,.5);line-height:1.4}
.case-back-row{padding:16px 0 8px;text-align:center}
.case-back-row button{background:none;border:1px solid rgba(20,40,63,.2);color:rgba(20,40,63,.7);font-family:'Spline Sans Mono',monospace;font-size:12px;padding:10px 20px;border-radius:3px;cursor:pointer}
.term-i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid rgba(20,40,63,.4);color:rgba(20,40,63,.6);font-size:9px;font-family:'Spline Sans Mono',monospace;cursor:pointer;position:relative;margin-left:2px;vertical-align:middle}
.term-i-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid rgba(37,87,199,.3);box-shadow:0 8px 20px rgba(20,40,63,.14);border-radius:9px;padding:9px 12px;font-size:11.5px;color:rgba(20,40,63,.85);z-index:20;pointer-events:none;width:220px;line-height:1.45;font-family:'Figtree',sans-serif;font-weight:400;text-align:left;white-space:normal}
.section-head{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:20px 0 10px}
.goal-row{display:flex;justify-content:space-between;align-items:flex-start;padding:13px 15px;background:rgba(20,40,63,.05);border-radius:3px 13px 13px 13px;margin-bottom:0}
.goal-row-wrap{margin-bottom:10px}
.inst-toggle{font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(20,40,63,.45);padding:8px 15px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.inst-panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
.inst-panel.open{max-height:900px}
/* #bp (growth chart + FD comparison + allocation, on the plan screen) holds

<script>
'use strict';

echarts.registerTheme('goalden', {
  color: ['#2557C7','#8FC79E','#D97757','#5FA875','#E8977A','#14283F'],

});
const chartInstances = {};
function initChart(id, option, optsOverride){
  const dom = document.getElementById(id);
  if(!dom) return null;
  let entry = chartInstances[id];
  if(entry && entry.dom !== dom){ entry.inst.dispose(); entry = null; }
  if(!entry){
    const inst = echarts.init(dom, 'goalden', Object.assign({renderer:'svg'}, optsOverride));
    entry = chartInstances[id] = { inst, dom };
  }
  entry.inst.setOption(option, true);
  return entry.inst;
}
function disposeChart(id){ if(chartInstances[id]){ chartInstances[id].inst.dispose(); delete chartInstances[id]; } }
function deferChartInit(fn){ setTimeout(fn, 0); }

/* =====================================================================
   ENGINE — the shared financial math now lives in goalden-engine.js
   (loaded above), so inflateExpense/realRate/corpusRequired/solveSIP/
   effectiveMonthlyRate/accumulationSchedule are not redefined here.
   ===================================================================== */
// mountainChart() labels each point "Year N" from its raw array index -- feeding it
// accumulationSchedule()'s rows directly (one row per MONTH, since callers pass
// years:yrs*12) mislabels month 109 as "Year 109". Bucket to yearly first.
function yearlyMountainRows(monthlyRows){const rows=[];for(let m=0;m<monthlyRows.length;m+=12){rows.push({closeBal:monthlyRows[Math.min(m+11,monthlyRows.length-1)].closeBal});}return rows}
function drawdownSchedule(opts){const rows=[];let bal=opts.openingCorpus;let w=opts.firstWithdrawal;for(let yr=1;yr<=opts.years;yr++){let close;if(opts.due){const baw=bal-w;close=baw+baw*opts.nominalRate;}else{close=(bal+bal*opts.nominalRate)-w;}rows.push({year:yr,openBal:bal,withdrawal:w,closeBal:Math.max(0,close)});bal=close;w*=(1+opts.inflation);}return rows}

/* =====================================================================
   CONFIG
   ===================================================================== */
const C = {
  IN:{code:'IN',name:'India',sym:'₹',
    d:{inflation:.06,eduInflation:.10,debt:.07,hybrid:.10,equity:.12,postRet:.09,lifeExp:78,fdRate:.065},

    expChips:[25000,50000,75000,100000],feeChips:[50000,100000,200000,500000],

    instruments:[
      {id:'liquid',name:'Savings account / liquid fund',band:{min:.035,max:.06},why:'Emergency fund and near-term goals: capital safety over return'},

    ],
    suitability:{
      liquid:{minY:0,maxY:2,buckets:['conservative','mod_conservative','moderate','mod_aggressive','aggressive']},
      fd:{minY:0,maxY:3,buckets:['conservative','mod_conservative','moderate','mod_aggressive','aggressive']},
      debtfund:{minY:1,maxY:6,buckets:['conservative','mod_conservative','moderate','mod_aggressive','aggressive']},
      hybrid:{minY:3,maxY:99,buckets:['mod_conservative','moderate','mod_aggressive','aggressive']},
      equityindex:{minY:7,maxY:99,buckets:['moderate','mod_aggressive','aggressive']},
      elss:{minY:3,maxY:99,buckets:['moderate','mod_aggressive','aggressive']},
      gold:{minY:3,maxY:99,buckets:['mod_conservative','moderate','mod_aggressive','aggressive']},

    },

      {id:'midcap',name:'Mid Cap Fund',band:{min:.13,max:.15},why:'Higher growth potential than large-cap, meaningfully bumpier ride, needs a 10+ year runway'},
      {id:'smallcap',name:'Small Cap Fund',band:{min:.14,max:.17},why:'The highest-octane mainstream equity category. Drawdowns of 60%+ have happened. Only for a long runway and a strong stomach'},
    ],
    fmt(a,dp){if(dp===undefined)dp=0;const s=a<0?'-':'';a=Math.abs(a);const[i,d]=a.toFixed(dp).split('.');const l3=i.slice(-3),r=i.slice(0,-3);return s+'₹'+(r?r.replace(/\B(?=(\d{2})+(?!\d))/g,',')+',':'')+l3+(dp>0?'.'+d:'')},
    compact(a){const x=Math.abs(a);if(x>=1e7)return'₹'+(x/1e7).toFixed(1)+' Cr';if(x>=1e5)return'₹'+(x/1e5).toFixed(1)+' L';return this.fmt(a)}},
  US:{code:'US',name:'United States',sym:'$',
    d:{inflation:.025,eduInflation:.05,debt:.045,hybrid:.07,equity:.09,postRet:.06,lifeExp:82,fdRate:.04},
    goalInflation:{house:.04,car:.03,wedding:.04,travel:.03},

};

function recommendInstruments(country, horizonYears, bucketId, goalType){
  const cc=C[country];
  const fits=[], excludedForHorizon=[];
  cc.instruments.forEach(inst=>{
    const s=cc.suitability[inst.id];
    if(!s) return;
    if(s.retirementOnly && goalType!=='retirement') return;
    const bucketOk=s.buckets.includes(bucketId);
    const horizonOk=horizonYears>=s.minY && horizonYears<=s.maxY;
    if(bucketOk && horizonOk) fits.push(inst);
    else if(bucketOk && !horizonOk && horizonYears<s.minY) excludedForHorizon.push({inst,neededYears:s.minY});
  });
  let stretch=[];
  if((bucketId==='mod_aggressive'||bucketId==='aggressive') && horizonYears>=10) stretch=cc.stretch;
  return {fits, excludedForHorizon, stretch};
}

// Real historical market data (Sensex + S&P 500 series) and its helpers
// (marketSeries(country), marketName(country), compoundPath,
// marketGrowthPath, rollingWindows, worstWindow, bestWindow) now live in
// goalden-engine.js, loaded above. marketSeries/marketName take `country`
// as an explicit parameter — they no longer read G.country directly.

// ---- Charts for "The Case" screen ----
// A three-line race chart: real market history vs constant-rate gold vs
// constant-rate FD, drawn on the same linear axis on purpose. The
// dramatic late-period separation IS the point being made (compounding
// looks unremarkable for years, then does most of its work very late),
// not a distortion to fix with a log scale.
function raceChart(marketPath, goldPath, fdPath, chartId, h) {
  if(h===undefined) h=150;
  deferChartInit(()=>renderRaceChartOption(chartId, marketPath, goldPath, fdPath));
  return `<div id="${chartId}" class="echart" style="height:${h}px"></div>`;
}
function renderRaceChartOption(chartId, marketPath, goldPath, fdPath){
  const c = cfg();
  initChart(chartId, {
    grid:{left:2,right:2,top:8,bottom:2,containLabel:false},
    xAxis:{type:'category', data:marketPath.map((pt,i)=>i+1), show:false, boundaryGap:false},
    yAxis:{type:'value', show:false, min:0},
    tooltip:{trigger:'axis', formatter(params){
      const m=params.find(p=>p.seriesName==='Market'), g=params.find(p=>p.seriesName==='Gold'), f=params.find(p=>p.seriesName==='Bank FD');
      return `Year ${m.axisValueLabel}<br/>Market: ${c.compact(m.value)}<br/>Gold: ${c.compact(g.value)}<br/>Bank FD: ${c.compact(f.value)}`;
    }},
    series:[
      { name:'Bank FD', type:'line', data:fdPath.map(pt=>pt.v), showSymbol:false, lineStyle:{color:'#E8977A', width:1.5, type:'dashed'}, z:1 },
      { name:'Gold', type:'line', data:goldPath.map(pt=>pt.v), showSymbol:false, lineStyle:{color:'#2557C7', width:1.5, type:'dashed'}, z:2 },
      { name:'Market', type:'line', data:marketPath.map(pt=>pt.v), showSymbol:false, lineStyle:{color:'#8FC79E', width:2.25},
        areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(143,199,158,.35)'},{offset:1,color:'rgba(143,199,158,0)'}]}}, z:3,
        markPoint:{symbol:'circle', symbolSize:7, itemStyle:{color:'#8FC79E'}, label:{show:false}, data:[{coord:[marketPath.length-1, marketPath[marketPath.length-1].v]}]} },
    ],
  });
}
// A single growth-path area chart for the time machine's selected window
// (reuses the mountain-chart visual language already used elsewhere).
function timeMachineChart(path, chartId, h) {
  if(h===undefined) h=110;
  deferChartInit(()=>renderTimeMachineChartOption(chartId, path));
  return `<div id="${chartId}" class="echart" style="height:${h}px"></div>`;
}
function renderTimeMachineChartOption(chartId, path){
  const c = cfg();
  const finalUp = path[path.length-1].v >= path[0].v;
  const lineColor = finalUp ? '#8FC79E' : '#E8977A';
  const fillTop = finalUp ? 'rgba(143,199,158,.4)' : 'rgba(232,151,122,.4)';
  const fillBot = finalUp ? 'rgba(143,199,158,0)' : 'rgba(232,151,122,0)';
  initChart(chartId, {
    grid:{left:2,right:2,top:6,bottom:2,containLabel:false},
    xAxis:{type:'category', data:path.map((pt,i)=>i+1), show:false, boundaryGap:false},
    yAxis:{type:'value', show:false, min:0},
    tooltip:{trigger:'axis', formatter(params){
      const p=params[0];
      return `Year ${p.axisValueLabel}<br/>Value: ${c.compact(p.value)}`;
    }},
    series:[{ type:'line', data:path.map(pt=>pt.v), showSymbol:false, lineStyle:{color:lineColor, width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:fillTop},{offset:1,color:fillBot}]}} }],
  });
}
// The full "risk shrinks with holding period" curve, every year from 1 to
// maxYears in one static chart, with a marker for the currently selected
// point. Shows the whole trend at a glance instead of one number at a time.
// The curve itself is expensive to build (a rollingWindows() pass per
// year), so it's built once on mount; dragging the holding-period slider
// only recomputes the ONE selected year and moves the marker via
// updateRiskShrinkMarker() below, a merge-only setOption that leaves the
// curve series untouched.
function riskShrinkPoints(series, maxYears){
  const points = [];
  for (let yr=1; yr<=maxYears; yr++) {
    const win = rollingWindows(series, yr);
    const losing = win.filter(x=>x.finalMultiple<1).length;
    points.push([yr, 100*losing/win.length]);
  }
  return points;
}
function riskShrinkPctAt(series, selectedYears){
  const win = rollingWindows(series, selectedYears);
  const losing = win.filter(x=>x.finalMultiple<1).length;
  return 100*losing/win.length;
}
function riskShrinkMarkerOption(selectedYears, pct){
  return { id:'risk',
    markLine:{silent:true, symbol:['none','none'], lineStyle:{color:'rgba(20,40,63,.3)', type:'dashed'}, data:[{xAxis:selectedYears}]},
    markPoint:{symbol:'circle', symbolSize:9, itemStyle:{color:'#D97757', borderColor:'var(--ink)', borderWidth:1.5}, label:{show:false}, data:[{coord:[selectedYears, pct]}]},
  };
}
function riskShrinkChart(series, maxYears, chartId, h, selectedYears) {
  if(h===undefined) h=130;
  deferChartInit(()=>renderRiskShrinkChartOption(chartId, series, maxYears, selectedYears));
  return `<div id="${chartId}" class="echart" style="height:${h}px"></div>`;
}
function renderRiskShrinkChartOption(chartId, series, maxYears, selectedYears){
  const points = riskShrinkPoints(series, maxYears);
  const selPct = riskShrinkPctAt(series, selectedYears);
  initChart(chartId, {
    grid:{left:2,right:2,top:8,bottom:2,containLabel:false},
    xAxis:{type:'value', min:1, max:maxYears, show:false},
    yAxis:{type:'value', show:false, min:0, max:100},
    tooltip:{trigger:'axis', formatter(params){
      const p=params.find(pp=>pp.seriesId==='risk')||params[0];
      return `${p.value[0]}-year holds<br/>${p.value[1].toFixed(0)}% ended down`;
    }},
    series:[Object.assign({ id:'risk', type:'line', data:points, showSymbol:false, lineStyle:{color:'#D97757', width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(217,119,87,.35)'},{offset:1,color:'rgba(217,119,87,0)'}]}} },
      riskShrinkMarkerOption(selectedYears, selPct))],
  });
}

function fullSeriesCAGR(series){
  let bal=1; series.forEach(r=>bal*=(1+r.r));
  return Math.pow(bal, 1/series.length)-1;
}
function infoIconD1(text){
  return ' <span class="term-i" data-def="'+text.replace(/"/g,'&quot;')+'">i</span>';
}
function renderTimeMachine(startIdx){
  const c = cfg(), series = marketSeries(G.country);
  const tmYears = Math.min(15, series.length-1);
  const raceAmt = G.country==='US' ? 10000 : 100000;
  const path = marketGrowthPath(series, startIdx, tmYears, raceAmt);
  const finalVal = path[path.length-1].v;
  const worstYearInPath = series.slice(startIdx, startIdx+tmYears).reduce((w,r)=>r.r<w.r?r:w, series[startIdx]);
  const gained = finalVal > raceAmt;
  return timeMachineChart(path, 'case-timemachine') +
    `<div class="case-callout ${gained?'good':''}">
    ${c.compact(raceAmt)} invested at the start of <b>${series[startIdx].y-1}</b>, held ${tmYears} years through a ${(worstYearInPath.r*100).toFixed(0)}% single worst year (${worstYearInPath.y}), became <b style="color:${gained?'#8FC79E':'#E8977A'}">${c.compact(finalVal)}</b> by ${series[startIdx+tmYears-1].y}.
  </div>`;
}
function updateRiskShrinkMarker(selectedYears){
  const entry = chartInstances['case-riskshrink'];
  if(!entry) return;
  const series = marketSeries(G.country);
  const pct = riskShrinkPctAt(series, selectedYears);
  entry.inst.setOption({series:[riskShrinkMarkerOption(selectedYears, pct)]});
}
function renderHoldResult(years){
  const series = marketSeries(G.country);
  const w = rollingWindows(series, years);
  const losing = w.filter(x=>x.finalMultiple<1).length;
  const pct = Math.round(100*losing/w.length);
  const worst = worstWindow(series, years);
  return `<div class="holdbar-track">
    <div class="holdbar-seg" style="width:${100-pct}%;background:#5FA875"></div>
    <div class="holdbar-seg" style="width:${pct}%;background:#D97757"></div>
  </div>
  <div class="holdbar-legend"><span>${100-pct}% ended with more money</span><span>${pct}% ended with less</span></div>
  <div class="case-callout ${pct===0?'good':''}" style="margin-top:12px">
    Across ${w.length} real ${years}-year windows in the data, the worst one still averaged <b style="color:${worst.cagr>0?'#8FC79E':'#E8977A'}">${(worst.cagr*100).toFixed(1)}%/yr</b>${pct===0?', and none of them lost money.':'.'}
  </div>`;
}
function attachCaseHandlers(){
  const tmSlider = document.getElementById('tmSlider');
  const tmResult = document.getElementById('tm-result');
  const tmLabel = document.getElementById('tm-year-label');
  if (tmSlider) {
    const series = marketSeries(G.country);
    tmResult.innerHTML = renderTimeMachine(parseInt(tmSlider.value));
    tmSlider.addEventListener('input', () => {
      const idx = parseInt(tmSlider.value);
      tmLabel.textContent = series[idx].y - 1;
      tmResult.innerHTML = renderTimeMachine(idx);
    });
  }
  const holdSlider = document.getElementById('holdSlider');
  const holdResult = document.getElementById('hold-result');
  const holdLabel = document.getElementById('hold-yrs-label');
  if (holdSlider) {
    holdResult.innerHTML = renderHoldResult(parseInt(holdSlider.value));
    holdSlider.addEventListener('input', () => {
      const yrs = parseInt(holdSlider.value);
      holdLabel.textContent = yrs + (yrs===1?' year':' years');
      holdResult.innerHTML = renderHoldResult(yrs);
      // Fast path: the risk-shrink chart itself never changes (it plots
      // every holding length at once), so only move the marker dot/line
      // to the newly selected point rather than regenerating the SVG.
      updateRiskShrinkMarker(yrs);
    });
  }
  const backBtn2 = document.getElementById('caseBackBtn');
  if (backBtn2) backBtn2.addEventListener('click', () => { G.si = flow().indexOf('plan'); render(); });
  document.querySelectorAll('.term-i').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.term-i-tip').forEach(t=>t.remove());
      const tip = document.createElement('div');
      tip.className = 'term-i-tip';
      tip.textContent = el.dataset.def;
      el.appendChild(tip);
    });
  });
  document.addEventListener('click', () => document.querySelectorAll('.term-i-tip').forEach(t=>t.remove()), {once:true});
}

/* =====================================================================
   CALCULATION
   ===================================================================== */
function scoreBuckets(){
  const cs=G.capA.reduce((s,a)=>s+(a||0),0) + (EMERGENCY_SCORE[G.emergencyStatus]||0);
  const ts=G.tolA.reduce((s,a)=>s+(a||0),0);
  const final=Math.min(cs,ts);
  let b;
  if(final<=8)b='conservative';
  else if(final<=12)b='mod_conservative';
  else if(final<=15)b='moderate';
  else if(final<=18)b='mod_aggressive';
  else b='aggressive';
  return{capScore:cs,tolScore:ts,finalScore:final,bucket:b};
}

function bucketRate(bid){
  const b=BUCKETS[bid]||BUCKETS.moderate,d=cfg().d;
  return b.eq*d.equity+b.de*d.debt+b.hy*d.hybrid;
}

// A real adviser's glide path keeps easing risk UP as horizon lengthens
// well past 7 years — an 8-year goal and a 40-year retirement goal should
// not land on the identical allocation just because both cleared the same
// one-time cutoff. This replaces the old 3-step bucket swap (<=3y forced
// Conservative, <=7y capped at Moderate, >7y fully uncapped forever) with
// a continuous equity ceiling that keeps rising until 18 years.
//
// The five anchor points are not arbitrary: they are pulled directly from
// each named profile's own equity level (Conservative .20, Mod-Conservative
// .35, Moderate .50, Growth-Oriented .70, Aggressive .85), at horizons
// (2, 4, 7, 12, 18) years. That makes the ramp legible in the app's own
// vocabulary: "by year 7 this goal can reach a Moderate-level ceiling, by
// year 18 it can reach the Aggressive ceiling" — rather than an abstract
// number nobody can sanity-check.
//
// Critically, this is a CEILING, never a floor: it only ever pulls a
// goal's equity DOWN toward what a shorter horizon can safely absorb. It
// never pushes anyone past their own stated tolerance just because their
// horizon is long — capacity (time) can justify less risk than tolerance
// allows, never more. That mirrors real suitability practice: you don't
// override a client's stated risk tolerance upward on their behalf.
const HORIZON_CEILING_ANCHORS = [[0,0.05],[2,0.20],[4,0.35],[7,0.50],[12,0.70],[18,0.85]];
function horizonEquityCeiling(years){
  const a=HORIZON_CEILING_ANCHORS;
  if(years>=a[a.length-1][0]) return a[a.length-1][1];
  for(let i=0;i<a.length-1;i++){
    const[y0,c0]=a[i],[y1,c1]=a[i+1];
    if(years<=y1){
      const t=(years-y0)/(y1-y0);
      return c0+t*(c1-c0);
    }
  }
  return a[a.length-1][1];
}
// Returns the full continuous allocation for a goal: the person's own
// tolerance-derived bucket, tilted down toward safer debt/hybrid only as
// far as the horizon ceiling requires. When the ceiling doesn't bind
// (moderate-or-below tolerance past roughly 7 years, any tolerance past
// 18), this returns the base bucket completely unchanged.
function horizonAllocation(baseBucketId,years){
  const base=BUCKETS[baseBucketId]||BUCKETS.moderate;
  const ceiling=horizonEquityCeiling(years);
  const overridden=base.eq>ceiling;
  const eq=Math.min(base.eq,ceiling);
  let de=base.de,hy=base.hy;
  if(overridden){
    // Redistribute the equity given up into debt and hybrid, preserving
    // the base profile's own debt:hybrid ratio rather than inventing a
    // new one.
    const freed=base.eq-eq;
    const deHyTotal=base.de+base.hy;
    const deShare=deHyTotal>0?base.de/deHyTotal:0.75;
    de=base.de+freed*deShare;
    hy=base.hy+freed*(1-deShare);
  }
  return{eq,de,hy,overridden,ceiling,baseBucketId};
}
// For instrument recommendations, which are inherently categorical (a
// named list of funds tagged to named profiles), map the continuous
// allocation back to whichever named profile's own equity level it sits
// closest to. The math above stays exact; this is only for picking which
// fund list to show.
function nearestBucketId(eq){
  let best=BUCKET_ORDER[0],bestDiff=Infinity;
  BUCKET_ORDER.forEach(id=>{
    const diff=Math.abs(BUCKETS[id].eq-eq);
    if(diff<bestDiff){bestDiff=diff;best=id;}
  });
  return best;
}
function blendedRateFromAlloc(alloc){
  const d=cfg().d;
  return alloc.eq*d.equity+alloc.de*d.debt+alloc.hy*d.hybrid;
}
// Turns a single "how much equity" slider into a full eq/de/hy split,
// preserving the base bucket's own debt:hybrid ratio -- same idea as
// horizonAllocation's redistribution, applied on demand for the advanced
// post-goal rate override instead of by horizon.
function allocFromEquityPct(eqPct,baseBucketId){
  const base=BUCKETS[baseBucketId||G.bucket||'moderate'];
  const eq=eqPct/100;
  const deHyTotal=base.de+base.hy;
  const deShare=deHyTotal>0?base.de/deHyTotal:0.75;
  const rest=1-eq;
  return{eq,de:rest*deShare,hy:rest*(1-deShare)};
}

function calcGoal(goal){
  const d=cfg().d,c=cfg();
  // Defensive: bucket is always set by the risk questionnaire before a
  // real user can reach goal creation, but fall back safely rather than
  // crash if this is ever called before that (e.g. a future direct-entry
  // path).
  const alloc=horizonAllocation(G.bucket||'moderate',goal.years);
  const eid=nearestBucketId(alloc.eq); // for instrument-list matching + display naming only
  const overridden=alloc.overridden;
  const rate=blendedRateFromAlloc(alloc);
  let corpus,sip;
  let extra={alloc};
  const mRate=effectiveMonthlyRate(rate);
  if(goal.type==='retirement'){
    const expAtRet=inflateExpense(goal.monthlyExpense*12,[{rate:d.inflation,years:goal.years}],0.75);
    const drawYrs=Math.max(5,d.lifeExp-goal.retireAge);
    const postGoalRate=goal.postGoalAlloc?blendedRateFromAlloc(goal.postGoalAlloc):d.postRet;
    corpus=corpusRequired(realRate(postGoalRate,d.inflation),drawYrs,expAtRet,true);
    // Existing savings assumed to keep compounding at the same blended rate
    // as the new SIP, so existingFV + gapCorpus always equals corpus exactly.
    const existingFV=(goal.existingSavings||0)*Math.pow(1+mRate,goal.years*12);
    const gapCorpus=Math.max(0,corpus-existingFV);
    sip=solveSIP(mRate,goal.years*12,gapCorpus,true);
    extra={...extra,expAtRet,drawYrs,existingFV,gapCorpus,postGoalRate};
  } else if(goal.type==='education'){
    const fee1=inflateExpense(goal.annualFee,[{rate:d.eduInflation,years:goal.years}]);
    const postGoalRate=goal.postGoalAlloc?blendedRateFromAlloc(goal.postGoalAlloc):d.debt;
    corpus=corpusRequired(realRate(postGoalRate,d.eduInflation),goal.duration||4,fee1,true);
    const existingFV=(goal.existingSavings||0)*Math.pow(1+mRate,goal.years*12);
    const gapCorpus=Math.max(0,corpus-existingFV);
    sip=solveSIP(mRate,goal.years*12,gapCorpus,true);
    extra={...extra,existingFV,gapCorpus,postGoalRate};
  } else {
    const inflRate=(c.goalInflation&&c.goalInflation[goal.genSub])||d.inflation;
    const inflated=goal.amount*Math.pow(1+inflRate,goal.years);
    const fvSav=(goal.existingSavings||0)*Math.pow(1+d.debt,goal.years);
    corpus=Math.max(0,inflated-fvSav);
    sip=corpus>0?solveSIP(mRate,goal.years*12,corpus,true):0;
  }
  return{corpus:Math.round(corpus),sip:Math.round(sip),eid,overridden,rate,...extra};
}

function calcEmergency(){
  if(G.emergencyStatus==='full')return{needed:false,sip:0,amount:0,declined:false};
  if(G.emergencyPrioritize===false)return{needed:false,sip:0,amount:0,declined:true};
  const mo=G.monthlyExpense||0;
  const months=G.emergencyStatus==='partial'?3:6;
  const amount=mo*months;
  const sip=Math.round(solveSIP(effectiveMonthlyRate(cfg().d.debt),12,amount,true));
  return{needed:true,sip,amount,months,declined:false};
}

function buildPlan(){
  const emg=calcEmergency();
  const goals=G.goals.map(g=>({...g,...calcGoal(g)}));
  const totalGoalSIP=goals.reduce((s,g)=>s+g.sip,0);
  const totalSIP=(emg.needed?emg.sip:0)+totalGoalSIP;
  const cap=G.monthlyCapacity||0;
  const diff=cap-totalSIP;
  const status=diff>=0?'ok':(diff>=-cap*0.2?'warn':'gap');
  return{emg,goals,totalGoalSIP,totalSIP,diff,status,cap};
}

function renderMountainChartOption(chartId, rows){

  initChart(chartId, {

      const p=params[0];
      return `Year ${p.axisValueLabel}<br/>Balance: ${c.compact(p.value)}`;
    }},
    series:[{ type:'line', data:rows.map(r=>r.closeBal), showSymbol:false, lineStyle:{color:'#2557C7', width:1.5},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(37,87,199,.8)'},{offset:1,color:'rgba(37,87,199,.06)'}]}} }],
  });

// A bare filled shape with no readable numbers isn't information, it's
// decoration. Always show the actual starting/ending amounts, the years
// spanned, and — the thing that actually matters — exactly where the pot
// runs dry if it does, with a real marker, not left for the reader to
// guess from the shape of the line.
function potChart(rows, c, uid){
  if(!rows||!rows.length)return'';
  const chartId = 'chart-pot'+(uid!==undefined?'-'+uid:'');
  deferChartInit(()=>renderPotChartOption(chartId, rows, c));
  return `<div id="${chartId}" class="echart" style="height:134px"></div>`;
}
// Reaching exactly zero AT the final year is the plan working correctly
// (that's what "lasts N years" means); only flag it when the money runs
// out BEFORE that.
function renderPotChartOption(chartId, rows, c){
  const fmt = c ? (v => c.compact(v)) : (v => Math.round(v).toLocaleString());
  const n = rows.length;
  let depletedYear = null;
  for (const r of rows) { if (r.closeBal <= 0) { depletedYear = r.year; break; } }
  const prematureDepletion = depletedYear !== null && depletedYear < n;
  const startVal = rows[0].openBal;
  const endVal = rows[n-1].closeBal;
  const endLabelText = prematureDepletion ? `Runs out, yr ${depletedYear}` : (endVal<=0?'Reaches zero as planned':'Ends at '+fmt(endVal));
  const endLabelColor = prematureDepletion ? '#E8977A' : '#8FC79E';
  initChart(chartId, {
    grid:{left:2,right:2,top:26,bottom:20,containLabel:false},
    xAxis:{type:'category', data:rows.map((r,i)=>'Yr '+(r.year!==undefined?r.year:i+1)), boundaryGap:false,
      axisLabel:{show:true, interval:(idx)=>idx===0||idx===n-1, color:'rgba(20,40,63,.4)', fontSize:8.5},
      axisLine:{show:false}, axisTick:{show:false}, splitLine:{show:false}},
    yAxis:{type:'value', show:false, min:0},
    tooltip:{trigger:'axis', formatter(params){
      const p=params[0];
      return `${p.axisValueLabel}<br/>Balance: ${fmt(p.value)}`;
    }},
    graphic:[{type:'text', left:2, top:2, style:{text:'Starts at '+fmt(startVal), fill:'rgba(20,40,63,.55)', fontSize:9, fontFamily:"'Spline Sans Mono',monospace"}}],
    series:[
      { type:'line', data:rows.map(r=>r.closeBal), showSymbol:false, lineStyle:{color:'#8FC79E', width:1.4},
        areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(61,122,79,.65)'},{offset:1,color:'rgba(61,122,79,.05)'}]}},
        markPoint:{symbol:'circle', symbolSize:7, data:[{coord: prematureDepletion?[depletedYear-1,0]:[n-1,endVal], itemStyle:{color:endLabelColor}}],
          label:{show:true, formatter:()=>endLabelText, position:'top', color:endLabelColor, fontWeight:600, fontFamily:"'Spline Sans Mono',monospace", fontSize:9}} },
    ],
  });
}

function renderScreen(screen){
  if(screen==='country')return renderCountry();
  if(screen.startsWith('cap_'))return renderQGroup('cap',CAP_GROUPS[parseInt(screen.slice(4))]);
  if(screen.startsWith('tol_'))return renderQGroup('tol',TOL_GROUPS[parseInt(screen.slice(4))]);
  if(screen==='profile')return renderProfile();
  if(screen==='budget')return renderBudget();
  if(screen==='emergency')return renderEmergency();
  if(screen==='emergency_choice')return renderEmergencyChoice();

  if(screen==='plan')return renderPlan();

  return '<div>Loading…</div>';
}

function renderQGroup(section,indices){

  const blocks=indices.map((idx,n)=>{
    const q=qs[idx], saved=section==='cap'?G.capA[idx]:G.tolA[idx];
    // The why sentence used to sit under the title on its own dedicated

    // reintroduce the wall of text the batching was meant to cut, so it's
    // tap-to-reveal now via the same .term pattern already used elsewhere

    return `<div class="qgroup-item${n>0?' qgroup-item-sep':''}">

}

  const lower=capScore<tolScore?'capacity':'tolerance';
  const equalNote=capScore===tolScore?'Your financial situation and your comfort with risk are well-aligned.':

    'Your finances are more cautious than your appetite for risk. We protect your financial reality: the lower score wins.':

// Same slider helper as Door 1 — a continuous bar next to every numeric
// field, so a value isn't limited to the handful of preset chips. Chips
// stay underneath as shortcuts, not the only way in.
function sliderBounds(chips, extendFactor, minFloorFactor){
  extendFactor = extendFactor===undefined ? 2.5 : extendFactor;
  minFloorFactor = minFloorFactor===undefined ? 0.3 : minFloorFactor;
  const lo = chips[0]*minFloorFactor, hi = chips[chips.length-1]*extendFactor;
  let raw = hi/200;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw,1))));
  const norm = raw/mag;
  const step = (norm<1.5?1:norm<3.5?2:norm<7.5?5:10)*mag;
  return { min: Math.max(0, Math.round(lo/step)*step), max: Math.round(hi/step)*step, step };
}
function valueSlider(id, value, min, max, step, loLabel, hiLabel){
  return `<div class="value-slider">
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value||min}">
    <div class="value-slider-labels"><span>${loLabel}</span><span>${hiLabel}</span></div>
  </div>`;
}
function syncSliderToValue(sl, v, min, max){ if(sl && v!=null) sl.value = Math.min(max, Math.max(min, v)); }

function instRiskTier(inst){
  // Rough heuristic from the top of the fund's return band, purely for a
  // quick visual read: it is not a substitute for the actual note below,
  // which explains the real reasoning.
  const top=inst.band.max;
  if(top<=0.08) return {cls:'low', label:'Low risk'};
  if(top<=0.12) return {cls:'mod', label:'Moderate risk'};
  return {cls:'high', label:'Higher risk'};
}
function renderInstrumentPanel(rec, overridden, fullBucketName, effectiveBucketName, c, eqPct, years){
  let html='';

  if(overridden){
    html+=`<div class="inst-note warn">Your overall risk profile is <b>${fullBucketName}</b>, but a ${years}-year horizon can only safely absorb about <b>${eqPct}% equity</b>, closest to a <b>${effectiveBucketName}</b> mix. The instruments below are chosen for that scaled-down exposure, not your full profile, on a scale that keeps opening up the longer this goal's horizon is.</div>`;
  }

  if(rec.fits.length){
    html+=`<div class="inst-grid">`+rec.fits.map(inst=>{
      const rt=instRiskTier(inst);
      return `<div class="inst-card">

        <div class="inst-rate"><span class="term" data-def="The illustrative long-run return range for this category. The wider the range, the more its actual yearly result can swing above or below the average.">typically ${(inst.band.min*100).toFixed(1)}&ndash;${(inst.band.max*100).toFixed(1)}%/yr</span></div>
        <div class="inst-why">${inst.why}</div>

  } else {
    html+=`<div class="inst-note">No instrument on this list fits both your profile and this timeframe. Talk to an adviser before this goal gets closer.</div>`;
  }

  if(rec.excludedForHorizon.length){
    html+=`<div class="inst-note">
      <b>Not included, on purpose:</b> ${rec.excludedForHorizon.map(e=>e.inst.name).join(', ')}.
      These normally suit your profile, but they need at least ${Math.max(...rec.excludedForHorizon.map(e=>e.neededYears))} years to ride out a downturn, and this goal does not have that long.
    </div>`;
  }

  if(rec.stretch.length){
    html+=`<div class="inst-note stretch">
      <b>If you want to go further:</b> your profile and this goal's long horizon can support some exposure to
      ${rec.stretch.map(s=>`${s.name} (${(s.band.min*100).toFixed(0)}&ndash;${(s.band.max*100).toFixed(0)}%/yr)`).join(' or ')}.

  }

  return html;

          <div class="gr-chart-card"><div class="gr-chart-cap">Building the pot, ${g.years} yrs</div>${mountainChart(yearlyMountainRows(accRows),i)}</div>
          <div class="gr-chart-card"><div class="gr-chart-cap">Spending it down, ${g.drawYrs} yrs from ${g.retireAge}</div>${potChart(drawRowsChart,c,i)}</div>
        </div>`
      : `<div class="gr-chart-card"><div class="gr-chart-cap">How this goal's pot grows over ${g.years} years</div>${mountainChart(yearlyMountainRows(accRows),i)}</div>`;
    return `<div class="goal-row-wrap">
    <div class="goal-row">
    <div class="gr-left">
      <div class="gr-name">${g.label}</div>
      <div class="gr-meta">${g.years}yr horizon · <span class="term" data-def="The blended rate from your ${bn} mix, ${(rate*100).toFixed(1)}% per year.">${note}</span>${g.existingSavings>0?` · <span class="term" data-def="Assumed to keep compounding at the same ${(rate*100).toFixed(1)}% rate as the new SIP, growing to ${c.compact(g.existingFV)} by the goal date.">${c.compact(g.existingSavings)} already saved</span>`:''}</div>
    </div>
    <div class="gr-right">
      <div class="gr-sip">${c.fmt(sip)}/mo</div>
      <div class="gr-corpus">${c.compact(corpus)} corpus</div>
    </div>
    </div>
    ${chartsHtml}
    <div class="inst-toggle" id="it-${i}">What should this actually be invested in?</div>
    <div class="inst-panel" id="ip-${i}">${renderInstrumentPanel(rec, overridden, b.name, bn, c, eqPct, g.years)}</div>
    ${g.type==='retirement'?ddToggleBlock(g,i,c):(g.type==='education'?eduPhaseToggleBlock(g,i):'')}
    </div>`;
  });

  // Accumulation chart of the total SIP
  const topGoal=plan.goals.length>0?plan.goals[0]:null;
  let chartHtml='', fdCardHtml='';
  if(topGoal&&plan.totalSIP>0){
    const mRate=effectiveMonthlyRate(bucketRate(G.bucket));
    const rows=accumulationSchedule({sip:plan.totalSIP,rate:mRate,periods:topGoal.years*12,due:true,stepUp:0}).rows;
    chartHtml=`<div class="section-head">What your combined SIP builds over ${topGoal.years} years</div>
    <div style="background:rgba(20,40,63,.04);border:1px solid rgba(20,40,63,.1);border-radius:13px;padding:14px 12px 6px;margin-bottom:16px">${mountainChart(yearlyMountainRows(rows),'total')}</div>`;

    // A Fixed Deposit is the one thing almost every saver already knows
    // and already trusts, which makes it the most honest benchmark for
    // "why bother investing at all." Same combined SIP, same number of
    // years, only the destination changes.
    const combinedActual = rows[rows.length-1].closeBal;
    const mFd = effectiveMonthlyRate(cfg().d.fdRate);
    const fdFinal = accumulationSchedule({sip:plan.totalSIP,rate:mFd,periods:topGoal.years*12,due:true,stepUp:0}).finalBalance;
    const fdDiff = combinedActual - fdFinal;
    fdCardHtml=`<div class="alloc-card">
      <div class="section-head" style="margin-top:0">The same ${c.fmt(plan.totalSIP)}/month, in a Fixed Deposit instead</div>
      <div class="gr-note" style="margin-top:0">A typical multi-year bank FD, around ${(cfg().d.fdRate*100).toFixed(1)}%/yr. FD interest is also fully taxed at your income slab every year, unlike long-term equity gains, which this comparison does not even account for.</div>
      <div class="alloc-return-row" style="margin-top:12px">
        <div><div class="alloc-return-label">Your plan</div><div class="alloc-return-value">${c.compact(combinedActual)}</div></div>
        <div><div class="alloc-return-label">Same money in an FD</div><div class="alloc-return-value" style="color:#E8977A">${c.compact(fdFinal)}</div></div>
      </div>
      <div class="gr-note" style="margin-top:10px">Over ${topGoal.years} years, staying in a Fixed Deposit would leave you short by <b style="color:var(--paper)">${c.compact(fdDiff)}</b>, purely from the difference in return.</div>
    </div>`;
  }

  // Your overall risk profile, as an actual allocation and return figure —
  // each goal above already explains its own horizon-scaled tilt away
  // from this; this is the baseline profile itself.
  const baseAlloc=BUCKETS[G.bucket]||BUCKETS.moderate;
  const baseRate=bucketRate(G.bucket);
  const baseReal=realRate(baseRate, cfg().d.inflation);
  const allocCard=`<div class="alloc-card">
    <div class="section-head" style="margin-top:0">Your ${b.name} profile, as an allocation</div>
    <div class="alloc-flex">${allocationDonut(baseAlloc.eq, baseAlloc.de, baseAlloc.hy)}<div class="alloc-legend">${allocationLegend(baseAlloc.eq, baseAlloc.de, baseAlloc.hy)}</div></div>
    <div class="alloc-return-row">
      <div><div class="alloc-return-label">Expected return</div><div class="alloc-return-value">${(baseRate*100).toFixed(1)}%</div></div>
      <div><div class="alloc-return-label">After ${(cfg().d.inflation*100).toFixed(0)}% inflation</div><div class="alloc-return-value" style="color:${baseReal>0?'#8FC79E':'#E8977A'}">${(baseReal*100).toFixed(1)}%</div></div>
    </div>
    <div class="gr-note" style="margin-top:10px">This is your full profile's own mix. Goals with a shorter horizon than your profile can safely support are scaled down individually above, not by changing this baseline.</div>
  </div>`;

  // Gap suggestions
  let gapCard='';
  if(plan.status==='gap'){
    const extYrs=plan.goals[0]?plan.goals[0].years+3:0;
    const mRate=effectiveMonthlyRate(bucketRate(G.bucket));
    const extSip=plan.goals[0]?solveSIP(mRate,extYrs*12,plan.goals[0].corpus,true):0;
    const saving=Math.round(plan.goals[0]?plan.goals[0].sip-extSip:0);
    gapCard=`<div class="gap-card">
    <h4>One way to close the gap</h4>
    <p>Extending your first goal's <span class="term" data-def="How long before you need the money.">horizon</span> by 3 years would reduce that goal's monthly SIP by roughly ${c.fmt(saving)}. Review each goal. Flexible goals like travel can be pushed out; retirement and education usually cannot.</p>
    </div>`;
  }

  const assumpLines=[
    `<b>Equity return:</b> ${(cfg().d.equity*100).toFixed(0)}% · <b>Debt:</b> ${(cfg().d.debt*100).toFixed(0)}% · <b>Hybrid:</b> ${(cfg().d.hybrid*100).toFixed(0)}%`,
    `<b>Your blended rate (${b.name}):</b> ${(bucketRate(G.bucket)*100).toFixed(2)}% per year`,
    `<b>General inflation:</b> ${(cfg().d.inflation*100).toFixed(0)}% · <b>Education inflation:</b> ${(cfg().d.eduInflation*100).toFixed(0)}%`,
    `<b>Horizon scaling:</b> your equity ceiling rises smoothly with each goal's own horizon (roughly 5% at 0yrs, 20% by 2yrs, 35% by 4yrs, 50% by 7yrs, 70% by 12yrs, reaching your full profile's ceiling by 18yrs), never above what your stated risk profile itself allows, only below it for shorter goals.`,
    `<b>Retirement drawdown:</b> 75% of inflated expenses, lasting to age ${cfg().d.lifeExp}.`,
    ...(plan.goals.some(g=>g.existingSavings>0)?[`<b>Existing savings:</b> assumed to stay invested at the same blended rate as each goal's new SIP.`]:[]),
    `<b>None of these are guarantees.</b> These are planning assumptions. Verify with a licensed financial adviser before acting.`
  ].join('<br>');

  return `<div class="plan-scroll">
  ${advisorChipsHTML()}
  <div class="eyebrow" style="padding-top:6px">Your complete plan</div>
  <div class="qtitle" style="margin-bottom:16px">${b.name} investor · ${G.country} plan</div>

  ${plan.emg.needed?`
  <div class="section-head">Priority 1 · Emergency fund</div>
  <div class="goal-row">
    <div class="gr-left"><div class="gr-name">Emergency Fund</div><div class="gr-meta">Build over 12 months · ${plan.emg.months} months of expenses</div></div>
    <div class="gr-right"><div class="gr-sip">${c.fmt(plan.emg.sip)}/mo</div><div class="gr-corpus">${c.compact(plan.emg.amount)} target</div></div>
  </div>`:''}

  ${plan.goals.length>0?`<div class="section-head">${plan.emg.needed?'Priority 2':'Goals'} · Investment goals</div>`:''}
  ${goalRows.join('')}

  <hr class="plan-divider">

  <div class="plan-total ${plan.status}">
    <span class="pt-label">Total needed/month</span>
    <span class="pt-value">${c.fmt(plan.totalSIP)}</span>
  </div>
  <div class="plan-total" style="background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.12)">
    <span class="pt-label">Your savings capacity</span>
    <span class="pt-value">${c.fmt(plan.cap)}</span>
  </div>
  <div class="plan-total ${plan.status}">
    <span class="pt-label">${plan.diff>=0?'Surplus':'Shortfall'}</span>
    <span class="pt-value">${diffSign}${c.fmt(Math.abs(plan.diff))}/mo</span>
  </div>

  ${gapCard}
  ${(chartHtml||fdCardHtml)?`
  <div class="inst-toggle" id="bt">See the growth chart, FD comparison, and allocation</div>
  <div class="inst-panel" id="bp">${chartHtml}${fdCardHtml}${allocCard}</div>` : allocCard}

  <div class="alloc-card" style="text-align:center">
    <div class="section-head" style="margin-top:0">Want the deeper tools?</div>
    <div class="gr-note" style="margin-top:0;margin-bottom:12px">Opens the Lab with this plan's total SIP, savings capacity, and country already filled in, so the Plan Health tab does not make you retype what you just built here.</div>
    <button id="openLabBtn" style="width:100%;background:rgba(37,87,199,.14);border:1px solid rgba(37,87,199,.5);color:var(--gold);border-radius:9px;padding:13px;font-family:'Figtree',sans-serif;font-weight:600;font-size:14px;cursor:pointer">Open this plan in the Lab →</button>
  </div>

  <div class="assump-toggle" id="at">Assumptions used in this plan</div>
  <div class="assump-panel" id="ap"><div class="assump-inner">${assumpLines}</div></div>
  <div class="case-cta"><div class="cta-eyebrow">Before you close this tab</div><div class="cta-q">Why should you trust markets with this money at all, instead of a Fixed Deposit?</div><button id="caseBtn">Show me the actual numbers</button></div>
  <div class="save-row">
    <button class="save-btn" id="exportBtn">${ICONS.download}<span>Save this plan</span></button>
    <button class="save-btn" id="importBtn">${ICONS.upload}<span>Load a saved plan</span></button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
  <div class="save-note">Saves as a small file on your device, since this app does not store anything on its own. Load it again later to pick up exactly where you left off.</div>
  <div class="restart-row"><button id="rb">Start over</button></div>
  </div>`;
}

/* =====================================================================
   RENDER ENGINE
   ===================================================================== */
const stage=document.getElementById('stage');
const progressBar=document.getElementById('progressBar');
const progressLabel=document.getElementById('progressLabel');
const backBtn=document.getElementById('backBtn');
const assumpBtn=document.getElementById('assumpBtn');
function scrollToPanel(panel) {
  let el = panel.parentElement;
  while (el && el !== document.body) {
    if (el.scrollHeight > el.clientHeight + 4) {
      el.scrollTo({ top: panel.offsetTop - el.offsetTop - 12, behavior: 'smooth' });
      return;
    }
    el = el.parentElement;
  }
  window.scrollTo({ top: panel.getBoundingClientRect().top + window.scrollY - 12, behavior: 'smooth' });
}
assumpBtn.addEventListener('click', () => {
  const panel = document.getElementById('ap');
  if (!panel) return;
  panel.classList.add('open');
  setTimeout(() => scrollToPanel(panel), 60);
});

function updateProgress(){
  progressBar.style.width=progressPct()+'%';
  progressLabel.textContent=progressSection();
  const f=flow(),s=f[G.si];
  backBtn.classList.toggle('show',G.si>0&&s!=='plan'&&s!=='case');
  assumpBtn.classList.toggle('show', s==='plan');
}

function go(delta){G.si=Math.max(0,Math.min(flow().length-1,G.si+delta));render();}

/* =====================================================================
   PERSISTENCE + BROWSER BACK
   G lives only in page memory, so a refresh / Back / mobile tab-discard
   used to lose the whole questionnaire mid-way (this is the novice door —
   exactly the user who can't be expected to re-answer 15 screens). Two
   fixes sharing the Lab's localStorage pattern (goalden-lab.html): save G
   on every render and offer an explicit "Resume?" prompt on load — never
   silently restore — and mirror each screen into a history entry so the
   browser Back button walks screens instead of leaving the page.
   ===================================================================== */
const STATE_KEY = 'goaldenD2State';
function persistState(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(G)); }catch(e){} }
function clearSavedState(){ try{ localStorage.removeItem(STATE_KEY); }catch(e){} }
// pushState only when the screen actually changed: same-screen re-renders
// (tapping a questionnaire answer re-renders the group) must not pile up
// duplicate history entries, and a popstate-driven render arrives with the
// hash already matching, so it naturally skips the push.
function syncHistory(){
  const hash='#'+flow()[G.si];
  if(location.hash===hash) return;
  try{ history.pushState({si:G.si},'',hash); }catch(e){}
}

function render(){
  const screen=flow()[G.si];
  const wrap=document.createElement('div');
  wrap.className='screen';
  wrap.innerHTML=renderScreen(screen);
  stage.innerHTML='';
  stage.appendChild(wrap);
  // Forcing a layout read here (rather than deferring the class add to
  // requestAnimationFrame) flushes the browser's style calc with the
  // pre-transition state already applied, so the .active transition still
  // fires correctly without depending on a paint callback -- rAF doesn't
  // reliably fire on a backgrounded/non-composited tab, which would leave
  // the screen permanently stuck at opacity:0.
  void wrap.offsetHeight;
  wrap.classList.add('active');
  updateProgress();
  attach(screen);
  persistState();
  syncHistory();
}

/* =====================================================================
   EVENT HANDLERS
   ===================================================================== */
function attach(screen){
  const nb=document.getElementById('nb');

  // term chips — reveal plain-language definition on tap
  document.querySelectorAll('.term').forEach(el=>{
    if(!el.querySelector('.term-tip')){
      const tip=document.createElement('span');
      tip.className='term-tip';
      tip.textContent=el.dataset.def||'';
      el.appendChild(tip);
    }
    el.addEventListener('click',e=>{e.stopPropagation();el.classList.toggle('open');});
  });
  document.addEventListener('click',()=>{document.querySelectorAll('.term.open').forEach(e=>e.classList.remove('open'));},{once:false});

  if(screen==='country'){
    document.querySelectorAll('[data-country]').forEach(el=>el.addEventListener('click',()=>{G.country=el.dataset.country;render();}));
    nb&&nb.addEventListener('click',()=>go(1));
  }

  if(screen.startsWith('cap_')||screen.startsWith('tol_')){
    document.querySelectorAll('[data-score]').forEach(el=>el.addEventListener('click',()=>{
      const sec=el.dataset.sec,idx=parseInt(el.dataset.idx),score=parseInt(el.dataset.score);
      if(sec==='cap')G.capA[idx]=score; else G.tolA[idx]=score;
      render();
    }));
    nb&&nb.addEventListener('click',()=>go(1));
  }

  if(screen==='profile'){
    nb&&nb.addEventListener('click',()=>go(1));
  }

  if(screen==='budget'){
    const c=cfg();
    const inp=document.getElementById('inp'),err=document.getElementById('err');
    const sl=document.getElementById('sl');
    const b=sliderBounds(c.expChips);
    const set=v=>{G.monthlyCapacity=v;nb.disabled=!v;err.textContent='';};
    inp&&inp.addEventListener('input',()=>{set(parseInt(inp.value)||null);syncSliderToValue(sl,G.monthlyCapacity,b.min,b.max);});
    sl&&sl.addEventListener('input',()=>{inp.value=sl.value;set(parseInt(sl.value));});
    document.querySelectorAll('[data-mc]').forEach(el=>el.addEventListener('click',()=>{inp.value=el.dataset.mc;syncSliderToValue(sl,parseInt(el.dataset.mc),b.min,b.max);set(parseInt(el.dataset.mc));}));
    nb&&nb.addEventListener('click',()=>{
      if(!G.monthlyCapacity){err.textContent='Enter your monthly savings amount.';return;}
      // Emergency-fund sizing needs a monthly-expense figure; this app
      // doesn't ask for one separately in Door 2, so approximate it from
      // savings capacity now that it's actually known.
      if(!G.monthlyExpense) G.monthlyExpense = G.monthlyCapacity;
      go(1);
    });
  }

  if(screen==='emergency'){
    document.querySelectorAll('[data-emg]').forEach(el=>el.addEventListener('click',()=>{
      G.emergencyStatus=el.dataset.emg;
      G.emergencyPrioritize=null; // reset the downstream choice since the status just changed
      render();
    }));
    nb&&nb.addEventListener('click',()=>{
      go(1);
    });
  }

  if(screen==='emergency_choice'){
    document.querySelectorAll('[data-emgpri]').forEach(el=>el.addEventListener('click',()=>{
      G.emergencyPrioritize = el.dataset.emgpri==='yes';
      render();
    }));
    nb&&nb.addEventListener('click',()=>go(1));
  }

  if(screen==='goals_hub'){
    document.getElementById('addGoalBtn')&&document.getElementById('addGoalBtn').addEventListener('click',()=>{
      G.addingGoal=true;G.editingIndex=null;G.draftType=null;G.draftA=null;G.draftB=null;G.draftC=null;G.draftSav=0;
      const f=flow();
      const hubIdx=f.indexOf('goals_hub');
      G.si=hubIdx+1; // now correctly lands on goal_inputs
      render();
    });
    document.querySelectorAll('[data-delete-goal]').forEach(el=>{
      el.addEventListener('click',()=>{
        const idx=parseInt(el.dataset.deleteGoal);
        G.goals.splice(idx,1);
        render();
      });
    });
    document.querySelectorAll('[data-edit-goal]').forEach(el=>{
      el.addEventListener('click',()=>{
        const idx=parseInt(el.dataset.editGoal);
        const g=G.goals[idx];
        G.editingIndex=idx;
        G.addingGoal=true;
        if(g.type==='retirement'){ G.draftType='retirement'; G.draftA=g.monthlyExpense; G.draftB=g.retireAge; G.draftC=g.currentAge||Math.max(18,g.retireAge-g.years); G.draftSav=g.existingSavings||0; }
        else if(g.type==='education'){ G.draftType='education'; G.draftA=g.annualFee; G.draftB=g.years; G.draftSav=g.existingSavings||0; }
        else { G.draftType=g.genSub; G.draftA=g.amount; G.draftB=g.years; G.draftSav=g.existingSavings||0; }
        const f=flow();
        const hubIdx=f.indexOf('goals_hub');
        G.si=hubIdx+2; // skip straight to goal_confirm since the type is already known
        render();
      });
    });
    nb&&nb.addEventListener('click',()=>{
      // jump to plan (last screen)
      G.draftType=null;
      const f=flow();
      G.si=f.indexOf('plan');
      render();
    });
  }

  if(screen==='goal_inputs'){
    document.querySelectorAll('[data-gt]').forEach(el=>el.addEventListener('click',()=>{G.draftType=el.dataset.gt;render();}));
    nb&&nb.addEventListener('click',()=>go(1));
    document.getElementById('cancelBtn')&&document.getElementById('cancelBtn').addEventListener('click',()=>{
      G.addingGoal=false;G.draftType=null;
      const f=flow();
      G.si=f.indexOf('goals_hub');
      render();
    });
  }

  if(screen==='goal_confirm'){
    const c=cfg();
    const inp1=document.getElementById('inp1'),inp2=document.getElementById('inp2'),inp3=document.getElementById('inp3'),inpSav=document.getElementById('inpSav'),err=document.getElementById('err');
    const sl1=document.getElementById('sl1'),sl2=document.getElementById('sl2'),sl3=document.getElementById('sl3'),slSav=document.getElementById('slSav');
    const t=G.draftType;
    const b1 = t==='retirement'?sliderBounds(c.expChips) : t==='education'?sliderBounds(c.feeChips) : sliderBounds(c.amtChips);
    const b2 = t==='retirement'?{min:Math.max(35,(G.draftC||30)+1),max:85} : t==='education'?{min:1,max:22} : {min:1,max:30};
    const bSav = t==='retirement'?sliderBounds(c.amtChips,6,0) : t==='education'?sliderBounds(c.feeChips,10,0) : sliderBounds(c.amtChips,4,0);
    const gate=()=>{nb.disabled=!(G.draftA&&G.draftB&&(G.draftType!=='retirement'||G.draftC));};
    const setA=v=>{G.draftA=v;gate();};
    const setB=v=>{G.draftB=v;gate();};
    const setC=v=>{G.draftC=v;gate();};
    inp1&&inp1.addEventListener('input',()=>{setA(parseInt(inp1.value)||null);syncSliderToValue(sl1,G.draftA,b1.min,b1.max);});
    inp2&&inp2.addEventListener('input',()=>{setB(parseInt(inp2.value)||null);syncSliderToValue(sl2,G.draftB,b2.min,b2.max);});
    inp3&&inp3.addEventListener('input',()=>{setC(parseInt(inp3.value)||null);syncSliderToValue(sl3,G.draftC,18,70);});
    inpSav&&inpSav.addEventListener('input',()=>{G.draftSav=parseInt(inpSav.value)||0;syncSliderToValue(slSav,G.draftSav,0,bSav.max);});
    sl1&&sl1.addEventListener('input',()=>{inp1.value=sl1.value;setA(parseInt(sl1.value));});
    sl2&&sl2.addEventListener('input',()=>{inp2.value=sl2.value;setB(parseInt(sl2.value));});
    sl3&&sl3.addEventListener('input',()=>{inp3.value=sl3.value;setC(parseInt(sl3.value));});
    slSav&&slSav.addEventListener('input',()=>{inpSav.value=slSav.value;G.draftSav=parseInt(slSav.value)||0;});
    document.querySelectorAll('[data-a]').forEach(el=>el.addEventListener('click',()=>{inp1.value=el.dataset.a;syncSliderToValue(sl1,parseInt(el.dataset.a),b1.min,b1.max);setA(parseInt(el.dataset.a));}));
    document.querySelectorAll('[data-b]').forEach(el=>el.addEventListener('click',()=>{inp2.value=el.dataset.b;syncSliderToValue(sl2,parseInt(el.dataset.b),b2.min,b2.max);setB(parseInt(el.dataset.b));}));
    document.querySelectorAll('[data-c]').forEach(el=>el.addEventListener('click',()=>{inp3.value=el.dataset.c;syncSliderToValue(sl3,parseInt(el.dataset.c),18,70);setC(parseInt(el.dataset.c));}));

    nb&&nb.addEventListener('click',()=>{
      if(!G.draftA||!G.draftB||(G.draftType==='retirement'&&!G.draftC)){err.textContent='Please fill in all the fields.';return;}
      const t=G.draftType;
      if(t==='retirement'&&G.draftB<=G.draftC){err.textContent='Retirement age needs to be later than your age today.';return;}
      const type=GOAL_TYPES.find(x=>x.id===t)||{name:t};
      let goal={type:t===('house')?'generic':t,label:type.name,years:G.draftB,genSub:t};
      if(t==='retirement'){goal={type:'retirement',label:'Retirement',retireAge:G.draftB,monthlyExpense:G.draftA,currentAge:G.draftC,years:Math.max(1,G.draftB-G.draftC),existingSavings:G.draftSav||0};}
      else if(t==='education'){goal={type:'education',label:'Education',annualFee:G.draftA,years:G.draftB,duration:4,existingSavings:G.draftSav||0};}
      else{
        goal={type:'generic',label:type.name,amount:G.draftA,years:G.draftB,genSub:t,existingSavings:G.draftSav||0};
      }
      // Carry forward an advanced post-goal allocation override across an
      // edit, as long as the goal is still the same type -- but not across
      // a type change, where the old override would no longer make sense.
      const prevGoal = G.editingIndex!==null ? G.goals[G.editingIndex] : null;
      goal.postGoalAlloc = (prevGoal && prevGoal.type===goal.type) ? (prevGoal.postGoalAlloc||null) : null;
      if(G.editingIndex!==null){ G.goals[G.editingIndex]=goal; }
      else { G.goals.push(goal); }
      G.addingGoal=false;G.editingIndex=null;G.draftType=null;G.draftA=null;G.draftB=null;
      const f=flow();
      G.si=f.indexOf('goals_hub');
      render();
    });

// Browser Back/Forward walks screens. The browser has already moved to the
// previous entry, so render() below sees the hash matching the screen and
// skips its own pushState. Door 2's flow() is dynamic (emergency_choice
// appears only when the fund is partial/missing; goal sub-screens and 'case'
// appear on demand), so an entry naming a vanished screen falls back to
// Back-button behaviour rather than rendering a blank screen.
window.addEventListener('popstate',()=>{
  const name=(location.hash||'').slice(1);
  const idx=flow().indexOf(name);
  if(idx>=0){ G.viewingCase = name==='case'; G.si=idx; render(); }
  else if(G.si>0){ G.si-=1; render(); }
});

  { name:'tol_1', type:'integer', enum:[1,2,3,4], desc:'Tolerance answer 2: market-linked experience (4=7+ years … 1=first time).' },
  { name:'tol_2', type:'integer', enum:[1,2,3,4], desc:'Tolerance answer 3: impact if the money were lost (4=nothing changes … 1=devastating).' },
  { name:'tol_3', type:'integer', enum:[1,2,3,4], desc:'Tolerance answer 4: can they sleep when down 20% (4=comfortably … 1=would sell).' },
