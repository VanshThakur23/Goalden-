// risk-seeking one — same framing as the worksheet's own notes.
function liveCalTable(rf, tanRet, tanVol, aSym, bSym, wTan){
  const levels=[0, 0.5, 1, 1.5, 2];
  return `<div class="live-wc-wrap"><table class="live-wc-table">
    <thead><tr><th>Optimal portfolio</th><th>Risk-free</th><th>Return</th><th>Risk</th></tr></thead>
    <tbody>
    ${levels.map(lev=>{
      const ret=rf + (tanRet-rf)*lev, vol=tanVol*lev;
      return `<tr class="${lev===1?'wc-best':''}"><td>${(lev*100).toFixed(0)}%</td><td>${((1-lev)*100).toFixed(0)}%</td><td>${(ret*100).toFixed(1)}%</td><td>${(vol*100).toFixed(1)}%</td></tr>`;
    }).join('')}
    </tbody>
  </table></div>
  <div class="gr-note" style="margin-top:8px">At 100% optimal portfolio, all money sits in the <b style="color:var(--paper)">${(wTan*100).toFixed(0)}% ${aSym} / ${((1-wTan)*100).toFixed(0)}% ${bSym}</b> mix. Below 100% is <b>lending</b> &ndash; some money parked at the risk-free rate, the safer side. Above 100% is <b>borrowing</b> at the risk-free rate to buy more of the optimal portfolio &ndash; leveraged, for a risk-seeking investor.</div>`;
}
function liveMultiCombinationsTable(frontier, items, rf, currentVol){
  let bestIdx=0, bestSharpe=-Infinity, minVarIdx=0, minVar=Infinity;
  frontier.forEach((p,i)=>{
    const sharpe=p.vol>0?(p.ret-rf)/p.vol:0;
    if(sharpe>bestSharpe){ bestSharpe=sharpe; bestIdx=i; }
    if(p.vol<minVar){ minVar=p.vol; minVarIdx=i; }
  });
  const closestIdx=frontier.reduce((best,p,i)=>Math.abs(p.vol-currentVol)<Math.abs(frontier[best].vol-currentVol)?i:best,0);
  return `<div class="live-wc-wrap"><table class="live-wc-table">
    <thead><tr>${items.map(it=>`<th>${it.symbol}</th>`).join('')}<th>Return</th><th>Risk</th><th>Sharpe</th></tr></thead>
    <tbody>
    ${frontier.map((p,i)=>{
      const sharpe=p.vol>0?(p.ret-rf)/p.vol:0;
      const cls=[i===closestIdx?'wc-current':'', i===bestIdx?'wc-best':''].filter(Boolean).join(' ');
      return `<tr class="${cls}" data-live-multi-pick="${i}">
        ${p.w.map(wi=>`<td>${(wi*100).toFixed(0)}%</td>`).join('')}
        <td>${(p.ret*100).toFixed(1)}%</td>
        <td>${(p.vol*100).toFixed(1)}%${i===minVarIdx?'<span class="live-wc-badge minvar">Min risk</span>':''}</td>
        <td>${sharpe.toFixed(2)}${i===bestIdx?'<span class="live-wc-badge best">Best</span>':''}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

// Plain-language takeaway for the exact-two-instrument case. The chart
// here isn't a sorted risk-ordered frontier (twoAssetFrontier sweeps the
// weight linearly, not risk), so frontierTakeawayHTML's frontier-gap
// interpolation doesn't apply — instead this leans on what actually
// drives the shape of this specific curve: how correlated the two real
// instruments turned out to be, and how far the current mix sits from
// the single best risk/reward trade-off (the tangency point).
// Parallel flashcard treatment to frontierTakeawayHTML() above, for the
// 2-instrument case: same verdict/tiles/action/collapsed-detail shape,
// but built around a single sweepable weight (0-100% of `a`) rather than
// an n-asset weight vector, so its jump action moves L.live.weight
// directly instead of taking an onJump(w) callback.
function liveTwoAssetTakeawayHTML(a, b, c12, currentVol, currentRet, currentSharpe, wTan, tanVol, tanRet, rf, w, wMinVar, retA, volA, retB, volB){
  const pct = v=>(v*100).toFixed(1)+'%';
  const corrWord = c12>0.7?'move together strongly':c12>0.3?'move somewhat together':c12>-0.3?'move mostly independently of each other':'tend to move in opposite directions';
  const corrLine = c12<0.85
    ? `Real prices show <b style="color:var(--paper)">${a.symbol}</b> and <b style="color:var(--paper)">${b.symbol}</b> ${corrWord} (correlation <b style="color:var(--gold)">${c12.toFixed(2)}</b>). That's useful: because they don't move in lockstep, blending them can lower your risk by more than a simple average of the two would suggest.`
    : `Real prices show <b style="color:var(--paper)">${a.symbol}</b> and <b style="color:var(--paper)">${b.symbol}</b> ${corrWord} (correlation <b style="color:var(--gold)">${c12.toFixed(2)}</b>). Because they move together this closely, blending them buys very little risk reduction &ndash; you're mostly just averaging their returns, not diversifying risk away.`;
  const tanSharpe = tanVol>0 ? (tanRet-rf)/tanVol : 0;
  const sharpeGap = tanSharpe - currentSharpe;
  const hasGap = sharpeGap > 0.05;
  const verdictColor = hasGap ? '#D97757' : '#5FA875';
  const verdictText = hasGap
    ? `The best trade-off between risk and reward here is <b style="color:${verdictColor}">${(wTan*100).toFixed(0)}% ${a.symbol}</b> / <b style="color:${verdictColor}">${((1-wTan)*100).toFixed(0)}% ${b.symbol}</b> &ndash; your split earns less reward per unit of risk than that.`
    : `Your split is already close to the best trade-off between risk and reward these two instruments can offer.`;

  let jumpBtn = '';
  if(hasGap){
    frontierJumpHandler = ()=>{ L.live.weight = Math.round(wTan*100); render(); };
    jumpBtn = `<button class="fc-action" data-frontier-jump>Move to the best split &rarr;</button>`;
  }

  // When the best-Sharpe point lands right at one edge of the curve (100%
  // of one instrument, 0% of the other), that's not a rounding artefact
  // -- it means the excluded instrument returned less than the risk-free
  // rate over this exact window, so blending any of it in only drags the
  // mix's Sharpe ratio down. The only way to still profit from it would
  // be to short it, which this app never offers, so "all of one, none of
  // the other" genuinely is the best available combination here. Named
  // explicitly rather than left for someone to wonder why the dot sits
  // in the corner instead of somewhere in the middle.
  const edgeAsset = wTan<=0.001 ? b : wTan>=0.999 ? a : null;
  const otherAsset = edgeAsset===a ? b : a;
  const edgeLine = edgeAsset
    ? `<div style="margin-top:8px">Notice the best-Sharpe point sits right at the edge of the curve, not in the middle. That's because <b style="color:var(--paper)">${otherAsset.symbol}</b> returned less than the ${(rf*100).toFixed(1)}% risk-free rate over this window &ndash; blending any of it in would only pull the mix's Sharpe ratio down, not up. Holding it would only pay off if you could bet against it, which this tool doesn't offer, so 100% ${edgeAsset.symbol} genuinely is the best combination of these two available here.</div>`
    : '';

  const detail = `<div>${corrLine}</div>
  <div style="margin-top:8px">Your mix earns <b style="color:var(--paper)">${pct(currentRet)}</b> a year for <b style="color:var(--paper)">${pct(currentVol)}</b> risk &ndash; Sharpe <b style="color:var(--gold)">${currentSharpe.toFixed(2)}</b>.</div>
  <div style="margin-top:8px">${hasGap
    ? `The single best trade-off between risk and reward here (the <span class="term" data-def="The point on the curve with the highest Sharpe ratio: the mix that earns the most extra return per unit of extra risk, above the risk-free rate. Where the Capital Allocation Line touches the frontier.">tangency point</span>) is <b style="color:var(--gold)">${(wTan*100).toFixed(0)}% ${a.symbol}</b> / <b style="color:var(--gold)">${((1-wTan)*100).toFixed(0)}% ${b.symbol}</b>, earning ${pct(tanRet)} for ${pct(tanVol)} risk (Sharpe ${tanSharpe.toFixed(2)}). Drag the slider toward it, click the dark dot on the chart, or use the button above, to close the gap.`
    : `The single best trade-off between risk and reward these two instruments can offer is ${(wTan*100).toFixed(0)}% ${a.symbol} / ${((1-wTan)*100).toFixed(0)}% ${b.symbol} &ndash; your split is already close to it.`}</div>${edgeLine}`;

  const cfgC = cfg();
  const illustrateAmt = cfgC.code==='IN' ? 100000 : 1000;
  const illustrateYrs = 10;
  const compoundedApprox = currentRet - (currentVol*currentVol)/2;
  const illustrateFv = illustrateAmt*Math.pow(1+compoundedApprox, illustrateYrs);
  const weightLabel = `<b style="color:var(--paper)">${(w*100).toFixed(0)}% ${a.symbol}</b> / <b style="color:var(--paper)">${((1-w)*100).toFixed(0)}% ${b.symbol}</b>`;
  const moneyLine = `<div class="gr-note" style="margin-top:10px">Put <b style="color:var(--paper)">${cfgC.compact(illustrateAmt)}</b> into your current split &ndash; ${weightLabel} &ndash; and leave it for ${illustrateYrs} years: at this mix's compounded rate of <b style="color:var(--gold)">${(compoundedApprox*100).toFixed(1)}%</b>/yr, it would grow to roughly <b style="color:var(--paper)">${cfgC.compact(illustrateFv)}</b>. That uses the compounded figure, not the higher expected-return figure above, because that's closer to what an account statement would actually show.</div>`;

  const minVarRet = portfolioReturn([wMinVar,1-wMinVar],[retA,retB]);
  const minVarVol = Math.sqrt(portfolioVariance([wMinVar,1-wMinVar],[volA,volB],[[1,c12],[c12,1]]));
  const hiIsA = retA >= retB;
  const hiEnd = hiIsA ? {sym:a.symbol, ret:retA, vol:volA} : {sym:b.symbol, ret:retB, vol:volB};
  const rangeLine = `<div class="gr-note" style="margin-top:10px">Moving up the efficient part of this curve, from the lowest-risk mix &ndash; <b style="color:var(--paper)">${(wMinVar*100).toFixed(0)}% ${a.symbol}</b> / <b style="color:var(--paper)">${((1-wMinVar)*100).toFixed(0)}% ${b.symbol}</b>, earning ${pct(minVarRet)} for ${pct(minVarVol)} risk &ndash; up to 100% <b style="color:var(--paper)">${hiEnd.sym}</b>, earning ${pct(hiEnd.ret)} for ${pct(hiEnd.vol)} risk, both return and risk magnify together. Taking more risk on this line always buys more expected return; there's no way to get one without the other.</div>`;

  return `<div class="fcard">
    <div class="fc-verdict" style="color:${verdictColor}">${verdictText}</div>
    <div class="fc-tiles fc-tiles-sm">
      <div class="stat fc-tile"><div class="stat-label">Your return</div><div class="stat-value">${pct(currentRet)}</div></div>
      <div class="stat fc-tile"><div class="stat-label">Your risk</div><div class="stat-value">${pct(currentVol)}</div></div>
      <div class="stat fc-tile"><div class="stat-label">Sharpe ratio</div><div class="stat-value">${currentSharpe.toFixed(2)}</div></div>
    </div>
    <div class="fc-money-tiles">
      <div class="stat fc-money-tile fc-money-in"><div class="stat-label">You put in</div><div class="stat-value">${cfgC.compact(illustrateAmt)}</div></div>
      <div class="stat fc-money-tile fc-money-out"><div class="stat-label">Grows to in ${illustrateYrs} yrs</div><div class="stat-value">${cfgC.compact(illustrateFv)}</div></div>
    </div>
    ${moneyLine}
    ${rangeLine}
    ${jumpBtn}
    ${explainDropdown('Show the full breakdown', detail)}
  </div>`;
}
function liveTwoAssetHTML(items, rfPct){
  const rf=rfPct/100;
  const [a,b]=items;
  const sa=L.live.data[a.key].stats, sb=L.live.data[b.key].stats;
  const {corr}=computeCovarianceMatrix([sa,sb]);
  const c12=corr[0][1];
  const frontier=twoAssetFrontier(sa.annualReturn, sb.annualReturn, sa.annualVol, sb.annualVol, c12);
  const wMinVar=minVarianceWeightTwoAsset(sa.annualVol, sb.annualVol, c12);
  const wTan=tangencyWeightTwoAsset(sa.annualReturn, sb.annualReturn, sa.annualVol, sb.annualVol, c12, rf);
  const tanRet=portfolioReturn([wTan,1-wTan],[sa.annualReturn,sb.annualReturn]);
  const tanVol=Math.sqrt(portfolioVariance([wTan,1-wTan],[sa.annualVol,sb.annualVol],[[1,c12],[c12,1]]));
  const cal=capitalAllocationLine(rf, tanRet, tanVol, 2);
  const w=L.live.weight/100;
  const currentRet=portfolioReturn([w,1-w],[sa.annualReturn,sb.annualReturn]);
  const currentVol=Math.sqrt(portfolioVariance([w,1-w],[sa.annualVol,sb.annualVol],[[1,c12],[c12,1]]));
  const currentSharpe=currentVol>0?(currentRet-rf)/currentVol:0;
  const assetPoints=[
    {label:a.symbol, fullLabel:L.live.data[a.key].label, vol:sa.annualVol, ret:sa.annualReturn},
    {label:b.symbol, fullLabel:L.live.data[b.key].label, vol:sb.annualVol, ret:sb.annualReturn},
  ];
  const compoundedApprox = currentRet - (currentVol*currentVol)/2;
  return `<div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><div class="stat-label">Correlation</div><div class="stat-value">${c12.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-label">Your mix return</div><div class="stat-value">${(currentRet*100).toFixed(1)}%</div></div>
    <div class="stat"><div class="stat-label">Your mix Sharpe</div><div class="stat-value">${currentSharpe.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-label">Compounded equivalent${infoIcon('An approximation of what this mix would actually compound to over time: expected return minus half the variance (μ − σ²/2). Not a substitute for the exact per-instrument compounded figures above, but a quick read on how much the expected-return figure overstates real growth for a mix this volatile.')}</div><div class="stat-value">${(compoundedApprox*100).toFixed(1)}%</div></div>
  </div>
  <div class="card is-primary">
    <h4>${a.symbol} / ${b.symbol}${infoIcon('Every point on the blue curve is one weight split between these two instruments, swept from 100% '+b.symbol+' to 100% '+a.symbol+'. The dashed line is the Capital Allocation Line: the risk-free rate blended with the best-Sharpe (tangency) mix, extended past 100% to show what borrowing at the risk-free rate to lever up would do.')}</h4>
    <div class="cap">Annualised from ${sa.n} and ${sb.n} real daily observations. Higher up is more return, further right is more risk.</div>
    ${liveFrontierChart(frontier, assetPoints, {vol:currentVol,ret:currentRet}, cal, {vol:tanVol,ret:tanRet}, 'live-frontier-echart', onLiveFrontierPick, `${(w*100).toFixed(0)}% ${a.symbol} / ${((1-w)*100).toFixed(0)}% ${b.symbol}`)}
    <div class="gr-note" style="margin-top:10px">${liveTwoAssetTakeawayHTML(a, b, c12, currentVol, currentRet, currentSharpe, wTan, tanVol, tanRet, rf, w, wMinVar, sa.annualReturn, sa.annualVol, sb.annualReturn, sb.annualVol)}</div>
  </div>
  <div class="card">
    <h4>Weight: <b>${(w*100).toFixed(0)}% ${a.symbol}</b> / <b>${((1-w)*100).toFixed(0)}% ${b.symbol}</b></h4>
    <div class="slider-row"><input type="range" min="0" max="100" step="1" value="${L.live.weight}" data-live-weight></div>
    <div class="gr-note" style="margin-top:10px">Best Sharpe ratio at <b style="color:var(--gold)">${(wTan*100).toFixed(0)}% ${a.symbol}</b> &middot; minimum risk at <b style="color:#8FC79E">${(wMinVar*100).toFixed(0)}% ${a.symbol}</b>.</div>
  </div>
  <div class="card">
    <h4>Capital Allocation Line: risk-free + optimal portfolio${infoIcon('Blending the risk-free asset with the single best-Sharpe (tangency) mix of '+a.symbol+' and '+b.symbol+', at five leverage levels from all-cash to 2x.')}</h4>
    ${collapsibleSection('', 'Show the table', liveCalTable(rf, tanRet, tanVol, a.symbol, b.symbol, wTan))}
  </div>
  <div class="card">
    <h4>Every combination${infoIcon('The same weight sweep as the chart above, in table form, 5% at a time — click any row to move the slider there. Sharpe uses the risk-free rate set on the left.')}</h4>
    ${collapsibleSection('', 'Show the table', liveCombinationsTable(frontier.filter((p,i)=>i%5===0), a, b, rf, w))}
  </div>`;
}

function liveMultiAssetHTML(computed, rfPct){
  const rf=rfPct/100;
  const {items, vols, corr, cloud, frontier}=computed;
  const returns=computed.returns;
  const assetPoints=items.map((it,i)=>({vol:vols[i], ret:returns[i], label:it.symbol, fullLabel:L.live.data[it.key].label}));
  let weights=L.live.selectedWeights;
  if(!weights || weights.length!==items.length) weights=items.map(()=>1/items.length);
  const currentPoint={vol:Math.sqrt(portfolioVariance(weights,vols,corr)), ret:portfolioReturn(weights,returns)};
  const currentSharpe=currentPoint.vol>0?(currentPoint.ret-rf)/currentPoint.vol:0;
  const compoundedApprox = currentPoint.ret - (currentPoint.vol*currentPoint.vol)/2;
  const pct=v=>(v*100).toFixed(1)+'%';
  const weightLabel = items.map((it,i)=>`<b style="color:var(--paper)">${(weights[i]*100).toFixed(0)}% ${it.symbol}</b>`).join(' / ');
  const cfgC = cfg();
  const illustrateAmt = cfgC.code==='IN' ? 100000 : 1000;
  const illustrateYrs = 10;
  const illustrateFv = illustrateAmt*Math.pow(1+compoundedApprox, illustrateYrs);
  const moneyLine = `<div class="gr-note" style="margin-top:10px">Put <b style="color:var(--paper)">${cfgC.compact(illustrateAmt)}</b> into your current mix &ndash; ${weightLabel} &ndash; and leave it for ${illustrateYrs} years: at this mix's compounded rate of <b style="color:var(--gold)">${(compoundedApprox*100).toFixed(1)}%</b>/yr, it would grow to roughly <b style="color:var(--paper)">${cfgC.compact(illustrateFv)}</b>. That uses the compounded figure, not the higher expected-return figure above, because that's closer to what an account statement would actually show.</div>`;
  const lowPt = frontier[0];
  const hiPt = frontier.reduce((best,p)=> (!best || p.ret>best.ret) ? p : best, null);
  const rangeLine = (lowPt && hiPt && hiPt.vol > lowPt.vol + 0.0005 && hiPt.ret > lowPt.ret + 0.0005) ? `<div class="gr-note" style="margin-top:10px">Moving up the efficient part of this frontier, from the lowest-risk mix on it &ndash; <b style="color:var(--paper)">${items.map((it,i)=>`${(lowPt.w[i]*100).toFixed(0)}% ${it.symbol}`).join(' / ')}</b>, earning ${pct(lowPt.ret)} for ${pct(lowPt.vol)} risk &ndash; up to the highest-return mix on it &ndash; <b style="color:var(--paper)">${items.map((it,i)=>`${(hiPt.w[i]*100).toFixed(0)}% ${it.symbol}`).join(' / ')}</b>, earning ${pct(hiPt.ret)} for ${pct(hiPt.vol)} risk &ndash; both return and risk magnify together. Taking more risk on this line always buys more expected return; there's no way to get one without the other.</div>` : '';
  return `<div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><div class="stat-label">Instruments</div><div class="stat-value">${items.length}</div></div>
    <div class="stat"><div class="stat-label">Selected mix return</div><div class="stat-value">${(currentPoint.ret*100).toFixed(1)}%</div></div>
    <div class="stat"><div class="stat-label">Selected mix Sharpe</div><div class="stat-value">${currentSharpe.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-label">Compounded equivalent${infoIcon('An approximation of what this mix would actually compound to over time: expected return minus half the variance (μ − σ²/2). A quick read on how much the expected-return figure overstates real growth for a mix this volatile.')}</div><div class="stat-value">${(compoundedApprox*100).toFixed(1)}%</div></div>
  </div>
  <div class="card is-primary">
    <h4>Simulated frontier${infoIcon('With 3 or more instruments there is no single sweepable weight, so this samples 3,000 random weight combinations (seeded, so it repeats identically) and keeps the best-return mix at each risk level — the same technique Build a Portfolio uses.')}</h4>
    <div class="cap">Annualised from real daily prices: ${items.map(it=>it.symbol).join(', ')}. Higher up is more return, further right is more risk &ndash; the blue line is the best you could have done at each risk level, and your orange marker is where this exact mix actually sits.</div>
    ${frontierChart(cloud, frontier, assetPoints, currentPoint, 'live-multi-frontier-echart', onLiveMultiFrontierPick, rf)}
    <div class="gr-note" style="margin-top:10px">${frontierTakeawayHTML(currentPoint, currentSharpe, frontier, onLiveMultiFrontierPick)}</div>
    ${moneyLine}
    ${rangeLine}
  </div>
  <div class="card">
    <h4>Notable combinations${infoIcon('Every distinct risk level the simulation found, best-return mix at each — click any row (or any point on the chart) to adopt that weight split.')}</h4>
    ${collapsibleSection('', 'Show the table', liveMultiCombinationsTable(frontier, items, rf, currentPoint.vol))}
  </div>`;
}

// One row per fetched instrument: the compounded return it actually
// produced, the arithmetic figure the frontier math below uses, risk,
// how many real trading days that's built from, and any data-quality
// flags -- so a held-back or merely-cautioned instrument is explained
// right where someone would look for it, not left as a silent absence
// from the chart.
function liveInstrumentStatsCardHTML(items){
  const withData = items.filter(it=>L.live.data[it.key] && L.live.data[it.key].status==='ready');
  if(!withData.length) return '';
  const rows = withData.map(it=>{
    const d=L.live.data[it.key], s=d.stats, q=s.quality;
    const heldBack = q.level==='unusable' && !L.live.overrides[it.key];
    const cagrDisplay = s.geoAnnual==null ? '&mdash;' : (s.geoAnnual*100).toFixed(1)+'%';
    const flagsHtml = q.flags.length ? `<div class="live-inst-flags">${q.flags.map(f=>
      `<div class="live-flag live-flag-${q.level==='unusable'?'unusable':'caution'}">${f.msg}</div>`).join('')}</div>` : '';
    return `<div class="live-inst-row${heldBack?' live-inst-held':''}">
      <div class="live-inst-top">
        <div class="live-inst-name">${d.label||it.symbol} <span class="cap">${it.symbol}</span></div>
        <div class="live-inst-cagr">${cagrDisplay}<span class="cap"> compounded/yr</span></div>
      </div>
      <div class="live-inst-stats">
        <span>${(s.annualReturn*100).toFixed(1)}% expected/yr</span>
        <span>${(s.annualVol*100).toFixed(1)}% risk</span>
        <span class="cap">${s.n} days &middot; ${s.startDate} to ${s.endDate}</span>
      </div>
      ${flagsHtml}
      ${heldBack ? `<button class="tglbtn" data-live-override="${it.key}" style="margin-top:8px">Use it anyway</button>` : ''}
    </div>`;
  }).join('');
  return rows;
}
function liveOutputHTML(ready, rfPct){
  const items=L.live.items;
  const errored=items.filter(it=>L.live.data[it.key] && L.live.data[it.key].status==='error');
  const loading=items.filter(it=>!L.live.data[it.key] || L.live.data[it.key].status==='loading');
  const errorBanner = errored.length ? `<div class="card"><h4>Couldn't fetch ${errored.length>1?'these':'this'}</h4>
      ${errored.map(it=>`<div class="live-error-box"><b>${L.live.data[it.key].label||it.symbol}:</b> ${L.live.data[it.key].error}</div>`).join('')}
      <div class="cap" style="margin-top:8px">Remove it and try again, or double-check the exact ticker and exchange suffix.</div>
    </div>` : '';
  const instrumentRows = liveInstrumentStatsCardHTML(items);
  const instrumentDropdown = instrumentRows ? `<div class="card">${collapsibleSection('', `What each one did on its own${infoIcon('Total return, dividends reinvested, from real daily prices. The compounded figure is what holding this the entire window actually turned into; the expected-return figure is the average-based number the frontier math below is built from, because portfolio math needs a linearly-combinable figure -- see "Why do you show two different return numbers?" below.')}`, instrumentRows)}</div>` : '';
  if(ready.length<2){
    return errorBanner + `<div class="card live-empty">
      ${loading.length? 'Fetching real prices&hellip;' : 'Add at least two usable instruments on the left to compute a frontier.<br><span class="cap">Two gives the exact closed-form curve from your class exercise; three or more switches to a simulated cloud, same as Build a Portfolio.</span>'}
    </div>` + instrumentDropdown;
  }
  return errorBanner + (ready.length===2 ? liveTwoAssetHTML(ready, rfPct) : liveMultiAssetHTML(liveComputeMulti(), rfPct))
    + instrumentDropdown
    + explainDropdown('Why do you show two different return numbers?', `
      The <b>expected-return</b> figure ((1+average daily move)<sup>trading days per year</sup> &minus; 1) is what the frontier, Sharpe ratio and tangency point below are built from. Mean-variance portfolio math needs a return figure that combines <i>linearly</i> across assets &ndash; a compounded return does not have that property, so the optimiser can't use it. This is also the convention used in the coursework this tool extends (a two-asset frontier worksheet), hand-checked against its own SBI figures (~29.9% return, ~21.3% risk over a comparable window) before being trusted here.<br><br>
      The <b>compounded</b> figure is what actually holding the instrument the whole window would have turned into &ndash; the number a real account statement would show. The two can disagree a lot for a volatile instrument: something that falls 50% then rises 50% averages 0% on the expected-return measure but is actually down 25% compounded. Both numbers are real; they answer different questions, so both are shown rather than picking one and hiding the other.
    `)
    + nextStepCard([{q:'Turn this real-world return into a savings plan.', tab:'retirement'}]);
}

// Rebuilding #tabbarInner from scratch is only safe when the nav's own
// identity actually changed (which tab/country is current) -- render()
// fires on every slider input across the whole app, and a full rebuild
// would blow away any sidebar group the person just opened by hand.
// navKey lets a same-tab, same-country re-render skip the rebuild
// entirely and leave the existing DOM (and its open/closed groups) alone.
let lastNavKey=null;
function renderTabs(){
  const bar=document.getElementById('tabbar');
  if(L.tab==='home'){
    bar.className='tabbar is-home';
    document.getElementById('tabbarInner').innerHTML='';
    lastNavKey=null;
  } else {
    bar.className='tabbar is-slim'+(L.navCollapsed?' nav-collapsed':'');

    if(navKey!==lastNavKey){
      lastNavKey=navKey;
      const current=TABS.find(t=>t.id===L.tab)||{};
      const inner=document.getElementById('tabbarInner');
      inner.innerHTML=`<div class="slim-row">
        <button class="slim-back" data-tab-switch="home">&larr; All tools</button>
        <span class="slim-current">${current.label||''}</span>
      </div>
      <div class="tabs tabs-slim">${TABS.map(t=>
        `<button class="tab${L.tab===t.id?' active':''}" data-tab-switch="${t.id}" title="${t.blurb||''}">${t.icon||''}${t.label}</button>`).join('')}</div>`;
      // Nav buttons live inside #tabbarInner, only rebuilt on an actual nav
      // change -- so it's safe to bind listeners here rather than relying
      // on attach()'s broader, every-render rebind (see attach()'s own
      // comment on why its query is scoped away from this element).
      inner.querySelectorAll('[data-tab-switch]').forEach(el=>el.addEventListener('click',()=>{
        L.tab=el.dataset.tabSwitch;
        try{ localStorage.setItem('goaldenLabLastTab', L.tab); }catch(e){}

      }));

  document.getElementById('countryToggle').innerHTML = Object.values(C).map(c=>
    `<button class="ctbtn${L.country===c.code?' active':''}" data-country="${c.code}">${c.sym} ${c.code}</button>`).join('');

// Applies .is-sticky to the current tool's left panel whenever its own
// output sibling is taller -- that's what gives the sticky panel room to
// travel and unstick again near the end, rather than checking against the
// viewport (a panel taller than the *screen* still sticks fine as long as
// it's shorter than the *output column*, which is the actual constraint;
// gating on viewport height instead left a short viewport's Test Real
// Investments panel un-stuck and scrolling away early, leaving a dead
// gutter beside the much longer output column).
function syncStickyPanels(){
  const panel=document.querySelector('main .grid > .panel');
  const output=document.querySelector('main .grid > .output');
  if(!panel) return;
  panel.classList.toggle('is-sticky', !output || panel.offsetHeight <= output.offsetHeight);
}

function render(){
  renderTabs();
  const main=document.getElementById('main');
  if(L.tab==='home') main.innerHTML=renderHome();
  else if(L.tab==='retirement') main.innerHTML=renderRetirement();
  else if(L.tab==='stepup') main.innerHTML=renderStepUp();
  else if(L.tab==='swp') main.innerHTML=renderSWP();
  else if(L.tab==='fx') main.innerHTML=renderFX();
  else if(L.tab==='joint') main.innerHTML=renderJoint();
  else if(L.tab==='mc') main.innerHTML=renderMC();
  else if(L.tab==='portfolio') main.innerHTML=renderPortfolio();
  else if(L.tab==='livefrontier') main.innerHTML=renderLiveFrontier();
  else if(L.tab==='instruments') main.innerHTML=renderInstruments();
  else if(L.tab==='health') main.innerHTML=renderHealth();
  main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter');
  const tabLabel=L.tab==='home' ? 'Home' : (TABS.find(t=>t.id===L.tab)||{}).label||'';
  document.getElementById('printHeader').innerHTML=
    '<div class="pt">Goalden Lab &middot; '+tabLabel+'</div>'+
    '<div class="ps">'+cfg().name+' &middot; printed '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</div>';
  attach();
  syncStickyPanels();
}

function attach(){
  // Scoped to #main, not document-wide: #tabbarInner's own [data-tab-switch]
  // buttons bind their own listener inside renderTabs(), only on the
  // renders where that DOM is actually rebuilt. Since renderTabs() now
  // skips rebuilding when the tab/country hasn't changed (see lastNavKey),
  // those nav buttons persist across re-renders -- if attach() re-bound
  // them here too on every render(), each stale render would leave behind
  // another listener and a single click would eventually fire render()
  // several times over.
  document.querySelectorAll('#main [data-tab-switch]').forEach(el=>el.addEventListener('click',()=>{
    L.tab=el.dataset.tabSwitch;
    try{ localStorage.setItem('goaldenLabLastTab', L.tab); }catch(e){}
    render();
  }));
  document.querySelectorAll('[data-country]').forEach(el=>el.addEventListener('click',()=>{
    L.country=el.dataset.country;L.instCategory='all';
    // Live Frontier's instrument list is per-country (different tickers,
    // different currency); switching countries mid-session would silently
    // mix INR and USD return series into one "portfolio" with no FX
    // adjustment, so it resets rather than carrying over.
    L.live.items=[]; L.live.data={}; L.live.selectedWeights=null; L.live.search=''; L.live.fundResults=[];
    render();
  }));

  let mcRenderTimer=null;
  document.querySelectorAll('input[type=range][data-k]').forEach(el=>{
    el.addEventListener('input',()=>{
      const k=el.dataset.k, tab=el.dataset.tab||'ret';
      const target = tab==='step'?L.step : tab==='swp'?L.swp : tab==='fx'?L.fx : tab==='joint'?L.joint : tab==='mc'?L.mc : tab==='health'?L.health : L.ret;
      let v=parseFloat(el.value);
      if(k==='shockYear'){ L.ret.shock.year=v; render(); return; }
      if(k==='swpShockYear'){ L.swp.shock.year=v; render(); return; }
      target[k]=v;
      if(tab==='mc'){
        // MC's stats need the full 1000-path simulation to produce — there
        // is no cheap closed-form shortcut like Portfolio has. So instead
        // echo just the slider's own raw value instantly (keeps the drag
        // itself perfectly smooth) and debounce the expensive recompute.
        const lbl=document.querySelector(`[data-mc-label="${k}"]`);
        if(lbl) lbl.textContent = k==='sip' ? cfg().fmt(v) : (k==='years' ? v : v+'%');
        if(mcRenderTimer) clearTimeout(mcRenderTimer);
        mcRenderTimer=setTimeout(()=>{ mcRenderTimer=null; render(); }, 130);
        return;
      }
      render();
    });
  });

  // Keyboard number entry beside every slider — wraps each range input in a
  // flex row with a paired number field. Typing a value and pressing Enter
  // (or blurring) pushes it through the SAME slider input-event handler
  // above, so there is only one place that actually updates state.
  document.querySelectorAll('input[type=range][data-k]').forEach(slider=>{
    if(slider.parentElement.classList.contains('slider-row')) return;
    const row=document.createElement('div');
    row.className='slider-row';
    slider.parentElement.insertBefore(row, slider);
    row.appendChild(slider);
    const num=document.createElement('input');
    num.type='number'; num.className='field-num';
    num.min=slider.min; num.max=slider.max; num.step=slider.step||1;
    num.value=slider.value;
    row.appendChild(num);
    const pushToSlider=()=>{
      let v=parseFloat(num.value);
      if(isNaN(v)) { num.value=slider.value; return; }
      v=Math.max(parseFloat(slider.min), Math.min(parseFloat(slider.max), v));
      slider.value=v; num.value=v;
      // Deferred to the next tick: dispatching synchronously from inside a
      // blur handler can fire the re-render (which replaces this very
      // element's parent) while the browser is still finishing its own
      // blur-related DOM work, causing a "node no longer a child" error.
      setTimeout(()=>{ slider.dispatchEvent(new Event('input',{bubbles:true})); }, 0);
    };
    num.addEventListener('keydown',e=>{ if(e.key==='Enter') pushToSlider(); });
    num.addEventListener('blur',pushToSlider);
    slider.addEventListener('input',()=>{ num.value=slider.value; });
  });

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click',()=>{
      const key=el.dataset.toggle, val=el.dataset.val;
      const parsedVal = val==='true'?true : val==='false'?false : val;
      if(key==='direction'){
        if(parsedVal !== L.fx.direction){
          // Swap home/foreign rates so the defaults stay meaningful for
          // whichever country is now "home" — otherwise a US "home return"
          // silently keeps India's default rate, which is misleading.
          const tmp = L.fx.homeReturn;
          L.fx.homeReturn = L.fx.foreignReturn;
          L.fx.foreignReturn = tmp;
          // Rescale the principal roughly to the new home currency's scale
          // (₹10L ≈ $12K at ~₹83/$) so the number stays realistic rather
          // than showing "$1,000,000" as a default US contribution.
          L.fx.principal = parsedVal==='receivingFromAbroad'
            ? Math.round(L.fx.principal/83/500)*500
            : Math.round(L.fx.principal*83/50000)*50000;
        }
        L.fx.direction=parsedVal;
      }
      else if(key==='regime') L.mc.regime=parsedVal;
      else if(key==='emergencyStatus') L.health.emergencyStatus=parsedVal;
      else if(key==='shockSurvives') L.health.shockSurvives=parsedVal;
      else L.ret[key]=parsedVal;
      render();
    });
  });

  document.querySelectorAll('[data-shock]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.shock;
      if(id==='none'){ L.ret.shock=null; }
      else { L.ret.shock={epId:id, year: L.ret.shock?L.ret.shock.year:5}; }
      render();
    });
  });

  document.querySelectorAll('[data-swpshock]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.swpshock;
      if(id==='none'){ L.swp.shock=null; }
      else { L.swp.shock={epId:id, year: L.swp.shock?L.swp.shock.year:3}; }
      render();
    });
  });

  document.querySelectorAll('input[data-pfinf]').forEach(el=>{
    el.addEventListener('input',()=>{
      L.portfolio.inflation=parseFloat(el.value);
      const lbl=document.getElementById('pf-inf-label'); if(lbl) lbl.textContent=L.portfolio.inflation+'%';
      const num=document.querySelector('input[data-pfinf-num]'); if(num) num.value=el.value;
      // Cheap path only: inflation changes no chart, so no debounce needed.
      updatePortfolioLive();
    });
  });
  document.querySelectorAll('input[data-pfinf-num]').forEach(el=>{
    const push=()=>{
      let v=parseFloat(el.value); if(isNaN(v)){ return; }
      v=Math.max(0, Math.min(12, v));
      const sl=document.querySelector('input[data-pfinf]');
      sl.value=v; el.value=v;
      sl.dispatchEvent(new Event('input',{bubbles:true}));
    };
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') push(); });
    el.addEventListener('blur',push);
  });

  // Mode switch needs a full render, not just a live-patch: the amount
  // slider's min/max/step genuinely change between a lump sum and a
  // monthly SIP amount (e.g. up to 5 crore vs up to 5 lakh), so the
  // slider markup itself has to regenerate, not just its value.
  document.querySelectorAll('.pf-mode-btn').forEach(el=>{
    el.addEventListener('click',()=>{
      L.portfolio.investMode=el.dataset.pfmode;
      L.portfolio.investAmount=null; // reset to the new mode's own sensible default
      render();
    });
  });

  // Invest-in-this-mix: amount and years, same cheap live-patch path as
  // inflation above (pure closed-form compounding, no chart involved).
  document.querySelectorAll('input[data-pfamt]').forEach(el=>{
    el.addEventListener('input',()=>{
      L.portfolio.investAmount=parseFloat(el.value);
      const lbl=document.getElementById('pf-amt-label'); if(lbl) lbl.textContent=cfg().compact(L.portfolio.investAmount);
      const num=document.querySelector('input[data-pfamt-num]'); if(num) num.value=el.value;
      updatePortfolioLive();
    });
  });
  document.querySelectorAll('input[data-pfamt-num]').forEach(el=>{
    const push=()=>{
      let v=parseFloat(el.value); if(isNaN(v)){ return; }
      const b=pfAmountBounds();
      v=Math.max(b.min, Math.min(b.max, v));
      const sl=document.querySelector('input[data-pfamt]');
      sl.value=v; el.value=v;
      sl.dispatchEvent(new Event('input',{bubbles:true}));
    };
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') push(); });
    el.addEventListener('blur',push);
  });
  document.querySelectorAll('input[data-pfyrs]').forEach(el=>{
    el.addEventListener('input',()=>{
      L.portfolio.investYears=parseInt(el.value);
      const lbl=document.getElementById('pf-yrs-label'); if(lbl) lbl.textContent=L.portfolio.investYears;
      const num=document.querySelector('input[data-pfyrs-num]'); if(num) num.value=el.value;
      updatePortfolioLive();
    });
  });
  document.querySelectorAll('input[data-pfyrs-num]').forEach(el=>{
    const push=()=>{
      let v=parseInt(el.value); if(isNaN(v)){ return; }
      v=Math.max(1, Math.min(40, v));
      const sl=document.querySelector('input[data-pfyrs]');
      sl.value=v; el.value=v;
      sl.dispatchEvent(new Event('input',{bubbles:true}));
    };
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') push(); });
    el.addEventListener('blur',push);
  });

  document.getElementById('pfToRetBtn')&&document.getElementById('pfToRetBtn').addEventListener('click',()=>{
    const c=cfg();
    const assets = c.code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
    const corr = c.code==='IN' ? PORTFOLIO_CORR_IN : PORTFOLIO_CORR_US;
    const d = computePortfolioDerived(assets, corr);
    L.ret.preRate=Math.max(4, Math.min(16, Math.round(d.portRet*1000)/10));
    L.tab='retirement';
    render();
  });

  document.getElementById('pfToMCBtn')&&document.getElementById('pfToMCBtn').addEventListener('click',()=>{
    const c=cfg();
    const assets = c.code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
    const corr = c.code==='IN' ? PORTFOLIO_CORR_IN : PORTFOLIO_CORR_US;
    const d = computePortfolioDerived(assets, corr);
    L.mc.meanReturn = Math.max(1, Math.min(25, Math.round(d.portRet*1000)/10));
    L.mc.volatility = Math.max(1, Math.min(40, Math.round(d.decomp.totalVol*1000)/10));
    L.tab='mc';
    render();
  });

  document.querySelectorAll('[data-instcat]').forEach(el=>{
    el.addEventListener('click',()=>{
      L.instCategory=el.dataset.instcat;
      render();
    });
  });

  const isb=document.getElementById('instSearchBox');
  if(isb){
    isb.addEventListener('input',()=>{
      L.instSearch=isb.value;
      // Patch only the cards container: a full render would replace the
      // input mid-keystroke and throw the person's cursor out of the box.
      const el=document.getElementById('inst-cards');
      if(el) el.innerHTML=instrumentCardsHTML();
    });
  }

  document.querySelectorAll('input[data-portidx]').forEach(el=>{
    el.addEventListener('input',()=>{
      const idx=parseInt(el.dataset.portidx);
      const v=parseFloat(el.value);
      L.portfolio.weights[idx]=v;
      // Fast path: patch every asset's % label directly (no DOM
      // regeneration of the panel — that's what keeps the native drag
      // gesture from being interrupted). All 15 need refreshing, not just
      // the one being dragged: moving any one bar renormalizes every
      // other asset's share too, and leaving the other 14 stale mid-drag
      // is exactly what makes the numbers look like they stop adding up.
      // Largest-remainder rounding keeps them summing to exactly 100 on
      // every single tick, not just after release.
      const w = normalizeWeights(L.portfolio.weights);
      const pct = roundPercentsTo100(w);
      pct.forEach((p,i)=>{
        const label = document.querySelector(`[data-pf-label="${i}"]`);
        if(label) label.textContent = p+'%';
      });
      const totalEl = document.getElementById('pf-total-check');
      if(totalEl) totalEl.textContent = pct.reduce((a,b)=>a+b,0)+'%';
      const pairedNum = document.querySelector(`input[data-portidx-num="${idx}"]`);
      if(pairedNum) pairedNum.value = v;
      updatePortfolioLive();
      schedulePortfolioChartUpdate();
    });
  });
  document.querySelectorAll('input[data-portidx-num]').forEach(el=>{
    const commit=()=>{
      const idx=parseInt(el.dataset.portidxNum);
      let v=parseFloat(el.value);
      if(isNaN(v)) v=0;
      v=Math.max(0,Math.min(100,v));
      L.portfolio.weights[idx]=v;
      render();
    };
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); });
    el.addEventListener('blur',()=>{ setTimeout(commit,0); });
  });
  document.getElementById('reseedFrontierBtn')&&document.getElementById('reseedFrontierBtn').addEventListener('click',()=>{
    L.portfolio.seed=Math.floor(Math.random()*100000);
    render();
  });
  document.querySelectorAll('[data-pfpreset]').forEach(el=>{
    el.addEventListener('click',()=>{
      const c=cfg();
      const assets = c.code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
      L.portfolio.weights = portfolioPresetWeights(el.dataset.pfpreset, assets);
      render();
    });
  });
  // A true zero-out, distinct from the Conservative/Balanced/Aggressive/
  // Equal-weight presets above: every asset goes to 0%, no product shown
  // on the map, so the person picks their own mix from a blank slate
  // rather than from a preset. computePortfolioDerived() and
  // roundPercentsTo100() both special-case a literal all-zero vector so
  // it renders as 0% everywhere instead of falling back to equal-weight.
  document.getElementById('pfResetBtn')&&document.getElementById('pfResetBtn').addEventListener('click',()=>{
    const c=cfg();
    const assets = c.code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
    L.portfolio.weights = assets.map(()=>0);
    L.portfolio.show = {cloud:'all', assets:'held'};
    render();
  });
  document.querySelectorAll('[data-pfshow-cloud]').forEach(el=>{
    el.addEventListener('click',()=>{
      L.portfolio.show.cloud = el.dataset.pfshowCloud;
      render();
    });
  });
  document.querySelectorAll('[data-pfshow-assets]').forEach(el=>{
    el.addEventListener('click',()=>{
      L.portfolio.show.assets = el.dataset.pfshowAssets;
      render();
    });
  });
  document.querySelectorAll('[data-live-klass]').forEach(el=>{
    el.addEventListener('click',()=>{
      L.live.klassFilter = el.dataset.liveKlass;
      render();
    });
  });
  document.querySelectorAll('input[data-pfblend]').forEach(el=>{
    el.addEventListener('input',()=>{
      L.portfolio.blendPct = parseFloat(el.value);
      const labelEl=document.getElementById('pf-blend-label'); if(labelEl) labelEl.textContent = L.portfolio.blendPct+'%';
      const c=cfg();
      const assets = c.code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
      const corr = c.code==='IN' ? PORTFOLIO_CORR_IN : PORTFOLIO_CORR_US;
      const blendEl=document.getElementById('pf-blend'); if(blendEl) blendEl.innerHTML=portfolioBlendHTML(computePortfolioDerived(assets, corr), assets, corr);
    });
  });
  document.getElementById('reseedBtn')&&document.getElementById('reseedBtn').addEventListener('click',()=>{
    L.mc.seed = Math.floor(Math.random()*100000);
    render();
  });

  document.getElementById('reseedDDBtn')&&document.getElementById('reseedDDBtn').addEventListener('click',()=>{
    L.ret.ddSeed = Math.floor(Math.random()*100000);
    // Only the drawdown-MC card needs to change; skip the full retirement
    // render and go straight to the debounced patch (delay 0, since a
    // button click isn't a drag that needs settling time).
    scheduleDDMCUpdate(0);
  });

  document.getElementById('saveSnapshotBtn')&&document.getElementById('saveSnapshotBtn').addEventListener('click',()=>{
    if(L.snapshots.length>=2) return;
    const c=cfg(), r=L.ret, res=calcRetLab();
    const rLabel = r.shock ? `with ${c.episodes.find(e=>e.id===r.shock.epId).label}` : (r.realTerms ? "today's money" : 'baseline');
    L.snapshots.push({
      label: 'Snapshot ' + (L.snapshots.length+1),
      corpus: r.realTerms ? res.realCorpus : res.corpus,
      sipDisplay: c.fmt(Math.round(res.sip)),
      summary: `age ${r.age}\u2192${r.retireAge}, ${r.preRate}%/${r.postRate}%, ${rLabel}`,
      currency: c,
    });
    render();
  });
  document.querySelectorAll('[data-remove-snapshot]').forEach(el=>{
    el.addEventListener('click',()=>{
      L.snapshots.splice(parseInt(el.dataset.removeSnapshot),1);
      render();
    });
  });

  document.getElementById('addChildBtn')&&document.getElementById('addChildBtn').addEventListener('click',()=>{
    if(L.joint.children.length<3){
      L.joint.children.push({annualFeeToday:300000, yearsToStart:12, duration:4});
      render();
    }
  });
  document.querySelectorAll('[data-remove-child]').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=parseInt(el.dataset.removeChild);
      L.joint.children.splice(idx,1);
      if(L.joint.editingChild===idx) L.joint.editingChild=null;
      render();
    });
  });
  document.querySelectorAll('[data-edit-child]').forEach(el=>{
    el.addEventListener('click',()=>{
      L.joint.editingChild=parseInt(el.dataset.editChild);
      render();
    });
  });
  document.querySelectorAll('[data-save-child]').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=parseInt(el.dataset.saveChild);
      const fee=parseInt(document.getElementById('editFee').value);
      const start=parseInt(document.getElementById('editStart').value);
      const dur=parseInt(document.getElementById('editDur').value);
      const err=document.getElementById('editChildErr');
      if(!fee||fee<=0){err.textContent='Enter a fee above zero.';return;}
      if(!start||start<1){err.textContent='College needs to start at least a year out.';return;}
      if(!dur||dur<1){err.textContent='Course length needs to be at least a year.';return;}
      L.joint.children[idx]={annualFeeToday:fee, yearsToStart:start, duration:dur};
      L.joint.editingChild=null;
      render();
    });
  });
  document.querySelectorAll('[data-cancel-child]').forEach(el=>{
    el.addEventListener('click',()=>{
      L.joint.editingChild=null;
      render();
    });
  });

  /* --- Live Frontier --- */
  document.querySelectorAll('[data-live-mode]').forEach(el=>el.addEventListener('click',()=>{
    L.live.searchMode=el.dataset.liveMode; L.live.search=''; L.live.fundResults=[]; L.live.fundSearchError=null;
    render();
  }));
  const liveSearchEl=document.getElementById('liveSearchBox');
  if(liveSearchEl){
    liveSearchEl.addEventListener('input',()=>{
      L.live.search=liveSearchEl.value;
      const el=document.getElementById('liveResults');
      if(el){ el.innerHTML=liveEquityResultsHTML(); wireLiveResultButtons(el); }
    });
  }
  let liveFundTimer=null;
  const liveFundSearchEl=document.getElementById('liveFundSearchBox');
  if(liveFundSearchEl){
    liveFundSearchEl.addEventListener('input',()=>{
      L.live.search=liveFundSearchEl.value;
      if(liveFundTimer) clearTimeout(liveFundTimer);
      liveFundTimer=setTimeout(()=>{ liveFundTimer=null; liveRunFundSearch(); }, 350);
    });
  }
  wireLiveResultButtons(document);
  document.querySelectorAll('[data-live-remove]').forEach(el=>{
    el.addEventListener('click',()=>{
      const key=el.dataset.liveRemove;
      L.live.items=L.live.items.filter(it=>it.key!==key);
      delete L.live.data[key];
      if(L.live.selectedWeights && L.live.selectedWeights.length!==L.live.items.length) L.live.selectedWeights=null;
      render();
    });
  });
  // "Use it anyway" on a held-back instrument: an explicit, per-instrument,
  // visible opt-in past a data-quality flag -- never a silent default.
  document.querySelectorAll('[data-live-override]').forEach(el=>{
    el.addEventListener('click',()=>{ L.live.overrides[el.dataset.liveOverride]=true; render(); });
  });
  const liveFreeTextEl=document.getElementById('liveFreeText');
  if(liveFreeTextEl){
    liveFreeTextEl.addEventListener('input',()=>{ L.live.freeText=liveFreeTextEl.value; });
    liveFreeTextEl.addEventListener('keydown',e=>{ if(e.key==='Enter') liveAddFreeText(); });
  }
  document.getElementById('liveFreeAddBtn')&&document.getElementById('liveFreeAddBtn').addEventListener('click',liveAddFreeText);

  let liveRfTimer=null;
  document.querySelectorAll('input[data-live-rf]').forEach(el=>{
    el.addEventListener('input',()=>{
      L.live.rf=parseFloat(el.value);
      if(liveRfTimer) clearTimeout(liveRfTimer);
      liveRfTimer=setTimeout(()=>{ liveRfTimer=null; render(); }, 130);
    });
  });
  let liveWeightTimer=null;
  document.querySelectorAll('input[data-live-weight]').forEach(el=>{
    el.addEventListener('input',()=>{
      L.live.weight=parseInt(el.value);
      if(liveWeightTimer) clearTimeout(liveWeightTimer);
      liveWeightTimer=setTimeout(()=>{ liveWeightTimer=null; render(); }, 90);
    });
  });
  document.querySelectorAll('[data-live-weight-pick]').forEach(el=>{
    el.addEventListener('click',()=>{ L.live.weight=parseInt(el.dataset.liveWeightPick); render(); });
  });
  document.querySelectorAll('[data-live-multi-pick]').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=parseInt(el.dataset.liveMultiPick);
      const {frontier}=liveComputeMulti();
      if(frontier[idx]) L.live.selectedWeights=frontier[idx].w;
      render();
    });
  });
}

// One-time handoff from a finished Door 2 plan, if the user arrived here
// via its "Open this plan in the Lab" button. Read and cleared immediately
// so a later, unrelated visit to the Lab never silently replays a stale
// plan from localStorage -- the button click is the only signal that this
// data is actually meant to apply right now. Returns whether it applied,
// so the landing logic below knows whether it still gets to decide L.tab.
function consumeDoor2Handoff(){
  let raw;
  try{ raw = localStorage.getItem('goaldenLabHandoff'); }catch(e){ return false; }
  if(!raw) return false;
  try{ localStorage.removeItem('goaldenLabHandoff'); }catch(e){}
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return false; }
  if(!data || data._goalden!=='lab-handoff') return false;
  if(data.country==='IN' || data.country==='US') L.country = data.country;
  if(data.totalSIP>0) L.health.totalSIP = Math.min(300000, Math.max(5000, Math.round(data.totalSIP)));
  if(data.capacity>0) L.health.capacity = Math.min(300000, Math.max(5000, Math.round(data.capacity)));
  if(data.emergencyStatus) L.health.emergencyStatus = data.emergencyStatus;
  L.health.fromDoor2Plan = true;
  L.tab = 'health';
  return true;
}

// Landing behaviour: a Door 2 handoff always wins -- it's an explicit,
// one-shot "take me there" signal. Otherwise, if this browser has used
// the Lab before, skip the three-card chooser and reopen whatever tool
// it last used; only a genuinely first-ever visit sees L.tab's default
// of 'home'.
if(!consumeDoor2Handoff()){
  try{
    const last = localStorage.getItem('goaldenLabLastTab');
    if(last==='home' || TABS.some(t=>t.id===last)) L.tab = last;
  }catch(e){}
}
try{ L.navCollapsed = localStorage.getItem('goaldenLabNavCollapsed')==='1'; }catch(e){}
try{ L.panelCollapsed = localStorage.getItem('goaldenLabPanelCollapsed')==='1'; }catch(e){}

document.getElementById('printBtn').addEventListener('click',()=>window.print());
// #navToggleBtn lives outside #tabbarInner (a static sibling in the HTML
// shell), so it survives every renderTabs() rebuild -- bind it once here
// rather than re-binding on every render.
document.getElementById('tabbar').classList.toggle('nav-collapsed', L.navCollapsed);
document.getElementById('navToggleBtn').addEventListener('click',()=>{
  L.navCollapsed = !L.navCollapsed;
  try{ localStorage.setItem('goaldenLabNavCollapsed', L.navCollapsed?'1':'0'); }catch(e){}
  document.getElementById('tabbar').classList.toggle('nav-collapsed', L.navCollapsed);
});
// Frontier flashcard's "Move to the best mix at this risk" button: it is
// re-created via innerHTML on every settle, so this reads the
// module-scoped frontierJumpHandler set by the most recent
// frontierTakeawayHTML() call rather than a listener on the button
// itself, which would already be gone.
document.body.addEventListener('click', e=>{
  const btn = e.target.closest('[data-frontier-jump]');
  if(!btn || !frontierJumpHandler) return;
  frontierJumpHandler();
});
// Delegated once here rather than re-wired after every render(): works
// for any .explain-toggle / .explain-panel pair anywhere in the app,
// present now or added later, with no per-tab wiring needed.
document.body.addEventListener('click', e=>{
  const btn = e.target.closest('[data-reset-tab]');
  if(!btn) return;
  resetTab(btn.dataset.resetTab);
});
// Per-tab panel hide/show (see panelHead() and the .panel-toggle-btn CSS):
// delegated, since panelHead() re-emits this button on every render()
// rather than it being a static shell element like #navToggleBtn.
document.body.addEventListener('click', e=>{
  const btn = e.target.closest('[data-panel-toggle]');
  if(!btn) return;
  L.panelCollapsed = !L.panelCollapsed;
  try{ localStorage.setItem('goaldenLabPanelCollapsed', L.panelCollapsed?'1':'0'); }catch(e){}
  render();
});
document.body.addEventListener('click', e=>{
  const btn = e.target.closest('.explain-toggle');
  if(!btn) return;
  const panel = btn.nextElementSibling;
  if(!panel || !panel.classList.contains('explain-panel')) return;
  btn.classList.toggle('open');
  panel.classList.toggle('open');
});
// Cursor-follow tilt on the Lab home screen's 3 primary tool cards,
// mirroring index.html's own .door treatment (see that file's script) so
// the two "choosing" screens in the app feel like the same surface, while
// every actual calculator tab stays still. Delegated on #main rather than
// bound per-card, since renderHome() tears the whole home screen down and
// rebuilds it via innerHTML on every render() -- a per-element listener
// here would leak exactly like the duplicate-listener hazard documented
// on attach()'s own [data-tab-switch] query.
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  const mainEl = document.getElementById('main');
  let tiltedCard = null;
  const resetTiltedCard = ()=>{
    if(!tiltedCard) return;
    tiltedCard.style.transform = '';
    tiltedCard.classList.remove('tilting');
    const icon = tiltedCard.querySelector('.tc-icon');
    if(icon) icon.style.transform = '';
    tiltedCard = null;
  };
  mainEl.addEventListener('mousemove', e=>{
    const card = e.target.closest('.lab-tool-card');
    if(card !== tiltedCard) resetTiltedCard();
    if(!card) return;
    tiltedCard = card;
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    const rx = (0.5 - py) * 12, ry = (px - 0.5) * 12;
    card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-2px)`;
    card.style.setProperty('--mx', (px * 100) + '%');
    card.style.setProperty('--my', (py * 100) + '%');
    card.classList.add('tilting');
    const icon = card.querySelector('.tc-icon');
    if(icon) icon.style.transform = `translate(${(px - 0.5) * 8}px, ${(py - 0.5) * 8}px) scale(1.05)`;
  });
  mainEl.addEventListener('mouseleave', resetTiltedCard);
}
// Exclusive accordions: opening one Build-a-Portfolio cluster closes the
// others, so the left panel never grows past roughly one cluster's
// worth of content. This is what keeps syncStickyPanels()'s "does it
// fit the viewport" check passing in practice, rather than the sticky
// behaviour technically existing but immediately falling off the moment
// two or three clusters are open. Registered after the generic
// .explain-toggle handler above (same click, later listener), so `btn`
// already reflects its own freshly-toggled open/closed state here.
document.body.addEventListener('click', e=>{
  const btn = e.target.closest('.port-cluster-toggle');
  if(!btn || !btn.classList.contains('open')) return;
  const group = btn.closest('.panel');
  if(!group) return;
  group.querySelectorAll('.port-cluster-toggle.open').forEach(other=>{
    if(other===btn) return;
    other.classList.remove('open');
    const otherPanel = other.nextElementSibling;
    if(otherPanel) otherPanel.classList.remove('open');
  });
  // The .explain-panel max-height transition is .3s; offsetHeight needs
  // to be measured after it settles, or this would use the taller
  // pre-collapse height and wrongly decide the panel no longer fits.
  setTimeout(syncStickyPanels, 320);
});
render();
</script>
