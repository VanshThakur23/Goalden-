<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goalden Lab · full assumption control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Self-hosted, not a CDN: the deployed site's chart rendering should
     not depend on a third party's uptime. Apache ECharts 5.6.0. -->
<script src="vendor/echarts.min.js"></script>
<style>
:root{
  /* White + shades of blue, replacing the original ink-green/gold identity
     (Track C, user-directed repalette). --ink and --paper keep their
     original roles (--ink = dark accent-adjacent text, --paper = primary
     body text) but both now hold dark navy values, since the page itself
     flipped from a dark canvas to a light one -- --bg is the new light
     canvas colour that used to live in --ink. */
  --bg:#F5F8FC; --card:#FFFFFF;
  --ink:#14283F;--ink2:#1B3A63;--paper:#14283F;
  --gold:#2557C7;--red:#A03A22;--dim:#5E7290;--ok:#2E8B6F;--warn:#C99A45;
}
*{margin:0;padding:0;box-sizing:border-box}
/* A flat single-colour canvas is what reads as "dull" at this scale -- a
   very subtle radial falloff (brighter where content actually sits,
   cooling off toward the far edges) gives the page real depth without
   costing any contrast where it matters: text still sits on solid white
   cards, this only affects the canvas showing through the gaps. */
/* Desktop: body is a fixed-height flex column (header, then the shell) so
   the shell's own row can be height-bounded and its two columns can each
   scroll independently -- see .labshell below. Mobile undoes all of this
   back to plain document flow (see the max-width:860px block). */
body{background:radial-gradient(120% 90% at 50% 0%,#FBFDFF 0%,#F5F8FC 45%,#E9F0FA 100%);background-attachment:fixed;color:var(--paper);font-family:'Figtree',system-ui,sans-serif;line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Newsreader',serif;line-height:1.25}
main b,main strong{color:var(--ink2)}
.mono{font-family:'Spline Sans Mono',monospace}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
:is(button,a,input,[tabindex]):focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* --- top nav --- */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid rgba(20,40,63,.12);flex-shrink:0}
.brand{font-family:'Newsreader',serif;font-weight:700;font-size:19px;color:var(--gold);text-decoration:none;display:inline-block}
.brand span{color:var(--paper);font-weight:400;font-style:italic;font-size:13px;margin-left:6px;opacity:.65}
/* Two very different jobs share this space: a first-visit chooser (big,
   unmissable, lives in #main as the home screen) and a quick tool-switcher
   once something is already open. The switcher used to be a horizontal
   pill row -- at 10 tools that meant a scrollbar even at 1400px wide, which
   read as clutter rather than navigation. A vertical sidebar fixes that:
   9 tools stack cleanly in one column with no scrolling and no wrapping,
   and it reads as a map of the Lab rather than a strip of buttons. */
/* Independent dual-pane scroll: .labshell is height-bounded (flex:1 inside
   the fixed-height body above) and both columns stretch to fill that height
   and scroll on their own -- the nav is always fully visible/reachable with
   its own scrollbar, and dragging main's scrollbar no longer drags a sticky
   nav along a "mostly frozen, then catches up" path (the old position:sticky
   approach: the nav's own box was exactly as tall as main via align-self:
   stretch, so a short inner nav stayed pinned for nearly the whole page and
   only moved in one abrupt burst near the bottom -- removed below). */
.labshell{display:flex;align-items:stretch;flex:1;min-height:0;overflow:hidden}
.labshell main{flex:1;min-width:0;overflow-y:auto}
.tabbar{background:linear-gradient(180deg,rgba(37,87,199,.06),rgba(37,87,199,.02));position:relative}
.tabbar.is-home{display:none} /* the home screen itself, in #main, is the chooser */
.tabbar.is-slim{width:228px;flex-shrink:0;border-right:1px solid rgba(37,87,199,.18);padding:22px 14px 24px;transition:width .18s ease,padding .18s ease;overflow-y:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:'Spline Sans Mono',monospace;font-size:11.5px;letter-spacing:.02em;color:rgba(20,40,63,.68);background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.16);border-radius:2px 12px 12px 12px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .1s}
.tab:hover{color:var(--paper);border-color:rgba(37,87,199,.5);background:rgba(20,40,63,.08);transform:translateX(2px)}
.tab.active{color:#fff;background:var(--gold);border-color:var(--gold);font-weight:600}
.slim-row{display:flex;flex-direction:column;gap:2px}
.slim-back{font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(20,40,63,.6);background:transparent;border:none;cursor:pointer;text-align:left;padding:4px 2px 14px;transition:color .15s}
.slim-back:hover{color:var(--gold)}
.slim-current{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(20,40,63,.45);display:block;padding:0 2px 12px}
/* Vertical stack instead of the old horizontal scroller -- full labels,
   no clipping, no scrollbar at any width. */
.tabs-slim{flex-direction:column;flex-wrap:nowrap;gap:3px}
.tabs-slim .tab{font-size:12px;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:8px;width:100%}
.tabs-slim .tab svg{width:14px;height:14px;flex-shrink:0;opacity:.8}
.tabs-slim .tab.active svg{opacity:1}
/* The bold/primary tools (see TABS' primary:true, home.html's own bold
   group) get a visibly heavier row here too -- otherwise "Read the
   Company" sits at the same weight as every other tool in a 15-row list
   and is trivial to scroll past without noticing. */
.tabs-slim .tab.tab-primary{font-weight:700;background:rgba(37,87,199,.07);border-color:rgba(37,87,199,.3);color:rgba(20,40,63,.85)}
.tabs-slim .tab.tab-primary:hover{background:rgba(37,87,199,.13)}
/* Whole-rail collapse: one button toggles the entire "All tools" nav
   between its full width and a slim strip holding just the toggle, so the
   output column can reclaim the space. main{margin:0 auto} then re-centres
   itself for free once the rail shrinks -- no JS needed on that side. The
   button carries a visible text label (not just a 14px icon) because a
   bare icon in the corner of a 228px rail was easy to miss entirely. */
.nav-toggle-btn{width:auto;height:32px;padding:0 12px 0 9px;border-radius:7px;border:1px solid rgba(20,40,63,.2);background:rgba(20,40,63,.03);display:flex;align-items:center;gap:7px;justify-content:center;cursor:pointer;color:rgba(20,40,63,.6);flex-shrink:0;margin-bottom:12px;transition:background .15s,color .15s;font-family:'Spline Sans Mono',monospace;font-size:11px;font-weight:600}
.nav-toggle-btn:hover{background:rgba(37,87,199,.12);color:var(--gold);border-color:rgba(37,87,199,.4)}
.nav-toggle-btn svg{width:14px;height:14px;flex-shrink:0;transition:transform .18s ease}
.nav-toggle-label{white-space:nowrap}
/* min-width:0 overrides the flex item's default min-width:auto, which
   otherwise floors a flex child at its content's min-content width no
   matter what width is specified -- the actual reason this toggle used to
   do nothing visible: the rail was declared 44px wide but the flex layout
   refused to let it shrink past its (much wider) unhidden content. */
.tabbar.is-slim.nav-collapsed{width:44px;min-width:0;padding:22px 8px 24px}
.tabbar.is-slim.nav-collapsed #tabbarInner{display:none}
.tabbar.is-slim.nav-collapsed .nav-toggle-btn{margin:0;width:28px;height:28px;padding:0}
.tabbar.is-slim.nav-collapsed .nav-toggle-btn .nav-toggle-label{display:none}
.tabbar.is-slim.nav-collapsed .nav-toggle-btn svg{transform:rotate(180deg)}
@media(max-width:860px){
  /* Undo the desktop dual-pane scroll entirely -- narrow screens get one
     normal page scroll, nav on top (its own horizontal strip below), main
     content below, exactly as before this change. */
  body{height:auto;overflow:visible;display:block}
  .labshell{flex-direction:column;flex:none;min-height:0;overflow:visible}
  .labshell main{overflow-y:visible}
  .tabbar.is-slim{overflow-y:visible}
  .tabbar.is-slim{width:100%;border-right:none;border-bottom:1px solid rgba(37,87,199,.18);padding:12px 20px}
  .slim-row{flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px}
  .slim-back{padding:4px 0}
  .slim-current{display:none}
  .tabbar.is-slim .explain-panel{max-height:none !important;overflow:visible !important}
  .tabs-slim{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;flex:1;min-width:0}
  .tabs-slim .tab{flex-shrink:0}
  .nav-toggle-btn{display:none} /* narrow screens: no dead gutter to reclaim */
  .tabbar.is-slim.nav-collapsed{width:100%;padding:12px 20px}
  .tabbar.is-slim.nav-collapsed #tabbarInner{display:block}
}
.country-toggle{display:flex;font-family:'Spline Sans Mono',monospace;font-size:11.5px;border:1px solid rgba(20,40,63,.2);border-radius:3px}
.ctbtn{padding:6px 13px;border:none;background:transparent;color:rgba(20,40,63,.55);cursor:pointer}
.ctbtn:first-child{border-right:1px solid rgba(20,40,63,.15)}
.ctbtn.active{background:rgba(37,87,199,.15);color:var(--gold)}

/* --- Lab home: a first-visit chooser, not a permanently-docked bar.
   The 3 primary tools get real card presence (mirrors index.html's own
   .door treatment, so the Lab's front door and its own home screen speak
   the same visual language); the other 7 sit underneath, quiet but one
   click away. Returning visitors skip straight past this -- see the
   localStorage read near consumeDoor2Handoff(). --- */
.lab-home{padding:28px 4px 4px}
.lab-home-head{margin-bottom:24px}
.lab-home-head h2{font-size:27px;margin-bottom:7px}
.lab-home-head .cap{font-size:13px;color:rgba(20,40,63,.6)}
.lab-home-primary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
@media(max-width:860px){.lab-home-primary{grid-template-columns:1fr}}
.lab-tool-card{background:rgba(20,40,63,.04);border:1px solid rgba(20,40,63,.14);border-radius:3px 22px 22px 22px;padding:24px 22px;text-align:left;cursor:pointer;color:inherit;font-family:'Figtree',sans-serif;display:flex;flex-direction:column;transition:all .2s;position:relative;overflow:hidden;will-change:transform}
.lab-tool-card:hover{background:rgba(20,40,63,.07);border-color:rgba(37,87,199,.5);transform:translateY(-2px)}
/* Cursor-follow tilt + glare, mirroring index.html's own .door treatment
   (see attach()'s mousemove delegation below) so the front door and this
   home screen -- the two places in the app that are "choosing", not
   "calculating" -- feel like the same surface. */
.lab-tool-card::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.4),transparent 55%);opacity:0;transition:opacity .25s ease;pointer-events:none}
.lab-tool-card.tilting::after{opacity:1}
.lab-tool-card:nth-child(2){border-radius:22px 3px 22px 22px}
.lab-tool-card:nth-child(3){border-radius:22px 22px 3px 22px}
.tc-icon{width:46px;height:46px;color:#fff;background:var(--gold);border-radius:50% 50% 50% 4px;display:flex;align-items:center;justify-content:center;padding:11px;margin-bottom:14px;box-shadow:0 5px 16px rgba(37,87,199,.25);transition:transform .2s ease-out}
.tc-icon svg{width:100%;height:100%}
.lab-tool-card h3{font-size:18px;margin-bottom:8px;color:var(--paper)}
.tc-blurb{font-size:12.5px;color:rgba(20,40,63,.6);line-height:1.55;flex:1;margin-bottom:14px}
.tc-cta{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--gold);display:flex;align-items:center;gap:5px}
.tc-cta svg{width:12px;height:12px}
.lab-home-secondary-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(37,87,199,.7);margin-bottom:10px}
.lab-home-secondary{display:flex;gap:10px;flex-wrap:wrap}
/* These 7 used to be bare text pills -- no icon, no weight, nothing to
   catch the eye or hint at what each one does. A small coloured icon
   blob (same treatment as the 3 primary cards' .tc-icon, just smaller)
   plus a bold label gives each one a real "gist" at a glance, and the
   native title= tooltip surfaces the same one-line blurb the primary
   cards show inline, without needing the extra vertical space here. */
.lab-tool-chip{display:flex;align-items:center;gap:9px;background:rgba(20,40,63,.045);border:1px solid rgba(20,40,63,.15);border-radius:24px;padding:8px 16px 8px 8px;cursor:pointer;color:inherit;font-family:'Figtree',sans-serif;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.lab-tool-chip:hover{background:rgba(37,87,199,.09);border-color:rgba(37,87,199,.45);transform:translateY(-1px)}
.ltc-icon{width:28px;height:28px;flex-shrink:0;color:#fff;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 3px 8px rgba(37,87,199,.28)}
.ltc-icon svg{width:100%;height:100%}
.ltc-label{font-size:13.5px;font-weight:600;color:var(--paper)}

main{padding:24px 28px 60px;max-width:1180px;margin:0 auto}
main.enter{animation:mainEnter .3s ease-out}
/* opacity-only: this class is added on *every* render(), including every
   keystroke into an assumptions field, not just tab switches. A transform
   here (even a resolving translateY) makes #main a transformed ancestor for
   the .3s of each animation, and a transformed ancestor is a well-known way
   to silently break position:sticky on the panel inside it -- exactly while
   the user is typing into it. Opacity carries the same fade-in feel without
   that side effect. */
@keyframes mainEnter{from{opacity:0}to{opacity:1}}
.grid{display:grid;grid-template-columns:340px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}

/* --- assumption panel --- */
/* A colour-coded left edge marks this as the "controls" column at a
   glance, distinct from the plain .card content boxes in the output
   column -- the same visual language a form or settings rail uses
   elsewhere on the web, applied consistently since every tab shares
   this one class. */
.panel{background:linear-gradient(160deg,rgba(37,87,199,.045),rgba(20,40,63,.03));border:1px solid rgba(20,40,63,.12);border-left:3px solid rgba(37,87,199,.35);border-radius:3px 20px 20px 20px;padding:24px}
/* .grid's align-items:start (above) is what makes this possible: it lets
   the panel's box be shorter than its grid row instead of stretching to
   match the (usually much taller) output column, giving a sticky panel
   real travel distance -- the row itself is always exactly as tall as the
   taller sibling, so even a panel taller than the viewport has room to
   unstick again near the end of the row rather than pinning its bottom
   out of reach forever. Applied via JS (syncStickyPanels(), called at the
   end of render()) rather than unconditionally in CSS only so a future
   tab with a panel genuinely taller than its own output column (nothing
   to travel across) can be exempted the same way. Deliberately not
   solved with max-height+overflow:auto instead: the panel is full of
   infoIcon() tooltips that are absolutely positioned and escape the box,
   and a scroll container would clip them. */
.panel.is-sticky{position:sticky;top:14px}
@media(max-width:860px){.panel.is-sticky{position:static;top:auto}}
/* Shown only for the non-sticky case above (panel taller than its output --
   e.g. Test Real Investments with nothing picked yet, all search/filter UI
   visible). That panel can't sticky without trapping its own bottom out of
   reach, so instead of fighting the height it gets a way back up: a floating
   button that appears once the panel has scrolled past the top of the
   viewport and jumps back to it on click. */
.panel-jump-btn{position:fixed;left:24px;bottom:24px;z-index:60;background:var(--gold);color:#fff;border:none;border-radius:999px;padding:10px 18px 10px 16px;display:flex;align-items:center;gap:6px;font-family:'Spline Sans Mono',monospace;font-size:12px;font-weight:700;box-shadow:0 8px 20px rgba(37,87,199,.35);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}
.panel-jump-btn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.panel-jump-btn:hover{background:#1d47a8}
@media(max-width:860px){.panel-jump-btn{left:16px;bottom:16px;padding:9px 14px 9px 12px;font-size:11px}}
/* Per-tab panel hide/show, same idea as the whole-nav toggle: one button
   collapses this tool's left inputs panel down to a slim strip so the
   output column can reclaim the space, same as the "All tools" rail. The
   toggle button itself (emitted by panelHead(), first child of .panel)
   stays visible; everything else in the panel is hidden. */
.panel-toggle-btn{width:26px;height:26px;border-radius:6px;border:1px solid rgba(20,40,63,.16);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(20,40,63,.5);flex-shrink:0;margin-bottom:12px;transition:background .15s,color .15s}
.panel-toggle-btn:hover{background:rgba(37,87,199,.1);color:var(--gold)}
.panel-toggle-btn svg{width:14px;height:14px;transition:transform .18s ease}
.grid.panel-collapsed{grid-template-columns:44px 1fr;transition:grid-template-columns .18s ease}
.grid.panel-collapsed > .panel{padding:22px 8px}
.grid.panel-collapsed > .panel > *:not(.panel-toggle-btn){display:none}
.grid.panel-collapsed > .panel .panel-toggle-btn{margin-bottom:0}
.grid.panel-collapsed > .panel .panel-toggle-btn svg{transform:rotate(180deg)}
@media(max-width:860px){
  .grid.panel-collapsed{grid-template-columns:1fr}
  .grid.panel-collapsed > .panel{padding:12px 20px}
}
.panel h3{font-size:16px;font-weight:600;color:var(--paper);margin-bottom:16px}
.field{margin-bottom:18px}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1;accent-color:var(--gold);height:20px}
.field-num{width:64px !important;flex-shrink:0;background:rgba(20,40,63,.07);border:1px solid rgba(20,40,63,.2);border-radius:4px;padding:5px 6px;color:var(--paper);font-family:'Spline Sans Mono',monospace;font-size:11.5px;text-align:center}
.field-num::-webkit-outer-spin-button,.field-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field label{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(20,40,63,.6);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.field label b{color:var(--gold);font-weight:600}
.field input[type=range]{width:100%;accent-color:var(--gold);height:20px}
/* Custom slider thumb + track, matching goalden.html / goalden-door2.html.
   Lab has ~40 range inputs across .field/.slider-row/portfolio weights --
   every one of them was previously a bare, untinted OS control. */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(20,40,63,.14)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(20,40,63,.14)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);margin-top:-6px;box-shadow:0 1px 4px rgba(20,40,63,.3);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 1px 4px rgba(20,40,63,.3);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:hover::-moz-range-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22);box-shadow:0 2px 8px rgba(37,87,199,.4)}
input[type=range]:active::-moz-range-thumb{transform:scale(1.22);box-shadow:0 2px 8px rgba(37,87,199,.4)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--gold);outline-offset:2px}
input[type=range]:focus-visible::-moz-range-thumb{outline:2px solid var(--gold);outline-offset:2px}
.field input[type=number]{width:100%;background:rgba(20,40,63,.06);border:1px solid rgba(20,40,63,.16);border-radius:4px;padding:9px 11px;color:var(--paper);font-family:'Spline Sans Mono',monospace;font-size:13px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;gap:1px;margin-bottom:14px;border:1px solid rgba(20,40,63,.18);border-radius:3px;overflow:hidden}
.tglbtn{flex:1;font-family:'Spline Sans Mono',monospace;font-size:10.5px;padding:9px 6px;border:none;border-right:1px solid rgba(20,40,63,.14);background:transparent;color:rgba(20,40,63,.55);cursor:pointer;text-align:center}
.tglbtn:last-child{border-right:none}
.tglbtn.active{background:rgba(37,87,199,.16);color:var(--gold);font-weight:600}
.divider{border:none;border-top:1px dashed rgba(20,40,63,.15);margin:18px 0}
.section-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}

/* --- output area --- */
.output{display:flex;flex-direction:column;gap:18px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
/* A flat 1px border in one uniform grey read as barely-there -- a
   left-edge accent in the same blue as the rest of the app's emphasis
   colour gives every parameter box a clear "read me" edge, and a
   two-stop gradient background (rather than one flat tint) adds a touch
   of real depth instead of a solid fill. */
.stat{background:linear-gradient(135deg,rgba(37,87,199,.07),rgba(20,40,63,.03));border:1px solid rgba(20,40,63,.12);border-left:3px solid rgba(37,87,199,.4);border-radius:3px 15px 15px 15px;padding:17px 18px}
.stat-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-family:'Newsreader',serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--paper)}
.stat-sub{font-size:11.5px;color:rgba(20,40,63,.5);margin-top:4px}
.card{background:rgba(20,40,63,.04);border:1px solid rgba(20,40,63,.13);border-radius:2px 2px 18px 18px;padding:22px}
.card h4{font-size:15px;font-weight:600;margin-bottom:4px;color:var(--paper)}
.card .cap{font-size:12px;color:rgba(20,40,63,.5);margin-bottom:14px}
/* One .is-primary per tab: the card that IS the point of the screen (the
   map on Build a Portfolio, the mix output on Test Real Investments) gets
   lifted to solid white against the tinted default cards around it, so
   the eye finds it first without reading any of the copy. A gradient
   (bright where the chart sits, cooling toward the card's own edges)
   plus a solid accent top border and a stronger shadow give it real
   presence instead of just a slightly-paler background. */
.card.is-primary{position:relative;background:radial-gradient(140% 100% at 50% 0%,#FFFFFF 0%,#FBFDFF 55%,#F2F7FE 100%);border-color:rgba(37,87,199,.32);border-top:3px solid var(--gold);border-radius:0 2px 18px 18px;box-shadow:0 8px 28px rgba(20,40,63,.09),0 1px 0 rgba(37,87,199,.15);padding-top:20px}
.card.is-primary h4{font-size:17px;font-weight:600;position:relative;padding-left:13px}
/* A small colour bar ahead of the heading marks this specific card as the
   one worth reading first, echoing the same accent used on the panel's
   own left edge -- reserved for the single .is-primary card per tab so
   it stays a signal, not decoration repeated on every card. */
.card.is-primary h4::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--gold)}

/* Wayfinding footer: one or two suggested next tools, at the bottom of
   every tab, so a person never has to guess "what do I do with this
   number now". Plain data-tab-switch buttons -- attach()'s #main-scoped
   listener already binds these on every render, no extra wiring needed. */
.next-step-card{margin-top:4px}
.ns-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(20,40,63,.4);margin-bottom:10px}
.ns-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:rgba(37,87,199,.06);border:1px solid rgba(37,87,199,.22);border-radius:8px;padding:12px 14px;font-family:'Figtree',sans-serif;font-size:13px;color:var(--ink);cursor:pointer;transition:background .15s ease,border-color .15s ease}
.ns-btn:hover{background:rgba(37,87,199,.13);border-color:rgba(37,87,199,.4)}
.ns-btn + .ns-btn{margin-top:8px}
.ns-btn svg{width:14px;height:14px;flex-shrink:0;color:var(--gold)}

.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}
.panel-head h3{margin-bottom:0;position:relative;padding-left:13px}
.panel-head h3::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--gold)}
.reset-tab-btn{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:rgba(20,40,63,.4);background:transparent;border:1px solid rgba(20,40,63,.15);border-radius:20px;padding:4px 10px;cursor:pointer;flex-shrink:0}
.reset-tab-btn:hover{color:var(--gold);border-color:rgba(37,87,199,.4)}

/* --- table --- */
.dtable{width:100%;border-collapse:collapse;font-family:'Spline Sans Mono',monospace;font-size:11.5px}
.dtable th{text-align:right;padding:7px 8px;color:var(--dim);font-weight:600;border-bottom:2px solid rgba(37,87,199,.25);position:sticky;top:0;background:var(--bg)}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable td{text-align:right;padding:6px 8px;color:rgba(20,40,63,.75);border-bottom:1px solid rgba(20,40,63,.06)}
/* Alternating row tint -- a wall of identically-white rows is where a
   dense number table stops being scannable; this is the smallest
   possible change that fixes that. */
.dtable tbody tr:nth-child(even):not(.shock):not(.negative) td{background:rgba(37,87,199,.035)}
.dtable tr.shock td{background:rgba(160,58,34,.18);color:#7A2517}
.dtable tr.negative td{color:#E8977A}
.table-scroll{max-height:340px;overflow-y:auto;border-radius:10px}

/* --- episode chips --- */
.episode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.inst-header{margin-bottom:20px}
.inst-source{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);margin-top:10px}
.inst-cat-block{margin-bottom:26px}
.inst-cat-head{font-family:'Newsreader',serif;font-size:17px;color:var(--paper);margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.inst-cat-count{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);font-weight:400}
.lab-inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lab-inst-card{background:rgba(20,40,63,.04);border:1px solid rgba(20,40,63,.1);border-radius:3px 12px 12px 12px;padding:13px 14px}
.lab-inst-name{font-family:'Newsreader',serif;font-size:14px;color:var(--paper);line-height:1.3;margin-bottom:4px}
.lab-inst-rate{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--gold);margin-bottom:6px}
.lab-inst-note{font-size:11.5px;color:rgba(20,40,63,.55);line-height:1.5}
.lab-inst-flag{display:inline-block;font-family:'Spline Sans Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;margin-bottom:6px}
.lab-inst-card.flag-avoid{border-color:rgba(160,58,34,.4)}
.lab-inst-card.flag-avoid .lab-inst-flag{background:rgba(160,58,34,.2);color:#7A2517}
.lab-inst-card.flag-legacy{border-color:rgba(20,40,63,.15);opacity:.75}
.lab-inst-card.flag-legacy .lab-inst-flag{background:rgba(20,40,63,.08);color:rgba(20,40,63,.6)}
.lab-inst-card.flag-check .lab-inst-flag{background:rgba(37,87,199,.18);color:var(--gold)}

/* --- efficient frontier chart --- */
.fx-chart-wrap{position:relative}
.echart{width:100%}
.fx-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:11px;color:rgba(20,40,63,.55)}
.fx-legend span{display:flex;align-items:center;gap:6px}
.fx-legend i{display:inline-block;width:16px;height:3px;flex-shrink:0}
.risk-comp-legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:11.5px;color:rgba(20,40,63,.6);line-height:1.5}
/* Risk contribution rows */
/* Reusable open/close explainer, same mechanic as the toggles used
   elsewhere in this project (max-height transition + an .open class),
   wired ONCE via delegation below rather than per-instance, so it works
   for every current and future explain-toggle without extra JS. */
/* Made deliberately button-like, not just underlined text: a filled
   pill with a real border and a circular +/- badge, so the affordance to
   click reads clearly on its own, without relying on color or a caption
   to explain it. */
.explain-toggle{display:inline-flex;align-items:center;gap:7px;font-family:'Figtree',sans-serif;font-size:12px;font-weight:600;color:var(--gold);background:rgba(37,87,199,.1);border:1px solid rgba(37,87,199,.4);border-radius:3px 12px 12px 12px;padding:7px 13px 7px 10px;margin:10px 0 2px;cursor:pointer;user-select:none;transition:background .15s ease,border-color .15s ease}
.explain-toggle:hover{background:rgba(37,87,199,.18);border-color:rgba(37,87,199,.6)}
.explain-toggle .explain-chevron{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;font-weight:700;flex-shrink:0;line-height:1}
.explain-toggle .explain-chevron:before{content:"+"}
.explain-toggle.open .explain-chevron:before{content:"\2212"}
.explain-toggle.open{background:rgba(37,87,199,.18)}
.explain-panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
.explain-panel.open{max-height:600px}
/* Same collapsible mechanism, reused for panels that hold real controls
   or several bundled cards rather than a paragraph of prose (portfolio
   cluster accordions, the "go deeper" bundles below) -- these can run
   well past 600px of real content. */
.explain-panel.open.tall{max-height:3200px}
.explain-panel-inner{font-size:12px;color:rgba(20,40,63,.68);line-height:1.6;padding:8px 2px 4px}
/* Cluster accordions and "go deeper" bundles hold real controls and
   nested .card blocks, not prose, so they get the app's normal type
   sizes and spacing back rather than the small prose defaults above. */
.explain-panel-inner.controls{font-size:inherit;color:inherit;line-height:inherit;padding-top:14px}
.explain-panel-inner.controls .card + .card{margin-top:12px}

/* --- portfolio: preset mixes + cluster accordion headers --- */
.pf-preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.pf-preset-btn{font-family:'Spline Sans Mono',monospace;font-size:10.5px;padding:9px 4px;border-radius:2px 10px 10px 10px;border:1px solid rgba(20,40,63,.16);background:rgba(20,40,63,.04);color:rgba(20,40,63,.75);cursor:pointer;text-align:center;border-left-width:3px;transition:all .15s}
.pf-preset-btn:hover{background:rgba(20,40,63,.08);color:var(--paper)}
.pf-preset-btn[data-pfpreset=conservative]{border-left-color:#5FA875}
.pf-preset-btn[data-pfpreset=balanced]{border-left-color:var(--gold)}
.pf-preset-btn[data-pfpreset=aggressive]{border-left-color:var(--red)}
.pf-preset-btn[data-pfpreset=equal]{border-left-color:rgba(20,40,63,.35)}
.port-cluster-toggle{display:flex;align-items:center;gap:8px;width:100%;font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:rgba(20,40,63,.75);background:transparent;border:none;border-top:1px dashed rgba(20,40,63,.14);padding:12px 2px 10px;margin:0;cursor:pointer;text-align:left}
.port-cluster:first-child .port-cluster-toggle{border-top:none}
.port-cluster-toggle:hover{color:var(--paper)}
.port-cluster-toggle .explain-chevron{background:rgba(20,40,63,.14);color:var(--paper);flex-shrink:0}
.port-cluster-toggle.open .explain-chevron{background:var(--gold);color:#fff}
.port-cluster-icon{width:15px;height:15px;color:var(--gold);flex-shrink:0}
.port-cluster-icon svg{width:100%;height:100%}
.port-cluster-name{flex:1}
.port-cluster-total{color:var(--gold);font-weight:600}

/* --- frontier flashcard: verdict + 3 tiles + action, replaces the old
   dense paragraph. Animates in via `animation` on freshly-inserted DOM
   nodes (every render/settle replaces this element's innerHTML wholesale,
   so a fresh .fcard is genuinely new each time -- no reflow-trick class
   toggling needed), and is covered for free by the reduced-motion rule
   above since that rule targets `*`. */
@keyframes fcPop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fcard{animation:fcPop .3s ease}
.fc-verdict{font-family:'Newsreader',serif;font-size:20px;line-height:1.35;font-weight:600;margin-bottom:14px}
.fc-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.fc-tile{background:rgba(20,40,63,.03);border-radius:2px 2px 10px 10px;padding:12px 10px}
.fc-tile .stat-value{font-size:18px}
.fc-tile .stat-label{font-size:10px}
.fc-tiles-sm .fc-tile{padding:8px 8px}
.fc-tiles-sm .fc-tile .stat-value{font-size:14px}
.fc-tiles-sm .fc-tile .stat-label{font-size:9px}
.fc-money-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.fc-money-tile{border-radius:2px 2px 10px 10px;padding:16px 14px}
.fc-money-tile .stat-value{font-size:24px}
.fc-money-tile .stat-label{font-size:10.5px}
.fc-money-in{background:rgba(37,87,199,.08);border:1px solid rgba(37,87,199,.3);border-left:3px solid rgba(37,87,199,.65)}
.fc-money-in .stat-value{color:var(--gold)}
.fc-money-out{background:rgba(95,168,117,.12);border:1px solid rgba(95,168,117,.4);border-left:3px solid rgba(95,168,117,.7)}
.fc-money-out .stat-value{color:#5FA875}
.fc-action{width:100%;background:rgba(37,87,199,.14);border:1px solid rgba(37,87,199,.5);color:var(--gold);border-radius:3px;padding:10px;font-size:12px;cursor:pointer;font-family:'Spline Sans Mono',monospace;margin-bottom:10px;transition:background .15s}
.fc-action:hover{background:rgba(37,87,199,.22)}
.fc-dests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.fc-dest{background:rgba(20,40,63,.03);border:1px solid rgba(20,40,63,.1);border-radius:2px 2px 10px 10px;padding:12px 10px;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s;font-family:inherit}
.fc-dest:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,40,63,.1)}
.fc-dest-label{font-family:'Spline Sans Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:6px}
.fc-dest-split{font-size:12.5px;font-weight:600;color:var(--paper);margin-bottom:4px;line-height:1.35}
.fc-dest-nums{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:rgba(20,40,63,.6)}
.fc-dest-rec{border-color:rgba(37,87,199,.45);background:rgba(37,87,199,.06)}
.fc-dest-rec .fc-dest-label{color:var(--gold)}
.fc-dest.is-current{border-color:rgba(217,119,87,.6);box-shadow:inset 0 0 0 1px rgba(217,119,87,.3)}
.fc-dest.is-current .fc-dest-label{color:#D97757}
@media(max-width:860px){.fc-dests{grid-template-columns:1fr}}
.fc-diversify{background:rgba(37,87,199,.06);border:1px solid rgba(37,87,199,.25);border-left:3px solid rgba(37,87,199,.55);border-radius:2px 2px 10px 10px;padding:14px;margin-bottom:14px}
.fc-diversify-stat{font-family:'Newsreader',serif;font-size:22px;font-weight:700;color:var(--gold);margin-bottom:6px}
.fc-diversify-headline{font-size:13px;line-height:1.55;color:rgba(20,40,63,.8)}

/* --- map card: reset/resample header, declutter toggles, held-cluster chips --- */
.pf-map-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pf-map-btn{font-family:'Spline Sans Mono',monospace;font-size:10.5px;background:transparent;border:1px solid rgba(20,40,63,.18);color:rgba(20,40,63,.6);border-radius:3px;padding:8px 12px;cursor:pointer;transition:all .15s}
.pf-map-btn:hover{background:rgba(20,40,63,.05);color:var(--paper)}
.pf-declutter-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px}
.pf-declutter-group{display:flex;align-items:center;gap:8px}
.pf-declutter-label{font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(20,40,63,.45)}
.pf-declutter-opts{display:flex;gap:1px;border:1px solid rgba(20,40,63,.18);border-radius:3px;overflow:hidden}
.pf-declutter-opt{font-family:'Spline Sans Mono',monospace;font-size:10px;background:transparent;border:none;border-right:1px solid rgba(20,40,63,.14);color:rgba(20,40,63,.55);padding:6px 9px;cursor:pointer}
.pf-declutter-opt:last-child{border-right:none}
.pf-declutter-opt.active{background:rgba(37,87,199,.16);color:var(--gold);font-weight:600}
.klass-chip-row{display:flex;flex-wrap:wrap;gap:6px}
.klass-chip{font-family:'Spline Sans Mono',monospace;font-size:10.5px;background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.16);border-radius:20px;color:rgba(20,40,63,.6);padding:6px 11px;cursor:pointer;white-space:nowrap}
.klass-chip.active{background:rgba(37,87,199,.16);border-color:rgba(37,87,199,.4);color:var(--gold);font-weight:600}
.pf-cluster-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pf-cluster-chip{font-family:'Spline Sans Mono',monospace;font-size:10px;padding:4px 9px;border-radius:20px;background:rgba(37,87,199,.07);border:1px solid rgba(37,87,199,.22);color:rgba(20,40,63,.6)}
.pf-cluster-chip b{color:var(--gold);font-weight:600}
.lab-gopdeeper-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(37,87,199,.65);margin:4px 0 -6px}
.explain-panel-inner b{color:rgba(20,40,63,.9)}
.stress-row{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid rgba(20,40,63,.06)}
.stress-row:last-child{border-bottom:none}
.stress-label{font-size:13px;color:rgba(20,40,63,.85);font-weight:600}
.stress-note{display:block;font-size:10.5px;color:rgba(20,40,63,.45);font-weight:400;margin-top:2px}
.stress-vals{display:flex;gap:14px;flex-wrap:wrap;font-family:'Spline Sans Mono',monospace;font-size:11.5px;margin-top:2px}
.stress-mkt{color:rgba(20,40,63,.5)}
.stress-port{font-weight:600}
.stress-dollar{color:rgba(20,40,63,.6)}
.pf-mode-toggle{display:flex;gap:6px;margin-bottom:14px}
.pf-mode-btn{flex:1;background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.16);color:rgba(20,40,63,.65);border-radius:2px 10px 10px 10px;padding:8px;font-size:12px;cursor:pointer;font-family:'Figtree',sans-serif;transition:all .15s}
.pf-mode-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.rc-legend{display:flex;gap:16px;margin-bottom:10px;font-size:11px;color:rgba(20,40,63,.5)}
.rc-legend span{display:flex;align-items:center;gap:5px}
.rc-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.rc-row{display:grid;grid-template-columns:1fr 90px;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(20,40,63,.06)}
.rc-row:last-child{border-bottom:none}
.rc-name{font-size:12px;color:rgba(20,40,63,.8);grid-column:1/2}
.rc-bars{grid-column:1/2;display:flex;flex-direction:column;gap:2px}
.rc-bar-track{height:5px;background:rgba(20,40,63,.06);border-radius:2px;overflow:hidden}
.rc-bar{height:100%;border-radius:2px}
.rc-money{background:#2557C7}
.rc-risk{background:#D97757}
.rc-risk-neg{background:#5FA875}
.rc-vals{grid-column:2/3;grid-row:1/3;font-size:10.5px;color:rgba(20,40,63,.5);text-align:right;font-family:'Spline Sans Mono',monospace;line-height:1.4}
.rc-flag-hot{color:#E8977A}
.rc-flag-cool{color:#8FC79E}
.risk-comp-legend span{display:flex;align-items:flex-start;gap:8px}
.risk-comp-legend i{display:inline-block;width:11px;height:11px;border-radius:2px;flex-shrink:0;margin-top:3px}

/* --- info icon hover tooltip (for stat labels, term explanations) --- */
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid rgba(20,40,63,.35);color:rgba(20,40,63,.55);font-size:9.5px;font-family:'Spline Sans Mono',monospace;font-style:normal;cursor:help;margin-left:5px;position:relative;flex-shrink:0}
.info-icon:hover{border-color:var(--gold);color:var(--gold)}
.info-icon .ii-tip{display:none;position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#FFFFFF;border:1px solid rgba(37,87,199,.4);border-radius:3px 8px 8px 8px;padding:9px 12px;font-family:'Figtree',sans-serif;font-size:11.5px;font-weight:400;color:rgba(20,40,63,.85);width:220px;line-height:1.5;text-align:left;z-index:30;box-shadow:0 6px 18px rgba(20,40,63,.16);white-space:normal}
.info-icon:hover .ii-tip{display:block}
.stat-label{display:flex;align-items:center}

.term{border-bottom:1px dashed rgba(37,87,199,.6);cursor:help;position:relative}
.term::after{content:attr(data-def);display:none;position:absolute;bottom:calc(100% + 7px);left:0;background:#FFFFFF;border:1px solid rgba(37,87,199,.4);border-radius:3px 8px 8px 8px;padding:9px 12px;font-family:'Figtree',sans-serif;font-size:11.5px;font-weight:400;color:rgba(20,40,63,.85);width:240px;line-height:1.5;white-space:normal;z-index:30;box-shadow:0 6px 18px rgba(20,40,63,.16)}
.term:hover::after{display:block}
.term:hover{border-bottom-color:var(--gold);color:var(--gold)}

/* --- cluster-grouped portfolio sliders --- */
.port-cluster{margin-bottom:0}
.pf-total-banner{display:flex;align-items:baseline;justify-content:space-between;background:rgba(37,87,199,.1);border:1px solid rgba(37,87,199,.35);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.pf-total-banner .ttl-label{font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(20,40,63,.6);letter-spacing:.04em}
.pf-total-banner .ttl-value{font-family:'Spline Sans Mono',monospace;font-size:16px;font-weight:600;color:var(--gold)}
.port-asset-meta{display:block;font-family:'Spline Sans Mono',monospace;font-size:10px;color:rgba(20,40,63,.42);font-weight:400;margin-top:2px;letter-spacing:.01em}
.port-pct-row{display:flex;align-items:baseline;gap:6px;margin:6px 0 5px}
.port-pct-badge{font-family:'Spline Sans Mono',monospace;font-size:15px;font-weight:600;color:var(--paper)}
.port-pct-of{font-family:'Spline Sans Mono',monospace;font-size:10px;color:rgba(20,40,63,.4)}
.epchip{font-family:'Spline Sans Mono',monospace;font-size:11px;padding:8px 8px;border-radius:2px;border:1px solid rgba(20,40,63,.16);background:rgba(20,40,63,.04);color:rgba(20,40,63,.7);cursor:pointer;text-align:center;line-height:1.5}
.epchip.active{background:rgba(160,58,34,.25);border-color:var(--red);color:#7A2517}
.epchip b{display:block;color:var(--paper);font-size:12px}

/* --- health score --- */
.score-dial{display:flex;align-items:center;gap:22px}
.dial-num{font-family:'Newsreader',serif;font-size:52px;font-weight:700;color:var(--gold)}
.dial-bars{flex:1;display:flex;flex-direction:column;gap:8px}
.dbar-row{display:flex;align-items:center;gap:10px;font-size:11.5px}
.dbar-label{width:110px;font-family:'Spline Sans Mono',monospace;color:rgba(20,40,63,.6);flex-shrink:0}
.dbar-track{flex:1;height:7px;background:rgba(20,40,63,.1);border-radius:4px;overflow:hidden}
.dbar-fill{height:100%;background:var(--gold);border-radius:4px}
.dbar-val{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);width:34px;text-align:right}

.gr-note{font-size:12.5px;color:rgba(20,40,63,.6);line-height:1.6;padding:12px 14px;background:rgba(20,40,63,.04);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;margin-top:6px}

.fx-flow{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 18px;font-family:'Newsreader',serif;font-size:15px}
.fx-arrow{color:var(--gold);font-size:20px}
@media print{
  body{background:#fff;color:#14283F}
  header,.tabbar,.panel,.section-label,#tabs,.country-toggle,#reseedBtn,.gp-actions,button{display:none !important}
  main{padding:0;max-width:100%}
  .grid{grid-template-columns:1fr;display:block}
  .card,.stat{background:#fff;border:1px solid #ccc;break-inside:avoid;box-shadow:none}
  .stat-value,.hero-figure,h3,h4{color:#14283F !important}
  .gr-note,.cap,.stat-label{color:#555 !important}
  .print-header{display:block !important;margin-bottom:24px;border-bottom:2px solid #14283F;padding-bottom:12px}
  .print-header .pt{font-family:'Newsreader',serif;font-size:22px;font-weight:700}
  .print-header .ps{font-family:'Spline Sans Mono',monospace;font-size:11px;color:#666;margin-top:4px}
  /* Every collapsible in this file (explainDropdown/collapsibleSection)
     starts closed and expands only via a live click handler, which never
     fires for a print stylesheet. Left alone, printing a page with any
     collapsed section -- including the "Go deeper" bundles this overhaul
     adds -- would silently drop that content from the printout. Force
     every panel open and hide the now-pointless toggle pill instead. */
  .explain-panel{max-height:none !important;overflow:visible !important}
  .explain-toggle{display:none !important}
}
.print-header{display:none}
.print-btn{position:fixed;bottom:20px;right:20px;background:var(--gold);color:#fff;border:none;border-radius:24px;padding:12px 18px;font-family:'Figtree',sans-serif;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 6px 20px rgba(37,87,199,.35);z-index:50;display:flex;align-items:center;gap:8px;transition:transform .15s ease,box-shadow .15s ease}
.print-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(37,87,199,.4)}
.print-btn svg{width:15px;height:15px}
@media print{.print-btn{display:none !important}}

.snap-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.snap-card{background:rgba(37,87,199,.08);border:1px solid rgba(37,87,199,.3);border-radius:3px 14px 14px 14px;padding:14px}
.snap-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.snap-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.snap-figure{font-family:'Newsreader',serif;font-size:22px;font-weight:600;color:var(--paper)}
.snap-sub{font-size:11px;color:rgba(20,40,63,.55);margin-top:4px}
.snap-add{background:rgba(20,40,63,.04);border:1.5px dashed rgba(20,40,63,.2);border-radius:3px 14px 14px 14px;color:rgba(20,40,63,.55);font-family:'Figtree',sans-serif;font-size:13px;cursor:pointer;padding:14px}
.gp-iconbtn{width:26px;height:26px;border-radius:6px;border:1px solid rgba(20,40,63,.16);background:rgba(20,40,63,.04);color:rgba(20,40,63,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:5px;flex-shrink:0}
.gp-iconbtn:hover{color:var(--paper)}
.gp-iconbtn svg{width:100%;height:100%}

/* --- Live Frontier: instrument search, chips, weight-combination table --- */
.live-mode-row{display:flex;gap:1px;margin-bottom:10px;border:1px solid rgba(20,40,63,.18);border-radius:3px;overflow:hidden}
.live-searchbox{width:100%;background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.18);border-radius:3px;padding:10px 12px;color:var(--paper);font-family:'Spline Sans Mono',monospace;font-size:12px;outline:none}
.live-searchbox:focus{border-color:rgba(37,87,199,.5)}
.live-results{display:flex;flex-direction:column;gap:1px;margin-top:8px;max-height:220px;overflow-y:auto;border-radius:3px}
.live-result-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(20,40,63,.03);border:1px solid rgba(20,40,63,.1);border-top-width:0;padding:8px 11px;color:rgba(20,40,63,.8);font-family:'Figtree',sans-serif;font-size:12.5px;cursor:pointer}
.live-results .live-result-btn:first-child{border-top-width:1px;border-radius:3px 3px 0 0}
.live-results .live-result-btn:last-child{border-radius:0 0 3px 3px}
.live-result-btn:hover{background:rgba(37,87,199,.1);color:var(--paper)}
.live-result-sym{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--gold);flex-shrink:0}
.live-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.live-chip{display:flex;align-items:center;gap:8px;background:rgba(37,87,199,.1);border:1px solid rgba(37,87,199,.4);border-radius:3px 12px 12px 12px;padding:7px 8px 7px 12px;font-size:12px;color:var(--paper)}
.live-chip-status{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.live-chip-status.st-loading{background:var(--gold);animation:live-pulse 1s ease-in-out infinite}
.live-chip-status.st-ready{background:#8FC79E}
.live-chip-status.st-error{background:var(--red)}
.live-chip-status.st-caution{background:var(--warn)}
.live-chip-status.st-held{background:var(--red)}
.live-chip-held{background:rgba(160,58,34,.08);border-color:rgba(160,58,34,.4)}
.live-chip-held span:not(.live-chip-status){color:var(--red);text-decoration:line-through;text-decoration-color:rgba(160,58,34,.5)}
@keyframes live-pulse{0%,100%{opacity:.3}50%{opacity:1}}
.live-chip-x{background:none;border:none;color:rgba(20,40,63,.5);cursor:pointer;font-size:15px;line-height:1;padding:2px 3px}
.live-chip-x:hover{color:var(--red)}
.live-freetext{display:flex;gap:8px;margin-top:10px}
.live-freetext input{flex:1;background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.18);border-radius:3px;padding:9px 11px;color:var(--paper);font-family:'Spline Sans Mono',monospace;font-size:12px;outline:none}
.live-freetext button{background:rgba(37,87,199,.14);border:1px solid rgba(37,87,199,.5);color:var(--gold);border-radius:3px;padding:0 16px;font-family:'Spline Sans Mono',monospace;font-size:11.5px;cursor:pointer;white-space:nowrap}
.live-error-box{background:rgba(160,58,34,.1);border-left:2px solid var(--red);border-radius:0 8px 8px 0;padding:10px 13px;font-size:12px;color:#7A2517;margin-top:8px;line-height:1.55}
.live-empty{padding:30px 20px;text-align:center;color:rgba(20,40,63,.4);font-size:13px}
.live-inst-row{padding:12px 0;border-top:1px solid rgba(20,40,63,.08)}
.live-inst-row:first-child{border-top:none;padding-top:0}
.live-inst-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.live-inst-name{font-size:13px;color:var(--paper);font-weight:600}
.live-inst-name .cap{font-weight:400;margin-left:4px}
.live-inst-cagr{font-family:'Spline Sans Mono',monospace;font-size:15px;color:var(--paper);white-space:nowrap}
.live-inst-cagr .cap{font-size:10px;margin-left:2px}
.live-inst-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:rgba(20,40,63,.6)}
.live-inst-flags{margin-top:6px}
.live-flag{font-size:11.5px;line-height:1.5;padding:6px 10px;border-radius:0 6px 6px 0;margin-top:4px}
.live-flag-caution{background:rgba(201,154,69,.12);border-left:2px solid var(--warn);color:#8a6a1f}
.live-flag-unusable{background:rgba(160,58,34,.1);border-left:2px solid var(--red);color:#7A2517}
.live-inst-held .live-inst-name,.live-inst-held .live-inst-cagr{opacity:.55}
.live-wc-wrap{overflow-x:auto;margin-top:4px;border-radius:3px 14px 14px 14px;border:1px solid rgba(20,40,63,.1)}
.live-wc-table{width:100%;border-collapse:collapse;font-family:'Spline Sans Mono',monospace;font-size:11.5px;white-space:nowrap}
.live-wc-table th{text-align:right;padding:9px 12px;color:rgba(20,40,63,.45);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:rgba(20,40,63,.04);position:sticky;top:0}
.live-wc-table th:first-child,.live-wc-table td:first-child{text-align:left}
.live-wc-table td{text-align:right;padding:8px 12px;color:rgba(20,40,63,.75);border-top:1px solid rgba(20,40,63,.06);cursor:pointer}
.live-wc-table tr:hover td{background:rgba(20,40,63,.05)}
.live-wc-table tr.wc-current td{background:rgba(20,40,63,.09);color:var(--paper);font-weight:600}
.live-wc-table tr.wc-best td{background:rgba(37,87,199,.1)}
.live-wc-badge{display:inline-block;font-family:'Spline Sans Mono',monospace;font-size:9px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.live-wc-badge.best{background:rgba(37,87,199,.22);color:var(--gold)}
.live-wc-badge.minvar{background:rgba(143,199,158,.18);color:#8FC79E}

/* --- Read the Company ("statements" tab) -----------------------------
   Renders once per mount (see the rendering note above initChart() and
   render()'s statementsShellMounted branch); every interaction below
   patches a container directly rather than going through render(), and
   linked highlighting is pure CSS driven by two attributes on #stmtRoot. */
/* This tab breaks out of the app's shared grid-of-sliders shell entirely --
   no .grid/.panel/.output, no 1180px cap. It's a reading surface for one
   company's numbers, closer to a research terminal than a settings form, so
   it gets its own full-width page and its own restrained (not app-blue)
   surface language. Scoped to body.stmt-page so nothing else changes. */
body.stmt-page main{max-width:1600px}
.stmt-shell{display:flex;flex-direction:column;gap:20px}
/* Soft elevation instead of a flat 1px border -- on the app's tinted
   radial-gradient background a shadowed white card reads as a surface you
   could pick up, not a bordered box on a spreadsheet. The hover lift is a
   small, free bit of "this responds to you" without touching any data
   colour. */
.stmt-card{background:#fff;border:1px solid rgba(20,40,63,.07);border-radius:14px;padding:24px;box-shadow:0 1px 2px rgba(20,40,63,.04),0 10px 28px -18px rgba(20,40,63,.22);transition:box-shadow .18s ease}
.stmt-card:hover{box-shadow:0 1px 2px rgba(20,40,63,.05),0 14px 34px -16px rgba(20,40,63,.28)}
/* Replaces the bare 10px uppercase .section-label inside this tab's own
   cards with an icon + a real heading size -- the label alone read as a
   filing-cabinet tab, not a title. Icons are wayfinding, not judgement:
   one colour, no meaning encoded in which icon goes where. */
.stmt-section-title{display:flex;align-items:center;gap:10px;font-family:'Newsreader',serif;font-weight:700;font-size:17px;color:var(--ink2);margin-bottom:16px}
.stmt-section-title svg{width:19px;height:19px;flex-shrink:0;color:var(--gold);stroke-width:2}

/* Section jump-nav: sticks to the top of the scrolling column so a reader
   can go straight to Balance Sheet or Compounding from wherever they are,
   the way screener.in's own page tabs work, instead of only being able to
   scroll. Pure anchor-jump (scrollIntoView), no active-section tracking --
   simple and correct beats a scroll-spy that can drift out of sync. */
.stmt-jumpnav{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid rgba(20,40,63,.12);border-radius:10px;padding:9px;box-shadow:0 2px 8px -4px rgba(20,40,63,.15)}
.stmt-jumpnav button{font-family:'Spline Sans Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:.01em;color:rgba(20,40,63,.65);background:rgba(20,40,63,.045);border:1px solid rgba(20,40,63,.14);border-radius:16px;padding:7px 14px;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
.stmt-jumpnav button:hover{background:rgba(37,87,199,.12);color:var(--gold);border-color:rgba(37,87,199,.4)}
@media(max-width:860px){.stmt-jumpnav{overflow-x:auto;flex-wrap:nowrap;position:static}}

.stmt-topbar{background:#fff;border:1px solid rgba(20,40,63,.07);border-radius:14px;box-shadow:0 1px 2px rgba(20,40,63,.04),0 10px 28px -18px rgba(20,40,63,.22)}
.stmt-topbar-head{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 16px}
.stmt-topbar-toggle{flex:1;display:flex;align-items:baseline;gap:12px;min-width:0;background:none;border:none;padding:10px 4px;cursor:pointer;text-align:left;font:inherit}
.stmt-topbar-title{font-family:'Newsreader',serif;font-weight:600;font-size:15px;color:var(--ink2);flex-shrink:0}
.stmt-topbar-current{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stmt-topbar-chevron{margin-left:auto;color:rgba(20,40,63,.4);font-size:12px;flex-shrink:0}
.stmt-topbar-head .reset-tab-btn{flex-shrink:0}
/* Explicit, visible affordance for reclaiming the tools rail's width --
   the sidebar's own collapse toggle (.nav-toggle-btn) already does this,
   but it lives off to the left where it's easy to never notice; this one
   sits right next to the page's own title so the option is obvious the
   moment someone opens this tab. Both toggle the exact same state. */
.stmt-fullwidth-btn{font-family:'Spline Sans Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--gold);background:rgba(37,87,199,.09);border:1px solid rgba(37,87,199,.35);border-radius:20px;padding:6px 13px;cursor:pointer;flex-shrink:0;white-space:nowrap;transition:background .15s}
.stmt-fullwidth-btn:hover{background:rgba(37,87,199,.18)}
.stmt-topbar-body{padding:0 20px 18px}
.stmt-topbar-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:900px){.stmt-topbar-grid{grid-template-columns:1fr}}
.stmt-topbar-col .section-label:first-child{margin-top:0}

.stmt-search-row{display:flex;gap:8px}
.stmt-search-row input{flex:1;background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.18);border-radius:3px;padding:9px 11px;font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--paper);outline:none;text-transform:uppercase}
.stmt-search-row button{background:rgba(37,87,199,.14);border:1px solid rgba(37,87,199,.5);color:var(--gold);border-radius:3px;padding:0 16px;font-family:'Spline Sans Mono',monospace;font-size:11.5px;cursor:pointer}
.stmt-recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stmt-recent button{background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.14);border-radius:10px;padding:4px 10px;font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:rgba(20,40,63,.65);cursor:pointer}
.stmt-recent button:hover{border-color:var(--gold);color:var(--gold)}
.stmt-compare-row{margin-top:14px;padding-top:14px;border-top:1px solid rgba(20,40,63,.1)}
.stmt-compare-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin-bottom:7px}
.stmt-controls{display:flex;flex-direction:column}
.stmt-ctrl-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed rgba(20,40,63,.12)}
.stmt-ctrl-row:last-child{border-bottom:none;padding-bottom:0}
.stmt-ctrl-label{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:600;color:var(--ink2)}
.stmt-ctrl-hint{font-weight:400;font-size:11.5px;color:var(--dim);line-height:1.45;max-width:280px}
.stmt-seg{display:inline-flex;border:1px solid rgba(20,40,63,.18);border-radius:3px;overflow:hidden;flex-shrink:0}
.stmt-seg button{background:none;border:none;padding:5px 10px;font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:rgba(20,40,63,.6);cursor:pointer;border-right:1px solid rgba(20,40,63,.12)}
.stmt-seg button:last-child{border-right:none}
.stmt-seg button.active{background:rgba(37,87,199,.14);color:var(--gold);font-weight:600}
.stmt-toggle-pill{background:none;border:1px solid rgba(20,40,63,.18);border-radius:12px;padding:5px 13px;font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:rgba(20,40,63,.6);cursor:pointer;flex-shrink:0}
.stmt-toggle-pill.active{background:rgba(37,87,199,.14);border-color:var(--gold);color:var(--gold);font-weight:600}

.stmt-header-card{display:flex;flex-direction:column;gap:10px}
.stmt-header-top{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
/* A plain ticker string in serif type read as a document title, not the
   header of something you were about to interact with -- the monogram
   circle is the one purely decorative addition on this page, there to
   make the top of the card feel like a profile, not a filing header. */
.stmt-header-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,rgba(37,87,199,.16),rgba(37,87,199,.06));border:1px solid rgba(37,87,199,.25);color:var(--gold);font-family:'Newsreader',serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stmt-header-name{font-family:'Newsreader',serif;font-weight:700;font-size:32px;letter-spacing:-.01em;color:var(--ink2)}
.stmt-header-badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:2px}
.stmt-badge{display:inline-flex;align-items:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:9px;background:rgba(20,40,63,.07);color:var(--dim)}
.stmt-badge.lender{background:rgba(160,58,34,.12);color:var(--red)}
.stmt-badge.nonlender{background:rgba(46,139,111,.12);color:var(--ok)}
.stmt-badge.standalone{background:rgba(201,154,69,.16);color:var(--warn)}
.stmt-source-line{font-size:12px;color:var(--dim);margin-top:2px}
.stmt-source-line a{color:var(--gold)}
.stmt-sector-line{font-size:12.5px;color:rgba(20,40,63,.65)}
/* Stat tiles instead of divider-separated columns -- each one is its own
   small card, so the two that are actually clickable (they pin a
   companion-chip suggestion) read as buttons before you ever hover them,
   not just on hover. */
.stmt-market-snapshot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.stmt-market-fact{display:flex;flex-direction:column;gap:4px;background:rgba(20,40,63,.03);border:1px solid rgba(20,40,63,.08);border-radius:10px;padding:10px 16px;font:inherit;text-align:left;min-width:108px;transition:background .14s ease,border-color .14s ease,transform .1s ease}
.stmt-market-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.stmt-market-value{font-family:'Spline Sans Mono',monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;color:var(--ink2)}
button.stmt-market-fact{cursor:pointer;background:rgba(37,87,199,.05);border-color:rgba(37,87,199,.18)}
button.stmt-market-fact:hover{background:rgba(37,87,199,.11);border-color:rgba(37,87,199,.4);transform:translateY(-1px)}
button.stmt-market-fact:hover .stmt-market-value{color:var(--gold)}
.stmt-market-clickhint{color:var(--gold);font-size:8px;opacity:.75}
.stmt-coverage-note{flex-basis:100%;font-size:10.5px;color:var(--warn);margin-top:2px;font-style:italic}
.stmt-stale-banner,.stmt-refusal-card,.stmt-cyclical-banner{background:rgba(201,154,69,.1);border:1px solid rgba(201,154,69,.35);border-radius:3px 12px 12px 12px;padding:12px 16px;font-size:12.5px;color:rgba(20,40,63,.8);line-height:1.55}
.stmt-refusal-card{background:rgba(20,40,63,.045);border-color:rgba(20,40,63,.16)}
.stmt-refusal-card b{display:block;color:var(--ink2);margin-bottom:4px;font-size:13px}
.stmt-refusal-card .stmt-comparable-list{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.stmt-refusal-card .stmt-comparable-list span{background:rgba(46,139,111,.12);color:var(--ok);border-radius:8px;padding:3px 9px;font-size:10.5px;font-family:'Spline Sans Mono',monospace}
.stmt-error-card{background:rgba(160,58,34,.08);border:1px solid rgba(160,58,34,.3);border-radius:3px 12px 12px 12px;padding:14px 16px;font-size:12.5px;color:rgba(20,40,63,.8)}

.stmt-checklist-framing{max-width:780px;margin:6px 0 18px}
.stmt-checklist-framing p{font-size:13.5px;line-height:1.65;color:rgba(20,40,63,.78);margin:0 0 11px}
.stmt-checklist-gate{background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.16);border-radius:3px 12px 12px 12px;padding:14px 16px;font-size:13px;color:rgba(20,40,63,.8);line-height:1.55;margin-bottom:14px}
.stmt-checklist-gate .ns-btn{margin-top:10px}
.stmt-checklist-list{display:flex;flex-direction:column;border-top:1px solid rgba(20,40,63,.09);border-radius:8px;overflow:hidden}
/* Same size, weight and prominence for a met and a failed condition --
   the plan's explicit rule ("failed conditions render identically to met
   ones") -- so the only things doing work here are spacing and a faint
   zebra stripe, never colour-coding pass/fail. */
.stmt-checklist-row{display:grid;grid-template-columns:30px 1fr auto 110px;gap:16px;align-items:center;padding:14px 12px;border-bottom:1px solid rgba(20,40,63,.09);font-size:13.5px;transition:background .12s ease}

.stmt-table-wrap{overflow-x:auto;margin-top:0;border-radius:0 0 10px 10px;border:1px solid rgba(20,40,63,.12);border-top:none;contain:layout paint}
/* width:auto + table-layout:fixed with every column explicitly sized below
   means the table's rendered width is exactly the sum of those widths --
   never squeezed to fit the container. Before this, only the label/median/
   reading columns had a width; every year column was left to split
   whatever space remained, which on a 12-year table could be ~25px per
   column -- not enough for a 6-digit rupee figure, so digits overflowed
   their cell and visually ran into the next column's digits, reading as
   one fused number. .stmt-table-wrap's overflow-x:auto is what makes a
   table wider than the viewport still usable -- it scrolls instead of
   compressing. */

.stmt-table th{text-align:right;padding:8px 8px;color:var(--dim);font-weight:600;font-size:11px;background:#fbfcfe;position:sticky;top:0;z-index:2;vertical-align:bottom;border-bottom:2px solid rgba(20,40,63,.14)}
/* Frozen line-item column: on a 12-year-wide table the row label is the one
   thing that must never scroll out of view, or every number loses its
   meaning the moment you scroll right. A shadow at the freeze seam (not a
   hard border) reads as a layer sitting above the scrolling content rather
   than a rendering glitch. */
.stmt-table th:first-child,.stmt-table td:first-child{text-align:left;width:230px;position:sticky;left:0;box-shadow:2px 0 4px -2px rgba(20,40,63,.18)}

/* Every year/TTM column gets a fixed, generous width -- this is the actual

/* The whole bar is the click target, not a small icon inside it -- the

.stmt-table-title{font-family:'Newsreader',serif;font-weight:700;font-size:16px;color:var(--ink2);display:flex;align-items:center;gap:10px;background:rgba(20,40,63,.045);border:1px solid rgba(20,40,63,.12);border-radius:12px 12px 0 0;padding:14px 16px;cursor:pointer;user-select:none;transition:background .12s ease}

/* CSS-only linked highlighting: two attributes on #stmtRoot (data-hl-metric,

<button class="print-btn" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span>Print / Save as PDF</span></button>

<script src="goalden-engine.js"></script>
<script src="statements-engine.js"></script>
<script>
'use strict';
/* =====================================================================
   ECHARTS: theme + chart lifecycle
   One shared theme so every chart instance is just echarts.init(dom,
   'goalden', {renderer:'svg'}) -- svg keeps this app's real print/PDF
   output vector-sharp instead of a rasterized canvas snapshot.
   ===================================================================== */
echarts.registerTheme('goalden', {
  color: ['#2557C7','#8FC79E','#D97757','#5FA875','#E8977A','#14283F'],
  backgroundColor: 'transparent',
  textStyle: { fontFamily: "'Spline Sans Mono', monospace", color: 'rgba(20,40,63,.75)' },
  title: { textStyle: { fontFamily: "'Newsreader', serif", color: '#14283F', fontWeight: 600 } },
  grid: { left: 44, right: 16, top: 16, bottom: 30, containLabel: true },
  categoryAxis: {
    axisLine: { lineStyle: { color: 'rgba(20,40,63,.2)' } },
    axisLabel: { color: 'rgba(20,40,63,.5)', fontSize: 10 },
    splitLine: { show: false },
  },
  valueAxis: {
    axisLine: { show: false },
    axisLabel: { color: 'rgba(20,40,63,.5)', fontSize: 10 },
    splitLine: { lineStyle: { color: 'rgba(20,40,63,.06)' } },
  },
  tooltip: {
    backgroundColor: '#FFFFFF', borderColor: 'rgba(37,87,199,.4)', borderWidth: 1,
    textStyle: { color: '#14283F', fontFamily: "'Spline Sans Mono', monospace", fontSize: 11.5 },
    extraCssText: 'border-radius:3px 8px 8px 8px;box-shadow:0 6px 18px rgba(20,40,63,.16)',
  },
});
// Registry of live chart instances, keyed by container id. A tab switch
// or any full re-render replaces #main's innerHTML wholesale, which
// detaches the old container node without disposing the ECharts instance
// bound to it -- this registry is what lets re-renders dispose stale
// instances instead of silently leaking one on every render() call.
// initChart() also doubles as the fast path for high-frequency updates
// (a slider mid-drag): pass the SAME id across ticks and it calls
// setOption() on the still-live instance instead of dispose+recreate,
// so ECharts animates the transition between old and new values for
// free, the same way the old hand-rolled fast-path patching did.
const chartInstances = {};
function initChart(id, option, optsOverride){
  const dom = document.getElementById(id);
  if(!dom) return null;
  let entry = chartInstances[id];
  if(entry && entry.dom !== dom){ entry.inst.dispose(); entry = null; }
  if(!entry){
    const inst = echarts.init(dom, 'goalden', Object.assign({renderer:'svg'}, optsOverride));
    entry = chartInstances[id] = { inst, dom };
  }
  entry.inst.setOption(option, true);
  return entry.inst;
}
function disposeChart(id){
  if(chartInstances[id]){ chartInstances[id].inst.dispose(); delete chartInstances[id]; }
}
// Charts are placed into the DOM as part of a synchronous innerHTML
// string (same convention as the old SVG-string chart functions), so the
// container div does not exist yet at the moment a chart-producing
// function runs. Scheduling the actual echarts.init/setOption call via
// setTimeout(fn,0) defers it to right after the current synchronous
// script (which includes the innerHTML assignment) finishes -- the
// container is guaranteed to exist by the time this callback runs, with
// no caller-side changes needed at any of this app's many call sites.
function deferChartInit(fn){ setTimeout(fn, 0); }
// ECharts with renderer:'svg' writes fixed pixel dimensions at mount time
// and never re-measures on its own. With no resize listener anywhere in
// this file, every chart stayed frozen at its original width forever --
// most visibly when crossing the 860px layout breakpoint. Debounced so a
// window drag doesn't fire a resize per pixel; wrapped in try/catch
// because a chart id can be present in the registry for a container that
// a re-render has since removed from the DOM (disposeChart lags one
// render behind in a couple of call sites).
let chartResizeT;
window.addEventListener('resize', ()=>{
  clearTimeout(chartResizeT);
  chartResizeT = setTimeout(()=>{
    Object.values(chartInstances).forEach(entry=>{ try{ entry.inst.resize(); }catch(e){} });
    if(typeof syncStickyPanels==='function') syncStickyPanels();
  }, 150);
});

/* =====================================================================
   ENGINE — the shared primitives (inflateExpense, realRate, corpusRequired,
   solveSIP, effectiveMonthlyRate, accumulationSchedule) now live in
   goalden-engine.js, loaded above. Only the Lab-specific extensions stay
   here: solveStepUpSIP, swpWithdrawal, drawdownWithShock.
   ===================================================================== */
function solveStepUpSIP(rate,growth,periods,fv,due){
  if(Math.abs(rate-growth)<1e-9){const f=periods*Math.pow(1+rate,periods-1)*(due?(1+rate):1);return fv/f;}
  let f=(Math.pow(1+rate,periods)-Math.pow(1+growth,periods))/(rate-growth);
  return fv/(due?f*(1+rate):f);
}
function swpWithdrawal(rate,years,corpus,due){
  if(rate===0)return corpus/years;
  let f=(1-Math.pow(1+rate,-years))/rate;
  if(due)f*=(1+rate);
  return corpus/f;
}
function drawdownWithShock(opts, shockYear, shockReturn){
  const rows=[];let bal=opts.openingCorpus,w=opts.firstWithdrawal;let ranOutYear=null;
  for(let yr=1;yr<=opts.years;yr++){
    const rate=(yr===shockYear)?shockReturn:opts.nominalRate;
    let close;
    if(opts.due){const baw=bal-w;close=baw+baw*rate;}
    else{close=(bal+bal*rate)-w;}
    if(close<0&&ranOutYear===null)ranOutYear=yr;
    rows.push({year:yr,openBal:bal,withdrawal:w,rate,closeBal:close});
    bal=close;
    w*=(1+opts.inflation);
  }
  return{rows,ranOutYear,finalBalance:bal};
}

/* =====================================================================
   MONTE CARLO — seeded (mulberry32 PRNG + Box-Muller), n=1000 default.
   Verified: volatility=0 collapses exactly to the deterministic engine
   answer at every percentile; same seed reproduces identical results;
   spread widens monotonically with volatility.
   ===================================================================== */
function mulberry32(seed){
  return function(){
    seed|=0; seed=(seed+0x6D2B79F5)|0;
    let t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return((t^(t>>>14))>>>0)/4294967296;
  };
}
function gaussian(rng){const u1=rng()||1e-9,u2=rng();return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);}

function monteCarloAccumulation({sip,meanReturn,volatility,years,due,seed,n}){
  const rng=mulberry32(seed);
  const finals=[],paths=[];
  for(let sim=0;sim<n;sim++){
    let bal=0; const path=[0];
    for(let y=1;y<=years;y++){
      const r=volatility===0?meanReturn:meanReturn+volatility*gaussian(rng);
      bal=due?(bal+sip)*(1+r):bal*(1+r)+sip;
      path.push(bal);
    }
    finals.push(bal); paths.push(path);
  }
  finals.sort((a,b)=>a-b);
  const pct=p=>finals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
  // percentile band PER YEAR (for the fan chart) — recompute per-year percentiles across all paths
  const yearBands=[];
  for(let y=0;y<=years;y++){
    const vals=paths.map(p=>p[y]).sort((a,b)=>a-b);
    const pp=p=>vals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
    yearBands.push({year:y,p10:pp(0.10),p25:pp(0.25),p50:pp(0.50),p75:pp(0.75),p90:pp(0.90)});
  }
  return{p10:pct(0.10),p25:pct(0.25),p50:pct(0.50),p75:pct(0.75),p90:pct(0.90),mean:finals.reduce((a,b)=>a+b,0)/n,yearBands};
}

// Same PRNG, same percentile-banding approach as monteCarloAccumulation,
// but run over the SPENDING-down phase instead: each simulated year draws
// a random return, the withdrawal (already fixed by the deterministic
// plan) is taken out, and once a path hits zero it stays there. This is
// what a single average return can never show: two paths with the exact
// same mean and volatility can survive or fail entirely depending on
// WHEN the bad years land — sequence-of-returns risk.
function monteCarloDrawdown({openingCorpus,firstWithdrawal,inflation,meanReturn,volatility,years,due,seed,n,shockYear,shockReturn}){
  const rng=mulberry32(seed);
  const finals=[],paths=[],ranOutYears=[];
  for(let sim=0;sim<n;sim++){
    let bal=openingCorpus,w=firstWithdrawal,ranOut=null;
    const path=[bal];
    for(let y=1;y<=years;y++){
      // The historical-shock scenario picked above forces this one year to
      // the real crash figure in every simulated path, while every other
      // year still draws random volatility -- answering "does the plan
      // survive normal randomness on top of a specific historical crash?"
      // rather than treating the shock and the Monte Carlo as unrelated.
      const r=(shockYear!=null && y===shockYear) ? shockReturn : (volatility===0?meanReturn:meanReturn+volatility*gaussian(rng));
      let close;
      if(due){const baw=bal-w;close=baw+baw*r;}else{close=(bal+bal*r)-w;}
      // A plan built to reach exactly zero can land a hair below it from
      // pure floating-point rounding (seen: -2.5e-7 on a multi-crore
      // balance). Only count it as ruin past a real, rupee-scale deficit.
      if(close<-1&&ranOut===null)ranOut=y;
      bal=Math.max(0,close);
      path.push(bal);
      w*=(1+inflation);
    }
    finals.push(bal);paths.push(path);ranOutYears.push(ranOut);
  }
  finals.sort((a,b)=>a-b);
  const pct=p=>finals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
  const yearBands=[];
  for(let y=0;y<=years;y++){
    const vals=paths.map(p=>p[y]).sort((a,b)=>a-b);
    const pp=p=>vals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
    yearBands.push({year:y,p10:pp(0.10),p25:pp(0.25),p50:pp(0.50),p75:pp(0.75),p90:pp(0.90)});
  }
  const survived=ranOutYears.filter(x=>x===null).length;
  const failedYears=ranOutYears.filter(x=>x!==null).sort((a,b)=>a-b);
  const medianRuinYear=failedYears.length?failedYears[Math.floor(failedYears.length/2)]:null;
  // A corpus with no margin for error (this app deliberately builds one to
  // show the fragility) fails on MORE than half its simulated paths the
  // moment any volatility is added at all. That means the P10 and P50
  // "ending balance" are both legitimately ₹0 for nearly the entire
  // volatility range, which is mathematically correct but useless as a
  // headline stat: it never differentiates a mild scenario from a severe
  // one, because both just say ₹0. The fix isn't to change the math, it's
  // to report the right thing for a failed path: WHEN it ran out, not a
  // balance that was never going to be anything but zero. Ties among
  // failed paths break on ruin year (an earlier failure is a worse
  // outcome), so P10 and P50 keep differentiating from each other even
  // when both represent failures.
  const combined = finals.map((bal,i)=>({bal, ranOut: ranOutYears[i]}))
    .sort((a,b)=>{
      const aR=a.ranOut!==null, bR=b.ranOut!==null;
      if(aR&&bR) return a.ranOut-b.ranOut;
      if(aR&&!bR) return -1;
      if(!aR&&bR) return 1;
      return a.bal-b.bal;
    });
  const pctDetail = p => combined[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
  return{p10:pct(0.10),p25:pct(0.25),p50:pct(0.50),p75:pct(0.75),p90:pct(0.90),yearBands,
         survivalPct:survived/n,failCount:failedYears.length,medianRuinYear,n,
         p10Detail:pctDetail(0.10),p50Detail:pctDetail(0.50)};
}

function clusterCorr(c1,c2){
  if(c1===c2) return CLUSTER_CORR[c1+'-'+c1] !== undefined ? CLUSTER_CORR[c1+'-'+c1] : 1.00;
  const k1=c1+'-'+c2, k2=c2+'-'+c1;
  return CLUSTER_CORR[k1]!==undefined ? CLUSTER_CORR[k1] : CLUSTER_CORR[k2];
}
function buildCorrMatrix(assets){
  const n=assets.length;
  const m=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) m[i][j] = i===j ? 1.00 : clusterCorr(assets[i].cluster, assets[j].cluster);
  return m;
}
