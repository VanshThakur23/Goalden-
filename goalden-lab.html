  const bands=[{max:39,label:'Needs attention',color:'#A03A22'},{max:69,label:'On track, room to grow',color:'#2557C7'},{max:100,label:'Strong shape',color:'#2E8B6F'}];
  const band=bands.find(b=>sc.total<=b.max);
  return { ok:true, html:
    '<div class="card is-primary"><h4>Plan Health Score</h4><div class="cap">'+band.label+'</div>' +
      '<div class="score-dial"><div class="dial-num" style="color:'+band.color+'">'+sc.total+'</div><div class="dial-bars">' +
        '<div class="dbar-row"><span class="dbar-label">Funding</span><div class="dbar-track"><div class="dbar-fill" style="width:'+(sc.funding/40*100)+'%"></div></div><span class="dbar-val">'+sc.funding+'/40</span></div>' +
        '<div class="dbar-row"><span class="dbar-label">Emergency</span><div class="dbar-track"><div class="dbar-fill" style="width:'+(sc.emergency/20*100)+'%"></div></div><span class="dbar-val">'+sc.emergency+'/20</span></div>' +
        '<div class="dbar-row"><span class="dbar-label">Stress survival</span><div class="dbar-track"><div class="dbar-fill" style="width:'+(sc.stress/25*100)+'%"></div></div><span class="dbar-val">'+sc.stress+'/25</span></div>' +
        '<div class="dbar-row"><span class="dbar-label">Discipline</span><div class="dbar-track"><div class="dbar-fill" style="width:'+(sc.discipline/15*100)+'%"></div></div><span class="dbar-val">'+sc.discipline+'/15</span></div>' +
      '</div></div></div>'
  };
}

// F3g — the nine single-scenario `show_result` kinds are retired; they're now
// Briefing sections, reusing the exact same chart builders. Each build() returns
// {ok, html} or {ok:false, error} so a section lacking inputs degrades to an
// honest "tell me X first" rather than an empty chart.
function briefingHeadline() {
  const c = cfg();
  const r = advisorGetResults();
  if (!r.ok) return { ok:false, error: r.error };
  const res = r.result;
  const fmt = function (v) { return typeof v === 'number' ? c.compact(v) : String(v); };
  const skip = { tool:1, note:1, breakdown:1, holdings:1, correlations:1, weights:1, inputs:1 };
  const rows = Object.keys(res).filter(function (k) { return !skip[k] && !(res[k] && typeof res[k] === 'object'); }).map(function (k) {
    return '<div class="stat"><div class="stat-label">' + k + '</div><div class="stat-value">' + fmt(res[k]) + '</div></div>';
  }).join('');
  // Every numeric scalar in the result becomes an auditable figure — composeBriefing
  // re-reads them via get_results and blocks on any drift.
  const figures = {};
  Object.keys(res).forEach(function (k) { if (typeof res[k] === 'number') figures[k] = res[k]; });
  return { ok:true, html: '<div class="card"><h4>' + (res.tool || 'Result') + '</h4><div class="stat-row">' + (rows || '<div class="gr-note">Nothing to summarise yet.</div>') + '</div></div>', figures: figures };
}
function briefingStress() {
  const c = cfg();
  const ep = (c.episodes && c.episodes[0]) ? c.episodes[0] : null;
  if (!ep) return { ok:false, error:'No historical crash scenarios available for this country.' };
  const saved = L.ret.shock;
  L.ret.shock = { epId: ep.id, year: 1 };
  const res = calcRetLab();
  L.ret.shock = saved;
  const survived = !!(res.shockInfo && !res.shockInfo.ranOutYear);
  return { ok:true, html: '<div class="card"><h4>Against the ' + ep.label + ' (' + (ep.rate*100).toFixed(0) + '% in one year)</h4>' +
    '<div class="stat-row">' +
    '<div class="stat"><div class="stat-label">Outcome</div><div class="stat-value" style="color:' + (survived ? '#8FC79E' : '#E8977A') + '">' + (survived ? 'Survives' : 'Runs out in drawdown year ' + res.shockInfo.ranOutYear) + '</div></div>' +
    '<div class="stat"><div class="stat-label">Monthly SIP</div><div class="stat-value">' + c.fmt(Math.round(res.sip)) + '</div></div>' +
    '</div></div>' };
}
function briefingAllocation() {
  if (!L.country) return { ok:false, error:'Pick a country first.' };
  const p = advisorPortfolioData();
  const rows = p.assets.map(function (a, i) { return '<div class="delay-row"><span class="delay-label">' + a.name + '</span><span class="delay-value">' + Math.round(p.d.w[i] * 100) + '%</span></div>'; }).join('');
  return { ok:true, html: '<div class="card"><h4>Your current mix</h4>' + rows + '<div class="gr-note" style="margin-top:8px">Expected return ' + (p.d.portRet*100).toFixed(1) + '% at ' + (p.d.decomp.totalVol*100).toFixed(1) + '% risk.</div></div>' };
}
function briefingAssumptions() {
  const c = cfg();
  const d = c.d;
  const rows = [
    ['Inflation', (d.inflation*100).toFixed(1) + '%'], ['Debt return', (d.debt*100).toFixed(1) + '%'], ['Hybrid return', (d.hybrid*100).toFixed(1) + '%'], ['Equity return', (d.equity*100).toFixed(1) + '%'], ['FD rate', (d.fdRate*100).toFixed(1) + '%'],
  ].map(function (r) { return '<div class="delay-row"><span class="delay-label">' + r[0] + '</span><span class="delay-value">' + r[1] + '</span></div>'; }).join('');
  return { ok:true, html: '<div class="card"><h4>Assumptions for ' + c.name + '</h4>' + rows + '<div class="gr-note" style="margin-top:8px">These are planning defaults; each tool lets you override them.</div></div>' };
}
function briefingNext() {
  return { ok:true, html: '<div class="card"><h4>What to do next</h4><div class="gr-note">Open the tool that produced these numbers to adjust any assumption and watch the result change live. Ask me to explain any figure and I\'ll ground it in your own screen.</div></div>' };
}

function briefingComparison() {
  if (!advisorComparison) return { ok:false, error:'No comparison prepared yet.' };
  const cmp = advisorComparison;
  const stat = function (label, a, b, delta) {
    return '<div class="stat"><div class="stat-label">'+label+'</div><div class="stat-value">'+a+' → '+b+'</div><div class="stat-sub" style="color:var(--gold)">'+delta+'</div></div>';
  };
  const sign = function (n) { return (n >= 0 ? '+' : '') + n.toFixed(2); };
  return { ok:true, html: '<div class="card"><h4>'+cmp.a.label+' vs '+cmp.b.label+'</h4><div class="stat-row">' +
    stat('Expected return', cmp.a.returnPct.toFixed(2)+'%', cmp.b.returnPct.toFixed(2)+'%', sign(cmp.b.returnPct-cmp.a.returnPct)+' pts') +
    stat('Risk', cmp.a.riskPct.toFixed(2)+'%', cmp.b.riskPct.toFixed(2)+'%', sign(cmp.b.riskPct-cmp.a.riskPct)+' pts') +
    stat('Sharpe', cmp.a.sharpe.toFixed(2), cmp.b.sharpe.toFixed(2), sign(cmp.b.sharpe-cmp.a.sharpe)) +
    '</div></div>' };
}

const BRIEFING_SECTIONS = {
  headline: { title: 'Your number', build: briefingHeadline },
  retirement: { title: 'Retirement projection', build: resultCanvasRetirement },
  drawdown: { title: 'Drawdown & longevity', build: resultCanvasSWP },
  montecarlo: { title: 'Monte Carlo outcome range', build: resultCanvasMC },
  stress: { title: 'Stress test vs a historical crash', build: briefingStress },
  allocation: { title: 'Portfolio allocation', build: briefingAllocation },
  frontier: { title: 'Efficient frontier', build: resultCanvasPortfolio },
  live: { title: 'Live-instrument comparison', build: resultCanvasLiveFrontier },
  stepup: { title: 'Step-up SIP', build: resultCanvasStepUp },
  fx: { title: 'Cross-border FX', build: resultCanvasFX },
  joint: { title: 'Joint children corpus', build: resultCanvasJoint },
  health: { title: 'Plan health', build: resultCanvasHealth },
  assumptions: { title: 'Assumptions used', build: briefingAssumptions },
  next: { title: 'What to do next', build: briefingNext },
  comparison: { title: 'Side-by-side comparison', build: briefingComparison },
};

function executeAdvisorTool(name, args) {
  if (name === 'get_state') {
    return JSON.stringify({ state: stateForAdvisor(), tab: L.tab, tabs: ADVISOR_TABS });
  }
  if (name === 'get_price_history') return JSON.stringify(advisorGetPriceHistory(args && args.symbol, args && args.granularity));
  if (name === 'get_instrument_stats') return JSON.stringify(advisorGetInstrumentStats(args && args.symbol));
  if (name === 'get_detail') return JSON.stringify(advisorGetDetail(args && args.path));
  if (name === 'get_results') return JSON.stringify(advisorGetResults());
  if (name === 'read_current_chart') return JSON.stringify(advisorReadCurrentChart());
  if (name === 'read_current_result') return JSON.stringify(advisorReadCurrentResult());
  if (name === 'navigate') {
    const tab = args && args.tab;
    if (!ADVISOR_TABS.includes(tab)) return JSON.stringify({ ok:false, error:'No tab named "'+tab+'". Valid: '+ADVISOR_TABS.join(', ') });
    L.tab = tab;
    render();
    return JSON.stringify({ ok:true, tab });
  }
  if (name === 'set_value') return JSON.stringify(advisorSetValue(args && args.field, args && args.value));
  if (name === 'run_full_analysis') {
    const start = performance.now();
    const tab = args && args.tab;
    const params = (args && args.params) || {};
    const PREFIX = { retirement:'ret', stepup:'step', swp:'swp', fx:'fx', joint:'joint', mc:'mc', health:'health' };
    if (!PREFIX[tab]) return JSON.stringify({ ok:false, error:'Invalid tab. Valid: retirement, stepup, swp, fx, joint, mc, health. (portfolio/livefrontier use set_weights/add_instrument.)' });
    if (typeof params !== 'object' || Array.isArray(params)) return JSON.stringify({ ok:false, error:'params must be an object.' });
    const prefix = PREFIX[tab];
    L.tab = tab;
    const setFields = [];
    const skipped = [];
    for (const k in params) {
      // Accept bare names (preRate) or full dotted paths (ret.preRate).
      const field = (k.indexOf('.') !== -1) ? k : (prefix + '.' + k);
      if (!ADVISOR_FIELDS[field]) { skipped.push(k); continue; }
      const r = advisorSetValue(field, params[k]);
      if (!r.ok) return JSON.stringify({ ok:false, error:r.error, failedField:field });
      setFields.push(field);
    }
    render();
    const results = advisorGetResults();
    console.log('[skill-metric] run_full_analysis ' + (performance.now()-start).toFixed(0) + 'ms');
    return JSON.stringify({ ok:true, results: results.result, flags: results.flags, setFields: setFields, skipped: skipped });
  }
  if (name === 'read_other_page') return JSON.stringify(readOtherPage(args && args.page));
  if (name === 'set_weights') return JSON.stringify(advisorSetWeights(args && args.weights));
  if (name === 'apply_preset') return JSON.stringify(advisorApplyPreset(args && args.name));
  if (name === 'analyze_portfolio') return JSON.stringify(advisorAnalyzePortfolio());
  if (name === 'frontier_gap') return JSON.stringify(advisorFrontierGap());
  if (name === 'list_assets') return JSON.stringify(advisorListAssets());
  if (name === 'search_instruments') return advisorSearchInstruments(args && args.query);
  if (name === 'add_instrument') return advisorAddInstrument(args && args.symbol);
  if (name === 'get_financial_statements') return advisorGetFinancialStatements(args && args.symbol);
  if (name === 'get_statements_state') return JSON.stringify(advisorStatementsState());
  if (name === 'pin_row') return JSON.stringify(advisorStatementsPinRow(args && args.section, args && args.label));
  if (name === 'unpin_row') return JSON.stringify(advisorStatementsUnpinRow(args && args.section, args && args.label));
  if (name === 'set_company') return JSON.stringify(advisorStatementsSetCompany(args && args.symbol));
  if (name === 'set_compare') return JSON.stringify(advisorStatementsSetCompare(args && args.symbol));
  if (name === 'focus_year') return JSON.stringify(advisorStatementsFocusYear(args && args.year));
  if (name === 'open_definition') return JSON.stringify(advisorStatementsOpenDefinition(args && args.label));
  if (name === 'explain_bench') return JSON.stringify(advisorStatementsExplainBench());
  if (name === 'remove_instrument') return JSON.stringify(advisorRemoveInstrument(args && args.symbol));
  if (name === 'compare_live') return JSON.stringify(advisorCompareLive());
  if (name === 'run_monte_carlo') return JSON.stringify(advisorRunMonteCarlo(args || {}));
  if (name === 'stress_test') return JSON.stringify(advisorStressTest(args && args.scenario));
  if (name === 'explain_metric') return JSON.stringify(advisorExplainMetric(args && args.metric));
  if (name === 'optimize_for') return JSON.stringify(advisorOptimizeFor(args && args.objective));
  if (name === 'compare_scenarios') return advisorCompareScenarios(args && args.a, args && args.b);
  if (name === 'why_this_weight') return JSON.stringify(advisorWhyThisWeight(args && args.asset));
  if (name === 'explain_instrument') return JSON.stringify(advisorExplainInstrument(args && args.symbol));
  if (name === 'highlight') return JSON.stringify(advisorHighlight(args && args.element));
  if (name === 'scroll_to') return JSON.stringify(advisorHighlight(args && args.element));
  return JSON.stringify({ ok:false, error:'Unknown tool: '+name });
}

// F2a — human-readable narration of each tool call, shown as a quiet step row.
function advisorDescribeTool(name, args) {
  args = args || {};
  const tabLabel = function (id) { const t = TABS.find(function (x) { return x.id === id; }); return t ? t.label : id; };
  switch (name) {
    case 'navigate': return 'Opening ' + tabLabel(args.tab);
    case 'set_value': return 'Setting ' + args.field + ' to ' + args.value;
    case 'get_results': return 'Calculating the current result';
    case 'get_state': return 'Reading your inputs';
    case 'get_price_history': return 'Looking up price history for ' + args.symbol;
    case 'get_instrument_stats': return 'Reading statistics for ' + args.symbol;
    case 'get_detail': return 'Checking ' + args.path;
    case 'list_assets': return 'Listing the building blocks';
    case 'set_weights': return 'Adjusting the portfolio mix';
    case 'apply_preset': return 'Applying the ' + args.name + ' preset';
    case 'analyze_portfolio': return 'Analyzing the current mix';
    case 'frontier_gap': return 'Checking the gap to the efficient frontier';
    case 'search_instruments': return 'Searching for ' + args.query;
    case 'add_instrument': return 'Adding ' + args.symbol;
    case 'get_financial_statements': return 'Pulling financial statements for ' + args.symbol;
    case 'get_statements_state': return 'Reading the statements screen';
    case 'pin_row': return 'Pinning ' + args.label;
    case 'unpin_row': return 'Unpinning ' + args.label;
    case 'set_company': return 'Opening ' + args.symbol;
    case 'set_compare': return args.symbol ? 'Comparing against ' + args.symbol : 'Removing the comparison';
    case 'focus_year': return args.year ? 'Focusing FY' + args.year : 'Clearing the year focus';
    case 'open_definition': return 'Looking up ' + args.label;
    case 'explain_bench': return 'Reading the Bench';
    case 'remove_instrument': return 'Removing ' + args.symbol;
    case 'compare_live': return 'Comparing the live holdings';
    case 'run_monte_carlo': return 'Running 1,000 simulations';
    case 'stress_test': return 'Stress-testing against ' + args.scenario;
    case 'explain_metric': return 'Explaining your ' + args.metric;
    case 'optimize_for': return 'Finding the ' + args.objective + ' mix';
    case 'compare_scenarios': return 'Comparing two scenarios';
    case 'why_this_weight': return 'Explaining the ' + args.asset + ' weight';
    case 'explain_instrument': return 'Explaining ' + args.symbol;
    case 'highlight': case 'scroll_to': return 'Pointing you at the ' + args.element;
    case 'compose_briefing': return 'Putting together your briefing';
    case 'run_full_analysis': return 'Running the ' + tabLabel(args.tab) + ' analysis';
    case 'read_other_page': return 'Reading your saved ' + (OTHER_PAGE_LABELS[args.page] || args.page) + ' data';
    default: return null;
  }
}

      'stepup':    ['Why does stepping up beat a flat SIP?', 'What if my income grows slower?', 'How much of the gain is real vs inflation?'],

  greeting: 'Hi! I can run any of these tools for you. Tell me what you\'re trying to figure out, or just ask a question.',
  placeholder: 'Ask, or tap the mic…',
  showDisclaimer: true
};
