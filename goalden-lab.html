function portfolioReturn(weights, returns){ return weights.reduce((s,w,i)=>s+w*returns[i],0); }
function portfolioVariance(weights, vols, corr){
  let v=0;
  for(let i=0;i<weights.length;i++) for(let j=0;j<weights.length;j++) v+=weights[i]*weights[j]*vols[i]*vols[j]*corr[i][j];
  return v;
}
function portfolioBeta(weights, betas){ return weights.reduce((s,w,i)=>s+w*betas[i],0); }

// Rigorous systematic/unsystematic risk split via the single-index model,
// computed directly from the covariance matrix rather than the
// hand-assigned per-asset beta above — guarantees beta=1.00 exactly for
// 100% market and unsystematic risk >= 0 always, since both are
// structural properties of covariance projection, not approximations.
// marketIdx is the asset used as the market proxy (index 0 in each list:
// Large Cap Equity for India, Total-Market Equity for the US).
function decomposeRisk(weights, vols, corr, marketIdx){
  const marketVol = vols[marketIdx];
  const totalVar = portfolioVariance(weights, vols, corr);
  let covWithMarket = 0;
  for(let i=0;i<weights.length;i++) covWithMarket += weights[i]*vols[i]*marketVol*corr[i][marketIdx];
  const beta = covWithMarket / (marketVol*marketVol);
  const systematicVar = beta*beta*marketVol*marketVol;
  const unsystematicVar = Math.max(0, totalVar - systematicVar);
  return {
    totalVol: Math.sqrt(totalVar), beta,
    systematicVol: Math.sqrt(systematicVar),
    unsystematicVol: Math.sqrt(unsystematicVar),
    unsystematicPct: totalVar>0 ? unsystematicVar/totalVar : 0,
    systematicPct: totalVar>0 ? systematicVar/totalVar : 0,
  };
}
// Standard normal PDF/CDF, used for the closed-form Sortino ratio below.
// CDF uses the Abramowitz-Stegun approximation (max error ~7.5e-8),
// verified against a 500,000-draw Monte Carlo before use -- matched to
// within 0.03% across every realistic return/risk/target combination
// tested, and to the exact known closed-form (downside deviation =
// vol/sqrt(2) when the target equals the mean) as a sanity anchor.
function stdNormPDF(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
function stdNormCDF(x){
  const t=1/(1+0.2316419*Math.abs(x));
  const d=0.3989423*Math.exp(-x*x/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return x>0?1-p:p;
}
// Closed-form lower partial moment of order 2 for a normal distribution,
// i.e. E[(min(X-T,0))^2] for X ~ N(mu, sigma^2). This is downside
// deviation squared, the denominator of the Sortino ratio.
function downsideDeviation(mu, sigma, target){
  if(sigma<=0) return 0;
  const z=(target-mu)/sigma;
  const lpm2 = sigma*sigma*((1+z*z)*stdNormCDF(z) + z*stdNormPDF(z));
  return Math.sqrt(Math.max(0,lpm2));
}
// Sharpe, Sortino, diversification ratio, and effective number of
// holdings for the live mix. All closed-form, no simulation, cheap
// enough to recompute on every single slider tick.
// One-year 95% VaR and CVaR (expected shortfall), closed-form for a
// normal return distribution. Verified against a 50,000-draw simulation
// before use (matched to within 0.001 on both figures). Framed as a loss
// (positive number = how far down), which is how these are actually
// quoted in practice, not as a raw negative return.
function portfolioTailRisk(d){
  const Z95 = 1.6448536269514722, PHI_Z95_OVER_005 = 2.0627128075074275;
  const mu = d.portRet, sigma = d.decomp.totalVol;
  const var95 = -(mu - Z95*sigma);
  const cvar95 = -(mu - sigma*PHI_Z95_OVER_005);
  return { var95, cvar95 };
}
function portfolioRatios(d, c){
  const rf = c.d.fdRate;
  // An empty (all-zero, e.g. freshly Reset) mix has zero risk and zero
  // return -- these ratios are all divisions by that zero risk, which
  // would otherwise surface as -Infinity/NaN/Infinity rather than
  // meaningfully "nothing selected yet".
  const empty = d.decomp.totalVol<=0;
  const sharpe = empty ? 0 : (d.portRet - rf) / d.decomp.totalVol;
  const dd = downsideDeviation(d.portRet, d.decomp.totalVol, rf);
  const sortino = dd > 1e-9 ? (d.portRet - rf) / dd : null; // null = downside risk is negligible
  const weightedAvgVol = d.w.reduce((s,wi,i)=>s+wi*d.vols[i], 0);
  const divRatio = empty ? 1 : weightedAvgVol / d.decomp.totalVol;
  const sumSq = d.w.reduce((s,wi)=>s+wi*wi, 0);
  const effN = sumSq>0 ? 1/sumSq : 0;
  return {sharpe, sortino, downsideDev:dd, divRatio, effN, rf};
}
// Euler decomposition of risk: how much of total portfolio VOLATILITY
// (not variance) each asset is responsible for, given its weight and how
// it covaries with everything else. These sum to exactly the portfolio's
// total volatility by construction, verified by hand before use. A
// negative contribution is a real, meaningful result: it means that
// asset was, on net, working against the portfolio's swings over this
// return/correlation structure, not just holding still.
function riskContributions(d, corr){
  const {w, vols} = d;
  const portVol = d.decomp.totalVol;
  if(portVol<=0) return w.map(()=>0);
  return w.map((wi,i)=>{
    const covWithPort = w.reduce((s,wj,j)=>s+wj*vols[i]*vols[j]*corr[i][j], 0);
    return (wi * covWithPort / portVol) / portVol; // fraction of total vol, sums to 1
  });
}
function normalizeWeights(raw){
  const sum=raw.reduce((a,b)=>a+b,0);
  return sum>0 ? raw.map(w=>w/sum) : raw.map(()=>1/raw.length);
}
// Rounding 15 independent fractions to whole percents for display can miss
// or overshoot 100 by a point or two (classic apportionment problem — the
// exact thing a person adding up the numbers by hand would notice and
// distrust). Largest-remainder method: floor everything, then hand the
// leftover points to whichever assets had the biggest rounded-off remainder,
// so the displayed integers always sum to exactly 100.
function roundPercentsTo100(weights){
  if(weights.every(w=>w===0)) return weights.map(()=>0);
  const raw = weights.map(w=>w*100);
  const floors = raw.map(Math.floor);
  let remainder = 100 - floors.reduce((a,b)=>a+b,0);
  const order = raw.map((v,i)=>({i, frac: v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
  const result = floors.slice();
  for(let k=0; k<remainder && k<order.length; k++) result[order[k].i] += 1;
  return result;
}

function randomWeights(n, rng){
  const cuts=[0,1];
  for(let i=0;i<n-1;i++) cuts.push(rng());
  cuts.sort((a,b)=>a-b);
  const w=[];
  for(let i=0;i<n;i++) w.push(cuts[i+1]-cuts[i]);
  return w;
}

function generateFrontier(returns, vols, corr, n, seed){
  const rng=mulberry32(seed);
  const cloud=[];
  for(let i=0;i<n;i++){
    const w=randomWeights(returns.length, rng);
    cloud.push({ w, ret:portfolioReturn(w,returns), vol:Math.sqrt(portfolioVariance(w,vols,corr)) });
  }
  const minV=Math.min(...cloud.map(p=>p.vol)), maxV=Math.max(...cloud.map(p=>p.vol));
  const bins=40, binW=(maxV-minV)/bins;
  const best=new Array(bins).fill(null);
  cloud.forEach(p=>{
    let b=Math.min(bins-1,Math.floor((p.vol-minV)/(binW||1)));
    if(!best[b]||p.ret>best[b].ret) best[b]=p;
  });
  return { cloud, frontier:best.filter(Boolean).sort((a,b)=>a.vol-b.vol) };
}

/* =====================================================================
   JOINT CHILDREN EDUCATION CORPUS SOLVER (B-03)
   Verified against three cases: gap-year saving (₹30,181/yr kept vs
   separate corpora), mid-timeline binding constraint (never goes
   negative even when the tightest point is mid-plan, not the end),
   and exact reduction to the standard single-goal engine when rates
   are held constant.
   ===================================================================== */
function solveJointEducationCorpus({children, eduInflation, preRate, parkRate, sipStopYear, horizon}){
  function simulate(sip){
    let bal=0, minBal=Infinity, minYear=0;
    const rows=[];
    for(let t=1;t<=horizon;t++){
      let fees=0;
      children.forEach(ch=>{
        const s=ch.yearsToStart+1, e=ch.yearsToStart+ch.duration;
        if(t>=s && t<=e) fees += ch.annualFeeToday*Math.pow(1+eduInflation, t-1);
      });
      const contrib = t<=sipStopYear ? sip : 0;
      const anyNear = children.some(ch => t>=ch.yearsToStart);
      const rate = anyNear ? parkRate : preRate;
      const after = bal + contrib - fees;
      if(after<minBal){minBal=after; minYear=t;}
      bal = after*(1+rate);
      rows.push({year:t, contrib:Math.round(contrib), fees:Math.round(fees), rate, close:Math.round(bal)});
    }
    return{finalBal:bal, minBal, minYear, rows};
  }
  let lo=0, hi=50000000;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    simulate(mid).minBal >= 0 ? hi=mid : lo=mid;
  }
  return{sip:hi, ...simulate(hi)};
}

function separateCorporaTotal({children, eduInflation, preRate, parkRate}){
  let total=0;
  children.forEach(ch=>{
    const r = solveJointEducationCorpus({
      children:[ch], eduInflation, preRate, parkRate,
      sipStopYear: ch.yearsToStart, horizon: ch.yearsToStart+ch.duration,
    });
    total += r.sip;
  });
  return total;
}


/* =====================================================================
   FX MODULE (verbatim port of fx.js)
   ===================================================================== */
function fxInvestingAbroad(principal, foreignReturn, homeDeprec, years){
  return principal * Math.pow((1+foreignReturn)*(1+homeDeprec), years);
}
function fxReceivingFromAbroad(principal, foreignReturn, foreignDeprec, years){
  return principal * Math.pow((1+foreignReturn)/(1+foreignDeprec), years);
}
function fxCompare({principal, direction, homeReturn, foreignReturn, depreciationRate, years}){
  const domesticFV = principal * Math.pow(1+homeReturn, years);
  const crossBorderFV = direction==='investingAbroad'
    ? fxInvestingAbroad(principal, foreignReturn, depreciationRate, years)
    : fxReceivingFromAbroad(principal, foreignReturn, depreciationRate, years);
  const marketOnlyFV = principal * Math.pow(1+foreignReturn, years);
  const currencyEffect = crossBorderFV - marketOnlyFV;
  const effectiveAnnualReturn = Math.pow(crossBorderFV/principal, 1/years) - 1;
  return {domesticFV, crossBorderFV, marketOnlyFV, currencyEffect, effectiveAnnualReturn, foreignBeatsHome: crossBorderFV>domesticFV};
}

function yearlyAmortization(monthlyRows){
  const years=[];
  let prevClose=0, prevContributed=0;
  for(let m=0; m<monthlyRows.length; m+=12){
    const yearEndRow = monthlyRows[Math.min(m+11, monthlyRows.length-1)];
    const contributedThisYear = yearEndRow.contributed - prevContributed;
    const growthThisYear = yearEndRow.closeBal - prevClose - contributedThisYear;
    years.push({
      year: years.length+1,
      contributedThisYear: Math.round(contributedThisYear),
      growthThisYear: Math.round(growthThisYear),
      closeBal: Math.round(yearEndRow.closeBal),
    });
    prevClose = yearEndRow.closeBal;
    prevContributed = yearEndRow.contributed;
  }
  return years;
}
// mountainChart() labels each data point "Year N" from the point's raw
// array index -- feeding it accumulationSchedule()'s rows directly (one
// row per MONTH) mislabels month 109 as "Year 109" instead of showing
// one point per actual year. Bucket to yearly first.
function yearlyMountainRows(monthlyRows){
  let contributed=0;
  return yearlyAmortization(monthlyRows).map(y=>{
    contributed+=y.contributedThisYear;
    return {year:y.year, contributed, closeBal:y.closeBal};
  });
}

// real marker, not left for the reader to guess from the shape of the
// line. Shock-year markers (existing feature) are preserved as-is.
function drawdownChart(rows, c, chartId, h){

  for(const r of rows){ if(r.closeBal<=0){ depletedYear=r.year; break; } }
  const prematureDepletion = depletedYear!==null && depletedYear<n;
  const startVal=Math.max(rows[0].openBal, 0);
  const endVal=rows[n-1].closeBal;
  const endLabelText = prematureDepletion ? `Runs out, yr ${depletedYear}` : (endVal<=0?'Reaches zero as planned':'Ends at '+fmt(endVal));
  const endLabelColor = prematureDepletion ? '#E8977A' : '#8FC79E';
  const shockPoints = rows.map((r,i)=>(r.rate!==undefined && r.rate<-0.05) ? [i, r.closeBal] : null).filter(Boolean);
  const series=[
    { name:'Balance', type:'line', data:rows.map(r=>r.closeBal), showSymbol:false,

      markPoint:{symbol:'circle', symbolSize:9,

        label:{show:true, formatter:()=>endLabelText, position:'top', color:endLabelColor, fontWeight:600, fontFamily:"'Spline Sans Mono',monospace", fontSize:12}},
      z:2 },
  ];
  if(shockPoints.length) series.push({ name:'Shock year', type:'scatter', data:shockPoints, symbolSize:8, itemStyle:{color:'#E8977A'}, z:3,
    tooltip:{formatter:p=>`Shock year<br/>Balance: ${fmt(p.value[1])}`} });
  initChart(chartId, {
    grid:{left:4,right:4,top:28,bottom:24,containLabel:false},
    xAxis:{type:'category', data:rows.map((r,i)=>'Yr '+(r.year!==undefined?r.year:i+1)), boundaryGap:false,
      axisLabel:{show:true, interval:(idx)=>idx===0||idx===n-1, color:'rgba(20,40,63,.4)', fontSize:11},

      const p=params.find(pp=>pp.seriesName==='Balance')||params[0];

function calcRetLab(){
  const c=cfg(), r=L.ret;
  const yrs=r.retireAge-r.age;
  const drawYrs=Math.max(5, r.lifeExp-r.retireAge);
  const infl=r.inflation/100, preR=r.preRate/100, postR=r.postRate/100;
  const rr=realRate(postR, infl);
  let expAtRet, corpus;
  if(r.corpusMode==='custom'){
    // The person names the pot; the plan solves backwards from it.
    // If they typed the amount in today's money, inflate it to the
    // retirement date first so the target keeps its purchasing power.
    corpus = r.customBasis==='today' ? r.customCorpus*Math.pow(1+infl, yrs) : r.customCorpus;
    // What that pot sustainably supports: the same inverse-annuity used
    // by the Sustainable Withdrawal tab, so both tabs agree by construction.
    expAtRet = swpWithdrawal(rr, drawYrs, corpus, r.due);
  } else {
    expAtRet=inflateExpense(r.monthlyExpense*12, [{rate:infl, years:yrs}], r.lifestyleFactor/100);
    corpus=corpusRequired(rr, drawYrs, expAtRet, r.due);
  }
  const mRate=effectiveMonthlyRate(preR);
  // Existing savings assumed to keep compounding at the same rate as the
  // new SIP, so existingFV + gapCorpus lands on the full target corpus
  // exactly — same identity used in both doors.
  const existing=r.existingSavings||0;
  const existingFV=existing*Math.pow(1+mRate, yrs*12);
  const gapCorpus=Math.max(0, corpus-existingFV);
  const sip=solveSIP(mRate, yrs*12, gapCorpus, r.due);
  const realCorpus=corpus/Math.pow(1+infl, yrs);
  const accRows=accumulationSchedule({sip, rate:mRate, periods:yrs*12, due:r.due, opening:existing}).rows;

  let ddRows, shockInfo=null;
  if(r.shock){
    const ep=c.episodes.find(e=>e.id===r.shock.epId);
    const res=drawdownWithShock({openingCorpus:corpus, firstWithdrawal:expAtRet, inflation:infl, nominalRate:postR, years:drawYrs, due:r.due}, r.shock.year, ep.rate);
    ddRows=res.rows;
    shockInfo={ep, ranOutYear:res.ranOutYear, finalBalance:res.finalBalance};
  } else {
    const res=drawdownWithShock({openingCorpus:corpus, firstWithdrawal:expAtRet, inflation:infl, nominalRate:postR, years:drawYrs, due:r.due}, -1, 0);
    ddRows=res.rows;
  }

  return {yrs, drawYrs, expAtRet, corpus, sip, realCorpus, accRows, ddRows, shockInfo, existing, existingFV, gapCorpus};
}

// The drawdown Monte Carlo simulates 1,000 paths over the full spending
// phase, comparable cost to the MC tab's own accumulation simulation
// (that one needed a debounce to stay under 16ms per tick; this one is no
// cheaper). renderRetirement() runs synchronously on every slider tick for
// this tab, so this card must NEVER compute inline there — only this
// debounced job touches monteCarloDrawdown, and it patches the card's own
// container directly rather than forcing a full tab re-render.
let ddmcTimer=null;
let lastDDMCHtml='';
function renderDDMCBody(res){
  const r=L.ret, c=cfg();
  const shockEp = r.shock ? c.episodes.find(e=>e.id===r.shock.epId) : null;
  const shockYear = shockEp ? Math.min(r.shock.year, res.drawYrs) : null;
  const mc=monteCarloDrawdown({openingCorpus:res.corpus, firstWithdrawal:res.expAtRet, inflation:r.inflation/100,
    meanReturn:r.postRate/100, volatility:r.ddVol/100, years:res.drawYrs, due:r.due, seed:r.ddSeed, n:1000,
    shockYear, shockReturn:shockEp?shockEp.rate:null});
  const survPct=Math.round(mc.survivalPct*100);
  // A zero-margin corpus (the plan is deliberately sized to reach exactly
  // zero with no buffer) means P10 and, very often, P50 too represent a
  // path that ran out. A flat "₹0" for both tells the reader nothing and
  // stops differentiating the moment survival drops under 50%, which can
  // happen at very low volatility. Show WHEN that percentile's path ran
  // out instead, since that keeps changing meaningfully as volatility
  // rises even after the ending-balance number itself has flatlined.
  const p10IsFail = mc.p10Detail.ranOut !== null;
  const p50IsFail = mc.p50Detail.ranOut !== null;
  const p10Html = p10IsFail
    ? `<span style="color:#E8977A">Ran out, yr ${mc.p10Detail.ranOut}</span>`
    : `<span style="color:#E8977A">${c.compact(mc.p10Detail.bal)}</span>`;
  const p50Html = p50IsFail
    ? `<span style="color:#E8977A">Ran out, yr ${mc.p50Detail.ranOut}</span>`
    : c.compact(mc.p50Detail.bal);
  const html=`<div class="stat-row" style="margin-top:10px">
    <div class="stat"><div class="stat-label">Survives to age ${r.lifeExp}${infoIcon('Share of the 1,000 simulated paths that never hit zero before the plan ends. Below 100% means pure return-order randomness, not a wrong average, can still empty the pot.')}</div><div class="stat-value" style="color:${survPct>=90?'#8FC79E':survPct>=70?'#2557C7':'#E8977A'}">${survPct}%</div><div class="stat-sub">${mc.failCount} of ${mc.n} paths ran out${mc.medianRuinYear?`, typically by year ${mc.medianRuinYear}`:''}</div></div>
    <div class="stat"><div class="stat-label">P10 outcome${infoIcon('The 10th-percentile path: 9 in 10 simulated paths did at least this well. If even this path ran out of money, the year shown is when, not a balance, since it never had one left.')}</div><div class="stat-value" style="font-size:22px">${p10Html}</div></div>
    <div class="stat"><div class="stat-label">P50 outcome${infoIcon('The median simulated path: half did better than this, half worse. If survival is below 50%, the typical path itself runs out, which is exactly what this is reporting.')}</div><div class="stat-value" style="font-size:22px">${p50Html}</div></div>
  </div>
  <div class="cap" style="margin-top:10px">${shockEp?`With ${shockEp.label} forced into drawdown year ${shockYear} of every path, plus normal random volatility elsewhere. `:''}Fan of 1,000 simulated drawdown paths, seed ${r.ddSeed}</div>
  ${fanChart(mc.yearBands, 'ret-ddmc-fan')}`;
  lastDDMCHtml=html;
  return html;
}
function scheduleDDMCUpdate(delay){
  if(ddmcTimer) clearTimeout(ddmcTimer);
  ddmcTimer=setTimeout(()=>{
    ddmcTimer=null;
    const body=document.getElementById('ret-ddmc-body');
    if(body){ body.innerHTML=renderDDMCBody(calcRetLab()); }
  }, delay===undefined?150:delay);
}

function snapshotCompareNote(){
  const [a,b] = L.snapshots;
  if(a.currency.code !== b.currency.code) return 'These two snapshots use different countries, so the corpus figures are not directly comparable in one currency.';
  const diff = b.corpus - a.corpus;
  const pct = a.corpus !== 0 ? (diff/a.corpus*100) : 0;
  return `${b.label} needs ${a.currency.compact(Math.abs(diff))} ${diff>=0?'more':'less'} than ${a.label} (${diff>=0?'+':''}${pct.toFixed(1)}%).`;
}

// Gap to frontier: interpolate the frontier's return at the same risk
// level as the current mix. Returns null if the gap isn't meaningful.
function frontierGap(frontier, currentPoint){
  for(let i=0;i<frontier.length-1;i++){
    const a=frontier[i], b=frontier[i+1];
    if(currentPoint.vol>=a.vol && currentPoint.vol<=b.vol){
      const t=(b.vol-a.vol)>1e-9 ? (currentPoint.vol-a.vol)/(b.vol-a.vol) : 0;
      const frontierRetHere = a.ret + t*(b.ret-a.ret);
      const gapPct = frontierRetHere - currentPoint.ret;
      if(gapPct > 0.0015) return {frontierRetHere, gapPct};
      return null;
    }
  }
  return null;
}
// Same interpolation as frontierGap but unconditional (no "is this
// meaningful" threshold) -- used by chart tooltips to tell a hovered
// cloud dot how far below the frontier it sits, at its own risk level.
function interpFrontierRet(frontier, vol){
  for(let i=0;i<frontier.length-1;i++){
    const a=frontier[i], b=frontier[i+1];
    if(vol>=a.vol && vol<=b.vol){
      const t=(b.vol-a.vol)>1e-9 ? (vol-a.vol)/(b.vol-a.vol) : 0;
      return a.ret + t*(b.ret-a.ret);
    }
  }
  return null;
}

// Module-scoped, not a DOM attribute: the flashcard's action button is
// re-created via innerHTML on every settle (drag-debounce tick, preset
// click, chart click...), so any listener bound directly to the button
// would be gone by the next tick. One delegated document.body handler
// (wired once, at the end of the script) reads whichever function this
// slot holds at the moment of the actual click instead.
let frontierJumpHandler = null;

// Plain-language "so what" for any risk/return frontier chart, as a
// scannable flashcard rather than a dense paragraph: a retail investor
// can already read the axes and the dots fine, what's usually missing is
// what the numbers actually mean and what to do about it. Verdict
// sentence up top, three at-a-glance stats, an optional one-click action
// to actually close the gap, and the full explanation tucked into a
// collapsed dropdown so nothing from the original prose is lost, just
// no longer forced on every reader by default.
//
// `onJump(w)` is optional and, when given, is whatever the chart's own
// click-to-adopt callback already is (onPortfolioFrontierPick,
// onLiveMultiFrontierPick, ...) — reused as-is rather than duplicated,
// so "click the button" and "click the chart" always agree on what
// adopting a mix means.
function frontierTakeawayHTML(currentPoint, sharpe, frontier, onJump){
  const gap = frontierGap(frontier, currentPoint);
  const pct = v=>(v*100).toFixed(1)+'%';
  // Verdict colour is #5FA875 (on-frontier, good news) or #D97757 (gap,
  // room to improve) -- never --red, which this app reserves for actual
  // errors, not "you could be doing better."
  const verdictColor = gap ? '#D97757' : '#5FA875';
  const verdictText = gap
    ? `You're leaving <b style="color:${verdictColor}">${(gap.gapPct*100).toFixed(1)} points</b> of return on the table at this risk level.`
    : `This mix is already on the best line available &ndash; nothing here earns more for the risk you're taking.`;

  let jumpBtn = '';
  if(gap && onJump){
    // The frontier array is a discrete sample, not a continuous curve, so
    // "the best mix at this risk" means whichever sampled point sits
    // closest by risk to where the current mix actually is.
    let bestIdx=0, bestDist=Infinity;
    frontier.forEach((p,i)=>{ const dist=Math.abs(p.vol-currentPoint.vol); if(dist<bestDist){ bestDist=dist; bestIdx=i; } });
    frontierJumpHandler = ()=>onJump(frontier[bestIdx].w);
    jumpBtn = `<button class="fc-action" data-frontier-jump>Move to the best mix at this risk &rarr;</button>`;
  }

  const detail = `<div>This mix earns <b style="color:var(--paper)">${pct(currentPoint.ret)}</b> a year for <b style="color:var(--paper)">${pct(currentPoint.vol)}</b> risk &ndash; a <span class="term" data-def="Return earned per unit of risk, above a safe baseline (a bank FD). Higher is better: above 1 is generally good, above 2 very good, for a real portfolio over a full market cycle.">Sharpe ratio</span> of <b style="color:var(--gold)">${sharpe.toFixed(2)}</b>. In plain terms: for every extra point of risk this mix takes on above safe cash, it earns about ${sharpe.toFixed(2)} points of extra return.</div>
  <div style="margin-top:8px">${gap
    ? `The blue line is the <i>most</i> return possible at each risk level. At this exact risk (${pct(currentPoint.vol)}), the best mix on it earns <b style="color:#8FC79E">${pct(gap.frontierRetHere)}</b> &ndash; <b style="color:#8FC79E">${(gap.gapPct*100).toFixed(1)} points more</b> than this mix, for the identical risk. Click any point on the blue line, or the button above, to move there.`
    : `This mix already sits right on the blue line &ndash; for the risk being taken, it's already earning about as much as this combination can give.`}</div>`;

  return `<div class="fcard">
    <div class="fc-verdict" style="color:${verdictColor}">${verdictText}</div>
    <div class="fc-tiles">
      <div class="stat fc-tile"><div class="stat-label">Your return</div><div class="stat-value">${pct(currentPoint.ret)}</div></div>
      <div class="stat fc-tile"><div class="stat-label">Your risk</div><div class="stat-value">${pct(currentPoint.vol)}</div></div>
      <div class="stat fc-tile"><div class="stat-label">Sharpe ratio${infoIcon('Return earned per unit of risk, above a safe baseline (a bank FD). Higher is better: above 1 is generally good, above 2 very good.')}</div><div class="stat-value">${sharpe.toFixed(2)}</div></div>
    </div>
    ${jumpBtn}
    ${explainDropdown('Show the full breakdown', detail)}
  </div>`;
}

// Builds the ECharts option for the efficient-frontier chart. Every cloud
// and frontier point carries its own weight vector (`w`, from
// generateFrontier()), so a click handler elsewhere can read
// params.dataIndex straight back into an allocation with no extra lookup.
// The point on the frontier with the highest return per unit of risk
// taken above a safe baseline -- the same tangency idea already marked
// on the Test Real Investments 2-asset chart, generalised to an
// n-asset sampled frontier. rf is Portfolio's illustrative bank-FD rate
// (cfg().d.fdRate) or Test Real Investments' actual rf slider, whichever
// this chart instance was built for.
function bestSharpePoint(frontier, rf){
  let best=null, bestSharpe=-Infinity;
  frontier.forEach(p=>{
    if(p.vol<=0) return;
    const s=(p.ret-rf)/p.vol;
    if(s>bestSharpe){ bestSharpe=s; best=p; }
  });
  return best ? Object.assign({}, best, {sharpe:bestSharpe}) : null;
}
function frontierChartOption(cloud, frontier, assetPoints, currentPoint, rf){
  const gap = frontierGap(frontier, currentPoint);
  const bestSharpe = rf!=null ? bestSharpePoint(frontier, rf) : null;

    silent:true, symbol:['none','none'],
    lineStyle:{color:'#14283F', type:'dashed', width:1.5, opacity:.6},

    data:[[{coord:[currentPoint.vol, currentPoint.ret]}, {coord:[currentPoint.vol, gap.frontierRetHere]}]],
  } : undefined;
  const pct=v=>(v*100).toFixed(2)+'%';
  return {
    animationDurationUpdate: 450,
    animationEasingUpdate: 'cubicOut',
    grid:{left:54, right:20, top:24, bottom:52, containLabel:true},

      type:'value', min:0, name:'RISK: how much this bounces around, per year', nameLocation:'middle', nameGap:30,

      splitLine:{lineStyle:{color:'rgba(20,40,63,.05)'}},

    dataZoom:[{type:'inside', xAxisIndex:0}, {type:'inside', yAxisIndex:0}],
    tooltip:{
      trigger:'item', confine:true, extraCssText:'max-width:290px;white-space:normal;line-height:1.5',
      textStyle:{fontFamily:"'Figtree',sans-serif", fontSize:12},
      formatter(p){
        if(p.seriesName==='Frontier'){
          return `<b>The best you can do at this risk.</b><br/>No mix of these building blocks earned more than ${pct(p.value[1])} while staying at ${pct(p.value[0])} risk.<br/><span style="color:#2557C7">Click to move here.</span>`;

        }

        if(p.seriesName==='Current mix') return `<b>You are here.</b><br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}`;
        if(p.seriesName==='Best Sharpe') return `<b>The best return for the risk you're taking.</b><br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])} &nbsp; Sharpe: ${bestSharpe.sharpe.toFixed(2)}<br/><span style="color:#2557C7">Click to switch to this mix.</span>`;
        return '';
      },

    series:[
      { name:'Cloud', type:'scatter', data:cloud.map(p=>[p.vol,p.ret]), symbolSize:6,
        itemStyle:{color:'rgba(37,87,199,.14)'}, emphasis:{itemStyle:{color:'rgba(37,87,199,.6)'}}, z:1 },
      { name:'Frontier', type:'line', data:frontier.map(p=>[p.vol,p.ret]), smooth:.3, symbol:'circle', symbolSize:6,
        showSymbol:true, itemStyle:{color:'#2557C7'}, lineStyle:{color:'#2557C7', width:2.25},

        emphasis:{itemStyle:{color:'#14283F', borderColor:'#2557C7', borderWidth:2}}, z:2,

        label:{show:true, formatter:p=>{ const ap=assetPoints[p.dataIndex]; return ap && ap.showLabel!==false ? ap.label : ''; }, position:'top', color:'rgba(20,40,63,.6)', fontSize:9, fontFamily:"'Spline Sans Mono',monospace"}, z:3 },
      ...(bestSharpe ? [{ name:'Best Sharpe', type:'scatter', data:[[bestSharpe.vol,bestSharpe.ret]], symbolSize:12,

}

// Renders (or refreshes) the frontier chart in-place. Only Cloud/Frontier
// points carry a stored weight vector `w`, so a click on either calls
// onPointClick with that mix; other series are silent or non-selectable.
// Clicking the Best Sharpe marker adopts that same frontier point's mix.
function renderFrontierChartOption(chartId, cloud, frontier, assetPoints, currentPoint, onPointClick, rf){
  const chart=initChart(chartId, frontierChartOption(cloud, frontier, assetPoints, currentPoint, rf));
  if(!chart) return;
  chart.off('click');
  if(onPointClick){
    const best = rf!=null ? bestSharpePoint(frontier, rf) : null;
    chart.on('click', params=>{
      if(params.seriesName==='Cloud' && cloud[params.dataIndex]) onPointClick(cloud[params.dataIndex].w);
      else if(params.seriesName==='Frontier' && frontier[params.dataIndex]) onPointClick(frontier[params.dataIndex].w);
      else if(params.seriesName==='Best Sharpe' && best) onPointClick(best.w);
    });
  }
}

// rf (decimal, e.g. 0.065) is optional -- omit it and the chart drops the
// Best Sharpe marker entirely rather than showing a wrong one. Portfolio
// passes cfg().d.fdRate (the illustrative bank-FD baseline used for its
// Sharpe ratio everywhere else); Test Real Investments passes its actual
// rf slider value.
function frontierChart(cloud, frontier, assetPoints, currentPoint, chartId, onPointClick, rf){
  deferChartInit(()=>renderFrontierChartOption(chartId, cloud, frontier, assetPoints, currentPoint, onPointClick, rf));
  return `<div class="fx-chart-wrap">
    <div id="${chartId}" class="echart" style="height:400px"></div>
    <div class="fx-legend">
      <span><i style="background:#2557C7"></i>The frontier: the best return possible at each risk level</span>
      <span><i style="background:#8FC79E;border-radius:50%"></i>A single building block on its own</span>
      ${rf!=null ? `<span><i style="border:2px solid #2557C7;background:#14283F"></i>Best return for the risk you're taking, after a safe cash baseline</span>` : ''}
      <span><i style="border:2px solid #D97757;background:transparent"></i>Your current mix</span>
      <span><i style="border-top:2px dashed rgba(20,40,63,.7);background:transparent"></i>Return left on the table at this risk level &middot; click any point to try that mix</span>
    </div>
  </div>`;
}

function fanChart(yearBands, chartId, h){
  if(h===undefined)h=240;
  deferChartInit(()=>renderFanChartOption(chartId, yearBands));
  return `<div id="${chartId}" class="echart" style="height:${h}px"></div>`;
}
// Bands are two stacked area series each (an invisible base up to the low
// bound, then a visible fill for low-to-high), a standard ECharts technique
// for a shaded range that isn't anchored to zero — matches the original
// hand-rolled polygon-band shape exactly, but now genuinely hoverable.
function renderFanChartOption(chartId, yearBands){
  const c=cfg();
  const n=yearBands.length;
  initChart(chartId, {
    grid:{left:4,right:4,top:8,bottom:20,containLabel:false},
    xAxis:{type:'category', data:yearBands.map((b,i)=>'Yr '+(i+1)), boundaryGap:false,
      axisLabel:{color:'rgba(20,40,63,.4)', fontSize:10, interval:(idx)=>idx===0||idx===n-1},
      axisLine:{show:false}, axisTick:{show:false}, splitLine:{show:false}},
    yAxis:{type:'value', show:false, min:0},
    tooltip:{trigger:'axis', formatter(params){
      const idx=params[0].dataIndex, b=yearBands[idx];
      return `Year ${idx+1}<br/>P90: ${c.compact(b.p90)} &middot; P75: ${c.compact(b.p75)}<br/>P50: ${c.compact(b.p50)}<br/>P25: ${c.compact(b.p25)} &middot; P10: ${c.compact(b.p10)}`;
    }},

      { name:'base90', type:'line', stack:'s90', data:yearBands.map(b=>b.p10), showSymbol:false, lineStyle:{opacity:0}, tooltip:{show:false}, z:1 },
      { name:'P10-P90', type:'line', stack:'s90', data:yearBands.map(b=>b.p90-b.p10), showSymbol:false, lineStyle:{opacity:0}, areaStyle:{color:'rgba(37,87,199,.12)'}, tooltip:{show:false}, z:1 },
      { name:'base75', type:'line', stack:'s75', data:yearBands.map(b=>b.p25), showSymbol:false, lineStyle:{opacity:0}, tooltip:{show:false}, z:2 },
      { name:'P25-P75', type:'line', stack:'s75', data:yearBands.map(b=>b.p75-b.p25), showSymbol:false, lineStyle:{opacity:0}, areaStyle:{color:'rgba(37,87,199,.22)'}, tooltip:{show:false}, z:2 },
      { name:'Median', type:'line', data:yearBands.map(b=>b.p50), showSymbol:false, lineStyle:{color:'#2557C7', width:2}, z:3 },
    ],
  });
}

/* =====================================================================

   ===================================================================== */
function renderMC(){
  const c=cfg(), m=L.mc;
  const regime=REGIME_PRESETS[m.regime];
  const meanReturn=(m.meanReturn/100)*regime.meanAdj;
  const volatility=(m.volatility/100)*regime.volAdj;
  const res=monteCarloAccumulation({sip:m.sip, meanReturn, volatility, years:m.years, due:true, seed:m.seed, n:1000});

  // Twin fates: bull vs bear side by side (C-07)
  const bull=monteCarloAccumulation({sip:m.sip, meanReturn:(m.meanReturn/100)*REGIME_PRESETS.bull.meanAdj, volatility:(m.volatility/100)*REGIME_PRESETS.bull.volAdj, years:m.years, due:true, seed:m.seed, n:1000});
  const bear=monteCarloAccumulation({sip:m.sip, meanReturn:(m.meanReturn/100)*REGIME_PRESETS.bear.meanAdj, volatility:(m.volatility/100)*REGIME_PRESETS.bear.volAdj, years:m.years, due:true, seed:m.seed, n:1000});

  return `<div class="grid${L.panelCollapsed?' panel-collapsed':''}">
  <div class="panel">
    ${panelHead('Monte Carlo: 1,000 simulated paths', 'mc')}
    ${advisorChipsHTML('mc')}
    <div class="field"><label>Annual contribution <b data-mc-label="sip">${c.fmt(m.sip)}</b></label><input type="range" min="10000" max="1000000" step="10000" value="${m.sip}" data-k="sip" data-tab="mc"></div>
    <div class="field"><label>Years <b data-mc-label="years">${m.years}</b></label><input type="range" min="5" max="35" value="${m.years}" data-k="years" data-tab="mc"></div>
    <div class="field"><label>Expected return <b data-mc-label="meanReturn">${m.meanReturn}%</b></label><input type="range" min="4" max="16" step="0.1" value="${m.meanReturn}" data-k="meanReturn" data-tab="mc"></div>
    <div class="field"><label>Volatility (std dev)${infoIcon('The standard deviation of yearly returns: how widely each simulated year swings around the average. Around 15% is typical for a diversified equity fund. At 0% every path is identical and the fan collapses to one deterministic line.')} <b data-mc-label="volatility">${m.volatility}%</b></label><input type="range" min="0" max="30" value="${m.volatility}" data-k="volatility" data-tab="mc"></div>
    <hr class="divider">
    <div class="section-label">Regime preset${infoIcon('Presets that scale the average return and the volatility together, to mimic a sustained bull market, normal conditions, or an extended slump. A shorthand for asking: what if the whole era is kinder or harsher than expected?')}</div>
    <div class="toggle-row">
      ${Object.entries(REGIME_PRESETS).map(([id,r])=>`<button class="tglbtn${m.regime===id?' active':''}" data-toggle="regime" data-val="${id}">${r.label}</button>`).join('')}
    </div>
    <div class="gr-note">${regime.note}. Seed ${m.seed}.${infoIcon('A seed pins down the random number generator, so the same 1,000 paths are reproduced exactly every time. Change the seed to draw a different, equally valid set of simulated futures.')} The same seed always reproduces the identical 1,000 paths, so this isn't randomly different every time you look at it.</div>
    <button id="reseedBtn" style="width:100%;margin-top:10px;background:transparent;border:1px solid rgba(20,40,63,.18);color:rgba(20,40,63,.6);border-radius:8px;padding:9px;font-size:12px;cursor:pointer">Try a different seed</button>
  </div>
  <div class="output">
    <div class="stat-row">
      <div class="stat"><div class="stat-label">Median outcome (P50)${infoIcon('The middle result of 1,000 simulated futures: half ended above this figure, half below. A more honest central estimate than a single deterministic number.')}</div><div class="stat-value">${c.compact(res.p50)}</div></div>
      <div class="stat"><div class="stat-label">Worst-case band (P10)${infoIcon('9 in 10 simulated futures ended above this line. Treat it as a planning floor, not the absolute worst case, since real markets can do worse than any simulation.')}</div><div class="stat-value" style="color:#E8977A">${c.compact(res.p10)}</div></div>
      <div class="stat"><div class="stat-label">Best-case band (P90)${infoIcon('Only 1 in 10 simulated futures ended above this line. Enjoy it if it happens, but never build the plan on it.')}</div><div class="stat-value" style="color:#8FC79E">${c.compact(res.p90)}</div></div>
    </div>
    <div class="card is-primary">
      <h4>Fan chart: the range of outcomes, not just one number</h4>
      <div class="cap">Gold line = median · dark band = 25th-75th percentile · light band = 10th-90th percentile</div>
      ${fanChart(res.yearBands, 'mc-fan')}
    </div>
    <div class="card">
      <h4>Twin fates: same plan, two futures</h4>
      <div class="cap">Same contribution, same years. Only the regime differs</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px">
        <div>
          <div class="mono" style="font-size:11px;color:#8FC79E;margin-bottom:6px">BULL RUN → ${c.compact(bull.p50)}</div>
          ${fanChart(bull.yearBands, 'mc-fan-bull', 150)}
        </div>
        <div>
          <div class="mono" style="font-size:11px;color:#E8977A;margin-bottom:6px">EXTENDED SLUMP → ${c.compact(bear.p50)}</div>
          ${fanChart(bear.yearBands, 'mc-fan-bear', 150)}
        </div>
      </div>
    </div>
    <div class="gr-note">Set volatility to 0% to check this collapses to a single deterministic line. Every percentile becomes identical, proving the doors and the Lab share one engine even under simulation.</div>
    ${nextStepCard([{q:'Get a full check on whether this plan is actually ready, not just this one number.', tab:'health'}])}
  </div>
  </div>`;
}

const CATEGORY_LABELS={
  equity:'Equity funds', debt:'Debt funds', hybrid:'Hybrid funds',
  retirementLifecycle:'Retirement & lifecycle', indexAndETF:'Index & ETF', goldAndReal:'Gold & real assets',
  cash:'Cash & short-term', bond:'Bonds', retirement:'Retirement accounts', education:'Education',
};
const FLAG_LABELS={
  avoid:{text:'Higher risk, read the note', cls:'flag-avoid'},
  legacy:{text:'Legacy, not newly purchasable', cls:'flag-legacy'},
  'check-status':{text:'Verify current availability', cls:'flag-check'},
};

function instrumentCardsHTML(){
  const c=cfg(), li=c.labInstruments;
  const catKeys=Object.keys(li).filter(k=>!['sourceDoc','crossCheckedAsOf','granular'].includes(k));
  const activeCats = L.instCategory==='all' ? catKeys : [L.instCategory];
  const q=(L.instSearch||'').trim().toLowerCase();
  let shown=0;
  const cards = activeCats.map(catKey => {
    const items = li[catKey].filter(inst=>{
      if(!q) return true;
      const flag = inst.flag ? FLAG_LABELS[inst.flag] : null;
      return (inst.name+' '+inst.note+' '+(flag?flag.text:'')).toLowerCase().includes(q);
    });
    if(!items.length) return '';
    shown+=items.length;
    return `<div class="inst-cat-block">
      <div class="inst-cat-head">${CATEGORY_LABELS[catKey]||catKey} <span class="inst-cat-count">${items.length}</span></div>
      <div class="lab-inst-grid">
      ${items.map(inst=>{
        const flag = inst.flag ? FLAG_LABELS[inst.flag] : null;
        const rateDisplay = inst.band.min===null ? 'Tracks index' : `${(inst.band.min*100).toFixed(1)}&ndash;${(inst.band.max*100).toFixed(1)}%/yr`;
        return `<div class="lab-inst-card${flag?' '+flag.cls:''}">
          <div class="lab-inst-name">${inst.name}</div>
          <div class="lab-inst-rate">${rateDisplay}</div>
          ${flag?`<div class="lab-inst-flag">${flag.text}</div>`:''}
          <div class="lab-inst-note">${inst.note}</div>
        </div>`;
      }).join('')}
      </div>
    </div>`;
  }).join('');
  if(q && shown===0){
    return `<div class="gr-note">Nothing matches "${L.instSearch}". Try a broader word like duration, gilt, index, gold, or clear the search.</div>`;
  }
  return cards;
}

const PORTFOLIO_PRESETS={
  conservative:{growth:0.15, income:0.10, debt:0.45, hybrid:0.15, gold:0.10, intl:0.03, alt:0.02},
  balanced:    {growth:0.35, income:0.10, debt:0.25, hybrid:0.15, gold:0.08, intl:0.05, alt:0.02},

function portfolioPresetWeights(key, assets){
  if(key==='equal' || !PORTFOLIO_PRESETS[key]) return assets.map(()=>Math.round(100/assets.length));
  const alloc = PORTFOLIO_PRESETS[key];
  const counts = {};
  assets.forEach(a=>{ counts[a.cluster]=(counts[a.cluster]||0)+1; });

function computePortfolioDerived(assets, corr){
  const rawW = L.portfolio.weights;
  // A literal all-zero weight vector (the Reset button's "start from
  // nothing" state) must stay all-zero, not fall back to equal-weight --
  // normalizeWeights()'s zero-sum fallback exists for a different case
  // (malformed input), not this deliberate empty state.
  const w = rawW.every(x=>x===0) ? rawW.slice() : normalizeWeights(rawW);
  const returns = assets.map(a=>a.ret), vols = assets.map(a=>a.vol);
  const marketIdx = 0;
  const portRet = portfolioReturn(w, returns);
  const decomp = decomposeRisk(w, vols, corr, marketIdx);
  const topIdx = w.indexOf(Math.max(...w));
  const concRet = returns[topIdx], concVol = vols[topIdx];
  const volSaved = concVol - decomp.totalVol;
  const retGiven = concRet - portRet;
  const concentratedW = assets.map((_,i)=>i===topIdx?1:0);
  const concentratedDecomp = decomposeRisk(concentratedW, vols, corr, marketIdx);
  return { w, rawW, returns, vols, marketIdx, portRet, decomp, topIdx, concRet, concVol, volSaved, retGiven, concentratedDecomp };
}

// "What if I mixed in something safe?" (Phase 5, optional): blends the
// CURRENT mix, treated as a single asset with (portRet, totalVol), against
// one safe building block already in the index -- Liquid Fund for India,
// Short-Term Treasuries for the US -- at a chosen safe-leg percentage.
// No new assumptions: the correlation between the safe leg and the
// current mix is derived directly from the existing correlation matrix,
// cov(safe, mix) = Σ wᵢ·cov(safe,i) = Σ wᵢ·corr[safeIdx][i]·σsafe·σᵢ, so
// ρ = cov/(σsafe·σmix) = Σ wᵢ·corr[safeIdx][i]·σᵢ / σmix -- σsafe cancels.
function pfSafeAssetId(){ return L.country==='IN' ? 'liquid' : 'shortbond'; }
function portfolioBlendData(d, assets, corr){
  const safeIdx = assets.findIndex(a=>a.id===pfSafeAssetId());
  if(safeIdx<0) return null;
  const safeAsset = assets[safeIdx];
  const sigmaMix = d.decomp.totalVol;
  const rawRho = sigmaMix>0 ? d.w.reduce((s,wi,i)=>s+wi*corr[safeIdx][i]*d.vols[i],0) / sigmaMix : 0;
  const rho = Math.max(-1, Math.min(1, rawRho));
  const blendAt = p=>{
    const ret = p*safeAsset.ret + (1-p)*d.portRet;
    const variance = p*p*safeAsset.vol*safeAsset.vol + (1-p)*(1-p)*sigmaMix*sigmaMix
      + 2*p*(1-p)*safeAsset.vol*sigmaMix*rho;
    return {p, ret, vol:Math.sqrt(Math.max(0,variance))};
  };
  const p = Math.max(0, Math.min(1, L.portfolio.blendPct/100));
  return { safeAsset, rho, blendAt, current: blendAt(p), portRet:d.portRet, sigmaMix };
}
function portfolioBlendHTML(d, assets, corr){
  const bd = portfolioBlendData(d, assets, corr);
  if(!bd) return '<div class="cap">No safe-asset building block found for this country.</div>';
  const rows=[0,0.25,0.5,0.75,1].map(p=>bd.blendAt(p));
  const cur = bd.current;
  const retKept = bd.portRet>0 ? Math.max(0, cur.ret/bd.portRet*100) : 0;
  const volKept = bd.sigmaMix>0 ? cur.vol/bd.sigmaMix*100 : 0;
  return `<div class="gr-note" style="margin-top:0">Correlation between your current mix and ${bd.safeAsset.name}: <b style="color:var(--gold)">${bd.rho.toFixed(2)}</b>. At <b style="color:var(--paper)">${(L.portfolio.blendPct)}%</b> parked in ${bd.safeAsset.name}, you'd keep <b style="color:#8FC79E">${retKept.toFixed(0)}%</b> of the return for <b style="color:#8FC79E">${volKept.toFixed(0)}%</b> of the risk.</div>
  <div class="table-scroll" style="margin-top:10px"><table class="dtable">
  <thead><tr><th>In ${bd.safeAsset.name}</th><th>In your mix</th><th>Return</th><th>Risk</th></tr></thead>
  <tbody>
  ${rows.map(r=>`<tr${Math.abs(r.p-L.portfolio.blendPct/100)<0.01?' style="background:rgba(37,87,199,.08)"':''}><td>${(r.p*100).toFixed(0)}%</td><td>${((1-r.p)*100).toFixed(0)}%</td><td>${(r.ret*100).toFixed(1)}%</td><td>${(r.vol*100).toFixed(1)}%</td></tr>`).join('')}
  </tbody></table></div>`;
}

function portfolioDiversifyHTML(d, assets){

function portfolioBetaTextHTML(d, assets){

function portfolioRatiosHTML(d, c){

  return `<div class="stat"><div class="stat-label">Sharpe ratio${infoIcon('Return earned per unit of total risk, above a risk-free baseline (here, the same bank FD rate used elsewhere in this app). Higher is better. Above 1 is generally considered good, above 2 very good, for a real portfolio over a full market cycle.')}</div><div class="stat-value">${r.sharpe.toFixed(2)}</div>${advisorAskLink('Explain my Sharpe ratio')}</div>

function portfolioRiskContribHTML(d, assets, corr){
  const rc = riskContributions(d, corr);
  const pct = roundPercentsTo100(d.w); // exact money %, same rounding already used for the sliders
  const rows = assets.map((a,i)=>({name:a.name, moneyPct:pct[i], riskPct:rc[i]*100, idx:i}))
    .filter(r=>r.moneyPct>0)
    .sort((a,b)=>b.riskPct-a.riskPct);
  const maxAbs = Math.max(1, ...rows.map(r=>Math.max(r.moneyPct, Math.abs(r.riskPct))));
  const body = rows.map(r=>{
    const negative = r.riskPct < 0;
    const gap = r.riskPct - r.moneyPct;
    const flagClass = Math.abs(gap) >= 5 ? (gap>0?'rc-flag-hot':'rc-flag-cool') : '';
    return `<div class="rc-row">
      <div class="rc-name">${r.name}</div>
      <div class="rc-bars">
        <div class="rc-bar-track"><div class="rc-bar rc-money" style="width:${(r.moneyPct/maxAbs*100).toFixed(1)}%"></div></div>
        <div class="rc-bar-track"><div class="rc-bar rc-risk ${negative?'rc-risk-neg':''}" style="width:${(Math.abs(r.riskPct)/maxAbs*100).toFixed(1)}%;${negative?'margin-left:auto':''}"></div></div>
      </div>
      <div class="rc-vals ${flagClass}">${r.moneyPct}% money &middot; ${r.riskPct.toFixed(1)}% risk</div>
    </div>`;
  }).join('');
  return `<div class="rc-legend"><span><i style="background:#2557C7"></i>Share of your money</span><span><i style="background:#D97757"></i>Share of your risk</span></div>
  ${body}`;
}
// Approximate stress-test: scale each real historical crash episode's
// market-level move by this mix's own beta, the same logic already used
// in "Reading beta" elsewhere on this tab (if the market moves X%, a
// portfolio with beta B has historically tended to move roughly B*X%).
// This is explicitly an approximation, not a full re-simulation of all
// 24 (or 16) building blocks individually through each historical
// episode, which this app does not have the granular historical data
// for -- stated plainly in the UI, not left implicit.
function portfolioStressHTML(d, c){
  const amt = pfInvestAmount();
  const rows = c.episodes.map(ep=>{
    const portShock = d.decomp.beta * ep.rate;
    const dollarImpact = amt * portShock;
    return `<div class="stress-row">
      <div class="stress-label">${ep.label}<span class="stress-note">${ep.note}</span></div>
      <div class="stress-vals">
        <span class="stress-mkt">market ${(ep.rate*100).toFixed(0)}%</span>
        <span class="stress-port" style="color:#E8977A">this mix &asymp; ${(portShock*100).toFixed(0)}%</span>
        <span class="stress-dollar">${dollarImpact<0?'-':'+'}${c.compact(Math.abs(dollarImpact))} on ${c.compact(amt)}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="cap" style="margin-bottom:10px">Scales each real historical episode's market-wide move by this mix's own beta (${d.decomp.beta.toFixed(2)}), the same logic as the beta reading above. This is an approximation, not a full replay of all ${c.code==='IN'?'24':'16'} building blocks individually through each event, which needs return data this app does not have at that granularity.</div>
  ${rows}`;
}
function portfolioTailRiskHTML(d){
  const t = portfolioTailRisk(d);
  return `<div class="stat"><div class="stat-label">VaR, 1-in-20 year${infoIcon('Value at Risk, 95% confidence: in roughly 1 year out of 20, this mix would be expected to be down at least this much. It says nothing about how much worse the other 5% of years could get, only that a loss at least this size is the 1-in-20 threshold. Closed-form for a normal return distribution, verified against simulation before use.')}</div><div class="stat-value" style="color:#E8977A">-${(t.var95*100).toFixed(1)}%</div></div>
  <div class="stat"><div class="stat-label">CVaR, average of those bad years${infoIcon('Conditional VaR (expected shortfall): averaged only across that worst-1-in-20 tail, not the whole distribution. This is always a bigger number than VaR, and answers the question VaR does not: given that you are already in a bad year, how bad does it tend to be.')}</div><div class="stat-value" style="color:#E8977A">-${(t.cvar95*100).toFixed(1)}%</div></div>`;
}

// Display decluttering (the "Fewer"/"Off" toggles) happens HERE, and only
// here: the chart's click-to-adopt handler reads params.dataIndex back
// into this same cloud array, so as long as every consumer gets its
// cloud/assetPoints from this one function, the indices the chart shows
// and the indices a click resolves to can never drift apart.
function computePortfolioFrontierData(d, assets, corr){
  // The frontier line is always derived from the full 3000-point cloud,
  // via the 40 volatility bins inside generateFrontier() -- never from
  // whatever subset ends up on screen below. Thinning the display can
  // only ever declutter the dots, never bend the blue line itself.
  const {cloud: fullCloud, frontier} = generateFrontier(d.returns, d.vols, corr, 3000, L.portfolio.seed);
  const show = L.portfolio.show || {cloud:'all', assets:'held'};
  const cloud = show.cloud==='off' ? [] : show.cloud==='fewer' ? fullCloud.filter((_,i)=>i%5===0) : fullCloud;

  const pct = roundPercentsTo100(d.w);
  let assetPoints = assets.map((a,i)=>({vol:a.vol, ret:a.ret, label:a.name.split(' ')[0], fullLabel:a.name, weight:pct[i]}));
  if(show.assets==='off') assetPoints=[];
  else if(show.assets==='held') assetPoints=assetPoints.filter(p=>p.weight>0);
  // Cap text labels to the 8 largest holdings shown -- with up to 24
  // building blocks the dots themselves are fine, it's 24 overlapping 9px
  // mono labels that was the actual clutter complaint.
  const weightsDesc = assetPoints.map(p=>p.weight).sort((a,b)=>b-a);
  const labelFloor = weightsDesc[7]; // 8th-largest, or undefined when <=8 points
  assetPoints.forEach(p=>{ p.showLabel = labelFloor===undefined || p.weight>=labelFloor; });

  const currentPoint = {vol:d.decomp.totalVol, ret:d.portRet};
  return {cloud, frontier, assetPoints, currentPoint};
}
// Clicking a cloud or frontier point in the chart adopts that mix's own
// weight vector as the portfolio's weights — the "movable" chart behaviour.
function onPortfolioFrontierPick(w){
  const assets = cfg().code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
  L.portfolio.weights = w.map(x=>Math.round(x*100));
  if(L.portfolio.weights.length!==assets.length) return;
  render();
}
function portfolioChartHTML(d, assets, corr){
  const {cloud, frontier, assetPoints, currentPoint} = computePortfolioFrontierData(d, assets, corr);
  return frontierChart(cloud, frontier, assetPoints, currentPoint, 'pf-frontier-echart', onPortfolioFrontierPick, cfg().d.fdRate);
}

// Called on every slider tick (input event fires continuously during a
// drag). Recomputes only the cheap, closed-form numbers — stats, the risk
// bar, and the two text cards — and patches just those DOM nodes directly.
// Crucially this never touches the sliders themselves or the frontier
// chart, so the drag gesture the browser is mid-tracking never gets its
// underlying element replaced (that was the actual cause of the stutter,
// not just raw compute time — see build notes).
function portfolioMoneyHTML(d){
  const c=cfg();
  const inf=pfInflation()/100;
  const real=realRate(d.portRet, inf);
  const base=pfInvestAmount();
  const yrs=pfInvestYears();
  const sip = pfInvestMode()==='sip';
  const mRate=r=>effectiveMonthlyRate(r);
  const fv = sip ? accumulationSchedule({sip:base, rate:mRate(d.portRet), periods:yrs*12, due:true}).finalBalance : base*Math.pow(1+d.portRet,yrs);
  const realFv = sip ? accumulationSchedule({sip:base, rate:mRate(real), periods:yrs*12, due:true}).finalBalance : base*Math.pow(1+real,yrs);
  const fdFv = sip ? accumulationSchedule({sip:base, rate:mRate(cfg().d.fdRate), periods:yrs*12, due:true}).finalBalance : base*Math.pow(1+cfg().d.fdRate,yrs);
  const fdDiff=fv-fdFv;
  const totalIn = sip ? base*12*yrs : base;
  const subjectLine = sip
    ? `${c.compact(base)}/month put into this mix for ${yrs} years, ${c.compact(totalIn)} put in altogether, grows to`
    : `${c.compact(base)} left in this mix for ${yrs} years grows to`;
  const fdSubjectLine = sip
    ? `The same ${c.compact(base)}/month in a typical bank Fixed Deposit`
    : `The same ${c.compact(base)} in a typical bank Fixed Deposit`;
  return `<div class="gr-note" style="margin-top:0">${subjectLine} <b style="color:var(--paper)">${c.compact(fv)}</b> on paper. In today's purchasing power, after ${pfInflation()}% inflation, it is really worth <b style="color:${real>0?'#8FC79E':'#E8977A'}">${c.compact(realFv)}</b>. The gap between those two numbers is what inflation quietly takes, and it is why the after-inflation return above, not the headline one, is the number to judge a mix by.</div>
  <div class="gr-note" style="margin-top:8px;padding-top:10px;border-top:1px dashed rgba(20,40,63,.14)">${fdSubjectLine} (${(cfg().d.fdRate*100).toFixed(1)}%/yr) would instead reach <b style="color:#E8977A">${c.compact(fdFv)}</b> over those ${yrs} years${fdDiff>0?`, <b style="color:var(--paper)">${c.compact(fdDiff)}</b> less than this mix`:''}. FD interest is also fully taxed at your income slab every year, unlike long-term equity gains, which is not even reflected here.</div>`;
}
function updatePortfolioLive(){
  const c=cfg();
  const assets = c.code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
  const corr = c.code==='IN' ? PORTFOLIO_CORR_IN : PORTFOLIO_CORR_US;
  const d = computePortfolioDerived(assets, corr);
  const statsEl=document.getElementById('pf-stats'); if(statsEl) statsEl.innerHTML=portfolioStatsHTML(d);
  const moneyEl=document.getElementById('pf-money'); if(moneyEl) moneyEl.innerHTML=portfolioMoneyHTML(d);
  // Same setOption-in-place fast path as the frontier chart: on the hot
  // slider-drag tick, update the bar's segments and the legend text
  // directly rather than replacing the whole container (which would
  // dispose and recreate the chart on every keystroke).
  if(document.getElementById('pf-riskbar-echart')){
    renderRiskBarOption('pf-riskbar-echart', d.decomp, d.concentratedDecomp);
    const legendEl=document.getElementById('pf-riskbar-legend');
    if(legendEl) legendEl.innerHTML=riskBarLegendHTML(d);
  } else {
    const barEl=document.getElementById('pf-riskbar'); if(barEl) barEl.innerHTML=portfolioRiskBarHTML(d);
  }
  const divEl=document.getElementById('pf-diversify'); if(divEl) divEl.innerHTML=portfolioDiversifyHTML(d, assets);
  const betaEl=document.getElementById('pf-beta-text'); if(betaEl) betaEl.innerHTML=portfolioBetaTextHTML(d, assets);
  const ratiosEl=document.getElementById('pf-ratios'); if(ratiosEl) ratiosEl.innerHTML=portfolioRatiosHTML(d, c);
  const tailEl=document.getElementById('pf-tailrisk'); if(tailEl) tailEl.innerHTML=portfolioTailRiskHTML(d);
  const stressEl=document.getElementById('pf-stress'); if(stressEl) stressEl.innerHTML=portfolioStressHTML(d, c);
  const rcEl=document.getElementById('pf-riskcontrib'); if(rcEl) rcEl.innerHTML=portfolioRiskContribHTML(d, assets, corr);
  // The blend slider itself lives OUTSIDE #pf-blend (see renderPortfolio),
  // so patching this innerHTML on every drag tick can never wipe out the
  // slider mid-gesture -- only the table/sentence below it re-renders.
  const blendEl=document.getElementById('pf-blend'); if(blendEl) blendEl.innerHTML=portfolioBlendHTML(d, assets, corr);
  // Cluster accordion headers: every drag renormalizes ALL weights, not
  // just the dragged asset's own cluster, so every cluster's running
  // total needs refreshing here too, not only the one being dragged.
  const pct = roundPercentsTo100(d.w);
  const clusterPct = {};
  assets.forEach((a,i)=>{ clusterPct[a.cluster]=(clusterPct[a.cluster]||0)+pct[i]; });
  Object.keys(clusterPct).forEach(cl=>{
    const el=document.querySelector(`[data-cluster-total="${cl}"]`);
    if(el) el.textContent = clusterPct[cl]+'%';
  });
  // .term and .info-icon tooltips are pure CSS (:hover), so no JS re-attachment is needed here
}

let portfolioChartTimer=null;
function schedulePortfolioChartUpdate(delay){
  if(portfolioChartTimer) clearTimeout(portfolioChartTimer);
  portfolioChartTimer=setTimeout(()=>{
    portfolioChartTimer=null;
    const c=cfg();
    const assets = c.code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
    const corr = c.code==='IN' ? PORTFOLIO_CORR_IN : PORTFOLIO_CORR_US;
    const d = computePortfolioDerived(assets, corr);
    const chartEl=document.getElementById('pf-chart');
    if(!chartEl) return;
    if(document.getElementById('pf-frontier-echart')){
      // Chart already mounted: update the persistent ECharts instance in
      // place via setOption so the transition animates, instead of
      // replacing the DOM (which would dispose/recreate the instance and
      // interrupt the drag gesture the browser is mid-tracking).
      const {cloud, frontier, assetPoints, currentPoint} = computePortfolioFrontierData(d, assets, corr);
      renderFrontierChartOption('pf-frontier-echart', cloud, frontier, assetPoints, currentPoint, onPortfolioFrontierPick, cfg().d.fdRate);
      const takeawayEl=document.getElementById('pf-chart-takeaway');
      if(takeawayEl) takeawayEl.innerHTML=frontierTakeawayHTML(currentPoint, portfolioRatios(d, c).sharpe, frontier, onPortfolioFrontierPick);
    } else {
      chartEl.innerHTML=portfolioChartHTML(d, assets, corr);
    }
  }, delay===undefined?130:delay);
}

          <b>Diversification ratio</b> compares the volatility you would get if these holdings all moved in perfect lockstep (the weighted average of their individual volatilities) against the volatility you are actually getting. The gap between them is diversification doing real work: assets that do not move together smooth out the ride without needing to lower expected return.<br><br>

   ===================================================================== */
function calcHealthScore(){
  const h=L.health;
  const fundingRatio = h.capacity>0 ? Math.min(1, h.capacity/Math.max(1,h.totalSIP)) : 0;
  const funding=Math.round(fundingRatio*40);
  const emergency = h.emergencyStatus==='full'?20:h.emergencyStatus==='partial'?10:0;
  const stress = h.shockSurvives?25:5;
  const surplus = h.capacity > h.totalSIP;
  const discipline = surplus?15:5;
  return {funding, emergency, stress, discipline, total:funding+emergency+stress+discipline, fundingRatio};
}

  const c=cfg(), h=L.health, sc=calcHealthScore();

const KLASS_LABELS={equity:'Equity',debt:'Debt',gold:'Gold & silver',realasset:'Real assets',intl:'International'};

function searchInstrumentIndex(query, countryCode, klassFilter){
  const full = countryCode==='IN' ? INSTRUMENT_INDEX_IN : INSTRUMENT_INDEX_US;
  const list = (klassFilter && klassFilter!=='all') ? full.filter(i=>i.klass===klassFilter) : full;
  const q=(query||'').trim().toLowerCase();
  if(!q){
    if(klassFilter && klassFilter!=='all') return list.slice(0,12);

    // entries from every asset class, not the old list.slice(0,10) --
    // that always showed ten large-cap stocks and made debt, gold and
    // international invisible until you already knew to search for them.
    const starters=[];
    KLASS_ORDER.forEach(k=>{ starters.push(...full.filter(i=>i.klass===k).slice(0,2)); });
    return starters;
  }
  const tiers=[[],[],[],[]]; // exact symbol, symbol-starts, name-starts, substring
  list.forEach(i=>{
    const sym=i.symbol.toLowerCase(), name=i.name.toLowerCase();
    if(sym===q) tiers[0].push(i);
    else if(sym.startsWith(q)) tiers[1].push(i);
    else if(name.startsWith(q)) tiers[2].push(i);
    else if(sym.includes(q)||name.includes(q)) tiers[3].push(i);
  });
  tiers.forEach(t=>t.sort((a,b)=>a.symbol.localeCompare(b.symbol)));
  return tiers.flat().slice(0,15);

/* --- B3: calculation engine ---
   Same statistical convention as the class exercise this extends
   (wealth class1.csv / Capital Allocation Line.xlsx): daily simple
   returns, POPULATION standard deviation and covariance (matches Excel's
   STDEV.P / COVAR, not the sample STDEV.S), annualised via
   (1+dailyMean)^tradingDaysPerYear - 1. One deliberate change from the
   worksheet: tradingDaysPerYear is measured from the actual fetched
   series (observation count / calendar-day span in years) rather than
   hardcoded to 246, so a thinly-traded instrument or a different
   exchange calendar never silently inherits NSE's specific convention.
   Hand cross-checked against the worksheet's own SBI figures before use
   (~29.9% annualised return, ~21.3% annualised stdev over the same
   251-session window) — see build notes. */

async function liveApiGet(path){
  const res = await fetch(path);
  let body;
  try { body = await res.json(); } catch(e){ throw new Error('The server sent back something that was not valid data.'); }
  if(!res.ok || (body && body.error)) throw new Error((body && body.error) || `Request failed (HTTP ${res.status})`);
  return body;
}
// Routes to the right /api/history query and hands back the normalised
// {id,label,currency,prices} shape src/worker.js promises. No client-side
// fallback numbers on failure, per this project's core rule — callers
// must surface the real error, never paper over it with a guess.
function liveFetchHistory(instrument){
  return instrument.type==='fund'
    ? liveApiGet(`/api/history?type=fund&scheme=${encodeURIComponent(instrument.symbol)}`)
    : liveApiGet(`/api/history?type=equity&symbol=${encodeURIComponent(instrument.symbol)}`);
}

function computeDailyReturns(prices){
  const rets=[];
  for(let i=1;i<prices.length;i++){
    const p0=prices[i-1].close, p1=prices[i].close;
    if(p0>0) rets.push({date:prices[i].date, r:(p1-p0)/p0});
  }
  return rets;
}
// Audits a fetched price series for the kinds of defects that can
// silently poison mean/stdev before any of it reaches a chart or a
// Sharpe ratio — an unadjusted stock split, a NAV that's pinned/stale,
// a single bad print, too little history. Per this project's
// no-fabricated-data rule, a flagged series is never repaired, clipped
// or smoothed here: it's only labelled. liveReadyItems() is where a
// flagged instrument actually gets excluded (or kept, if the person
// explicitly overrides it) — this function just reports.
function auditPriceSeries(prices, rets, spanYears, annualReturn, annualVol, geoAnnual, hasCatastrophicLoss, isFund){
  const flags=[];
  let level='ok';
  const bump=(lvl,code,msg,detail)=>{
    flags.push({code, msg, detail});
    if(lvl==='unusable') level='unusable';
    else if(lvl==='caution' && level==='ok') level='caution';
  };

  const n=rets.length;
  if(n<60) bump('unusable','SHORT',`Only ${n} usable daily observations — too few to trust.`);

  const badPrices=prices.filter(p=>!(p.close>0)||!isFinite(p.close));
  if(badPrices.length>0){
    const frac=badPrices.length/prices.length;
    bump(frac>0.01?'unusable':'caution','BADPRICE',`${badPrices.length} price point(s) were zero, negative or missing.`);
  }

  if(spanYears<1) bump('caution','SPAN','Less than a year of history — the annualised figures are a thin extrapolation.');

  let maxGapDays=0;
  for(let i=1;i<prices.length;i++){
    const gap=(new Date(prices[i].date)-new Date(prices[i-1].date))/86400000;
    if(gap>maxGapDays) maxGapDays=gap;
  }
  if(maxGapDays>30) bump('caution','GAP',`A ${Math.round(maxGapDays)}-day gap in the price history — something didn't trade or wasn't reported for a while.`);

  // NSE circuit limits cap most single-day equity moves at 20%, so a
  // >35% one-day move is almost always a corporate action or a bad
  // print, not real trading. Funds get a tighter 10% bar: a NAV jump
  // that size usually means a segregated-portfolio side-pocket event or
  // a stale-then-corrected NAV, not a real one-day market move.
  const jumpThreshold = isFund ? 0.10 : 0.35;
  let worstJump=null;
  rets.forEach(x=>{ if(!worstJump || Math.abs(x.r)>Math.abs(worstJump.r)) worstJump=x; });
  if(worstJump && Math.abs(worstJump.r)>jumpThreshold){
    bump('caution','JUMP',`A single-day move of ${(worstJump.r*100).toFixed(0)}% on ${worstJump.date} — most likely a corporate action, not a real trading day.`,worstJump);
    // Does that jump look like an unadjusted split or bonus issue? A
    // ~(1/k - 1) or ~(k - 1) move for a small integer k is the classic
    // signature of a k:1 split/bonus the price history wasn't rebased for.
    for(const k of [2,3,4,5,10]){
      const splitDown=1/k-1, splitUp=k-1;
      if(Math.abs(worstJump.r-splitDown)<0.03*Math.abs(splitDown) || Math.abs(worstJump.r-splitUp)<0.03*splitUp){
        bump('caution','SPLITSIG',`Looks like an unadjusted ${k}:1 split or bonus issue on ${worstJump.date}, not a genuine one-day move.`);
        break;
      }
    }
  }

  const zeroDays=rets.filter(x=>x.r===0).length;
  if(rets.length>0 && zeroDays/rets.length>0.30) bump('caution','STALE',`${Math.round(zeroDays/rets.length*100)}% of days show exactly no price change — this barely moves, so its risk figure will look unrealistically low.`);

  if(hasCatastrophicLoss) bump('unusable','IMPLAUSIBLE','A single-day move to zero or below in this series — the compounded return cannot be computed.');
  else{
    if(annualReturn>1.00 || annualVol>1.50) bump('unusable','IMPLAUSIBLE',`${(annualReturn*100).toFixed(0)}% expected return / ${(annualVol*100).toFixed(0)}% risk — implausible for a real instrument, almost certainly a data defect rather than genuine performance.`);
    else if(annualReturn>0.60 || annualVol>0.80) bump('caution','WILD',`${(annualReturn*100).toFixed(0)}% expected return / ${(annualVol*100).toFixed(0)}% risk — unusually extreme; worth a second look before trusting it.`);
    if(geoAnnual!=null && Math.sign(annualReturn)!==Math.sign(geoAnnual) && annualReturn!==0 && geoAnnual!==0){
      bump('caution','SIGNFLIP',`The average daily move was ${annualReturn>0?'positive':'negative'}, but compounded over the full window this was ${geoAnnual>0?'a net gain':'a net loss'} — see the note below.`);
    }
  }

  return {level, flags};
}
function computeReturnStats(prices, isFund){
  const rets=computeDailyReturns(prices);
  const n=rets.length;
  const mean=rets.reduce((s,x)=>s+x.r,0)/n;
  const variance=rets.reduce((s,x)=>s+(x.r-mean)*(x.r-mean),0)/n; // population, matches STDEV.P
  const sd=Math.sqrt(variance);
  const first=new Date(prices[0].date), last=new Date(prices[prices.length-1].date);
  const spanYears=Math.max(0.05, (last-first)/(365.25*24*3600*1000));
  const tradingDaysPerYear=n/spanYears;
  // The optimiser keeps this arithmetic figure -- it's the only kind of
  // return that's linearly combinable across assets, which mean-variance
  // math requires, and it matches this project's coursework convention
  // (wealth class1.csv / Capital Allocation Line.xlsx, hand-checked
  // against its own SBI figures: ~29.9% return, ~21.3% stdev over the
  // same 251-session window). It is NOT what an investor who held the
  // whole period actually earned -- see geoAnnual/cagr below for that.
  const annualReturn=Math.pow(1+mean, tradingDaysPerYear)-1;
  const annualVol=sd*Math.sqrt(tradingDaysPerYear);

  // Compounded return: what holding this the entire window actually
  // turned into. A single day where price falls to (near) zero makes
  // log(1+r) = -Infinity, which would poison every downstream number
  // silently -- guarded explicitly rather than left to produce NaN/Inf
  // on screen.
  const hasCatastrophicLoss = rets.some(x=>x.r<=-0.999);
  let geoAnnual=null, cagr=null;
  if(!hasCatastrophicLoss){
    const logSum = rets.reduce((s,x)=>s+Math.log(1+x.r), 0);
    geoAnnual = Math.expm1(logSum * tradingDaysPerYear / n);
    cagr = Math.pow(prices[prices.length-1].close/prices[0].close, 1/spanYears) - 1;
  }

  const quality = auditPriceSeries(prices, rets, spanYears, annualReturn, annualVol, geoAnnual, hasCatastrophicLoss, !!isFund);

  return {returns:rets, n, dailyMean:mean, dailySd:sd, tradingDaysPerYear,
    annualReturn, annualVol, geoAnnual, cagr, spanYears,
    startDate:prices[0].date, endDate:prices[prices.length-1].date, quality};
}
// Aligns two return series by date (different instruments can carry
// different trading calendars/holidays) before computing covariance.
function alignReturns(retsA, retsB){
  const mapB=new Map(retsB.map(x=>[x.date,x.r]));
  const a=[], b=[];
  retsA.forEach(x=>{ if(mapB.has(x.date)){ a.push(x.r); b.push(mapB.get(x.date)); } });
  return {a, b};
}
function populationCovariance(a, b){
  const n=a.length;
  const meanA=a.reduce((s,x)=>s+x,0)/n, meanB=b.reduce((s,x)=>s+x,0)/n;
  let cov=0; for(let i=0;i<n;i++) cov+=(a[i]-meanA)*(b[i]-meanB);
  return cov/n;
}
// Pairwise annualised covariance/correlation matrices, asset-count-agnostic.
function computeCovarianceMatrix(statsList){
  const n=statsList.length;
  const covAnnual=Array.from({length:n},()=>new Array(n).fill(0));
  const corr=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    if(i===j){ covAnnual[i][j]=statsList[i].annualVol*statsList[i].annualVol; corr[i][j]=1; continue; }
    const {a,b}=alignReturns(statsList[i].returns, statsList[j].returns);
    const dailyCov = a.length>10 ? populationCovariance(a,b) : 0;
    const days=(statsList[i].tradingDaysPerYear+statsList[j].tradingDaysPerYear)/2;
    covAnnual[i][j]=dailyCov*days;
    corr[i][j]=statsList[i].annualVol>0 && statsList[j].annualVol>0 ? covAnnual[i][j]/(statsList[i].annualVol*statsList[j].annualVol) : 0;
  }
  return {covAnnual, corr};
}
// Exactly-2-instrument closed-form frontier: sweep w across [0,1] (the
// worksheet's own approach for the two-risky-asset case — 5% steps
// there, finer here since it costs nothing). Uses the same
// portfolioReturn()/portfolioVariance() as every other frontier in this
// file, just called with n=2.
function twoAssetFrontier(retA, retB, sdA, sdB, corr, steps){
  if(steps===undefined) steps=101;
  const pts=[];
  for(let i=0;i<steps;i++){
    const w=i/(steps-1);
    const weights=[w,1-w];
    pts.push({ w, ret:portfolioReturn(weights,[retA,retB]), vol:Math.sqrt(portfolioVariance(weights,[sdA,sdB],[[1,corr],[corr,1]])) });
  }
  return pts;
}
// Closed-form global-minimum-variance weight for two assets, clamped to
// [0,1] since this app never offers shorting (true unconstrained min-var
// can fall outside that range at high correlation).
function minVarianceWeightTwoAsset(sdA, sdB, corr){
  const covAB=corr*sdA*sdB;
  const denom=sdA*sdA+sdB*sdB-2*covAB;
  if(Math.abs(denom)<1e-12) return 0.5;
  return Math.max(0, Math.min(1, (sdB*sdB-covAB)/denom));
}
// Closed-form tangency weight for two risky assets given a risk-free
// rate — the standard two-fund-separation result.
//
// Unlike minVarianceWeightTwoAsset above, this one CANNOT be fixed by
// simply clamping the raw formula to [0,1]. Portfolio variance is convex
// in w (always a bowl shape), so when its unconstrained minimum falls
// outside [0,1] the nearest boundary really is the constrained best —
// clamping is safe there. Sharpe ratio is not convex/concave: its one
// stationary point is a genuine interior maximum ONLY when the raw value
// already lands in [0,1]. When one asset's excess return over the
// risk-free rate is negative (this instrument underperformed cash),
// the unconstrained "optimum" wants to short that asset and lever up
// the other one — something this app never offers — and the stationary
// point found by the formula sits on the wrong side entirely: Sharpe is
// then monotonic across [0,1], and naively clamping the raw value grabs
// whichever endpoint happens to be numerically closer, not whichever
// endpoint actually has the higher Sharpe ratio. Verified against a real
// pair (RELIANCE.NS/TCS.NS, TCS deeply negative over the window): the
// raw formula gave -0.90, clamped that to 0% RELIANCE / 100% TCS —
// exactly backwards, since 100% RELIANCE alone (Sharpe 0.12) beats 100%
// TCS alone (Sharpe -0.49) and nothing between them does better than
// either pure holding once shorting is off the table.
function tangencyWeightTwoAsset(retA, retB, sdA, sdB, corr, rf){
  const covAB=corr*sdA*sdB;
  const exA=retA-rf, exB=retB-rf;
  const num=exA*sdB*sdB - exB*covAB;
  const den=exA*sdB*sdB + exB*sdA*sdA - (exA+exB)*covAB;
  const wRaw = Math.abs(den)<1e-12 ? 0.5 : num/den;
  if(wRaw>=0 && wRaw<=1) return wRaw; // genuine interior optimum -- no shorting needed to reach it
  const sharpeAt = w=>{
    const ret = w*retA + (1-w)*retB;
    const variance = w*w*sdA*sdA + (1-w)*(1-w)*sdB*sdB + 2*w*(1-w)*covAB;
    const vol = Math.sqrt(Math.max(0, variance));
    return vol>0 ? (ret-rf)/vol : -Infinity;
  };
  return sharpeAt(1) >= sharpeAt(0) ? 1 : 0;
}
// Capital Allocation Line: a straight line from (0, rf) through the
// tangency point, extended to maxLeverage x the tangency risk/return —
// mirrors the worksheet's own 0% / 100% / 200% three-point construction
// (borrowing at the risk-free rate to lever up past the tangency mix).
function capitalAllocationLine(rf, tanRet, tanVol, maxLeverage){
  if(maxLeverage===undefined) maxLeverage=2;
  if(tanVol<=0) return [{vol:0,ret:rf},{vol:0,ret:rf}];
  const sharpe=(tanRet-rf)/tanVol;
  const pts=[];
  for(let lev=0; lev<=maxLeverage+1e-9; lev+=maxLeverage/20) pts.push({vol:tanVol*lev, ret:rf+sharpe*tanVol*lev});
  return pts;
}

    ? `<div class="cap" style="padding:0 2px 8px">${L.live.klassFilter==='all'?'A couple of starting picks from every asset class. Search above to see more, or filter to just one.':`Showing ${(KLASS_LABELS[L.live.klassFilter]||'').toLowerCase()} only.`}</div>`

  if(!results.length) return emptyNote + `<div class="cap" style="padding:8px 2px">No matches. Try a shorter word, a different filter, or use the exact-ticker box below.</div>`;
  return emptyNote + results.map(r=>{
    const disabled=already.has(r.symbol);
    return `<button class="live-result-btn"${disabled?' disabled style="opacity:.35;cursor:default"':` data-live-add-equity="${r.symbol}" data-live-add-name="${r.name}"`}>
      <span>${r.name}${disabled?' <span class="cap" style="font-size:10.5px">(added)</span>':''}</span>
      <span class="live-result-sym">${r.symbol}</span>
    </button>`;
  }).join('');
}
function liveFundResultsHTML(){

    const disabled=already.has(key);
    return `<button class="live-result-btn"${disabled?' disabled style="opacity:.35;cursor:default"':` data-live-add-fund="${r.schemeCode}" data-live-add-name="${(r.schemeName||'').replace(/"/g,'&quot;')}"`}>
      <span>${r.schemeName}${disabled?' <span class="cap" style="font-size:10.5px">(added)</span>':''}</span>
    </button>`;
