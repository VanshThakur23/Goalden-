}
function liveChipHTML(it){
  const d=L.live.data[it.key]||{status:'loading'};
  const heldBack = d.status==='ready' && d.stats.quality.level==='unusable' && !L.live.overrides[it.key];
  const caution = d.status==='ready' && d.stats.quality.level==='caution';
  const statusCls = d.status==='error' ? 'st-error'
    : d.status!=='ready' ? 'st-loading'
    : heldBack ? 'st-held' : caution ? 'st-caution' : 'st-ready';
  const title = d.status==='error' ? (d.error||'')
    : heldBack ? 'Held back — ' + (d.stats.quality.flags[0]||{}).msg
    : caution ? 'Flagged — ' + (d.stats.quality.flags[0]||{}).msg
    : '';
  // Only equities plausibly have screener.in financials -- a fund/ETF
  // ticker would just 404 there, so the deep link is scoped to stocks.
  const stmtLink = it.type==='equity'
    ? `<button class="live-chip-stmt" data-stmt-open="${it.symbol}" title="See the statements">&#128196;</button>` : '';
  return `<div class="live-chip${heldBack?' live-chip-held':''}" title="${title.replace(/"/g,'&quot;')}">
    <span class="live-chip-status ${statusCls}"></span>
    <span>${d.label||it.symbol}${heldBack?' (held back)':caution?' (flagged)':''}</span>
    ${stmtLink}
    <button class="live-chip-x" data-live-remove="${it.key}" title="Remove">&times;</button>
  </div>`;
}

function liveFrontierChartOption(frontier, assetPoints, currentPoint, cal, tangencyPoint, currentMixLabel, minVarPoint){
  const pct=v=>(v*100).toFixed(2)+'%';
  // Suppress the SAFEST label when it would land on top of an asset dot
  // or the BEST BALANCE dot (common with 2 assets, where the min-variance
  // mix often sits very close to one of those) -- three overlapping
  // labels reads worse than two clear ones.
  const vols=frontier.map(p=>p.vol), rets=frontier.map(p=>p.ret);
  const volTol=(Math.max(...vols)-Math.min(...vols))*0.04 || 0.001;
  const retTol=(Math.max(...rets)-Math.min(...rets))*0.04 || 0.001;
  const near=(p,q)=>Math.abs(p.vol-q.vol)<volTol && Math.abs(p.ret-q.ret)<retTol;
  const showSafest = minVarPoint && !near(minVarPoint,tangencyPoint) && !assetPoints.some(ap=>near(minVarPoint,{vol:ap.vol,ret:ap.ret}));
  // capitalAllocationLine() always starts its sweep at leverage 0, i.e.
  // cal[0] is exactly {vol:0, ret:rf} -- reading it back out here instead
  // of threading a separate rf argument through the whole call chain.
  const rfPoint = cal[0] || {vol:0, ret:0};
  return {
    animationDurationUpdate:450, animationEasingUpdate:'cubicOut',
    grid:{left:54,right:20,top:24,bottom:52,containLabel:true},
    xAxis:{type:'value', min:0, name:'RISK (per year)', nameLocation:'middle', nameGap:30,
      nameTextStyle:{fontSize:10.5,color:'rgba(20,40,63,.5)'}, axisLabel:{formatter:v=>(v*100).toFixed(0)+'%'},
      splitLine:{lineStyle:{color:'rgba(20,40,63,.05)'}}},
    yAxis:{type:'value', name:'RETURN (per year)', nameLocation:'middle', nameGap:44,
      nameTextStyle:{fontSize:10.5,color:'rgba(20,40,63,.5)'}, axisLabel:{formatter:v=>(v*100).toFixed(0)+'%'},
      splitLine:{lineStyle:{color:'rgba(20,40,63,.05)'}}},
    dataZoom:[{type:'inside',xAxisIndex:0},{type:'inside',yAxisIndex:0}],
    tooltip:{trigger:'item', confine:true, extraCssText:'max-width:290px;white-space:normal;line-height:1.5',
      textStyle:{fontFamily:"'Figtree',sans-serif", fontSize:12},
      formatter(p){
      const [labelA,labelB] = assetPoints.map(a=>a.label);
      if(p.seriesName==='Frontier'){
        const w = frontier[p.dataIndex] ? frontier[p.dataIndex].w : null;
        const split = w!=null ? `${(w*100).toFixed(0)}% ${labelA} / ${((1-w)*100).toFixed(0)}% ${labelB}<br/>` : '';
        return `${split}Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}<br/><span style="color:#2557C7">Click to try this mix.</span>`;
      }
      if(p.seriesName==='CAL') return `<b>Capital Allocation Line.</b><br/>Starts at the risk-free rate (${pct(rfPoint.ret)}, 0% risk) and blends in more of the Best Balance mix as it climbs.<br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}`;
      if(p.seriesName==='Risk-free') return `<b>The risk-free rate: ${pct(rfPoint.ret)}.</b><br/>The safe baseline this comparison uses &ndash; roughly a savings account or government bond. It sits at 0% risk because it's assumed not to move. The dashed line is what you get blending this with the Best Balance mix.`;
      if(p.seriesName==='Assets'){
        const a=assetPoints[p.dataIndex];
        if(!a) return '';
        return `<b>${a.fullLabel||a.label} on its own:</b><br/>${pct(a.ret)} for ${pct(a.vol)} risk.`;
      }
      if(p.seriesName==='Your mix') return `<b>Your current mix${currentMixLabel?': '+currentMixLabel:''}.</b><br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}<br/>This marks where the slider below is set right now &ndash; it isn't clickable itself. Click the <b style="color:#14283F">BEST BALANCE</b> dot or the blue curve to move it.`;
      if(p.seriesName==='Safest') return `<b>The lowest-risk mix these two instruments can make.</b><br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}`;
      if(p.seriesName==='Tangency') return `<b>Best balance of risk and reward (the tangency / best-Sharpe point).</b><br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}<br/><span style="color:#2557C7">Click to move here.</span>`;
      return '';
    }},
    series:[
      { name:'Frontier', type:'line', data:frontier.map(p=>[p.vol,p.ret]), smooth:.2, showSymbol:false,
        itemStyle:{color:'#2557C7'}, lineStyle:{color:'#2557C7',width:2.25}, z:2 },
      { name:'CAL', type:'line', data:cal.map(p=>[p.vol,p.ret]), showSymbol:false,
        lineStyle:{color:'#14283F', width:1.5, type:'dashed'}, z:1 },
      { name:'Risk-free', type:'scatter', data:[[rfPoint.vol,rfPoint.ret]], symbolSize:8,
        itemStyle:{color:'#14283F', borderColor:'#14283F', borderWidth:1}, z:4,
        label:{show:true, formatter:`RISK-FREE ${(rfPoint.ret*100).toFixed(1)}%`, position:'right', distance:8, color:'rgba(20,40,63,.6)', fontWeight:700, fontSize:8.5, fontFamily:"'Spline Sans Mono',monospace"} },
      { name:'Assets', type:'scatter', data:assetPoints.map(p=>[p.vol,p.ret]), symbolSize:10,
        itemStyle:{color:'#8FC79E', borderColor:'#14283F', borderWidth:1},
        // Points built without a showLabel flag (e.g. the Test Real
        // Investments chart, which reuses this same option builder but
        // never applies the Portfolio tab's decluttering) always label --
        // showLabel is only ever explicitly set to false, never omitted-as-false.
        label:{show:true, formatter:p=>{ const ap=assetPoints[p.dataIndex]; return ap && ap.showLabel!==false ? ap.label : ''; }, position:'top', color:'rgba(20,40,63,.6)', fontSize:9, fontFamily:"'Spline Sans Mono',monospace"}, z:3 },
      { name:'Tangency', type:'scatter', data:[[tangencyPoint.vol,tangencyPoint.ret]], symbolSize:11,
        itemStyle:{color:'#14283F', borderColor:'#2557C7', borderWidth:2}, z:4,
        label:{show:true, formatter:'BEST BALANCE', position:'bottom', distance:9, color:'#14283F', fontWeight:700, fontSize:9.5, fontFamily:"'Spline Sans Mono',monospace"} },
      ...(showSafest ? [{ name:'Safest', type:'scatter', data:[[minVarPoint.vol,minVarPoint.ret]], symbolSize:10,
        itemStyle:{color:'#8FC79E', borderColor:'#14283F', borderWidth:1.5}, z:4,
        label:{show:true, formatter:'SAFEST', position:'top', distance:9, color:'#14283F', fontWeight:700, fontSize:9.5, fontFamily:"'Spline Sans Mono',monospace"} }] : []),
      { name:'Your mix', type:'scatter', data:[[currentPoint.vol,currentPoint.ret]], symbolSize:16,
        itemStyle:{color:'transparent', borderColor:'#D97757', borderWidth:2.5}, z:5,
        label:{show:true, formatter:'YOUR MIX', position:'top', distance:10, color:'#D97757', fontWeight:700, fontSize:10, fontFamily:"'Spline Sans Mono',monospace"} },
      { name:'Your mix dot', type:'scatter', data:[[currentPoint.vol,currentPoint.ret]], symbolSize:6,
        itemStyle:{color:'#D97757'}, tooltip:{show:false}, silent:true, z:5 },
    ],
  };
}
function renderLiveFrontierChartOption(chartId, frontier, assetPoints, currentPoint, cal, tangencyPoint, onPointClick, currentMixLabel, minVarPoint){
  const chart=initChart(chartId, liveFrontierChartOption(frontier, assetPoints, currentPoint, cal, tangencyPoint, currentMixLabel, minVarPoint));

function liveFrontierChart(frontier, assetPoints, currentPoint, cal, tangencyPoint, chartId, onPointClick, currentMixLabel, minVarPoint){

      <span><i style="border-top:2px dashed rgba(20,40,63,.9);background:transparent"></i>Capital Allocation Line: the risk-free rate blended with Best Balance, extended for leverage</span>
      <span><i style="background:#8FC79E;border-radius:50%"></i>Each instrument alone</span>
      <span><i style="border:2px solid #14283F;background:#14283F"></i>Best balance of risk and reward</span>
      <span><i style="border:2px solid #D97757;background:transparent"></i>Your mix &middot; hover for detail, click the curve to move it</span>

// The weight-combination table: the same sweep as the chart, in rows —
// every observation the chart can only show as a curve, laid out so it
// can actually be read and compared, click any row to adopt that split.
function liveCombinationsTable(points, a, b, rf, currentW){
  let bestIdx=0, bestSharpe=-Infinity, minVarIdx=0, minVar=Infinity;
  const rows=points.map((p,i)=>{
    const sharpe = p.vol>0 ? (p.ret-rf)/p.vol : 0;
    if(sharpe>bestSharpe){ bestSharpe=sharpe; bestIdx=i; }
    if(p.vol<minVar){ minVar=p.vol; minVarIdx=i; }
    return {...p, sharpe};
  });
  const closestIdx = rows.reduce((best,r,i)=> Math.abs(r.w-currentW)<Math.abs(rows[best].w-currentW)?i:best, 0);
  return `<div class="live-wc-wrap"><table class="live-wc-table">
    <thead><tr><th>${a.symbol}</th><th>${b.symbol}</th><th>Return</th><th>Risk</th><th>Sharpe</th></tr></thead>
    <tbody>
    ${rows.map((r,i)=>{
      const cls=[i===closestIdx?'wc-current':'', i===bestIdx?'wc-best':''].filter(Boolean).join(' ');
      return `<tr class="${cls}" data-live-weight-pick="${Math.round(r.w*100)}">
        <td>${(r.w*100).toFixed(0)}%</td>
        <td>${((1-r.w)*100).toFixed(0)}%</td>
        <td>${(r.ret*100).toFixed(1)}%</td>
        <td>${(r.vol*100).toFixed(1)}%${i===minVarIdx?'<span class="live-wc-badge minvar">Min risk</span>':''}</td>
        <td>${r.sharpe.toFixed(2)}${i===bestIdx?'<span class="live-wc-badge best">Best</span>':''}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}
// Mirrors the worksheet's own Q53:U56 construction directly: at least
// three points blending the risk-free asset with the single best-Sharpe
// (tangency) mix, from all-cash through all-tangency to levered beyond
// it. "Lending" (parking some money at the risk-free rate, below 100%
// tangency) suits a risk-averse investor; "borrowing" (past 100%,
// financing extra tangency exposure at the risk-free rate) suits a
// risk-seeking one — same framing as the worksheet's own notes.
function liveCalTable(rf, tanRet, tanVol, aSym, bSym, wTan){
  const levels=[0, 0.5, 1, 1.5, 2];
  return `<div class="live-wc-wrap"><table class="live-wc-table">
    <thead><tr><th>Optimal portfolio</th><th>Risk-free</th><th>Return</th><th>Risk</th></tr></thead>
    <tbody>
    ${levels.map(lev=>{
      const ret=rf + (tanRet-rf)*lev, vol=tanVol*lev;
      return `<tr class="${lev===1?'wc-best':''}"><td>${(lev*100).toFixed(0)}%</td><td>${((1-lev)*100).toFixed(0)}%</td><td>${(ret*100).toFixed(1)}%</td><td>${(vol*100).toFixed(1)}%</td></tr>`;
    }).join('')}
    </tbody>
  </table></div>
  <div class="gr-note" style="margin-top:8px">At 100% optimal portfolio, all money sits in the <b style="color:var(--paper)">${(wTan*100).toFixed(0)}% ${aSym} / ${((1-wTan)*100).toFixed(0)}% ${bSym}</b> mix. Below 100% is <b>lending</b> &ndash; some money parked at the risk-free rate, the safer side. Above 100% is <b>borrowing</b> at the risk-free rate to buy more of the optimal portfolio &ndash; leveraged, for a risk-seeking investor.</div>`;
}
function liveMultiCombinationsTable(frontier, items, rf, currentVol){
  let bestIdx=0, bestSharpe=-Infinity, minVarIdx=0, minVar=Infinity;
  frontier.forEach((p,i)=>{
    const sharpe=p.vol>0?(p.ret-rf)/p.vol:0;
    if(sharpe>bestSharpe){ bestSharpe=sharpe; bestIdx=i; }
    if(p.vol<minVar){ minVar=p.vol; minVarIdx=i; }
  });
  const closestIdx=frontier.reduce((best,p,i)=>Math.abs(p.vol-currentVol)<Math.abs(frontier[best].vol-currentVol)?i:best,0);
  return `<div class="live-wc-wrap"><table class="live-wc-table">
    <thead><tr>${items.map(it=>`<th>${it.symbol}</th>`).join('')}<th>Return</th><th>Risk</th><th>Sharpe</th></tr></thead>
    <tbody>
    ${frontier.map((p,i)=>{
      const sharpe=p.vol>0?(p.ret-rf)/p.vol:0;
      const cls=[i===closestIdx?'wc-current':'', i===bestIdx?'wc-best':''].filter(Boolean).join(' ');
      return `<tr class="${cls}" data-live-multi-pick="${i}">
        ${p.w.map(wi=>`<td>${(wi*100).toFixed(0)}%</td>`).join('')}
        <td>${(p.ret*100).toFixed(1)}%</td>
        <td>${(p.vol*100).toFixed(1)}%${i===minVarIdx?'<span class="live-wc-badge minvar">Min risk</span>':''}</td>
        <td>${sharpe.toFixed(2)}${i===bestIdx?'<span class="live-wc-badge best">Best</span>':''}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

// Plain-language takeaway for the exact-two-instrument case. The chart
// here isn't a sorted risk-ordered frontier (twoAssetFrontier sweeps the
// weight linearly, not risk), so frontierTakeawayHTML's frontier-gap
// interpolation doesn't apply — instead this leans on what actually
// drives the shape of this specific curve: how correlated the two real
// instruments turned out to be, and how far the current mix sits from
// the single best risk/reward trade-off (the tangency point).
// Parallel flashcard treatment to frontierTakeawayHTML() above, for the
// 2-instrument case: same verdict/tiles/action/collapsed-detail shape,
// but built around a single sweepable weight (0-100% of `a`) rather than
// an n-asset weight vector, so its jump action moves L.live.weight
// directly instead of taking an onJump(w) callback.
function liveTwoAssetTakeawayHTML(a, b, c12, currentVol, currentRet, currentSharpe, wTan, tanVol, tanRet, rf, w, wMinVar, retA, volA, retB, volB){
  const pct = v=>(v*100).toFixed(1)+'%';
  const corrWord = c12>0.7?'move together strongly':c12>0.3?'move somewhat together':c12>-0.3?'move mostly independently of each other':'tend to move in opposite directions';
  const corrLine = c12<0.85
    ? `Real prices show <b style="color:var(--paper)">${a.symbol}</b> and <b style="color:var(--paper)">${b.symbol}</b> ${corrWord} (correlation <b style="color:var(--gold)">${c12.toFixed(2)}</b>). That's useful: because they don't move in lockstep, blending them can lower your risk by more than a simple average of the two would suggest.`
    : `Real prices show <b style="color:var(--paper)">${a.symbol}</b> and <b style="color:var(--paper)">${b.symbol}</b> ${corrWord} (correlation <b style="color:var(--gold)">${c12.toFixed(2)}</b>). Because they move together this closely, blending them buys very little risk reduction &ndash; you're mostly just averaging their returns, not diversifying risk away.`;
  const tanSharpe = tanVol>0 ? (tanRet-rf)/tanVol : 0;
  const sharpeGap = tanSharpe - currentSharpe;
  const hasGap = sharpeGap > 0.05;
  const verdictColor = hasGap ? '#D97757' : '#5FA875';
  const verdictText = hasGap
    ? `The best trade-off between risk and reward here is <b style="color:${verdictColor}">${(wTan*100).toFixed(0)}% ${a.symbol}</b> / <b style="color:${verdictColor}">${((1-wTan)*100).toFixed(0)}% ${b.symbol}</b> &ndash; your split earns less reward per unit of risk than that.`
    : `Your split is already close to the best trade-off between risk and reward these two instruments can offer.`;

  let jumpBtn = '';
  if(hasGap){
    frontierJumpHandler = ()=>{ L.live.weight = Math.round(wTan*100); render(); };
    jumpBtn = `<button class="fc-action" data-frontier-jump>Move to the best split &rarr;</button>`;
  }

  // When the best-Sharpe point lands right at one edge of the curve (100%
  // of one instrument, 0% of the other), that's not a rounding artefact
  // -- it means the excluded instrument returned less than the risk-free
  // rate over this exact window, so blending any of it in only drags the
  // mix's Sharpe ratio down. The only way to still profit from it would
  // be to short it, which this app never offers, so "all of one, none of
  // the other" genuinely is the best available combination here. Named
  // explicitly rather than left for someone to wonder why the dot sits
  // in the corner instead of somewhere in the middle.
  const edgeAsset = wTan<=0.001 ? b : wTan>=0.999 ? a : null;
  const otherAsset = edgeAsset===a ? b : a;
  const edgeLine = edgeAsset
    ? `<div class="gr-note" style="margin-top:10px">Notice the best-balance point sits right at the edge of the curve, not in the middle. That's because <b style="color:var(--paper)">${otherAsset.symbol}</b> returned less than the ${(rf*100).toFixed(1)}% risk-free rate over this window &ndash; blending any of it in would only pull the mix's Sharpe ratio down, not up. Holding it would only pay off if you could bet against it, which this tool doesn't offer, so 100% ${edgeAsset.symbol} genuinely is the best combination of these two available here.</div>`
    : '';

  const cfgC = cfg();
  const illustrateAmt = cfgC.code==='IN' ? 100000 : 1000;
  const illustrateYrs = 10;
  const compoundedApprox = currentRet - (currentVol*currentVol)/2;
  const illustrateFv = illustrateAmt*Math.pow(1+compoundedApprox, illustrateYrs);
  const weightLabel = `<b style="color:var(--paper)">${(w*100).toFixed(0)}% ${a.symbol}</b> / <b style="color:var(--paper)">${((1-w)*100).toFixed(0)}% ${b.symbol}</b>`;
  const moneyDetailLine = `<div style="margin-top:8px">Put <b style="color:var(--paper)">${cfgC.compact(illustrateAmt)}</b> into your current split &ndash; ${weightLabel} &ndash; and leave it for ${illustrateYrs} years: at this mix's compounded rate of <b style="color:var(--gold)">${(compoundedApprox*100).toFixed(1)}%</b>/yr, it would grow to roughly <b style="color:var(--paper)">${cfgC.compact(illustrateFv)}</b>. That uses the compounded figure, not the higher expected-return figure above, because that's closer to what an account statement would actually show.</div>`;
  const shortMoneyLine = `<div class="gr-note" style="margin-top:10px">Grown using the compounded rate (<b style="color:var(--gold)">${(compoundedApprox*100).toFixed(1)}%</b>/yr), not the higher expected-return figure above &ndash; that's closer to what an account statement would actually show.</div>`;

  // Diversification benefit: how much risk this exact split avoids purely
  // because the two instruments don't move in lockstep. If correlation
  // were 1, this split's risk would be the plain weighted average of the
  // two instruments' own volatilities (naiveVol) -- variance math
  // guarantees actual risk is strictly lower than that for any
  // correlation below 1, so this is always a true, non-negative number,
  // never an inflated claim. Return is untouched by this -- mixing only
  // ever changes risk, never the return you'd expect to earn.
  const naiveVol = w*volA + (1-w)*volB;
  const diversificationSaved = Math.max(0, naiveVol - currentVol);
  const divBenefitHTML = diversificationSaved > 0.001 ? `<div class="fc-diversify">
    <div class="fc-diversify-stat">${pct(diversificationSaved)} less risk</div>
    <div class="fc-diversify-headline">That's what mixing ${a.symbol} and ${b.symbol} buys you at your current split. If the two moved in perfect lockstep, this exact ${weightLabel} would carry <b style="color:var(--paper)">${pct(naiveVol)}</b> risk. Because they don't (correlation <b style="color:var(--gold)">${c12.toFixed(2)}</b>), you actually carry only <b style="color:var(--paper)">${pct(currentVol)}</b> &ndash; the same <b style="color:var(--paper)">${pct(currentRet)}</b> return, for meaningfully less risk. That gap is the entire point of holding both instead of just one.</div>
  </div>` : '';

  const minVarRet = portfolioReturn([wMinVar,1-wMinVar],[retA,retB]);
  const minVarVol = Math.sqrt(portfolioVariance([wMinVar,1-wMinVar],[volA,volB],[[1,c12],[c12,1]]));
  const hiIsA = retA >= retB;
  const hiEnd = hiIsA ? {sym:a.symbol, ret:retA, vol:volA} : {sym:b.symbol, ret:retB, vol:volB};
  const dominatedEnd = hiIsA ? {sym:b.symbol} : {sym:a.symbol};
  const wGrowth = hiIsA ? 1 : 0;
  // If the min-variance mix and the max-return mix round to the same
  // weight, one instrument beat the other on both return and risk this
  // window -- there's no efficient trade-off segment to climb, just a
  // single dominant point. Showing three destination cards (or a "risk
  // and return magnify together" sentence) in that case would be false.
  const noTradeoff = Math.round(wMinVar*100)===Math.round(wGrowth*100);

  const rangeLine = noTradeoff
    ? `<div class="gr-note" style="margin-top:10px">There's no trade-off to make here. <b style="color:var(--paper)">${hiEnd.sym}</b> earned more than <b style="color:var(--paper)">${dominatedEnd.sym}</b> and swung less over this window, so every efficient mix is just 100% ${hiEnd.sym}.</div>`
    : '';
  const rangeDetailLine = noTradeoff ? '' : `<div style="margin-top:8px">Moving up the efficient part of this curve, from the lowest-risk mix &ndash; <b style="color:var(--paper)">${(wMinVar*100).toFixed(0)}% ${a.symbol}</b> / <b style="color:var(--paper)">${((1-wMinVar)*100).toFixed(0)}% ${b.symbol}</b>, earning ${pct(minVarRet)} for ${pct(minVarVol)} risk &ndash; up to 100% <b style="color:var(--paper)">${hiEnd.sym}</b>, earning ${pct(hiEnd.ret)} for ${pct(hiEnd.vol)} risk, both return and risk magnify together. Taking more risk on this line always buys more expected return; there's no way to get one without the other.</div>`;

  const destCard = (label, wDest, retDest, volDest, extraClass)=>{
    const wPct = Math.round(wDest*100);
    const isCurrent = Math.round(w*100)===wPct;
    return `<button class="fc-dest${extraClass?' '+extraClass:''}${isCurrent?' is-current':''}" data-live-goto-w="${wPct}">
      <div class="fc-dest-label">${label}</div>
      <div class="fc-dest-split">${wPct}% ${a.symbol} / ${100-wPct}% ${b.symbol}</div>
      <div class="fc-dest-nums">${pct(retDest)} return &middot; ${pct(volDest)} risk</div>
    </button>`;
  };
  const destsHTML = noTradeoff ? '' : `<div class="fc-dests">
    ${destCard('Play it safe', wMinVar, minVarRet, minVarVol)}
    ${destCard('Best balance', wTan, tanRet, tanVol, 'fc-dest-rec')}
    ${destCard('Go for growth', wGrowth, hiEnd.ret, hiEnd.vol)}
  </div>`;

  const detail = `<div>${corrLine}</div>
  <div style="margin-top:8px">Your mix earns <b style="color:var(--paper)">${pct(currentRet)}</b> a year for <b style="color:var(--paper)">${pct(currentVol)}</b> risk &ndash; Sharpe <b style="color:var(--gold)">${currentSharpe.toFixed(2)}</b>.</div>
  <div style="margin-top:8px">${hasGap
    ? `The single best trade-off between risk and reward here (the <span class="term" data-def="The point on the curve with the highest Sharpe ratio: the mix that earns the most extra return per unit of extra risk, above the risk-free rate. Where the Capital Allocation Line touches the frontier.">tangency point</span>) is <b style="color:var(--gold)">${(wTan*100).toFixed(0)}% ${a.symbol}</b> / <b style="color:var(--gold)">${((1-wTan)*100).toFixed(0)}% ${b.symbol}</b>, earning ${pct(tanRet)} for ${pct(tanVol)} risk (Sharpe ${tanSharpe.toFixed(2)}). Drag the slider toward it, click the dark dot on the chart, or use the button above, to close the gap.`
    : `The single best trade-off between risk and reward these two instruments can offer is ${(wTan*100).toFixed(0)}% ${a.symbol} / ${((1-wTan)*100).toFixed(0)}% ${b.symbol} &ndash; your split is already close to it.`}</div>
  ${moneyDetailLine}
  ${rangeDetailLine}`;

  return `<div class="fcard">
    <div class="fc-verdict" style="color:${verdictColor}">${verdictText}</div>
    <div class="fc-tiles fc-tiles-sm">
      <div class="stat fc-tile"><div class="stat-label">Your return</div><div class="stat-value">${pct(currentRet)}</div></div>
      <div class="stat fc-tile"><div class="stat-label">Your risk</div><div class="stat-value">${pct(currentVol)}</div></div>
      <div class="stat fc-tile"><div class="stat-label">Sharpe ratio</div><div class="stat-value">${currentSharpe.toFixed(2)}</div></div>
    </div>
    <div class="fc-money-tiles">
      <div class="stat fc-money-tile fc-money-in"><div class="stat-label">You put in</div><div class="stat-value">${cfgC.compact(illustrateAmt)}</div></div>
      <div class="stat fc-money-tile fc-money-out"><div class="stat-label">Grows to in ${illustrateYrs} yrs</div><div class="stat-value">${cfgC.compact(illustrateFv)}</div></div>
    </div>
    ${divBenefitHTML}
    ${destsHTML}
    ${edgeLine}
    ${shortMoneyLine}
    ${rangeLine}
    ${jumpBtn}
    ${explainDropdown('Show the full breakdown', detail)}
  </div>`;
}
function liveTwoAssetHTML(items, rfPct){
  const rf=rfPct/100;
  const [a,b]=items;
  const sa=L.live.data[a.key].stats, sb=L.live.data[b.key].stats;
  const {corr}=computeCovarianceMatrix([sa,sb]);
  const c12=corr[0][1];
  const frontier=twoAssetFrontier(sa.annualReturn, sb.annualReturn, sa.annualVol, sb.annualVol, c12);
  const wMinVar=minVarianceWeightTwoAsset(sa.annualVol, sb.annualVol, c12);
  const wTan=tangencyWeightTwoAsset(sa.annualReturn, sb.annualReturn, sa.annualVol, sb.annualVol, c12, rf);
  const tanRet=portfolioReturn([wTan,1-wTan],[sa.annualReturn,sb.annualReturn]);
  const tanVol=Math.sqrt(portfolioVariance([wTan,1-wTan],[sa.annualVol,sb.annualVol],[[1,c12],[c12,1]]));
  const cal=capitalAllocationLine(rf, tanRet, tanVol, 2);
  const w=L.live.weight/100;
  const currentRet=portfolioReturn([w,1-w],[sa.annualReturn,sb.annualReturn]);
  const currentVol=Math.sqrt(portfolioVariance([w,1-w],[sa.annualVol,sb.annualVol],[[1,c12],[c12,1]]));
  const currentSharpe=currentVol>0?(currentRet-rf)/currentVol:0;
  const assetPoints=[
    {label:a.symbol, fullLabel:L.live.data[a.key].label, vol:sa.annualVol, ret:sa.annualReturn},
    {label:b.symbol, fullLabel:L.live.data[b.key].label, vol:sb.annualVol, ret:sb.annualReturn},
  ];
  const compoundedApprox = currentRet - (currentVol*currentVol)/2;
  const minVarRet=portfolioReturn([wMinVar,1-wMinVar],[sa.annualReturn,sb.annualReturn]);
  const minVarVol=Math.sqrt(portfolioVariance([wMinVar,1-wMinVar],[sa.annualVol,sb.annualVol],[[1,c12],[c12,1]]));
  return `<div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><div class="stat-label">Correlation</div><div class="stat-value">${c12.toFixed(2)}</div>${advisorAskLink('What does this correlation mean?')}</div>
    <div class="stat"><div class="stat-label">Your mix return</div><div class="stat-value">${(currentRet*100).toFixed(1)}%</div></div>
    <div class="stat"><div class="stat-label">Your mix Sharpe</div><div class="stat-value">${currentSharpe.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-label">Compounded equivalent${infoIcon('An approximation of what this mix would actually compound to over time: expected return minus half the variance (μ − σ²/2). Not a substitute for the exact per-instrument compounded figures above, but a quick read on how much the expected-return figure overstates real growth for a mix this volatile.')}</div><div class="stat-value">${(compoundedApprox*100).toFixed(1)}%</div></div>
  </div>
  <div class="card is-primary">
    <h4>${a.symbol} / ${b.symbol}${infoIcon('Every point on the blue curve is one weight split between these two instruments, swept from 100% '+b.symbol+' to 100% '+a.symbol+'. The dashed line is the Capital Allocation Line: the risk-free rate blended with the best-Sharpe (tangency) mix, extended past 100% to show what borrowing at the risk-free rate to lever up would do.')}</h4>
    <div class="cap">Annualised from ${sa.n} and ${sb.n} real daily observations. Higher up is more return, further right is more risk.</div>
    ${liveFrontierChart(frontier, assetPoints, {vol:currentVol,ret:currentRet}, cal, {vol:tanVol,ret:tanRet}, 'live-frontier-echart', onLiveFrontierPick, `${(w*100).toFixed(0)}% ${a.symbol} / ${((1-w)*100).toFixed(0)}% ${b.symbol}`, {vol:minVarVol,ret:minVarRet})}
    <div class="gr-note" style="margin-top:10px">${liveTwoAssetTakeawayHTML(a, b, c12, currentVol, currentRet, currentSharpe, wTan, tanVol, tanRet, rf, w, wMinVar, sa.annualReturn, sa.annualVol, sb.annualReturn, sb.annualVol)}</div>
    ${advisorAskLink('Explain this chart to me')}
  </div>
  <div class="card">
    <h4>Weight: <b>${(w*100).toFixed(0)}% ${a.symbol}</b> / <b>${((1-w)*100).toFixed(0)}% ${b.symbol}</b></h4>
    <div class="slider-row"><input type="range" min="0" max="100" step="1" value="${L.live.weight}" data-live-weight></div>
    <div class="gr-note" style="margin-top:10px">Best Sharpe ratio at <b style="color:var(--gold)">${(wTan*100).toFixed(0)}% ${a.symbol}</b> &middot; minimum risk at <b style="color:#8FC79E">${(wMinVar*100).toFixed(0)}% ${a.symbol}</b>.</div>
  </div>
  <div class="card">
    <h4>Capital Allocation Line: risk-free + optimal portfolio${infoIcon('Blending the risk-free asset with the single best-Sharpe (tangency) mix of '+a.symbol+' and '+b.symbol+', at five leverage levels from all-cash to 2x.')}</h4>
    ${collapsibleSection('', 'Show the table', liveCalTable(rf, tanRet, tanVol, a.symbol, b.symbol, wTan))}
  </div>
  <div class="card">
    <h4>Every combination${infoIcon('The same weight sweep as the chart above, in table form, 5% at a time — click any row to move the slider there. Sharpe uses the risk-free rate set on the left.')}</h4>
    ${collapsibleSection('', 'Show the table', liveCombinationsTable(frontier.filter((p,i)=>i%5===0), a, b, rf, w))}
  </div>`;
}

function liveMultiAssetHTML(computed, rfPct){
  const rf=rfPct/100;
  const {items, vols, corr, cloud, frontier}=computed;
  const returns=computed.returns;
  const assetPoints=items.map((it,i)=>({vol:vols[i], ret:returns[i], label:it.symbol, fullLabel:L.live.data[it.key].label}));
  let weights=L.live.selectedWeights;
  if(!weights || weights.length!==items.length) weights=items.map(()=>1/items.length);
  const currentPoint={vol:Math.sqrt(portfolioVariance(weights,vols,corr)), ret:portfolioReturn(weights,returns)};
  const currentSharpe=currentPoint.vol>0?(currentPoint.ret-rf)/currentPoint.vol:0;
  const compoundedApprox = currentPoint.ret - (currentPoint.vol*currentPoint.vol)/2;
  const pct=v=>(v*100).toFixed(1)+'%';
  const weightLabel = items.map((it,i)=>`<b style="color:var(--paper)">${(weights[i]*100).toFixed(0)}% ${it.symbol}</b>`).join(' / ');
  const cfgC = cfg();
  const illustrateAmt = cfgC.code==='IN' ? 100000 : 1000;
  const illustrateYrs = 10;
  const illustrateFv = illustrateAmt*Math.pow(1+compoundedApprox, illustrateYrs);
  const moneyLine = `<div class="gr-note" style="margin-top:10px">Put <b style="color:var(--paper)">${cfgC.compact(illustrateAmt)}</b> into your current mix &ndash; ${weightLabel} &ndash; and leave it for ${illustrateYrs} years: at this mix's compounded rate of <b style="color:var(--gold)">${(compoundedApprox*100).toFixed(1)}%</b>/yr, it would grow to roughly <b style="color:var(--paper)">${cfgC.compact(illustrateFv)}</b>. That uses the compounded figure, not the higher expected-return figure above, because that's closer to what an account statement would actually show.</div>`;
  const lowPt = frontier[0];
  const hiPt = frontier.reduce((best,p)=> (!best || p.ret>best.ret) ? p : best, null);
  const rangeLine = (lowPt && hiPt && hiPt.vol > lowPt.vol + 0.0005 && hiPt.ret > lowPt.ret + 0.0005) ? `<div class="gr-note" style="margin-top:10px">Moving up the efficient part of this frontier, from the lowest-risk mix on it &ndash; <b style="color:var(--paper)">${items.map((it,i)=>`${(lowPt.w[i]*100).toFixed(0)}% ${it.symbol}`).join(' / ')}</b>, earning ${pct(lowPt.ret)} for ${pct(lowPt.vol)} risk &ndash; up to the highest-return mix on it &ndash; <b style="color:var(--paper)">${items.map((it,i)=>`${(hiPt.w[i]*100).toFixed(0)}% ${it.symbol}`).join(' / ')}</b>, earning ${pct(hiPt.ret)} for ${pct(hiPt.vol)} risk &ndash; both return and risk magnify together. Taking more risk on this line always buys more expected return; there's no way to get one without the other.</div>` : '';
  return `<div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><div class="stat-label">Instruments</div><div class="stat-value">${items.length}</div></div>
    <div class="stat"><div class="stat-label">Selected mix return</div><div class="stat-value">${(currentPoint.ret*100).toFixed(1)}%</div></div>
    <div class="stat"><div class="stat-label">Selected mix Sharpe</div><div class="stat-value">${currentSharpe.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-label">Compounded equivalent${infoIcon('An approximation of what this mix would actually compound to over time: expected return minus half the variance (μ − σ²/2). A quick read on how much the expected-return figure overstates real growth for a mix this volatile.')}</div><div class="stat-value">${(compoundedApprox*100).toFixed(1)}%</div></div>
  </div>
  <div class="card is-primary">
    <h4>Simulated frontier${infoIcon('With 3 or more instruments there is no single sweepable weight, so this samples 3,000 random weight combinations (seeded, so it repeats identically) and keeps the best-return mix at each risk level — the same technique Build a Portfolio uses.')}</h4>
    <div class="cap">Annualised from real daily prices: ${items.map(it=>it.symbol).join(', ')}. Higher up is more return, further right is more risk &ndash; the blue line is the best you could have done at each risk level, and your orange marker is where this exact mix actually sits.</div>
    ${frontierChart(cloud, frontier, assetPoints, currentPoint, 'live-multi-frontier-echart', onLiveMultiFrontierPick, rf)}
    <div class="gr-note" style="margin-top:10px">${frontierTakeawayHTML(currentPoint, currentSharpe, frontier, onLiveMultiFrontierPick)}</div>
    ${moneyLine}
    ${rangeLine}
  </div>
  <div class="card">
    <h4>Notable combinations${infoIcon('Every distinct risk level the simulation found, best-return mix at each — click any row (or any point on the chart) to adopt that weight split.')}</h4>
    ${collapsibleSection('', 'Show the table', liveMultiCombinationsTable(frontier, items, rf, currentPoint.vol))}
  </div>`;
}

// One row per fetched instrument: the compounded return it actually
// produced, the arithmetic figure the frontier math below uses, risk,
// how many real trading days that's built from, and any data-quality
// flags -- so a held-back or merely-cautioned instrument is explained
// right where someone would look for it, not left as a silent absence
// from the chart.
function liveInstrumentStatsCardHTML(items){
  const withData = items.filter(it=>L.live.data[it.key] && L.live.data[it.key].status==='ready');
  if(!withData.length) return '';
  const rows = withData.map(it=>{
    const d=L.live.data[it.key], s=d.stats, q=s.quality;
    const heldBack = q.level==='unusable' && !L.live.overrides[it.key];
    const cagrDisplay = s.geoAnnual==null ? '&mdash;' : (s.geoAnnual*100).toFixed(1)+'%';
    const flagsHtml = q.flags.length ? `<div class="live-inst-flags">${q.flags.map(f=>
      `<div class="live-flag live-flag-${q.level==='unusable'?'unusable':'caution'}">${f.msg}</div>`).join('')}</div>` : '';
    return `<div class="live-inst-row${heldBack?' live-inst-held':''}">
      <div class="live-inst-top">
        <div class="live-inst-name">${d.label||it.symbol} <span class="cap">${it.symbol}</span></div>
        <div class="live-inst-cagr">${cagrDisplay}<span class="cap"> compounded/yr</span></div>
      </div>
      <div class="live-inst-stats">
        <span>${(s.annualReturn*100).toFixed(1)}% expected/yr</span>
        <span>${(s.annualVol*100).toFixed(1)}% risk</span>
        <span class="cap">${s.n} days &middot; ${s.startDate} to ${s.endDate}</span>
      </div>
      ${flagsHtml}
      ${heldBack ? `<button class="tglbtn" data-live-override="${it.key}" style="margin-top:8px">Use it anyway</button>` : ''}
    </div>`;
  }).join('');
  return rows;
}
function liveOutputHTML(ready, rfPct){
  const items=L.live.items;
  const errored=items.filter(it=>L.live.data[it.key] && L.live.data[it.key].status==='error');
  const loading=items.filter(it=>!L.live.data[it.key] || L.live.data[it.key].status==='loading');
  const errorBanner = errored.length ? `<div class="card"><h4>Couldn't fetch ${errored.length>1?'these':'this'}</h4>
      ${errored.map(it=>`<div class="live-error-box"><b>${L.live.data[it.key].label||it.symbol}:</b> ${L.live.data[it.key].error}</div>`).join('')}
      <div class="cap" style="margin-top:8px">Remove it and try again, or double-check the exact ticker and exchange suffix.</div>
    </div>` : '';
  const instrumentRows = liveInstrumentStatsCardHTML(items);
  const instrumentDropdown = instrumentRows ? `<div class="card">${collapsibleSection('', `What each one did on its own${infoIcon('Total return, dividends reinvested, from real daily prices. The compounded figure is what holding this the entire window actually turned into; the expected-return figure is the average-based number the frontier math below is built from, because portfolio math needs a linearly-combinable figure -- see "Why do you show two different return numbers?" below.')}`, instrumentRows)}</div>` : '';
  if(ready.length<2){
    return errorBanner + `<div class="card live-empty">
      ${loading.length? 'Fetching real prices&hellip;' : 'Add at least two usable instruments on the left to compute a frontier.<br><span class="cap">Two gives the exact closed-form curve from your class exercise; three or more switches to a simulated cloud, same as Build a Portfolio.</span>'}
    </div>` + instrumentDropdown;
  }
  const isTwoAsset = ready.length===2;
  const multiComputed = isTwoAsset ? null : liveComputeMulti();
  // Same "current mix" return the stat cards above already show (portfolioReturn
  // over either the two-asset slider weight or the selected multi-asset weights),
  // recomputed here so it can be carried into the Retirement tab's growth field.
  const mixRet = isTwoAsset
    ? (() => { const [a,b]=ready; const sa=L.live.data[a.key].stats, sb=L.live.data[b.key].stats; const w=L.live.weight/100; return portfolioReturn([w,1-w],[sa.annualReturn,sb.annualReturn]); })()
    : (() => { let weights=L.live.selectedWeights; if(!weights||weights.length!==multiComputed.items.length) weights=multiComputed.items.map(()=>1/multiComputed.items.length); return portfolioReturn(weights, multiComputed.returns); })();
  return errorBanner + (isTwoAsset ? liveTwoAssetHTML(ready, rfPct) : liveMultiAssetHTML(multiComputed, rfPct))
    + instrumentDropdown
    + explainDropdown('Why do you show two different return numbers?', `
      The <b>expected-return</b> figure ((1+average daily move)<sup>trading days per year</sup> &minus; 1) is what the frontier, Sharpe ratio and tangency point below are built from. Mean-variance portfolio math needs a return figure that combines <i>linearly</i> across assets &ndash; a compounded return does not have that property, so the optimiser can't use it. This is also the convention used in the coursework this tool extends (a two-asset frontier worksheet), hand-checked against its own SBI figures (~29.9% return, ~21.3% risk over a comparable window) before being trusted here.<br><br>
      The <b>compounded</b> figure is what actually holding the instrument the whole window would have turned into &ndash; the number a real account statement would show. The two can disagree a lot for a volatile instrument: something that falls 50% then rises 50% averages 0% on the expected-return measure but is actually down 25% compounded. Both numbers are real; they answer different questions, so both are shown rather than picking one and hiding the other.
    `)
    + nextStepCard([{q:'Turn this real-world return into a savings plan.', tab:'retirement', carry:{field:'ret.preRate', value:Math.max(4, Math.min(16, Math.round(mixRet*1000)/10))}}]);
}

}

// Rebuilding #tabbarInner from scratch is only safe when the nav's own
// identity actually changed (which tab/country is current) -- render()
// fires on every slider input across the whole app, and a full rebuild
// would blow away any sidebar group the person just opened by hand.
// navKey lets a same-tab, same-country re-render skip the rebuild
// entirely and leave the existing DOM (and its open/closed groups) alone.
let lastNavKey=null;
function renderTabs(){
  const bar=document.getElementById('tabbar');
  if(L.tab==='home'){
    bar.className='tabbar is-home';
    document.getElementById('tabbarInner').innerHTML='';
    lastNavKey=null;
  } else {
    bar.className='tabbar is-slim'+(L.navCollapsed?' nav-collapsed':'');
    const navKey=L.tab+'|'+L.country;
    if(navKey!==lastNavKey){
      lastNavKey=navKey;
      const current=TABS.find(t=>t.id===L.tab)||{};
      const inner=document.getElementById('tabbarInner');
      inner.innerHTML=`<div class="slim-row">
        <button class="slim-back" data-tab-switch="home">&larr; All tools</button>
        <span class="slim-current">${current.label||''}</span>
      </div>
      <div class="tabs tabs-slim">${TABS.map(t=>
        `<button class="tab${L.tab===t.id?' active':''}${t.primary?' tab-primary':''}" data-tab-switch="${t.id}" title="${t.blurb||''}">${t.icon||''}${t.label}</button>`).join('')}</div>`;
      // Nav buttons live inside #tabbarInner, only rebuilt on an actual nav
      // change -- so it's safe to bind listeners here rather than relying
      // on attach()'s broader, every-render rebind (see attach()'s own
      // comment on why its query is scoped away from this element).
      inner.querySelectorAll('[data-tab-switch]').forEach(el=>el.addEventListener('click',()=>{
        L.tab=el.dataset.tabSwitch;
        try{ localStorage.setItem('goaldenLabLastTab', L.tab); }catch(e){}
        render();
      }));
    }
  }
  document.getElementById('countryToggle').innerHTML = Object.values(C).map(c=>
    `<button class="ctbtn${L.country===c.code?' active':''}" data-country="${c.code}">${c.sym} ${c.code}</button>`).join('');
}

// Applies .is-sticky to the current tool's left panel whenever its own
// output sibling is taller -- that's what gives the sticky panel room to
// travel and unstick again near the end, rather than checking against the
// viewport (a panel taller than the *screen* still sticks fine as long as
// it's shorter than the *output column*, which is the actual constraint;
// gating on viewport height instead left a short viewport's Test Real
// Investments panel un-stuck and scrolling away early, leaving a dead
// gutter beside the much longer output column).
function syncStickyPanels(){
  const panel=document.querySelector('main .grid > .panel');
  const output=document.querySelector('main .grid > .output');
  if(!panel) return;
  panel.classList.toggle('is-sticky', !output || panel.offsetHeight <= output.offsetHeight);
  syncPanelJumpBtn();
}

// Companion to the is-sticky check above, for the case that fails it: a
// panel taller than its output can't sticky (no room to travel), so once it
// scrolls past the top of the viewport it's gone until the user scrolls all
// the way back up manually. This button is the way back. Lives outside
// #main (created once, reused across renders) since #main gets replaced
// wholesale on every render() and would otherwise take the button with it.
let panelJumpBtn=null;
let panelJumpScrollT=null;
function syncPanelJumpBtn(){
  if(!panelJumpBtn){
    panelJumpBtn=document.createElement('button');
    panelJumpBtn.id='panelJumpBtn';
    panelJumpBtn.className='panel-jump-btn';
    panelJumpBtn.type='button';
    panelJumpBtn.innerHTML='&uarr; Back to assumptions';
    panelJumpBtn.addEventListener('click', ()=>{
      const p=document.querySelector('main .grid > .panel');
      if(p) p.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'});
    });
    document.body.appendChild(panelJumpBtn);
    window.addEventListener('scroll', ()=>{
      if(panelJumpScrollT) return;
      panelJumpScrollT = requestAnimationFrame(()=>{ panelJumpScrollT=null; syncPanelJumpBtn(); });
    }, {passive:true});
  }
  const panel=document.querySelector('main .grid > .panel');
  if(!panel || panel.classList.contains('is-sticky')){ panelJumpBtn.classList.remove('show'); return; }
  const scrolledPast = panel.getBoundingClientRect().bottom < 0;
  panelJumpBtn.classList.toggle('show', scrolledPast);
}

// See the rendering note above initChart() / the plan's "one architectural
// deviation" section: two companies x six statements x ~440 cells lands
// around 6-9k DOM nodes, and a full render() there costs 1.5-3s of blocked
// main thread -- unacceptable for something that would otherwise fire on
// every hover. statementsShellMounted tracks whether #main already holds
// the stable shell for this tab; once true, render() skips straight past
// this tab's innerHTML write on every subsequent call (including the ones
// fired by an unrelated global change, e.g. the country toggle) and leaves
// all updates to updateStatementsUI() and its callers instead. Set back to
// false on tab-away (below) and by resetTab() -- the only legitimate
// full-rebuild triggers per the plan: mount, add/remove company, tab
// leave-and-return, explicit reset.
let statementsShellMounted=false;
// Regression guard for the stable-shell rule: incremented only on the three
// legitimate full-rebuild triggers (mount, add/remove company via a fresh
// mount, tab leave-and-return). Exposed on window and mirrored onto
// #stmtRoot so a check in DevTools or a test can confirm it stays flat
// across hover/pin/focus interactions, which must only ever patch DOM.
window.__statementsRenderCount=0;
function render(){
  renderTabs();
  const main=document.getElementById('main');
  // "Read the Company" is a dedicated full-width reading surface, not one of
  // the app's grid-of-sliders tools -- it gets its own body class so it can
  // break out of main's shared max-width and the country toggle (India-only
  // data; the toggle has no meaning here) without touching any other tab.
  document.body.classList.toggle('stmt-page', L.tab==='statements');
  const countryToggleEl=document.getElementById('countryToggle');
  if(countryToggleEl) countryToggleEl.style.display = L.tab==='statements' ? 'none' : '';
  if(L.tab!=='statements'){ if(statementsShellMounted) teardownStatements(); statementsShellMounted=false; }
  if(L.tab==='home') main.innerHTML=renderHome();
  else if(L.tab==='retirement') main.innerHTML=renderRetirement();
  else if(L.tab==='stepup') main.innerHTML=renderStepUp();
  else if(L.tab==='swp') main.innerHTML=renderSWP();
  else if(L.tab==='fx') main.innerHTML=renderFX();
  else if(L.tab==='joint') main.innerHTML=renderJoint();
  else if(L.tab==='mc') main.innerHTML=renderMC();
  else if(L.tab==='portfolio') main.innerHTML=renderPortfolio();
  else if(L.tab==='livefrontier') main.innerHTML=renderLiveFrontier();
  else if(L.tab==='instruments') main.innerHTML=renderInstruments();
  else if(L.tab==='health') main.innerHTML=renderHealth();
  else if(L.tab==='statements'){
    if(!statementsShellMounted){
      main.innerHTML=renderStatementsShell();
      statementsShellMounted=true;
      window.__statementsRenderCount++;
      const rootEl=document.getElementById('stmtRoot'); if(rootEl) rootEl.dataset.renderCount=window.__statementsRenderCount;
      mountStatements();
    }
    // else: intentionally nothing -- see statementsShellMounted comment above.
  }
  main.classList.remove('enter'); void main.offsetWidth; main.classList.add('enter');
  const tabLabel=L.tab==='home' ? 'Home' : (TABS.find(t=>t.id===L.tab)||{}).label||'';
  document.getElementById('printHeader').innerHTML=
    '<div class="pt">Goalden Lab &middot; '+tabLabel+'</div>'+
    '<div class="ps">'+cfg().name+' &middot; printed '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</div>';
  attach();
  syncStickyPanels();
  persistLabState();
}

function attach(){
  // Scoped to #main, not document-wide: #tabbarInner's own [data-tab-switch]
  // buttons bind their own listener inside renderTabs(), only on the
  // renders where that DOM is actually rebuilt. Since renderTabs() now
  // skips rebuilding when the tab/country hasn't changed (see lastNavKey),
  // those nav buttons persist across re-renders -- if attach() re-bound
  // them here too on every render(), each stale render would leave behind
  // another listener and a single click would eventually fire render()
  // several times over.
  document.querySelectorAll('#main [data-tab-switch]').forEach(el=>el.addEventListener('click',()=>{
    // nextStepCard's optional carry: a "field.subfield" dotted path and a
    // numeric value computed by the tool being left. Written into L before
    // the tab switches, so the destination tool opens already showing the
    // number that motivated the click instead of its stale default.
    const carryField=el.dataset.carryField, carryValue=el.dataset.carryValue;
    if(carryField && carryValue!==undefined && carryValue!==''){
      const parts=carryField.split('.'); let obj=L;
      for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
      obj[parts[parts.length-1]]=parseFloat(carryValue);
    }
    L.tab=el.dataset.tabSwitch;
    try{ localStorage.setItem('goaldenLabLastTab', L.tab); }catch(e){}
    render();
  }));
  document.querySelectorAll('[data-country]').forEach(el=>el.addEventListener('click',()=>{
    L.country=el.dataset.country;L.instCategory='all';
    // Live Frontier's instrument list is per-country (different tickers,
    // different currency); switching countries mid-session would silently
    // mix INR and USD return series into one "portfolio" with no FX
    // adjustment, so it resets rather than carrying over.
    L.live.items=[]; L.live.data={}; L.live.selectedWeights=null; L.live.search=''; L.live.fundResults=[];
    render();
  }));

  let sliderRenderTimer=null;
  // render() replaces main.innerHTML wholesale, including the very <input
  // type=range> the browser has mid-drag — doing that synchronously inside
  // this element's own 'input' handler destroys the DOM node the browser's
  // native drag capture is tied to, so a real physical drag stops moving
  // the value after its first tick (state updates fine, but the screen
  // looks frozen). Debouncing the render past the drag lets the node stay
  // alive for the whole gesture; only the trailing pause/release triggers
  // the actual re-render. Mirrors the pattern MC already used for its own
  // (heavier) reason -- deferring the expensive 1000-path simulation.
  document.querySelectorAll('input[type=range][data-k]').forEach(el=>{
    el.addEventListener('input',()=>{
      const k=el.dataset.k, tab=el.dataset.tab||'ret';
      const target = tab==='step'?L.step : tab==='swp'?L.swp : tab==='fx'?L.fx : tab==='joint'?L.joint : tab==='mc'?L.mc : tab==='health'?L.health : L.ret;
      let v=parseFloat(el.value);
      if(k==='shockYear'){ L.ret.shock.year=v; }
      else if(k==='swpShockYear'){ L.swp.shock.year=v; }
      else target[k]=v;
      if(tab==='mc'){
        // MC's stats need the full 1000-path simulation to produce — there
        // is no cheap closed-form shortcut like Portfolio has. Echo just
        // the slider's own raw value instantly so the number readout
        // tracks the drag exactly, since the debounce below covers this
        // case too now.
        const lbl=document.querySelector(`[data-mc-label="${k}"]`);
        if(lbl) lbl.textContent = k==='sip' ? cfg().fmt(v) : (k==='years' ? v : v+'%');
      }
      if(sliderRenderTimer) clearTimeout(sliderRenderTimer);
      sliderRenderTimer=setTimeout(()=>{ sliderRenderTimer=null; render(); }, 130);
    });
  });

  // Keyboard number entry beside every slider — wraps each range input in a
  // flex row with a paired number field. Typing a value and pressing Enter
  // (or blurring) pushes it through the SAME slider input-event handler
  // above, so there is only one place that actually updates state.
  document.querySelectorAll('input[type=range][data-k]').forEach(slider=>{
    if(slider.parentElement.classList.contains('slider-row')) return;
    const row=document.createElement('div');
    row.className='slider-row';
    slider.parentElement.insertBefore(row, slider);
    row.appendChild(slider);
    const num=document.createElement('input');
    num.type='number'; num.className='field-num';
    num.min=slider.min; num.max=slider.max; num.step=slider.step||1;
    num.value=slider.value;
    row.appendChild(num);
    const pushToSlider=()=>{
      let v=parseFloat(num.value);
      if(isNaN(v)) { num.value=slider.value; return; }
      v=Math.max(parseFloat(slider.min), Math.min(parseFloat(slider.max), v));
      slider.value=v; num.value=v;
      // Deferred to the next tick: dispatching synchronously from inside a
      // blur handler can fire the re-render (which replaces this very
      // element's parent) while the browser is still finishing its own
      // blur-related DOM work, causing a "node no longer a child" error.
      setTimeout(()=>{ slider.dispatchEvent(new Event('input',{bubbles:true})); }, 0);
    };
    num.addEventListener('keydown',e=>{ if(e.key==='Enter') pushToSlider(); });
    num.addEventListener('blur',pushToSlider);
    slider.addEventListener('input',()=>{ num.value=slider.value; });
  });

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click',()=>{
      const key=el.dataset.toggle, val=el.dataset.val;
      const parsedVal = val==='true'?true : val==='false'?false : val;
      if(key==='direction'){
        if(parsedVal !== L.fx.direction){
          // Swap home/foreign rates so the defaults stay meaningful for
          // whichever country is now "home" — otherwise a US "home return"
          // silently keeps India's default rate, which is misleading.
          const tmp = L.fx.homeReturn;
          L.fx.homeReturn = L.fx.foreignReturn;
          L.fx.foreignReturn = tmp;
          // Rescale the principal roughly to the new home currency's scale
          // (₹10L ≈ $12K at ~₹83/$) so the number stays realistic rather
          // than showing "$1,000,000" as a default US contribution.
          L.fx.principal = parsedVal==='receivingFromAbroad'
            ? Math.round(L.fx.principal/83/500)*500
            : Math.round(L.fx.principal*83/50000)*50000;
        }
        L.fx.direction=parsedVal;
      }
      else if(key==='regime') L.mc.regime=parsedVal;
      else if(key==='emergencyStatus') L.health.emergencyStatus=parsedVal;
      else if(key==='shockSurvives') L.health.shockSurvives=parsedVal;
      else L.ret[key]=parsedVal;
      render();
    });
  });

  document.querySelectorAll('[data-shock]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.shock;
      if(id==='none'){ L.ret.shock=null; }
      else { L.ret.shock={epId:id, year: L.ret.shock?L.ret.shock.year:5}; }
      render();
    });
  });

  document.querySelectorAll('[data-swpshock]').forEach(el=>{
    el.addEventListener('click',()=>{
      const id=el.dataset.swpshock;
      if(id==='none'){ L.swp.shock=null; }
      else { L.swp.shock={epId:id, year: L.swp.shock?L.swp.shock.year:3}; }
      render();
    });
  });

  document.querySelectorAll('input[data-pfinf]').forEach(el=>{
    el.addEventListener('input',()=>{
      L.portfolio.inflation=parseFloat(el.value);
      const lbl=document.getElementById('pf-inf-label'); if(lbl) lbl.textContent=L.portfolio.inflation+'%';
      const num=document.querySelector('input[data-pfinf-num]'); if(num) num.value=el.value;
      // Cheap path only: inflation changes no chart, so no debounce needed.
      updatePortfolioLive();
    });
  });
  document.querySelectorAll('input[data-pfinf-num]').forEach(el=>{
    const push=()=>{
      let v=parseFloat(el.value); if(isNaN(v)){ return; }
      v=Math.max(0, Math.min(12, v));
      const sl=document.querySelector('input[data-pfinf]');
      sl.value=v; el.value=v;
      sl.dispatchEvent(new Event('input',{bubbles:true}));
    };
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') push(); });
    el.addEventListener('blur',push);
  });

  // Mode switch needs a full render, not just a live-patch: the amount
  // slider's min/max/step genuinely change between a lump sum and a
  // monthly SIP amount (e.g. up to 5 crore vs up to 5 lakh), so the
  // slider markup itself has to regenerate, not just its value.
  document.querySelectorAll('.pf-mode-btn').forEach(el=>{
    el.addEventListener('click',()=>{
      L.portfolio.investMode=el.dataset.pfmode;
      L.portfolio.investAmount=null; // reset to the new mode's own sensible default
      render();
    });
  });

  // Invest-in-this-mix: amount and years, same cheap live-patch path as
  // inflation above (pure closed-form compounding, no chart involved).
  document.querySelectorAll('input[data-pfamt]').forEach(el=>{
    el.addEventListener('input',()=>{
      L.portfolio.investAmount=parseFloat(el.value);
      const lbl=document.getElementById('pf-amt-label'); if(lbl) lbl.textContent=cfg().compact(L.portfolio.investAmount);
      const num=document.querySelector('input[data-pfamt-num]'); if(num) num.value=el.value;
      updatePortfolioLive();

function statementsBundle(sym){
  const d = sym ? L.statements.data[sym] : null;
  return d && d.status==='ready' ? d.result : null;
}
function fySeriesSafe(section, label){ return section ? fySeries(section, label) : []; }
function statementsMedianAndSpread(section, label){
  const series = fySeriesSafe(section, label);
  const values = series.map(p=>p.value);
  const med = median(values);
  const clean = values.filter(v=>v!=null);
  const maxAbsDev = clean.length && med!=null ? Math.max(1, ...clean.map(v=>Math.abs(v-med))) : 1;
  return {med, maxAbsDev};
}
// A value more than 1.5x the row's own inter-quartile range beyond its
// quartiles gets a one-pixel ledger tick -- exception marking that costs
// nothing when there's no exception.
function iqrBounds(values){
  const clean = values.filter(v=>v!=null).sort((a,b)=>a-b);
  if(clean.length<4) return null;
  const q=(p)=>{ const idx=(clean.length-1)*p; const lo=Math.floor(idx), hi=Math.ceil(idx); return lo===hi ? clean[lo] : clean[lo]+(clean[hi]-clean[lo])*(idx-lo); };
  const q1=q(0.25), q3=q(0.75), iqr=q3-q1;
  return { lo:q1-1.5*iqr, hi:q3+1.5*iqr };
}
function cellBarColorClass(dev, polarity){
  if(polarity==='neutral') return 'neutral';
  if(dev===0) return 'neutral';
  const goodDirection = polarity==='higher-better' ? dev>0 : dev<0;
  return goodDirection ? 'up' : 'down';
}
function formatCroreValue(v){
  if(v==null) return null;
  const sign = v<0 ? '-' : '';
  const abs = Math.abs(v);
  return sign + abs.toLocaleString('en-IN', {maximumFractionDigits:0});
}
function formatCellRaw(label, v){
  if(v==null) return null;
  const unit = rowUnit(label);
  if(unit==='pct') return v.toFixed(1)+'%';
  if(unit==='days') return Math.round(v)+'d';
  if(unit==='ratio') return v.toFixed(2)+'x';
  if(unit==='rupee') return '\u20b9'+v.toFixed(1);
  return formatCroreValue(v);
}
// 15 deterministic templates over the row's own fiscal-year series --
// arithmetic plus a string, never a model; same data in, same sentence out.
function readingSentence(label, series){
  const clean = series.filter(p=>p.value!=null);
  if(clean.length<3) return '';
  const last = clean[clean.length-1], prev = clean[clean.length-2], first = clean[0];
  const polarity = rowPolarity(label);
  const cagrYears = clean.length-1;
  const cagr = (first.value>0 && last.value!=null && cagrYears>0) ? (Math.pow(Math.abs(last.value/first.value), 1/cagrYears)-1) : null;
  const upYears = clean.slice(1).filter((p,i)=>p.value>clean[i].value).length;
  const downYears = clean.length-1-upYears;
  const maxP = clean.reduce((a,b)=>b.value>a.value?b:a);
  const minP = clean.reduce((a,b)=>b.value<a.value?b:a);

  // A sign flip is the single most decision-relevant fact about a row --
  // checked first so it's never buried under a milder trend template.
  if(prev.value>=0 && last.value<0) return `Turned negative in FY${last.year}, from FY${prev.year}.`;
  if(prev.value<0 && last.value>=0) return `Turned positive in FY${last.year}, from FY${prev.year}.`;

  // A monotonic run over the last 3 transitions reads as a streak, which an
  // averaged CAGR doesn't communicate on its own.
  const last4 = clean.slice(-4);
  if(last4.length===4){
    if(last4.every((p,i)=>i===0 || p.value>last4[i-1].value)) return `A new high in each of the last 3 years.`;
    if(last4.every((p,i)=>i===0 || p.value<last4[i-1].value)) return `A new low in each of the last 3 years.`;
  }

  if(last.value===maxP.value && polarity!=='lower-better') return `Highest in ${clean.length} years, at FY${last.year}.`;
  if(last.value===minP.value && polarity==='lower-better') return `Lowest in ${clean.length} years, at FY${last.year}.`;

  if(first.value>0 && last.value/first.value>=2) return `More than doubled over ${cagrYears} years, from ${formatCellRaw(label,first.value)} to ${formatCellRaw(label,last.value)}.`;
  if(first.value>0 && last.value>=0 && last.value/first.value<=0.5) return `Cut by more than half over ${cagrYears} years, from ${formatCellRaw(label,first.value)} to ${formatCellRaw(label,last.value)}.`;

  if(cagr!=null && cagr>0.005 && upYears>=Math.ceil((clean.length-1)*0.6)) return `Grew ${(cagr*100).toFixed(0)}% a year on average over ${cagrYears} years.`;
  if(cagr!=null && cagr<-0.005 && downYears>=Math.ceil((clean.length-1)*0.6)) return `Fell ${(Math.abs(cagr)*100).toFixed(0)}% a year on average over ${cagrYears} years.`;

  if(downYears>=Math.ceil(clean.length*0.5) && downYears>upYears) return `Down in ${downYears} of the last ${clean.length-1} years.`;
  if(upYears>=Math.ceil(clean.length*0.5) && upYears>downYears) return `Up in ${upYears} of the last ${clean.length-1} years.`;

  const range = maxP.value-minP.value;
  if(Math.abs(range) < Math.abs(median(clean.map(p=>p.value))||1)*0.1) return `Little changed over ${clean.length} years.`;
  if(clean.length>=6 && Math.abs(upYears-downYears)<=1) return `No consistent direction over ${clean.length} years — moved up and down roughly equally.`;

  return `Ranged from ${formatCellRaw(label,minP.value)} (FY${minP.year}) to ${formatCellRaw(label,maxP.value)} (FY${maxP.year}).`;
}
// 12 bars, not a line -- the cell footers already use bars, and a second
// shape for the same series would read as a contradiction.
function sparklineSVG(series){
  const clean = series.map(p=>p.value);
  const valid = clean.filter(v=>v!=null);
  if(valid.length<2) return '<svg class="stmt-spark" width="64" height="18"></svg>';
  const max=Math.max(...valid), min=Math.min(0,...valid);
  const range=(max-min)||1;
  const n=clean.length, bw=64/n;
  const bars = clean.map((v,i)=>{
    if(v==null) return '';
    const h = Math.max(1, ((v-min)/range)*16);
    return `<rect x="${(i*bw+0.5).toFixed(1)}" y="${(17-h).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${h.toFixed(1)}" fill="currentColor"/>`;
  }).join('');
  return `<svg class="stmt-spark" width="64" height="18" viewBox="0 0 64 18">${bars}</svg>`;
}

function statementsCanonicalRows(schema){
  return CANONICAL_ROWS[schema] || CANONICAL_ROWS.nonfinancial;
}

/* ---- data loading ------------------------------------------------------ */
async function fetchStatementsCompany(symbol){
  const sym=String(symbol||'').trim().toUpperCase();
  if(!sym) return;
  if(L.statements.data[sym] && L.statements.data[sym].status==='ready'){ updateStatementsUI(); return; }
  L.statements.data[sym]={status:'loading'};
  updateStatementsUI();
  try{
    const result = await liveApiGet('/api/financials?symbol='+encodeURIComponent(sym));
    L.statements.data[sym]={status:'ready', result};
  }catch(e){
    L.statements.data[sym]={status:'error', error:(e&&e.message)||String(e)};
  }
  updateStatementsUI();
}
// Raw-close daily bars, fetched separately from /api/financials -- the
// re-rating spread and P/E-history band need Yahoo's un-adjusted `close`
// (see statements-engine.js's fyEndPriceSeries), never the adjclose series
// /api/history normally prefers for Test Real Investments' total-return
// CAGR. Runs alongside fetchStatementsCompany, not blocking it -- the
// tables and checklist render with what they have; these two metrics fill
// in once the price history lands.
async function fetchStatementsPriceHistory(symbol){
  const sym=String(symbol||'').trim().toUpperCase();
  if(!sym) return;
  if(L.statements.priceHistory[sym] && L.statements.priceHistory[sym].status==='ready') return;
  L.statements.priceHistory[sym]={status:'loading'};
  try{
    const result = await liveApiGet('/api/history?type=equity&symbol='+encodeURIComponent(sym+'.NS'));
    L.statements.priceHistory[sym]={status:'ready', prices:result.prices, label:result.label};
  }catch(e){
    L.statements.priceHistory[sym]={status:'error', error:(e&&e.message)||String(e)};
  }
  updateStatementsUI();
}
function addRecentTicker(sym){
  const r=L.statements.recent.filter(t=>t!==sym);
  r.unshift(sym);
  L.statements.recent=r.slice(0,6);
}
function seedDefaultPinIfEmpty(sym){
  if(L.statements.pins.length) return;
  const b=statementsBundle(sym);
  if(!b || !b.schema) return;
  const rows=statementsCanonicalRows(b.schema).profitLoss;
  const headline = rows[0];
  if(headline) L.statements.pins.push({section:'profitLoss', label:headline});
}
function statementsEnsureLoaded(){
  const sym=L.statements.primary;
  if(!sym) return;
  addRecentTicker(sym);
  fetchStatementsCompany(sym).then(()=>{ seedDefaultPinIfEmpty(sym); updateStatementsUI(); });
  fetchStatementsPriceHistory(sym);
}
function statementsSetPrimary(symbol){
  const sym=String(symbol||'').trim().toUpperCase();
  if(!sym) return;
  const changed = sym!==L.statements.primary;
  L.statements.primary=sym;
  if(changed){ L.statements.pins=[]; L.statements.focusYear=null; L.statements._focusedFlag=null; L.statements.companionFocus=null; L.statements.checklistDismissed=false; }
  L.statements.search='';
  addRecentTicker(sym);
  const input=document.getElementById('stmtSearchInput'); if(input) input.value='';
  renderCompareRowUI(); renderRecentUI();
  fetchStatementsCompany(sym).then(()=>{ seedDefaultPinIfEmpty(sym); updateStatementsUI(); });
  fetchStatementsPriceHistory(sym);
}
function statementsSetCompare(symbol){
  const sym = symbol ? String(symbol).trim().toUpperCase() : null;
  L.statements.compare = sym;

function statementsTogglePin(section,label){
  const key=rowKey(section,label);

  if(idx>=0) L.statements.pins.splice(idx,1);

    L.statements.pins.push({section,label});
    if(L.statements.pins.length>4) L.statements.pins.shift();
    L.statements.companionFocus = {section,label};
  }
  updateStatementsUI();

  L.statements.focusYear = (year===L.statements.focusYear) ? null : year;

function computeStatementsDivergence(){
  const primary=statementsBundle(L.statements.primary);
  return primary ? evaluateDivergenceRules(primary) : null;

function statementsOpenFlag(flagKey){
  const sep=flagKey.lastIndexOf('|');
  const ruleId=flagKey.slice(0,sep), year=parseInt(flagKey.slice(sep+1));
  const div = computeStatementsDivergence();
  if(!div) return;
  const flag = div.flags.find(f=>f.ruleId===ruleId && f.year===year);
  if(!flag) return;
  L.statements.focusYear = year;
  (FLAG_PIN_MAP[ruleId]||[]).forEach(p=>{
    if(!L.statements.pins.some(x=>x.section===p.section && x.label===p.label)){
      L.statements.pins.push(p);
      if(L.statements.pins.length>4) L.statements.pins.shift();
    }
  });
  L.statements._focusedFlag = flag;
  updateStatementsUI();
}

/* ---- Phase 2: growth-window detail and the Growth & Returns card -----
   growthSummary()/windowCagr() (statements-engine.js) return a bare CAGR
   per window. The plan bans showing a bare CAGR -- "entirely determined
   by two endpoints" -- so every window here is paired with the count of
   years that were actually positive inside it and the single worst year,
   computed here from the same fiscal-year series, never from the CAGR
   number itself. */
function stmtWindowDetail(series, years){
  const clean = series.filter(p=>p.value!=null);
  if(clean.length < years+1) return null;
  const slice = clean.slice(-(years+1));
  let positives=0, total=0, worst=null;
  for(let i=1;i<slice.length;i++){
    const a=slice[i-1].value, b=slice[i].value;
    if(a==null||b==null||a===0||(a<0)!==(b<0)) continue;
    const yoy=(b-a)/Math.abs(a);
    total++;
    if(yoy>0) positives++;
    if(worst==null || yoy<worst.value) worst={year:slice[i].year, value:yoy};
  }
  return { windowStart:slice[0].year, windowEnd:slice[slice.length-1].year, positives, total, worst };
}
// Fiscal year-end month, read from the latest fy period's ISO date key
// ("2025-03-31" -> 3) rather than assumed -- the plan is explicit that
// fiscal year-end months differ across Indian companies (Mar vs Dec).
function statementsFyEndMonth(pl){
  const periods = pl ? pl.periods.filter(p=>p.type==='fy' && p.key) : [];
  if(!periods.length) return 3;
  const m = Number(String(periods[periods.length-1].key).slice(5,7));
  return (m>=1 && m<=12) ? m : 3;
}
// Screener gives us a bare trading code ("TCS"); Yahoo's price history is
// fetched by guessing "TCS.NS". For the names this app knows about, that
// guess is screener's own convention and is solid -- but it is still a
// guess, not a proof, and a wrong one would silently stitch the right
// company's financials to a different company's share price without
// throwing any error. This cross-checks Yahoo's own returned company
// label against the name this app already has on file for that ticker
// (the same curated list Test Real Investments uses), so a mismatch shows
// up as a visible warning instead of a silently wrong number. Skips
// entirely (returns null) for a ticker outside that curated list -- there
// is no reference name to check against, so no comparison is drawn.
function stmtNormalizeCompanyName(name){
  const LEGAL_SUFFIXES = new Set(['LIMITED','LTD','PRIVATE','PVT','INC','PLC','CORPORATION']);
  return String(name||'').toUpperCase().replace(/[.,&()]/g,' ').split(/\s+/)
    .filter(w=>w && !LEGAL_SUFFIXES.has(w) && w.length>=3);
}
function stmtTickerIdentityCheck(sym, yahooLabel){
  if(!yahooLabel) return null;
  const known = IN_STOCKS.find(s=>s.symbol===sym+'.NS');
  if(!known) return null; // outside the curated list -- nothing on file to compare against
  const knownTokens = stmtNormalizeCompanyName(known.name);
  const yahooTokens = new Set(stmtNormalizeCompanyName(yahooLabel));
  const overlaps = knownTokens.some(w=>yahooTokens.has(w));
  return { ok: overlaps, knownName: known.name, yahooLabel };
}
// Single source of truth for the price-dependent Phase 2 metrics --
// re-rating spread and the P/E-history band -- shared by the Growth &
// Returns card and the Compounding Checklist's adjacent P/E line so both
// read the same computation. Returns null only when the statement bundle
// itself isn't ready; otherwise returns a status so callers can render a
// loading/error state rather than silently showing nothing.
function statementsPeBand(sym){
  const d = L.statements.data[sym];
  if(!d || d.status!=='ready') return null;
  const priceHist = L.statements.priceHistory[sym];
  if(!priceHist || priceHist.status!=='ready') return { status: priceHist ? priceHist.status : 'loading' };
  const bundle = d.result;
  const faceValue = bundle.topRatios && bundle.topRatios.faceValue;
  if(!faceValue) return { status:'error', error:'Face value is not reported for this company, so shares cannot be split-adjusted.' };
  const pl = bundle.profitLoss, bs = bundle.balanceSheet;
  const npSeries = fySeries(pl, 'Net Profit');
  const fyYears = npSeries.map(p=>p.year);
  const fyEndMonth = statementsFyEndMonth(pl);
  const priceFy = fyEndPriceSeries(priceHist.prices.map(p=>({date:p.date, close:p.rawClose})), fyYears, fyEndMonth);
  const epsSeries = epsFromShrink(pl, bs, faceValue);
  const band = peHistoryBand(priceFy, epsSeries);
  const nameCheck = stmtTickerIdentityCheck(sym, priceHist.label);
  return { status:'ready', band, spread10: reratingSpread(priceFy, npSeries, 10), spread5: reratingSpread(priceFy, npSeries, 5), nameCheck };
}
function stmtGrowthRowHTML(label, series){
  const g = growthSummary(series);
  const cell = v => v!=null ? `<span class="stmt-depth-cagr">${(v*100).toFixed(1)}%</span>` : '<span class="stmt-depth-dash">—</span>';
  const d10 = stmtWindowDetail(series, 10);
  const note = d10 ? `${advisorAttr(label)}: 10-year window FY${d10.windowStart}–FY${d10.windowEnd}, ${d10.positives} of ${d10.total} years grew, worst year ${d10.worst?('FY'+d10.worst.year+' at '+(d10.worst.value*100).toFixed(1)+'%'):'—'}.` : '';
  return { row: `<tr><td>${advisorAttr(label)}</td><td>${cell(g.y10)}</td><td>${cell(g.y5)}</td><td>${cell(g.y3)}</td><td>${cell(g.y1)}</td></tr>`, note };
}
function renderDepthMetricsHTML(){
  const s=L.statements;
  const d = s.data[s.primary];
  if(!d || d.status!=='ready') return '';
  const bundle = d.result;
  const pl = bundle.profitLoss, bs = bundle.balanceSheet;
  const schema = bundle.schema;
  const salesRaw = fySeries(pl, 'Sales');
  const salesLabel = salesRaw.length ? 'Sales' : 'Revenue';
  const salesSeries = salesRaw.length ? salesRaw : fySeries(pl, 'Revenue');
  const npSeries = fySeries(pl, 'Net Profit');
  const salesRowData = stmtGrowthRowHTML(salesLabel, salesSeries);
  const npRowData = stmtGrowthRowHTML('Net Profit', npSeries);
  const growthTable = `<table class="stmt-depth-table"><thead><tr><th></th><th>10y</th><th>5y</th><th>3y</th><th>1y</th></tr></thead>
    <tbody>${salesRowData.row}${npRowData.row}</tbody></table>

    <div class="stmt-depth-note">${npRowData.note}</div>`;

  let returnsBlock;

    returnsBlock = `<div class="stmt-depth-refusal"><b>Incremental ROCE and asset turnover aren't shown here.</b> Both formulas depend on capital-employed and total-assets figures that mean something different for a lender than for a manufacturer, so this app doesn't compute them outside the non-lender schema.</div>`;
  } else {
    const incRoce = incrementalRoce(pl, bs).filter(p=>p.value!=null);
    const incLatest = incRoce.length ? incRoce[incRoce.length-1] : null;
    const incMed = median(incRoce.map(p=>p.value));
    const atSeries = assetTurnover(pl, bs).filter(p=>p.value!=null);
    const atLatest = atSeries.length ? atSeries[atSeries.length-1] : null;

      <div class="stmt-depth-stat">

        <div class="stmt-depth-stat-value">${incLatest ? (incLatest.value*100).toFixed(1)+'% (FY'+incLatest.year+')' : '—'}<span class="stmt-depth-stat-sub">${incMed!=null ? 'median '+(incMed*100).toFixed(1)+'%' : ''}</span></div>
      </div>
      <div class="stmt-depth-stat">
        <div class="stmt-depth-stat-label">Asset Turnover<span class="stmt-ctrl-hint">${salesLabel} divided by Total Assets — how much revenue each rupee on the balance sheet produces</span></div>
        <div class="stmt-depth-stat-value">${atLatest ? atLatest.value.toFixed(2)+'x (FY'+atLatest.year+')' : '—'}</div>
      </div>
    </div>`;
  }

  const faceValue = bundle.topRatios && bundle.topRatios.faceValue;
  const bvSeries = faceValue ? bookValuePerShareSeries(bs, faceValue).filter(p=>p.value!=null) : [];
  const bvLatest = bvSeries.length ? bvSeries[bvSeries.length-1] : null;
  const currentPrice = bundle.topRatios && bundle.topRatios.currentPrice;
  const pb = (faceValue && currentPrice!=null) ? priceToBookLatest(currentPrice, bookValuePerShareSeries(bs, faceValue)) : null;
  const bvBlock = `<div class="stmt-depth-stats">
    <div class="stmt-depth-stat">
      <div class="stmt-depth-stat-label">Book Value per Share<span class="stmt-ctrl-hint">(Equity Capital + Reserves) ÷ split-adjusted shares, in today's share units — comparable across a stock split in a way the as-reported figure isn't</span></div>
      <div class="stmt-depth-stat-value">${bvLatest ? '₹'+formatCroreValue(bvLatest.value)+' (FY'+bvLatest.year+')' : '—'}</div>
    </div>
    <div class="stmt-depth-stat">
      <div class="stmt-depth-stat-label">Price to Book<span class="stmt-ctrl-hint">Today's share price divided by the latest book value per share</span></div>
      <div class="stmt-depth-stat-value">${pb!=null ? pb.toFixed(2)+'x' : '—'}</div>
    </div>
  </div>`;

  const peResult = statementsPeBand(s.primary);
  let reratingBlock = '';
  if(peResult && peResult.status==='loading'){
    reratingBlock = `<div class="cap" style="margin-top:14px">Loading daily price history for the re-rating spread and P/E-history band…</div>`;
  } else if(peResult && peResult.status==='error'){
    reratingBlock = `<div class="stmt-depth-refusal" style="margin-top:14px"><b>Re-rating spread and P/E history aren't shown.</b> ${advisorAttr(peResult.error)}</div>`;
  } else if(peResult && peResult.status==='ready'){
    const band = peResult.band;
    const spreadTxt = v => v!=null ? `${v>=0?'+':''}${(v*100).toFixed(1)}pp` : '—';
    const bandTxt = (band.percentile!=null) ? `${band.current.toFixed(1)}x now, ${band.percentile}th percentile of its own last ${band.series.filter(p=>p.value!=null).length}-year range (${band.min.toFixed(1)}x–${band.max.toFixed(1)}x, median ${band.median.toFixed(1)}x)` : '—';
    // Yahoo's chart endpoint caps daily history at 10 years, so a 10-year

    // back to the 5-year window rather than show a blank, and relabel the
