    // window rule.
    const spreadYears = peResult.spread10!=null ? 10 : 5;
    const spreadValue = peResult.spread10!=null ? peResult.spread10 : peResult.spread5;
    reratingBlock = `<div class="stmt-depth-stats" style="margin-top:14px">
      <div class="stmt-depth-stat">
        <div class="stmt-depth-stat-label">Re-rating Spread (${spreadYears}y)<span class="stmt-ctrl-hint">Stock price CAGR minus profit CAGR over the common ${spreadYears}-year window — how much of the price rise came from the market paying more, versus the company earning more</span></div>
        <div class="stmt-depth-stat-value">${spreadTxt(spreadValue)}</div>
      </div>
      <div class="stmt-depth-stat">
        <div class="stmt-depth-stat-label">P/E vs Its Own History<span class="stmt-ctrl-hint">Where today's P/E sits within its own trailing band, computed from split-adjusted EPS and raw (non-dividend-adjusted) year-end prices — cheap vs its own history is a different question from cheap vs peers</span></div>
        <div class="stmt-depth-stat-value" style="font-size:14px">${bandTxt}</div>
      </div>
    </div>`;
    // These two metrics blend two sources with different reach: the
    // statement tables above come from screener.in, which typically carries
    // ~12 years; the price series comes from Yahoo's daily chart endpoint,
    // capped at 10. When that leaves the price side shorter than the
    // statement side, say so plainly rather than let the mismatch pass as
    // if both metrics saw the same span of years the tables show.
    const statementYears = npSeries.filter(p=>p.value!=null).map(p=>p.year);
    const priceYears = band.series.filter(p=>p.value!=null).map(p=>p.year);
    if(statementYears.length && priceYears.length && Math.min(...statementYears) < Math.min(...priceYears)){
      reratingBlock += `<div class="cap" style="margin-top:8px">Statement history above goes back to FY${Math.min(...statementYears)} (source: screener.in). Daily price history only reaches back to FY${Math.min(...priceYears)} (source: Yahoo Finance, capped at 10 years) — the two metrics above use the shorter, price-limited window, not the full statement history.</div>`;
    }
  }

  return `<div class="stmt-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>Growth & Returns</div>
  <div class="cap" style="margin-bottom:10px">Derived from the same reported rows in the tables above — standard formulas, no new data.</div>
  ${growthTable}
  ${returnsBlock}
  ${bvBlock}
  ${reratingBlock}`;
}
/* ---- Phase 3: the Compounding Checklist ------------------------------
   Per-company only, never a total, never a rank -- see the plan's hard
   constraints. compoundingChecklist() already returns all ten conditions
   in fixed order with a real printed value each; this function only adds
   the framing text, the quality-gate overlay, and identical styling for
   met/not-met rows (state is a word, never a colour). */
function renderCompoundingChecklistHTML(){
  const s=L.statements;
  const d = s.data[s.primary];
  if(!d || d.status!=='ready') return '';
  const bundle = d.result;
  const faceValue = bundle.topRatios && bundle.topRatios.faceValue;
  const conditions = compoundingChecklist(bundle, {faceValue});
  const gate = checklistQualityGate(computeStatementsDivergence());
  const blocked = gate.blocked && !s.checklistDismissed;
  // The glyph is mandatory, colour is never the only signal -- same rule
  // the table's own ▲/▼ change cells already follow. A filled vs. hollow
  // vs. dashed circle is scannable at a glance without needing hue, and
  // every state still prints its own word right after it (the plan's own
  // "prints its actual value, never just a tick" rule).
  const stateGlyph = c => c.available ? (c.meets===true ? '●' : c.meets===false ? '○' : '–') : '–';
  const stateLabel = c => c.available ? (c.meets===true ? 'Met' : c.meets===false ? 'Not met' : 'Unclear') : 'Not available';
  const rows = conditions.map(c=>`<div class="stmt-checklist-row${c.available?'':' unavailable'}">
    <span class="stmt-checklist-id">${c.id}</span>
    <span class="stmt-checklist-label">${advisorAttr(c.label)}</span>
    <span class="stmt-checklist-value">${advisorAttr(c.value)}</span>
    <span class="stmt-checklist-state"><span class="stmt-checklist-glyph">${stateGlyph(c)}</span>${stateLabel(c)}</span>
  </div>`).join('');
  const tr = bundle.topRatios;
  const peResult = statementsPeBand(s.primary);
  const peBand = (peResult && peResult.status==='ready') ? peResult.band : null;
  let peHistoryClause = '';
  if(peBand && peBand.percentile!=null){
    const clean = peBand.series.filter(p=>p.value!=null);
    const below = clean.filter(p=>p.value<=peBand.current).length;
    peHistoryClause = `, higher than in ${below} of the last ${clean.length} years`;
  }
  const peLine = (tr && tr.stockPE!=null) ? `<div class="cap" style="margin-top:12px">This company currently trades at a P/E of ${tr.stockPE.toFixed(1)}${peHistoryClause}. This checklist describes the past ten years of the business. It says nothing about what you would pay today.</div>` : '';
  const overlay = gate.blocked ? `<div class="stmt-checklist-gate">
    <div>${advisorAttr(gate.reason)}</div>
    ${blocked ? `<button class="ns-btn" data-stmt-checklist-dismiss>Show the checklist anyway</button>` : ''}
  </div>` : '';
  return `<div class="stmt-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Compounding Checklist</div>
  <div class="stmt-checklist-framing">
    <p>Companies that grew steadily over decades tended to share certain patterns in their past accounts. This page checks how many of those patterns are present in ${advisorAttr(s.primary)}'s last ten years.</p>
    <p>This is a description of what already happened. It is not a forecast, not a rating, and not advice to buy or sell anything.</p>
    <p>Two things worth knowing before you read it. Many companies that showed every one of these patterns still went nowhere afterwards. And we can only see the companies that survived to be looked at — the ones that failed aren't in any of this data. What a company did for ten years does not determine what it does next.</p>
  </div>
  ${overlay}
  ${blocked ? '' : `<div class="stmt-checklist-list">${rows}</div>${peLine}`}`;
}
function statementsEffectiveCompare(){
  const s=L.statements;
  if(!s.compare) return null;
  const primary=statementsBundle(s.primary), compare=statementsBundle(s.compare);
  if(!primary||!compare) return null;
  return compareRefusal(primary,compare) ? null : compare;
}
// Cross-company period pin carries the comparison IN the chip, not in the
// cells -- "OPM% FY2023 · TCS 18.4% · HDFCBANK 12.1% · gap 6.3pp" is the
// inference the plan asks for delivered without the reader doing arithmetic.
// Only renders once both a compare company and a focused year exist; a plain
// single-company Bench chip stays exactly as before.
function statementsChipGapHTML(pin){
  const s=L.statements;
  if(!s.compare || s.focusYear==null) return '';
  const primary = statementsBundle(s.primary), compare = statementsBundle(s.compare);
  if(!primary || !compare) return '';
  const primPt = fySeriesSafe(primary[pin.section], pin.label).find(p=>p.year===s.focusYear);
  const compPt = fySeriesSafe(compare[pin.section], pin.label).find(p=>p.year===s.focusYear);
  if(!primPt || !compPt || primPt.value==null || compPt.value==null) return '';
  const primText = formatCellRaw(pin.label, primPt.value);
  const compText = formatCellRaw(pin.label, compPt.value);
  const gapRaw = Math.abs(compPt.value - primPt.value);
  const gapText = rowUnit(pin.label)==='pct' ? gapRaw.toFixed(1)+'pp' : (formatCellRaw(pin.label, gapRaw) || '—');
  return `<span class="stmt-chip-gap">FY${s.focusYear} · ${advisorAttr(s.primary)} ${primText} · ${advisorAttr(s.compare)} ${compText} · gap ${gapText}</span>`;
}

function renderCompanionStripHTML(){

  // -- a statement row, or a price-dependent market fact (Stock P/E,
  // Dividend Yield) that can't be pinned itself but still has companions

function statementsPinSeries(pin){
  const primary = statementsBundle(L.statements.primary);
  const compare = statementsEffectiveCompare();
  const primSeries = primary ? fySeriesSafe(primary[pin.section], pin.label) : [];
  const compSeries = compare ? fySeriesSafe(compare[pin.section], pin.label) : [];
  return { label: pin.label, series: primSeries, compareSeries: compSeries.length?compSeries:undefined, compareLabel: L.statements.compare };
}
function benchChartOptionAtYear(pins, year){
  const cats = pins.map(p=>p.label);
  const primVals = pins.map(p=>{ const pt=p.series.find(s=>s.year===year); return pt?pt.value:null; });
  const hasCompare = pins.some(p=>p.compareSeries);
  const series=[{name:'Value', type:'bar', data:primVals, itemStyle:{color:SERIES_PALETTE[0].color}}];
  if(hasCompare){
    const compVals = pins.map(p=>{ if(!p.compareSeries) return null; const pt=p.compareSeries.find(s=>s.year===year); return pt?pt.value:null; });
    series.push({name:L.statements.compare||'Compare', type:'bar', data:compVals, itemStyle:{color:SERIES_PALETTE[0].color, opacity:.45}});
  }
  return { legend:{show:false}, xAxis:{type:'category', data:cats}, yAxis:{type:'value'}, series };
}
// A chart with no caption asks the reader to infer units, window and mode
// from axis labels alone -- fine for someone who already knows what an
// indexed line means, useless for the beginner this whole tab is for.
// Computed from the pins actually on screen, so it can never drift from
// what the chart is showing.
function benchCaptionText(pins, indexed, focusYear){
  if(!pins.length) return '';
  const names = pins.map(p=>p.label);
  const list = names.length<=2 ? names.join(' and ') : names.slice(0,-1).join(', ')+' and '+names[names.length-1];
  const hasCompare = pins.some(p=>p.compareSeries);
  if(focusYear!=null) return `FY${focusYear} only — one bar per pinned row${hasCompare?' per company':''}: ${list}.`;
  const years = pins.flatMap(p=>p.series.map(s=>s.year));
  const minY = years.length?Math.min(...years):null, maxY=years.length?Math.max(...years):null;
  const rangeTxt = (minY!=null && maxY!=null) ? `FY${minY}–FY${maxY}` : '';
  return indexed
    ? `Indexed to 100 at ${minY!=null?'FY'+minY:'the earliest common year'} so lines are comparable regardless of scale, ${rangeTxt}: ${list}.`
    : `Actual reported values, ${rangeTxt}: ${list}.`;
}
// Hover tooltip for the default (over-time) Bench chart: the row's real
// reported value for the hovered year -- never the indexed-to-100 number
// the chart may actually be plotting, which reads as meaningless on its
// own -- plus the same deterministic reading-column sentence (arithmetic
// and a template, see readingSentence()) already printed next to that row
// in the table, so "why does this matter" is answered with the one fact
// this app already computed for it, not a fresh model-written explanation.
function benchTooltipOverTime(pins){
  const reasonByLabel={}; pins.forEach(p=>{ reasonByLabel[p.label]=readingSentence(p.label,p.series); });
  return { trigger:'axis', axisPointer:{type:'shadow'}, confine:true, formatter:(params)=>{
    if(!params||!params.length) return '';
    const yearLabel = params[0].axisValueLabel||'';
    const year = 2000+parseInt(String(yearLabel).replace('FY',''),10);
    const rows = params.map(p=>{
      const isCompare = p.seriesName.indexOf(' — ')>=0;
      const pinLabel = isCompare ? p.seriesName.split(' — ')[1] : p.seriesName;
      const pin = pins.find(x=>x.label===pinLabel);
      const seriesArr = pin ? (isCompare ? (pin.compareSeries||[]) : pin.series) : [];
      const pt = seriesArr.find(s=>s.year===year);
      const valText = (pt && pt.value!=null) ? formatCellRaw(pinLabel, pt.value) : '—';
      const reason = (!isCompare && reasonByLabel[pinLabel]) ? `<div style="color:#8a97a8;font-size:11px;margin-top:2px;max-width:230px;white-space:normal">${advisorAttr(reasonByLabel[pinLabel])}</div>` : '';
      return `<div style="margin-top:5px"><b style="color:${p.color}">${advisorAttr(p.seriesName)}</b>: ${advisorAttr(valText)}${reason}</div>`;
    }).join('');
    return `<div style="font-weight:600">FY${isNaN(year)?'':year}</div>${rows}`;
  }};
}
// Bar-at-a-year mode: the x-axis is pin labels, not fiscal years, so there's
// one reading sentence for the whole tooltip (about that row's history)
// rather than one per bar.
function benchTooltipAtYear(pins){
  const reasonByLabel={}; pins.forEach(p=>{ reasonByLabel[p.label]=readingSentence(p.label,p.series); });
  return { trigger:'axis', axisPointer:{type:'shadow'}, confine:true, formatter:(params)=>{
    if(!params||!params.length) return '';
    const pinLabel = params[0].axisValueLabel||params[0].name||'';
    const rows = params.map(p=>{
      const valText = p.value!=null ? formatCellRaw(pinLabel, p.value) : '—';
      return `<div style="margin-top:5px"><b style="color:${p.color}">${advisorAttr(p.seriesName)}</b>: ${advisorAttr(valText)}</div>`;
    }).join('');
    const reason = reasonByLabel[pinLabel];
    const reasonHtml = reason ? `<div style="color:#8a97a8;font-size:11px;margin-top:4px;max-width:230px;white-space:normal">${advisorAttr(reason)}</div>` : '';
    return `<div style="font-weight:600">${advisorAttr(pinLabel)}</div>${rows}${reasonHtml}`;
  }};
}
function updateBenchChart(){
  const s=L.statements;
  const dom=document.getElementById('stmtBenchChart');
  const capEl=document.getElementById('stmtBenchCaption');
  if(!dom) return;
  if(!s.pins.length){ disposeChart('stmtBenchChart'); dom.innerHTML='<div class="cap" style="padding:20px">Pin a row below to chart it here.</div>'; if(capEl) capEl.textContent=''; return; }
  // Only clear the placeholder text on the 0-pins-to-1-pin transition. Once
  // a chart instance is live, initChart() re-uses its DOM node via
  // setOption() -- wiping innerHTML here on every subsequent pin change was
  // orphaning that node from the live tree (echarts kept rendering into a
  // detached SVG root), leaving the Bench blank after the first update.
  if(!chartInstances['stmtBenchChart']) dom.innerHTML='';
  const pins = s.pins.map(statementsPinSeries);
  const option = s.focusYear!=null ? benchChartOptionAtYear(pins, s.focusYear) : benchChartOption(pins, s.indexed);
  option.tooltip = s.focusYear!=null ? benchTooltipAtYear(pins) : benchTooltipOverTime(pins);
  initChart('stmtBenchChart', option);
  // Bar-at-a-year mode re-keys the x-axis to pin labels, not fiscal years,
  // so a data-period hover value can't address a dataIndex on it the same
  // way -- cross-highlight only applies to the default over-time view.
  stmtChartYears.bench = s.focusYear==null ? (option.__years||[]) : [];
  if(capEl) capEl.textContent = benchCaptionText(pins, s.indexed, s.focusYear);
}
function renderDivergenceParts(){
  const result = computeStatementsDivergence();
  if(!result) return {tickRow:'', summary:''};
  const primary=statementsBundle(L.statements.primary);
  const periods = (primary.profitLoss ? primary.profitLoss.periods : []).filter(p=>p.type==='fy');
  if(!periods.length) return {tickRow:'', summary:''};
  const minYear=periods[0].year, maxYear=periods[periods.length-1].year;
  const span = Math.max(1, maxYear-minYear);
  const ticks = result.flags.map(f=>{
    const pct = ((f.year-minYear)/span)*100;
    return `<div class="stmt-tick" style="left:${pct}%" data-stmt-flag="${advisorAttr(f.ruleId+'|'+f.year)}" title="${advisorAttr(f.message)}"></div>`;
  }).join('');
  const shown = result.flags.length;
  // result.fired counts every rule-year that actually fired, including a
  // single-year blip the persistence gate correctly keeps off the visible
  // strip -- using it here (not the shown/capped count) is what makes
  // notApplicable + clear + fired sum to checksRun exactly, so the line
  // never claims a total it can't account for.
  const moreNote = result.fired>shown ? ` (${shown} shown below${result.flagsTotal>shown?', '+(result.flagsTotal-shown)+' more past the cap':''})` : '';
  const summary = `${result.checksRun} checks run &middot; ${result.notApplicable} not applicable for this reporting format &middot; ${result.fired} observation${result.fired===1?'':'s'}${moreNote} &middot; ${result.clear} no observation`;
  return {tickRow:ticks, summary};
}

  const np = fySeries(primary.profitLoss,'Net Profit');
  const cfo = fySeries(primary.cashFlow,'Cash from Operating Activity');
  if(!np.length || !cfo.length){ if(dom){ disposeChart('stmtProfitCashChart'); dom.innerHTML='<div class="cap" style="padding:20px">Not available for this reporting format.</div>'; } if(capEl) capEl.textContent=''; return; }
  // Same fix as updateBenchChart(): only clear stale placeholder markup
  // when there's no live chart instance yet. Clearing unconditionally on
  // every call (this function reruns on every pin/focus/toggle change)
  // orphaned the SVG root a live instance was still rendering into.
  if(dom && !chartInstances['stmtProfitCashChart']) dom.innerHTML='';
  const pcOption = profitVsCashChartOption(np, cfo);
  initChart('stmtProfitCashChart', pcOption);
  stmtChartYears.profitCash = pcOption.__years||[];
  if(capEl) capEl.textContent = profitVsCashCaption(np, cfo) || '';
}

/* ---- rendering: the four statement tables ----------------------------- */
function statementRowHTML(sectionKey, label, primarySection, compareSection, periods, pinnedSet, focusYear, changeMode, rowIndex){
  const primSeriesAll = fySeriesSafe(primarySection, label);
  const {med, maxAbsDev} = statementsMedianAndSpread(primarySection, label);
  const iqr = iqrBounds(primSeriesAll.map(p=>p.value));
  const polarity = rowPolarity(label);
  const key = rowKey(sectionKey, label);
  const isPinned = pinnedSet.has(key);
  const primRow = primarySection ? findRow(primarySection, label) : null;
  const cells = periods.map((p,i)=>{
    const cell = primRow ? primRow.values[i] : null;
    const val = cell ? cell.value : null;
    // Computed regardless of changeMode and cached on the cell as data-val /
    // data-prev -- the Value/YoY toggle patches these spans' textContent
    // straight from the cached attributes (one rAF, no data walk, no HTML
    // rebuild) instead of re-rendering the table. The bar/outlier markup
    // below depends only on val/med/iqr, none of which change with the
    // toggle, so it never needs to be touched by that patch either.
    const priorIdx = periods.slice(0,i).map((pp,ix)=>({pp,ix})).filter(o=>o.pp.type==='fy').pop();
    const prevVal = priorIdx && primRow && primRow.values[priorIdx.ix] ? primRow.values[priorIdx.ix].value : null;
    let display;
    if(changeMode && p.type==='fy'){
      const chg = pctChange(prevVal, val, 1);
      display = chg==null ? null : (chg>=0?'\u25b2':'\u25bc')+Math.abs(chg*100).toFixed(1)+'%';
    } else {
      display = formatCellRaw(label, val);
    }
    const dev = (val!=null && med!=null) ? val-med : null;
    const barCls = dev!=null ? cellBarColorClass(dev, polarity) : null;
    const isOutlier = iqr && val!=null && (val<iqr.lo || val>iqr.hi);
    const isFocused = focusYear!=null && p.type==='fy' && p.year===focusYear;
    const valAttr = val==null?'':val;
    const prevAttr = (p.type==='fy' && prevVal!=null) ? prevVal : '';
    return `<td class="stmt-bar-cell"${isFocused?' style="background:rgba(37,87,199,.1)"':''} data-metric="${advisorAttr(key)}" data-period="${p.type==='ttm'?'TTM':p.year}" data-val="${valAttr}" data-prev="${prevAttr}">
      <span class="stmt-cell-value${display==null?' stmt-dash':''}">${display==null?'\u2014':display}</span>
      ${barCls?`<div class="stmt-bar-track"><div class="stmt-bar-fill ${barCls}" style="height:${Math.max(4,Math.min(100,Math.abs(dev)/(maxAbsDev||1)*100))}%"></div>${isOutlier?'<div class="stmt-tick-mark"></div>':''}</div>`:''}
    </td>`;
  }).join('');
  const lastVal = primSeriesAll.length ? primSeriesAll[primSeriesAll.length-1].value : null;
  const vsMedian = (med && lastVal!=null) ? (lastVal/med*100).toFixed(0)+'%' : '\u2014';
  const reading = readingSentence(label, primSeriesAll);
  const spark = sparklineSVG(primSeriesAll);
  const defKey = sectionKey+'::'+label;
  const asReportedLabel = primRow ? primRow.label : label;
  let compareRow = '';
  if(compareSection){
    const compRow = findRow(compareSection, label);
    const compCells = periods.map(p=>{
      if(!compRow) return `<td><span class="stmt-dash">\u2014</span></td>`;
      const idx = compareSection.periods.findIndex(cp=>cp.type===p.type && (cp.type==='ttm' || cp.year===p.year));
      const cell = idx>=0 ? compRow.values[idx] : null;
      const val = cell ? cell.value : null;
      return `<td>${val==null?'<span class="stmt-dash">\u2014</span>':formatCellRaw(label,val)}</td>`;
    }).join('');
    compareRow = `<tr class="stmt-compare-subrow"><td>${advisorAttr(L.statements.compare)}</td>${compCells}<td></td><td></td></tr>`;
  }
  return `<tr class="stmt-row${isPinned?' pinned':''}${(rowIndex%2)?' stmt-alt':''}" data-stmt-pin="${advisorAttr(key)}">
    <td>
      <div class="stmt-rowlabel-inner">
        ${spark}
        <span class="stmt-label">${advisorAttr(asReportedLabel)}</span>
        <button class="stmt-def-toggle" data-stmt-def="${advisorAttr(defKey)}" title="What is this?">i</button>
      </div>
    </td>
    ${cells}
    <td class="stmt-vsmedian">${vsMedian}</td>
    <td class="stmt-reading">${advisorAttr(reading)}</td>
  </tr>
  <tr class="stmt-def-row" data-stmt-def-row="${advisorAttr(defKey)}" style="display:none"><td colspan="${periods.length+3}">${advisorAttr(rowDefinitionText(label))}</td></tr>${compareRow}`;
}
// Pure wayfinding, not judgement: one shape per statement so the eye can
// tell four stacked tables apart while scrolling, all in the same single
// accent colour (see .stmt-table-title svg) -- never a rainbow, never a
// colour that could be misread as a verdict on the numbers underneath it.
function stmtSectionIcon(sectionKey){
  const paths = {
    profitLoss: '<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
    balanceSheet: '<path d="M12 3v18M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/><path d="M5 7h14M9 3h6"/>',
    cashFlow: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    ratios: '<circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="M4 20L20 4"/>'
  };
  return `<svg class="stmt-table-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths[sectionKey]||''}</svg>`;
}
function renderOneStatementTable(sectionKey, sectionLabel, schema, primaryBundle, compareBundle, compareSymbol){
  const primSection = primaryBundle ? primaryBundle[sectionKey] : null;
  if(!primSection || !primSection.periods || !primSection.periods.length) return '';
  const rows = statementsCanonicalRows(schema)[sectionKey] || [];
  if(!rows.length) return '';
  const periods = primSection.periods;
  const headlineLabel = rows[0];
  const headlineSeries = fySeries(primSection, headlineLabel);
  const growthByYear = new Map();
  for(let i=1;i<headlineSeries.length;i++){
    growthByYear.set(headlineSeries[i].year, pctChange(headlineSeries[i-1].value, headlineSeries[i].value, 1));
  }
  const pinnedSet = new Set(L.statements.pins.map(p=>rowKey(p.section,p.label)));
  const compareSection = compareBundle ? compareBundle[sectionKey] : null;
  const theadCols = periods.map(p=>{
    const g = p.type==='fy' ? growthByYear.get(p.year) : null;
    const band = g==null ? '' : `<div class="stmt-growth-band ${g>=0?'up':'down'}"><div class="gb-mid"></div><div class="gb-fill" style="height:${Math.min(50,Math.abs(g*100))}%"></div></div>`;
    const label = p.type==='ttm' ? 'TTM' : 'FY'+String(p.year).slice(2);
    return `<th class="${p.type==='ttm'?'stmt-th-ttm':''}" data-stmt-year="${p.type==='ttm'?'':p.year}">${label}${band}</th>`;
  }).join('');
  const bodyRows = rows.map((label,i)=>statementRowHTML(sectionKey,label,primSection,compareSection,periods,pinnedSet,L.statements.focusYear,L.statements.changeMode,i)).join('');
  // Box-score footer: updates with the focused row -- the last row pinned
  // from *this* table, falling back to the table's headline row so a fresh
  // load isn't a blank footer. A full row click already re-renders the
  // tables (it toggles a pin), so this never needs its own hover listener.
  const sectionPins = L.statements.pins.filter(p=>p.section===sectionKey);
  const focusLabel = sectionPins.length ? sectionPins[sectionPins.length-1].label : headlineLabel;
  const focusSeries = focusLabel===headlineLabel ? headlineSeries : fySeries(primSection, focusLabel);
  const box = rowBoxScore(focusSeries);
  const footer = box ? `<tfoot><tr><td colspan="${periods.length+3}">
    <b>${advisorAttr(focusLabel)}</b> FY${box.windowStart}–FY${box.windowEnd} &middot;
    BEST ${advisorAttr(formatCellRaw(focusLabel,box.best.value))} (FY${box.best.year}) &middot;
    WORST ${advisorAttr(formatCellRaw(focusLabel,box.worst.value))} (FY${box.worst.year}) &middot;
    ${box.cagr!=null ? box.years+'Y CAGR '+(box.cagr*100).toFixed(1)+'%' : 'CAGR not shown — the window crosses a loss year'}
  </td></tr></tfoot>` : '';
  // Coverage-mismatch note: two companies with different history lengths or
  // fiscal calendars must never silently compare -- a year present for only
  // one side is disclosed here, not just left to render as a lone "—".
  let coverageNote = '';
  if(compareSection){
    const primYears = new Set(periods.filter(p=>p.type==='fy').map(p=>p.year));
    const compYears = new Set(compareSection.periods.filter(p=>p.type==='fy').map(p=>p.year));
    const onlyPrimary = [...primYears].filter(y=>!compYears.has(y));
    const onlyCompare = [...compYears].filter(y=>!primYears.has(y));
    if(onlyPrimary.length || onlyCompare.length){
      const parts=[];
      if(onlyPrimary.length) parts.push(`${advisorAttr(primaryBundle.symbol)} only: FY${Math.min(...onlyPrimary)}–FY${Math.max(...onlyPrimary)}`);
      if(onlyCompare.length) parts.push(`${advisorAttr(compareSymbol)} only: FY${Math.min(...onlyCompare)}–FY${Math.max(...onlyCompare)}`);
      coverageNote = `<div class="stmt-coverage-note">Years covered don't fully overlap — ${parts.join('; ')}. Those years aren't linked-highlighted across companies.</div>`;
    }
  }
  const collapsed = !!L.statements.collapsedSections[sectionKey];
  return `<div class="stmt-section-block${collapsed?' stmt-collapsed':''}" data-stmt-section="${sectionKey}">
  <div class="stmt-table-title" data-stmt-collapse="${sectionKey}" role="button" tabindex="0" aria-expanded="${collapsed?'false':'true'}" title="Click to collapse or expand this section">
    ${stmtSectionIcon(sectionKey)}
    <span class="stmt-collapse-chevron">${collapsed?'▸':'▾'}</span>
    <span class="stmt-table-title-label">${advisorAttr(sectionLabel)}</span>
    <span class="cap" style="font-family:'Spline Sans Mono',monospace;font-size:10px;font-weight:400">${sectionKey==='ratios'?'':'Rs Cr unless noted'}</span>
  </div>
  ${coverageNote}
  <div class="stmt-table-wrap"><table class="stmt-table">
    <thead><tr><th>Line item</th>${theadCols}<th class="stmt-th-median">vs 12y median</th><th></th></tr></thead>
    <tbody>${bodyRows}</tbody>
    ${footer}
  </table></div>
  </div>`;
}
function renderStatementTables(){
  const container=document.getElementById('stmtTables');
  if(!container) return;
  const s=L.statements;
  const primary = statementsBundle(s.primary);
  if(!primary){ container.innerHTML=''; return; }
  const schema = primary.schema || 'unknown';
  const compare = statementsEffectiveCompare();
  container.innerHTML = STMT_SECTIONS.map(sec=>renderOneStatementTable(sec.key, sec.label, schema, primary, compare, s.compare)).join('');
}

/* ---- CSS-only linked highlighting -------------------------------------
   Every cell carries data-metric/data-period; one rAF-batched write of
   two attributes on #stmtRoot does the rest -- see the note near the top
   of the <style> block. */
function buildStatementsHighlightCSS(){
  const styleEl=document.getElementById('stmtHlStyle');
  if(!styleEl) return;
  const esc=(s)=>String(s).replace(/["\\]/g,'\\$&');
  const keys=new Set();
  ['nonfinancial','financial'].forEach(schema=>{
    Object.keys(CANONICAL_ROWS[schema]).forEach(sectionKey=>{
      CANONICAL_ROWS[schema][sectionKey].forEach(label=>keys.add(rowKey(sectionKey,label)));
    });
  });
  const years=new Set(['TTM']);
  [L.statements.primary, L.statements.compare].filter(Boolean).forEach(sym=>{
    const b=statementsBundle(sym);
    if(b) STMT_SECTIONS.forEach(sec=>{ const sect=b[sec.key]; if(sect) sect.periods.forEach(p=>{ if(p.type==='fy') years.add(String(p.year)); }); });
  });
  let css='';
  keys.forEach(k=>{ const e=esc(k); css+=`#stmtRoot[data-hl-metric="${e}"] [data-metric="${e}"]{background:rgba(37,87,199,.14)!important}`; });
  years.forEach(y=>{ const e=esc(y); css+=`#stmtRoot[data-hl-period="${e}"] [data-period="${e}"]{background:rgba(37,87,199,.14)!important}`; });
  styleEl.textContent=css;
}

/* ---- the one orchestrator: called after any pin/focus/company/toggle

// Value/YoY is one of the interactions the stable-shell architecture lists
// as must-never-trigger-a-full-re-render (goalden-lab.html's statements tab
// otherwise never writes innerHTML outside mount/company-change/tab-return).
// Every cell already carries its raw value and prior-year value as data
// attributes (see statementRowHTML) precisely so this can patch textContent
// in one rAF instead of calling renderStatementTables().
function statementsApplyChangeMode(){
  const changeMode = L.statements.changeMode;
  const cells = document.querySelectorAll('#stmtRoot td.stmt-bar-cell[data-metric]');
  requestAnimationFrame(()=>{
    cells.forEach(td=>{
      if(td.dataset.period==='TTM') return; // TTM never changes with mode
      const valueEl = td.querySelector('.stmt-cell-value');
      if(!valueEl) return;
      const label = parseRowKey(td.dataset.metric).label;
      const val = td.dataset.val===''?null:Number(td.dataset.val);
      let text;
      if(changeMode){
        const prev = td.dataset.prev===''?null:Number(td.dataset.prev);
        const chg = pctChange(prev, val, 1);
        text = chg==null ? null : (chg>=0?'▲':'▼')+Math.abs(chg*100).toFixed(1)+'%';
      } else {
        text = formatCellRaw(label, val);
      }
      valueEl.classList.toggle('stmt-dash', text==null);
      valueEl.textContent = text==null ? '—' : text;
    });
  });
}

// Chart cross-highlight (plan: chart.dispatchAction({type:'highlight'}),
// setOption never called on hover). Keyed by a plain fiscal-year array per
// chart id, captured when each chart's option is last built, so a hovered
// data-period ("2023") can be turned into the dataIndex that chart's own
// category axis uses without recomputing or guessing it here.
const stmtChartYears = { bench: [], profitCash: [] };
function statementsClearChartHighlight(){
  ['stmtBenchChart','stmtProfitCashChart'].forEach(id=>{
    const entry = chartInstances[id];
    if(entry) entry.inst.dispatchAction({ type:'downplay' });
  });
}
function statementsCrossHighlight(metric, period){
  statementsClearChartHighlight();
  if(!metric || !period || period==='TTM') return;
  const year = Number(period);
  if(!Number.isFinite(year)) return;
  // data-metric carries "section|label" (e.g. "profitLoss|Net Profit") so
  // the same row label in two different sections never collides; chart
  // series are keyed on the bare row label, so only the label half matches.
  metric = metric.indexOf('|')>=0 ? metric.slice(metric.indexOf('|')+1) : metric;
  [['stmtBenchChart','bench'], ['stmtProfitCashChart','profitCash']].forEach(([id, key])=>{
    const entry = chartInstances[id];
    if(!entry) return;
    const dataIndex = (stmtChartYears[key]||[]).indexOf(year);
    if(dataIndex<0) return;
    const series = (entry.inst.getOption().series)||[];
    series.forEach((s, seriesIndex)=>{
      const name = s.name||'';
      // profitVsCashChartOption's CFO series is titled "Cash from
      // Operations" for chart legibility, not the row's exact canonical
      // key ("Cash from Operating Activity") -- matched explicitly rather
      // than relaxing the row-label match everywhere else.
      const matches = name===metric || name.endsWith(' — '+metric)
        || (key==='profitCash' && metric==='Cash from Operating Activity' && name==='Cash from Operations');
      if(matches) entry.inst.dispatchAction({ type:'highlight', seriesIndex, dataIndex });
    });
  });
}

// Cursor-follow tilt on the Lab home screen's 3 primary tool cards,
// mirroring index.html's own .door treatment (see that file's script) so
// the two "choosing" screens in the app feel like the same surface, while
// every actual calculator tab stays still. Delegated on #main rather than

// rebuilds it via innerHTML on every render() -- a per-element listener
// here would leak exactly like the duplicate-listener hazard documented
// on attach()'s own [data-tab-switch] query.
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  const mainEl = document.getElementById('main');
  let tiltedCard = null;
  const resetTiltedCard = ()=>{
    if(!tiltedCard) return;
    tiltedCard.style.transform = '';
    tiltedCard.classList.remove('tilting');
    const icon = tiltedCard.querySelector('.tc-icon');
    if(icon) icon.style.transform = '';
    tiltedCard = null;
  };
  mainEl.addEventListener('mousemove', e=>{
    const card = e.target.closest('.lab-tool-card');
    if(card !== tiltedCard) resetTiltedCard();
    if(!card) return;
    tiltedCard = card;
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    const rx = (0.5 - py) * 12, ry = (px - 0.5) * 12;
    card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-2px)`;
    card.style.setProperty('--mx', (px * 100) + '%');
    card.style.setProperty('--my', (py * 100) + '%');
    card.classList.add('tilting');
    const icon = card.querySelector('.tc-icon');
    if(icon) icon.style.transform = `translate(${(px - 0.5) * 8}px, ${(py - 0.5) * 8}px) scale(1.05)`;
  });
  mainEl.addEventListener('mouseleave', resetTiltedCard);
}

const ADVISOR_KNOWLEDGE = `Goalden is one personal-finance planning app with three levels — they all share the same math, so moving to a deeper level never wastes anything the user already entered. It supports India (₹) and the United States ($).
- Level 1 — Quick Calculate: a fast single-goal answer in about two minutes, for first-timers.
- Level 2 — The Full Plan: a risk-profiling questionnaire that builds a multi-goal plan with recommended fund categories.
- Level 3 — The Lab (this page): full assumption control, Monte Carlo, efficient frontier, and live real-market-data testing.
The user is currently on Level 3.

This is "Goalden — The Lab" (Level 3): full assumption control and live market-data testing. Ten tools sharing one underlying engine.

Tools:
- Retirement Lab: age, retire age, monthly expenses, lifestyle %, inflation, growth before/after retirement, life expectancy; stress-tests with a real historical market crash, plus a drawdown Monte Carlo to show sequence-of-returns risk.
- Build a Portfolio: mixes fund categories with preset or custom weights and shows the efficient frontier (return vs risk trade-off).
- Test Real Investments (Live Frontier): picks real stocks/ETFs/funds and shows how mixing them actually performed — real risk, real return, real history.
- Step-Up SIP: a SIP that grows with income each year.
- Sustainable Withdrawal (SWP): whether a corpus can fund a fixed inflation-adjusted withdrawal for a set span.
- Cross-Border (FX): effect of currency movement on India-US investing.
- Joint Children Corpus: overlapping education costs for multiple children from one pool.
- Monte Carlo: thousands of random market paths to show plan likelihood, not just the average.
- Instrument Explorer: return/risk assumptions for all fund categories.
- Plan Health: a quick 0-100 score on savings, emergency fund and protection.
- Read the Company: reads one real Indian company's Profit & Loss, Balance Sheet and Cash Flow (scraped from screener.in), lets a second company be pinned alongside for comparison, and surfaces five specific divergence checks (e.g. a dividend larger than operating cash flow, profit growth that never became cash, debtor days stretching out) with a check-summary line showing how many checks ran and how many found nothing, not just the ones that fired. A lender (bank/NBFC) gets a different row set than a manufacturer, and the two are never silently compared.

Data sources:
- Live Frontier fetches real market data through the app's proxy: Yahoo Finance chart endpoint for equities/ETFs (Indian tickers need .NS/.BO), and MFAPI.in for Indian mutual-fund NAVs. It uses Yahoo's dividend/split-adjusted close (adjclose) so returns include reinvested dividends — a high-dividend stock can have a very different real return from its raw price.
- The Retirement stress test and "The Case" use real historical annual returns: Sensex (India FY1980-2023) and S&P 500 (US 1928-2024).

Assumptions (per country): India (₹): inflation 6%, debt 7%, hybrid 10%, equity 12%, FD 6.5%. US ($): inflation 2.5%, debt 4.5%, hybrid 7%, equity 9%, FD 4%. Each tool's sliders override these defaults.

Key concepts the user may ask about: efficient frontier, Monte Carlo, sequence-of-returns risk, volatility, risk/return trade-off, glide path, annuity-due withdrawals.

Portfolio math (Build a Portfolio / Test Real Investments):
- Efficient frontier: the curve of mixes that give the most expected return for a given risk (or least risk for a given return). This app generates it by sampling thousands of random weight combinations, computing each one's return and volatility from the asset returns and the correlation matrix, and keeping only the non-dominated (best) points. A mix below the frontier is taking risk without being paid for it.
- Correlation matrix: how each pair of assets moves together, on a scale of -1 to +1. Here it is built from cluster-level correlations (assets in the same style cluster move closely, equity is still correlated with equity, debt is largely independent of equity, gold is a near-zero hedge). Positive correlation reduces diversification; near-zero/negative correlation is what lowers portfolio risk.
- Tangency portfolio / Best Balance: the single mix on the frontier with the highest Sharpe ratio (return above the risk-free rate per unit of risk). The Capital Allocation Line (CAL) is a straight line from the risk-free rate through this point; blending risk-free cash with the tangency mix gives the best risk/return trade-off available.
- Risk-free rate: the safe baseline the Sharpe ratio and CAL use. It defaults to the country's FD rate (India ~6.5%, US ~4%) and can be overridden in Test Real Investments.
- Tangency vs minimum-variance: the tangency point maximises return-for-risk; the minimum-variance point is the lowest-risk mix on the whole frontier. They usually differ — the safest mix is not the best-compensated one.
- Diversification benefit: the ratio of the weighted-average volatility of the holdings to the portfolio's actual volatility. Above 1 means the mix is less risky than its parts standing alone — the whole point of diversification.

Behavior: prefer driving the real interface — navigate to the right tool, set the values, scroll the result into view, then explain what the user is looking at in plain language. Use the workspace canvas only to compare two scenarios side by side, or to show something not on the current page. Never describe a number without putting it on screen.

Explaining charts: when a user asks to explain a chart or "what's on my screen", call read_current_chart() first and explain THEIR actual numbers and points — reference the specific points by name (their mix, the best-Sharpe point, the risk-free rate, each asset's own dot), then call highlight to point at the chart feature as you describe it. A textbook definition of the efficient frontier is a failure state — ground every sentence in the numbers read_current_chart returned.`;

// F0 — compact state for the model. The raw L object carries L.live.data's
// full daily price arrays (two instruments × ~1,238 days ≈ >100KB) which blows
// the Worker's 100KB body cap, killing the advisor on Test Real Investments.
// The model can't use raw closes anyway — it wants the derived facts. This
// projects L down to what's useful and small; the get_price_history /
// get_instrument_stats / get_detail pull-tools reach anything else on demand.
function stateForAdvisor() {
  const snapshot = Object.assign({}, L);
  const live = { items: L.live.items, weight: L.live.weight, selectedWeights: L.live.selectedWeights, rf: L.live.rf, searchMode: L.live.searchMode, data: {} };
  Object.keys(L.live.data || {}).forEach((key) => {
    const d = L.live.data[key];
    if (!d) return;
    const s = d.stats || {};

  return out;
}

function maxDrawdownFromPrices(prices) {
  if (!prices || prices.length < 2) return null;
  let peak = prices[0].close, maxDD = 0;
  for (let i = 1; i < prices.length; i++) {
    const cl = prices[i].close;
    if (cl > peak) peak = cl;
    const dd = (peak - cl) / peak;
    if (dd > maxDD) maxDD = dd;
  }
  return maxDD;
}
function advisorExplainMetric(metric) {

    return { ok:true, metric:'Sharpe ratio', value:+s.toFixed(2), explanation:'Sharpe is return above the risk-free rate, per unit of risk. Your mix is '+s.toFixed(2)+' — '+(s>=1?'healthy (above 1.0).':s>=0?'weak (below 1.0) — more risk than the return justifies.':'negative — it is earning less than the risk-free rate.') };
  }

    return { ok:true, metric:'Volatility', value:+(v*100).toFixed(1)+'%', explanation:'Volatility is how much your mix swings year to year. Yours is '+(v*100).toFixed(1)+'%, which is '+(v>0.18?'high':v>0.10?'moderate':'low')+' for a long-run portfolio.' };
  }
  if (m === 'beta') {
    const b = p.d.decomp.beta;
    return { ok:true, metric:'Beta', value:+b.toFixed(2), explanation:'Beta measures how much your mix moves with the broad market. Yours is '+b.toFixed(2)+', so it is '+(b>1.1?'more volatile than':b<0.9?'less volatile than':'about as volatile as')+' the market.' };

    const stats = items.map(function (it) { return L.live.data[it.key].stats; });
    const cov = computeCovarianceMatrix(stats);
    const c12 = cov.corr[0][1];
    const phrase = c12 > 0.5 ? 'move together strongly' : c12 > 0.2 ? 'move together moderately' : c12 > -0.2 ? 'are largely independent' : 'tend to move opposite each other';
    return { ok:true, metric:'Correlation ('+items[0].symbol+' vs '+items[1].symbol+')', value:+c12.toFixed(2), explanation:'A correlation of '+c12.toFixed(2)+' means these two '+phrase+'. Lower correlation is exactly what makes a two-asset mix less risky than either asset alone.' };

    return { ok:true, metric:'CAGR of '+items[0].symbol, value:+(cagr*100).toFixed(1)+'%', explanation:'Compounded (CAGR) is what you would actually have earned holding '+items[0].symbol+' the whole window: '+(cagr*100).toFixed(1)+'%/yr. It is lower than the arithmetic return because a down year hurts more than an up year helps.' };

    return { ok:true, metric:'Max drawdown of '+items[0].symbol, value:'-'+(dd*100).toFixed(1)+'%', explanation:'Max drawdown is the worst peak-to-trough fall on record for '+items[0].symbol+': -'+(dd*100).toFixed(1)+'%. That is the size of fall you would have had to sit through without selling.' };

function advisorOptimizeFor(objective) {
  if (!L.country) return { ok:false, error:'Pick a country first.' };
  const m = String(objective || '').toLowerCase().replace(/[^a-z]/g, '');
  const p = advisorPortfolioData();
  const fd = computePortfolioFrontierData(p.d, p.assets, p.corr);
  const before = { ret: p.d.portRet, vol: p.d.decomp.totalVol };
  let targetW = null, label = '';
  if (m === 'maxsharpe') {
    const best = bestSharpePoint(fd.frontier, cfg().d.fdRate);
    targetW = best ? best.w : null; label = 'best Sharpe';
  } else if (m === 'minvolatility') {
    const mv = fd.frontier.reduce(function (a, x) { return x.vol < a.vol ? x : a; }, fd.frontier[0]);
    targetW = mv ? mv.w : null; label = 'minimum volatility';
  } else if (m === 'targetreturn') {
    let best = null, bd = Infinity;
    fd.frontier.forEach(function (x) { const d = Math.abs(x.ret - p.d.portRet); if (d < bd) { bd = d; best = x; } });
    targetW = best ? best.w : null; label = 'same return, least risk';
  } else if (m === 'targetrisk') {
    let best = null, bd = Infinity;
    fd.frontier.forEach(function (x) { const d = Math.abs(x.vol - p.d.decomp.totalVol); if (d < bd) { bd = d; best = x; } });
    targetW = best ? best.w : null; label = 'same risk, most return';
  } else {
    return { ok:false, error:'Unknown objective "'+objective+'". Try max_sharpe, min_volatility, target_return, or target_risk.' };
  }
  if (!targetW) return { ok:false, error:'Could not find an optimized mix for "'+objective+'".' };
  const applied = advisorSetWeights(roundPercentsTo100(targetW));
  if (!applied.ok) return applied;
  const after = advisorPortfolioData();
  return { ok:true, objective:label, before:{ returnPct:+(before.ret*100).toFixed(2), riskPct:+(before.vol*100).toFixed(2) }, after:{ returnPct:+(after.d.portRet*100).toFixed(2), riskPct:+(after.d.decomp.totalVol*100).toFixed(2) }, weights: applied.weights };
}

    { type:'function', function:{ name:'scroll_to', description:'Scroll the real chart/result into view (no pulse). Valid targets: '+Object.keys(ADVISOR_HIGHLIGHT_TARGETS).join(', ')+'.', parameters:{ type:'object', properties:{ element:{ type:'string', enum:Object.keys(ADVISOR_HIGHLIGHT_TARGETS) } }, required:['element'] } } },
    { type:'function', function:{ name:'compose_briefing', description:'Compose and open a full-page Briefing. Pass a title, an intro paragraph, and an array of section names chosen from: '+Object.keys(BRIEFING_SECTIONS).join(', ')+'.', parameters:{ type:'object', properties:{ title:{ type:'string' }, intro:{ type:'string' }, sections:{ type:'array', items:{ type:'string', enum:Object.keys(BRIEFING_SECTIONS) } } }, required:['sections'] } } },
    { type:'function', function:{ name:'run_full_analysis', description:'Run one Lab tool end-to-end in ONE call: switch to the tab, apply every input, and run its calculation — much faster than many set_value calls. tab: retirement, stepup, swp, fx, joint, mc or health. params keys are bare field names for that tab (e.g. retirement: age, retireAge, monthlyExpense, preRate, postRate, inflation, lifeExp; mc: sip, years, meanReturn, volatility; health: capacity, totalSIP).', parameters:{ type:'object', properties:{ tab:{ type:'string', enum:['retirement','stepup','swp','fx','joint','mc','health'] }, params:{ type:'object' } }, required:['tab','params'] } } },
    { type:'function', function:{ name:'read_other_page', description:'Read-only snapshot of another page\'s saved data (from that page\'s own localStorage). page: door1 (Quick Calculate) or door2 (The Full Plan). Returns {page, asOf, state} — context to quote from, NEVER to be merged into this page\'s inputs.', parameters:{ type:'object', properties:{ page:{ type:'string', enum:Object.keys(OTHER_PAGE_KEYS) } }, required:['page'] } } },
  ];
}

function advisorFieldSelector(spec) {
  const key = spec.path[spec.path.length - 1];
  const tab = spec.path[0];
  const tabAttr = { ret: '', step: 'step', swp: 'swp', fx: 'fx', joint: 'joint', mc: 'mc', health: 'health' }[tab] || '';
  return tabAttr ? 'input[data-k="' + key + '"][data-tab="' + tabAttr + '"]' : 'input[data-k="' + key + '"]';
}

function advisorSetValue(field, value) {
  const spec = ADVISOR_FIELDS[field];
  if (!spec) return { ok:false, error:'Unknown field "'+field+'". Valid: '+Object.keys(ADVISOR_FIELDS).join(', ') };
  if (value === undefined || value === null || value === '') return { ok:false, error:'Missing value for '+field };
  // Only numeric specs are coerced — country is type 'string' with an enum,
  // and parseFloat('IN') is NaN, so the advisor could never switch the Lab's
  // country until this guard existed.
  if (spec.type === 'integer' || spec.type === 'number') {
    value = spec.type === 'integer' ? parseInt(value, 10) : parseFloat(value);
    if (!isFinite(value)) return { ok:false, error:'Value for '+field+' must be a number.' };
  }
  if (spec.enum && !spec.enum.includes(value)) return { ok:false, error:'Invalid value for '+field+'. Allowed: '+spec.enum.join(', ') };
  if (spec.min !== undefined && value < spec.min) return { ok:false, error:'Value for '+field+' is too low — it must be at least '+spec.min+'.' };
  if (spec.max !== undefined && value > spec.max) return { ok:false, error:'Value for '+field+' is too high — it must be at most '+spec.max+'.' };
  let obj = L;
  for (let i = 0; i < spec.path.length - 1; i++) obj = obj[spec.path[i]];
  obj[spec.path[spec.path.length - 1]] = value;
  if (TAB_FOR[spec.path[0]]) L.tab = TAB_FOR[spec.path[0]];
  render();
  return { ok:true, field, value, tab:L.tab, touched: advisorFieldSelector(spec) };
}

// Country-scoped asset list + correlation matrix, one choke point reused by
// every portfolio/live tool so they can never disagree on which universe the
// current country uses.
function advisorCountryAssets() {
  const c = cfg();
  return c.code === 'IN'
    ? { assets: PORTFOLIO_ASSETS_IN, corr: PORTFOLIO_CORR_IN }
    : { assets: PORTFOLIO_ASSETS_US, corr: PORTFOLIO_CORR_US };
}

// Full portfolio analytics for the CURRENT mix, all computed by the exact
// functions the on-screen render uses (never reimplemented here): return,
// risk, Sharpe/Sortino/diversification, tail risk, the frontier, and how far
// below the frontier the current mix sits.
function advisorPortfolioData() {
  const { assets, corr } = advisorCountryAssets();
  const c = cfg();
  const d = computePortfolioDerived(assets, corr);
  const ratios = portfolioRatios(d, c);
  const tail = portfolioTailRisk(d);
  const { frontier } = generateFrontier(d.returns, d.vols, corr, 3000, L.portfolio.seed);
  const currentPoint = { ret: d.portRet, vol: d.decomp.totalVol };
  const gap = frontierGap(frontier, currentPoint);
  return { assets, corr, d, ratios, tail, frontier, currentPoint, gap };
}

// ---- B1: portfolio construction ----
function advisorSetWeights(weights) {
  if (!L.country) return { ok:false, error:'Need a country first.' };
  const { assets } = advisorCountryAssets();
  if (!Array.isArray(weights)) return { ok:false, error:'weights must be an array of percentages summing to 100.' };
  if (weights.length !== assets.length) return { ok:false, error:'weights must have '+assets.length+' entries for '+cfg().name+' (got '+weights.length+').' };
  const nums = weights.map(Number);
  if (nums.some(n => !isFinite(n) || n < 0)) return { ok:false, error:'weights must be non-negative numbers.' };
  const sum = nums.reduce((a, b) => a + b, 0);
  if (Math.abs(sum - 100) > 1.5) return { ok:false, error:'weights must sum to 100 (got '+sum+').' };
  L.portfolio.weights = roundPercentsTo100(nums.map(n => n / 100));
  L.tab = 'portfolio';
  render();
  return { ok:true, weights: L.portfolio.weights, assets: assets.map(a => a.id) };
}

function advisorApplyPreset(name) {
  if (!L.country) return { ok:false, error:'Need a country first.' };
  const { assets } = advisorCountryAssets();
  const valid = ['equal'].concat(Object.keys(PORTFOLIO_PRESETS));
  if (!valid.includes(name)) return { ok:false, error:'Unknown preset "'+name+'". Valid: '+valid.join(', ') };
  L.portfolio.weights = portfolioPresetWeights(name, assets);
  L.tab = 'portfolio';
  render();
  return { ok:true, preset: name, weights: L.portfolio.weights };
}

function advisorAnalyzePortfolio() {
  if (!L.country) return { ok:false, error:'Need a country first.' };
  const p = advisorPortfolioData();
  return { ok:true, result: {
    expectedReturnPct: +(p.d.portRet*100).toFixed(2),
    volatilityPct: +(p.d.decomp.totalVol*100).toFixed(2),
    sharpe: +(p.ratios.sharpe).toFixed(2),
    sortino: p.ratios.sortino == null ? null : +(p.ratios.sortino).toFixed(2),
    beta: +(p.d.decomp.beta).toFixed(2),
    diversificationBenefit: +(p.ratios.divRatio).toFixed(2),
    effectiveHoldings: +(p.ratios.effN).toFixed(2),
    var95Pct: +(p.tail.var95*100).toFixed(2),
    cvar95Pct: +(p.tail.cvar95*100).toFixed(2),
    systematicRiskPct: +(p.d.decomp.systematicPct*100).toFixed(1),
    unsystematicRiskPct: +(p.d.decomp.unsystematicPct*100).toFixed(1),
  } };
}

function advisorFrontierGap() {
  if (!L.country) return { ok:false, error:'Need a country first.' };
  const p = advisorPortfolioData();
  if (!p.gap) return { ok:true, result: { gapPct: 0, onFrontier: true } };
  let best = null, bestDist = Infinity;
  p.frontier.forEach(fp => { const dist = Math.abs(fp.vol - p.currentPoint.vol); if (dist < bestDist) { bestDist = dist; best = fp; } });
  return { ok:true, result: {
    gapPct: +(p.gap.gapPct*100).toFixed(2),
    currentReturnPct: +(p.currentPoint.ret*100).toFixed(2),
    frontierReturnAtSameRiskPct: +(p.gap.frontierRetHere*100).toFixed(2),
    frontierPointWeights: best ? best.w.map(w => Math.round(w*100)) : null,
  } };
}

function advisorListAssets() {
  if (!L.country) return { ok:false, error:'Need a country first.' };
  const { assets } = advisorCountryAssets();
  return { ok:true, result: { assets: assets.map(a => ({ id:a.id, name:a.name, cluster:a.cluster, returnPct:+(a.ret*100).toFixed(2), volatilityPct:+(a.vol*100).toFixed(2), beta:+a.beta.toFixed(2) })) } };
}

// ---- B2: live market data ----
async function advisorSearchInstruments(query) {
  const c = cfg();
  const q = String(query || '').trim();
  const equities = searchInstrumentIndex(q, c.code, 'all').slice(0, 10)
    .map(i => ({ symbol:i.symbol, name:i.name, klass:i.klass, type:'equity' }));
  let funds = [];
  if (c.code === 'IN' && q) {
    try {
      const list = await liveApiGet('/api/fundsearch?q=' + encodeURIComponent(q));
      funds = (Array.isArray(list) ? list : []).slice(0, 10)
        .map(r => ({ symbol:String(r.schemeCode), name:r.schemeName, type:'fund' }));
    } catch (e) { funds = []; }
  }
  // B2b — the curated list above only covers ~20 well-known large-caps per
  // country; anything less common (e.g. "Axis Solutions Limited", a real
  // BSE listing) has no way to be found by name otherwise. Fall back to a
  // real search across Yahoo's own symbol database for names the curated
  // list misses, deduped against what's already there.
  let broader = [];
  if (q) {
    try {
      const known = new Set(equities.map(i => i.symbol.toUpperCase()));
      const list = await liveApiGet('/api/symbolsearch?q=' + encodeURIComponent(q));
      broader = (Array.isArray(list) ? list : [])
        .filter(r => r.symbol && !known.has(String(r.symbol).toUpperCase()))
        .slice(0, 8)
        .map(r => ({ symbol:r.symbol, name:r.name, exchange:r.exchange, type:r.type || 'equity' }));
    } catch (e) { broader = []; }
  }
  return JSON.stringify({ ok:true, equities: equities.concat(broader), funds });
}

async function advisorAddInstrument(symbol) {
  const sym = String(symbol || '').trim().toUpperCase();
  if (!sym) return JSON.stringify({ ok:false, error:'Missing symbol.' });
  const c = cfg();
  const idx = c.code === 'IN' ? INSTRUMENT_INDEX_IN : INSTRUMENT_INDEX_US;
  const match = idx.find(i => i.symbol.toUpperCase() === sym || (i.name || '').toUpperCase().includes(sym));
  let item;
  if (match) item = { key: match.symbol, symbol: match.symbol, label: match.name, type: 'equity' };
  else if (c.code === 'IN' && /^\d{5,}$/.test(sym)) item = { key: 'MF' + sym, symbol: sym, label: 'Fund ' + sym, type: 'fund' };
  else item = { key: sym, symbol: sym, label: sym, type: 'equity' };
  if (L.live.items.some(it => it.key === item.key)) return JSON.stringify({ ok:false, error: sym + ' is already in the basket.' });
  try {
    const raw = await liveFetchHistory(item);
    L.live.items.push(item);
    L.live.data[item.key] = { status:'ready', label: raw.label || item.label, currency: raw.currency, prices: raw.prices, stats: computeReturnStats(raw.prices, item.type === 'fund') };
    render();
    return JSON.stringify({ ok:true, added: { symbol: item.symbol, label: L.live.data[item.key].label } });
  } catch (e) {
    return JSON.stringify({ ok:false, error:'Could not fetch ' + sym + ': ' + ((e && e.message) || e) });
  }
}

async function advisorGetFinancialStatements(symbol) {
  const sym = String(symbol || '').trim().toUpperCase().replace(/\.(NS|BO)$/, '');
  if (!sym) return JSON.stringify({ ok:false, error:'Missing symbol.' });
  try {
    const data = await liveApiGet('/api/financials?symbol=' + encodeURIComponent(sym));
    return JSON.stringify({ ok:true, statements: data });
  } catch (e) {
    return JSON.stringify({ ok:false, error:'Could not fetch financial statements for ' + sym + ': ' + ((e && e.message) || e) });
  }
}

function advisorRemoveInstrument(symbol) {
  const sym = String(symbol || '').trim().toUpperCase();
  const before = L.live.items.length;
  L.live.items = L.live.items.filter(it => it.symbol.toUpperCase() !== sym && it.key.toUpperCase() !== sym);
  if (L.live.items.length === before) return { ok:false, error: sym + ' is not in the basket.' };
  Object.keys(L.live.data).forEach(k => { if (!L.live.items.some(it => it.key === k)) delete L.live.data[k]; });
  render();
  return { ok:true, removed: sym };
}

function advisorCompareLive() {
  const items = liveReadyItems();
  if (items.length < 2) return { ok:false, error:'Need at least two loaded instruments — add them via add_instrument first.' };
  const rf = liveDefaultRf() / 100;
  const stats = items.map(it => L.live.data[it.key].stats);
  const holdings = items.map((it, i) => ({
    symbol: it.symbol,
    label: L.live.data[it.key].label || it.symbol,
    annualReturnPct: +(stats[i].annualReturn*100).toFixed(2),
    annualVolPct: +(stats[i].annualVol*100).toFixed(2),
    compoundedPct: stats[i].geoAnnual == null ? null : +(stats[i].geoAnnual*100).toFixed(2),
  }));
  const { corr } = computeCovarianceMatrix(stats);
  const correlations = [];
  for (let i = 0; i < items.length; i++) for (let j = i+1; j < items.length; j++) {
    correlations.push({ a: items[i].symbol, b: items[j].symbol, correlation: +corr[i][j].toFixed(2) });
  }
  let tangency, minVar;
  if (items.length === 2) {
    const c12 = corr[0][1];
    const wTan = tangencyWeightTwoAsset(stats[0].annualReturn, stats[1].annualReturn, stats[0].annualVol, stats[1].annualVol, c12, rf);
    tangency = { weights: [+wTan.toFixed(3), +(1-wTan).toFixed(3)], returnPct: +(portfolioReturn([wTan,1-wTan],[stats[0].annualReturn,stats[1].annualReturn])*100).toFixed(2), volPct: +(Math.sqrt(portfolioVariance([wTan,1-wTan],[stats[0].annualVol,stats[1].annualVol],[[1,c12],[c12,1]]))*100).toFixed(2) };
    const wMinVar = minVarianceWeightTwoAsset(stats[0].annualVol, stats[1].annualVol, c12);
    minVar = { weights: [+wMinVar.toFixed(3), +(1-wMinVar).toFixed(3)] };
  } else {
    const lm = liveComputeMulti();
    const bp = bestSharpePoint(lm.frontier, rf);
    if (bp) tangency = { weights: bp.w.map(w => +w.toFixed(3)), returnPct: +(bp.ret*100).toFixed(2), volPct: +(bp.vol*100).toFixed(2), sharpe: +bp.sharpe.toFixed(2) };
    const mv = lm.frontier.reduce((best, p) => p.vol < best.vol ? p : best, lm.frontier[0]);
    minVar = { weights: mv.w.map(w => +w.toFixed(3)), returnPct: +(mv.ret*100).toFixed(2), volPct: +(mv.vol*100).toFixed(2) };
  }
  let wVec;
  if (items.length === 2) wVec = [L.live.weight/100, 1 - L.live.weight/100];
  else if (L.live.selectedWeights && L.live.selectedWeights.length === items.length) wVec = L.live.selectedWeights;
  else wVec = items.map(() => 1/items.length);
  const curRet = portfolioReturn(wVec, stats.map(s => s.annualReturn));
  const curVol = Math.sqrt(portfolioVariance(wVec, stats.map(s => s.annualVol), corr));
  const curSharpe = curVol > 0 ? (curRet - rf)/curVol : 0;
  return { ok:true, result: {
    holdings, correlations, tangency, minVariance: minVar,
    currentMix: { weights: wVec.map(w => +w.toFixed(3)), returnPct: +(curRet*100).toFixed(2), volPct: +(curVol*100).toFixed(2), sharpe: +curSharpe.toFixed(2) },
    riskFreeRatePct: +(rf*100).toFixed(2),
  } };
}

// ---- B3: Monte Carlo + stress testing ----
function advisorRunMonteCarlo(overrides) {
  const m = L.mc;
  const regimeKey = (overrides && overrides.regime) || m.regime;
  const regime = REGIME_PRESETS[regimeKey] || REGIME_PRESETS.normal;
  const sip = (overrides && overrides.sip != null) ? overrides.sip : m.sip;
  const years = (overrides && overrides.years != null) ? overrides.years : m.years;
  const meanReturn = (overrides && overrides.meanReturn != null) ? overrides.meanReturn/100 : m.meanReturn/100;
  const volatility = (overrides && overrides.volatility != null) ? overrides.volatility/100 : m.volatility/100;
  const seed = (overrides && overrides.seed != null) ? overrides.seed : m.seed;
  const res = monteCarloAccumulation({ sip, meanReturn: meanReturn*regime.meanAdj, volatility: volatility*regime.volAdj, years, due: true, seed, n: 1000 });
  return { ok:true, result: { contribution: sip, years, regime: regime.label, p10: Math.round(res.p10), p50: Math.round(res.p50), p90: Math.round(res.p90), mean: Math.round(res.mean) } };
}

function advisorStressTest(scenario) {
  if (!L.country) return { ok:false, error:'Need a country first.' };
  const c = cfg();
  const s = String(scenario || '').toLowerCase();
  const ep = c.episodes.find(e => e.id === s || (e.label || '').toLowerCase().includes(s));
  if (!ep) return { ok:false, error:'Unknown scenario "'+scenario+'". Valid: '+c.episodes.map(e=>e.id).join(', ') };
  const saved = L.ret.shock;
  L.ret.shock = { epId: ep.id, year: 1 };
  const res = calcRetLab();
  L.ret.shock = saved;
  return { ok:true, result: {
    scenario: ep.label,
    shockReturnPct: +(ep.rate*100).toFixed(1),
    corpus: Math.round(res.corpus),
    monthlySIP: Math.round(res.sip),
    ranOutYear: res.shockInfo ? res.shockInfo.ranOutYear : null,
    finalBalance: res.shockInfo ? Math.round(res.shockInfo.finalBalance) : 0,
    survives: !!(res.shockInfo && !res.shockInfo.ranOutYear),
  } };
}

// F7a — structured description of the chart visibly on screen right now, built
// from values the page already computed (never fabricated, never read out of
// pixels). The model uses this to explain the user's ACTUAL chart, not a
// textbook definition of it.
function advisorReadCurrentChart() {
  if (!L.country) return { ok:false, error:'Ask the user to pick a country first.' };
  const c = cfg();
  const tab = L.tab;
  if (tab === 'retirement') {
    const res = calcRetLab();
    return { ok:true, tool:'Retirement Lab', charts:[
      { kind:'accumulation', title:'How the pot grows', xAxis:'years saving (0 → '+res.yrs+')', yAxis:'balance (ends at '+c.compact(res.corpus)+')', note:'gold area = growth earned; pale area = what was paid in', points:[{ label:'monthly SIP', value:c.fmt(Math.round(res.sip)) }, { label:'ending corpus', value:c.compact(res.corpus) }, { label:'today\'s money', value:c.compact(res.realCorpus) }] },
      { kind:'drawdown', title:'How the pot gets spent', xAxis:'years after retirement (0 → '+res.drawYrs+')', yAxis:'balance (starts at '+c.compact(res.corpus)+')', note:'built to reach zero at the planned age '+L.ret.lifeExp, points: res.shockInfo ? [{ label:'shock', value:res.shockInfo.ep.label+' ('+(res.shockInfo.ep.rate*100).toFixed(0)+'%)' }, { label:'outcome', value: res.shockInfo.ranOutYear ? 'runs out in drawdown year '+res.shockInfo.ranOutYear : 'survives the shock' }] : [] },
    ] };
  }
  if (tab === 'portfolio') {
    const p = advisorPortfolioData();
    const fd = computePortfolioFrontierData(p.d, p.assets, p.corr);
    const best = bestSharpePoint(fd.frontier, cfg().d.fdRate);
    const points = [];
    points.push({ label:'your mix', value:'return '+(p.d.portRet*100).toFixed(1)+'%, risk '+(p.d.decomp.totalVol*100).toFixed(1)+'%' });
    if (best) points.push({ label:'best Sharpe', value:'return '+(best.ret*100).toFixed(1)+'%, risk '+(best.vol*100).toFixed(1)+'%, Sharpe '+best.sharpe.toFixed(2) });
    const minVar = fd.frontier.reduce(function (m, x) { return x.vol < m.vol ? x : m; }, fd.frontier[0]);
    if (minVar) points.push({ label:'lowest risk', value:'return '+(minVar.ret*100).toFixed(1)+'%, risk '+(minVar.vol*100).toFixed(1)+'%' });
    return { ok:true, tool:'Build a Portfolio', charts:[
      { kind:'efficient-frontier', title:'The efficient frontier', xAxis:'risk (volatility per year)', yAxis:'expected return per year', note:'blue curve = best return at each risk level; your mix is the orange marker', points: points },
    ] };
  }
  if (tab === 'livefrontier') {
    const items = liveReadyItems();
    if (items.length < 2) return { ok:false, error:'The user needs to add at least two instruments in Test Real Investments first.' };
    const rf = liveDefaultRf() / 100;
    const stats = items.map(function (it) { return L.live.data[it.key].stats; });
    const returns = stats.map(function (s) { return s.annualReturn; });
    const vols = stats.map(function (s) { return s.annualVol; });
    const points = items.map(function (it, i) { return { label: it.symbol, value:'return '+(returns[i]*100).toFixed(1)+'%, risk '+(vols[i]*100).toFixed(1)+'%' }; });
    const cov = computeCovarianceMatrix(stats);
    const corrPairs = [];
    for (let i = 0; i < items.length; i++) for (let j = i+1; j < items.length; j++) corrPairs.push(items[i].symbol+'–'+items[j].symbol+': '+cov.corr[i][j].toFixed(2));
    return { ok:true, tool:'Test Real Investments', charts:[
      { kind:'live-frontier', title:'Real risk and return of your mix', xAxis:'risk (volatility per year)', yAxis:'annualised return', note:'built from '+stats[0].n+' real daily prices per instrument, '+stats[0].startDate+' → '+stats[0].endDate, points: points, correlations: corrPairs, riskFreeRate: (rf*100).toFixed(2)+'%' },
    ] };
  }
  if (tab === 'mc') {
    const m = L.mc;
    const regime = REGIME_PRESETS[m.regime];
    const res = monteCarloAccumulation({sip:m.sip, meanReturn:(m.meanReturn/100)*regime.meanAdj, volatility:(m.volatility/100)*regime.volAdj, years:m.years, due:true, seed:m.seed, n:1000});
    return { ok:true, tool:'Monte Carlo', charts:[
      { kind:'fan', title:'Range of possible outcomes', xAxis:'years (0 → '+m.years+')', yAxis:'balance', note:'1,000 simulated paths; gold line = median, bands = 25th–75th and 10th–90th percentiles', points:[{ label:'P10', value:c.compact(res.p10) }, { label:'P50', value:c.compact(res.p50) }, { label:'P90', value:c.compact(res.p90) }] },
    ] };
  }
  if (tab === 'stepup') {
    const s = L.step;
    const mRate = effectiveMonthlyRate(s.preRate/100);
    const mStep = effectiveMonthlyRate(s.stepUpPct/100);
    const flatSip = solveSIP(mRate, s.years*12, s.corpus, true);
    const steppedSip = solveStepUpSIP(mRate, mStep, s.years*12, s.corpus, true);
    return { ok:true, tool:'Step-Up SIP', charts:[
      { kind:'comparison', title:'Flat vs step-up SIP', xAxis:'years (0 → '+s.years+')', yAxis:'balance (both reach '+c.compact(s.corpus)+')', note:'red = flat SIP, green = step-up', points:[{ label:'flat SIP', value:c.fmt(Math.round(flatSip))+'/mo' }, { label:'step-up SIP (starting)', value:c.fmt(Math.round(steppedSip))+'/mo' }, { label:'year-1 saving', value:c.fmt(Math.round(flatSip-steppedSip))+'/mo' }] },
    ] };
  }
  if (tab === 'swp') {
    const s = L.swp;
    const rr = realRate(s.postRate/100, s.inflation/100);

// Part B — cross-field sanity flags (advisory, not blocking). Gated on the
// current tab so a check only fires when its inputs are actually on screen.
// All three checks apply somewhere in the Lab: capacity (Plan Health),
// retirement corpus-vs-expense, and expense magnitude (Retirement Lab).
function crossFieldSanity(state, country) {
  const flags = [];
  const c = cfg();
  // 3. Expense magnitude for the country (Retirement Lab's monthly expense).
  if (state.tab === 'retirement' && state.ret && state.ret.monthlyExpense != null) {
    const lo = country === 'US' ? 500 : 10000;
    const hi = country === 'US' ? 100000 : 2000000;
    if (state.ret.monthlyExpense < lo) flags.push('Monthly expense looks unusually low for ' + (country === 'US' ? 'the US' : 'India') + ' — check it is the full monthly amount.');
    else if (state.ret.monthlyExpense > hi) flags.push('Monthly expense looks unusually high — check whether that figure is monthly or annual.');
  }
  // 2. Corpus vs retirement-year expense, roughly 15x-40x.
  if (state.tab === 'retirement' && state.ret && state.ret.age != null && state.ret.retireAge != null && state.ret.monthlyExpense) {
    const res = calcRetLab();
    const annual = state.ret.monthlyExpense * 12;
    if (annual > 0 && res.corpus > 0) {
      const ratio = res.corpus / annual;
      if (ratio < 15) flags.push('This corpus is only about ' + Math.round(ratio) + 'x one year of spending — below the usual safe range.');
      else if (ratio > 40) flags.push('This corpus is about ' + Math.round(ratio) + 'x one year of spending — well above the usual range; double-check the expense figure.');
    }
  }
  // 1. Required SIP vs stated capacity (Plan Health).
  if (state.tab === 'health' && state.health && state.health.capacity != null && state.health.totalSIP != null) {
    if (state.health.capacity > 0 && state.health.totalSIP > 1.5 * state.health.capacity) {
      flags.push('Your total SIP of ' + c.fmt(Math.round(state.health.totalSIP)) + '/month is over 1.5x your stated capacity of ' + c.fmt(Math.round(state.health.capacity)) + '/month.');
    }
  }
  return flags;
}

  }
  if (tab === 'joint') {
    const j = L.joint;
    const infl = j.eduInflation/100, preR = j.preRate/100, parkR = j.parkRate/100;
    const horizon = Math.max(...j.children.map(ch => ch.yearsToStart + ch.duration));
    const sipStopYear = Math.max(...j.children.map(ch => ch.yearsToStart));
    const opts = {children:j.children, eduInflation:infl, preRate:preR, parkRate:parkR, sipStopYear, horizon};
    const joint = solveJointEducationCorpus(opts);
    const separate = separateCorporaTotal({children:j.children, eduInflation:infl, preRate:preR, parkRate:parkR});
    return { ok:true, result:{ tool:'Joint Children Corpus', children:j.children.length, jointMonthlySIP:Math.round(joint.sip), separateMonthlySIP:Math.round(separate), savedByPooling:Math.round(separate - joint.sip) } };
  }
  if (tab === 'mc') {

    const regime = REGIME_PRESETS[m.regime];
    const res = monteCarloAccumulation({sip:m.sip, meanReturn:(m.meanReturn/100)*regime.meanAdj, volatility:(m.volatility/100)*regime.volAdj, years:m.years, due:true, seed:m.seed, n:1000});
    return { ok:true, result:{ tool:'Monte Carlo', contribution:m.sip, years:m.years, regime:regime.label, p10:Math.round(res.p10), p50:Math.round(res.p50), p90:Math.round(res.p90), mean:Math.round(res.mean) } };
  }

  }
  if (tab === 'livefrontier') {
    const items = liveReadyItems();
    if (!items.length) return { ok:false, error:'No instruments loaded yet in Test Real Investments — the user needs to add some (or use add_instrument).' };

    return { ok:true, result:{ tool:'Instrument Explorer', categories: KLASS_ORDER.filter(k => idx.some(i => i.klass === k)).map(k => ({ klass:k, count: idx.filter(i => i.klass === k).length })) } };
  }
  if (tab === 'health') {
    const sc = calcHealthScore();
    return { ok:true, result:{ tool:'Plan Health', score:sc.total, capacity:L.health.capacity, totalSIP:L.health.totalSIP, breakdown:{ funding:sc.funding, emergency:sc.emergency, stress:sc.stress, discipline:sc.discipline } }, flags:flags };
  }
  return { ok:true, result:{ tool: tab === 'home' ? 'Home' : tab, note:'Pick a tool to explore.' } };

function resultCanvasLiveFrontier() {
  const items = liveReadyItems();
  if (items.length < 2) return { ok:false, error:'Ask the user to add at least two instruments in Test Real Investments first (or add them via add_instrument).' };
  const rf = liveDefaultRf() / 100;
  if (items.length === 2) {
    const [a, b] = items;
    const sa = L.live.data[a.key].stats, sb = L.live.data[b.key].stats;
    const { corr } = computeCovarianceMatrix([sa, sb]);
    const c12 = corr[0][1];
    const frontier = twoAssetFrontier(sa.annualReturn, sb.annualReturn, sa.annualVol, sb.annualVol, c12);
    const wTan = tangencyWeightTwoAsset(sa.annualReturn, sb.annualReturn, sa.annualVol, sb.annualVol, c12, rf);
    const tanRet = portfolioReturn([wTan,1-wTan],[sa.annualReturn,sb.annualReturn]);
    const tanVol = Math.sqrt(portfolioVariance([wTan,1-wTan],[sa.annualVol,sb.annualVol],[[1,c12],[c12,1]]));
    const cal = capitalAllocationLine(rf, tanRet, tanVol, 2);
    const w = L.live.weight/100;
    const currentVol = Math.sqrt(portfolioVariance([w,1-w],[sa.annualVol,sb.annualVol],[[1,c12],[c12,1]]));
    const currentRet = portfolioReturn([w,1-w],[sa.annualReturn,sb.annualReturn]);
    const wMinVar = minVarianceWeightTwoAsset(sa.annualVol, sb.annualVol, c12);
    const minVarVol = Math.sqrt(portfolioVariance([wMinVar,1-wMinVar],[sa.annualVol,sb.annualVol],[[1,c12],[c12,1]]));
    const minVarRet = portfolioReturn([wMinVar,1-wMinVar],[sa.annualReturn,sb.annualReturn]);
    const assetPoints = [
      { label:a.symbol, fullLabel:L.live.data[a.key].label, vol:sa.annualVol, ret:sa.annualReturn },
      { label:b.symbol, fullLabel:L.live.data[b.key].label, vol:sb.annualVol, ret:sb.annualReturn },
    ];
    return { ok:true, html: liveFrontierChart(frontier, assetPoints, {vol:currentVol,ret:currentRet}, cal, {vol:tanVol,ret:tanRet}, 'cv-live-frontier', onLiveFrontierPick, (w*100).toFixed(0)+'% '+a.symbol+' / '+((1-w)*100).toFixed(0)+'% '+b.symbol, {vol:minVarVol,ret:minVarRet}) };
  }
  const lm = liveComputeMulti();
  const assetPoints = lm.items.map((it,i)=>({ vol:lm.vols[i], ret:lm.returns[i], label:it.symbol, fullLabel:L.live.data[it.key].label }));
  let weights = L.live.selectedWeights;
  if (!weights || weights.length !== lm.items.length) weights = lm.items.map(()=>1/lm.items.length);
  const currentPoint = { vol: Math.sqrt(portfolioVariance(weights, lm.vols, lm.corr)), ret: portfolioReturn(weights, lm.returns) };
  return { ok:true, html: frontierChart(lm.cloud, lm.frontier, assetPoints, currentPoint, 'cv-live-multi', onLiveMultiFrontierPick, rf) };
}
