<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goalden Lab · full assumption control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C3A2D;--ink2:#22402F;--paper:#F1EEE3;
  --gold:#C9A455;--red:#A03A22;--dim:#8A9389;--ok:#3D7A4F;--warn:#C9A455;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:'Figtree',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Newsreader',serif}
.mono{font-family:'Spline Sans Mono',monospace}

/* --- top nav --- */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid rgba(241,238,227,.12)}
.brand{font-family:'Newsreader',serif;font-weight:700;font-size:19px;color:var(--gold);text-decoration:none;display:inline-block}
.brand span{color:var(--paper);font-weight:400;font-style:italic;font-size:13px;margin-left:6px;opacity:.65}
/* The nine tools are the whole point of this page, so the tab bar gets its
   own full-width strip instead of hiding as thin text in the header:
   pill-shaped tabs with real padding, a labelled heading, and a filled
   active state that is unmissable. */
.tabbar{background:linear-gradient(180deg,rgba(201,164,85,.09),rgba(201,164,85,.03));border-bottom:1px solid rgba(201,164,85,.25);padding:12px 24px 14px}
.tabbar-label{font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(201,164,85,.75);margin-bottom:9px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:'Spline Sans Mono',monospace;font-size:11.5px;letter-spacing:.02em;color:rgba(241,238,227,.68);background:rgba(241,238,227,.05);border:1px solid rgba(241,238,227,.16);border-radius:2px 12px 12px 12px;padding:9px 16px;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--paper);border-color:rgba(201,164,85,.5);background:rgba(241,238,227,.08)}
.tab.active{color:var(--ink);background:var(--gold);border-color:var(--gold);font-weight:600}
.country-toggle{display:flex;font-family:'Spline Sans Mono',monospace;font-size:11.5px;border:1px solid rgba(241,238,227,.2);border-radius:3px}
.ctbtn{padding:6px 13px;border:none;background:transparent;color:rgba(241,238,227,.55);cursor:pointer}
.ctbtn:first-child{border-right:1px solid rgba(241,238,227,.15)}
.ctbtn.active{background:rgba(201,164,85,.15);color:var(--gold)}

main{padding:24px 28px 60px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:340px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}

/* --- assumption panel --- */
.panel{background:rgba(241,238,227,.04);border:1px solid rgba(241,238,227,.1);border-radius:3px 20px 20px 20px;padding:24px}
.panel h3{font-size:16px;color:var(--paper);margin-bottom:16px}
.field{margin-bottom:18px}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1}
.field-num{width:64px !important;flex-shrink:0;background:rgba(241,238,227,.07);border:1px solid rgba(241,238,227,.2);border-radius:4px;padding:5px 6px;color:var(--paper);font-family:'Spline Sans Mono',monospace;font-size:11.5px;text-align:center}
.field-num::-webkit-outer-spin-button,.field-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field label{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(241,238,227,.6);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.field label b{color:var(--gold);font-weight:600}
.field input[type=range]{width:100%;accent-color:var(--gold);height:20px}
.field input[type=number]{width:100%;background:rgba(241,238,227,.06);border:1px solid rgba(241,238,227,.16);border-radius:4px;padding:9px 11px;color:var(--paper);font-family:'Spline Sans Mono',monospace;font-size:13px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;gap:1px;margin-bottom:14px;border:1px solid rgba(241,238,227,.18);border-radius:3px;overflow:hidden}
.tglbtn{flex:1;font-family:'Spline Sans Mono',monospace;font-size:10.5px;padding:9px 6px;border:none;border-right:1px solid rgba(241,238,227,.14);background:transparent;color:rgba(241,238,227,.55);cursor:pointer;text-align:center}
.tglbtn:last-child{border-right:none}
.tglbtn.active{background:rgba(201,164,85,.16);color:var(--gold);font-weight:600}
.divider{border:none;border-top:1px dashed rgba(241,238,227,.15);margin:18px 0}
.section-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}

/* --- output area --- */
.output{display:flex;flex-direction:column;gap:18px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:rgba(241,238,227,.05);border:1px solid rgba(241,238,227,.1);border-radius:3px 15px 15px 15px;padding:17px 18px}
.stat-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:var(--paper)}
.stat-sub{font-size:11.5px;color:rgba(241,238,227,.5);margin-top:4px}
.card{background:rgba(241,238,227,.04);border:1px solid rgba(241,238,227,.1);border-radius:2px 2px 18px 18px;padding:22px}
.card h4{font-size:15px;margin-bottom:4px;color:var(--paper)}
.card .cap{font-size:12px;color:rgba(241,238,227,.5);margin-bottom:14px}
svg.chart{width:100%;height:auto;display:block}

/* --- table --- */
.dtable{width:100%;border-collapse:collapse;font-family:'Spline Sans Mono',monospace;font-size:11.5px}
.dtable th{text-align:right;padding:7px 8px;color:var(--dim);font-weight:500;border-bottom:1px solid rgba(241,238,227,.15);position:sticky;top:0;background:var(--ink)}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable td{text-align:right;padding:6px 8px;color:rgba(241,238,227,.75);border-bottom:1px solid rgba(241,238,227,.06)}
.dtable tr.shock td{background:rgba(160,58,34,.18);color:#F0C4B4}
.dtable tr.negative td{color:#E8977A}
.table-scroll{max-height:340px;overflow-y:auto;border-radius:10px}

/* --- episode chips --- */
.episode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.inst-header{margin-bottom:20px}
.inst-source{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);margin-top:10px}
.inst-cat-block{margin-bottom:26px}
.inst-cat-head{font-family:'Newsreader',serif;font-size:17px;color:var(--paper);margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.inst-cat-count{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);font-weight:400}
.lab-inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lab-inst-card{background:rgba(241,238,227,.04);border:1px solid rgba(241,238,227,.1);border-radius:3px 12px 12px 12px;padding:13px 14px}
.lab-inst-name{font-family:'Newsreader',serif;font-size:14px;color:var(--paper);line-height:1.3;margin-bottom:4px}
.lab-inst-rate{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--gold);margin-bottom:6px}
.lab-inst-note{font-size:11.5px;color:rgba(241,238,227,.55);line-height:1.5}
.lab-inst-flag{display:inline-block;font-family:'Spline Sans Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;margin-bottom:6px}
.lab-inst-card.flag-avoid{border-color:rgba(160,58,34,.4)}
.lab-inst-card.flag-avoid .lab-inst-flag{background:rgba(160,58,34,.2);color:#F0C4B4}
.lab-inst-card.flag-legacy{border-color:rgba(241,238,227,.15);opacity:.75}
.lab-inst-card.flag-legacy .lab-inst-flag{background:rgba(241,238,227,.08);color:rgba(241,238,227,.6)}
.lab-inst-card.flag-check .lab-inst-flag{background:rgba(201,164,85,.18);color:var(--gold)}

/* --- efficient frontier chart --- */
.fx-chart-wrap{position:relative}
.fx-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:11px;color:rgba(241,238,227,.55)}
.fx-legend span{display:flex;align-items:center;gap:6px}
.fx-legend i{display:inline-block;width:16px;height:3px;flex-shrink:0}
.risk-comp-legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:11.5px;color:rgba(241,238,227,.6);line-height:1.5}
.risk-comp-legend span{display:flex;align-items:flex-start;gap:8px}
.risk-comp-legend i{display:inline-block;width:11px;height:11px;border-radius:2px;flex-shrink:0;margin-top:3px}
.fx-tooltip{position:absolute;pointer-events:none;background:#12261C;border:1px solid rgba(201,164,85,.4);border-radius:3px 8px 8px 8px;padding:8px 11px;font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--paper);opacity:0;transition:opacity .1s;white-space:nowrap;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fx-tooltip.show{opacity:1}
.fx-tooltip .tt-label{color:var(--gold);font-weight:600;margin-bottom:3px;display:block}
svg.chart .fx-hover-target{cursor:pointer}

/* --- info icon hover tooltip (for stat labels, term explanations) --- */
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid rgba(241,238,227,.35);color:rgba(241,238,227,.55);font-size:9.5px;font-family:'Spline Sans Mono',monospace;font-style:normal;cursor:help;margin-left:5px;position:relative;flex-shrink:0}
.info-icon:hover{border-color:var(--gold);color:var(--gold)}
.info-icon .ii-tip{display:none;position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#12261C;border:1px solid rgba(201,164,85,.4);border-radius:3px 8px 8px 8px;padding:9px 12px;font-family:'Figtree',sans-serif;font-size:11.5px;font-weight:400;color:rgba(241,238,227,.85);width:220px;line-height:1.5;text-align:left;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:normal}
.info-icon:hover .ii-tip{display:block}
.stat-label{display:flex;align-items:center}

.term{border-bottom:1px dashed rgba(201,164,85,.6);cursor:help;position:relative}
.term::after{content:attr(data-def);display:none;position:absolute;bottom:calc(100% + 7px);left:0;background:#12261C;border:1px solid rgba(201,164,85,.4);border-radius:3px 8px 8px 8px;padding:9px 12px;font-family:'Figtree',sans-serif;font-size:11.5px;font-weight:400;color:rgba(241,238,227,.85);width:240px;line-height:1.5;white-space:normal;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.term:hover::after{display:block}
.term:hover{border-bottom-color:var(--gold);color:var(--gold)}

/* --- cluster-grouped portfolio sliders --- */
.port-cluster{margin-bottom:6px}
.port-cluster-head{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);padding:10px 0 8px;border-top:1px dashed rgba(241,238,227,.14);margin-top:10px}
.port-cluster:first-child .port-cluster-head{border-top:none;margin-top:0}
.pf-total-banner{display:flex;align-items:baseline;justify-content:space-between;background:rgba(201,164,85,.1);border:1px solid rgba(201,164,85,.35);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.pf-total-banner .ttl-label{font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(241,238,227,.6);letter-spacing:.04em}
.pf-total-banner .ttl-value{font-family:'Spline Sans Mono',monospace;font-size:16px;font-weight:600;color:var(--gold)}
.port-asset-meta{display:block;font-family:'Spline Sans Mono',monospace;font-size:10px;color:rgba(241,238,227,.42);font-weight:400;margin-top:2px;letter-spacing:.01em}
.port-pct-row{display:flex;align-items:baseline;gap:6px;margin:6px 0 5px}
.port-pct-badge{font-family:'Spline Sans Mono',monospace;font-size:15px;font-weight:600;color:var(--paper)}
.port-pct-of{font-family:'Spline Sans Mono',monospace;font-size:10px;color:rgba(241,238,227,.4)}
.epchip{font-family:'Spline Sans Mono',monospace;font-size:11px;padding:8px 8px;border-radius:2px;border:1px solid rgba(241,238,227,.16);background:rgba(241,238,227,.04);color:rgba(241,238,227,.7);cursor:pointer;text-align:center;line-height:1.5}
.epchip.active{background:rgba(160,58,34,.25);border-color:var(--red);color:#F0C4B4}
.epchip b{display:block;color:var(--paper);font-size:12px}

/* --- health score --- */
.score-dial{display:flex;align-items:center;gap:22px}
.dial-num{font-family:'Newsreader',serif;font-size:52px;font-weight:700;color:var(--gold)}
.dial-bars{flex:1;display:flex;flex-direction:column;gap:8px}
.dbar-row{display:flex;align-items:center;gap:10px;font-size:11.5px}
.dbar-label{width:110px;font-family:'Spline Sans Mono',monospace;color:rgba(241,238,227,.6);flex-shrink:0}
.dbar-track{flex:1;height:7px;background:rgba(241,238,227,.1);border-radius:4px;overflow:hidden}
.dbar-fill{height:100%;background:var(--gold);border-radius:4px}
.dbar-val{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);width:34px;text-align:right}

.gr-note{font-size:12.5px;color:rgba(241,238,227,.6);line-height:1.6;padding:12px 14px;background:rgba(241,238,227,.04);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;margin-top:6px}

.fx-flow{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 18px;font-family:'Newsreader',serif;font-size:15px}
.fx-arrow{color:var(--gold);font-size:20px}
@media print{
  body{background:#fff;color:#1C3A2D}
  header,.tabbar,.panel,.section-label,#tabs,.country-toggle,#reseedBtn,.gp-actions,button{display:none !important}
  main{padding:0;max-width:100%}
  .grid{grid-template-columns:1fr;display:block}
  .card,.stat{background:#fff;border:1px solid #ccc;break-inside:avoid;box-shadow:none}
  .stat-value,.hero-figure,h3,h4{color:#1C3A2D !important}
  .gr-note,.cap,.stat-label{color:#555 !important}
  svg.chart line,svg.chart path{filter:none}
  .print-header{display:block !important;margin-bottom:24px;border-bottom:2px solid #1C3A2D;padding-bottom:12px}
  .print-header .pt{font-family:'Newsreader',serif;font-size:22px;font-weight:700}
  .print-header .ps{font-family:'Spline Sans Mono',monospace;font-size:11px;color:#666;margin-top:4px}
}
.print-header{display:none}
.print-btn{position:fixed;bottom:20px;right:20px;background:var(--gold);color:var(--ink);border:none;border-radius:24px;padding:12px 18px;font-family:'Figtree',sans-serif;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:50;display:flex;align-items:center;gap:8px}
.print-btn svg{width:15px;height:15px}
@media print{.print-btn{display:none !important}}

.snap-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.snap-card{background:rgba(201,164,85,.08);border:1px solid rgba(201,164,85,.3);border-radius:3px 14px 14px 14px;padding:14px}
.snap-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.snap-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.snap-figure{font-family:'Newsreader',serif;font-size:22px;font-weight:600;color:var(--paper)}
.snap-sub{font-size:11px;color:rgba(241,238,227,.55);margin-top:4px}
.snap-add{background:rgba(241,238,227,.04);border:1.5px dashed rgba(241,238,227,.2);border-radius:3px 14px 14px 14px;color:rgba(241,238,227,.55);font-family:'Figtree',sans-serif;font-size:13px;cursor:pointer;padding:14px}
.gp-iconbtn{width:26px;height:26px;border-radius:6px;border:1px solid rgba(241,238,227,.16);background:rgba(241,238,227,.04);color:rgba(241,238,227,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:5px;flex-shrink:0}
.gp-iconbtn:hover{color:var(--paper)}
.gp-iconbtn svg{width:100%;height:100%}
</style>
</head>
<body>
<header>
  <a href="index.html" class="brand">Goalden<span>the lab</span></a>
  <div class="country-toggle" id="countryToggle"></div>
</header>
<nav class="tabbar">
  <div class="tabbar-label">Nine tools, pick one</div>
  <div class="tabs" id="tabs"></div>
</nav>
<div class="print-header" id="printHeader"></div>
<main id="main"></main>
<button class="print-btn" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span>Print / Save as PDF</span></button>

<script>
'use strict';
/* =====================================================================
   ENGINE (verbatim port)
   ===================================================================== */
function inflateExpense(amt,phases,f){if(f===undefined)f=1;for(const p of phases)amt*=Math.pow(1+p.rate,p.years);return amt*f}
function realRate(r,i){return(1+r)/(1+i)-1}
function corpusRequired(rate,years,w,due){if(rate===0)return w*years;let pv=w*(1-Math.pow(1+rate,-years))/rate;return due?pv*(1+rate):pv}
function solveSIP(rate,periods,fv,due){if(rate===0)return fv/periods;let f=(Math.pow(1+rate,periods)-1)/rate;return fv/(due?f*(1+rate):f)}
function solveStepUpSIP(rate,growth,periods,fv,due){
  if(Math.abs(rate-growth)<1e-9){const f=periods*Math.pow(1+rate,periods-1)*(due?(1+rate):1);return fv/f;}
  let f=(Math.pow(1+rate,periods)-Math.pow(1+growth,periods))/(rate-growth);
  return fv/(due?f*(1+rate):f);
}
function effectiveMonthlyRate(r){return Math.pow(1+r,1/12)-1}
function swpWithdrawal(rate,years,corpus,due){
  if(rate===0)return corpus/years;
  let f=(1-Math.pow(1+rate,-years))/rate;
  if(due)f*=(1+rate);
  return corpus/f;
}
function drawdownWithShock(opts, shockYear, shockReturn){
  const rows=[];let bal=opts.openingCorpus,w=opts.firstWithdrawal;let ranOutYear=null;
  for(let yr=1;yr<=opts.years;yr++){
    const rate=(yr===shockYear)?shockReturn:opts.nominalRate;
    let close;
    if(opts.due){const baw=bal-w;close=baw+baw*rate;}
    else{close=(bal+bal*rate)-w;}
    if(close<0&&ranOutYear===null)ranOutYear=yr;
    rows.push({year:yr,openBal:bal,withdrawal:w,rate,closeBal:close});
    bal=close;
    w*=(1+opts.inflation);
  }
  return{rows,ranOutYear,finalBalance:bal};
}
function accumulationSchedule(o){
  const rows=[];let bal=o.opening||0,contrib=o.sip,total=0;
  for(let i=1;i<=o.periods;i++){
    let close;
    if(o.due){const b2=bal+contrib;close=b2*(1+o.rate);}
    else{close=bal*(1+o.rate)+contrib;}
    total+=contrib;
    rows.push({period:i,closeBal:close,contributed:total});
    bal=close;
    contrib*=(1+(o.stepUp||0));
  }
  return{rows,finalBalance:bal};
}

/* =====================================================================
   MONTE CARLO — seeded (mulberry32 PRNG + Box-Muller), n=1000 default.
   Verified: volatility=0 collapses exactly to the deterministic engine
   answer at every percentile; same seed reproduces identical results;
   spread widens monotonically with volatility.
   ===================================================================== */
function mulberry32(seed){
  return function(){
    seed|=0; seed=(seed+0x6D2B79F5)|0;
    let t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return((t^(t>>>14))>>>0)/4294967296;
  };
}
function gaussian(rng){const u1=rng()||1e-9,u2=rng();return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);}

function monteCarloAccumulation({sip,meanReturn,volatility,years,due,seed,n}){
  const rng=mulberry32(seed);
  const finals=[],paths=[];
  for(let sim=0;sim<n;sim++){
    let bal=0; const path=[0];
    for(let y=1;y<=years;y++){
      const r=volatility===0?meanReturn:meanReturn+volatility*gaussian(rng);
      bal=due?(bal+sip)*(1+r):bal*(1+r)+sip;
      path.push(bal);
    }
    finals.push(bal); paths.push(path);
  }
  finals.sort((a,b)=>a-b);
  const pct=p=>finals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
  // percentile band PER YEAR (for the fan chart) — recompute per-year percentiles across all paths
  const yearBands=[];
  for(let y=0;y<=years;y++){
    const vals=paths.map(p=>p[y]).sort((a,b)=>a-b);
    const pp=p=>vals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
    yearBands.push({year:y,p10:pp(0.10),p25:pp(0.25),p50:pp(0.50),p75:pp(0.75),p90:pp(0.90)});
  }
  return{p10:pct(0.10),p25:pct(0.25),p50:pct(0.50),p75:pct(0.75),p90:pct(0.90),mean:finals.reduce((a,b)=>a+b,0)/n,yearBands};
}

// Same PRNG, same percentile-banding approach as monteCarloAccumulation,
// but run over the SPENDING-down phase instead: each simulated year draws
// a random return, the withdrawal (already fixed by the deterministic
// plan) is taken out, and once a path hits zero it stays there. This is
// what a single average return can never show: two paths with the exact
// same mean and volatility can survive or fail entirely depending on
// WHEN the bad years land — sequence-of-returns risk.
function monteCarloDrawdown({openingCorpus,firstWithdrawal,inflation,meanReturn,volatility,years,due,seed,n}){
  const rng=mulberry32(seed);
  const finals=[],paths=[],ranOutYears=[];
  for(let sim=0;sim<n;sim++){
    let bal=openingCorpus,w=firstWithdrawal,ranOut=null;
    const path=[bal];
    for(let y=1;y<=years;y++){
      const r=volatility===0?meanReturn:meanReturn+volatility*gaussian(rng);
      let close;
      if(due){const baw=bal-w;close=baw+baw*r;}else{close=(bal+bal*r)-w;}
      // A plan built to reach exactly zero can land a hair below it from
      // pure floating-point rounding (seen: -2.5e-7 on a multi-crore
      // balance). Only count it as ruin past a real, rupee-scale deficit.
      if(close<-1&&ranOut===null)ranOut=y;
      bal=Math.max(0,close);
      path.push(bal);
      w*=(1+inflation);
    }
    finals.push(bal);paths.push(path);ranOutYears.push(ranOut);
  }
  finals.sort((a,b)=>a-b);
  const pct=p=>finals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
  const yearBands=[];
  for(let y=0;y<=years;y++){
    const vals=paths.map(p=>p[y]).sort((a,b)=>a-b);
    const pp=p=>vals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
    yearBands.push({year:y,p10:pp(0.10),p25:pp(0.25),p50:pp(0.50),p75:pp(0.75),p90:pp(0.90)});
  }
  const survived=ranOutYears.filter(x=>x===null).length;
  const failedYears=ranOutYears.filter(x=>x!==null).sort((a,b)=>a-b);
  const medianRuinYear=failedYears.length?failedYears[Math.floor(failedYears.length/2)]:null;
  return{p10:pct(0.10),p25:pct(0.25),p50:pct(0.50),p75:pct(0.75),p90:pct(0.90),yearBands,
         survivalPct:survived/n,failCount:failedYears.length,medianRuinYear,n};
}

function clusterCorr(c1,c2){
  if(c1===c2) return CLUSTER_CORR[c1+'-'+c1] !== undefined ? CLUSTER_CORR[c1+'-'+c1] : 1.00;
  const k1=c1+'-'+c2, k2=c2+'-'+c1;
  return CLUSTER_CORR[k1]!==undefined ? CLUSTER_CORR[k1] : CLUSTER_CORR[k2];
}
function buildCorrMatrix(assets){
  const n=assets.length;
  const m=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) m[i][j] = i===j ? 1.00 : clusterCorr(assets[i].cluster, assets[j].cluster);
  return m;
}

function portfolioReturn(weights, returns){ return weights.reduce((s,w,i)=>s+w*returns[i],0); }
function portfolioVariance(weights, vols, corr){
  let v=0;
  for(let i=0;i<weights.length;i++) for(let j=0;j<weights.length;j++) v+=weights[i]*weights[j]*vols[i]*vols[j]*corr[i][j];
  return v;
}
function portfolioBeta(weights, betas){ return weights.reduce((s,w,i)=>s+w*betas[i],0); }

// Rigorous systematic/unsystematic risk split via the single-index model,
// computed directly from the covariance matrix rather than the
// hand-assigned per-asset beta above — guarantees beta=1.00 exactly for
// 100% market and unsystematic risk >= 0 always, since both are
// structural properties of covariance projection, not approximations.
// marketIdx is the asset used as the market proxy (index 0 in each list:
// Large Cap Equity for India, Total-Market Equity for the US).
function decomposeRisk(weights, vols, corr, marketIdx){
  const marketVol = vols[marketIdx];
  const totalVar = portfolioVariance(weights, vols, corr);
  let covWithMarket = 0;
  for(let i=0;i<weights.length;i++) covWithMarket += weights[i]*vols[i]*marketVol*corr[i][marketIdx];
  const beta = covWithMarket / (marketVol*marketVol);
  const systematicVar = beta*beta*marketVol*marketVol;
  const unsystematicVar = Math.max(0, totalVar - systematicVar);
  return {
    totalVol: Math.sqrt(totalVar), beta,
    systematicVol: Math.sqrt(systematicVar),
    unsystematicVol: Math.sqrt(unsystematicVar),
    unsystematicPct: totalVar>0 ? unsystematicVar/totalVar : 0,
    systematicPct: totalVar>0 ? systematicVar/totalVar : 0,
  };
}
function normalizeWeights(raw){
  const sum=raw.reduce((a,b)=>a+b,0);
  return sum>0 ? raw.map(w=>w/sum) : raw.map(()=>1/raw.length);
}
// Rounding 15 independent fractions to whole percents for display can miss
// or overshoot 100 by a point or two (classic apportionment problem — the
// exact thing a person adding up the numbers by hand would notice and
// distrust). Largest-remainder method: floor everything, then hand the
// leftover points to whichever assets had the biggest rounded-off remainder,
// so the displayed integers always sum to exactly 100.
function roundPercentsTo100(weights){
  const raw = weights.map(w=>w*100);
  const floors = raw.map(Math.floor);
  let remainder = 100 - floors.reduce((a,b)=>a+b,0);
  const order = raw.map((v,i)=>({i, frac: v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
  const result = floors.slice();
  for(let k=0; k<remainder && k<order.length; k++) result[order[k].i] += 1;
  return result;
}

function randomWeights(n, rng){
  const cuts=[0,1];
  for(let i=0;i<n-1;i++) cuts.push(rng());
  cuts.sort((a,b)=>a-b);
  const w=[];
  for(let i=0;i<n;i++) w.push(cuts[i+1]-cuts[i]);
  return w;
}

function generateFrontier(returns, vols, corr, n, seed){
  const rng=mulberry32(seed);
  const cloud=[];
  for(let i=0;i<n;i++){
    const w=randomWeights(returns.length, rng);
    cloud.push({ w, ret:portfolioReturn(w,returns), vol:Math.sqrt(portfolioVariance(w,vols,corr)) });
  }
  const minV=Math.min(...cloud.map(p=>p.vol)), maxV=Math.max(...cloud.map(p=>p.vol));
  const bins=40, binW=(maxV-minV)/bins;
  const best=new Array(bins).fill(null);
  cloud.forEach(p=>{
    let b=Math.min(bins-1,Math.floor((p.vol-minV)/(binW||1)));
    if(!best[b]||p.ret>best[b].ret) best[b]=p;
  });
  return { cloud, frontier:best.filter(Boolean).sort((a,b)=>a.vol-b.vol) };
}

/* =====================================================================
   JOINT CHILDREN EDUCATION CORPUS SOLVER (B-03)
   Verified against three cases: gap-year saving (₹30,181/yr kept vs
   separate corpora), mid-timeline binding constraint (never goes
   negative even when the tightest point is mid-plan, not the end),
   and exact reduction to the standard single-goal engine when rates
   are held constant.
   ===================================================================== */
function solveJointEducationCorpus({children, eduInflation, preRate, parkRate, sipStopYear, horizon}){
  function simulate(sip){
    let bal=0, minBal=Infinity, minYear=0;
    const rows=[];
    for(let t=1;t<=horizon;t++){
      let fees=0;
      children.forEach(ch=>{
        const s=ch.yearsToStart+1, e=ch.yearsToStart+ch.duration;
        if(t>=s && t<=e) fees += ch.annualFeeToday*Math.pow(1+eduInflation, t-1);
      });
      const contrib = t<=sipStopYear ? sip : 0;
      const anyNear = children.some(ch => t>=ch.yearsToStart);
      const rate = anyNear ? parkRate : preRate;
      const after = bal + contrib - fees;
      if(after<minBal){minBal=after; minYear=t;}
      bal = after*(1+rate);
      rows.push({year:t, contrib:Math.round(contrib), fees:Math.round(fees), rate, close:Math.round(bal)});
    }
    return{finalBal:bal, minBal, minYear, rows};
  }
  let lo=0, hi=50000000;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    simulate(mid).minBal >= 0 ? hi=mid : lo=mid;
  }
  return{sip:hi, ...simulate(hi)};
}

function separateCorporaTotal({children, eduInflation, preRate, parkRate}){
  let total=0;
  children.forEach(ch=>{
    const r = solveJointEducationCorpus({
      children:[ch], eduInflation, preRate, parkRate,
      sipStopYear: ch.yearsToStart, horizon: ch.yearsToStart+ch.duration,
    });
    total += r.sip;
  });
  return total;
}


/* =====================================================================
   FX MODULE (verbatim port of fx.js)
   ===================================================================== */
function fxInvestingAbroad(principal, foreignReturn, homeDeprec, years){
  return principal * Math.pow((1+foreignReturn)*(1+homeDeprec), years);
}
function fxReceivingFromAbroad(principal, foreignReturn, foreignDeprec, years){
  return principal * Math.pow((1+foreignReturn)/(1+foreignDeprec), years);
}
function fxCompare({principal, direction, homeReturn, foreignReturn, depreciationRate, years}){
  const domesticFV = principal * Math.pow(1+homeReturn, years);
  const crossBorderFV = direction==='investingAbroad'
    ? fxInvestingAbroad(principal, foreignReturn, depreciationRate, years)
    : fxReceivingFromAbroad(principal, foreignReturn, depreciationRate, years);
  const marketOnlyFV = principal * Math.pow(1+foreignReturn, years);
  const currencyEffect = crossBorderFV - marketOnlyFV;
  const effectiveAnnualReturn = Math.pow(crossBorderFV/principal, 1/years) - 1;
  return {domesticFV, crossBorderFV, marketOnlyFV, currencyEffect, effectiveAnnualReturn, foreignBeatsHome: crossBorderFV>domesticFV};
}

function yearlyAmortization(monthlyRows){
  const years=[];
  let prevClose=0, prevContributed=0;
  for(let m=0; m<monthlyRows.length; m+=12){
    const yearEndRow = monthlyRows[Math.min(m+11, monthlyRows.length-1)];
    const contributedThisYear = yearEndRow.contributed - prevContributed;
    const growthThisYear = yearEndRow.closeBal - prevClose - contributedThisYear;
    years.push({
      year: years.length+1,
      contributedThisYear: Math.round(contributedThisYear),
      growthThisYear: Math.round(growthThisYear),
      closeBal: Math.round(yearEndRow.closeBal),
    });
    prevClose = yearEndRow.closeBal;
    prevContributed = yearEndRow.contributed;
  }
  return years;
}

// A bare filled shape with no readable numbers on it isn't information,
// it's decoration. Always show the actual starting/ending amounts, the
// years spanned, and exactly where the pot runs dry if it does — with a
// real marker, not left for the reader to guess from the shape of the
// line. Shock-year markers (existing feature) are preserved as-is.
function drawdownChart(rows, c, w, h){
  if(w===undefined)w=760; if(h===undefined)h=240;
  const p=6, topPad=26, botPad=22;
  const chartH=h-topPad-botPad;
  const maxV=Math.max(rows[0].openBal, 0);
  const minV=Math.min(0, ...rows.map(r=>r.closeBal));
  const range=maxV-minV || 1;
  const n=rows.length, sx=(w-p*2)/(n-1||1);
  const y=v=>topPad+chartH-((v-minV)/range)*chartH;
  const zeroY=y(0);
  let depletedYear=null;
  for(const r of rows){ if(r.closeBal<=0){ depletedYear=r.year; break; } }
  const prematureDepletion = depletedYear!==null && depletedYear<n;
  let pts='M'+p+','+y(rows[0].openBal).toFixed(1);
  rows.forEach((r,i)=>pts+=' L'+(p+i*sx).toFixed(1)+','+y(r.closeBal).toFixed(1));
  const lx=(p+(n-1)*sx).toFixed(1);
  let shockMarks='';
  rows.forEach((r,i)=>{
    if(r.rate!==undefined && r.rate < -0.05){
      const cx=(p+i*sx).toFixed(1);
      shockMarks+=`<circle cx="${cx}" cy="${y(r.closeBal).toFixed(1)}" r="4" fill="#E8977A"/>`;
    }
  });
  const endVal=rows[rows.length-1].closeBal;
  const fmt=c?(v=>c.compact(v)):(v=>Math.round(v).toLocaleString());
  const markX=prematureDepletion?(p+(depletedYear-1)*sx).toFixed(1):null;
  const markY=prematureDepletion?zeroY.toFixed(1):null;
  return svgOpen(w,h)+
    `<defs><linearGradient id="ddg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3D7A4F" stop-opacity=".55"/><stop offset="100%" stop-color="#3D7A4F" stop-opacity=".04"/></linearGradient></defs>
    <path d="${pts} L${lx},${zeroY.toFixed(1)} L${p},${zeroY.toFixed(1)} Z" fill="url(#ddg)"/>
    <line x1="${p}" y1="${zeroY.toFixed(1)}" x2="${w-p}" y2="${zeroY.toFixed(1)}" stroke="rgba(241,238,227,.35)" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="${pts}" fill="none" stroke="#8FC79E" stroke-width="1.75"/>
    ${shockMarks}
    <text x="${p}" y="16" font-family="Spline Sans Mono,monospace" font-size="12" fill="rgba(241,238,227,.6)">Starts at ${fmt(maxV)}</text>
    ${prematureDepletion
      ? `<circle cx="${markX}" cy="${markY}" r="4" fill="#E8977A"/><text x="${markX}" y="${(parseFloat(markY)-9).toFixed(1)}" text-anchor="middle" font-family="Spline Sans Mono,monospace" font-size="12" font-weight="600" fill="#E8977A">Runs out, yr ${depletedYear}</text>`
      : `<circle cx="${lx}" cy="${y(endVal).toFixed(1)}" r="3.5" fill="#8FC79E"/><text x="${w-p}" y="16" text-anchor="end" font-family="Spline Sans Mono,monospace" font-size="12" font-weight="600" fill="#8FC79E">${endVal<=0?'Reaches zero as planned':'Ends at '+fmt(endVal)}</text>`}
    <text x="${p}" y="${h-6}" font-family="Spline Sans Mono,monospace" font-size="11" fill="rgba(241,238,227,.4)">Yr 1</text>
    <text x="${w-p}" y="${h-6}" text-anchor="end" font-family="Spline Sans Mono,monospace" font-size="11" fill="rgba(241,238,227,.4)">Yr ${n}</text>
    </svg>`;
}

function mountainChart(rows, w, h){
  if(w===undefined)w=760; if(h===undefined)h=200;
  const p=6, maxV=rows[rows.length-1].closeBal, n=rows.length, sx=(w-p*2)/(n-1||1);
  const y=v=>h-p-(Math.max(0,v)/maxV)*(h-p*2);
  let gp='M'+p+','+h, cp='M'+p+','+h;
  rows.forEach((r,i)=>{const x=(p+i*sx).toFixed(1); gp+=' L'+x+','+y(r.closeBal).toFixed(1); cp+=' L'+x+','+y(r.contributed).toFixed(1);});
  const lx=(p+(n-1)*sx).toFixed(1);
  return svgOpen(w,h)+
    `<defs><linearGradient id="mg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C9A455" stop-opacity=".8"/><stop offset="100%" stop-color="#C9A455" stop-opacity=".06"/></linearGradient></defs>
    <path d="${gp} L${lx},${h} L${p},${h} Z" fill="url(#mg2)"/>
    <path d="${cp} L${lx},${h} L${p},${h} Z" fill="rgba(241,238,227,.14)"/>
    <line x1="${p}" y1="${h}" x2="${w-p}" y2="${h}" stroke="rgba(241,238,227,.2)" stroke-width="1"/>
    </svg>`;
}

function twinFatesChart(rowsA, rowsB, w, h){
  if(w===undefined)w=760; if(h===undefined)h=200;
  const p=6;
  const allVals=[...rowsA.map(r=>r.closeBal),...rowsB.map(r=>r.closeBal),0];
  const maxV=Math.max(...allVals), minV=Math.min(...allVals);
  const range=(maxV-minV)||1;
  const n=rowsA.length, sx=(w-p*2)/(n-1||1);
  const y=v=>h-p-((v-minV)/range)*(h-p*2);
  const zeroY=y(0);
  function pathFor(rows){let pts='M'+p+','+y(rows[0].openBal).toFixed(1);rows.forEach((r,i)=>pts+=' L'+(p+i*sx).toFixed(1)+','+y(r.closeBal).toFixed(1));return pts;}
  return svgOpen(w,h)+
    `<line x1="${p}" y1="${zeroY}" x2="${w-p}" y2="${zeroY}" stroke="rgba(241,238,227,.3)" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="${pathFor(rowsA)}" fill="none" stroke="#E8977A" stroke-width="2"/>
    <path d="${pathFor(rowsB)}" fill="none" stroke="#8FC79E" stroke-width="2"/>
    </svg>`;
}

function calcRetLab(){
  const c=cfg(), r=L.ret;
  const yrs=r.retireAge-r.age;
  const drawYrs=Math.max(5, r.lifeExp-r.retireAge);
  const infl=r.inflation/100, preR=r.preRate/100, postR=r.postRate/100;
  const rr=realRate(postR, infl);
  let expAtRet, corpus;
  if(r.corpusMode==='custom'){
    // The person names the pot; the plan solves backwards from it.
    // If they typed the amount in today's money, inflate it to the
    // retirement date first so the target keeps its purchasing power.
    corpus = r.customBasis==='today' ? r.customCorpus*Math.pow(1+infl, yrs) : r.customCorpus;
    // What that pot sustainably supports: the same inverse-annuity used
    // by the Sustainable Withdrawal tab, so both tabs agree by construction.
    expAtRet = swpWithdrawal(rr, drawYrs, corpus, r.due);
  } else {
    expAtRet=inflateExpense(r.monthlyExpense*12, [{rate:infl, years:yrs}], r.lifestyleFactor/100);
    corpus=corpusRequired(rr, drawYrs, expAtRet, r.due);
  }
  const mRate=effectiveMonthlyRate(preR);
  // Existing savings assumed to keep compounding at the same rate as the
  // new SIP, so existingFV + gapCorpus lands on the full target corpus
  // exactly — same identity used in both doors.
  const existing=r.existingSavings||0;
  const existingFV=existing*Math.pow(1+mRate, yrs*12);
  const gapCorpus=Math.max(0, corpus-existingFV);
  const sip=solveSIP(mRate, yrs*12, gapCorpus, r.due);
  const realCorpus=corpus/Math.pow(1+infl, yrs);
  const accRows=accumulationSchedule({sip, rate:mRate, periods:yrs*12, due:r.due, opening:existing}).rows;

  let ddRows, shockInfo=null;
  if(r.shock){
    const ep=c.episodes.find(e=>e.id===r.shock.epId);
    const res=drawdownWithShock({openingCorpus:corpus, firstWithdrawal:expAtRet, inflation:infl, nominalRate:postR, years:drawYrs, due:r.due}, r.shock.year, ep.rate);
    ddRows=res.rows;
    shockInfo={ep, ranOutYear:res.ranOutYear, finalBalance:res.finalBalance};
  } else {
    const res=drawdownWithShock({openingCorpus:corpus, firstWithdrawal:expAtRet, inflation:infl, nominalRate:postR, years:drawYrs, due:r.due}, -1, 0);
    ddRows=res.rows;
  }

  return {yrs, drawYrs, expAtRet, corpus, sip, realCorpus, accRows, ddRows, shockInfo, existing, existingFV, gapCorpus};
}

// The drawdown Monte Carlo simulates 1,000 paths over the full spending
// phase, comparable cost to the MC tab's own accumulation simulation
// (that one needed a debounce to stay under 16ms per tick; this one is no
// cheaper). renderRetirement() runs synchronously on every slider tick for
// this tab, so this card must NEVER compute inline there — only this
// debounced job touches monteCarloDrawdown, and it patches the card's own
// container directly rather than forcing a full tab re-render.
let ddmcTimer=null;
let lastDDMCHtml='';
function renderDDMCBody(res){
  const r=L.ret, c=cfg();
  const mc=monteCarloDrawdown({openingCorpus:res.corpus, firstWithdrawal:res.expAtRet, inflation:r.inflation/100,
    meanReturn:r.postRate/100, volatility:r.ddVol/100, years:res.drawYrs, due:r.due, seed:r.ddSeed, n:1000});
  const survPct=Math.round(mc.survivalPct*100);
  const html=`<div class="stat-row" style="margin-top:10px">
    <div class="stat"><div class="stat-label">Survives to age ${r.lifeExp}${infoIcon('Share of the 1,000 simulated paths that never hit zero before the plan ends. Below 100% means pure return-order randomness, not a wrong average, can still empty the pot.')}</div><div class="stat-value" style="color:${survPct>=90?'#8FC79E':survPct>=70?'#C9A455':'#E8977A'}">${survPct}%</div><div class="stat-sub">${mc.failCount} of ${mc.n} paths ran out${mc.medianRuinYear?`, typically by year ${mc.medianRuinYear}`:''}</div></div>
    <div class="stat"><div class="stat-label">P10 ending balance${infoIcon('9 in 10 simulated paths ended with at least this much left over. A reasonable worst-case planning floor for the drawdown phase.')}</div><div class="stat-value" style="color:#E8977A">${c.compact(mc.p10)}</div></div>
    <div class="stat"><div class="stat-label">P50 ending balance${infoIcon('The median simulated path: half ended with more left over than this, half with less.')}</div><div class="stat-value">${c.compact(mc.p50)}</div></div>
  </div>
  <div class="cap" style="margin-top:10px">Fan of 1,000 simulated drawdown paths, seed ${r.ddSeed}</div>
  ${fanChart(mc.yearBands)}`;
  lastDDMCHtml=html;
  return html;
}
function scheduleDDMCUpdate(delay){
  if(ddmcTimer) clearTimeout(ddmcTimer);
  ddmcTimer=setTimeout(()=>{
    ddmcTimer=null;
    const body=document.getElementById('ret-ddmc-body');
    if(body){ body.innerHTML=renderDDMCBody(calcRetLab()); }
  }, delay===undefined?150:delay);
}

function snapshotCompareNote(){
  const [a,b] = L.snapshots;
  if(a.currency.code !== b.currency.code) return 'These two snapshots use different countries, so the corpus figures are not directly comparable in one currency.';
  const diff = b.corpus - a.corpus;
  const pct = a.corpus !== 0 ? (diff/a.corpus*100) : 0;
  return `${b.label} needs ${a.currency.compact(Math.abs(diff))} ${diff>=0?'more':'less'} than ${a.label} (${diff>=0?'+':''}${pct.toFixed(1)}%).`;
}

function renderStepUp(){
  const c=cfg(), s=L.step;
  const mRate=effectiveMonthlyRate(s.preRate/100);
  const mStep=effectiveMonthlyRate(s.stepUpPct/100);
  const flatSip=solveSIP(mRate, s.years*12, s.corpus, true);

  const flatAcc=accumulationSchedule({sip:flatSip, rate:mRate, periods:s.years*12, due:true}).rows;
  const stepAcc=accumulationSchedule({sip:steppedSip, rate:mRate, periods:s.years*12, due:true, stepUp:mStep}).rows;

    <div class="stat-row">
      <div class="stat"><div class="stat-label">Flat SIP (fixed forever)${infoIcon('One unchanging monthly amount from the first month to the last. Simple, but it front-loads the burden into your lowest-earning years.')}</div><div class="stat-value">${c.fmt(Math.round(flatSip))}</div></div>
      <div class="stat"><div class="stat-label">Step-up SIP (starting)${infoIcon('The first-year monthly amount. It then rises by the step-up rate each year, reaching the same target by paying more in later, higher-income years.')}</div><div class="stat-value">${c.fmt(Math.round(steppedSip))}</div></div>

function smoothPath(points, xFn, yFn){
  // Catmull-Rom to cubic-bezier conversion for a smooth curve through the frontier points
  if(points.length<3) return points.map((p,i)=>(i===0?'M':'L')+xFn(p.vol).toFixed(1)+','+yFn(p.ret).toFixed(1)).join(' ');
  const pts=points.map(p=>[xFn(p.vol), yFn(p.ret)]);
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function frontierChart(cloud, frontier, assetPoints, currentPoint, w, h){
  if(w===undefined)w=640; if(h===undefined)h=400;
  const pL=54, pR=18, pT=20, pB=44;
  const allX=[...cloud.map(p=>p.vol),...assetPoints.map(p=>p.vol),currentPoint.vol];
  const allY=[...cloud.map(p=>p.ret),...assetPoints.map(p=>p.ret),currentPoint.ret];
  const maxX=Math.max(...allX)*1.08, minX=0;
  const maxY=Math.max(...allY)*1.1, minY=Math.min(0,Math.min(...allY)*0.9);
  const x=v=>pL+((v-minX)/(maxX-minX))*(w-pL-pR);
  const y=v=>h-pB-((v-minY)/(maxY-minY))*(h-pT-pB);

  let grid='';
  for(let i=0;i<=4;i++){
    const gx=pL+i*(w-pL-pR)/4, vx=minX+i*(maxX-minX)/4;
    grid+=`<line x1="${gx.toFixed(1)}" y1="${pT}" x2="${gx.toFixed(1)}" y2="${h-pB}" stroke="rgba(241,238,227,.05)" stroke-width="1"/>`;
    grid+=`<text x="${gx.toFixed(1)}" y="${h-pB+18}" fill="rgba(241,238,227,.42)" font-size="10" font-family="'Spline Sans Mono',monospace" text-anchor="middle">${(vx*100).toFixed(0)}%</text>`;
    const gy=h-pB-i*(h-pT-pB)/4, vy=minY+i*(maxY-minY)/4;
    grid+=`<line x1="${pL}" y1="${gy.toFixed(1)}" x2="${w-pR}" y2="${gy.toFixed(1)}" stroke="rgba(241,238,227,.05)" stroke-width="1"/>`;
    grid+=`<text x="${pL-9}" y="${(gy+3).toFixed(1)}" fill="rgba(241,238,227,.42)" font-size="10" font-family="'Spline Sans Mono',monospace" text-anchor="end">${(vy*100).toFixed(0)}%</text>`;
  }
  grid+=`<text x="${(pL+(w-pL-pR)/2).toFixed(1)}" y="${h-6}" fill="rgba(241,238,227,.5)" font-size="10.5" font-family="'Spline Sans Mono',monospace" text-anchor="middle">RISK: how much this bounces around, per year</text>`;
  grid+=`<text x="15" y="${(pT+(h-pT-pB)/2).toFixed(1)}" fill="rgba(241,238,227,.5)" font-size="10.5" font-family="'Spline Sans Mono',monospace" text-anchor="middle" transform="rotate(-90,15,${(pT+(h-pT-pB)/2).toFixed(1)})">RETURN: what you'd expect to earn</text>`;

  // Cloud: faded, small, so it reads as a soft field rather than competing with the frontier
  const dots=cloud.map(p=>`<circle cx="${x(p.vol).toFixed(1)}" cy="${y(p.ret).toFixed(1)}" r="1.3" fill="rgba(201,164,85,.10)"/>`).join('');

  const frontierD=smoothPath(frontier, x, y);
  const lastFx=x(frontier[frontier.length-1].vol).toFixed(1);
  const firstFx=x(frontier[0].vol).toFixed(1);
  const fillD=frontierD+` L${lastFx},${(h-pB).toFixed(1)} L${firstFx},${(h-pB).toFixed(1)} Z`;

  // Hoverable frontier markers — sparse (every ~4th point) so they don't clutter the curve
  const hoverPts=frontier.filter((_,i)=>i%4===0 || i===frontier.length-1);
  const frontierHovers=hoverPts.map(p=>
    `<circle class="fx-hover-target" cx="${x(p.vol).toFixed(1)}" cy="${y(p.ret).toFixed(1)}" r="9" fill="transparent"
      data-tip-ret="${(p.ret*100).toFixed(2)}%" data-tip-vol="${(p.vol*100).toFixed(2)}%" data-tip-label="On the frontier"/>`
  ).join('');

  const assetDots=assetPoints.map(p=>
    `<circle class="fx-hover-target" cx="${x(p.vol).toFixed(1)}" cy="${y(p.ret).toFixed(1)}" r="4" fill="#8FC79E" stroke="#1C3A2D" stroke-width="1"
      data-tip-ret="${(p.ret*100).toFixed(2)}%" data-tip-vol="${(p.vol*100).toFixed(2)}%" data-tip-label="${p.fullLabel||p.label}"/>
     <text x="${x(p.vol).toFixed(1)}" y="${(y(p.ret)-9).toFixed(1)}" fill="rgba(241,238,227,.6)" font-size="9" font-family="'Spline Sans Mono',monospace" text-anchor="middle" pointer-events="none">${p.label}</text>`
  ).join('');

  const curX=x(currentPoint.vol).toFixed(1), curY=y(currentPoint.ret).toFixed(1);
  const currentMarker=`<circle cx="${curX}" cy="${curY}" r="8" fill="none" stroke="#F1EEE3" stroke-width="2"/>
    <circle class="fx-hover-target" cx="${curX}" cy="${curY}" r="10" fill="#F1EEE3" fill-opacity="0"
      data-tip-ret="${(currentPoint.ret*100).toFixed(2)}%" data-tip-vol="${(currentPoint.vol*100).toFixed(2)}%" data-tip-label="Your current mix"/>
    <circle cx="${curX}" cy="${curY}" r="3" fill="#F1EEE3" pointer-events="none"/>`;

  // Gap to frontier: interpolate the frontier's return at the same risk
  // level as the current mix, and show the difference if it's meaningful.
  let gapAnnotation = '';
  let gapPct = null;
  for(let i=0;i<frontier.length-1;i++){
    const a=frontier[i], b=frontier[i+1];
    if(currentPoint.vol>=a.vol && currentPoint.vol<=b.vol){
      const t=(b.vol-a.vol)>1e-9 ? (currentPoint.vol-a.vol)/(b.vol-a.vol) : 0;
      const frontierRetHere = a.ret + t*(b.ret-a.ret);
      gapPct = frontierRetHere - currentPoint.ret;
      if(gapPct > 0.0015){
        const fy=y(frontierRetHere).toFixed(1);
        gapAnnotation = `<line x1="${curX}" y1="${curY}" x2="${curX}" y2="${fy}" stroke="#F1EEE3" stroke-width="1.5" stroke-dasharray="3,3" opacity=".6"/>
          <text x="${(parseFloat(curX)+8).toFixed(1)}" y="${((parseFloat(curY)+parseFloat(fy))/2+3).toFixed(1)}" fill="#F1EEE3" font-size="10" font-family="'Spline Sans Mono',monospace" opacity=".85">+${(gapPct*100).toFixed(1)}% possible</text>`;
      }
      break;
    }
  }

  return `<div class="fx-chart-wrap">${svgOpen(w,h)}
    <defs><linearGradient id="frontierFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A455" stop-opacity=".28"/><stop offset="100%" stop-color="#C9A455" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${dots}
    <path d="${fillD}" fill="url(#frontierFill)"/>
    <path d="${frontierD}" fill="none" stroke="#C9A455" stroke-width="2.25" stroke-linecap="round"/>
    ${gapAnnotation}${frontierHovers}${assetDots}${currentMarker}
    </svg>
    <div class="fx-legend">
      <span><i style="background:#C9A455"></i>The frontier: the best return possible at each risk level</span>
      <span><i style="background:#8FC79E;border-radius:50%"></i>A single building block on its own</span>
      <span><i style="border:2px solid #F1EEE3;background:transparent"></i>Your current mix</span>
      <span><i style="border-top:2px dashed rgba(241,238,227,.7);background:transparent"></i>Return you're leaving on the table at this risk level</span>
    </div>
    <div class="fx-tooltip" id="fxTooltip"></div>
  </div>`;
}

function fanChart(yearBands, w, h){
  if(w===undefined)w=760; if(h===undefined)h=240;
  const p=6;
  const maxV=Math.max(...yearBands.map(b=>b.p90));
  const n=yearBands.length, sx=(w-p*2)/(n-1||1);
  const y=v=>h-p-(Math.max(0,v)/maxV)*(h-p*2);
  function pathFor(key){let pts='M'+p+','+y(yearBands[0][key]).toFixed(1);yearBands.forEach((b,i)=>pts+=' L'+(p+i*sx).toFixed(1)+','+y(b[key]).toFixed(1));return pts;}
  function bandFor(lo,hi){
    let pts='M'+p+','+y(yearBands[0][lo]).toFixed(1);
    yearBands.forEach((b,i)=>pts+=' L'+(p+i*sx).toFixed(1)+','+y(b[lo]).toFixed(1));
    for(let i=n-1;i>=0;i--) pts+=' L'+(p+i*sx).toFixed(1)+','+y(yearBands[i][hi]).toFixed(1);
    return pts+' Z';
  }
  return svgOpen(w,h)+
    `<path d="${bandFor('p10','p90')}" fill="rgba(201,164,85,.12)"/>
    <path d="${bandFor('p25','p75')}" fill="rgba(201,164,85,.22)"/>
    <path d="${pathFor('p50')}" fill="none" stroke="#C9A455" stroke-width="2"/>
    </svg>`;
}

function renderJoint(){

  const infl=j.eduInflation/100, preR=j.preRate/100, parkR=j.parkRate/100;

  const opts={children:j.children, eduInflation:infl, preRate:preR, parkRate:parkR, sipStopYear, horizon};
  const joint=solveJointEducationCorpus(opts);
  const separate=separateCorporaTotal({children:j.children, eduInflation:infl, preRate:preR, parkRate:parkR});
  const saved=separate-joint.sip;

  const timelineRows=joint.rows;
  const maxBal=Math.max(...timelineRows.map(r=>r.close), 1);
  const w=760,h=160,p=6,n=timelineRows.length,sx=(w-p*2)/(n-1||1);

  timelineRows.forEach((r,i)=>pts+=' L'+(p+i*sx).toFixed(1)+','+y(r.close).toFixed(1));

  const timelineChart = svgOpen(w,h)+
    `<defs><linearGradient id="jg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C9A455" stop-opacity=".55"/><stop offset="100%" stop-color="#C9A455" stop-opacity=".05"/></linearGradient></defs>
    <path d="${pts} L${lx},${h} L${p},${h} Z" fill="url(#jg)"/>
    <path d="${pts}" fill="none" stroke="#C9A455" stroke-width="1.75"/>

  const childRows = j.children.map((ch,i)=>{
    if(j.editingChild===i){
      return `<div class="goal-row" style="padding:12px 14px;background:rgba(201,164,85,.08);border:1px solid rgba(201,164,85,.35);border-radius:10px;margin-bottom:8px">
        <div class="mono" style="font-size:9.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px">Editing child ${i+1}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
          <label style="font-size:10px;color:var(--dim)">Fee today/yr<br><input type="number" class="field-num" id="editFee" value="${ch.annualFeeToday}" style="width:96px;margin-top:4px"></label>
          <label style="font-size:10px;color:var(--dim)">College in, yrs<br><input type="number" class="field-num" id="editStart" value="${ch.yearsToStart}" style="width:64px;margin-top:4px"></label>
          <label style="font-size:10px;color:var(--dim)">Course, yrs<br><input type="number" class="field-num" id="editDur" value="${ch.duration}" style="width:56px;margin-top:4px"></label>
        </div>
        <div class="inline-error" id="editChildErr" style="font-size:11px;color:#E8977A;margin-bottom:8px"></div>
        <div style="display:flex;gap:8px">
          <button data-save-child="${i}" style="flex:1;background:rgba(201,164,85,.18);border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:7px;font-size:11.5px;cursor:pointer">Save</button>
          <button data-cancel-child style="flex:1;background:transparent;border:1px solid rgba(241,238,227,.2);color:rgba(241,238,227,.5);border-radius:6px;padding:7px;font-size:11.5px;cursor:pointer">Cancel</button>
        </div>
      </div>`;
    }
    return `<div class="goal-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(241,238,227,.05);border-radius:10px;margin-bottom:8px">
      <div>
        <div style="font-family:'Newsreader',serif;font-size:14px">Child ${i+1}</div>
        <div class="mono" style="font-size:10.5px;color:var(--dim)">${c.compact(ch.annualFeeToday)}/yr fee · college in ${ch.yearsToStart}yr · ${ch.duration}yr course</div>
      </div>
      <div style="display:flex;gap:6px">
        <button data-edit-child="${i}" style="background:transparent;border:1px solid rgba(241,238,227,.2);color:rgba(241,238,227,.5);border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer">edit</button>
        ${j.children.length>1?`<button data-remove-child="${i}" style="background:transparent;border:1px solid rgba(241,238,227,.2);color:rgba(241,238,227,.5);border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer">remove</button>`:''}
      </div>
    </div>`;
  }).join('');

  return `<div class="grid">
  <div class="panel">
    <h3>Joint children's corpus</h3>
    <div class="section-label">Children (up to 3)</div>
    ${childRows}
    ${j.children.length<3?`<button id="addChildBtn" style="width:100%;background:rgba(241,238,227,.06);border:1.5px dashed rgba(241,238,227,.2);border-radius:10px;padding:12px;color:rgba(241,238,227,.55);cursor:pointer;font-size:13px;margin-bottom:16px">+ Add a child</button>`:''}
    <hr class="divider">
    <div class="field"><label>Education inflation <b>${j.eduInflation}%</b></label><input type="range" min="4" max="16" step="0.5" value="${j.eduInflation}" data-k="eduInflation" data-tab="joint"></div>
    <div class="field"><label>Growth while saving <b>${j.preRate}%</b></label><input type="range" min="4" max="16" step="0.1" value="${j.preRate}" data-k="preRate" data-tab="joint"></div>
    <div class="field"><label>Parking rate near/during college${infoIcon('Once the first child is within a year of starting college, the whole pot moves out of growth assets into safer holdings. This is the return assumed on that safer parking, typically a liquid or short-duration debt rate.')} <b>${j.parkRate}%</b></label><input type="range" min="3" max="10" step="0.1" value="${j.parkRate}" data-k="parkRate" data-tab="joint"></div>

  </div>
  <div class="output">
    <div class="stat-row">
      <div class="stat"><div class="stat-label">Joint corpus SIP</div><div class="stat-value">${c.fmt(Math.round(joint.sip))}</div><div class="stat-sub">/yr, one pot</div></div>
      <div class="stat"><div class="stat-label">Separate corpora would need</div><div class="stat-value">${c.fmt(Math.round(separate))}</div><div class="stat-sub">/yr, per-child silos</div></div>
      <div class="stat"><div class="stat-label">Saved by clubbing${infoIcon('One shared pot lets the gap years between children keep compounding instead of sitting idle in separate silos, so the required yearly saving falls versus running one corpus per child.')}</div><div class="stat-value" style="color:#8FC79E">${c.fmt(Math.round(saved))}</div><div class="stat-sub">/yr</div></div>
    </div>
    <div class="card">
      <h4>Corpus timeline: tightest point${infoIcon('The year the balance comes closest to zero across the whole saving-and-spending timeline. The solver guarantees it never actually dips below zero at any point, not just at the end.')} is year ${joint.minYear}</h4>
      <div class="cap">${Math.abs(joint.minBal)<1000 ? 'Solved so the balance touches exactly zero at its tightest point, never negative.' : 'Balance across the full saving-and-spending timeline.'}</div>
      ${timelineChart}
    </div>
    <div class="card">
      <h4>Why this differs from two separate corpora</h4>
      <div class="gr-note" style="margin-top:0">
      Gap years between children compound untouched instead of sitting idle in two silos. Overlap years (both children in college at once) are the real stress test. The solver checks the balance never goes negative at <b style="color:var(--paper)">any</b> point in the timeline, not just at the end. The tightest year here is year ${joint.minYear}${joint.minYear<horizon?', mid-timeline, not the last year':''}, which a solver that only targets a zero terminal balance would have missed entirely.
      </div>
    </div>
  </div>
  </div>`;
}

   ===================================================================== */
function renderMC(){
  const c=cfg(), m=L.mc;
  const regime=REGIME_PRESETS[m.regime];
  const meanReturn=(m.meanReturn/100)*regime.meanAdj;
  const volatility=(m.volatility/100)*regime.volAdj;
  const res=monteCarloAccumulation({sip:m.sip, meanReturn, volatility, years:m.years, due:true, seed:m.seed, n:1000});

  // Twin fates: bull vs bear side by side (C-07)
  const bull=monteCarloAccumulation({sip:m.sip, meanReturn:(m.meanReturn/100)*REGIME_PRESETS.bull.meanAdj, volatility:(m.volatility/100)*REGIME_PRESETS.bull.volAdj, years:m.years, due:true, seed:m.seed, n:1000});
  const bear=monteCarloAccumulation({sip:m.sip, meanReturn:(m.meanReturn/100)*REGIME_PRESETS.bear.meanAdj, volatility:(m.volatility/100)*REGIME_PRESETS.bear.volAdj, years:m.years, due:true, seed:m.seed, n:1000});

  return `<div class="grid">
  <div class="panel">
    <h3>Monte Carlo: 1,000 simulated paths</h3>
    <div class="field"><label>Annual contribution <b data-mc-label="sip">${c.fmt(m.sip)}</b></label><input type="range" min="10000" max="1000000" step="10000" value="${m.sip}" data-k="sip" data-tab="mc"></div>
    <div class="field"><label>Years <b data-mc-label="years">${m.years}</b></label><input type="range" min="5" max="35" value="${m.years}" data-k="years" data-tab="mc"></div>
    <div class="field"><label>Expected return <b data-mc-label="meanReturn">${m.meanReturn}%</b></label><input type="range" min="4" max="16" step="0.1" value="${m.meanReturn}" data-k="meanReturn" data-tab="mc"></div>
    <div class="field"><label>Volatility (std dev)${infoIcon('The standard deviation of yearly returns: how widely each simulated year swings around the average. Around 15% is typical for a diversified equity fund. At 0% every path is identical and the fan collapses to one deterministic line.')} <b data-mc-label="volatility">${m.volatility}%</b></label><input type="range" min="0" max="30" value="${m.volatility}" data-k="volatility" data-tab="mc"></div>
    <hr class="divider">
    <div class="section-label">Regime preset${infoIcon('Presets that scale the average return and the volatility together, to mimic a sustained bull market, normal conditions, or an extended slump. A shorthand for asking: what if the whole era is kinder or harsher than expected?')}</div>
    <div class="toggle-row">
      ${Object.entries(REGIME_PRESETS).map(([id,r])=>`<button class="tglbtn${m.regime===id?' active':''}" data-toggle="regime" data-val="${id}">${r.label}</button>`).join('')}
    </div>
    <div class="gr-note">${regime.note}. Seed ${m.seed}.${infoIcon('A seed pins down the random number generator, so the same 1,000 paths are reproduced exactly every time. Change the seed to draw a different, equally valid set of simulated futures.')} The same seed always reproduces the identical 1,000 paths, so this isn't randomly different every time you look at it.</div>
    <button id="reseedBtn" style="width:100%;margin-top:10px;background:transparent;border:1px solid rgba(241,238,227,.18);color:rgba(241,238,227,.6);border-radius:8px;padding:9px;font-size:12px;cursor:pointer">Try a different seed</button>
  </div>
  <div class="output">
    <div class="stat-row">
      <div class="stat"><div class="stat-label">Median outcome (P50)${infoIcon('The middle result of 1,000 simulated futures: half ended above this figure, half below. A more honest central estimate than a single deterministic number.')}</div><div class="stat-value">${c.compact(res.p50)}</div></div>
      <div class="stat"><div class="stat-label">Worst-case band (P10)${infoIcon('9 in 10 simulated futures ended above this line. Treat it as a planning floor, not the absolute worst case, since real markets can do worse than any simulation.')}</div><div class="stat-value" style="color:#E8977A">${c.compact(res.p10)}</div></div>
      <div class="stat"><div class="stat-label">Best-case band (P90)${infoIcon('Only 1 in 10 simulated futures ended above this line. Enjoy it if it happens, but never build the plan on it.')}</div><div class="stat-value" style="color:#8FC79E">${c.compact(res.p90)}</div></div>
    </div>
    <div class="card">
      <h4>Fan chart: the range of outcomes, not just one number</h4>
      <div class="cap">Gold line = median · dark band = 25th-75th percentile · light band = 10th-90th percentile</div>
      ${fanChart(res.yearBands)}
    </div>
    <div class="card">
      <h4>Twin fates: same plan, two futures</h4>
      <div class="cap">Same contribution, same years. Only the regime differs</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px">
        <div>
          <div class="mono" style="font-size:11px;color:#8FC79E;margin-bottom:6px">BULL RUN → ${c.compact(bull.p50)}</div>
          ${fanChart(bull.yearBands, 360, 150)}
        </div>
        <div>
          <div class="mono" style="font-size:11px;color:#E8977A;margin-bottom:6px">EXTENDED SLUMP → ${c.compact(bear.p50)}</div>
          ${fanChart(bear.yearBands, 360, 150)}
        </div>
      </div>
    </div>
    <div class="gr-note">Set volatility to 0% to check this collapses to a single deterministic line. Every percentile becomes identical, proving the doors and the Lab share one engine even under simulation.</div>
  </div>
  </div>`;
}

  cash:'Cash & short-term', bond:'Bonds', retirement:'Retirement accounts', education:'Education',

function instrumentCardsHTML(){

  const catKeys=Object.keys(li).filter(k=>!['sourceDoc','crossCheckedAsOf','granular'].includes(k));
  const activeCats = L.instCategory==='all' ? catKeys : [L.instCategory];

const PORT_CLUSTER_LABELS={growth:'Growth equity',income:'Income-oriented equity',debt:'Debt',hybrid:'Hybrid',gold:'Precious metals',intl:'International',alt:'Real assets'};

function riskCompositionBar(decomp, concentratedDecomp, w, h){
  if(w===undefined)w=620; if(h===undefined)h=76;
  const barH=30, barY=14, pL=4, pR=4;
  const barW=w-pL-pR;
  const sysW=decomp.systematicPct*barW;
  const unsysW=decomp.unsystematicPct*barW;
  const markerX=pL+concentratedDecomp.unsystematicPct*barW; // where 100%-in-top-holding would sit, for reference

  return svgOpen(w,h)+
    `<defs>
      <linearGradient id="sysGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8FC79E"/><stop offset="100%" stop-color="#5FA875"/></linearGradient>
      <linearGradient id="unsysGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E8977A"/><stop offset="100%" stop-color="#D97757"/></linearGradient>
    </defs>
    <rect x="${pL}" y="${barY}" width="${barW.toFixed(1)}" height="${barH}" rx="3" fill="rgba(241,238,227,.06)"/>
    <rect x="${pL}" y="${barY}" width="${sysW.toFixed(1)}" height="${barH}" rx="3" fill="url(#sysGrad)"/>
    <rect x="${(pL+sysW).toFixed(1)}" y="${barY}" width="${unsysW.toFixed(1)}" height="${barH}" fill="url(#unsysGrad)" rx="3"/>
    ${decomp.systematicPct>0.14?`<text x="${(pL+sysW/2).toFixed(1)}" y="${barY+barH/2+4}" fill="#12261C" font-size="12" font-weight="700" font-family="'Spline Sans Mono',monospace" text-anchor="middle">${(decomp.systematicPct*100).toFixed(0)}%</text>`:''}
    ${decomp.unsystematicPct>0.10?`<text x="${(pL+sysW+unsysW/2).toFixed(1)}" y="${barY+barH/2+4}" fill="#12261C" font-size="12" font-weight="700" font-family="'Spline Sans Mono',monospace" text-anchor="middle">${(decomp.unsystematicPct*100).toFixed(0)}%</text>`:''}
    <line x1="${markerX.toFixed(1)}" y1="${barY-6}" x2="${markerX.toFixed(1)}" y2="${barY+barH+6}" stroke="#F1EEE3" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="${markerX.toFixed(1)}" y="${barY+barH+20}" fill="rgba(241,238,227,.55)" font-size="9" font-family="'Spline Sans Mono',monospace" text-anchor="middle">if 100% in your biggest holding</text>
    </svg>`;
}

function computePortfolioDerived(assets, corr){
  const rawW = L.portfolio.weights;
  const w = normalizeWeights(rawW);
  const returns = assets.map(a=>a.ret), vols = assets.map(a=>a.vol);
  const marketIdx = 0;
  const portRet = portfolioReturn(w, returns);
  const decomp = decomposeRisk(w, vols, corr, marketIdx);
  const topIdx = w.indexOf(Math.max(...w));
  const concRet = returns[topIdx], concVol = vols[topIdx];
  const volSaved = concVol - decomp.totalVol;
  const retGiven = concRet - portRet;
  const concentratedW = assets.map((_,i)=>i===topIdx?1:0);
  const concentratedDecomp = decomposeRisk(concentratedW, vols, corr, marketIdx);
  return { w, rawW, returns, vols, marketIdx, portRet, decomp, topIdx, concRet, concVol, volSaved, retGiven, concentratedDecomp };
}

function pfInflation(){
  // Lazy default per country until the person touches the slider,
  // so a country switch keeps a sensible starting assumption.
  if(L.portfolio.inflation!=null) return L.portfolio.inflation;
  return L.country==='IN' ? 6 : 2.5;
}
function portfolioStatsHTML(d){
  const inf=pfInflation()/100;
  const real=realRate(d.portRet, inf);
  return `<div class="stat"><div class="stat-label">Expected return${infoIcon('The average yearly gain this mix would be expected to produce over the long run, based on the illustrative return assumptions for each building block. This is the nominal figure, before inflation.')}</div><div class="stat-value">${(d.portRet*100).toFixed(2)}%</div></div>
  <div class="stat"><div class="stat-label">After ${pfInflation()}% inflation${infoIcon('The real return: what this mix earns in purchasing power once inflation is stripped out, using the exact Fisher relation rather than a simple subtraction. This is the rate your money actually grows in terms of what it can buy.')}</div><div class="stat-value" style="color:${real>0?'#8FC79E':'#E8977A'}">${(real*100).toFixed(2)}%</div><div class="stat-sub">${real>0?'growing in real terms':'losing purchasing power'}</div></div>
  <div class="stat"><div class="stat-label">Risk${infoIcon('How much the portfolio\'s value tends to bounce around year to year. Higher means bigger swings, both up and down, not just bigger losses.')}</div><div class="stat-value">${(d.decomp.totalVol*100).toFixed(2)}%</div></div>
  <div class="stat"><div class="stat-label">Beta${infoIcon('How much your portfolio moves when the overall market moves. 1.0 = moves with the market. Above 1.0 = bigger swings than the market. Below 1.0 = smaller swings. Near zero or negative = little relationship, sometimes moves the opposite way. Computed directly from the correlation structure, not a rough estimate.')}</div><div class="stat-value">${d.decomp.beta.toFixed(2)}</div><div class="stat-sub">${d.decomp.beta>1?'more volatile than the market':d.decomp.beta<1&&d.decomp.beta>0?'less volatile than the market':d.decomp.beta<=0?'moves opposite to / independent of the market':''}</div></div>`;
}

function portfolioRiskBarHTML(d){
  return `${riskCompositionBar(d.decomp, d.concentratedDecomp)}
  <div class="risk-comp-legend">
    <span><i style="background:#5FA875"></i>Systematic ${(d.decomp.systematicPct*100).toFixed(0)}% (${(d.decomp.systematicVol*100).toFixed(1)}% volatility): the market-wide risk you can't remove</span>
    <span><i style="background:#D97757"></i>Unsystematic ${(d.decomp.unsystematicPct*100).toFixed(0)}% (${(d.decomp.unsystematicVol*100).toFixed(1)}% volatility): specific to your mix, this is what diversifying reduces</span>
  </div>`;
}

function portfolioDiversifyHTML(d, assets){
  return `Your biggest single position is <b style="color:var(--paper)">${assets[d.topIdx].name}</b>. Holding <i>only</i> that would give ${(d.concRet*100).toFixed(1)}% return at ${(d.concVol*100).toFixed(1)}% risk, with <b style="color:var(--paper)">${(d.concentratedDecomp.unsystematicPct*100).toFixed(0)}%</b> of that risk being pure unsystematic, single-holding risk.
  Your actual mix gives up <b style="color:var(--paper)">${(d.retGiven*100).toFixed(1)} percentage points</b> of return
  in exchange for <b style="color:${d.volSaved>0?'#8FC79E':'#E8977A'}">${d.volSaved>=0?(d.volSaved*100).toFixed(1)+' points less':(-d.volSaved*100).toFixed(1)+' points more'}</b> risk, and cuts unsystematic risk's share from ${(d.concentratedDecomp.unsystematicPct*100).toFixed(0)}% down to ${(d.decomp.unsystematicPct*100).toFixed(0)}%.
  ${d.volSaved>0 && d.retGiven < d.volSaved ? "That's the diversification trade working in your favour: you gave up less return than the risk you removed." : ''}
  This is <span class="term" data-def="Risk that comes from a specific holding or sector: a single company having a bad year, a single sector falling out of favour. Spreading across uncorrelated assets reduces or removes it.">unsystematic risk</span> being diversified away. It's the one kind of investment risk that's genuinely free to reduce: no expected return needs to be sacrificed to do it, only to eliminate the LAST bit of it entirely gets expensive.`;
}

function portfolioBetaTextHTML(d, assets){
  return `<span class="term" data-def="A measure of how much an asset or portfolio moves relative to the overall market. Beta 1.0 = moves with the market. Above 1.0 = bigger swings. Below 1.0 = smaller swings. Near 0 or negative = little to no relationship, sometimes moves the opposite way.">Beta</span> of <b style="color:var(--gold)">${d.decomp.beta.toFixed(2)}</b> means: if the broad market moves 10% in a year, your portfolio has historically tended to move roughly ${(d.decomp.beta*10).toFixed(1)}% in the same direction, all else equal.
  This is <span class="term" data-def="Risk from the market as a whole: recessions, rate changes, broad sentiment shifts. Every asset with meaningful equity exposure carries some of this. Diversification cannot remove it, only unsystematic risk.">systematic risk</span>: diversifying across these ${assets.length} building blocks does not remove it, because market-wide moves affect nearly everything at once. Lowering beta means deliberately holding more of the low-beta assets above (debt, gold), which is a different lever from diversification.`;
}

function portfolioChartHTML(d, assets, corr){
  const {cloud, frontier} = generateFrontier(d.returns, d.vols, corr, 3000, L.portfolio.seed);
  const assetPoints = assets.map((a,i)=>({vol:a.vol, ret:a.ret, label:a.name.split(' ')[0], fullLabel:a.name}));
  return frontierChart(cloud, frontier, assetPoints, {vol:d.decomp.totalVol, ret:d.portRet});
}

// Called on every slider tick (input event fires continuously during a
// drag). Recomputes only the cheap, closed-form numbers — stats, the risk
// bar, and the two text cards — and patches just those DOM nodes directly.
// Crucially this never touches the sliders themselves or the frontier
// chart, so the drag gesture the browser is mid-tracking never gets its
// underlying element replaced (that was the actual cause of the stutter,
// not just raw compute time — see build notes).
function portfolioMoneyHTML(d){
  const c=cfg();
  const inf=pfInflation()/100;
  const real=realRate(d.portRet, inf);
  const base=c.code==='IN'?1000000:10000;
  const yrs=10;
  const fv=base*Math.pow(1+d.portRet,yrs);
  const realFv=base*Math.pow(1+real,yrs);
  return `<div class="gr-note" style="margin-top:0">${c.compact(base)} left in this mix for ${yrs} years grows to <b style="color:var(--paper)">${c.compact(fv)}</b> on paper. In today's purchasing power, after ${pfInflation()}% inflation, it is really worth <b style="color:${real>0?'#8FC79E':'#E8977A'}">${c.compact(realFv)}</b>. The gap between those two numbers is what inflation quietly takes, and it is why the after-inflation return above, not the headline one, is the number to judge a mix by.</div>`;
}
function updatePortfolioLive(){
  const c=cfg();

function calcHealthScore(){
  const h=L.health;
  const fundingRatio = h.capacity>0 ? Math.min(1, h.capacity/Math.max(1,h.totalSIP)) : 0;
  const funding=Math.round(fundingRatio*40);
  const emergency = h.emergencyStatus==='full'?20:h.emergencyStatus==='partial'?10:0;
  const stress = h.shockSurvives?25:5;
  const surplus = h.capacity > h.totalSIP;
  const discipline = surplus?15:5;
  return {funding, emergency, stress, discipline, total:funding+emergency+stress+discipline, fundingRatio};
}

  const c=cfg(), h=L.health, sc=calcHealthScore();
  const bands=[{max:39,label:'Needs attention',color:'#A03A22'},{max:69,label:'On track, room to grow',color:'#C9A455'},{max:100,label:'Strong shape',color:'#3D7A4F'}];

    <div class="card">
      <h4>Plan Health Score${infoIcon('A 0 to 100 composite scored only from what this app can actually measure: funding 40 points, emergency cover 20, stress survival 25, discipline 15. A quick pulse check, not a full financial review.')}</h4>
