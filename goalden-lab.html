<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goalden Lab · full assumption control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Self-hosted, not a CDN: the deployed site's chart rendering should
     not depend on a third party's uptime. Apache ECharts 5.6.0. -->
<script src="vendor/echarts.min.js"></script>
<style>
:root{
  --ink:#1C3A2D;--ink2:#22402F;--paper:#F1EEE3;
  --gold:#C9A455;--red:#A03A22;--dim:#8A9389;--ok:#3D7A4F;--warn:#C9A455;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:'Figtree',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Newsreader',serif}
.mono{font-family:'Spline Sans Mono',monospace}

/* --- top nav --- */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid rgba(241,238,227,.12)}
.brand{font-family:'Newsreader',serif;font-weight:700;font-size:19px;color:var(--gold);text-decoration:none;display:inline-block}
.brand span{color:var(--paper);font-weight:400;font-style:italic;font-size:13px;margin-left:6px;opacity:.65}
/* Two very different jobs share this strip: a first-visit chooser (big,
   unmissable) and a quick tool-switcher once something is already open
   (small, out of the way). Splitting them into .is-home/.is-slim instead
   of one fixed-size bar is what actually fixes the "183px of chrome on
   every single tab" problem -- making the pills bigger again (tried once
   already, see the old comment this replaced) just moves the clutter
   around instead of removing it. */
.tabbar{background:linear-gradient(180deg,rgba(201,164,85,.09),rgba(201,164,85,.03));border-bottom:1px solid rgba(201,164,85,.25)}
.tabbar.is-home{display:none} /* the home screen itself, in #main, is the chooser */
.tabbar.is-slim{padding:10px 24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:'Spline Sans Mono',monospace;font-size:11.5px;letter-spacing:.02em;color:rgba(241,238,227,.68);background:rgba(241,238,227,.05);border:1px solid rgba(241,238,227,.16);border-radius:2px 12px 12px 12px;padding:9px 16px;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--paper);border-color:rgba(201,164,85,.5);background:rgba(241,238,227,.08)}
.tab.active{color:var(--ink);background:var(--gold);border-color:var(--gold);font-weight:600}
.slim-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.slim-back{font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(241,238,227,.6);background:transparent;border:none;cursor:pointer;flex-shrink:0;padding:4px 0}
.slim-back:hover{color:var(--gold)}
.slim-current{font-family:'Newsreader',serif;font-style:italic;font-size:14px;color:var(--gold);flex-shrink:0}
/* All 10 tools, by full name, cannot wrap here without the "slim" bar
   growing back into the multi-row block it was built to replace (this
   was measured, not assumed: 338px at 1400px wide before this fix).
   Scrolls horizontally instead, so the bar stays one line at any width. */
.tabs-slim{gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;flex:1;min-width:0}
.tabs-slim .tab{font-size:10.5px;padding:6px 12px;flex-shrink:0}
.slim-row{flex-wrap:nowrap}
.slim-back,.slim-current{flex-shrink:0}
.country-toggle{display:flex;font-family:'Spline Sans Mono',monospace;font-size:11.5px;border:1px solid rgba(241,238,227,.2);border-radius:3px}
.ctbtn{padding:6px 13px;border:none;background:transparent;color:rgba(241,238,227,.55);cursor:pointer}
.ctbtn:first-child{border-right:1px solid rgba(241,238,227,.15)}
.ctbtn.active{background:rgba(201,164,85,.15);color:var(--gold)}

/* --- Lab home: a first-visit chooser, not a permanently-docked bar.
   The 3 primary tools get real card presence (mirrors index.html's own
   .door treatment, so the Lab's front door and its own home screen speak
   the same visual language); the other 7 sit underneath, quiet but one
   click away. Returning visitors skip straight past this -- see the
   localStorage read near consumeDoor2Handoff(). --- */
.lab-home{padding:28px 4px 4px}
.lab-home-head{margin-bottom:24px}
.lab-home-head h2{font-size:27px;margin-bottom:7px}
.lab-home-head .cap{font-size:13px;color:rgba(241,238,227,.6)}
.lab-home-primary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
@media(max-width:860px){.lab-home-primary{grid-template-columns:1fr}}
.lab-tool-card{background:rgba(241,238,227,.04);border:1px solid rgba(241,238,227,.14);border-radius:3px 22px 22px 22px;padding:24px 22px;text-align:left;cursor:pointer;color:inherit;font-family:'Figtree',sans-serif;display:flex;flex-direction:column;transition:all .2s}
.lab-tool-card:hover{background:rgba(241,238,227,.07);border-color:rgba(201,164,85,.5);transform:translateY(-2px)}
.lab-tool-card:nth-child(2){border-radius:22px 3px 22px 22px}
.lab-tool-card:nth-child(3){border-radius:22px 22px 3px 22px}
.tc-icon{width:46px;height:46px;color:var(--ink);background:var(--gold);border-radius:50% 50% 50% 4px;display:flex;align-items:center;justify-content:center;padding:11px;margin-bottom:14px;box-shadow:0 5px 16px rgba(201,164,85,.25)}
.tc-icon svg{width:100%;height:100%}
.lab-tool-card h3{font-size:18px;margin-bottom:8px;color:var(--paper)}
.tc-blurb{font-size:12.5px;color:rgba(241,238,227,.6);line-height:1.55;flex:1;margin-bottom:14px}
.tc-cta{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--gold);display:flex;align-items:center;gap:5px}
.tc-cta svg{width:12px;height:12px}
.lab-home-secondary-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(201,164,85,.7);margin-bottom:10px}
.lab-home-secondary{display:flex;gap:8px;flex-wrap:wrap}

main{padding:24px 28px 60px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:340px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}

/* --- assumption panel --- */
.panel{background:rgba(241,238,227,.04);border:1px solid rgba(241,238,227,.1);border-radius:3px 20px 20px 20px;padding:24px}
.panel h3{font-size:16px;color:var(--paper);margin-bottom:16px}
.field{margin-bottom:18px}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1}
.field-num{width:64px !important;flex-shrink:0;background:rgba(241,238,227,.07);border:1px solid rgba(241,238,227,.2);border-radius:4px;padding:5px 6px;color:var(--paper);font-family:'Spline Sans Mono',monospace;font-size:11.5px;text-align:center}
.field-num::-webkit-outer-spin-button,.field-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field label{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(241,238,227,.6);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.field label b{color:var(--gold);font-weight:600}
.field input[type=range]{width:100%;accent-color:var(--gold);height:20px}
.field input[type=number]{width:100%;background:rgba(241,238,227,.06);border:1px solid rgba(241,238,227,.16);border-radius:4px;padding:9px 11px;color:var(--paper);font-family:'Spline Sans Mono',monospace;font-size:13px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle-row{display:flex;gap:1px;margin-bottom:14px;border:1px solid rgba(241,238,227,.18);border-radius:3px;overflow:hidden}
.tglbtn{flex:1;font-family:'Spline Sans Mono',monospace;font-size:10.5px;padding:9px 6px;border:none;border-right:1px solid rgba(241,238,227,.14);background:transparent;color:rgba(241,238,227,.55);cursor:pointer;text-align:center}
.tglbtn:last-child{border-right:none}
.tglbtn.active{background:rgba(201,164,85,.16);color:var(--gold);font-weight:600}
.divider{border:none;border-top:1px dashed rgba(241,238,227,.15);margin:18px 0}
.section-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}

/* --- output area --- */
.output{display:flex;flex-direction:column;gap:18px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:rgba(241,238,227,.05);border:1px solid rgba(241,238,227,.1);border-radius:3px 15px 15px 15px;padding:17px 18px}
.stat-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat-value{font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:var(--paper)}
.stat-sub{font-size:11.5px;color:rgba(241,238,227,.5);margin-top:4px}
.card{background:rgba(241,238,227,.04);border:1px solid rgba(241,238,227,.1);border-radius:2px 2px 18px 18px;padding:22px}
.card h4{font-size:15px;margin-bottom:4px;color:var(--paper)}
.card .cap{font-size:12px;color:rgba(241,238,227,.5);margin-bottom:14px}

/* --- table --- */
.dtable{width:100%;border-collapse:collapse;font-family:'Spline Sans Mono',monospace;font-size:11.5px}
.dtable th{text-align:right;padding:7px 8px;color:var(--dim);font-weight:500;border-bottom:1px solid rgba(241,238,227,.15);position:sticky;top:0;background:var(--ink)}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable td{text-align:right;padding:6px 8px;color:rgba(241,238,227,.75);border-bottom:1px solid rgba(241,238,227,.06)}
.dtable tr.shock td{background:rgba(160,58,34,.18);color:#F0C4B4}
.dtable tr.negative td{color:#E8977A}
.table-scroll{max-height:340px;overflow-y:auto;border-radius:10px}

/* --- episode chips --- */
.episode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.inst-header{margin-bottom:20px}
.inst-source{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);margin-top:10px}
.inst-cat-block{margin-bottom:26px}
.inst-cat-head{font-family:'Newsreader',serif;font-size:17px;color:var(--paper);margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.inst-cat-count{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);font-weight:400}
.lab-inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lab-inst-card{background:rgba(241,238,227,.04);border:1px solid rgba(241,238,227,.1);border-radius:3px 12px 12px 12px;padding:13px 14px}
.lab-inst-name{font-family:'Newsreader',serif;font-size:14px;color:var(--paper);line-height:1.3;margin-bottom:4px}
.lab-inst-rate{font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--gold);margin-bottom:6px}
.lab-inst-note{font-size:11.5px;color:rgba(241,238,227,.55);line-height:1.5}
.lab-inst-flag{display:inline-block;font-family:'Spline Sans Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;margin-bottom:6px}
.lab-inst-card.flag-avoid{border-color:rgba(160,58,34,.4)}
.lab-inst-card.flag-avoid .lab-inst-flag{background:rgba(160,58,34,.2);color:#F0C4B4}
.lab-inst-card.flag-legacy{border-color:rgba(241,238,227,.15);opacity:.75}
.lab-inst-card.flag-legacy .lab-inst-flag{background:rgba(241,238,227,.08);color:rgba(241,238,227,.6)}
.lab-inst-card.flag-check .lab-inst-flag{background:rgba(201,164,85,.18);color:var(--gold)}

/* --- efficient frontier chart --- */
.fx-chart-wrap{position:relative}
.echart{width:100%}
.fx-legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:11px;color:rgba(241,238,227,.55)}
.fx-legend span{display:flex;align-items:center;gap:6px}
.fx-legend i{display:inline-block;width:16px;height:3px;flex-shrink:0}
.risk-comp-legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:11.5px;color:rgba(241,238,227,.6);line-height:1.5}
/* Risk contribution rows */
/* Reusable open/close explainer, same mechanic as the toggles used
   elsewhere in this project (max-height transition + an .open class),
   wired ONCE via delegation below rather than per-instance, so it works
   for every current and future explain-toggle without extra JS. */
/* Made deliberately button-like, not just underlined text: a filled
   pill with a real border and a circular +/- badge, so the affordance to
   click reads clearly on its own, without relying on color or a caption
   to explain it. */
.explain-toggle{display:inline-flex;align-items:center;gap:7px;font-family:'Figtree',sans-serif;font-size:12px;font-weight:600;color:var(--gold);background:rgba(201,164,85,.1);border:1px solid rgba(201,164,85,.4);border-radius:3px 12px 12px 12px;padding:7px 13px 7px 10px;margin:10px 0 2px;cursor:pointer;user-select:none;transition:background .15s ease,border-color .15s ease}
.explain-toggle:hover{background:rgba(201,164,85,.18);border-color:rgba(201,164,85,.6)}
.explain-toggle .explain-chevron{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;flex-shrink:0;line-height:1}
.explain-toggle .explain-chevron:before{content:"+"}
.explain-toggle.open .explain-chevron:before{content:"\2212"}
.explain-toggle.open{background:rgba(201,164,85,.18)}
.explain-panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
.explain-panel.open{max-height:600px}
/* Same collapsible mechanism, reused for panels that hold real controls
   or several bundled cards rather than a paragraph of prose (portfolio
   cluster accordions, the "go deeper" bundles below) -- these can run
   well past 600px of real content. */
.explain-panel.open.tall{max-height:3200px}
.explain-panel-inner{font-size:12px;color:rgba(241,238,227,.68);line-height:1.6;padding:8px 2px 4px}
/* Cluster accordions and "go deeper" bundles hold real controls and
   nested .card blocks, not prose, so they get the app's normal type
   sizes and spacing back rather than the small prose defaults above. */
.explain-panel-inner.controls{font-size:inherit;color:inherit;line-height:inherit;padding-top:14px}
.explain-panel-inner.controls .card + .card{margin-top:12px}

/* --- portfolio: preset mixes + cluster accordion headers --- */
.pf-preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.pf-preset-btn{font-family:'Spline Sans Mono',monospace;font-size:10.5px;padding:9px 4px;border-radius:2px 10px 10px 10px;border:1px solid rgba(241,238,227,.16);background:rgba(241,238,227,.04);color:rgba(241,238,227,.75);cursor:pointer;text-align:center;border-left-width:3px;transition:all .15s}
.pf-preset-btn:hover{background:rgba(241,238,227,.08);color:var(--paper)}
.pf-preset-btn[data-pfpreset=conservative]{border-left-color:#5FA875}
.pf-preset-btn[data-pfpreset=balanced]{border-left-color:var(--gold)}
.pf-preset-btn[data-pfpreset=aggressive]{border-left-color:var(--red)}
.pf-preset-btn[data-pfpreset=equal]{border-left-color:rgba(241,238,227,.35)}
.port-cluster-toggle{display:flex;align-items:center;gap:8px;width:100%;font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:rgba(241,238,227,.75);background:transparent;border:none;border-top:1px dashed rgba(241,238,227,.14);padding:12px 2px 10px;margin:0;cursor:pointer;text-align:left}
.port-cluster:first-child .port-cluster-toggle{border-top:none}
.port-cluster-toggle:hover{color:var(--paper)}
.port-cluster-toggle .explain-chevron{background:rgba(241,238,227,.14);color:var(--paper);flex-shrink:0}
.port-cluster-toggle.open .explain-chevron{background:var(--gold);color:var(--ink)}
.port-cluster-icon{width:15px;height:15px;color:var(--gold);flex-shrink:0}
.port-cluster-icon svg{width:100%;height:100%}
.port-cluster-name{flex:1}
.port-cluster-total{color:var(--gold);font-weight:600}
.lab-gopdeeper-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(201,164,85,.65);margin:4px 0 -6px}
.explain-panel-inner b{color:rgba(241,238,227,.9)}
.stress-row{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid rgba(241,238,227,.06)}
.stress-row:last-child{border-bottom:none}
.stress-label{font-size:13px;color:rgba(241,238,227,.85);font-weight:600}
.stress-note{display:block;font-size:10.5px;color:rgba(241,238,227,.45);font-weight:400;margin-top:2px}
.stress-vals{display:flex;gap:14px;flex-wrap:wrap;font-family:'Spline Sans Mono',monospace;font-size:11.5px;margin-top:2px}
.stress-mkt{color:rgba(241,238,227,.5)}
.stress-port{font-weight:600}
.stress-dollar{color:rgba(241,238,227,.6)}
.pf-mode-toggle{display:flex;gap:6px;margin-bottom:14px}
.pf-mode-btn{flex:1;background:rgba(241,238,227,.05);border:1px solid rgba(241,238,227,.16);color:rgba(241,238,227,.65);border-radius:2px 10px 10px 10px;padding:8px;font-size:12px;cursor:pointer;font-family:'Figtree',sans-serif;transition:all .15s}
.pf-mode-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
.rc-legend{display:flex;gap:16px;margin-bottom:10px;font-size:11px;color:rgba(241,238,227,.5)}
.rc-legend span{display:flex;align-items:center;gap:5px}
.rc-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.rc-row{display:grid;grid-template-columns:1fr 90px;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(241,238,227,.06)}
.rc-row:last-child{border-bottom:none}
.rc-name{font-size:12px;color:rgba(241,238,227,.8);grid-column:1/2}
.rc-bars{grid-column:1/2;display:flex;flex-direction:column;gap:2px}
.rc-bar-track{height:5px;background:rgba(241,238,227,.06);border-radius:2px;overflow:hidden}
.rc-bar{height:100%;border-radius:2px}
.rc-money{background:#C9A455}
.rc-risk{background:#D97757}
.rc-risk-neg{background:#5FA875}
.rc-vals{grid-column:2/3;grid-row:1/3;font-size:10.5px;color:rgba(241,238,227,.5);text-align:right;font-family:'Spline Sans Mono',monospace;line-height:1.4}
.rc-flag-hot{color:#E8977A}
.rc-flag-cool{color:#8FC79E}
.risk-comp-legend span{display:flex;align-items:flex-start;gap:8px}
.risk-comp-legend i{display:inline-block;width:11px;height:11px;border-radius:2px;flex-shrink:0;margin-top:3px}

/* --- info icon hover tooltip (for stat labels, term explanations) --- */
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid rgba(241,238,227,.35);color:rgba(241,238,227,.55);font-size:9.5px;font-family:'Spline Sans Mono',monospace;font-style:normal;cursor:help;margin-left:5px;position:relative;flex-shrink:0}
.info-icon:hover{border-color:var(--gold);color:var(--gold)}
.info-icon .ii-tip{display:none;position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#12261C;border:1px solid rgba(201,164,85,.4);border-radius:3px 8px 8px 8px;padding:9px 12px;font-family:'Figtree',sans-serif;font-size:11.5px;font-weight:400;color:rgba(241,238,227,.85);width:220px;line-height:1.5;text-align:left;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.35);white-space:normal}
.info-icon:hover .ii-tip{display:block}
.stat-label{display:flex;align-items:center}

.term{border-bottom:1px dashed rgba(201,164,85,.6);cursor:help;position:relative}
.term::after{content:attr(data-def);display:none;position:absolute;bottom:calc(100% + 7px);left:0;background:#12261C;border:1px solid rgba(201,164,85,.4);border-radius:3px 8px 8px 8px;padding:9px 12px;font-family:'Figtree',sans-serif;font-size:11.5px;font-weight:400;color:rgba(241,238,227,.85);width:240px;line-height:1.5;white-space:normal;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.term:hover::after{display:block}
.term:hover{border-bottom-color:var(--gold);color:var(--gold)}

/* --- cluster-grouped portfolio sliders --- */
.port-cluster{margin-bottom:0}
.pf-total-banner{display:flex;align-items:baseline;justify-content:space-between;background:rgba(201,164,85,.1);border:1px solid rgba(201,164,85,.35);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.pf-total-banner .ttl-label{font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(241,238,227,.6);letter-spacing:.04em}
.pf-total-banner .ttl-value{font-family:'Spline Sans Mono',monospace;font-size:16px;font-weight:600;color:var(--gold)}
.port-asset-meta{display:block;font-family:'Spline Sans Mono',monospace;font-size:10px;color:rgba(241,238,227,.42);font-weight:400;margin-top:2px;letter-spacing:.01em}
.port-pct-row{display:flex;align-items:baseline;gap:6px;margin:6px 0 5px}
.port-pct-badge{font-family:'Spline Sans Mono',monospace;font-size:15px;font-weight:600;color:var(--paper)}
.port-pct-of{font-family:'Spline Sans Mono',monospace;font-size:10px;color:rgba(241,238,227,.4)}
.epchip{font-family:'Spline Sans Mono',monospace;font-size:11px;padding:8px 8px;border-radius:2px;border:1px solid rgba(241,238,227,.16);background:rgba(241,238,227,.04);color:rgba(241,238,227,.7);cursor:pointer;text-align:center;line-height:1.5}

<body>
<header>
  <a href="index.html" class="brand">Goalden<span>the lab</span></a>
  <div class="country-toggle" id="countryToggle"></div>
</header>
<nav class="tabbar" id="tabbar">
  <div id="tabbarInner"></div>
</nav>
<div class="print-header" id="printHeader"></div>
<main id="main"></main>
<button class="print-btn" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg><span>Print / Save as PDF</span></button>

<script>
'use strict';
/* =====================================================================
   ECHARTS: theme + chart lifecycle
   One shared theme so every chart instance is just echarts.init(dom,
   'goalden', {renderer:'svg'}) -- svg keeps this app's real print/PDF
   output vector-sharp instead of a rasterized canvas snapshot.
   ===================================================================== */
echarts.registerTheme('goalden', {
  color: ['#C9A455','#8FC79E','#D97757','#5FA875','#E8977A','#F1EEE3'],
  backgroundColor: 'transparent',
  textStyle: { fontFamily: "'Spline Sans Mono', monospace", color: 'rgba(241,238,227,.75)' },
  title: { textStyle: { fontFamily: "'Newsreader', serif", color: '#F1EEE3', fontWeight: 600 } },
  grid: { left: 44, right: 16, top: 16, bottom: 30, containLabel: true },
  categoryAxis: {
    axisLine: { lineStyle: { color: 'rgba(241,238,227,.2)' } },
    axisLabel: { color: 'rgba(241,238,227,.5)', fontSize: 10 },
    splitLine: { show: false },
  },
  valueAxis: {
    axisLine: { show: false },
    axisLabel: { color: 'rgba(241,238,227,.5)', fontSize: 10 },
    splitLine: { lineStyle: { color: 'rgba(241,238,227,.06)' } },
  },
  tooltip: {
    backgroundColor: '#12261C', borderColor: 'rgba(201,164,85,.4)', borderWidth: 1,
    textStyle: { color: '#F1EEE3', fontFamily: "'Spline Sans Mono', monospace", fontSize: 11.5 },
    extraCssText: 'border-radius:3px 8px 8px 8px;box-shadow:0 4px 14px rgba(0,0,0,.35)',
  },
});
// Registry of live chart instances, keyed by container id. A tab switch
// or any full re-render replaces #main's innerHTML wholesale, which
// detaches the old container node without disposing the ECharts instance
// bound to it -- this registry is what lets re-renders dispose stale
// instances instead of silently leaking one on every render() call.
// initChart() also doubles as the fast path for high-frequency updates
// (a slider mid-drag): pass the SAME id across ticks and it calls
// setOption() on the still-live instance instead of dispose+recreate,
// so ECharts animates the transition between old and new values for
// free, the same way the old hand-rolled fast-path patching did.
const chartInstances = {};
function initChart(id, option, optsOverride){
  const dom = document.getElementById(id);
  if(!dom) return null;
  let entry = chartInstances[id];
  if(entry && entry.dom !== dom){ entry.inst.dispose(); entry = null; }
  if(!entry){
    const inst = echarts.init(dom, 'goalden', Object.assign({renderer:'svg'}, optsOverride));
    entry = chartInstances[id] = { inst, dom };
  }
  entry.inst.setOption(option, true);
  return entry.inst;
}
function disposeChart(id){
  if(chartInstances[id]){ chartInstances[id].inst.dispose(); delete chartInstances[id]; }
}
// Charts are placed into the DOM as part of a synchronous innerHTML
// string (same convention as the old SVG-string chart functions), so the
// container div does not exist yet at the moment a chart-producing
// function runs. Scheduling the actual echarts.init/setOption call via
// setTimeout(fn,0) defers it to right after the current synchronous
// script (which includes the innerHTML assignment) finishes -- the
// container is guaranteed to exist by the time this callback runs, with
// no caller-side changes needed at any of this app's many call sites.
function deferChartInit(fn){ setTimeout(fn, 0); }

/* =====================================================================
   ENGINE (verbatim port)
   ===================================================================== */
function inflateExpense(amt,phases,f){if(f===undefined)f=1;for(const p of phases)amt*=Math.pow(1+p.rate,p.years);return amt*f}
function realRate(r,i){return(1+r)/(1+i)-1}
function corpusRequired(rate,years,w,due){if(rate===0)return w*years;let pv=w*(1-Math.pow(1+rate,-years))/rate;return due?pv*(1+rate):pv}
function solveSIP(rate,periods,fv,due){if(rate===0)return fv/periods;let f=(Math.pow(1+rate,periods)-1)/rate;return fv/(due?f*(1+rate):f)}
function solveStepUpSIP(rate,growth,periods,fv,due){
  if(Math.abs(rate-growth)<1e-9){const f=periods*Math.pow(1+rate,periods-1)*(due?(1+rate):1);return fv/f;}
  let f=(Math.pow(1+rate,periods)-Math.pow(1+growth,periods))/(rate-growth);
  return fv/(due?f*(1+rate):f);
}
function effectiveMonthlyRate(r){return Math.pow(1+r,1/12)-1}
function swpWithdrawal(rate,years,corpus,due){
  if(rate===0)return corpus/years;
  let f=(1-Math.pow(1+rate,-years))/rate;
  if(due)f*=(1+rate);
  return corpus/f;
}
function drawdownWithShock(opts, shockYear, shockReturn){
  const rows=[];let bal=opts.openingCorpus,w=opts.firstWithdrawal;let ranOutYear=null;
  for(let yr=1;yr<=opts.years;yr++){
    const rate=(yr===shockYear)?shockReturn:opts.nominalRate;
    let close;
    if(opts.due){const baw=bal-w;close=baw+baw*rate;}
    else{close=(bal+bal*rate)-w;}
    if(close<0&&ranOutYear===null)ranOutYear=yr;
    rows.push({year:yr,openBal:bal,withdrawal:w,rate,closeBal:close});
    bal=close;
    w*=(1+opts.inflation);
  }
  return{rows,ranOutYear,finalBalance:bal};
}
function accumulationSchedule(o){
  const rows=[];let bal=o.opening||0,contrib=o.sip,total=0;
  for(let i=1;i<=o.periods;i++){
    let close;
    if(o.due){const b2=bal+contrib;close=b2*(1+o.rate);}
    else{close=bal*(1+o.rate)+contrib;}
    total+=contrib;
    rows.push({period:i,closeBal:close,contributed:total});
    bal=close;
    contrib*=(1+(o.stepUp||0));
  }
  return{rows,finalBalance:bal};
}

/* =====================================================================
   MONTE CARLO — seeded (mulberry32 PRNG + Box-Muller), n=1000 default.
   Verified: volatility=0 collapses exactly to the deterministic engine
   answer at every percentile; same seed reproduces identical results;
   spread widens monotonically with volatility.
   ===================================================================== */
function mulberry32(seed){
  return function(){
    seed|=0; seed=(seed+0x6D2B79F5)|0;
    let t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return((t^(t>>>14))>>>0)/4294967296;
  };
}
function gaussian(rng){const u1=rng()||1e-9,u2=rng();return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);}

function monteCarloAccumulation({sip,meanReturn,volatility,years,due,seed,n}){
  const rng=mulberry32(seed);
  const finals=[],paths=[];
  for(let sim=0;sim<n;sim++){
    let bal=0; const path=[0];
    for(let y=1;y<=years;y++){
      const r=volatility===0?meanReturn:meanReturn+volatility*gaussian(rng);
      bal=due?(bal+sip)*(1+r):bal*(1+r)+sip;
      path.push(bal);
    }
    finals.push(bal); paths.push(path);
  }
  finals.sort((a,b)=>a-b);
  const pct=p=>finals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
  // percentile band PER YEAR (for the fan chart) — recompute per-year percentiles across all paths
  const yearBands=[];
  for(let y=0;y<=years;y++){
    const vals=paths.map(p=>p[y]).sort((a,b)=>a-b);
    const pp=p=>vals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
    yearBands.push({year:y,p10:pp(0.10),p25:pp(0.25),p50:pp(0.50),p75:pp(0.75),p90:pp(0.90)});
  }
  return{p10:pct(0.10),p25:pct(0.25),p50:pct(0.50),p75:pct(0.75),p90:pct(0.90),mean:finals.reduce((a,b)=>a+b,0)/n,yearBands};
}

// Same PRNG, same percentile-banding approach as monteCarloAccumulation,
// but run over the SPENDING-down phase instead: each simulated year draws
// a random return, the withdrawal (already fixed by the deterministic
// plan) is taken out, and once a path hits zero it stays there. This is
// what a single average return can never show: two paths with the exact
// same mean and volatility can survive or fail entirely depending on
// WHEN the bad years land — sequence-of-returns risk.
function monteCarloDrawdown({openingCorpus,firstWithdrawal,inflation,meanReturn,volatility,years,due,seed,n}){
  const rng=mulberry32(seed);
  const finals=[],paths=[],ranOutYears=[];
  for(let sim=0;sim<n;sim++){
    let bal=openingCorpus,w=firstWithdrawal,ranOut=null;
    const path=[bal];
    for(let y=1;y<=years;y++){
      const r=volatility===0?meanReturn:meanReturn+volatility*gaussian(rng);
      let close;
      if(due){const baw=bal-w;close=baw+baw*r;}else{close=(bal+bal*r)-w;}
      // A plan built to reach exactly zero can land a hair below it from
      // pure floating-point rounding (seen: -2.5e-7 on a multi-crore
      // balance). Only count it as ruin past a real, rupee-scale deficit.
      if(close<-1&&ranOut===null)ranOut=y;
      bal=Math.max(0,close);
      path.push(bal);
      w*=(1+inflation);
    }
    finals.push(bal);paths.push(path);ranOutYears.push(ranOut);
  }
  finals.sort((a,b)=>a-b);
  const pct=p=>finals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
  const yearBands=[];
  for(let y=0;y<=years;y++){
    const vals=paths.map(p=>p[y]).sort((a,b)=>a-b);
    const pp=p=>vals[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
    yearBands.push({year:y,p10:pp(0.10),p25:pp(0.25),p50:pp(0.50),p75:pp(0.75),p90:pp(0.90)});
  }
  const survived=ranOutYears.filter(x=>x===null).length;
  const failedYears=ranOutYears.filter(x=>x!==null).sort((a,b)=>a-b);
  const medianRuinYear=failedYears.length?failedYears[Math.floor(failedYears.length/2)]:null;
  // A corpus with no margin for error (this app deliberately builds one to
  // show the fragility) fails on MORE than half its simulated paths the
  // moment any volatility is added at all. That means the P10 and P50
  // "ending balance" are both legitimately ₹0 for nearly the entire
  // volatility range, which is mathematically correct but useless as a
  // headline stat: it never differentiates a mild scenario from a severe
  // one, because both just say ₹0. The fix isn't to change the math, it's
  // to report the right thing for a failed path: WHEN it ran out, not a
  // balance that was never going to be anything but zero. Ties among
  // failed paths break on ruin year (an earlier failure is a worse
  // outcome), so P10 and P50 keep differentiating from each other even
  // when both represent failures.
  const combined = finals.map((bal,i)=>({bal, ranOut: ranOutYears[i]}))
    .sort((a,b)=>{
      const aR=a.ranOut!==null, bR=b.ranOut!==null;
      if(aR&&bR) return a.ranOut-b.ranOut;
      if(aR&&!bR) return -1;
      if(!aR&&bR) return 1;
      return a.bal-b.bal;
    });
  const pctDetail = p => combined[Math.max(0,Math.min(n-1,Math.floor(p*(n-1))))];
  return{p10:pct(0.10),p25:pct(0.25),p50:pct(0.50),p75:pct(0.75),p90:pct(0.90),yearBands,
         survivalPct:survived/n,failCount:failedYears.length,medianRuinYear,n,
         p10Detail:pctDetail(0.10),p50Detail:pctDetail(0.50)};
}

const REGIME_PRESETS = {
  bull:   {label:'Bull run',      note:'Strong sustained growth, low volatility',   meanAdj:1.15, volAdj:0.8},
  normal: {label:'Historical average', note:'Long-run blended average',             meanAdj:1.0,  volAdj:1.0},
  bear:   {label:'Extended slump', note:'Below-average returns, higher volatility', meanAdj:0.6,  volAdj:1.4},
};

/* =====================================================================
   PORTFOLIO DIVERSIFICATION / EFFICIENT FRONTIER
   Asset-CLASS level (not individual stocks) — this app has no live market
   data feed, so building this on fabricated individual-stock betas and
   correlations would be a bigger honesty problem than the loss of
   granularity. These are illustrative, clearly-labelled planning
   assumptions: returns/vols anchor to the same figures used everywhere
   else in Goalden; the correlation matrix encodes well-established
   qualitative relationships (domestic equity tiers move together, gold
   is a low/negative-correlation hedge, debt is largely uncorrelated with
   equity) rather than a fitted statistical estimate. Verified against a
   closed-form two-asset case before use — see build notes.
   ===================================================================== */
// Category-level building blocks named after the real SEBI fund categories
// and indices an Indian investor actually shops from (Nifty 50 index funds,
// gilt funds, REITs, arbitrage funds, and so on). The return/volatility
// figures are long-run CATEGORY-level planning assumptions consistent with
// the rest of Goalden — deliberately NOT any specific AMC scheme's live
// performance, because this app has no market data feed and pretending
// otherwise would be a bigger honesty problem than the loss of precision.
const PORTFOLIO_ASSETS_IN = [
  // Growth equity
  {id:'nifty50',  name:'Nifty 50 Index Fund',          cluster:'growth', ret:0.12,  vol:0.18, beta:1.00},
  {id:'next50',   name:'Nifty Next 50 Index Fund',     cluster:'growth', ret:0.135, vol:0.22, beta:1.10},
  {id:'flexicap', name:'Flexi Cap Fund',               cluster:'growth', ret:0.125, vol:0.19, beta:1.00},
  {id:'multicap', name:'Multi Cap Fund',               cluster:'growth', ret:0.13,  vol:0.20, beta:1.05},
  {id:'elss',     name:'ELSS Tax Saver Fund',          cluster:'growth', ret:0.125, vol:0.19, beta:1.00},

  'alt-alt':0.85,
};
function clusterCorr(c1,c2){
  if(c1===c2) return CLUSTER_CORR[c1+'-'+c1] !== undefined ? CLUSTER_CORR[c1+'-'+c1] : 1.00;
  const k1=c1+'-'+c2, k2=c2+'-'+c1;
  return CLUSTER_CORR[k1]!==undefined ? CLUSTER_CORR[k1] : CLUSTER_CORR[k2];
}
function buildCorrMatrix(assets){
  const n=assets.length;
  const m=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) m[i][j] = i===j ? 1.00 : clusterCorr(assets[i].cluster, assets[j].cluster);
  return m;
}

const PORTFOLIO_CORR_US = buildCorrMatrix(PORTFOLIO_ASSETS_US);

function portfolioReturn(weights, returns){ return weights.reduce((s,w,i)=>s+w*returns[i],0); }
function portfolioVariance(weights, vols, corr){
  let v=0;
  for(let i=0;i<weights.length;i++) for(let j=0;j<weights.length;j++) v+=weights[i]*weights[j]*vols[i]*vols[j]*corr[i][j];
  return v;
}
function portfolioBeta(weights, betas){ return weights.reduce((s,w,i)=>s+w*betas[i],0); }

// Rigorous systematic/unsystematic risk split via the single-index model,
// computed directly from the covariance matrix rather than the
// hand-assigned per-asset beta above — guarantees beta=1.00 exactly for
// 100% market and unsystematic risk >= 0 always, since both are
// structural properties of covariance projection, not approximations.
// marketIdx is the asset used as the market proxy (index 0 in each list:
// Large Cap Equity for India, Total-Market Equity for the US).
function decomposeRisk(weights, vols, corr, marketIdx){
  const marketVol = vols[marketIdx];
  const totalVar = portfolioVariance(weights, vols, corr);
  let covWithMarket = 0;
  for(let i=0;i<weights.length;i++) covWithMarket += weights[i]*vols[i]*marketVol*corr[i][marketIdx];
  const beta = covWithMarket / (marketVol*marketVol);
  const systematicVar = beta*beta*marketVol*marketVol;
  const unsystematicVar = Math.max(0, totalVar - systematicVar);
  return {
    totalVol: Math.sqrt(totalVar), beta,
    systematicVol: Math.sqrt(systematicVar),
    unsystematicVol: Math.sqrt(unsystematicVar),
    unsystematicPct: totalVar>0 ? unsystematicVar/totalVar : 0,
    systematicPct: totalVar>0 ? systematicVar/totalVar : 0,
  };
}
// Standard normal PDF/CDF, used for the closed-form Sortino ratio below.
// CDF uses the Abramowitz-Stegun approximation (max error ~7.5e-8),
// verified against a 500,000-draw Monte Carlo before use -- matched to
// within 0.03% across every realistic return/risk/target combination
// tested, and to the exact known closed-form (downside deviation =
// vol/sqrt(2) when the target equals the mean) as a sanity anchor.
function stdNormPDF(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
function stdNormCDF(x){
  const t=1/(1+0.2316419*Math.abs(x));
  const d=0.3989423*Math.exp(-x*x/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return x>0?1-p:p;
}
// Closed-form lower partial moment of order 2 for a normal distribution,
// i.e. E[(min(X-T,0))^2] for X ~ N(mu, sigma^2). This is downside
// deviation squared, the denominator of the Sortino ratio.
function downsideDeviation(mu, sigma, target){
  if(sigma<=0) return 0;
  const z=(target-mu)/sigma;
  const lpm2 = sigma*sigma*((1+z*z)*stdNormCDF(z) + z*stdNormPDF(z));
  return Math.sqrt(Math.max(0,lpm2));
}
// Sharpe, Sortino, diversification ratio, and effective number of
// holdings for the live mix. All closed-form, no simulation, cheap
// enough to recompute on every single slider tick.
// One-year 95% VaR and CVaR (expected shortfall), closed-form for a
// normal return distribution. Verified against a 50,000-draw simulation
// before use (matched to within 0.001 on both figures). Framed as a loss
// (positive number = how far down), which is how these are actually
// quoted in practice, not as a raw negative return.
function portfolioTailRisk(d){
  const Z95 = 1.6448536269514722, PHI_Z95_OVER_005 = 2.0627128075074275;
  const mu = d.portRet, sigma = d.decomp.totalVol;
  const var95 = -(mu - Z95*sigma);
  const cvar95 = -(mu - sigma*PHI_Z95_OVER_005);
  return { var95, cvar95 };
}
function portfolioRatios(d, c){
  const rf = c.d.fdRate;
  const sharpe = (d.portRet - rf) / d.decomp.totalVol;
  const dd = downsideDeviation(d.portRet, d.decomp.totalVol, rf);
  const sortino = dd > 1e-9 ? (d.portRet - rf) / dd : null; // null = downside risk is negligible
  const weightedAvgVol = d.w.reduce((s,wi,i)=>s+wi*d.vols[i], 0);
  const divRatio = weightedAvgVol / d.decomp.totalVol;
  const effN = 1 / d.w.reduce((s,wi)=>s+wi*wi, 0);
  return {sharpe, sortino, downsideDev:dd, divRatio, effN, rf};
}
// Euler decomposition of risk: how much of total portfolio VOLATILITY
// (not variance) each asset is responsible for, given its weight and how
// it covaries with everything else. These sum to exactly the portfolio's
// total volatility by construction, verified by hand before use. A
// negative contribution is a real, meaningful result: it means that
// asset was, on net, working against the portfolio's swings over this
// return/correlation structure, not just holding still.
function riskContributions(d, corr){
  const {w, vols} = d;
  const portVol = d.decomp.totalVol;
  if(portVol<=0) return w.map(()=>0);
  return w.map((wi,i)=>{
    const covWithPort = w.reduce((s,wj,j)=>s+wj*vols[i]*vols[j]*corr[i][j], 0);
    return (wi * covWithPort / portVol) / portVol; // fraction of total vol, sums to 1
  });
}
function normalizeWeights(raw){
  const sum=raw.reduce((a,b)=>a+b,0);
  return sum>0 ? raw.map(w=>w/sum) : raw.map(()=>1/raw.length);
}
// Rounding 15 independent fractions to whole percents for display can miss
// or overshoot 100 by a point or two (classic apportionment problem — the
// exact thing a person adding up the numbers by hand would notice and
// distrust). Largest-remainder method: floor everything, then hand the
// leftover points to whichever assets had the biggest rounded-off remainder,
// so the displayed integers always sum to exactly 100.
function roundPercentsTo100(weights){
  const raw = weights.map(w=>w*100);
  const floors = raw.map(Math.floor);
  let remainder = 100 - floors.reduce((a,b)=>a+b,0);
  const order = raw.map((v,i)=>({i, frac: v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
  const result = floors.slice();
  for(let k=0; k<remainder && k<order.length; k++) result[order[k].i] += 1;
  return result;
}

function randomWeights(n, rng){
  const cuts=[0,1];
  for(let i=0;i<n-1;i++) cuts.push(rng());
  cuts.sort((a,b)=>a-b);
  const w=[];
  for(let i=0;i<n;i++) w.push(cuts[i+1]-cuts[i]);
  return w;
}

function generateFrontier(returns, vols, corr, n, seed){
  const rng=mulberry32(seed);
  const cloud=[];
  for(let i=0;i<n;i++){
    const w=randomWeights(returns.length, rng);
    cloud.push({ w, ret:portfolioReturn(w,returns), vol:Math.sqrt(portfolioVariance(w,vols,corr)) });
  }
  const minV=Math.min(...cloud.map(p=>p.vol)), maxV=Math.max(...cloud.map(p=>p.vol));
  const bins=40, binW=(maxV-minV)/bins;
  const best=new Array(bins).fill(null);
  cloud.forEach(p=>{
    let b=Math.min(bins-1,Math.floor((p.vol-minV)/(binW||1)));
    if(!best[b]||p.ret>best[b].ret) best[b]=p;
  });
  return { cloud, frontier:best.filter(Boolean).sort((a,b)=>a.vol-b.vol) };
}

/* =====================================================================
   JOINT CHILDREN EDUCATION CORPUS SOLVER (B-03)
   Verified against three cases: gap-year saving (₹30,181/yr kept vs
   separate corpora), mid-timeline binding constraint (never goes
   negative even when the tightest point is mid-plan, not the end),
   and exact reduction to the standard single-goal engine when rates
   are held constant.
   ===================================================================== */
function solveJointEducationCorpus({children, eduInflation, preRate, parkRate, sipStopYear, horizon}){
  function simulate(sip){
    let bal=0, minBal=Infinity, minYear=0;
    const rows=[];
    for(let t=1;t<=horizon;t++){
      let fees=0;
      children.forEach(ch=>{
        const s=ch.yearsToStart+1, e=ch.yearsToStart+ch.duration;
        if(t>=s && t<=e) fees += ch.annualFeeToday*Math.pow(1+eduInflation, t-1);
      });
      const contrib = t<=sipStopYear ? sip : 0;
      const anyNear = children.some(ch => t>=ch.yearsToStart);
      const rate = anyNear ? parkRate : preRate;
      const after = bal + contrib - fees;
      if(after<minBal){minBal=after; minYear=t;}
      bal = after*(1+rate);
      rows.push({year:t, contrib:Math.round(contrib), fees:Math.round(fees), rate, close:Math.round(bal)});
    }
    return{finalBal:bal, minBal, minYear, rows};
  }
  let lo=0, hi=50000000;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    simulate(mid).minBal >= 0 ? hi=mid : lo=mid;
  }
  return{sip:hi, ...simulate(hi)};
}

function separateCorporaTotal({children, eduInflation, preRate, parkRate}){
  let total=0;
  children.forEach(ch=>{
    const r = solveJointEducationCorpus({
      children:[ch], eduInflation, preRate, parkRate,
      sipStopYear: ch.yearsToStart, horizon: ch.yearsToStart+ch.duration,
    });
    total += r.sip;
  });
  return total;
}

   FX MODULE (verbatim port of fx.js)
   ===================================================================== */
function fxInvestingAbroad(principal, foreignReturn, homeDeprec, years){
  return principal * Math.pow((1+foreignReturn)*(1+homeDeprec), years);
}
function fxReceivingFromAbroad(principal, foreignReturn, foreignDeprec, years){
  return principal * Math.pow((1+foreignReturn)/(1+foreignDeprec), years);
}
function fxCompare({principal, direction, homeReturn, foreignReturn, depreciationRate, years}){
  const domesticFV = principal * Math.pow(1+homeReturn, years);
  const crossBorderFV = direction==='investingAbroad'
    ? fxInvestingAbroad(principal, foreignReturn, depreciationRate, years)
    : fxReceivingFromAbroad(principal, foreignReturn, depreciationRate, years);
  const marketOnlyFV = principal * Math.pow(1+foreignReturn, years);
  const currencyEffect = crossBorderFV - marketOnlyFV;
  const effectiveAnnualReturn = Math.pow(crossBorderFV/principal, 1/years) - 1;
  return {domesticFV, crossBorderFV, marketOnlyFV, currencyEffect, effectiveAnnualReturn, foreignBeatsHome: crossBorderFV>domesticFV};
}

function yearlyAmortization(monthlyRows){
  const years=[];
  let prevClose=0, prevContributed=0;
  for(let m=0; m<monthlyRows.length; m+=12){
    const yearEndRow = monthlyRows[Math.min(m+11, monthlyRows.length-1)];
    const contributedThisYear = yearEndRow.contributed - prevContributed;
    const growthThisYear = yearEndRow.closeBal - prevClose - contributedThisYear;
    years.push({
      year: years.length+1,
      contributedThisYear: Math.round(contributedThisYear),
      growthThisYear: Math.round(growthThisYear),
      closeBal: Math.round(yearEndRow.closeBal),
    });
    prevClose = yearEndRow.closeBal;
    prevContributed = yearEndRow.contributed;
  }
  return years;
}

function calcRetLab(){
  const c=cfg(), r=L.ret;
  const yrs=r.retireAge-r.age;
  const drawYrs=Math.max(5, r.lifeExp-r.retireAge);
  const infl=r.inflation/100, preR=r.preRate/100, postR=r.postRate/100;
  const rr=realRate(postR, infl);
  let expAtRet, corpus;
  if(r.corpusMode==='custom'){
    // The person names the pot; the plan solves backwards from it.
    // If they typed the amount in today's money, inflate it to the
    // retirement date first so the target keeps its purchasing power.
    corpus = r.customBasis==='today' ? r.customCorpus*Math.pow(1+infl, yrs) : r.customCorpus;
    // What that pot sustainably supports: the same inverse-annuity used
    // by the Sustainable Withdrawal tab, so both tabs agree by construction.
    expAtRet = swpWithdrawal(rr, drawYrs, corpus, r.due);
  } else {
    expAtRet=inflateExpense(r.monthlyExpense*12, [{rate:infl, years:yrs}], r.lifestyleFactor/100);
    corpus=corpusRequired(rr, drawYrs, expAtRet, r.due);
  }
  const mRate=effectiveMonthlyRate(preR);
  // Existing savings assumed to keep compounding at the same rate as the
  // new SIP, so existingFV + gapCorpus lands on the full target corpus
  // exactly — same identity used in both doors.
  const existing=r.existingSavings||0;
  const existingFV=existing*Math.pow(1+mRate, yrs*12);
  const gapCorpus=Math.max(0, corpus-existingFV);
  const sip=solveSIP(mRate, yrs*12, gapCorpus, r.due);
  const realCorpus=corpus/Math.pow(1+infl, yrs);
  const accRows=accumulationSchedule({sip, rate:mRate, periods:yrs*12, due:r.due, opening:existing}).rows;

  let ddRows, shockInfo=null;
  if(r.shock){
    const ep=c.episodes.find(e=>e.id===r.shock.epId);
    const res=drawdownWithShock({openingCorpus:corpus, firstWithdrawal:expAtRet, inflation:infl, nominalRate:postR, years:drawYrs, due:r.due}, r.shock.year, ep.rate);
    ddRows=res.rows;
    shockInfo={ep, ranOutYear:res.ranOutYear, finalBalance:res.finalBalance};
  } else {
    const res=drawdownWithShock({openingCorpus:corpus, firstWithdrawal:expAtRet, inflation:infl, nominalRate:postR, years:drawYrs, due:r.due}, -1, 0);
    ddRows=res.rows;
  }

  return {yrs, drawYrs, expAtRet, corpus, sip, realCorpus, accRows, ddRows, shockInfo, existing, existingFV, gapCorpus};
}

// The drawdown Monte Carlo simulates 1,000 paths over the full spending
// phase, comparable cost to the MC tab's own accumulation simulation
// (that one needed a debounce to stay under 16ms per tick; this one is no
// cheaper). renderRetirement() runs synchronously on every slider tick for
// this tab, so this card must NEVER compute inline there — only this
// debounced job touches monteCarloDrawdown, and it patches the card's own
// container directly rather than forcing a full tab re-render.
let ddmcTimer=null;
let lastDDMCHtml='';
function renderDDMCBody(res){
  const r=L.ret, c=cfg();
  const mc=monteCarloDrawdown({openingCorpus:res.corpus, firstWithdrawal:res.expAtRet, inflation:r.inflation/100,
    meanReturn:r.postRate/100, volatility:r.ddVol/100, years:res.drawYrs, due:r.due, seed:r.ddSeed, n:1000});
  const survPct=Math.round(mc.survivalPct*100);
  // A zero-margin corpus (the plan is deliberately sized to reach exactly
  // zero with no buffer) means P10 and, very often, P50 too represent a
  // path that ran out. A flat "₹0" for both tells the reader nothing and
  // stops differentiating the moment survival drops under 50%, which can
  // happen at very low volatility. Show WHEN that percentile's path ran
  // out instead, since that keeps changing meaningfully as volatility
  // rises even after the ending-balance number itself has flatlined.
  const p10IsFail = mc.p10Detail.ranOut !== null;
  const p50IsFail = mc.p50Detail.ranOut !== null;
  const p10Html = p10IsFail
    ? `<span style="color:#E8977A">Ran out, yr ${mc.p10Detail.ranOut}</span>`
    : `<span style="color:#E8977A">${c.compact(mc.p10Detail.bal)}</span>`;
  const p50Html = p50IsFail
    ? `<span style="color:#E8977A">Ran out, yr ${mc.p50Detail.ranOut}</span>`
    : c.compact(mc.p50Detail.bal);
  const html=`<div class="stat-row" style="margin-top:10px">
    <div class="stat"><div class="stat-label">Survives to age ${r.lifeExp}${infoIcon('Share of the 1,000 simulated paths that never hit zero before the plan ends. Below 100% means pure return-order randomness, not a wrong average, can still empty the pot.')}</div><div class="stat-value" style="color:${survPct>=90?'#8FC79E':survPct>=70?'#C9A455':'#E8977A'}">${survPct}%</div><div class="stat-sub">${mc.failCount} of ${mc.n} paths ran out${mc.medianRuinYear?`, typically by year ${mc.medianRuinYear}`:''}</div></div>
    <div class="stat"><div class="stat-label">P10 outcome${infoIcon('The 10th-percentile path: 9 in 10 simulated paths did at least this well. If even this path ran out of money, the year shown is when, not a balance, since it never had one left.')}</div><div class="stat-value" style="font-size:22px">${p10Html}</div></div>
    <div class="stat"><div class="stat-label">P50 outcome${infoIcon('The median simulated path: half did better than this, half worse. If survival is below 50%, the typical path itself runs out, which is exactly what this is reporting.')}</div><div class="stat-value" style="font-size:22px">${p50Html}</div></div>
  </div>
  <div class="cap" style="margin-top:10px">Fan of 1,000 simulated drawdown paths, seed ${r.ddSeed}</div>
  ${fanChart(mc.yearBands, 'ret-ddmc-fan')}`;
  lastDDMCHtml=html;
  return html;
}
function scheduleDDMCUpdate(delay){
  if(ddmcTimer) clearTimeout(ddmcTimer);
  ddmcTimer=setTimeout(()=>{
    ddmcTimer=null;
    const body=document.getElementById('ret-ddmc-body');
    if(body){ body.innerHTML=renderDDMCBody(calcRetLab()); }
  }, delay===undefined?150:delay);
}

function snapshotCompareNote(){
  const [a,b] = L.snapshots;
  if(a.currency.code !== b.currency.code) return 'These two snapshots use different countries, so the corpus figures are not directly comparable in one currency.';
  const diff = b.corpus - a.corpus;
  const pct = a.corpus !== 0 ? (diff/a.corpus*100) : 0;
  return `${b.label} needs ${a.currency.compact(Math.abs(diff))} ${diff>=0?'more':'less'} than ${a.label} (${diff>=0?'+':''}${pct.toFixed(1)}%).`;
}

function renderStepUp(){

// Gap to frontier: interpolate the frontier's return at the same risk
// level as the current mix. Returns null if the gap isn't meaningful.
function frontierGap(frontier, currentPoint){
  for(let i=0;i<frontier.length-1;i++){
    const a=frontier[i], b=frontier[i+1];
    if(currentPoint.vol>=a.vol && currentPoint.vol<=b.vol){
      const t=(b.vol-a.vol)>1e-9 ? (currentPoint.vol-a.vol)/(b.vol-a.vol) : 0;
      const frontierRetHere = a.ret + t*(b.ret-a.ret);
      const gapPct = frontierRetHere - currentPoint.ret;
      if(gapPct > 0.0015) return {frontierRetHere, gapPct};
      return null;
    }
  }
  return null;
}

// Builds the ECharts option for the efficient-frontier chart. Every cloud
// and frontier point carries its own weight vector (`w`, from
// generateFrontier()), so a click handler elsewhere can read
// params.dataIndex straight back into an allocation with no extra lookup.
function frontierChartOption(cloud, frontier, assetPoints, currentPoint){
  const gap = frontierGap(frontier, currentPoint);
  const markLine = gap ? {
    silent:true, symbol:['none','none'],
    lineStyle:{color:'#F1EEE3', type:'dashed', width:1.5, opacity:.6},
    label:{formatter:`+${(gap.gapPct*100).toFixed(1)}% possible`, color:'#F1EEE3', fontFamily:"'Spline Sans Mono',monospace", fontSize:10, position:'end'},
    data:[[{coord:[currentPoint.vol, currentPoint.ret]}, {coord:[currentPoint.vol, gap.frontierRetHere]}]],
  } : undefined;
  const pct=v=>(v*100).toFixed(2)+'%';
  return {
    animationDurationUpdate: 450,
    animationEasingUpdate: 'cubicOut',
    grid:{left:54, right:20, top:24, bottom:52, containLabel:true},
    xAxis:{
      type:'value', min:0, name:'RISK: how much this bounces around, per year', nameLocation:'middle', nameGap:30,
      nameTextStyle:{fontSize:10.5, color:'rgba(241,238,227,.5)'},
      axisLabel:{formatter:v=>(v*100).toFixed(0)+'%'},
      splitLine:{lineStyle:{color:'rgba(241,238,227,.05)'}},
    },
    yAxis:{
      type:'value', name:"RETURN: what you'd expect to earn", nameLocation:'middle', nameGap:44,
      nameTextStyle:{fontSize:10.5, color:'rgba(241,238,227,.5)'},
      axisLabel:{formatter:v=>(v*100).toFixed(0)+'%'},
      splitLine:{lineStyle:{color:'rgba(241,238,227,.05)'}},
    },
    dataZoom:[{type:'inside', xAxisIndex:0}, {type:'inside', yAxisIndex:0}],
    tooltip:{
      trigger:'item',
      formatter(p){
        if(p.seriesName==='Cloud') return `Sample mix<br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}`;
        if(p.seriesName==='Frontier') return `On the frontier<br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}`;
        if(p.seriesName==='Assets'){
          const a=assetPoints[p.dataIndex];
          return `${a?(a.fullLabel||a.label):''}<br/>Return: ${pct(p.value[1])} &nbsp; Risk: ${pct(p.value[0])}`;

// Renders (or refreshes) the frontier chart in-place. Only Cloud/Frontier
// points carry a stored weight vector `w`, so a click on either calls
// onPointClick with that mix; other series are silent or non-selectable.
function renderFrontierChartOption(chartId, cloud, frontier, assetPoints, currentPoint, onPointClick){
  const chart=initChart(chartId, frontierChartOption(cloud, frontier, assetPoints, currentPoint));
  if(!chart) return;
  chart.off('click');
  if(onPointClick){
    chart.on('click', params=>{
      if(params.seriesName==='Cloud' && cloud[params.dataIndex]) onPointClick(cloud[params.dataIndex].w);
      else if(params.seriesName==='Frontier' && frontier[params.dataIndex]) onPointClick(frontier[params.dataIndex].w);
    });
  }
}

   ===================================================================== */
function renderMC(){
  const c=cfg(), m=L.mc;
  const regime=REGIME_PRESETS[m.regime];
  const meanReturn=(m.meanReturn/100)*regime.meanAdj;
  const volatility=(m.volatility/100)*regime.volAdj;
  const res=monteCarloAccumulation({sip:m.sip, meanReturn, volatility, years:m.years, due:true, seed:m.seed, n:1000});

  // Twin fates: bull vs bear side by side (C-07)
  const bull=monteCarloAccumulation({sip:m.sip, meanReturn:(m.meanReturn/100)*REGIME_PRESETS.bull.meanAdj, volatility:(m.volatility/100)*REGIME_PRESETS.bull.volAdj, years:m.years, due:true, seed:m.seed, n:1000});
  const bear=monteCarloAccumulation({sip:m.sip, meanReturn:(m.meanReturn/100)*REGIME_PRESETS.bear.meanAdj, volatility:(m.volatility/100)*REGIME_PRESETS.bear.volAdj, years:m.years, due:true, seed:m.seed, n:1000});

  return `<div class="grid">
  <div class="panel">
    <h3>Monte Carlo: 1,000 simulated paths</h3>
    <div class="field"><label>Annual contribution <b data-mc-label="sip">${c.fmt(m.sip)}</b></label><input type="range" min="10000" max="1000000" step="10000" value="${m.sip}" data-k="sip" data-tab="mc"></div>
    <div class="field"><label>Years <b data-mc-label="years">${m.years}</b></label><input type="range" min="5" max="35" value="${m.years}" data-k="years" data-tab="mc"></div>
    <div class="field"><label>Expected return <b data-mc-label="meanReturn">${m.meanReturn}%</b></label><input type="range" min="4" max="16" step="0.1" value="${m.meanReturn}" data-k="meanReturn" data-tab="mc"></div>
    <div class="field"><label>Volatility (std dev)${infoIcon('The standard deviation of yearly returns: how widely each simulated year swings around the average. Around 15% is typical for a diversified equity fund. At 0% every path is identical and the fan collapses to one deterministic line.')} <b data-mc-label="volatility">${m.volatility}%</b></label><input type="range" min="0" max="30" value="${m.volatility}" data-k="volatility" data-tab="mc"></div>
    <hr class="divider">
    <div class="section-label">Regime preset${infoIcon('Presets that scale the average return and the volatility together, to mimic a sustained bull market, normal conditions, or an extended slump. A shorthand for asking: what if the whole era is kinder or harsher than expected?')}</div>
    <div class="toggle-row">
      ${Object.entries(REGIME_PRESETS).map(([id,r])=>`<button class="tglbtn${m.regime===id?' active':''}" data-toggle="regime" data-val="${id}">${r.label}</button>`).join('')}
    </div>
    <div class="gr-note">${regime.note}. Seed ${m.seed}.${infoIcon('A seed pins down the random number generator, so the same 1,000 paths are reproduced exactly every time. Change the seed to draw a different, equally valid set of simulated futures.')} The same seed always reproduces the identical 1,000 paths, so this isn't randomly different every time you look at it.</div>
    <button id="reseedBtn" style="width:100%;margin-top:10px;background:transparent;border:1px solid rgba(241,238,227,.18);color:rgba(241,238,227,.6);border-radius:8px;padding:9px;font-size:12px;cursor:pointer">Try a different seed</button>
  </div>
  <div class="output">
    <div class="stat-row">
      <div class="stat"><div class="stat-label">Median outcome (P50)${infoIcon('The middle result of 1,000 simulated futures: half ended above this figure, half below. A more honest central estimate than a single deterministic number.')}</div><div class="stat-value">${c.compact(res.p50)}</div></div>
      <div class="stat"><div class="stat-label">Worst-case band (P10)${infoIcon('9 in 10 simulated futures ended above this line. Treat it as a planning floor, not the absolute worst case, since real markets can do worse than any simulation.')}</div><div class="stat-value" style="color:#E8977A">${c.compact(res.p10)}</div></div>
      <div class="stat"><div class="stat-label">Best-case band (P90)${infoIcon('Only 1 in 10 simulated futures ended above this line. Enjoy it if it happens, but never build the plan on it.')}</div><div class="stat-value" style="color:#8FC79E">${c.compact(res.p90)}</div></div>
    </div>
    <div class="card">
      <h4>Fan chart: the range of outcomes, not just one number</h4>
      <div class="cap">Gold line = median · dark band = 25th-75th percentile · light band = 10th-90th percentile</div>
      ${fanChart(res.yearBands, 'mc-fan')}
    </div>
    <div class="card">
      <h4>Twin fates: same plan, two futures</h4>
      <div class="cap">Same contribution, same years. Only the regime differs</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px">
        <div>
          <div class="mono" style="font-size:11px;color:#8FC79E;margin-bottom:6px">BULL RUN → ${c.compact(bull.p50)}</div>
          ${fanChart(bull.yearBands, 'mc-fan-bull', 150)}
        </div>
        <div>
          <div class="mono" style="font-size:11px;color:#E8977A;margin-bottom:6px">EXTENDED SLUMP → ${c.compact(bear.p50)}</div>
          ${fanChart(bear.yearBands, 'mc-fan-bear', 150)}
        </div>
      </div>
    </div>
    <div class="gr-note">Set volatility to 0% to check this collapses to a single deterministic line. Every percentile becomes identical, proving the doors and the Lab share one engine even under simulation.</div>
  </div>
  </div>`;
}

const PORTFOLIO_PRESETS={
  conservative:{growth:0.15, income:0.10, debt:0.45, hybrid:0.15, gold:0.10, intl:0.03, alt:0.02},
  balanced:    {growth:0.35, income:0.10, debt:0.25, hybrid:0.15, gold:0.08, intl:0.05, alt:0.02},

function portfolioPresetWeights(key, assets){
  if(key==='equal' || !PORTFOLIO_PRESETS[key]) return assets.map(()=>Math.round(100/assets.length));
  const alloc = PORTFOLIO_PRESETS[key];
  const counts = {};
  assets.forEach(a=>{ counts[a.cluster]=(counts[a.cluster]||0)+1; });
  return assets.map(a=>Math.round((alloc[a.cluster]||0)*100/(counts[a.cluster]||1)));
}

function computePortfolioDerived(assets, corr){
  const rawW = L.portfolio.weights;
  const w = normalizeWeights(rawW);
  const returns = assets.map(a=>a.ret), vols = assets.map(a=>a.vol);
  const marketIdx = 0;
  const portRet = portfolioReturn(w, returns);
  const decomp = decomposeRisk(w, vols, corr, marketIdx);
  const topIdx = w.indexOf(Math.max(...w));
  const concRet = returns[topIdx], concVol = vols[topIdx];
  const volSaved = concVol - decomp.totalVol;
  const retGiven = concRet - portRet;
  const concentratedW = assets.map((_,i)=>i===topIdx?1:0);
  const concentratedDecomp = decomposeRisk(concentratedW, vols, corr, marketIdx);
  return { w, rawW, returns, vols, marketIdx, portRet, decomp, topIdx, concRet, concVol, volSaved, retGiven, concentratedDecomp };
}

function pfInflation(){
  // Lazy default per country until the person touches the slider,
  // so a country switch keeps a sensible starting assumption.
  if(L.portfolio.inflation!=null) return L.portfolio.inflation;

}
function pfInvestAmount(){
  if(L.portfolio.investAmount!=null) return L.portfolio.investAmount;
  if(pfInvestMode()==='sip') return L.country==='IN' ? 25000 : 500;
  return L.country==='IN' ? 1000000 : 10000;
}
function pfInvestYears(){
  if(L.portfolio.investYears!=null) return L.portfolio.investYears;
  return 10;
}

function pfAmountBounds(){
  if(pfInvestMode()==='sip'){
    return L.country==='IN'

}

function portfolioRiskContribHTML(d, assets, corr){
  const rc = riskContributions(d, corr);

    .sort((a,b)=>b.riskPct-a.riskPct);
  const maxAbs = Math.max(1, ...rows.map(r=>Math.max(r.moneyPct, Math.abs(r.riskPct))));
  const body = rows.map(r=>{
    const negative = r.riskPct < 0;

    return `<div class="rc-row">
      <div class="rc-name">${r.name}</div>
      <div class="rc-bars">
        <div class="rc-bar-track"><div class="rc-bar rc-money" style="width:${(r.moneyPct/maxAbs*100).toFixed(1)}%"></div></div>
        <div class="rc-bar-track"><div class="rc-bar rc-risk ${negative?'rc-risk-neg':''}" style="width:${(Math.abs(r.riskPct)/maxAbs*100).toFixed(1)}%;${negative?'margin-left:auto':''}"></div></div>

// Approximate stress-test: scale each real historical crash episode's
// market-level move by this mix's own beta, the same logic already used
// in "Reading beta" elsewhere on this tab (if the market moves X%, a
// portfolio with beta B has historically tended to move roughly B*X%).
// This is explicitly an approximation, not a full re-simulation of all
// 24 (or 16) building blocks individually through each historical
// episode, which this app does not have the granular historical data
// for -- stated plainly in the UI, not left implicit.
function portfolioStressHTML(d, c){
  const amt = pfInvestAmount();
  const rows = c.episodes.map(ep=>{
    const portShock = d.decomp.beta * ep.rate;
    const dollarImpact = amt * portShock;
    return `<div class="stress-row">
      <div class="stress-label">${ep.label}<span class="stress-note">${ep.note}</span></div>
      <div class="stress-vals">
        <span class="stress-mkt">market ${(ep.rate*100).toFixed(0)}%</span>
        <span class="stress-port" style="color:#E8977A">this mix &asymp; ${(portShock*100).toFixed(0)}%</span>
        <span class="stress-dollar">${dollarImpact<0?'-':'+'}${c.compact(Math.abs(dollarImpact))} on ${c.compact(amt)}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="cap" style="margin-bottom:10px">Scales each real historical episode's market-wide move by this mix's own beta (${d.decomp.beta.toFixed(2)}), the same logic as the beta reading above. This is an approximation, not a full replay of all ${c.code==='IN'?'24':'16'} building blocks individually through each event, which needs return data this app does not have at that granularity.</div>
  ${rows}`;
}
function portfolioTailRiskHTML(d){
  const t = portfolioTailRisk(d);
  return `<div class="stat"><div class="stat-label">VaR, 1-in-20 year${infoIcon('Value at Risk, 95% confidence: in roughly 1 year out of 20, this mix would be expected to be down at least this much. It says nothing about how much worse the other 5% of years could get, only that a loss at least this size is the 1-in-20 threshold. Closed-form for a normal return distribution, verified against simulation before use.')}</div><div class="stat-value" style="color:#E8977A">-${(t.var95*100).toFixed(1)}%</div></div>
  <div class="stat"><div class="stat-label">CVaR, average of those bad years${infoIcon('Conditional VaR (expected shortfall): averaged only across that worst-1-in-20 tail, not the whole distribution. This is always a bigger number than VaR, and answers the question VaR does not: given that you are already in a bad year, how bad does it tend to be.')}</div><div class="stat-value" style="color:#E8977A">-${(t.cvar95*100).toFixed(1)}%</div></div>`;
}
// Shared by the full render and the debounced live-update fast path, so
// both build the identical cloud/frontier/assetPoints/currentPoint shape.
function computePortfolioFrontierData(d, assets, corr){
  const {cloud, frontier} = generateFrontier(d.returns, d.vols, corr, 3000, L.portfolio.seed);
  const assetPoints = assets.map((a,i)=>({vol:a.vol, ret:a.ret, label:a.name.split(' ')[0], fullLabel:a.name}));
  const currentPoint = {vol:d.decomp.totalVol, ret:d.portRet};
  return {cloud, frontier, assetPoints, currentPoint};
}
// Clicking a cloud or frontier point in the chart adopts that mix's own
// weight vector as the portfolio's weights — the "movable" chart behaviour.
function onPortfolioFrontierPick(w){
  const assets = cfg().code==='IN' ? PORTFOLIO_ASSETS_IN : PORTFOLIO_ASSETS_US;
  L.portfolio.weights = w.map(x=>Math.round(x*100));
  if(L.portfolio.weights.length!==assets.length) return;
  render();
}
function portfolioChartHTML(d, assets, corr){
  const {cloud, frontier, assetPoints, currentPoint} = computePortfolioFrontierData(d, assets, corr);
  return frontierChart(cloud, frontier, assetPoints, currentPoint, 'pf-frontier-echart', onPortfolioFrontierPick);
}

// Called on every slider tick (input event fires continuously during a
// drag). Recomputes only the cheap, closed-form numbers — stats, the risk
// bar, and the two text cards — and patches just those DOM nodes directly.
// Crucially this never touches the sliders themselves or the frontier
// chart, so the drag gesture the browser is mid-tracking never gets its
// underlying element replaced (that was the actual cause of the stutter,
// not just raw compute time — see build notes).
function portfolioMoneyHTML(d){
  const c=cfg();
  const inf=pfInflation()/100;
  const real=realRate(d.portRet, inf);
  const base=pfInvestAmount();
  const yrs=pfInvestYears();
  const sip = pfInvestMode()==='sip';
  const mRate=r=>effectiveMonthlyRate(r);
  const fv = sip ? accumulationSchedule({sip:base, rate:mRate(d.portRet), periods:yrs*12, due:true}).finalBalance : base*Math.pow(1+d.portRet,yrs);
  const realFv = sip ? accumulationSchedule({sip:base, rate:mRate(real), periods:yrs*12, due:true}).finalBalance : base*Math.pow(1+real,yrs);
  const fdFv = sip ? accumulationSchedule({sip:base, rate:mRate(cfg().d.fdRate), periods:yrs*12, due:true}).finalBalance : base*Math.pow(1+cfg().d.fdRate,yrs);
  const fdDiff=fv-fdFv;
  const totalIn = sip ? base*12*yrs : base;
  const subjectLine = sip
    ? `${c.compact(base)}/month put into this mix for ${yrs} years, ${c.compact(totalIn)} put in altogether, grows to`
    : `${c.compact(base)} left in this mix for ${yrs} years grows to`;
  const fdSubjectLine = sip
    ? `The same ${c.compact(base)}/month in a typical bank Fixed Deposit`
    : `The same ${c.compact(base)} in a typical bank Fixed Deposit`;
  return `<div class="gr-note" style="margin-top:0">${subjectLine} <b style="color:var(--paper)">${c.compact(fv)}</b> on paper. In today's purchasing power, after ${pfInflation()}% inflation, it is really worth <b style="color:${real>0?'#8FC79E':'#E8977A'}">${c.compact(realFv)}</b>. The gap between those two numbers is what inflation quietly takes, and it is why the after-inflation return above, not the headline one, is the number to judge a mix by.</div>
  <div class="gr-note" style="margin-top:8px;padding-top:10px;border-top:1px dashed rgba(241,238,227,.14)">${fdSubjectLine} (${(cfg().d.fdRate*100).toFixed(1)}%/yr) would instead reach <b style="color:#E8977A">${c.compact(fdFv)}</b> over those ${yrs} years${fdDiff>0?`, <b style="color:var(--paper)">${c.compact(fdDiff)}</b> less than this mix`:''}. FD interest is also fully taxed at your income slab every year, unlike long-term equity gains, which is not even reflected here.</div>`;
}
function updatePortfolioLive(){

  }

  const betaEl=document.getElementById('pf-beta-text'); if(betaEl) betaEl.innerHTML=portfolioBetaTextHTML(d, assets);
  const ratiosEl=document.getElementById('pf-ratios'); if(ratiosEl) ratiosEl.innerHTML=portfolioRatiosHTML(d, c);
  const tailEl=document.getElementById('pf-tailrisk'); if(tailEl) tailEl.innerHTML=portfolioTailRiskHTML(d);
  const stressEl=document.getElementById('pf-stress'); if(stressEl) stressEl.innerHTML=portfolioStressHTML(d, c);
  const rcEl=document.getElementById('pf-riskcontrib'); if(rcEl) rcEl.innerHTML=portfolioRiskContribHTML(d, assets, corr);
  // Cluster accordion headers: every drag renormalizes ALL weights, not
  // just the dragged asset's own cluster, so every cluster's running
  // total needs refreshing here too, not only the one being dragged.
  const pct = roundPercentsTo100(d.w);
  const clusterPct = {};
  assets.forEach((a,i)=>{ clusterPct[a.cluster]=(clusterPct[a.cluster]||0)+pct[i]; });
  Object.keys(clusterPct).forEach(cl=>{
    const el=document.querySelector(`[data-cluster-total="${cl}"]`);
    if(el) el.textContent = clusterPct[cl]+'%';
  });
  // .term and .info-icon tooltips are pure CSS (:hover), so no JS re-attachment is needed here
}

let portfolioChartTimer=null;
function schedulePortfolioChartUpdate(delay){
  if(portfolioChartTimer) clearTimeout(portfolioChartTimer);

    if(document.getElementById('pf-frontier-echart')){
      // Chart already mounted: update the persistent ECharts instance in

      // replacing the DOM (which would dispose/recreate the instance and

      const {cloud, frontier, assetPoints, currentPoint} = computePortfolioFrontierData(d, assets, corr);

      chartEl.innerHTML=portfolioChartHTML(d, assets, corr);
    }
  }, delay===undefined?130:delay);
}

function calcHealthScore(){
  const h=L.health;
  const fundingRatio = h.capacity>0 ? Math.min(1, h.capacity/Math.max(1,h.totalSIP)) : 0;
  const funding=Math.round(fundingRatio*40);
  const emergency = h.emergencyStatus==='full'?20:h.emergencyStatus==='partial'?10:0;
  const stress = h.shockSurvives?25:5;
  const surplus = h.capacity > h.totalSIP;
  const discipline = surplus?15:5;
  return {funding, emergency, stress, discipline, total:funding+emergency+stress+discipline, fundingRatio};
}

/* --- B3: calculation engine ---
   Same statistical convention as the class exercise this extends
   (wealth class1.csv / Capital Allocation Line.xlsx): daily simple
   returns, POPULATION standard deviation and covariance (matches Excel's
   STDEV.P / COVAR, not the sample STDEV.S), annualised via
   (1+dailyMean)^tradingDaysPerYear - 1. One deliberate change from the
   worksheet: tradingDaysPerYear is measured from the actual fetched
   series (observation count / calendar-day span in years) rather than
   hardcoded to 246, so a thinly-traded instrument or a different
   exchange calendar never silently inherits NSE's specific convention.
   Hand cross-checked against the worksheet's own SBI figures before use
   (~29.9% annualised return, ~21.3% annualised stdev over the same
   251-session window) — see build notes. */

async function liveApiGet(path){
  const res = await fetch(path);
  let body;
  try { body = await res.json(); } catch(e){ throw new Error('The server sent back something that was not valid data.'); }
  if(!res.ok || (body && body.error)) throw new Error((body && body.error) || `Request failed (HTTP ${res.status})`);
  return body;
}
// Routes to the right /api/history query and hands back the normalised
// {id,label,currency,prices} shape src/worker.js promises. No client-side
// fallback numbers on failure, per this project's core rule — callers
// must surface the real error, never paper over it with a guess.
function liveFetchHistory(instrument){
  return instrument.type==='fund'
    ? liveApiGet(`/api/history?type=fund&scheme=${encodeURIComponent(instrument.symbol)}`)
    : liveApiGet(`/api/history?type=equity&symbol=${encodeURIComponent(instrument.symbol)}`);
}

function computeDailyReturns(prices){
  const rets=[];
  for(let i=1;i<prices.length;i++){
    const p0=prices[i-1].close, p1=prices[i].close;
    if(p0>0) rets.push({date:prices[i].date, r:(p1-p0)/p0});
  }
  return rets;
}
function computeReturnStats(prices){
  const rets=computeDailyReturns(prices);
  const n=rets.length;
  const mean=rets.reduce((s,x)=>s+x.r,0)/n;
  const variance=rets.reduce((s,x)=>s+(x.r-mean)*(x.r-mean),0)/n; // population, matches STDEV.P
  const sd=Math.sqrt(variance);
  const first=new Date(prices[0].date), last=new Date(prices[prices.length-1].date);
  const spanYears=Math.max(0.05, (last-first)/(365.25*24*3600*1000));
  const tradingDaysPerYear=n/spanYears;
  const annualReturn=Math.pow(1+mean, tradingDaysPerYear)-1;
  const annualVol=sd*Math.sqrt(tradingDaysPerYear);
  return {returns:rets, n, dailyMean:mean, dailySd:sd, tradingDaysPerYear, annualReturn, annualVol};
}
// Aligns two return series by date (different instruments can carry
// different trading calendars/holidays) before computing covariance.
function alignReturns(retsA, retsB){
  const mapB=new Map(retsB.map(x=>[x.date,x.r]));
  const a=[], b=[];
  retsA.forEach(x=>{ if(mapB.has(x.date)){ a.push(x.r); b.push(mapB.get(x.date)); } });
  return {a, b};
}
function populationCovariance(a, b){
  const n=a.length;
  const meanA=a.reduce((s,x)=>s+x,0)/n, meanB=b.reduce((s,x)=>s+x,0)/n;
  let cov=0; for(let i=0;i<n;i++) cov+=(a[i]-meanA)*(b[i]-meanB);
  return cov/n;
}
// Pairwise annualised covariance/correlation matrices, asset-count-agnostic.
function computeCovarianceMatrix(statsList){
  const n=statsList.length;
  const covAnnual=Array.from({length:n},()=>new Array(n).fill(0));
  const corr=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    if(i===j){ covAnnual[i][j]=statsList[i].annualVol*statsList[i].annualVol; corr[i][j]=1; continue; }
    const {a,b}=alignReturns(statsList[i].returns, statsList[j].returns);
    const dailyCov = a.length>10 ? populationCovariance(a,b) : 0;
    const days=(statsList[i].tradingDaysPerYear+statsList[j].tradingDaysPerYear)/2;
    covAnnual[i][j]=dailyCov*days;
    corr[i][j]=statsList[i].annualVol>0 && statsList[j].annualVol>0 ? covAnnual[i][j]/(statsList[i].annualVol*statsList[j].annualVol) : 0;
  }
  return {covAnnual, corr};
}
// Exactly-2-instrument closed-form frontier: sweep w across [0,1] (the
// worksheet's own approach for the two-risky-asset case — 5% steps
// there, finer here since it costs nothing). Uses the same
// portfolioReturn()/portfolioVariance() as every other frontier in this
// file, just called with n=2.
function twoAssetFrontier(retA, retB, sdA, sdB, corr, steps){
  if(steps===undefined) steps=101;
  const pts=[];
  for(let i=0;i<steps;i++){
    const w=i/(steps-1);
    const weights=[w,1-w];
    pts.push({ w, ret:portfolioReturn(weights,[retA,retB]), vol:Math.sqrt(portfolioVariance(weights,[sdA,sdB],[[1,corr],[corr,1]])) });
  }
  return pts;
}
// Closed-form global-minimum-variance weight for two assets, clamped to
// [0,1] since this app never offers shorting (true unconstrained min-var
// can fall outside that range at high correlation).
function minVarianceWeightTwoAsset(sdA, sdB, corr){
  const covAB=corr*sdA*sdB;
  const denom=sdA*sdA+sdB*sdB-2*covAB;
  if(Math.abs(denom)<1e-12) return 0.5;
  return Math.max(0, Math.min(1, (sdB*sdB-covAB)/denom));
}
// Closed-form tangency weight for two risky assets given a risk-free
// rate — the standard two-fund-separation result. Clamped to [0,1] for
// the same no-shorting reason as above.
function tangencyWeightTwoAsset(retA, retB, sdA, sdB, corr, rf){
  const covAB=corr*sdA*sdB;
  const exA=retA-rf, exB=retB-rf;
  const num=exA*sdB*sdB - exB*covAB;
  const den=exA*sdB*sdB + exB*sdA*sdA - (exA+exB)*covAB;
  if(Math.abs(den)<1e-12) return 0.5;
  return Math.max(0, Math.min(1, num/den));
}
// Capital Allocation Line: a straight line from (0, rf) through the
// tangency point, extended to maxLeverage x the tangency risk/return —
// mirrors the worksheet's own 0% / 100% / 200% three-point construction
// (borrowing at the risk-free rate to lever up past the tangency mix).
function capitalAllocationLine(rf, tanRet, tanVol, maxLeverage){
  if(maxLeverage===undefined) maxLeverage=2;
  if(tanVol<=0) return [{vol:0,ret:rf},{vol:0,ret:rf}];
  const sharpe=(tanRet-rf)/tanVol;
  const pts=[];
  for(let lev=0; lev<=maxLeverage+1e-9; lev+=maxLeverage/20) pts.push({vol:tanVol*lev, ret:rf+sharpe*tanVol*lev});
  return pts;
}
