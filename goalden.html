// Shared by all three results screens: what your money is actually
// invested in, and what it earns before vs after inflation eats into it.
// "Can I start smaller?" -- the same pot from a SIP that starts lower and
// rises 10% once a year (stepUpAnnualPlan, engine). The target is what the
// flat SIP itself grows to, so the two can never disagree about the goal.
const STEP_UP = 0.10;
// Starting lower is not cheaper: later money has less time to grow, so more
// has to go in overall. The offer carries both totals so the card can say so.
function stepUpOffer(sip, years, rate) {
  years = Math.round(years);
  if (!(sip > 0) || years < 3) return null;
  const target = accumulationSchedule({ sip: sip, rate: effectiveMonthlyRate(rate), periods: years * 12, due: true, stepUp: 0 }).finalBalance;
  const p = stepUpAnnualPlan(target, years, rate, STEP_UP);
  return { start: p.startSip, last: p.yearlySip[years - 1], paid: p.totalPaid, flatPaid: sip * 12 * years };
}
function stepUpPaidText(o, c) {
  return 'You would pay in ' + c.fmt(Math.round(o.paid)) + ' in total instead of ' + c.fmt(Math.round(o.flatPaid)) + ', because the later money has less time to grow.';
}
// "Is 12% a year from equity realistic?" -- answered from the real index
// history the Case screen already uses (marketSeries), not from opinion.
// Only the equity rate is tested: the debt and hybrid rates have no index
// history here to test them against, and the card says so.
const NUM_WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
function realityCardHtml(years, d, blendRate, c, cardClass, horizonNote) {
  if (!(years >= 3)) return '';
  const country = S.country;
  const series = marketSeries(country), name = marketName(country);
  const rr = returnReality(series, years, d.equity);
  const fy = y => country === 'US' ? String(y) : (y - 1) + '-' + String(y).slice(2);
  const pct = v => (v * 100).toFixed(1) + '%';
  const eq = (d.equity * 100).toFixed(0) + '%';
  // A dot per stretch on one line: filled if it matched or beat the plan's
  // rate, hollow if not (fill, not colour alone, so it reads in greyscale).
  const single = rr.count === 1;
  const W = 320, H = 60, pad = 16;
  const vals = rr.windows.map(w => w.cagr);
  const lo = Math.min.apply(null, vals.concat([d.equity])), hi = Math.max.apply(null, vals.concat([d.equity]));
  const x = v => pad + (v - lo) / ((hi - lo) || 1) * (W - 2 * pad);
  // Worst and best print as one label when there is a single stretch or the
  // two sit within ~80 units (e.g. 15.3% and 15.4%): two labels that close
  // overlap, and the right one runs off the edge.
  const merged = single || x(rr.best.cagr) - x(rr.worst.cagr) < 80;
  const mEnd = x(rr.best.cagr) > W / 2;
  const mono = 'font-family="Spline Sans Mono, monospace"';
  const dots = rr.windows.map(w => w.cagr >= d.equity - 1e-9
    ? '<circle cx="' + x(w.cagr).toFixed(1) + '" cy="30" r="4" fill="#2557C7" fill-opacity=".7"/>'
    : '<circle cx="' + x(w.cagr).toFixed(1) + '" cy="30" r="3.6" fill="none" stroke="#56698A" stroke-width="1.4"/>').join('');
  const ax = x(d.equity), anchor = ax > W - 50 ? 'end' : (ax < 50 ? 'start' : 'middle');
  const zero = lo < 0 && x(0) - x(lo) > 44 && x(hi) - x(0) > 44
    ? '<line x1="' + x(0) + '" x2="' + x(0) + '" y1="20" y2="40" stroke="rgba(20,40,63,.3)"/><text x="' + x(0) + '" y="56" font-size="10.5" text-anchor="middle" fill="#56698A" ' + mono + '>0%</text>' : '';
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" style="display:block;margin:12px 0 4px;max-width:420px" aria-label="' +
    (single
      ? 'The one real ' + rr.years + '-year stretch of the ' + name + ' returned ' + pct(rr.worst.cagr) + ' a year, against the plan\'s ' + eq + '.'
      : rr.count + ' real ' + rr.years + '-year stretches of the ' + name + ', from ' + pct(rr.worst.cagr) + ' to ' + pct(rr.best.cagr) + ' a year; ' + rr.beat + ' of them at or above the plan\'s ' + eq + '.') + '">' +
    zero +
    '<line x1="' + ax + '" x2="' + ax + '" y1="12" y2="44" stroke="#14283F" stroke-width="1.5" stroke-dasharray="3 2"/>' +
    '<text x="' + ax + '" y="9" font-size="10.5" text-anchor="' + anchor + '" fill="#14283F" ' + mono + '>plan ' + eq + '</text>' +
    dots +
    (merged
      ? '<text x="' + (mEnd ? x(rr.best.cagr) : x(rr.worst.cagr)) + '" y="56" font-size="10.5" text-anchor="' + (mEnd ? 'end' : 'start') + '" fill="#56698A" ' + mono + '>' + (single ? pct(rr.worst.cagr) : pct(rr.worst.cagr) + '\u2013' + pct(rr.best.cagr)) + '</text>'
      : '<text x="' + x(rr.worst.cagr) + '" y="56" font-size="10.5" text-anchor="start" fill="#56698A" ' + mono + '>' + pct(rr.worst.cagr) + '</text>' +
        '<text x="' + x(rr.best.cagr) + '" y="56" font-size="10.5" text-anchor="end" fill="#56698A" ' + mono + '>' + pct(rr.best.cagr) + '</text>') +
    '</svg>';
  const n = rr.years, sep = rr.separate;
  const priceNote = country === 'US'
    ? 'S&amp;P 500 figures to 2015 are price-only (2016 on include dividends), so the early stretches understate what a fund earned.'
    : 'The Sensex figures are price-only: the dividends an index fund reinvests come on top.';
  return '<div class="' + cardClass + '">' +
    '<div class="chart-title">Is ' + eq + ' a year from equity realistic?</div>' +
    '<div class="chart-caption">Your plan\'s equity rate, checked against ' + (single ? 'the one real ' : 'every real ') + n + '-year stretch of the ' + name + ', ' + fy(rr.first) + ' to ' + fy(rr.last) +
      (rr.capped ? ' (your ' + years + ' years is longer than this history, so its longest stretch is used)' : (horizonNote || '')) + '.</div>' +
    svg +
    '<div class="alloc-return-row" style="grid-template-columns:repeat(' + (single ? 2 : 3) + ',minmax(0,1fr))">' +
    (single
      ? '<div><div class="alloc-return-label">That stretch</div><div class="alloc-return-value">' + pct(rr.worst.cagr) + '</div></div>'
      : '<div><div class="alloc-return-label">Worst stretch</div><div class="alloc-return-value">' + pct(rr.worst.cagr) + '</div></div>' +
        '<div><div class="alloc-return-label">Best stretch</div><div class="alloc-return-value">' + pct(rr.best.cagr) + '</div></div>') +
    '<div><div class="alloc-return-label">At or above ' + eq + '</div><div class="alloc-return-value">' + rr.beat + ' of ' + rr.count + '</div></div>' +
    '</div>' +
    '<div class="gr-note" style="margin-top:10px">' + (single
        ? 'A filled dot matched or beat ' + eq + ', a hollow one fell short. This stretch began in ' + fy(rr.worst.startYear) + '. This history holds only one ' + n + '-year period, so it shows a single outcome, not a range. '
        : 'Filled dots matched or beat ' + eq + '. The worst ' + n + '-year stretch began in ' + fy(rr.worst.startYear) + ', the best in ' + fy(rr.best.startYear) + '. ' +
          'The stretches overlap, so this history holds only ' + (NUM_WORDS[sep] || sep) + ' separate ' + n + '-year period' + (sep === 1 ? '' : 's') + ': it shows the range, it can\'t prove a rate. ') +
      priceNote + ' Every historical figure here is before inflation and before a fund\'s costs. The plan\'s blended ' + pct(blendRate) + ' also counts ' + (d.debt * 100).toFixed(0) + '% for debt and ' + (d.hybrid * 100).toFixed(0) + '% for hybrid, which this doesn\'t test.</div>' +
    '</div>';
}
function allocationCardHtml(preRate, d, rLabel, sip) {
  const a = riskAllocation(), c = cfg();
  const real = realRate(preRate, d.inflation);
  // Ink for both figures: red is only for a warning that has fired, and a
  // real return below zero already reads as a minus sign.
  return '<div class="chart-card"><div class="chart-title">Where this money would sit</div>' +
    '<div class="chart-caption">' + allocCaption(a.eq, a.de, a.hy, sip, c) + ' An illustrative mix for a &quot;'+rLabel+'&quot; investor. Real fund selection should match your actual comfort with risk.</div>' +
    allocationStrip(a.eq, a.de, a.hy, 'alloc-strip', sip, c) +
    '<div class="alloc-return-row">' +
    '<div><div class="alloc-return-label">Expected return</div><div class="alloc-return-value">'+(preRate*100).toFixed(1)+'%</div></div>' +
    '<div><div class="alloc-return-label">After '+(d.inflation*100).toFixed(0)+'% inflation</div><div class="alloc-return-value">'+(real*100).toFixed(1)+'%</div></div>' +
    '</div></div>';
}

// A Fixed Deposit is the single most common thing an Indian saver
// already knows and already trusts, which makes it the most honest
// benchmark for "why bother investing at all." Same monthly amount, same
// number of years, only the destination changes. FD rate is grounded in
// current typical multi-year bank FD rates (verified against several
// major banks, mid-2026), not the best promotional rate available, nor
// the lowest.
// A slab no longer offered (5% or 10%, saved by an older build) falls back to the default.
function fdSlabPct() { return TAX_IN.newRegimeSlabs.includes(S.taxSlab) ? S.taxSlab : TAX_IN.defaultSlab; }
// planSipValue is what the monthly SIP alone grows to in the plan (gapCorpus
// for retirement and education, gap for a purchase goal). Savings the person
// already has are left out of BOTH sides: before, the plan side got them and
// the FD side didn't, which flattered the plan.
function fdComparisonCardHtml(sip, years, planSipValue, d, c, hasAcc) {
  const mFd = effectiveMonthlyRate(d.fdRate);
  const fdFinal = accumulationSchedule({sip: sip, rate: mFd, periods: years*12, due: true, stepUp: 0}).finalBalance;
  const preGap = planSipValue - fdFinal;
  const title = '<div class="chart-title">The same ' + c.fmt(Math.round(sip)) + '/month, in a Fixed Deposit instead</div>';
  // hasAcc: the retirement plan counted EPF, PPF and NPS, which are left out of both sides too.
  const leftOut = [(S.existingSavings || 0) > 0 ? 'savings you already have' : '', hasAcc ? 'your EPF, PPF and NPS' : ''].filter(Boolean);
  const savedNote = leftOut.length ? ' Only the monthly SIP is compared; ' + leftOut.join(' and ') + ' are left out of both sides.' : '';
  if (c.code !== 'IN') {
    return '<div class="chart-card fd-card">' + title +
      '<div class="chart-caption">A typical multi-year bank CD, around ' + (d.fdRate*100).toFixed(1) + '%/yr, before tax (tax is modelled for India only).</div>' +
      '<div class="alloc-return-row">' +
      '<div><div class="alloc-return-label">This SIP in the plan</div><div class="alloc-return-value">' + c.compact(planSipValue) + '</div></div>' +
      '<div><div class="alloc-return-label">Same money in a CD</div><div class="alloc-return-value">' + c.compact(fdFinal) + '</div></div>' +
      '</div>' +
      '<div class="gr-note" style="margin-top:10px">Over ' + years + ' years, staying in a CD would leave you ' + (preGap >= 0 ? 'short by' : 'ahead by') + ' <b style="color:var(--paper)">' + c.compact(Math.abs(preGap)) + '</b>, purely from the difference in return.' + savedNote + '</div>' +
      '</div>';
  }
  const slabPct = fdSlabPct(), slab = slabPct / 100;
  const plan = postTaxPlanValue(planSipValue, sip * 12 * years, riskAllocation(), slab);
  const fdPost = postTaxFdFinal(sip, years, d.fdRate, slab);
  const postGap = plan.value - fdPost;
  const chips = TAX_IN.newRegimeSlabs.map(v => '<button type="button" class="chip' + (v === slabPct ? ' selected' : '') + '" data-fd-slab="' + v + '" aria-pressed="' + (v === slabPct) + '">' + (v === 0 ? '0% (income up to ₹12 L)' : v + '%') + '</button>').join('');
  // The figures that rebuild this card on a chip tap ride on the card itself,
  // so the tap redraws only the card: a full render() would close the
  // details panel it sits in and jump to the top.
  return '<div class="chart-card fd-card" data-sip="' + sip + '" data-years="' + years + '" data-plan="' + planSipValue + '" data-acc="' + (hasAcc ? 1 : 0) + '">' + title +
    '<div class="chart-caption">A typical multi-year bank FD, around ' + (d.fdRate*100).toFixed(1) + '%/yr. Both sides after tax at your income-tax slab.</div>' +
    '<div class="hero-sub" style="text-align:left;margin-top:8px">Your slab (new regime)' + (S.taxSlab == null ? ', ' + slabPct + '% until you pick one' : '') + ':</div>' +
    '<div class="chips slab-chips" role="group" aria-label="Your income-tax slab">' + chips + '</div>' +
    '<div class="alloc-return-row" style="margin-top:12px">' +
    '<div><div class="alloc-return-label">This SIP in the plan, after tax</div><div class="alloc-return-value">' + c.compact(plan.value) + '</div></div>' +
    '<div><div class="alloc-return-label">Same money in an FD, after tax</div><div class="alloc-return-value">' + c.compact(fdPost) + '</div></div>' +
    '</div>' +
    '<div class="gr-note" style="margin-top:10px">After tax at ' + slabPct + '%, an FD would leave you ' + (postGap >= 0 ? 'short by' : 'ahead by') + ' <b style="color:var(--paper)">' + c.compact(Math.abs(postGap)) + '</b> over ' + years + ' years (' + c.compact(Math.abs(preGap)) + ' before tax' + (preGap > 0 && Math.abs(postGap - preGap) < 0.05 * preGap ? ': tax barely moves the gap, because the FD pays tax every year and the plan pays once, at the end' : '') + ').' + savedNote + '</div>' +
    '<div class="hero-sub" style="text-align:left;margin-top:8px;font-size:11px">' + TAX_IN.asOf + ' rules, new tax regime, 4% cess. FD interest is taxed every year at your slab. ' + 'The plan side is taxed once, as if the whole pot were withdrawn in one year: equity and hybrid gains at 12.5% above ₹1.25 lakh, debt gains at your slab. ' + 'A real one-year withdrawal this large would also pay surcharge and push the debt gains into a higher slab (more tax); spreading it over several years uses the ₹1.25 lakh exemption every year (less).' + '</div>' +
    '</div>';
}

// =========================================================================
// "THE CASE" -- an optional, deeper screen reached from any results screen.
// Built for the person who has just seen a number and now wants to know
// whether to actually believe it: why markets, why not just an FD, why is
// "volatility" not the same thing as "losing your capital." Every figure
// here traces to real, cited historical data (see the data block above),
// not an invented illustration. No name, email, or any personal
// information is collected or required anywhere on this screen.
// =========================================================================
const GOLD_RATE = { IN: 0.109, US: 0.056 }; // India: RBI Handbook of Statistics, 42yr CAGR to Apr 2026. US: NYU Stern (Damodaran), 1928-2024.
const HOUSE_RATE_RANGE = { IN: [0.08, 0.10], US: [0.035, 0.045] }; // Broad, widely-cited long-run ranges; real estate returns vary enormously by city and property, more than any other asset class here, on purpose not reduced to one falsely precise number.

function sCase() {
  const c = cfg(), series = marketSeries(S.country), name = marketName(S.country);
  const nYears = series.length;
  const raceAmt = S.country==='US' ? 10000 : 100000;

  // ---- Section 1: The Race ----
  const racePath = marketGrowthPath(series, 0, nYears, raceAmt);
  const marketFinal = racePath[racePath.length-1].v;
  const fdPath = compoundPath(c.d.fdRate, nYears, raceAmt, series[0].y-1);
  const fdFinal = fdPath[fdPath.length-1].v;
  const goldPath = compoundPath(GOLD_RATE[S.country], nYears, raceAmt, series[0].y-1);
  const goldFinal = goldPath[goldPath.length-1].v;
  const firstYear = series[0].y - 1, lastYear = series[series.length-1].y;

  // ---- Section 2: The Time Machine ----
  const tmYears = Math.min(15, nYears-1);
  const worst15 = worstWindow(series, tmYears);
  const tmDefaultIdx = worst15.startIdx;

  // ---- Section 3: Holding period explorer ----
  const defaultHold = 5;
  const holdData = rollingWindows(series, defaultHold);
  const holdLosing = holdData.filter(w=>w.finalMultiple<1).length;

  // ---- Section 4 supporting stat: what an FD really keeps after inflation+tax ----
  const fdReal = realRate(c.d.fdRate, c.d.inflation);
  // FD interest is taxed every year at the slab: the same slab the results'
  // FD card uses (20% until the person picks one there), plus 4% cess.
  // The US has no slab chips and no cess: an illustrative 22% federal
  // bracket (state tax left out), as a fixed example.
  const caseIN = c.code === 'IN';
  const caseSlab = caseIN ? fdSlabPct() : 22;
  const fdAfterTax = c.d.fdRate * (1 - caseSlab/100 * (caseIN ? 1 + TAX_IN.cess : 1));
  const fdAfterTaxReal = realRate(fdAfterTax, c.d.inflation);

  // ---- Section 5: housing ----
  const hRange = HOUSE_RATE_RANGE[S.country];

  return `<div class="case-wrap">
  <div class="case-hero">
    <div class="case-eyebrow">Before you decide</div>
    <div class="case-title">Why trust the market with this money at all?</div>
    <div class="case-sub">Every number on this screen comes from real, published historical data (sources noted below each section), not an invented example. Nothing here is personalised, saved, or sent anywhere &ndash; it's the same public market history for anyone who opens this.</div>
  </div>

  <div class="case-section">
    <h4>The race: ${c.compact(raceAmt)}, three destinations</h4>
    <div class="case-cap">The same lump sum, placed in ${firstYear} and left completely untouched for ${nYears} years, through every real ${name} up-year and down-year in between.</div>
    ${raceChart(racePath, goldPath, fdPath, 'case-race')}
    <div class="race-legend"><span><i style="border-top:3px solid #1F8A70"></i>${name}</span><span><i style="border-top:2px solid #2557C7"></i>Gold</span><span><i style="border-top:2px dashed #B8740F"></i>Bank FD</span></div>
    <div class="race-stats">
      <div class="race-stat"><div class="rs-label">${name}</div><div class="rs-val" style="color:#256F55">${c.compact(marketFinal)}</div></div>
      <div class="race-stat"><div class="rs-label">GOLD</div><div class="rs-val" style="color:var(--gold)">${c.compact(goldFinal)}</div></div>
      <div class="race-stat"><div class="rs-label">BANK FD</div><div class="rs-val" style="color:#8A5608">${c.compact(fdFinal)}</div></div>
    </div>
    <div class="case-cap" style="margin-bottom:0">${firstYear} to ${lastYear}, ${nYears} years. ${name} figure uses the real annual return each year, compounded, not an average smoothed into a straight line ${infoIconD1('Source: '+(S.country==='US'?'a compiled S&P 500 annual-return series, 1928-2015 price return, 2016-2024 total return with dividends reinvested.':'a compiled Sensex fiscal-year (April-April) return series, freefincal.com, 1979-80 through 2022-23, sourced from BSE closing values.'))}. Gold: ${(GOLD_RATE[S.country]*100).toFixed(1)}%/yr, ${S.country==='US'?'NYU Stern (Damodaran) historical dataset, 1928-2024.':'RBI Handbook of Statistics gold price data, 42-year CAGR to April 2026.'} FD: ${(c.d.fdRate*100).toFixed(1)}%/yr, a typical current multi-year bank rate held constant for illustration, which is generous to the FD since real FD rates have varied a lot across these decades.</div>
  </div>

  <div class="case-section">
    <h4>The time machine: what if you had the worst possible timing?</h4>
    <div class="case-cap">Drag to any real starting year. This shows what ${c.compact(raceAmt)} put into ${name} that year actually became, ${tmYears} years later, using what really happened, crash years included.</div>
    <div class="case-slider-row">
      <div class="case-slider-label"><span>Starting year</span><b id="tm-year-label">${series[tmDefaultIdx].y - 1}</b></div>
      <input type="range" id="tmSlider" min="0" max="${nYears-tmYears-1}" step="1" value="${tmDefaultIdx}">
    </div>
    <div id="tm-result"></div>
    <div class="case-cap" style="margin-top:10px;margin-bottom:0">Defaults to the single worst ${tmYears}-year starting point in ${nYears} years of real data &ndash; not a cherry-picked good one.</div>
  </div>

  <div class="case-section">
    <h4>Volatility is not the same thing as losing your capital</h4>
    <div class="case-cap">Every point on this line is a real ${nYears - 1}-year stretch of ${name} history: the share of them that ended with less money than they started with, at that exact holding length. Drag to inspect any point.</div>
    ${riskShrinkChart(series, Math.min(25,nYears-2), 'case-riskshrink', 130, defaultHold)}
    <div class="case-slider-row">
      <div class="case-slider-label"><span>Holding period</span><b id="hold-yrs-label">${defaultHold} years</b></div>
      <input type="range" id="holdSlider" min="1" max="${Math.min(25,nYears-2)}" step="1" value="${defaultHold}">
    </div>
    <div id="hold-result"></div>
    <div class="case-cap" style="margin-top:10px;margin-bottom:0">This is genuinely index-level data: a diversified 50-stock index, not one company. A single stock can still go to zero no matter how long you hold it &ndash; that risk doesn't shrink with time, which is exactly why diversification (not just patience) is doing real work here.</div>
  </div>

  <div class="case-section">
    <h4>Why does the market grow at all?</h4>
    <div class="case-cap">Not a promise. A mechanical chain that has to break for equities to stop working long-term.</div>
    <div class="growth-chain">
      <div class="gc-node">More people work &amp; get more productive</div><span class="gc-arrow">&rarr;</span>
      <div class="gc-node">Companies sell more, earn more</div><span class="gc-arrow">&rarr;</span>
      <div class="gc-node">Owning a share means owning that growing profit</div><span class="gc-arrow">&rarr;</span>
      <div class="gc-node">Share prices follow earnings, over long periods</div>
    </div>
    <div class="case-cap">This is also exactly why a Fixed Deposit quietly loses, even though it feels "safe": it pays you a fixed rupee amount that has no claim on any of that growth.</div>
    <div class="compare-row">
      <div class="compare-card"><div class="cc-label">FD, AFTER INFLATION</div><div class="cc-val" style="color:${fdReal>0?'#256F55':'#9C4A2C'}">${(fdReal*100).toFixed(1)}%/yr</div><div class="cc-note">Before tax is even taken out</div></div>
      <div class="compare-card"><div class="cc-label">FD, AFTER TAX &amp; INFLATION</div><div class="cc-val" style="color:${fdAfterTaxReal>0?'#256F55':'#9C4A2C'}">${(fdAfterTaxReal*100).toFixed(1)}%/yr</div><div class="cc-note">${!caseIN ? 'At an illustrative 22% federal bracket (state tax not included), taxed every year whether or not you touch the money' : caseSlab===0 ? 'At a 0% slab there is no tax on it, so this is inflation alone' : 'At a '+caseSlab+'% slab plus 4% cess'+(S.taxSlab==null?' (pick yours on the results’ FD card)':'')+', taxed every year whether or not you touch the money'}</div></div>
    </div>
    <div class="case-cap" style="margin-bottom:0">The "safety" of an FD is real (you will never see the number go down) &ndash; but the purchasing power sitting behind that number can still shrink every single year, silently, which a glance at the account balance will never show you.</div>
  </div>

  <div class="case-section">
    <h4>What about property, honestly?</h4>
    <div class="case-cap">Real estate isn't a bad asset. It's a fair comparison, including the parts that don't fit neatly into a percentage.</div>
    <div class="compare-row">
      <div class="compare-card"><div class="cc-label">${S.country==='US'?'US HOUSING, LONG-RUN':'INDIAN HOUSING, LONG-RUN'}</div><div class="cc-val">${(hRange[0]*100).toFixed(1)}&ndash;${(hRange[1]*100).toFixed(1)}%/yr</div><div class="cc-note">Nominal, before rent/costs. Varies enormously by city and property &ndash; a wide range on purpose, not false precision.</div></div>
      <div class="compare-card"><div class="cc-label">${name.toUpperCase()}, SAME WINDOW</div><div class="cc-val" style="color:#256F55">${(fullSeriesCAGR(series)*100).toFixed(1)}%/yr</div><div class="cc-note">${nYears} years, real data, shown above</div></div>
    </div>
    <div class="case-cap" style="margin-bottom:0">What a percentage doesn't show: buying and selling a house costs 5-10% in fees and stamp duty each way; it's one asset in one city, no diversification at all; you can't sell one bedroom if you need part of the money; and it takes work (tenants, repairs, vacancy) that a fund doesn't. None of that makes property a bad choice &ndash; it makes it a different kind of asset, with its own real tradeoffs, not a simple "better or worse" than equity.</div>
  </div>

  <div class="case-back-row"><button id="caseBackBtn">Back to my plan</button></div>
  </div>`;
}
function fullSeriesCAGR(series){
  let bal=1; series.forEach(r=>bal*=(1+r.r));
  return Math.pow(bal, 1/series.length)-1;
}
function infoIconD1(text){
  return ' <span class="term-i" data-def="'+text.replace(/"/g,'&quot;')+'">i</span>';
}
function renderTimeMachine(startIdx){
  const c = cfg(), series = marketSeries(S.country);
  const tmYears = Math.min(15, series.length-1);
  const raceAmt = S.country==='US' ? 10000 : 100000;
  const path = marketGrowthPath(series, startIdx, tmYears, raceAmt);
  const finalVal = path[path.length-1].v;
  const worstYearInPath = series.slice(startIdx, startIdx+tmYears).reduce((w,r)=>r.r<w.r?r:w, series[startIdx]);
  const gained = finalVal > raceAmt;
  return timeMachineChart(path, 'case-timemachine') +
    `<div class="case-callout ${gained?'good':''}">
    ${c.compact(raceAmt)} invested at the start of <b>${series[startIdx].y-1}</b>, held ${tmYears} years through a ${(worstYearInPath.r*100).toFixed(0)}% single worst year (${worstYearInPath.y}), became <b style="color:${gained?'#256F55':'#9C4A2C'}">${c.compact(finalVal)}</b> by ${series[startIdx+tmYears-1].y}.
  </div>`;
}
function renderHoldResult(years){
  const series = marketSeries(S.country);
  const w = rollingWindows(series, years);
  const losing = w.filter(x=>x.finalMultiple<1).length;
  const pct = Math.round(100*losing/w.length);
  const worst = worstWindow(series, years);
  return `<div class="holdbar-track">
    <div class="holdbar-seg" style="width:${100-pct}%;background:#1F8A70"></div>
    <div class="holdbar-seg" style="width:${pct}%;background:#B8740F"></div>
  </div>
  <div class="holdbar-legend"><span>${100-pct}% ended with more money</span><span>${pct}% ended with less</span></div>
  <div class="case-callout ${pct===0?'good':''}" style="margin-top:12px">
    Across ${w.length} real ${years}-year windows in the data, the worst one still averaged <b style="color:${worst.cagr>0?'#256F55':'#9C4A2C'}">${(worst.cagr*100).toFixed(1)}%/yr</b>${pct===0?', and none of them lost money.':'.'}
  </div>`;
}
function attachCaseHandlers(){
  const tmSlider = document.getElementById('tmSlider');
  const tmResult = document.getElementById('tm-result');
  const tmLabel = document.getElementById('tm-year-label');
  if (tmSlider) {
    const series = marketSeries(S.country);
    tmResult.innerHTML = renderTimeMachine(parseInt(tmSlider.value));
    tmSlider.addEventListener('input', () => {
      const idx = parseInt(tmSlider.value);
      tmLabel.textContent = series[idx].y - 1;
      tmResult.innerHTML = renderTimeMachine(idx);
    });
  }
  const holdSlider = document.getElementById('holdSlider');
  const holdResult = document.getElementById('hold-result');
  const holdLabel = document.getElementById('hold-yrs-label');
  if (holdSlider) {
    holdResult.innerHTML = renderHoldResult(parseInt(holdSlider.value));
    holdSlider.addEventListener('input', () => {
      const yrs = parseInt(holdSlider.value);
      holdLabel.textContent = yrs + (yrs===1?' year':' years');
      holdResult.innerHTML = renderHoldResult(yrs);
      // Fast path: the risk-shrink chart itself never changes (it plots
      // every holding length at once), so only move the marker dot/line
      // to the newly selected point rather than regenerating the SVG.
      updateRiskShrinkMarker(yrs);
    });
  }
  const backBtn2 = document.getElementById('caseBackBtn');
  if (backBtn2) backBtn2.addEventListener('click', () => { S.si = flow().indexOf('results'); render(); });
  // The "i" tips (.term-i) open from gtip.js, which delegates from document: nothing to wire per render.
}


// "Use your Rs 1.25 lakh a year": tax-gain harvesting on the equity part of the
// SIP, modelled lot by lot in harvestPlan (engine). Shown in the details panel
// after the FD card. India only; hidden when no SIP is needed, when fewer than
// two years could be harvested (a goal under 4 years away: the saving is a few
// thousand rupees and "once" is not a yearly habit), and when the gains never
// pass the allowance (then there is nothing to say). Every rate in the text is
// read from TAX_IN, so the card cannot drift from the engine when the rules change.
function harvestCardHtml(r, c) {
  if (c.code !== 'IN' || r.alreadyMet || r.yrs < 4) return '';
  const a = riskAllocation(), share = a.eq + a.hy;   // hybrid taxed like equity, as in the FD card
  if (share <= 0) return '';
  const rate = (a.eq * r.d.equity + a.hy * r.d.hybrid) / share, monthly = r.sip * share;
  const h = harvestPlan({ monthly, years: r.yrs, rate });
  if (h.saved < 1 || h.harvests < 2) return '';
  const pct = v => +(v * 100).toFixed(1);
  const lt = TAX_IN.equityLtcg, cess = TAX_IN.cess;
  const allowance = '₹' + (TAX_IN.equityLtcgExemption / 1e5) + ' lakh';   // "₹1.25 lakh" (compact() would round it to ₹1.3 L)
  const perYear = h.booked / h.harvests;
  const today = h.saved / Math.pow(1 + r.d.inflation, r.yrs);
  deferChartInit(() => renderHarvestChart('chart-harvest', h, c));
  return '<div class="chart-card" id="sec-harvest"><div class="chart-title">Use your ' + allowance + ' tax-free allowance every year</div>' +
    '<div class="chart-caption">Each financial year the first ' + allowance + ' of long-term gains on equity funds is tax-free. Selling units that hold that much gain and buying them straight back books the gain tax-free and raises what those units cost you, so less is taxed when you finally sell.</div>' +
    '<div class="alloc-return-row">' +
    '<div><div class="alloc-return-label">Tax if all sold at ' + S.retireAge + '</div><div class="alloc-return-value">' + c.compact(h.taxPlain) + '</div></div>' +
    '<div><div class="alloc-return-label">Harvesting every year</div><div class="alloc-return-value">' + c.compact(h.taxHarvested) + '</div></div>' +
    '</div>' +

function renderHarvestChart(chartId, h, c) {

}

let resultNavObserver = null;
const JUMP_LABELS = [[/grows/i, 'Growth'], [/spent/i, 'Spending'], [/fixed deposit/i, 'vs FD'], [/would sit|\bmix\b/i, 'Mix'], [/realistic/i, 'Realistic?'], [/allowance|tax/i, 'Tax'], [/different age/i, 'Other ages'], [/waited/i, 'Waiting']];
function wireResultNav() {
  const sc = document.querySelector('#stage .result-scroll'), bar = document.getElementById('sumBar'), hero = document.querySelector('#stage .hero-number');
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (sc && bar && hero && 'IntersectionObserver' in window) {
    if (resultNavObserver) resultNavObserver.disconnect();   // the result is re-rendered by every what-if tap
    resultNavObserver = new IntersectionObserver(([e]) => { bar.hidden = e.isIntersecting || e.boundingClientRect.top > e.rootBounds.top; }, { root: sc, threshold: 0 });
    resultNavObserver.observe(hero);
    // "Adjust" opens the live canvas's panel once that exists (looked up on click: it is built after this runs).
    const adj = bar.querySelector('[data-sum="adjust"]');
    if (adj && typeof liveCanvasSync === 'function') {
      adj.hidden = false;
      adj.addEventListener('click', () => {
        const lcBar = document.querySelector('#liveCanvas .lc-bar');
        if (!lcBar) return;
        if (lcBar.getAttribute('aria-expanded') !== 'true') lcBar.click();
        lcBar.focus();
      });
    }
    bar.querySelector('[data-sum="top"]').addEventListener('click', () => { sc.scrollTo({ top: 0, behavior: still ? 'auto' : 'smooth' }); hero.setAttribute('tabindex', '-1'); hero.focus({ preventScroll: true }); });
  }
  const inner = document.querySelector('#bp .assump-inner');
  if (!inner) return;
  const titles = [...inner.querySelectorAll('.chart-title, .delay-title')];
  if (titles.length < 3) return;
  const nav = document.createElement('nav');
  nav.className = 'jump-bar'; nav.setAttribute('aria-label', 'Jump to a section');
  titles.forEach((t) => {
    const text = t.textContent.trim(), hit = JUMP_LABELS.find(([re]) => re.test(text));
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = hit ? hit[1] : text.split(' ').slice(0, 3).join(' ');
    b.setAttribute('aria-label', 'Jump to: ' + text);
    b.addEventListener('click', () => {
      const card = t.closest('.chart-card, .delay-card') || t;
      card.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: 'start' });
      t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true });
    });
    nav.append(b);
  });
  inner.prepend(nav);
}

function scrollToPanel(panel) {
  // The flex/overflow layout here doesn't always resolve to one clean
  // scrollable ancestor (varies by content length and screen), so walk up
  // from the panel and scroll whichever container actually has overflow,
  // falling back to the window if none do.
  let el = panel.parentElement;
  while (el && el !== document.body) {
    if (el.scrollHeight > el.clientHeight + 4) {
      el.scrollTo({ top: panel.offsetTop - el.offsetTop - 12, behavior: 'smooth' });
      return;
    }
    el = el.parentElement;
  }
  window.scrollTo({ top: panel.getBoundingClientRect().top + window.scrollY - 12, behavior: 'smooth' });
}

// Phase 9 — federated read-across. read_other_page lets the advisor READ (never
// write) another door's saved localStorage snapshot. The result is a separate,
// clearly-labeled object the model can quote from — it is NEVER merged into S,
// so a field that exists on multiple pages (e.g. country) can't be silently
// overwritten by last-write-wins.
const OTHER_PAGE_KEYS = { door2: 'goaldenD2State', lab: 'goaldenLabState' };
const OTHER_PAGE_LABELS = { door2: 'The Full Plan', lab: 'The Lab' };
function readOtherPage(page) {
  const key = OTHER_PAGE_KEYS[page];
  if (!key) return { ok:false, error:'Unknown page "'+page+'". Valid: '+Object.keys(OTHER_PAGE_KEYS).join(', ') };
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return { ok:true, page: page, asOf: null, state: null, note: 'No saved data from ' + page + ' yet.' };
    const saved = JSON.parse(raw);
    const state = Object.assign({}, saved);
    const asOf = state._savedAt || null;
    delete state._savedAt;
    return { ok:true, page: page, asOf: asOf, state: state };
  } catch (e) {
    return { ok:false, error: 'Could not read saved data for ' + page + '.', page: page };
  }
}

// Phase 10 — real portfolio comparison, 2-4 instruments. The pure math
// (computeReturnStats, computeCovarianceMatrix, twoAssetFrontier,
// minVarianceWeightTwoAsset, tangencyWeightTwoAsset, capitalAllocationLine,
// multiAssetFrontier, liveFrontierChartOption) lives in the shared
// goalden-engine.js; this page adds only the fetch/tool plumbing and a
// floating chart panel. Search/add are real Yahoo/MFAPI proxies via the
// same /api/* routes the Lab uses.
async function liveApiGet(path){
  const res = await fetch(path);
  let body;
  try { body = await res.json(); } catch(e){ throw new Error('The server sent back something that was not valid data.'); }
  if(!res.ok || (body && body.error)) throw new Error((body && body.error) || `Request failed (HTTP ${res.status})`);
  return body;
}
let lastFrontierData = null;
let lastComparisonResult = null;
function portfolioRf(){ return S.country === 'US' ? 0.04 : 0.065; }
async function searchInstruments(query){
  const q = String(query || '').trim();
  if(!q) return JSON.stringify({ ok:false, error:'Missing search query.' });
  try {
    const list = await liveApiGet('/api/symbolsearch?q=' + encodeURIComponent(q));
    return JSON.stringify({ ok:true, results: (Array.isArray(list) ? list : []).slice(0, 10) });
  } catch(e) {
    return JSON.stringify({ ok:false, error: 'Search failed: ' + ((e && e.message) || e) });
  }
}
async function addInstrument(symbol, force){
  const sym = String(symbol || '').trim().toUpperCase();
  if(!sym) return JSON.stringify({ ok:false, error:'Missing symbol.' });
  if(S.instruments.length >= 4) return JSON.stringify({ ok:false, error:'Already at the 4-instrument limit — remove one first.' });
  if(S.instruments.some(function(it){ return it.symbol.toUpperCase() === sym; })) return JSON.stringify({ ok:false, error: sym + ' is already added.' });
  const isFund = /^\d{5,}$/.test(sym);
  try {
    const raw = await liveApiGet(isFund ? ('/api/history?type=fund&scheme=' + encodeURIComponent(sym)) : ('/api/history?type=equity&symbol=' + encodeURIComponent(sym)));
    const stats = computeReturnStats(raw.prices, isFund);
    if(stats.quality.level === 'unusable' && !force){
      return JSON.stringify({ ok:false, canForce:true, error: 'That instrument failed a data-quality check: ' + (stats.quality.flags || []).map(function(f){ return f.msg; }).join(' ') + ' This app can\'t independently re-verify the fetched price history — if you\'re confident this is genuine market data, call add_instrument again with force:true to include it anyway; every figure for it will then be marked unverified.' });
    }
    S.instruments.push({ symbol: sym, label: raw.label || sym, currency: raw.currency, prices: raw.prices, stats: stats });
    persistState();
    const out = { ok:true, added: { symbol: sym, label: raw.label || sym }, quality: stats.quality };
    if(stats.quality.level === 'unusable') out.warning = 'Added despite failing the data-quality check, at the user\'s insistence — every figure for this instrument is unverified and must be labelled as such, not treated the same as the others.';
    return JSON.stringify(out);
  } catch(e) {
    return JSON.stringify({ ok:false, error:'Could not fetch ' + sym + ': ' + ((e && e.message) || e) });
  }
}
async function getFinancialStatements(symbol){
  const sym = String(symbol || '').trim().toUpperCase().replace(/\.(NS|BO)$/, '');
  if(!sym) return JSON.stringify({ ok:false, error:'Missing symbol.' });

}
function removeInstrument(symbol){
  const sym = String(symbol || '').trim().toUpperCase();
  const before = S.instruments.length;
  S.instruments = S.instruments.filter(function(it){ return it.symbol.toUpperCase() !== sym; });
  if(S.instruments.length === before) return { ok:false, error: sym + ' is not in the list.' };

}
function instrumentRow(it, st){
  const row = { symbol: it.symbol, label: it.label, annualReturnPct: +(st.annualReturn*100).toFixed(2), annualVolPct: +(st.annualVol*100).toFixed(2) };
  if(st.geoAnnual != null) row.compoundedPct = +(st.geoAnnual*100).toFixed(2);
  if(st.quality && st.quality.flags && st.quality.flags.length) row.quality = { level: st.quality.level, flags: st.quality.flags.map(function(f){ return { code:f.code, msg:f.msg }; }) };
  return row;
}
function comparePortfolio(){
  const n = S.instruments.length;
  if(n < 2) return { ok:false, error:'Need at least two instruments to compare — add more via add_instrument (currently ' + n + ').' };
  if(n > 4) return { ok:false, error:'This comparison handles 2 to 4 instruments — remove some first (currently ' + n + ').' };
  const insts = S.instruments;
  const stats = insts.map(function(it){ return it.stats; });
  const rf = portfolioRf();
  const corr = computeCovarianceMatrix(stats).corr;
  const correlations = [];
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) correlations.push({ a: insts[i].symbol, b: insts[j].symbol, correlation: +corr[i][j].toFixed(3) });
  let wMin, wTan, mv, tan;
  if(n === 2){
    const a = insts[0], b = insts[1];
    const retA = stats[0].annualReturn, retB = stats[1].annualReturn;
    const sdA = stats[0].annualVol, sdB = stats[1].annualVol;
    const c12 = corr[0][1];
    const wMinVar = minVarianceWeightTwoAsset(sdA, sdB, c12);
    const wTanVar = tangencyWeightTwoAsset(retA, retB, sdA, sdB, c12, rf);
    const frontier = twoAssetFrontier(retA, retB, sdA, sdB, c12);
    const mix = function(w){ return { ret: portfolioReturn([w,1-w],[retA,retB]), vol: Math.sqrt(portfolioVariance([w,1-w],[sdA,sdB],[[1,c12],[c12,1]])) }; };
    const sharpeAt = function(w){ const m = mix(w); return m.vol > 0 ? (m.ret - rf)/m.vol : -Infinity; };
    mv = mix(wMinVar); tan = mix(wTanVar);
    wMin = [wMinVar, 1-wMinVar]; wTan = [wTanVar, 1-wTanVar];
    const cal = capitalAllocationLine(rf, tan.ret, tan.vol);
    lastFrontierData = { frontier: frontier, assetPoints: [{ label: a.symbol, ret: retA, vol: sdA }, { label: b.symbol, ret: retB, vol: sdB }], currentPoint: { vol: mv.vol, ret: mv.ret }, cal: cal, tangencyPoint: { vol: tan.vol, ret: tan.ret }, currentMixLabel: 'min-variance mix', minVarPoint: { vol: mv.vol, ret: mv.ret }, riskFree: rf, assetCount: n, minVariance: { ret: mv.ret, vol: mv.vol, sharpe: sharpeAt(wMinVar) }, tangency: { ret: tan.ret, vol: tan.vol, sharpe: sharpeAt(wTanVar) } };
    mv.sharpe = sharpeAt(wMinVar); tan.sharpe = sharpeAt(wTanVar);
  } else {
    const m = multiAssetFrontier(stats, rf, { seed: MULTI_FRONTIER_SEED });
    wMin = m.minVariance.w; wTan = m.tangency.w;
    mv = m.minVariance; tan = m.tangency;
    lastFrontierData = { assetPoints: insts.map(function(it,i){ return { label: it.symbol, ret: stats[i].annualReturn, vol: stats[i].annualVol }; }), riskFree: rf, assetCount: n, minVariance: { ret: mv.ret, vol: mv.vol, sharpe: mv.sharpe }, tangency: { ret: tan.ret, vol: tan.vol, sharpe: tan.sharpe } };
  }
  const result = {
    ok:true, n:n, method: n===2 ? 'closed-form' : 'sampled-frontier',
    instruments: insts.map(function(it,i){ return instrumentRow(it, stats[i]); }),
    correlations: correlations,
    riskFreePct: +(rf*100).toFixed(1),
    minVariance: { weights: wMin.map(function(w){ return +w.toFixed(3); }), returnPct: +(mv.ret*100).toFixed(2), volPct: +(mv.vol*100).toFixed(2), sharpe: +mv.sharpe.toFixed(3) },
    tangency: { weights: wTan.map(function(w){ return +w.toFixed(3); }), returnPct: +(tan.ret*100).toFixed(2), volPct: +(tan.vol*100).toFixed(2), sharpe: +tan.sharpe.toFixed(3) },
    chartTypes: n===2 ? ['frontier','bar','profile'] : ['bar','profile'],
  };
  if(n === 2) result.correlation = correlations[0].correlation;
  lastComparisonResult = result;
  return result;
}
const FRONTIER_CHART_TITLES = { frontier: 'Efficient frontier', bar: 'Return vs. risk', profile: 'Return, risk and Sharpe, side by side' };
// The caption that goes under the profile dot plots (built from the same rows
// as the chart). Empty when the comparison data is missing, so a stale or
// half-built briefing prints no caption instead of throwing.
function profileCaptionHtml(d) {
  if (!d || !d.assetPoints || !d.minVariance || !d.tangency) return '';
  return profileComparisonCaption(d.assetPoints, d.minVariance, d.tangency, d.riskFree)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// Lets the user pull the floating chart panel off whatever it's covering
// (e.g. the Continue button) instead of only being able to close it. Bound
// once, when the panel is first created — not re-bound on every re-render.
function makeDraggable(panel, handle){
  let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
  handle.style.cursor = 'move';
  function point(e){ return e.touches ? e.touches[0] : e; }
  function onDown(e){
    if(e.target.closest('button')) return;
    dragging = true;
    const p = point(e);
    const rect = panel.getBoundingClientRect();
    startX = p.clientX; startY = p.clientY; startLeft = rect.left; startTop = rect.top;
    panel.style.left = startLeft + 'px';
    panel.style.top = startTop + 'px';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive:false });
    document.addEventListener('touchend', onUp);
  }
  function onMove(e){
    if(!dragging) return;
    const p = point(e);
    const dx = p.clientX - startX, dy = p.clientY - startY;
    const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
    panel.style.left = Math.min(Math.max(0, startLeft + dx), maxLeft) + 'px';
    panel.style.top = Math.min(Math.max(0, startTop + dy), maxTop) + 'px';
    if(e.cancelable) e.preventDefault();
  }
  function onUp(){
    dragging = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, { passive:true });
}
function renderFrontierChart(chartType){
  if(!lastFrontierData || lastFrontierData.assetCount !== S.instruments.length){ const r = comparePortfolio(); if(!r.ok) return r; }
  const d = lastFrontierData;

    (type === 'profile' ? '<div style="font-size:11px;line-height:1.45;color:rgba(20,40,63,.74);margin-top:5px;padding-right:18px">' + profileCaptionHtml(d) + '</div>' : '');
  const opt = type === 'bar' ? barComparisonChartOption(d.assetPoints)
    : type === 'profile' ? profileComparisonChartOption(d.assetPoints, d.minVariance, d.tangency, d.riskFree)

}
// pushState only when the screen actually changed: same-screen re-renders
// (picking an answer re-renders the current screen) must not pile up
// duplicate history entries, and a popstate-driven render arrives with the
// hash already matching, so it naturally skips the push.
function syncHistory() {
  const hash = '#' + flow()[S.si];
  if (location.hash === hash) return;
  try { history.pushState({ si: S.si }, '', hash); } catch (e) {}
}

/* ---- Keyboard and screen-reader access -------------------------------------
   Most choices here (country, goal, risk cards, quick-pick chips, the edit chips,
   the "See how we got this number" toggles) are <div>s with click handlers, so
   Tab skipped them and Enter/Space did nothing. Rewriting ~25 templates as
   <button>s would restyle them all, so instead: after each render every one of
   them is given tabindex, role and state (enhancePressables), one key handler on
   the stage presses them on Enter/Space, and focus survives the re-render that
   most picks cause (a re-render throws the focused element away). */
const PRESSABLE = '.country-card,.goal-card,.gen-card,.risk-card,.chip,.edit-chip,.assump-toggle,[data-retire-preview]';

// The quick-pick chips only fill a box and never re-render, so they carry no
// pressed state (it would go stale the moment one was tapped).
const CHOICE_CARD = '.country-card,.goal-card,.gen-card,.risk-card';
const SCREEN_HEADING = '.q-title,.hero-label,.case-title';
let shownScreen = null;   // the screen the last render() drew; null before the first one
function togglePanelOf(t) {
  const panel = Object.keys(RESULT_PANELS).find(p => RESULT_PANELS[p] === t.id);
  return panel ? document.getElementById(panel) : null;
}
function syncExpanded(t) {

function enhancePressables(root) {

    if (el.matches(CHOICE_CARD)) el.setAttribute('aria-pressed', el.classList.contains('selected'));
    if (el.matches('.assump-toggle')) syncExpanded(el);

  root.querySelectorAll('.chips-label + .chips').forEach(g => {

// A selector that finds "the same choice" again after a re-render: its id, or

function focusKeyOf(el) {

const FIELD_LABEL = ':scope > label, :scope > .adv-label, :scope > .optional-label, :scope > .q-title, :scope > .case-slider-label';
function fieldLabelOf(el) {

function nameFields(root) {

    syncValueText(el, lab);
    if ((el.labels && el.labels.length) || el.getAttribute('aria-label') || el.getAttribute('aria-labelledby')) return;
    const vs = el.closest('.value-slider'), twin = vs && vs.previousElementSibling && vs.previousElementSibling.querySelector('input[type=number]');

// A slider whose label carries a bold readout ("Equity kept at this stage 60%")

function syncValueText(el, lab) {

stage.addEventListener('keydown', e => {

    e.preventDefault(); e.target.click();

// Toggles don't re-render; their own handler has already run by the time a click

stage.addEventListener('click', e => { const t = e.target.closest('.assump-toggle'); if (t) syncExpanded(t); });

// opts.quiet: an in-place update (a what-if tap on the results screen), not a
// move to another screen. It skips the 0.3s slide-in, which on a screen the
// person is already looking at reads as the page being thrown away and rebuilt.
function render(opts) {
  const quiet = !!(opts && opts.quiet === true);
  chartQuiet = quiet;
  const f = flow(), screen = f[S.si];
  // Focus inside the old screen is about to be thrown away with it. (Focus in the
  // advisor panel, or anywhere outside the stage, is left alone.)
  const prevFocus = document.activeElement;
  const hadFocus = !prevFocus || prevFocus === document.body || stage.contains(prevFocus);
  const keepKey = focusKeyOf(prevFocus);
  const screenChanged = shownScreen !== null && shownScreen !== screen;
  // A question screen that re-renders on a pick would start its scroller at the top again (see goalden-door2.html).
  const oldBody = stage.querySelector('.q-body'), keepScroll = !screenChanged && oldBody ? oldBody.scrollTop : 0;
  let html = '';
  if (screen==='country')      html = sCountry();
  else if (screen==='goal')    html = sGoal();
  else if (screen==='age')     html = sAge();
  else if (screen==='expense') html = sExpense();
  else if (screen==='edu_fee') html = sEduFee();
  else if (screen==='edu_years')     html = sEduYears();
  else if (screen==='gen_type')   html = sGenType();
  else if (screen==='gen_amount') html = sGenAmount();
  else if (screen==='gen_years')  html = sGenYears();
  else if (screen==='risk')    html = sRisk();
  else if (screen==='results') html = sResults();
  else if (screen==='case')    html = sCase();

  const wrap = document.createElement('div');
  wrap.className = 'screen';
  wrap.innerHTML = html;
  stage.innerHTML = '';
  stage.appendChild(wrap);
  // Forcing a layout read here (rather than deferring the class add to
  // requestAnimationFrame) flushes the browser's style calc with the
  // pre-transition state already applied, so the .active transition still
  // fires correctly without depending on a paint callback -- rAF doesn't
  // reliably fire on a backgrounded/non-composited tab, which would leave
  // the screen permanently stuck at opacity:0.
  if (quiet) wrap.classList.add('active');   // already active when inserted: nothing to transition
  else { void wrap.offsetHeight; wrap.classList.add('active'); }
  backBtn.classList.toggle('show', S.si > 0);
  assumpBtn.classList.toggle('show', screen==='results');
  if (screen==='case') window.scrollTo(0,0);
  renderProgress();
  attach(screen);
  enhancePressables(stage);
  nameFields(stage);
  // Made focusable now, not a microtask later, so a focused "i" or term can be given focus back below.
  if (window.gtipEnhance) gtipEnhance(stage);
  if (keepScroll) { const nb = wrap.querySelector('.q-body'); if (nb) nb.scrollTop = keepScroll; }
  // After attach(), so a screen's own focus handling (the what-if row, the EPF
  // form) wins; this only fills in when focus was simply lost.
  if (hadFocus && (!document.activeElement || document.activeElement === document.body)) {
    if (screenChanged) {
      // A new screen: land on its heading, not on the Continue button that was just
      // pressed (which has the same id on the next screen), so the next Tab starts
      // at the top of what is new and a screen reader says what the question is.
      const h = wrap.querySelector(SCREEN_HEADING);
      if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
    } else if (keepKey) {
      const el = stage.querySelector(keepKey);
      if (el) el.focus({ preventScroll: true });
    }
  }
  shownScreen = screen;
  persistState();
  syncHistory();
  // The charts are drawn from callbacks queued above (deferChartInit); this one is queued after them.
  setTimeout(() => { chartQuiet = false; }, 0);
  liveCanvasSync(screen);
}

/* =====================================================================
   LIVE RESULT CANVAS
   Wizard first, live after. The questions stay one per screen for a first

   change any answer and watch the plan respond. The panel lives OUTSIDE
   #stage, so re-rendering the result never interrupts a drag, and no focus

let lcEl = null, lcTimer = null, lcStart = null;
const LC_KEYS = ['age', 'retireAge', 'monthlyExpense', 'existingSavings', 'risk'];
function lcFields() {
  const c = cfg(), b = sliderBounds(c.expChips), bs = sliderBounds(c.amtChips, 6, 0);
  return [
    { k:'age', label:'Age today', min:18, max:70, step:1 },
    { k:'retireAge', label:'Retire at', min:35, max:85, step:1 },
    { k:'monthlyExpense', label:'Spend a month', min:Math.max(1, b.min), max:b.max, step:b.step },

// What "where you started" means: the five answers on this panel plus the two
// things the result's own controls can change, so Undo really goes back to the
// plan that was first on screen.
function lcSnap() {
  const snap = {};
  LC_KEYS.forEach(k => { snap[k] = S[k]; });
  snap.acc = S.acc ? JSON.parse(JSON.stringify(S.acc)) : null;
  snap.postRetAlloc = S.postRetAlloc ? Object.assign({}, S.postRetAlloc) : null;

}
const lcSip = r => r.alreadyMet ? 0 : r.sip;
function lcSummary() {

}
function lcOutputHtml() {
  const c = cfg(), r = calcRetirement(), sip = lcSip(r);
  const now = r.alreadyMet ? 'No SIP needed' : '<b>' + c.fmt(Math.round(sip)) + '</b> a month';
  let delta = '';

    const move = lcStart.sip === 0 ? '▲ was no SIP needed at the start'

      : (sip > lcStart.sip ? '▲ ' : '▼ ') + c.fmt(Math.abs(Math.round(sip - lcStart.sip))) + '/mo vs where you started';

// One rule set for every way in (drag or type), and it is the advisor's and the

// within those limits; retire stays after age.
function lcSet(k, v) {
  const spec = ADVISOR_FIELDS.find(f => f.name === k);
  if (!spec || !isFinite(v)) return;
  S[k] = Math.round(Math.max(k === 'monthlyExpense' ? 1 : spec.min, Math.min(spec.max, v)));
  if ((k === 'age' || k === 'retireAge') && S.retireAge <= S.age) S.retireAge = Math.min(85, S.age + 1);

  clearTimeout(lcTimer);
  lcTimer = setTimeout(lcApply, 120);

// Write S into the panel, except into the control the person is using right now.

  if (!lcEl) return;

  lcFields().forEach(f => {
    const sl = lcEl.querySelector('[data-lc="' + f.k + '"]'), num = lcEl.querySelector('[data-lc-num="' + f.k + '"]');
    if (f.k === 'retireAge') sl.min = Math.max(35, S.age + 1);

  if (!lcStart || flow()[S.si] !== 'results' || S.goalType !== 'retirement') return;
  const wasCorpus = lcStart.lastCorpus, wasSip = lcStart.lastSip;
  refreshResultsInPlace();
  const c = cfg(), r = calcRetirement();
  countTo(document.querySelector('#stage .hero-figure'), wasCorpus, r.corpus, v => c.compact(v));
  if (!r.alreadyMet && wasSip > 0) countTo(document.querySelector('#stage .action-card .af'), wasSip, r.sip, v => c.fmt(Math.round(v)) + ' / month');

// Called at the end of every render(): show the panel on a retirement result,

function liveCanvasSync(screen) {
  // Element.after() is missing from the agent-evals DOM stub, where there is no panel to keep in step.
  if (typeof stage.after !== 'function') return;

  document.body.classList.toggle('lc-on', on);
  if (!on) {
    if (lcEl) { lcEl.hidden = true; lcSetOpen(false); }   // collapsed again for the next result

  }

  if (!lcEl) lcBuild();

// The advisor's round chat button sits fixed at the bottom right; keep it (and

function lcLift() {

window.addEventListener('resize', lcLift);
// A number rolls from one value to the next in 450ms (ease-out) so the eye
// sees what changed. Reduced motion: it just jumps. Screen readers get only
// the final text; the rolling copy is aria-hidden. setTimeout, not
// requestAnimationFrame: rAF does not fire reliably on a backgrounded tab.
function countTo(el, from, to, fmt) {
  if (!el || from === to || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const final = el.textContent;

    const p = Math.min(1, (Date.now() - t0) / 450);
    if (p >= 1 || !el.isConnected) { el.textContent = final; return; }
    roll.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    setTimeout(step, 30);
  })();
}

   ===================================================================== */
// "What if I retired at a different age?" re-renders the whole results screen
// (every figure on it depends on the age). Done plainly, that closed the
// details panel the person was reading, sent the scroll back to the top and
// slid the screen in again, so the comparison they asked for was lost. This
// keeps their place: the panel stays open, the tapped row stays where it was on
// the screen, and focus goes back to the row for the plan they just left (the
// one they would tap to go back). Only a tap inside the details panel gets
// this; anywhere else (the chat canvas) is an ordinary re-render. The card's
// rows are the plan's age -5, 0, +5, so the list shifts with each tap: the row
// kept in place is the new "this plan" row (the age just tapped), not the row
// at the same position.
let resultKeep = null;   // {offset, from}: consumed once by attach('results')

  const card = el.closest('.retire-compare-card'), scroller = document.querySelector('.result-scroll');
  const keep = !!(el.closest('#bp') && card && scroller);
  resultKeep = keep ? { offset: el.getBoundingClientRect().top - scroller.getBoundingClientRect().top, from: S.retireAge } : null;
  rememberGhost();

}

  // final layout, not on a panel that is still growing.
  bp.style.transition = 'none'; bp.classList.add('open'); bt.classList.add('open'); void bp.offsetHeight; bp.style.transition = '';
  const row = document.querySelector('#bp .retire-compare-card .delay-row:not([data-retire-preview])');
  if (row) scroller.scrollTop += row.getBoundingClientRect().top - scroller.getBoundingClientRect().top - keep.offset;
  const back = document.querySelector('#bp .retire-compare-card [data-retire-preview="' + keep.from + '"]');
  if (back) back.focus({ preventScroll: true });
}
// The EPF/PPF/NPS form changes every figure on the results screen, so it has to
// re-render the whole screen, which on its own would close the open panels, jump
// to the top and slide the screen in again. This keeps the person's place: the
// panels that were open reopen without animating, the form stays where it was
// on the screen, and focus goes to the status line, which says what happened.
let resultReopen = null;   // {open:[panel ids], anchor, focus, offset, top}: consumed once by attach('results')
const RESULT_PANELS = { bp: 'bt', sp: 'st', dp: 'dt', ap: 'at', accp: 'acct' };
function refreshResultsInPlace(anchorId, focusId) {
  const scroller = document.querySelector('.result-scroll'), anchor = anchorId ? document.getElementById(anchorId) : null;
  resultReopen = {
    open: Object.keys(RESULT_PANELS).filter(id => { const p = document.getElementById(id); return p && p.classList.contains('open'); }),
    anchor: anchorId, focus: focusId,
    offset: scroller && anchor ? anchor.getBoundingClientRect().top - scroller.getBoundingClientRect().top : 0,
    top: scroller ? scroller.scrollTop : 0,
  };
  render({ quiet: true });
}
function reopenResultPanels() {
  const keep = resultReopen; resultReopen = null;
  const scroller = document.querySelector('.result-scroll');
  if (!keep || !scroller) return;
  keep.open.forEach(id => {
    const p = document.getElementById(id), t = document.getElementById(RESULT_PANELS[id]);
    if (!p) return;
    p.style.transition = 'none'; p.classList.add('open');
    if (t) { t.classList.add('open'); if (id === 'accp') t.setAttribute('aria-expanded', 'true'); }
    void p.offsetHeight; p.style.transition = '';
  });
  scroller.scrollTop = keep.top;
  const anchor = keep.anchor ? document.getElementById(keep.anchor) : null;
  if (anchor) scroller.scrollTop += anchor.getBoundingClientRect().top - scroller.getBoundingClientRect().top - keep.offset;
  const f = keep.focus ? document.getElementById(keep.focus) : null;
  if (f) f.focus({ preventScroll: true });
}

// Browser Back/Forward walks screens. The browser has already moved to the
// previous entry, so render() below sees the hash matching the screen and
// skips its own pushState. If the entry names a screen that has vanished
// from flow() (dynamic screens like 'case'), fall back to Back-button
// behaviour rather than rendering a blank screen.
window.addEventListener('popstate', () => {
  // A plan link opened while this page is already open arrives as a hash change, not a fresh load.
  const linked = readPlanLink(location.hash);
  if (linked) { applyPlanLink(linked); history.replaceState(null, '', location.pathname + location.search); render(); return; }
  // A plan link that failed the checks is ignored: stay on the screen the person is on, rather than let the Back fallback below move them.
  if ((location.hash || '').indexOf('#plan:') === 0) { history.replaceState(null, '', location.pathname + location.search + '#' + (flow()[S.si] || '')); planLinkRefusedNotice(); return; }
  const name = (location.hash || '').slice(1);
  const idx = flow().indexOf(name);
  if (idx >= 0) { S.quickEdit = false; S.viewingCase = name === 'case'; S.si = idx; render(); }
  else if (S.si > 0) { S.si -= 1; render(); }
});

const ADVISOR_KNOWLEDGE = `Goalden is one personal-finance planning app with three levels — they all share the same math, so moving to a deeper level never wastes anything the user already entered. It supports India (₹) and the United States ($).
- Level 1 — Quick Calculate (this page): a fast single-goal answer in about two minutes, for first-timers.
- Level 2 — The Full Plan: a risk-profiling questionnaire that builds a multi-goal plan with recommended fund categories.
- Level 3 — The Lab: full assumption control, Monte Carlo, efficient frontier, and live real-market-data testing.
The user is currently on Level 1.

This is "Goalden — Quick Calculate" (Level 1): a fast single-goal calculator.

What it does: takes a few plain-language inputs and returns the lump sum (corpus) needed by a target date and the monthly amount (SIP) to save now to reach it. "The Case" screen adds a deeper proof with real historical market data.

Goal types:
- retirement: monthly expenses today, current age, retirement age.
- education: annual college fee today, years until it starts, course duration.
- generic (house/car/wedding/travel): amount today and years until needed.
- delay ("cost of waiting"): shows how postponing a goal raises the required monthly saving.

Risk options and their asset splits (equity/debt/hybrid): cautious 25/60/15, balanced 50/35/15, growth 75/15/10.

Calculations: the target corpus is the present value of future withdrawals using an inflation-adjusted ("real") rate, with withdrawals at the start of each year. The monthly SIP is what compounds at the pre-retirement rate to close the gap between that corpus and what existing savings grow to. Results include the corpus in future and today's money, a fixed-deposit comparison at the country FD rate, a "retire 5 years earlier/later" comparison, and a cost-of-delay figure.

Assumptions (per country):
- India (₹): inflation 6%, education inflation 10%, debt 7%, hybrid 10%, equity 12%, post-retirement return 9%, plans run to age 85 (deliberately past ~78, the typical lifespan of someone who reaches 60), FD rate 6.5%.
- US ($): inflation 2.5%, education inflation 5%, debt 4.5%, hybrid 7%, equity 9%, post-retirement 6%, plans run to age 90 (deliberately past ~82, the typical lifespan of someone who reaches 60), FD rate 4%.

Data sources: "The Case" uses real historical annual returns — Sensex (India, FY1980-2023) and S&P 500 (US, 1928-2024) — to show how often N-year windows lost money and the worst/best windows. Price returns, no fabricated or estimated values. This Level does not fetch live market data.

Behavior: prefer driving the real interface — navigate to the right screen, set the values, scroll the result into view, then explain what the user is looking at in plain language. Use the workspace canvas only to compare two scenarios side by side, or to show something not on the current page. Never describe a number without putting it on screen.

Acting on a user's own situation: this page plans ONE goal at a time. When someone describes their life and several goals, don't stop to ask which one — run each goal that has its numbers with build_goal_plan, one call per goal in the same turn. Then give each goal's monthly SIP, the total, and how that total compares with what they can save each month (take-home − spending − EMIs, shown as one line of arithmetic). Say that The Full Plan (Level 2) puts all the goals into one plan against their budget and risk profile, and offer to take them there. The last goal you build stays on screen, so say which one is showing.
Mapping what people say to this page:
- country: ₹, lakh/crore, or an Indian city → IN; $ or a US city → US. Ask only if nothing hints at it.
- Money: "1.4 lakh" = 140000, "80 lakh" = 8000000, "2 crore" = 20000000, "70k" = 70000.
- retirement: age, retireAge, monthlyExpense = today's monthly spending (the page applies the retirement lifestyle factor itself).
- education: yearsToCollege = 18 − the child's age for an undergraduate degree (1-22); courseDuration 4 for engineering and most degrees, 5 for medicine. annualFee comes only from the user — never invent a fee. If it's missing, run the other goals and ask for it.
- generic: house/car/wedding/travel → genType (a holiday or trip is travel); genAmount = the amount they gave; genYears.
- existingSavings: only money they said is set aside for that goal. General FDs or mutual funds are not counted against a goal unless they say so — tell them, because counting them would lower the SIP.
- EPF, PPF and NPS (India, retirement only): the results screen has an optional "Already in EPF, PPF or NPS? Count it" panel. What those accounts will hold at retirement comes off the pot the SIP has to build, so the monthly SIP drops. The user types the balances in themselves (you cannot set them), and they are not part of existingSavings. When get_results includes epfPpfNpsCountedAtRetirement, monthlySIP already counts them and monthlySIPWithoutEpfPpfNps is the figure without. Only the tax-free part of NPS counts (60% at 60, 20% before 60); the employer's pension share is ignored.
- persona: when state.persona is set (priya, arjun or rohan), the inputs belong to an example person picked from the first screen, not to the user. Say so if it matters, and offer to redo the plan with their own numbers.
- risk: use what they said ("I can't take losses" → cautious, "I'm fine with big swings" → growth); otherwise balanced, and say so.
What-ifs and changes ("retire at 58 instead", "make the house 60 lakh"): change just that value — set_value on the goal on screen, or build_goal_plan again for another goal — and report the monthly SIP before → after. Quote only SIPs this page calculated; to show what another date or amount would do, run it rather than estimating.
A bare "help me plan my retirement" with no details gets the A/B choice from the rules, once. For a walk-through (B), navigate one screen at a time, explain each question before they answer it, and use set_value one field at a time.`;

function advisorSetValue(field, value) {
  const spec = ADVISOR_FIELDS.find(f => f.name === field);
  if (!spec) return { ok:false, error:'Unknown field "'+field+'". Valid: '+ADVISOR_FIELDS.map(f=>f.name).join(', ') };
  if (value === undefined || value === null || value === '') return { ok:false, error:'Missing value for '+field };
  if (spec.enum && !spec.enum.includes(value)) return { ok:false, error:'Invalid value for '+field+'. Allowed: '+spec.enum.join(', ') };
  if (spec.type === 'integer') {
    value = parseInt(value, 10);
    if (!isFinite(value)) return { ok:false, error:'Value for '+field+' must be a number.' };
  }
  if (spec.min !== undefined && value < spec.min) return { ok:false, error:'Value for '+field+' is too low — it must be at least '+spec.min+'.' };
  if (spec.max !== undefined && value > spec.max) return { ok:false, error:'Value for '+field+' is too high — it must be at most '+spec.max+'.' };
  if (field === 'goalType') {
    S.goalType = value;
    S.si = S.country ? flow().indexOf('goal') : 0;
  } else if (field === 'age' && S.retireAge && S.retireAge <= value) {
    S.age = value; S.retireAge = null;
  } else {
    S[field] = value;
  }
  const f = flow();
  S.si = Math.max(0, Math.min(f.length - 1, S.si));
  render();
  return { ok:true, field, value:S[field], page:f[S.si], touched:'#stage .screen' };
}

// Part B — cross-field sanity flags (advisory, not blocking). A flagged value
// may be exactly what the user intends, so these are heads-ups, never errors.
// Check 1 (SIP vs stated capacity) is skipped: Level 1 has no field where the
// user states how much they can save each month.
function crossFieldSanity(state, country) {
  const flags = [];
  // 3. Expense magnitude plausible for the selected country (wide net).
  if (state.monthlyExpense != null) {
    const lo = country === 'US' ? 500 : 10000;
    const hi = country === 'US' ? 100000 : 2000000;
    if (state.monthlyExpense < lo) flags.push('Monthly expense looks unusually low for ' + (country === 'US' ? 'the US' : 'India') + ' — check it is the full monthly amount, not just one category.');
    else if (state.monthlyExpense > hi) flags.push('Monthly expense looks unusually high — check whether that figure is monthly or annual.');
  }
  // 2. Corpus vs retirement-year expense, roughly 15x-40x (safe-withdrawal range).
  if (state.goalType === 'retirement' && state.age != null && state.retireAge != null && state.monthlyExpense != null && state.country) {
    const r = calcRetirement();
    const annual = state.monthlyExpense * 12;
    if (annual > 0 && r.corpus > 0) {
      const ratio = r.corpus / annual;
      if (ratio < 15) flags.push('This retirement corpus is only about ' + Math.round(ratio) + 'x one year of spending — below the usual safe range, so the plan may be fragile.');
      else if (ratio > 40) flags.push('This retirement corpus is about ' + Math.round(ratio) + 'x one year of spending — well above the usual range; double-check the expense figure.');
    }
  }
  return flags;
}

function advisorGetResults() {
  if (!S.country) return { ok:false, error:'Need a country/currency first — ask the user whether they are in India or the United States.' };
  if (!S.goalType) return { ok:false, error:'No goal chosen yet — ask the user what they want to plan for.' };
  const flags = crossFieldSanity(S, S.country);
  if (S.goalType === 'retirement') {
    if (S.age == null || S.retireAge == null || S.monthlyExpense == null) return { ok:false, error:'Need age, retirement age and monthly expense first.' };
    const r = calcRetirement();
    const out = { goalType:'retirement', age:S.age, retireAge:S.retireAge, monthlyExpense:S.monthlyExpense, monthlySIP:Math.round(r.sip), corpus:Math.round(r.corpus), corpusTodayMoney:Math.round(r.realCorpus), yearsToRetire:r.yrs, expectedReturnPct:(r.preRate*100).toFixed(1), stepUp10StartSIP:(o=>o?Math.round(o.start):null)(stepUpOffer(r.sip, r.yrs, r.preRate)) };
    // Said only when the user entered EPF/PPF/NPS: monthlySIP above already counts them.
    if (r.accCounted > 0) { out.epfPpfNpsCountedAtRetirement = Math.round(r.accCounted); out.monthlySIPWithoutEpfPpfNps = Math.round(r.sipWithoutAcc); }
    return { ok:true, result:out, flags:flags };
  }
  if (S.goalType === 'education') {
    if (S.annualFee == null || S.yearsToCollege == null || S.courseDuration == null) return { ok:false, error:'Need annual fee, years until college and course duration first.' };
    const r = calcEducation();
    return { ok:true, result:{ goalType:'education', annualFee:S.annualFee, yearsToCollege:S.yearsToCollege, courseDuration:S.courseDuration, monthlySIP:Math.round(r.sip), corpus:Math.round(r.corpus), corpusTodayMoney:Math.round(r.realCorpus), expectedReturnPct:(r.preRate*100).toFixed(1), stepUp10StartSIP:(o=>o?Math.round(o.start):null)(stepUpOffer(r.sip, S.yearsToCollege, r.preRate)) }, flags:flags };
  }
  if (S.goalType === 'generic') {
    if (S.genAmount == null || S.genYears == null) return { ok:false, error:'Need goal amount and years until needed first.' };
    const r = calcGeneric();
    return { ok:true, result:{ goalType:'generic', genType:S.genType, amountToday:S.genAmount, years:S.genYears, inflatedGoal:Math.round(r.inflatedGoal), monthlySIP:Math.round(r.sip), expectedReturnPct:(r.preRate*100).toFixed(1), stepUp10StartSIP:(o=>o?Math.round(o.start):null)(stepUpOffer(r.sip, S.genYears, r.preRate)) }, flags:flags };
  }
  if (S.goalType === 'delay') return { ok:false, error:'The cost-of-delay comparison shows inside a real goal result. Pick retirement, education or a purchase first.' };
  return { ok:false, error:'Unknown goal type.' };
}

// The monthly SIP of the goal on screen, or 0 while its inputs aren't filled in

// F3g — the five single-scenario `show_result` kinds are retired; they're now
// Briefing sections. Each build() returns {ok, html} or {ok:false, error}.
const BRIEFING_SECTIONS = {
  headline: { title: 'Your number', build: function () {
    const c = cfg();
    const r = advisorGetResults();
    if (!r.ok) return { ok:false, error: r.error };
