// Part B — cross-field sanity flags (advisory, not blocking). A flagged value
// may be exactly what the user intends, so these are heads-ups, never errors.
// Check 1 (SIP vs stated capacity) is skipped: Level 1 has no field where the
// user states how much they can save each month.
function crossFieldSanity(state, country) {
  const flags = [];
  // 3. Expense magnitude plausible for the selected country (wide net).
  if (state.monthlyExpense != null) {
    const lo = country === 'US' ? 500 : 10000;
    const hi = country === 'US' ? 100000 : 2000000;
    if (state.monthlyExpense < lo) flags.push('Monthly expense looks unusually low for ' + (country === 'US' ? 'the US' : 'India') + ' — check it is the full monthly amount, not just one category.');
    else if (state.monthlyExpense > hi) flags.push('Monthly expense looks unusually high — check whether that figure is monthly or annual.');
  }
  // 2. Corpus vs retirement-year expense, roughly 15x-40x (safe-withdrawal range).
  if (state.goalType === 'retirement' && state.age != null && state.retireAge != null && state.monthlyExpense != null && state.country) {
    const r = calcRetirement();
    const annual = state.monthlyExpense * 12;
    if (annual > 0 && r.corpus > 0) {
      const ratio = r.corpus / annual;
      if (ratio < 15) flags.push('This retirement corpus is only about ' + Math.round(ratio) + 'x one year of spending — below the usual safe range, so the plan may be fragile.');
      else if (ratio > 40) flags.push('This retirement corpus is about ' + Math.round(ratio) + 'x one year of spending — well above the usual range; double-check the expense figure.');
    }
  }
  return flags;
}

function advisorGetResults() {
  if (!S.country) return { ok:false, error:'Need a country/currency first — ask the user whether they are in India or the United States.' };
  if (!S.goalType) return { ok:false, error:'No goal chosen yet — ask the user what they want to plan for.' };
  const flags = crossFieldSanity(S, S.country);
  if (S.goalType === 'retirement') {
    if (S.age == null || S.retireAge == null || S.monthlyExpense == null) return { ok:false, error:'Need age, retirement age and monthly expense first.' };
    const r = calcRetirement();
    return { ok:true, result:{ goalType:'retirement', age:S.age, retireAge:S.retireAge, monthlyExpense:S.monthlyExpense, monthlySIP:Math.round(r.sip), corpus:Math.round(r.corpus), corpusTodayMoney:Math.round(r.realCorpus), yearsToRetire:r.yrs, expectedReturnPct:(r.preRate*100).toFixed(1) }, flags:flags };
  }
  if (S.goalType === 'education') {
    if (S.annualFee == null || S.yearsToCollege == null || S.courseDuration == null) return { ok:false, error:'Need annual fee, years until college and course duration first.' };
    const r = calcEducation();
    return { ok:true, result:{ goalType:'education', annualFee:S.annualFee, yearsToCollege:S.yearsToCollege, courseDuration:S.courseDuration, monthlySIP:Math.round(r.sip), corpus:Math.round(r.corpus), corpusTodayMoney:Math.round(r.realCorpus), expectedReturnPct:(r.preRate*100).toFixed(1) }, flags:flags };
  }
  if (S.goalType === 'generic') {
    if (S.genAmount == null || S.genYears == null) return { ok:false, error:'Need goal amount and years until needed first.' };
    const r = calcGeneric();
    return { ok:true, result:{ goalType:'generic', genType:S.genType, amountToday:S.genAmount, years:S.genYears, inflatedGoal:Math.round(r.inflatedGoal), monthlySIP:Math.round(r.sip), expectedReturnPct:(r.preRate*100).toFixed(1) }, flags:flags };
  }
  if (S.goalType === 'delay') return { ok:false, error:'The cost-of-delay comparison shows inside a real goal result. Pick retirement, education or a purchase first.' };
  return { ok:false, error:'Unknown goal type.' };
}

// Highlight replaces the old explain() keyword map: the model already answers
// "what does X mean" from ADVISOR_KNOWLEDGE (far richer than a six-entry map),
// so this tool does the one thing the model can't — scroll the user's eye to
// the exact on-screen element being talked about and pulse it briefly.
const ADVISOR_HIGHLIGHT_TARGETS = {
  screen: '.screen',
  corpus: '.hero-number',
  action: '.action-card',
  results: '.result-scroll',
};
function advisorHighlight(name) {
  const sel = ADVISOR_HIGHLIGHT_TARGETS[name];
  if (!sel) return { ok:false, error:'No highlight target "'+name+'". Valid: '+Object.keys(ADVISOR_HIGHLIGHT_TARGETS).join(', ') };
  const el = document.querySelector(sel);
  if (!el) return { ok:false, error:'That element is not on screen right now.' };
  try { el.scrollIntoView({ behavior:'smooth', block:'center' }); } catch (e) {}
  el.classList.add('advisor-pulse');
  setTimeout(() => el.classList.remove('advisor-pulse'), 1600);
  return { ok:true, target:name };
}

/* =====================================================================
   RESULTS CANVAS — the show_result tool renders an EXISTING comparison card
   or chart (built from the app's own calc functions) into #resultCanvas, so
   the AI can show a real visual instead of re-typing numbers. Each `kind` is
   a fixed enum — the model can only pick from things the page already
   renders, never pass raw values for the frontend to draw.
   ===================================================================== */
function resultCanvasSummary() {
  const c = cfg();
  const res = advisorGetResults();
  if (!res.ok) return '<div class="gr-note">'+res.error+'</div>';
  const r = res.result;
  const goalLabel = { retirement:'Retirement', education:'Education', generic:'A purchase', delay:'Cost of waiting' }[S.goalType] || 'Goal';
  const big = r.corpus != null ? r.corpus : (r.inflatedGoal != null ? r.inflatedGoal : null);
  const monthly = r.monthlySIP != null ? r.monthlySIP : r.sip;
  let html = '<div class="hero-number"><div class="hero-label">'+goalLabel+' — the number</div>';
  if (big != null) html += '<div class="hero-figure">'+c.compact(big)+'</div>';
  if (monthly != null) html += '<div class="hero-sub">Save '+c.fmt(Math.round(monthly))+'/month to get there.</div>';
  return html + '</div>';
}
function resultCanvasDelay() {
  if (S.goalType === 'retirement') {
    if (S.age == null || S.retireAge == null || S.monthlyExpense == null) return '<div class="gr-note">Fill in your retirement inputs first.</div>';
    const r = calcRetirement();
    return delayCard(r.delay, r.yrs) || '<div class="gr-note">No delay comparison for this plan.</div>';
  }
  if (S.goalType === 'education') {
    if (S.annualFee == null || S.yearsToCollege == null || S.courseDuration == null) return '<div class="gr-note">Fill in your education inputs first.</div>';
    const r = calcEducation();
    return delayCard(r.delay, S.yearsToCollege) || '<div class="gr-note">No delay comparison for this plan.</div>';
  }
  return '<div class="gr-note">The cost-of-waiting comparison applies to retirement or education goals.</div>';
}
function resultCanvasRetire() {
  const c = cfg();
  if (S.goalType !== 'retirement') return '<div class="gr-note">This comparison applies to retirement goals.</div>';
  if (S.age == null || S.retireAge == null || S.monthlyExpense == null) return '<div class="gr-note">Fill in your retirement inputs first.</div>';
  const rows = calcRetireAgeCompare();
  return rows ? retireAgeCompareCard(rows, c) : '<div class="gr-note">No comparison available.</div>';
}
function resultCanvasFd() {
  const c = cfg();
  if (S.goalType === 'retirement') {
    if (S.age == null || S.retireAge == null || S.monthlyExpense == null) return '<div class="gr-note">Fill in your retirement inputs first.</div>';
    const r = calcRetirement();
    return r.alreadyMet ? '<div class="gr-note">No SIP needed, so there is nothing to compare against an FD.</div>' : fdComparisonCardHtml(r.sip, r.yrs, r.corpus, r.d, c);
  }
  if (S.goalType === 'generic') {
    if (S.genAmount == null || S.genYears == null) return '<div class="gr-note">Fill in your goal amount and years first.</div>';
    const r = calcGeneric();
    return r.sip <= 0 ? '<div class="gr-note">No SIP needed, so there is nothing to compare.</div>' : fdComparisonCardHtml(r.sip, S.genYears, r.inflatedGoal, r.d, c);
  }
  return '<div class="gr-note">The FD comparison applies to retirement or purchase goals.</div>';
}
function resultCanvasAlloc() {
  if (!S.risk) return '<div class="gr-note">Pick a risk level first to see the allocation split.</div>';
  const d = cfg().d;
  const a = riskAllocation();
  const preRate = riskRate();
  const real = realRate(preRate, d.inflation);
  return '<div class="chart-card"><div class="chart-title">Where this money would sit</div>' +
    '<div class="alloc-flex">' + allocationDonut(a.eq, a.de, a.hy, 'cv-alloc-donut') + '<div class="alloc-legend">' + allocationLegend(a.eq, a.de, a.hy) + '</div></div>' +
    '<div class="alloc-return-row">' +
    '<div><div class="alloc-return-label">Expected return</div><div class="alloc-return-value">'+(preRate*100).toFixed(1)+'%</div></div>' +
    '<div><div class="alloc-return-label">After '+(d.inflation*100).toFixed(0)+'% inflation</div><div class="alloc-return-value" style="color:'+(real>0?'#8FC79E':'#E8977A')+'">'+(real*100).toFixed(1)+'%</div></div>' +
    '</div></div>';
}

// F3g — the five single-scenario `show_result` kinds are retired; they're now
// Briefing sections. Each build() returns {ok, html} or {ok:false, error}.
const BRIEFING_SECTIONS = {
  headline: { title: 'Your number', build: function () {
    const c = cfg();
    const r = advisorGetResults();
    if (!r.ok) return { ok:false, error: r.error };
    const res = r.result;
    const big = res.corpus != null ? res.corpus : res.inflatedGoal;
    const monthly = res.monthlySIP != null ? res.monthlySIP : res.sip;
    // figures lets composeBriefing re-verify every number this section bakes,
    // from a fresh advisorGetResults() — keys match the result field names.
    const figures = {};
    if (res.corpus != null) figures.corpus = res.corpus;
    if (res.inflatedGoal != null) figures.inflatedGoal = res.inflatedGoal;
    if (res.monthlySIP != null) figures.monthlySIP = res.monthlySIP;
    return { ok:true, html: '<div class="hero-number"><div class="hero-label">Your number</div><div class="hero-figure">' + c.compact(big) + '</div><div class="hero-sub">Save ' + c.fmt(Math.round(monthly)) + '/month to get there.</div></div>', figures: figures };
  } },
  assumptions: { title: 'Assumptions used', build: function () {
    const d = cfg().d;
    const c = cfg();
    const rows = [['Inflation', (d.inflation*100).toFixed(1)+'%'], ['Debt return', (d.debt*100).toFixed(1)+'%'], ['Hybrid return', (d.hybrid*100).toFixed(1)+'%'], ['Equity return', (d.equity*100).toFixed(1)+'%'], ['FD rate', (d.fdRate*100).toFixed(1)+'%']].map(function (r) { return '<div class="delay-row"><span class="delay-label">'+r[0]+'</span><span class="delay-value">'+r[1]+'</span></div>'; }).join('');
    return { ok:true, html: '<div class="delay-card"><div class="delay-title">Assumptions for '+c.name+'</div>'+rows+'</div>' };
  } },
  next: { title: 'What to do next', build: function () {
    return { ok:true, html: '<div class="gr-note">Adjust any input to watch the number change, or ask me to explain a specific figure against your own screen.</div>' };
  } },
};

function executeAdvisorTool(name, args) {
  if (name === 'get_state') {
    return JSON.stringify(Object.assign({}, S, { page: flow()[S.si] || null, screens: flow() }));
  }
  if (name === 'get_results') return JSON.stringify(advisorGetResults());
  if (name === 'read_current_chart') return JSON.stringify(advisorReadCurrentChart());
  if (name === 'read_current_result') return JSON.stringify(advisorReadCurrentResult());
  if (name === 'navigate') {
    const screen = args && args.screen;
    const idx = flow().indexOf(screen);
    if (idx === -1) return JSON.stringify({ ok:false, error:'No screen named "'+screen+'". Valid: '+flow().join(', ') });
    S.si = idx; S.quickEdit = false;
    render();
    return JSON.stringify({ ok:true, screen, page:screen });
  }
  if (name === 'set_value') return JSON.stringify(advisorSetValue(args && args.field, args && args.value));
  if (name === 'build_goal_plan') {
    const start = performance.now();
    const goalType = args && args.goalType;
    const country = args && args.country;
    const params = (args && args.params) || {};
    if (!['retirement','education','generic','delay'].includes(goalType)) return JSON.stringify({ ok:false, error:'Invalid goalType. Valid: retirement, education, generic, delay.' });
    if (!['IN','US'].includes(country)) return JSON.stringify({ ok:false, error:'Invalid country. Valid: IN, US.' });
    if (goalType === 'delay') return JSON.stringify({ ok:false, error:"'delay' is a comparison inside a real goal, not a standalone plan — pick retirement, education or generic." });
    // Fields valid for each goalType; anything else in params is reported as skipped, never silently misapplied.
    const ALLOWED = {
      retirement: ['age','retireAge','monthlyExpense','risk','existingSavings'],
      education: ['annualFee','yearsToCollege','courseDuration','risk','existingSavings'],
      generic: ['genType','genAmount','genYears','risk','existingSavings'],
    };
    const allowed = ALLOWED[goalType];
    const setFields = ['country','goalType'];
    const skipped = [];
    // Every value routes through advisorSetValue — no parallel validator here.
    let r = advisorSetValue('country', country);
    if (!r.ok) return JSON.stringify({ ok:false, error:r.error, failedField:'country' });
    r = advisorSetValue('goalType', goalType);
    if (!r.ok) return JSON.stringify({ ok:false, error:r.error, failedField:'goalType' });
    for (const k in params) {
      if (allowed.indexOf(k) === -1) { skipped.push(k); continue; }
      const r2 = advisorSetValue(k, params[k]);
      if (!r2.ok) return JSON.stringify({ ok:false, error:r2.error, failedField:k });
      setFields.push(k);
    }
    const idx = flow().indexOf('results');
    S.si = idx; S.quickEdit = false;
    render();
    const results = advisorGetResults();
    console.log('[skill-metric] build_goal_plan ' + (performance.now()-start).toFixed(0) + 'ms');
    return JSON.stringify({ ok:true, results: results.result, flags: results.flags, setFields: setFields, skipped: skipped });
  }
  if (name === 'highlight') return JSON.stringify(advisorHighlight(args && args.element));
  if (name === 'scroll_to') return JSON.stringify(advisorHighlight(args && args.element));
  return JSON.stringify({ ok:false, error:'Unknown tool: '+name });
}

// F2a — human-readable narration of each tool call.
function advisorDescribeTool(name, args) {
  args = args || {};
  switch (name) {
    case 'navigate': return 'Going to ' + args.screen;
    case 'set_value': return 'Setting ' + args.field + ' to ' + args.value;
    case 'get_results': return 'Calculating your number';
    case 'read_current_chart': return 'Reading the chart on your screen';
    case 'read_current_result': return 'Reading your result';
    case 'get_state': return 'Reading your answers';
    case 'highlight': case 'scroll_to': return 'Pointing you at the ' + args.element;
    case 'compose_briefing': return 'Putting together your briefing';
    case 'build_goal_plan': return 'Building your ' + (args.goalType || 'goal') + ' plan';
    default: return null;
  }
}

window.GOALDEN_ADVISOR_CONFIG = {
  state: S,
  knowledge: ADVISOR_KNOWLEDGE,
  app: 'Goalden — Quick Calculate',
  pageLabel: 'Level 1 — Quick Calculate',
  tools: function () { return advisorTools(); },
  page: function () { return flow()[S.si] || null; },
  screens: function () { return flow(); },
  executeTool: function (name, args) { return executeAdvisorTool(name, args); },
  describeTool: function (name, args) { return advisorDescribeTool(name, args); },
  briefingSections: function () { return BRIEFING_SECTIONS; },
  lang: function () { return S.country === 'US' ? 'en-US' : 'en-IN'; },
  greeting: 'Hi! I can help you plan. Tell me what you\'re saving for — retirement, education, a big purchase — or just ask a question.',
  placeholder: 'Ask, or tap the mic…',
  showDisclaimer: false
};
(function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) {}
  // A stale #hash from a previous session (e.g. #results with an empty S)
  // would otherwise let popstate jump a fresh visitor onto a blank screen —
  // wipe it before the first render lays down a clean history entry.
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (saved && typeof saved.si === 'number' && saved.si > 0) {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,40,63,.45);z-index:900;display:flex;align-items:center;justify-content:center';
    const card = document.createElement('div');
    card.style.cssText = 'background:#fff;border-radius:14px;padding:26px 28px;max-width:420px;width:calc(100vw - 48px);box-shadow:0 18px 50px rgba(20,40,63,.3);text-align:center';
    card.innerHTML = '<div style="font-family:\'Newsreader\',serif;font-size:23px;font-weight:600;color:#14283F;margin-bottom:8px">Pick up where you left off?</div>'
      + '<div style="font-size:14px;color:rgba(20,40,63,.75);margin-bottom:20px;line-height:1.5">You were partway through a plan on this device. Resume it, or start fresh.</div>';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;justify-content:center';
    const mkBtn = (label, primary) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'flex:1;padding:11px 14px;border-radius:10px;border:1px solid ' + (primary ? '#2557C7' : 'rgba(20,40,63,.25)')
        + ';background:' + (primary ? '#2557C7' : 'transparent') + ';color:' + (primary ? '#fff' : '#14283F')
        + ';font-size:14px;cursor:pointer;font-family:inherit';
      return b;
    };
    const yes = mkBtn('Resume', true), no = mkBtn('Start fresh', false);
    yes.addEventListener('click', () => {
      Object.assign(S, saved);
      // Saved si can outrun the flow if the save predates a flow change;
      // clamp so a restore can never land on a blank screen.
      S.si = Math.max(0, Math.min(flow().length - 1, S.si));
      ov.remove(); render();
    });
    no.addEventListener('click', () => { clearSavedState(); ov.remove(); render(); });
    row.append(yes, no);
    card.append(row);
    ov.append(card);
    document.body.append(ov);
  } else {
    render();
  }
})();
