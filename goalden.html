  } },
  assumptions: { title: 'Assumptions used', build: function () {
    const d = cfg().d;
    const c = cfg();
    const rows = [['Inflation', (d.inflation*100).toFixed(1)+'%'], ['Debt return', (d.debt*100).toFixed(1)+'%'], ['Hybrid return', (d.hybrid*100).toFixed(1)+'%'], ['Equity return', (d.equity*100).toFixed(1)+'%'], ['FD rate', (d.fdRate*100).toFixed(1)+'%']].map(function (r) { return '<div class="delay-row"><span class="delay-label">'+r[0]+'</span><span class="delay-value">'+r[1]+'</span></div>'; }).join('');
    return { ok:true, html: '<div class="delay-card"><div class="delay-title">Assumptions for '+c.name+'</div>'+rows+'</div>' };
  } },
  next: { title: 'What to do next', build: function () {
    return { ok:true, html: '<div class="gr-note">Adjust any input to watch the number change, or ask me to explain a specific figure against your own screen.</div>' };
  } },
  comparison: { title: 'Portfolio comparison', build: function () {
    if (!lastComparisonResult) return { ok:false, error:'Run a comparison first (compare_portfolio) before adding this section.' };
    const r = lastComparisonResult;
    const rows = r.instruments.map(function (it) {
      let extra = '';
      if (it.compoundedPct != null) extra += '<div class="delay-row"><span class="delay-label">'+it.label+' — compounded (actual)</span><span class="delay-value">'+it.compoundedPct+'%</span></div>';
      if (it.quality && it.quality.flags && it.quality.flags.length) extra += '<div class="delay-row"><span class="delay-label">'+it.label+' — data note</span><span class="delay-value">'+it.quality.flags.map(function (f) { return f.msg; }).join(' ')+'</span></div>';
      return '<div class="delay-row"><span class="delay-label">'+it.label+' ('+it.symbol+')</span><span class="delay-value">'+it.annualReturnPct+'% return, '+it.annualVolPct+'% vol</span></div>'+extra;
    }).join('');
    const mixRow = function (label, m) {
      const w = m.weights.map(function (wt, i) { return (wt*100).toFixed(0)+'% '+r.instruments[i].symbol; }).join(' / ');
      return '<div class="delay-row"><span class="delay-label">'+label+' ('+w+')</span><span class="delay-value">'+m.returnPct+'% return, '+m.volPct+'% vol, '+m.sharpe+' Sharpe</span></div>';
    };
    const corrRows = r.correlations.map(function (c) { return '<div class="delay-row"><span class="delay-label">Correlation — '+c.a+' vs '+c.b+'</span><span class="delay-value">'+c.correlation+'</span></div>'; }).join('');
    const hasCompounded = r.instruments.some(function (it) { return it.compoundedPct != null; });
    const compoundNote = hasCompounded ? '<div class="delay-row"><span class="delay-value">Compounded (actual) return reflects what the investment really earned including volatility drag; expected return is a simple average and can differ.</span></div>' : '';
    const sampledNote = r.method === 'sampled-frontier' ? '<div class="delay-row"><span class="delay-value">Weights are approximate — estimated from a sampled set of portfolios rather than solved exactly (exact solving only works for 2 instruments).</span></div>' : '';
    const chart1Title = r.n === 2 ? 'Efficient frontier' : 'Return vs. risk';
    const charts = '<div class="delay-title" style="margin-top:14px">'+chart1Title+'</div><div id="briefing-cmp-chart1" style="height:280px;width:100%"></div>'+
      '<div class="delay-title" style="margin-top:14px">Return, risk and Sharpe, side by side</div><div id="briefing-cmp-chart2" style="height:' + (60 + 38 * (r.instruments.length + 2)) + 'px;width:100%"></div>' +
      (profileCaptionHtml(lastFrontierData && lastFrontierData.assetCount === r.n ? lastFrontierData : null) ? '<div class="gr-note" style="margin-top:6px">' + profileCaptionHtml(lastFrontierData) + '</div>' : '');
    return { ok:true, html: '<div class="delay-card"><div class="delay-title">Comparing '+r.instruments.map(function (it) { return it.label; }).join(' vs ')+'</div>'+rows+
      corrRows+
      '<div class="delay-row"><span class="delay-label">Risk-free rate</span><span class="delay-value">'+r.riskFreePct+'%</span></div>'+compoundNote+
      mixRow('Minimum-variance mix', r.minVariance) + mixRow('Tangency (max Sharpe) mix', r.tangency) + sampledNote + charts + '</div>' };
  }, afterRender: function () {
    if (!lastComparisonResult || !lastFrontierData) return;
    const r = lastComparisonResult, d = lastFrontierData;
    deferChartInit(function () {
      if (r.n === 2 && d.frontier) initChart('briefing-cmp-chart1', liveFrontierChartOption(d.frontier, d.assetPoints, d.currentPoint, d.cal, d.tangencyPoint, d.currentMixLabel, d.minVarPoint));
      else initChart('briefing-cmp-chart1', barComparisonChartOption(d.assetPoints));
      initChart('briefing-cmp-chart2', profileComparisonChartOption(d.assetPoints, d.minVariance, d.tangency, d.riskFree));
    });
  } },
};

function executeAdvisorTool(name, args) {
  if (name === 'get_state') {
    return JSON.stringify(Object.assign({}, S, { page: flow()[S.si] || null, screens: flow() }));
  }
  if (name === 'get_results') return JSON.stringify(advisorGetResults());
  if (name === 'read_current_chart') return JSON.stringify(advisorReadCurrentChart());
  if (name === 'read_current_result') return JSON.stringify(advisorReadCurrentResult());
  if (name === 'navigate') {
    const screen = args && args.screen;
    const idx = flow().indexOf(screen);
    if (idx === -1) return JSON.stringify({ ok:false, error:'No screen named "'+screen+'". Valid: '+flow().join(', ') });
    S.si = idx; S.quickEdit = false;
    render();
    return JSON.stringify({ ok:true, screen, page:screen });
  }
  if (name === 'set_value') return JSON.stringify(advisorSetValue(args && args.field, args && args.value));
  if (name === 'build_goal_plan') {
    const start = performance.now();
    const goalType = args && args.goalType;
    const country = args && args.country;
    const params = (args && args.params) || {};
    if (!['retirement','education','generic','delay'].includes(goalType)) return JSON.stringify({ ok:false, error:'Invalid goalType. Valid: retirement, education, generic, delay.' });
    if (!['IN','US'].includes(country)) return JSON.stringify({ ok:false, error:'Invalid country. Valid: IN, US.' });
    if (goalType === 'delay') return JSON.stringify({ ok:false, error:"'delay' is a comparison inside a real goal, not a standalone plan — pick retirement, education or generic." });
    // Fields valid for each goalType; anything else in params is reported as skipped, never silently misapplied.
    const ALLOWED = {
      retirement: ['age','retireAge','monthlyExpense','risk','existingSavings'],
      education: ['annualFee','yearsToCollege','courseDuration','risk','existingSavings'],
      generic: ['genType','genAmount','genYears','risk','existingSavings'],
    };
    const allowed = ALLOWED[goalType];
    const setFields = ['country','goalType'];
    const skipped = [];
    const notes = [];
    // Savings belong to one goal. A user with several goals gets one build per
    // goal, so a build for a different goal type must not inherit the last
    // goal's savings: an omitted value resets to 0, and the result says so.
    if (!Object.prototype.hasOwnProperty.call(params, 'existingSavings') && S.goalType && S.goalType !== goalType && S.existingSavings) {
      notes.push('existingSavings reset from ' + S.existingSavings + ' to 0: that amount was entered for the previous ' + S.goalType + ' goal.');
      S.existingSavings = 0;
    }
    // Every value routes through advisorSetValue — no parallel validator here.
    let r = advisorSetValue('country', country);
    if (!r.ok) return JSON.stringify({ ok:false, error:r.error, failedField:'country' });
    r = advisorSetValue('goalType', goalType);
    if (!r.ok) return JSON.stringify({ ok:false, error:r.error, failedField:'goalType' });
    for (const k in params) {
      if (allowed.indexOf(k) === -1) { skipped.push(k); continue; }
      const r2 = advisorSetValue(k, params[k]);
      if (!r2.ok) return JSON.stringify({ ok:false, error:r2.error, failedField:k });
      setFields.push(k);
    }
    const idx = flow().indexOf('results');
    S.si = idx; S.quickEdit = false;
    render();
    const results = advisorGetResults();
    console.log('[skill-metric] build_goal_plan ' + (performance.now()-start).toFixed(0) + 'ms');
    return JSON.stringify({ ok:true, results: results.result, flags: results.flags, setFields: setFields, skipped: skipped, notes: notes });
  }
  if (name === 'read_other_page') return JSON.stringify(readOtherPage(args && args.page));
  if (name === 'search_instruments') return searchInstruments(args && args.query);
  if (name === 'add_instrument') return addInstrument(args && args.symbol, args && args.force);
  if (name === 'get_financial_statements') return getFinancialStatements(args && args.symbol);
  if (name === 'remove_instrument') return JSON.stringify(removeInstrument(args && args.symbol));
  if (name === 'compare_portfolio') return JSON.stringify(comparePortfolio());
  if (name === 'render_frontier_chart') return JSON.stringify(renderFrontierChart(args && args.chartType));
  if (name === 'highlight') return JSON.stringify(advisorHighlight(args && args.element));
  if (name === 'scroll_to') return JSON.stringify(advisorHighlight(args && args.element));
  return JSON.stringify({ ok:false, error:'Unknown tool: '+name });
}

// F2a — human-readable narration of each tool call.
function advisorDescribeTool(name, args) {
  args = args || {};
  switch (name) {
    case 'navigate': return 'Going to ' + args.screen;
    case 'set_value': return 'Setting ' + args.field + ' to ' + args.value;
    case 'get_results': return 'Calculating your number';
    case 'read_current_chart': return 'Reading the chart on your screen';
    case 'read_current_result': return 'Reading your result';
    case 'get_state': return 'Reading your answers';
    case 'highlight': case 'scroll_to': return 'Pointing you at the ' + args.element;
    case 'compose_briefing': return 'Putting together your briefing';
    case 'build_goal_plan': return 'Building your ' + (args.goalType || 'goal') + ' plan';
    case 'read_other_page': return 'Reading your saved ' + (OTHER_PAGE_LABELS[args.page] || args.page) + ' data';
    case 'search_instruments': return 'Searching for ' + args.query;
    case 'add_instrument': return 'Adding ' + args.symbol;
    case 'get_financial_statements': return 'Pulling financial statements for ' + args.symbol;
    case 'remove_instrument': return 'Removing ' + args.symbol;
    case 'compare_portfolio': return 'Comparing your instruments';
    case 'render_frontier_chart': return 'Drawing the ' + ((args && args.chartType) || 'frontier') + ' chart';
    default: return null;
  }
}

window.GOALDEN_ADVISOR_CONFIG = {
  state: S,
  knowledge: ADVISOR_KNOWLEDGE,
  app: 'Goalden — Quick Calculate',
  pageLabel: 'Level 1 — Quick Calculate',
  tools: function () { return advisorTools(); },
  page: function () { return flow()[S.si] || null; },
  screens: function () { return flow(); },
  executeTool: function (name, args) { return executeAdvisorTool(name, args); },
  describeTool: function (name, args) { return advisorDescribeTool(name, args); },
  briefingSections: function () { return BRIEFING_SECTIONS; },
  lang: function () { return S.country === 'US' ? 'en-US' : 'en-IN'; },
  greeting: 'Hi! I can help you plan. Tell me what you\'re saving for — retirement, education, a big purchase — or just ask a question.',
  placeholder: 'Ask, or tap the mic…',
  showDisclaimer: false
};
/* Shareable plan link. The answers ride in the URL fragment (#plan:...).
   Browsers never send the fragment to a server, so the link needs no backend and
   nothing is stored. Opening one re-checks every value against the limits the
   advisor is held to (ADVISOR_FIELDS) and the rules the wizard enforces, then
   lands on the result. Only numbers travel, never a name. Optional refinements
   (custom post-goal equity mix, EPF/PPF/NPS balances, tax slab) ride along only
   when set, so a shared plan shows the sender's numbers and a plain link stays
   short. The format key v exists so a later change to the format can refuse old
   links instead of misreading them. */
const PLAN_VERSION = '1';
const PLAN_KEYS = { c:'country', g:'goalType', a:'age', r:'retireAge', e:'monthlyExpense', s:'existingSavings', k:'risk',
  f:'annualFee', y:'yearsToCollege', d:'courseDuration', t:'genType', m:'genAmount', n:'genYears' };
const PLAN_NEEDS = { retirement:['age','retireAge','monthlyExpense','risk'], education:['annualFee','yearsToCollege','courseDuration','risk'], generic:['genType','genAmount','genYears','risk'] };
const PLAN_ACC = { ab:'epfBal', ac:'epfBasic', pb:'ppfBal', py:'ppfYearly', nb:'npsBal', nm:'npsMonthly' };
// Digits only: Number() would let "0x20" or "1e1" through as 32 and 10.
function planInt(raw, lo, hi) { return /^\d{1,10}$/.test(raw) && +raw >= lo && +raw <= hi ? +raw : null; }
function planLink() {
  const p = new URLSearchParams();
  p.set('v', PLAN_VERSION);
  const keep = ['country', 'goalType', 'existingSavings'].concat(PLAN_NEEDS[S.goalType] || []);
  Object.entries(PLAN_KEYS).forEach(([short, key]) => { if (keep.includes(key) && S[key] != null && S[key] !== 0) p.set(short, S[key]); });
  if (S.goalType === 'retirement' && S.postRetAlloc) p.set('pe', Math.round(S.postRetAlloc.eq * 100));
  if (S.goalType === 'education' && S.eduAlloc) p.set('ee', Math.round(S.eduAlloc.eq * 100));
  const acc = S.goalType === 'retirement' && S.country === 'IN' ? accClean(S.acc) : null;
  if (acc) {
    Object.entries(PLAN_ACC).forEach(([short, key]) => { if (acc[key] > 0) p.set(short, acc[key]); });
    if (acc.epfWage === 'ceiling') p.set('aw', 'c');
  }
  if (S.country === 'IN' && TAX_IN.newRegimeSlabs.includes(S.taxSlab)) p.set('x', S.taxSlab);
  // href, not origin: origin is the string "null" for a page opened from disk.
  return location.href.split('#')[0].split('?')[0] + '#plan:' + p.toString();
}
function readPlanLink(hash) {
  if (!hash || hash.indexOf('#plan:') !== 0) return null;
  const p = new URLSearchParams(hash.slice(6)), out = {};
  if (p.get('v') !== PLAN_VERSION) return null;   // another format, or a hand-typed fragment: refused, never guessed at
  for (const [short, key] of Object.entries(PLAN_KEYS)) {
    if (!p.has(short)) continue;
    const spec = ADVISOR_FIELDS.find(f => f.name === key), raw = p.get(short);
    if (!spec) return null;
    if (spec.enum) { if (!spec.enum.includes(raw)) return null; out[key] = raw; continue; }
    const v = planInt(raw, spec.min, spec.max);
    if (v == null) return null;
    out[key] = v;
  }
  const needs = PLAN_NEEDS[out.goalType];
  if (!out.country || !needs || needs.some(k => out[k] == null)) return null;
  if (out.goalType === 'retirement' && !(out.retireAge > out.age && out.monthlyExpense > 0)) return null;
  if (out.goalType === 'education' && !(out.annualFee > 0)) return null;
  if (out.goalType === 'generic' && !(out.genAmount > 0)) return null;
  // The refinements. Equity mixes stay as percentages here: the split of the rest depends on the risk answer, which applyPlanLink has set by then.
  out.alloc = { ret: null, edu: null };
  if (p.has('pe') && (out.alloc.ret = planInt(p.get('pe'), 0, 100)) == null) return null;
  if (p.has('ee') && (out.alloc.edu = planInt(p.get('ee'), 0, 100)) == null) return null;
  if (p.has('x')) { const x = planInt(p.get('x'), 0, 100); if (x == null || !TAX_IN.newRegimeSlabs.includes(x)) return null; out.taxSlab = x; }
  const acc = {};
  for (const [short, key] of Object.entries(PLAN_ACC)) {
    if (!p.has(short)) continue;
    const v = planInt(p.get(short), 1, 1e9);
    if (v == null) return null;
    acc[key] = v;
  }
  if (p.has('aw')) { if (p.get('aw') !== 'c') return null; acc.epfWage = 'ceiling'; }
  out.acc = out.country === 'IN' && out.goalType === 'retirement' ? accClean(acc) : null;
  return out;
}
// Start from a clean slate, so nothing from a plan already on this device leaks in.
function applyPlanLink(linked) {
  const fields = Object.assign({}, linked), alloc = fields.alloc;
  delete fields.alloc;
  Object.assign(S, { age:null, retireAge:null, monthlyExpense:null, annualFee:null, yearsToCollege:null, courseDuration:null,
    genType:null, genAmount:null, genYears:null, existingSavings:0, risk:null, postRetAlloc:null, eduAlloc:null,
    acc:null, taxSlab:null, persona:null, quickEdit:false, viewingCase:false }, fields);
  if (alloc.ret != null && S.goalType === 'retirement') S.postRetAlloc = allocFromEquityPct(alloc.ret, riskAllocation());
  if (alloc.edu != null && S.goalType === 'education') S.eduAlloc = allocFromEquityPct(alloc.edu, riskAllocation());
  planGhost = null;
  lcStart = null;   // the canvas's "vs where you started" and Undo belong to the plan being replaced
  S.si = flow().indexOf('results');
}
// A link that fails its checks is not guessed at, but the person who clicked it is told, rather than left on a blank start.
function planLinkRefusedNotice() {
  const n = document.createElement('div');
  n.className = 'plan-notice'; n.setAttribute('role', 'status');
  n.textContent = 'That plan link could not be opened: it was cut short or holds a number outside the allowed range. Ask whoever sent it for the link again.';
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 9000);
}
(function boot() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) {}
  // A shared plan link wins over "pick up where you left off": the person
  // clicked a link to see that plan. Read it before the hash is wiped below.
  const linked = readPlanLink(location.hash), refused = !linked && (location.hash || '').indexOf('#plan:') === 0;
  // A stale #hash from a previous session (e.g. #results with an empty S)
  // would otherwise let popstate jump a fresh visitor onto a blank screen —
  // wipe it before the first render lays down a clean history entry.
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (linked) {
    applyPlanLink(linked);
    render();
  } else if (saved && typeof saved.si === 'number' && saved.si > 0) {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,40,63,.45);z-index:900;display:flex;align-items:center;justify-content:center';
    const card = document.createElement('div');
    card.style.cssText = 'background:#fff;border-radius:14px;padding:26px 28px;max-width:420px;width:calc(100vw - 48px);box-shadow:0 18px 50px rgba(20,40,63,.3);text-align:center';
    card.innerHTML = '<div style="font-family:\'Newsreader\',serif;font-size:23px;font-weight:600;color:#14283F;margin-bottom:8px">Pick up where you left off?</div>'
      + '<div style="font-size:14px;color:rgba(20,40,63,.75);margin-bottom:20px;line-height:1.5">You were partway through a plan on this device. Resume it, or start fresh.</div>';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;justify-content:center';
    const mkBtn = (label, primary) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'flex:1;padding:11px 14px;border-radius:10px;border:1px solid ' + (primary ? '#2557C7' : 'rgba(20,40,63,.25)')
        + ';background:' + (primary ? '#2557C7' : 'transparent') + ';color:' + (primary ? '#fff' : '#14283F')
        + ';font-size:14px;cursor:pointer;font-family:inherit';
      return b;
    };
    const yes = mkBtn('Resume', true), no = mkBtn('Start fresh', false);
    yes.addEventListener('click', () => {
      Object.assign(S, saved);
      // Saved si can outrun the flow if the save predates a flow change;
      // clamp so a restore can never land on a blank screen.
      S.si = Math.max(0, Math.min(flow().length - 1, S.si));
      ov.remove(); render();
    });
    no.addEventListener('click', () => { clearSavedState(); ov.remove(); render(); });
    row.append(yes, no);
    card.append(row);
    ov.append(card);
    document.body.append(ov);
  } else {
    render();
  }
  if (refused) planLinkRefusedNotice();
})();

</script>
