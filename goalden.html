<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Goalden — find your number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/echarts.min.js"></script>
<style>
:root{
  /* White + shades of blue (Track C repalette). --ink/--paper keep their
     original roles (dark accent-text / primary body text) but both now
     hold dark navy, since the page flipped from a dark canvas to a light
     one -- --bg is the new light canvas colour that used to live in --ink. */
  --bg:#F5F8FC; --ink:#14283F; --ink2:#1B3A63; --paper:#14283F; --card:#FFFFFF;
  --gold:#2557C7; --gold-deep:#1E4FBE; --red:#A03A22;
  --body:#3C5470; --dim:#5E7290; --rule:rgba(20,40,63,.14);
  --ok:#2E8B6F; --teal:#2D6E6E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:'Figtree',system-ui,sans-serif;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;flex-shrink:0}
.brand{font-family:'Newsreader',serif;font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--gold);text-decoration:none;display:inline-block}
.brand span{color:var(--paper);font-weight:400;font-style:italic;font-size:14px;margin-left:6px;opacity:.7}
.backbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(20,40,63,.25);background:transparent;color:var(--paper);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.assumpbtn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(37,87,199,.5);background:rgba(37,87,199,.12);color:var(--gold);font-family:'Newsreader',serif;font-style:italic;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.assumpbtn.show{opacity:1;pointer-events:auto}
.backbtn.show{opacity:1;pointer-events:auto}
.progress{display:flex;gap:6px;padding:2px 20px 18px;flex-shrink:0}
.dot{height:4px;flex:1;background:rgba(20,40,63,.16);border-radius:2px;overflow:hidden}
.dot i{display:block;height:100%;width:0%;background:var(--gold);border-radius:2px;transition:width .35s ease}
.dot.done i,.dot.active i{width:100%}

.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;padding:8px 24px 24px;display:flex;flex-direction:column;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .3s ease,transform .3s ease;min-height:0}
/* Same fix as Door 2: switching to position:relative here for the active
   screen drops the height that inset:0 was providing (relative positioning
   only offsets, it doesn't size), so tall content just grew past .stage's
   box and got silently clipped by overflow:hidden with no scrollbar. This
   was never actually applied here before, only in Door 2. */
.screen.active{opacity:1;transform:translateX(0);pointer-events:auto;position:relative;height:100%;min-height:0}

.q-eyebrow{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.q-title{font-family:'Newsreader',serif;font-weight:600;font-size:clamp(22px,7vw,30px);line-height:1.18;color:var(--paper);margin-bottom:8px}
.q-sub{font-size:14px;color:rgba(20,40,63,.65);margin-bottom:26px;max-width:38ch;line-height:1.5}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:16px;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* country grid */
.country-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.country-card{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.14);border-radius:6px 18px 6px 18px;padding:24px 14px;text-align:center;cursor:pointer;transition:all .18s}
.country-card:active{transform:scale(.97)}
.country-card.selected{background:rgba(37,87,199,.16);border-color:var(--gold)}
.country-badge{width:44px;height:44px;border-radius:50%;background:rgba(37,87,199,.14);border:1px solid rgba(37,87,199,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-family:'Newsreader',serif;font-size:22px;color:var(--gold)}
.country-name{font-family:'Newsreader',serif;font-size:17px;font-weight:600;color:var(--paper)}
.country-cur{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);margin-top:3px}

/* goal grid */
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-card{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.14);border-radius:4px 16px 4px 16px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .18s}
.goal-card:active{transform:scale(.97)}
.goal-card.selected{background:rgba(37,87,199,.16);border-color:var(--gold)}
.goal-icon{width:26px;height:26px;margin-bottom:9px;display:block;color:var(--gold)}
.goal-icon svg{width:100%;height:100%}
.goal-name{font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:var(--paper);line-height:1.2}
.goal-tag{font-size:12px;color:rgba(20,40,63,.55);margin-top:4px}

/* generic goal type picker */
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gen-card{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.14);border-radius:4px 14px 4px 14px;padding:14px;text-align:center;cursor:pointer;transition:all .18s}
.gen-card:active{transform:scale(.97)}
.gen-card.selected{background:rgba(37,87,199,.16);border-color:var(--gold)}
.gen-icon{width:22px;height:22px;display:block;margin-bottom:6px;color:var(--gold)}
.gen-icon svg{width:100%;height:100%}
.gen-label{font-size:13.5px;font-weight:600;color:var(--paper)}
.gen-rate{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}

/* number input */
.num-wrap{display:flex;align-items:baseline;gap:8px;padding:18px 0;border-bottom:2px solid rgba(20,40,63,.2)}
.num-prefix{font-family:'Newsreader',serif;font-size:28px;color:var(--gold)}
.num-input{flex:1;background:transparent;border:none;outline:none;color:var(--paper);font-family:'Newsreader',serif;font-size:clamp(30px,10vw,42px);font-weight:600;-moz-appearance:textfield}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-suffix{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--dim);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.chip{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--paper);background:rgba(20,40,63,.08);border:1px solid rgba(20,40,63,.18);padding:9px 15px;border-radius:3px;cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.selected{background:var(--gold);border-color:var(--gold);color:#fff}
.inline-error{color:#E8977A;font-size:13px;margin-top:14px;font-family:'Spline Sans Mono',monospace;min-height:16px}
.value-slider{margin:18px 0 8px}
.value-slider input[type=range]{width:100%;accent-color:var(--gold);height:22px;cursor:pointer}
.value-slider-labels{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}
/* Custom slider thumb + track -- every range input in this app was
   previously the bare OS control, tinted only by accent-color. This
   replaces it everywhere with one consistent tactile design. */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(20,40,63,.14)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(20,40,63,.14)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);margin-top:-6px;box-shadow:0 1px 4px rgba(20,40,63,.3);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 1px 4px rgba(20,40,63,.3);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:hover::-moz-range-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22);box-shadow:0 2px 8px rgba(37,87,199,.4)}
input[type=range]:active::-moz-range-thumb{transform:scale(1.22);box-shadow:0 2px 8px rgba(37,87,199,.4)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--gold);outline-offset:2px}
input[type=range]:focus-visible::-moz-range-thumb{outline:2px solid var(--gold);outline-offset:2px}
.chips-label{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px}
.optional-field{margin-top:20px;padding-top:20px;border-top:1px dashed rgba(20,40,63,.18)}
.optional-label{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.num-wrap-sm{display:flex;align-items:baseline;gap:6px;padding:10px 0;border-bottom:1px solid rgba(20,40,63,.15)}
.num-prefix-sm{font-family:'Newsreader',serif;font-size:18px;color:rgba(37,87,199,.6)}
.num-input-sm{flex:1;background:transparent;border:none;outline:none;color:rgba(20,40,63,.75);font-family:'Newsreader',serif;font-size:22px;font-weight:600;-moz-appearance:textfield}
.num-input-sm::-webkit-outer-spin-button,.num-input-sm::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* risk */
.risk-stack{display:flex;flex-direction:column;gap:12px}
.risk-card{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.14);border-radius:3px 16px 16px 16px;padding:19px 18px;cursor:pointer;transition:all .18s;text-align:left}
.risk-card:active{transform:scale(.98)}
.risk-card.selected{background:rgba(37,87,199,.14);border-color:var(--gold)}
.risk-card h4{font-family:'Newsreader',serif;font-size:16.5px;color:var(--paper);margin-bottom:4px}
.risk-card p{font-size:13px;color:rgba(20,40,63,.6);line-height:1.4}

/* CTA */
.cta-zone{padding:14px 0 4px;flex-shrink:0}
.cta{width:100%;background:var(--gold);color:#fff;border:none;border-radius:9px;font-family:'Figtree',sans-serif;font-weight:700;font-size:16px;padding:17px;cursor:pointer;transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.3;pointer-events:none}

/* results */
.result-scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;min-height:0}
.result-intro{text-align:center;font-family:'Newsreader',serif;font-style:italic;font-size:15px;color:rgba(20,40,63,.72);padding:4px 12px 18px;line-height:1.5}
.hero-number{text-align:center;padding:6px 0 4px}
.hero-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.hero-figure{font-family:'Newsreader',serif;font-weight:600;font-size:clamp(42px,15vw,64px);color:var(--paper);line-height:0.95;letter-spacing:-.01em}
.hero-sub{font-size:13.5px;color:rgba(20,40,63,.55);margin-top:10px}
.action-card{background:var(--gold);color:#fff;border-radius:3px 22px 22px 22px;padding:22px 24px;margin:26px 0 18px}
.action-card .al{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.action-card .af{font-family:'Newsreader',serif;font-weight:700;font-size:28px;margin:5px 0 8px}
.action-card .as{font-size:13.5px;line-height:1.5}
.chart-card{background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.12);border-radius:2px 2px 18px 18px;padding:18px 16px 8px;margin-bottom:18px}
/* "The Case" screen */
.case-wrap{padding-bottom:20px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.case-hero{padding:8px 0 20px;text-align:center}
.case-eyebrow{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.case-title{font-family:'Newsreader',serif;font-size:23px;color:var(--paper);line-height:1.3;margin-bottom:10px}
.case-sub{font-size:13.5px;color:rgba(20,40,63,.65);line-height:1.55;max-width:44ch;margin:0 auto}
.case-section{background:rgba(20,40,63,.045);border:1px solid rgba(20,40,63,.12);border-radius:2px 16px 16px 16px;padding:20px 18px;margin-bottom:16px}
.case-section h4{font-family:'Newsreader',serif;font-size:17px;color:var(--paper);margin-bottom:6px;line-height:1.3}
.case-section .case-cap{font-size:12.5px;color:rgba(20,40,63,.6);line-height:1.5;margin-bottom:14px}
.race-legend{display:flex;gap:14px;justify-content:center;margin:8px 0 14px;flex-wrap:wrap}
.race-legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(20,40,63,.6);font-family:'Spline Sans Mono',monospace}
.race-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.race-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.race-stat{background:rgba(20,40,63,.05);border-radius:3px 10px 10px 10px;padding:11px 9px;text-align:center}
.race-stat .rs-label{font-family:'Spline Sans Mono',monospace;font-size:9px;letter-spacing:.04em;color:rgba(20,40,63,.5);margin-bottom:5px}
.race-stat .rs-val{font-family:'Newsreader',serif;font-size:16px;font-weight:600}
.case-slider-row{margin:14px 0 6px}
.case-slider-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:rgba(20,40,63,.7);margin-bottom:8px}
.case-slider-label b{color:var(--gold);font-family:'Spline Sans Mono',monospace}
.case-callout{background:rgba(232,151,122,.1);border:1px solid rgba(232,151,122,.3);border-radius:3px 12px 12px 12px;padding:12px 14px;margin-top:10px;font-size:12.5px;line-height:1.5;color:rgba(20,40,63,.85)}
.case-callout.good{background:rgba(143,199,142,.1);border-color:rgba(143,199,142,.3)}
.holdbar-track{display:flex;height:26px;border-radius:3px;overflow:hidden;margin:12px 0 6px}
.holdbar-seg{transition:width .2s ease}
.holdbar-legend{display:flex;justify-content:space-between;font-size:11px;color:rgba(20,40,63,.5);font-family:'Spline Sans Mono',monospace}
.growth-chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:14px 0;font-size:12.5px}
.growth-chain .gc-node{background:rgba(37,87,199,.12);border:1px solid rgba(37,87,199,.3);border-radius:3px 9px 9px 9px;padding:7px 11px;color:rgba(20,40,63,.85)}
.growth-chain .gc-arrow{color:rgba(20,40,63,.35);font-size:14px}
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.compare-card{background:rgba(20,40,63,.05);border-radius:3px 10px 10px 10px;padding:12px}
.compare-card .cc-label{font-family:'Spline Sans Mono',monospace;font-size:9.5px;color:rgba(20,40,63,.5);margin-bottom:5px}
.compare-card .cc-val{font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:var(--paper);margin-bottom:3px}
.compare-card .cc-note{font-size:11px;color:rgba(20,40,63,.5);line-height:1.4}
.case-back-row{padding:16px 0 8px;text-align:center}
.case-back-row button{background:none;border:1px solid rgba(20,40,63,.2);color:rgba(20,40,63,.7);font-family:'Spline Sans Mono',monospace;font-size:12px;padding:10px 20px;border-radius:3px;cursor:pointer}
.term-i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid rgba(20,40,63,.4);color:rgba(20,40,63,.6);font-size:9px;font-family:'Spline Sans Mono',monospace;cursor:pointer;position:relative;margin-left:2px;vertical-align:middle}
.term-i-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid rgba(37,87,199,.3);box-shadow:0 8px 20px rgba(20,40,63,.14);border-radius:9px;padding:9px 12px;font-size:11.5px;color:rgba(20,40,63,.85);z-index:20;pointer-events:none;width:220px;line-height:1.45;font-family:'Figtree',sans-serif;font-weight:400;text-align:left;white-space:normal}
.chart-title{font-family:'Newsreader',serif;font-size:15.5px;color:var(--paper);margin-bottom:2px}
.chart-caption{font-size:12px;color:rgba(20,40,63,.5);margin-bottom:10px}
.alloc-flex{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.alloc-legend{flex:1;min-width:140px}
.alloc-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.alloc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.alloc-name{flex:1;font-size:13px;color:rgba(20,40,63,.8)}
.alloc-pct{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--paper);font-weight:600}
.alloc-return-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid rgba(20,40,63,.1)}
.alloc-return-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.04em;margin-bottom:3px}
.alloc-return-value{font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:var(--paper)}
/* Cap only the chart itself, not the surrounding layout: charts were
   designed and tuned around a ~380-480px column, so uncapped they grow to
   fill however wide the card happens to be (600px+ on a real desktop
   monitor), which looks oversized and hard to read. Everything else on
   the page stays genuinely full-width -- this was the actual fix needed,
   not shrinking the whole app into a narrow column, which is worse: it
   leaves most of a normal monitor empty and looks broken. */
.echart{width:100%;max-width:480px;margin:0 auto}

/* delay card */
.delay-card{background:rgba(37,87,199,.05);border:1px solid rgba(37,87,199,.25);border-radius:16px 3px 16px 16px;padding:19px 20px;margin-bottom:20px}
.delay-title{font-family:'Newsreader',serif;font-size:15px;color:var(--paper);margin-bottom:12px}
.delay-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(20,40,63,.1)}
.delay-row:last-child{border-bottom:none}
.delay-label{font-size:13px;color:rgba(20,40,63,.7)}
.delay-value{font-family:'Newsreader',serif;font-size:15px;color:var(--paper);font-weight:600}
.delay-extra{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--red);margin-left:6px}

.assump-toggle{font-family:'Spline Sans Mono',monospace;font-size:12px;color:rgba(20,40,63,.5);text-align:center;padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tog-caret{display:inline-block;vertical-align:-1px;margin-right:6px;transition:transform .25s ease}
.assump-toggle.open .tog-caret{transform:rotate(180deg)}
.schedule-table{width:100%;border-collapse:collapse;font-family:'Spline Sans Mono',monospace;font-size:11px;margin-top:6px}
.schedule-table th{text-align:right;padding:6px 7px;color:var(--dim);font-weight:500;border-bottom:1px solid rgba(20,40,63,.15)}
.schedule-table th:first-child,.schedule-table td:first-child{text-align:left}
.schedule-table td{text-align:right;padding:5px 7px;color:rgba(20,40,63,.7);border-bottom:1px solid rgba(20,40,63,.06)}
.schedule-scroll{max-height:280px;overflow-y:auto;border-radius:8px;margin-top:8px}
.edit-row{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 14px}
.edit-chip{font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(20,40,63,.65);background:rgba(20,40,63,.06);border:1px solid rgba(20,40,63,.16);border-radius:2px 10px 10px 10px;padding:6px 11px;cursor:pointer;transition:border-color .15s,color .15s}
.edit-chip:hover{border-color:rgba(37,87,199,.5);color:var(--paper)}
.edit-chip::before{content:'edit \2192  ';opacity:.5;font-size:9.5px}
.assump-panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
.assump-panel.open{max-height:500px}
/* The breakdown toggle holds two charts plus several comparison cards --
   much taller than the single schedule table the default 500px cap was
   sized for -- so it gets its own higher ceiling instead of raising the
   shared .assump-panel.open cap (which would also loosen the schedule/
   assumptions panels for no reason). */
.assump-panel.detail-panel.open{max-height:8000px}
.assump-inner{padding:4px 2px 18px;font-size:12.5px;color:rgba(20,40,63,.6);line-height:1.8}
.assump-inner b{color:var(--paper)}
/* Advanced allocation override -- attached inline to a flat post-goal
   rate line, opt-in, collapsed by default unless already customized. */
.adv-toggle{display:inline-flex;align-items:center;gap:5px;font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--gold);cursor:pointer;margin:2px 0 4px;text-align:left}

<body>
<div class="topbar">
  <button class="backbtn" id="backBtn" aria-label="Back">←</button>
  <a href="index.html" class="brand">Goalden<span>quick calculate</span></a>
  <button class="assumpbtn" id="assumpBtn" aria-label="View assumptions" title="What assumptions are we using?">i</button>
</div>
<div class="progress" id="progress"></div>
<div class="stage" id="stage"></div>

<script src="goalden-engine.js"></script>
<script>
'use strict';

echarts.registerTheme('goalden', {
  color: ['#2557C7','#8FC79E','#D97757','#5FA875','#E8977A','#14283F'],
  backgroundColor: 'transparent',
  textStyle: { fontFamily: "'Spline Sans Mono', monospace", color: 'rgba(20,40,63,.75)' },
  title: { textStyle: { fontFamily: "'Newsreader', serif", color: '#14283F', fontWeight: 600 } },
  grid: { left: 44, right: 16, top: 16, bottom: 30, containLabel: true },
  categoryAxis: { axisLine:{lineStyle:{color:'rgba(20,40,63,.2)'}}, axisLabel:{color:'rgba(20,40,63,.5)'}, splitLine:{show:false} },
  valueAxis: { axisLine:{show:false}, axisLabel:{color:'rgba(20,40,63,.5)'}, splitLine:{lineStyle:{color:'rgba(20,40,63,.08)'}} },
  tooltip: { backgroundColor:'#FFFFFF', borderColor:'rgba(37,87,199,.4)', borderWidth:1, textStyle:{color:'#14283F', fontFamily:"'Spline Sans Mono',monospace", fontSize:11}, extraCssText:'border-radius:3px 8px 8px 8px;box-shadow:0 6px 18px rgba(20,40,63,.16)' },
});
const chartInstances = {};
function initChart(id, option, optsOverride){
  const dom = document.getElementById(id);
  if(!dom) return null;
  let entry = chartInstances[id];
  if(entry && entry.dom !== dom){ entry.inst.dispose(); entry = null; }
  if(!entry){
    const inst = echarts.init(dom, 'goalden', Object.assign({renderer:'svg'}, optsOverride));
    entry = chartInstances[id] = { inst, dom };
  }
  entry.inst.setOption(option, true);
  return entry.inst;
}
function disposeChart(id){ if(chartInstances[id]){ chartInstances[id].inst.dispose(); delete chartInstances[id]; } }
function deferChartInit(fn){ setTimeout(fn, 0); }

/* =====================================================================
   ENGINE — the shared financial math now lives in goalden-engine.js
   (inflateExpense, realRate, corpusRequired, solveSIP, effectiveMonthlyRate,
   accumulationSchedule, marketSeries, marketName, and the market-history
   helpers), loaded via the <script> tag just above. Tested against solved
   workbooks in engine.test.js (`node --test engine.test.js`).
   ===================================================================== */
function caretSvg() {
  return '<svg class="tog-caret" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
}
function yearlyAmortization(monthlyRows) {
  const years = []; let prevClose = 0, prevContributed = 0;
  for (let m = 0; m < monthlyRows.length; m += 12) {
    const end = monthlyRows[Math.min(m + 11, monthlyRows.length - 1)];
    const contributedThisYear = end.contributed - prevContributed;
    const growthThisYear = end.closeBal - prevClose - contributedThisYear;
    years.push({ year: years.length + 1, contributed: Math.round(contributedThisYear), growth: Math.round(growthThisYear), close: Math.round(end.closeBal) });
    prevClose = end.closeBal; prevContributed = end.contributed;
  }
  return years;
}
// mountainChart() labels each point "Year N" from its raw array index --
// feeding it accumulationSchedule()'s rows directly (one row per MONTH)
// mislabels month 109 as "Year 109" instead of one point per real year.
// Bucket to yearly first, using each year's real cumulative totals (not
// yearlyAmortization()'s per-year deltas, which the chart isn't built for).
function yearlyMountainRows(monthlyRows) {
  const rows = [];
  for (let m = 0; m < monthlyRows.length; m += 12) {
    const end = monthlyRows[Math.min(m + 11, monthlyRows.length - 1)];
    rows.push({ contributed: end.contributed, closeBal: end.closeBal });
  }
  return rows;
}
function drawdownSchedule(opts) {
  const rows = []; let bal = opts.openingCorpus; let w = opts.firstWithdrawal;
  for (let yr = 1; yr <= opts.years; yr++) {
    let close;
    if (opts.due) { const baw = bal - w; close = baw + baw * opts.nominalRate; }
    else { close = (bal + bal * opts.nominalRate) - w; }
    rows.push({ year: yr, openBal: bal, withdrawal: w, closeBal: Math.max(0, close) });
    bal = close;
    w *= (1 + opts.inflation);
  }
  return rows;
}

/* =====================================================================
   CONFIG
   ===================================================================== */
const C = {
  IN: {
    code:'IN', flag:'🇮🇳', name:'India', sym:'₹',
    d: { inflation:.06, eduInflation:.10, debt:.07, hybrid:.10, equity:.12, postRet:.09, lifeExp:78, fdRate:.065 },
    goalInflation: { house:.075, car:.05, wedding:.07, travel:.05 },
    expChips: [25000, 50000, 100000, 200000],
    feeChips: [50000, 100000, 200000, 500000],
    amtChips: [500000, 1000000, 2500000, 5000000],
    ageChips: [22, 25, 30, 35, 40],
    retireChips: [55, 60, 65],
    collegeChips: [5, 8, 10, 15],
    goalYrChips: [3, 5, 7, 10],
    fmt(amt, dp) {
      if (dp === undefined) dp = 0;
      const s = (amt < 0 ? '-' : ''), a = Math.abs(amt);
      const [i, d] = a.toFixed(dp).split('.');
      const last3 = i.slice(-3), rest = i.slice(0, -3);
      const grouped = (rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' : '') + last3;
      return s + '₹' + grouped + (dp > 0 ? '.' + d : '');
    },
    compact(amt) {
      const a = Math.abs(amt);
      if (a >= 1e7) return '₹' + (a/1e7).toFixed(1) + ' Cr';
      if (a >= 1e5) return '₹' + (a/1e5).toFixed(1) + ' L';
      return this.fmt(amt);
    }
  },
  US: {
    code:'US', flag:'🇺🇸', name:'United States', sym:'$',
    d: { inflation:.025, eduInflation:.05, debt:.045, hybrid:.07, equity:.09, postRet:.06, lifeExp:82, fdRate:.04 },
    goalInflation: { house:.04, car:.03, wedding:.04, travel:.03 },
    expChips: [2000, 4000, 6000, 10000],
    feeChips: [10000, 20000, 40000, 60000],
    amtChips: [50000, 100000, 250000, 500000],
    ageChips: [22, 25, 30, 35, 40],
    retireChips: [60, 65, 67],
    collegeChips: [5, 8, 10, 15],
    goalYrChips: [3, 5, 7, 10],
    fmt(amt, dp) {
      if (dp === undefined) dp = 0;
      const s = (amt < 0 ? '-' : ''), a = Math.abs(amt);
      const [i, d] = a.toFixed(dp).split('.');
      return s + '$' + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (dp > 0 ? '.' + d : '');
    },
    compact(amt) {
      const a = Math.abs(amt);
      if (a >= 1e6) return '$' + (a/1e6).toFixed(1) + 'M';
      if (a >= 1e3) return '$' + (a/1e3).toFixed(1) + 'K';
      return this.fmt(amt);
    }
  }
};

// Real historical market data (Sensex + S&P 500 series) and its helpers
// (marketSeries(country), marketName(country), compoundPath,
// marketGrowthPath, rollingWindows, worstWindow, bestWindow) now live in
// goalden-engine.js, loaded above. marketSeries/marketName take `country`
// as an explicit parameter — they no longer read S.country directly.

const RISK = [
  { id:'cautious', title:"I'd rather avoid big swings", desc:'Steadier path, lower growth: mixes safer options with some growth.', eq:.25, de:.60, hy:.15 },
  { id:'balanced', title:'Some ups and downs are fine', desc:'A blend of growth and stability, the middle path most people pick.', eq:.50, de:.35, hy:.15 },
  { id:'growth',   title:"I'm investing for the long run", desc:'More growth-focused. Expect a bumpier ride on the way there.', eq:.75, de:.15, hy:.10 },
];

const ICONS = {
  retirement: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.1 5.1l2.1 2.1M16.8 16.8l2.1 2.1M5.1 18.9L7.2 16.8M16.8 7.2l2.1-2.1"/></svg>',
  education: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5-10-5z"/><path d="M6 11.2v4.8c0 1.5 3 3 6 3s6-1.5 6-3v-4.8"/><path d="M22 9v6.5"/></svg>',
  house: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2.5"/></svg>',
  car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.4-4.8A2 2 0 0 1 6.3 6.8h11.4a2 2 0 0 1 1.9 1.4L21 13"/><rect x="2" y="13" width="20" height="5" rx="1.5"/><circle cx="7" cy="18.3" r="1.4"/><circle cx="17" cy="18.3" r="1.4"/></svg>',
  wedding: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="14" r="5"/><circle cx="15" cy="14" r="5"/></svg>',
  travel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2.5L11 13"/><path d="M21.5 2.5l-6.8 19-3.7-8-8-3.7z"/></svg>',
};

const GOALS = [
  { id:'retirement', icon:ICONS.retirement, name:'Retirement', tag:'Stop working someday' },
  { id:'education',  icon:ICONS.education, name:'Education', tag:"A child's college fund" },
  { id:'generic',    icon:ICONS.house, name:'A big purchase', tag:'House, car, wedding' },
  { id:'delay',      icon:ICONS.clock, name:'Cost of waiting', tag:'See what a delay costs' },
];

const GEN_TYPES = [
  { id:'house',   icon:ICONS.house, label:'House', rateKey:'house' },
  { id:'car',     icon:ICONS.car, label:'Car', rateKey:'car' },
  { id:'wedding', icon:ICONS.wedding, label:'Wedding', rateKey:'wedding' },
  { id:'travel',  icon:ICONS.travel, label:'Holiday', rateKey:'travel' },
];

/* =====================================================================
   STATE + FLOWS
   ===================================================================== */
const S = {
  country: null, goalType: null,
  age: null, retireAge: null, monthlyExpense: null,
  annualFee: null, yearsToCollege: null, courseDuration: null,
  genType: null, genAmount: null, genYears: null, existingSavings: 0,
  risk: null, si: 0, quickEdit: false,
  // Advanced, opt-in overrides for the flat post-goal rate (d.postRet /
  // d.debt). null = use the flat default; {eq,de,hy} once the user has
  // picked a custom post-goal mix via the "Advanced" control under the
  // relevant assumption line.
  postRetAlloc: null, eduAlloc: null
};

function flow() {
  if (!S.goalType) return ['country', 'goal'];
  let f;
  if (S.goalType === 'retirement') f = ['country','goal','age','expense','risk','results'];
  else if (S.goalType === 'education')  f = ['country','goal','edu_fee','edu_years','risk','results'];
  else if (S.goalType === 'generic')    f = ['country','goal','gen_type','gen_amount','gen_years','risk','results'];
  else if (S.goalType === 'delay')      f = ['country','goal','delay_corpus','delay_years','results'];
  else return ['country','goal'];
  // "The Case" is an optional deeper screen reached from results, not a
  // forced step -- someone who just wants their number never has to see
  // it, but it's one tap away for anyone who wants to know why.
  if (S.viewingCase) f = [...f, 'case'];
  return f;
}

function cfg() { return C[S.country]; }

function riskAllocation() {
  return RISK.find(x => x.id === S.risk) || RISK[1];
}
function riskRate() {
  const d = cfg().d, a = riskAllocation();
  return a.eq*d.equity + a.de*d.debt + a.hy*d.hybrid;
}
// Same eq/de/hy blend as riskRate(), but for an arbitrary allocation --
// used by the advanced post-goal rate override.
function blendedRate(alloc, d) {
  return alloc.eq*d.equity + alloc.de*d.debt + alloc.hy*d.hybrid;
}
// Turns a single "how much equity" slider into a full eq/de/hy split by
// keeping debt:hybrid in whatever ratio the base risk profile already
// used -- same redistribution idea as a glide path, just applied on
// demand instead of by age.
function allocFromEquityPct(eqPct, base) {
  const eq = eqPct/100;
  const deHyTotal = base.de + base.hy;
  const deShare = deHyTotal > 0 ? base.de/deHyTotal : 0.75;
  const rest = 1 - eq;
  return { eq, de: rest*deShare, hy: rest*(1-deShare) };
}

/* =====================================================================
   CALCULATION
   ===================================================================== */
function calcRetirement() {
  const d = cfg().d, c = cfg();
  const yrs = S.retireAge - S.age;
  const drawYrs = Math.max(5, d.lifeExp - S.retireAge);
  const annualExp = S.monthlyExpense * 12;
  const expAtRet = inflateExpense(annualExp, [{rate: d.inflation, years: yrs}], 0.75);
  const postRetRate = S.postRetAlloc ? blendedRate(S.postRetAlloc, d) : d.postRet;
  const rr = realRate(postRetRate, d.inflation);
  const corpus = corpusRequired(rr, drawYrs, expAtRet, true);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  // Existing savings are assumed to stay invested the same way the new SIP
  // will be, so both compound at the same mRate. That keeps the identity
  // exact: existingFV + gapCorpus always equals the full target corpus,
  // which is what the accumulation chart below needs to land on.
  const existing = S.existingSavings || 0;
  const existingFV = existing * Math.pow(1 + mRate, yrs * 12);
  const gapCorpus = Math.max(0, corpus - existingFV);
  const alreadyMet = existing > 0 && gapCorpus === 0;
  const sip = alreadyMet ? 0 : solveSIP(mRate, yrs * 12, gapCorpus, true);
  const realCorpus = corpus / Math.pow(1 + d.inflation, yrs);
  const accRows = accumulationSchedule({sip, rate: mRate, periods: yrs * 12, due: true, opening: existing, stepUp: 0}).rows;
  const drawRows = drawdownSchedule({openingCorpus: corpus, firstWithdrawal: expAtRet, inflation: d.inflation, nominalRate: postRetRate, years: drawYrs, due: true});
  const delay = alreadyMet ? null : calcDelay(gapCorpus, mRate, yrs);
  return {corpus, sip, realCorpus, preRate, postRetRate, expAtRet, yrs, drawYrs, accRows, drawRows, delay, d, existing, existingFV, gapCorpus, alreadyMet};
}

// A one-tap "what if I retired at a different age" comparison. Reuses
// calcRetirement's exact math for each candidate age (by temporarily
// swapping S.retireAge and restoring it) rather than a separate
// approximation, so this can never quietly disagree with the main result.
function calcRetireAgeCompare() {
  const base = S.retireAge;
  const candidates = Array.from(new Set([base - 5, base, base + 5]))
    .filter(age => age > S.age && age <= 75)
    .sort((a, b) => a - b);
  if (candidates.length < 2) return null;
  const saved = S.retireAge;
  const rows = candidates.map(age => {
    S.retireAge = age;
    const r = calcRetirement();
    return { age, sip: r.sip, alreadyMet: r.alreadyMet, isCurrent: age === base };
  });
  S.retireAge = saved;
  return rows;
}

function calcEducation() {
  const d = cfg().d, c = cfg();
  const feeAtCollege = inflateExpense(S.annualFee, [{rate: d.eduInflation, years: S.yearsToCollege}]);
  const eduPhaseRate = S.eduAlloc ? blendedRate(S.eduAlloc, d) : d.debt;
  const rr = realRate(eduPhaseRate, d.eduInflation);
  const corpus = corpusRequired(rr, S.courseDuration, feeAtCollege, true);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  const existing = S.existingSavings || 0;
  const existingFV = existing * Math.pow(1 + mRate, S.yearsToCollege * 12);
  const gapCorpus = Math.max(0, corpus - existingFV);
  const alreadyMet = existing > 0 && gapCorpus === 0;
  const sip = alreadyMet ? 0 : solveSIP(mRate, S.yearsToCollege * 12, gapCorpus, true);
  const realCorpus = corpus / Math.pow(1 + d.inflation, S.yearsToCollege);
  const accRows = accumulationSchedule({sip, rate: mRate, periods: S.yearsToCollege * 12, due: true, opening: existing, stepUp: 0}).rows;
  const feeYears = Array.from({length: S.courseDuration}, (_, i) =>
    inflateExpense(S.annualFee, [{rate: d.eduInflation, years: S.yearsToCollege + i}])
  );
  const delay = alreadyMet ? null : calcDelay(gapCorpus, mRate, S.yearsToCollege);
  return {corpus, sip, realCorpus, preRate, eduPhaseRate, feeAtCollege, accRows, feeYears, delay, d, existing, existingFV, gapCorpus, alreadyMet};
}

function calcGeneric() {
  const d = cfg().d, c = cfg();
  const inflRate = (c.goalInflation && c.goalInflation[S.genType]) ? c.goalInflation[S.genType] : d.inflation;
  const inflatedGoal = S.genAmount * Math.pow(1 + inflRate, S.genYears);
  const fvSavings = S.existingSavings * Math.pow(1 + d.debt, S.genYears);
  const gap = Math.max(0, inflatedGoal - fvSavings);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  const sip = gap > 0 ? solveSIP(mRate, S.genYears * 12, gap, true) : 0;
  const accRows = sip > 0 ? accumulationSchedule({sip, rate: mRate, periods: S.genYears * 12, due: true, stepUp: 0}).rows : [];
  const delay = gap > 0 ? calcDelay(gap, mRate, S.genYears) : null;
  return {inflatedGoal, fvSavings, gap, sip, preRate, accRows, inflRate, delay, d};
}

function calcDelay(corpus, mRate, yearsRemaining) {
  const now3 = Math.max(1, yearsRemaining - 3);
  const now5 = Math.max(1, yearsRemaining - 5);
  const sipNow = solveSIP(mRate, yearsRemaining * 12, corpus, true);
  const sip3   = solveSIP(mRate, now3 * 12, corpus, true);
  const sip5   = solveSIP(mRate, now5 * 12, corpus, true);
  return { sipNow, sip3, extra3: sip3 - sipNow, sip5, extra5: sip5 - sipNow };
}

/* =====================================================================
   CHARTS
   ===================================================================== */
function mountainChart(rows, chartId) {
  deferChartInit(()=>renderMountainChartOption(chartId, rows));
  return `<div id="${chartId}" class="echart" style="height:148px"></div>`;
}
function renderMountainChartOption(chartId, rows){
  const c = cfg();
  initChart(chartId, {
    grid:{left:2,right:2,top:8,bottom:2,containLabel:false},
    xAxis:{type:'category', data:rows.map((r,i)=>i+1), show:false, boundaryGap:false},
    yAxis:{type:'value', show:false, min:0},
    tooltip:{trigger:'axis', formatter(params){
      const grown=params.find(p=>p.seriesName==='Grows to'), contrib=params.find(p=>p.seriesName==='Contributed');
      return `Year ${grown.axisValueLabel}<br/>Grows to: ${c.compact(grown.value)}<br/>Contributed: ${c.compact(contrib?contrib.value:0)}`;
    }},
    series:[
      { name:'Contributed', type:'line', data:rows.map(r=>r.contributed), showSymbol:false, lineStyle:{opacity:0}, areaStyle:{color:'rgba(20,40,63,.16)'}, z:1 },
      { name:'Grows to', type:'line', data:rows.map(r=>r.closeBal), showSymbol:false, lineStyle:{color:'#2557C7', width:1.5},
        areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(37,87,199,.85)'},{offset:1,color:'rgba(37,87,199,.08)'}]}}, z:2 },
    ],

// Reaching exactly zero AT the final year is the plan working correctly —
// that is what "lasts until age X" means, since the corpus is solved to
// just cover that many years of withdrawals. Only flag it as an actual
// shortfall when the money runs out BEFORE the plan says it should.
function renderPotChartOption(chartId, rows, c){
  const fmt = c ? (v => c.compact(v)) : (v => Math.round(v).toLocaleString());
  const n = rows.length;
  let depletedYear = null;
  for (const r of rows) { if (r.closeBal <= 0) { depletedYear = r.year; break; } }
  const prematureDepletion = depletedYear !== null && depletedYear < n;
  const startVal = rows[0].openBal;
  const endVal = rows[n-1].closeBal;
  const endLabelText = prematureDepletion ? `Runs out, yr ${depletedYear}` : (endVal<=0?'Reaches zero as planned':'Ends at '+fmt(endVal));
  const endLabelColor = prematureDepletion ? '#E8977A' : '#8FC79E';
  initChart(chartId, {
    grid:{left:2,right:2,top:26,bottom:20,containLabel:false},
    xAxis:{type:'category', data:rows.map((r,i)=>'Yr '+(r.year!==undefined?r.year:i+1)), boundaryGap:false,

      axisLine:{show:false}, axisTick:{show:false}, splitLine:{show:false}},
    yAxis:{type:'value', show:false, min:0},
    tooltip:{trigger:'axis', formatter(params){

    series:[
      { type:'line', data:rows.map(r=>r.closeBal), showSymbol:false, lineStyle:{color:'#8FC79E', width:1.5},
        areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(61,122,79,.7)'},{offset:1,color:'rgba(61,122,79,.05)'}]}},
        markPoint:{symbol:'circle', symbolSize:8,

// The full "risk shrinks with holding period" curve, every year from 1 to
// maxYears in one static chart, with a marker for the currently selected
// point. Shows the whole trend at a glance instead of one number at a time.
// The curve itself is expensive to build (a rollingWindows() pass per
// year), so it's built once on mount; dragging the holding-period slider
// only recomputes the ONE selected year and moves the marker via
// updateRiskShrinkMarker() below, a merge-only setOption that leaves the
// curve series untouched — the same fast path the original hand-rolled
// version used (direct attribute patches instead of a full SVG rebuild).
function riskShrinkPoints(series, maxYears){
  const points = [];
  for (let yr=1; yr<=maxYears; yr++) {
    const win = rollingWindows(series, yr);
    const losing = win.filter(x=>x.finalMultiple<1).length;
    points.push([yr, 100*losing/win.length]);
  }
  return points;
}
function riskShrinkPctAt(series, selectedYears){
  const win = rollingWindows(series, selectedYears);
  const losing = win.filter(x=>x.finalMultiple<1).length;
  return 100*losing/win.length;
}
function riskShrinkMarkerOption(selectedYears, pct){
  return { id:'risk',
    markLine:{silent:true, symbol:['none','none'], lineStyle:{color:'rgba(20,40,63,.3)', type:'dashed'}, data:[{xAxis:selectedYears}]},
    markPoint:{symbol:'circle', symbolSize:9, itemStyle:{color:'#D97757', borderColor:'var(--ink)', borderWidth:1.5}, label:{show:false}, data:[{coord:[selectedYears, pct]}]},
  };
}

// Advanced, opt-in control attached to a flat post-goal rate (post-
// retirement or during-education-study-years). One slider -- how much
// equity stays in the mix at that stage -- with debt/hybrid split to
// preserve the risk profile's own ratio (allocFromEquityPct). Defaults to

function advAllocControl(kind) {
  const base = riskAllocation();

      (active ? '<button id="'+p+'Reset" class="adv-btn-ghost">Reset to default</button>' : '') + '</div>' +
    '</div></div>';
}
function wireAdvAlloc(kind) {
  const p = 'adv'+kind;
  const toggle = document.getElementById(p+'Toggle'), panel = document.getElementById(p+'Panel');
  if (toggle && panel) toggle.addEventListener('click', () => { panel.classList.toggle('open'); toggle.classList.toggle('open'); });
  const slider = document.getElementById(p+'Slider');
  if (!slider) return;
  const d = cfg().d;
  const flatRate = kind==='ret' ? d.postRet : d.debt;
  const updatePreview = (eqPct) => {
    const rate = blendedRate(allocFromEquityPct(eqPct, riskAllocation()), d);
    const valEl = document.getElementById(p+'Val'); if (valEl) valEl.textContent = eqPct+'%';
    const prevEl = document.getElementById(p+'Preview');
    if (prevEl) prevEl.innerHTML = 'New rate: <b>'+(rate*100).toFixed(1)+'%</b> a year (was '+(flatRate*100).toFixed(1)+'%)';
  };
  updatePreview(parseInt(slider.value));
  slider.addEventListener('input', () => updatePreview(parseInt(slider.value)));
  const applyBtn = document.getElementById(p+'Apply');
  if (applyBtn) applyBtn.addEventListener('click', () => {
    const alloc = allocFromEquityPct(parseInt(slider.value), riskAllocation());
    if (kind==='ret') S.postRetAlloc = alloc; else S.eduAlloc = alloc;
    render();
  });
  const resetBtn = document.getElementById(p+'Reset');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    if (kind==='ret') S.postRetAlloc = null; else S.eduAlloc = null;
    render();
  });
}

/* =====================================================================
   SLIDER HELPER — every numeric question gets a real, continuous slider
   (not just a fixed set of preset chips) so a person can land on any
   value, not only the ones we guessed they'd want. Chips remain as
   quick-jump shortcuts underneath, not the only way in.
   ===================================================================== */
function sliderBounds(chips, extendFactor, minFloorFactor) {
  extendFactor = extendFactor===undefined ? 2.5 : extendFactor;
  minFloorFactor = minFloorFactor===undefined ? 0.3 : minFloorFactor;
  const lo = chips[0] * minFloorFactor;
  const hi = chips[chips.length-1] * extendFactor;
  let raw = hi / 200;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw,1))));
  const norm = raw / mag;
  const step = (norm<1.5?1:norm<3.5?2:norm<7.5?5:10) * mag;
  return { min: Math.max(0, Math.round(lo/step)*step), max: Math.round(hi/step)*step, step };
}
function valueSlider(id, value, min, max, step, loLabel, hiLabel) {
  return '<div class="value-slider">' +
    '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+(value||min)+'">' +
    '<div class="value-slider-labels"><span>'+loLabel+'</span><span>'+hiLabel+'</span></div>' +
    '</div>';
}
// Wires a slider to the same number-input + set() flow a screen already
// uses, so dragging, typing, and tapping a chip all stay in sync.
function wireSlider(sliderId, inp, min, max, setFn) {
  const sl = document.getElementById(sliderId);
  if (!sl) return null;
  sl.addEventListener('input', () => { inp.value = sl.value; setFn(parseInt(sl.value)); });
  return sl;
}
function syncSliderToValue(sl, v, min, max) {
  if (sl && v!=null) sl.value = Math.min(max, Math.max(min, v));
}

// A Fixed Deposit is the single most common thing an Indian saver
// already knows and already trusts, which makes it the most honest
// benchmark for "why bother investing at all." Same monthly amount, same
// number of years, only the destination changes. FD rate is grounded in
// current typical multi-year bank FD rates (verified against several
// major banks, mid-2026), not the best promotional rate available, nor
// the lowest.
function fdComparisonCardHtml(sip, years, actualCorpus, d, c) {
  const mFd = effectiveMonthlyRate(d.fdRate);
  const fdFinal = accumulationSchedule({sip: sip, rate: mFd, periods: years*12, due: true, stepUp: 0}).finalBalance;
  const diff = actualCorpus - fdFinal;
  return '<div class="chart-card"><div class="chart-title">The same ' + c.fmt(Math.round(sip)) + '/month, in a Fixed Deposit instead</div>' +
    '<div class="chart-caption">A typical multi-year bank FD, around ' + (d.fdRate*100).toFixed(1) + '%/yr. FD interest is also fully taxed at your income slab every year, unlike long-term equity gains, which this comparison does not even account for.</div>' +
    '<div class="alloc-return-row">' +
    '<div><div class="alloc-return-label">This plan</div><div class="alloc-return-value">' + c.compact(actualCorpus) + '</div></div>' +
    '<div><div class="alloc-return-label">Same money in an FD</div><div class="alloc-return-value" style="color:#E8977A">' + c.compact(fdFinal) + '</div></div>' +
    '</div>' +
    '<div class="gr-note" style="margin-top:10px">Over ' + years + ' years, staying in a Fixed Deposit would leave you short by <b style="color:var(--paper)">' + c.compact(diff) + '</b>, purely from the difference in return. That gap is the cost of playing it safe with money that has this much time to work.</div>' +
    '</div>';
}

// =========================================================================
// "THE CASE" -- an optional, deeper screen reached from any results screen.
// Built for the person who has just seen a number and now wants to know
// whether to actually believe it: why markets, why not just an FD, why is
// "volatility" not the same thing as "losing your capital." Every figure
// here traces to real, cited historical data (see the data block above),
// not an invented illustration. No name, email, or any personal
// information is collected or required anywhere on this screen.
// =========================================================================
const GOLD_RATE = { IN: 0.109, US: 0.056 }; // India: RBI Handbook of Statistics, 42yr CAGR to Apr 2026. US: NYU Stern (Damodaran), 1928-2024.
const HOUSE_RATE_RANGE = { IN: [0.08, 0.10], US: [0.035, 0.045] }; // Broad, widely-cited long-run ranges; real estate returns vary enormously by city and property, more than any other asset class here, on purpose not reduced to one falsely precise number.

function sCase() {
  const c = cfg(), series = marketSeries(S.country), name = marketName(S.country);
  const nYears = series.length;
  const raceAmt = S.country==='US' ? 10000 : 100000;

  // ---- Section 1: The Race ----
  const racePath = marketGrowthPath(series, 0, nYears, raceAmt);
  const marketFinal = racePath[racePath.length-1].v;
  const fdPath = compoundPath(c.d.fdRate, nYears, raceAmt, series[0].y-1);
  const fdFinal = fdPath[fdPath.length-1].v;
  const goldPath = compoundPath(GOLD_RATE[S.country], nYears, raceAmt, series[0].y-1);
  const goldFinal = goldPath[goldPath.length-1].v;
  const firstYear = series[0].y - 1, lastYear = series[series.length-1].y;

  // ---- Section 2: The Time Machine ----
  const tmYears = Math.min(15, nYears-1);
  const worst15 = worstWindow(series, tmYears);
  const tmDefaultIdx = worst15.startIdx;

  // ---- Section 3: Holding period explorer ----
  const defaultHold = 5;
  const holdData = rollingWindows(series, defaultHold);
  const holdLosing = holdData.filter(w=>w.finalMultiple<1).length;

  // ---- Section 4 supporting stat: what an FD really keeps after inflation+tax ----
  const fdReal = realRate(c.d.fdRate, c.d.inflation);
  // FD interest is taxed annually at slab rate; illustrate at a representative 30% slab.
  const fdAfterTax = c.d.fdRate * (1-0.30);
  const fdAfterTaxReal = realRate(fdAfterTax, c.d.inflation);

  // ---- Section 5: housing ----
  const hRange = HOUSE_RATE_RANGE[S.country];

  return `<div class="case-wrap">
  <div class="case-hero">
    <div class="case-eyebrow">Before you decide</div>
    <div class="case-title">Why trust the market with this money at all?</div>
    <div class="case-sub">Every number on this screen comes from real, published historical data (sources noted below each section), not an invented example. Nothing here is personalised, saved, or sent anywhere &ndash; it's the same public market history for anyone who opens this.</div>
  </div>

  <div class="case-section">
    <h4>The race: ${c.compact(raceAmt)}, three destinations</h4>
    <div class="case-cap">The same lump sum, placed in ${firstYear} and left completely untouched for ${nYears} years, through every real ${name} up-year and down-year in between.</div>
    ${raceChart(racePath, goldPath, fdPath, 'case-race')}
    <div class="race-legend"><span><i style="background:#8FC79E"></i>${name}</span><span><i style="background:#2557C7"></i>Gold</span><span><i style="background:#E8977A"></i>Bank FD</span></div>
    <div class="race-stats">
      <div class="race-stat"><div class="rs-label">${name}</div><div class="rs-val" style="color:#8FC79E">${c.compact(marketFinal)}</div></div>
      <div class="race-stat"><div class="rs-label">GOLD</div><div class="rs-val" style="color:var(--gold)">${c.compact(goldFinal)}</div></div>
      <div class="race-stat"><div class="rs-label">BANK FD</div><div class="rs-val" style="color:#E8977A">${c.compact(fdFinal)}</div></div>
    </div>
    <div class="case-cap" style="margin-bottom:0">${firstYear} to ${lastYear}, ${nYears} years. ${name} figure uses the real annual return each year, compounded, not an average smoothed into a straight line ${infoIconD1('Source: '+(S.country==='US'?'a compiled S&P 500 annual-return series, 1928-2015 price return, 2016-2024 total return with dividends reinvested.':'a compiled Sensex fiscal-year (April-April) return series, freefincal.com, 1979-80 through 2022-23, sourced from BSE closing values.'))}. Gold: ${(GOLD_RATE[S.country]*100).toFixed(1)}%/yr, ${S.country==='US'?'NYU Stern (Damodaran) historical dataset, 1928-2024.':'RBI Handbook of Statistics gold price data, 42-year CAGR to April 2026.'} FD: ${(c.d.fdRate*100).toFixed(1)}%/yr, a typical current multi-year bank rate held constant for illustration, which is generous to the FD since real FD rates have varied a lot across these decades.</div>
  </div>

  <div class="case-section">
    <h4>The time machine: what if you had the worst possible timing?</h4>
    <div class="case-cap">Drag to any real starting year. This shows what ${c.compact(raceAmt)} put into ${name} that year actually became, ${tmYears} years later, using what really happened, crash years included.</div>
    <div class="case-slider-row">
      <div class="case-slider-label"><span>Starting year</span><b id="tm-year-label">${series[tmDefaultIdx].y - 1}</b></div>
      <input type="range" id="tmSlider" min="0" max="${nYears-tmYears-1}" step="1" value="${tmDefaultIdx}">
    </div>
    <div id="tm-result"></div>
    <div class="case-cap" style="margin-top:10px;margin-bottom:0">Defaults to the single worst ${tmYears}-year starting point in ${nYears} years of real data &ndash; not a cherry-picked good one.</div>
  </div>

  <div class="case-section">
    <h4>Volatility is not the same thing as losing your capital</h4>
    <div class="case-cap">Every point on this line is a real ${nYears - 1}-year stretch of ${name} history: the share of them that ended with less money than they started with, at that exact holding length. Drag to inspect any point.</div>
    ${riskShrinkChart(series, Math.min(25,nYears-2), 'case-riskshrink', 130, defaultHold)}
    <div class="case-slider-row">
      <div class="case-slider-label"><span>Holding period</span><b id="hold-yrs-label">${defaultHold} years</b></div>
      <input type="range" id="holdSlider" min="1" max="${Math.min(25,nYears-2)}" step="1" value="${defaultHold}">
    </div>
    <div id="hold-result"></div>
    <div class="case-cap" style="margin-top:10px;margin-bottom:0">This is genuinely index-level data: a diversified 50-stock index, not one company. A single stock can still go to zero no matter how long you hold it &ndash; that risk doesn't shrink with time, which is exactly why diversification (not just patience) is doing real work here.</div>
  </div>

  <div class="case-section">
    <h4>Why does the market grow at all?</h4>
    <div class="case-cap">Not a promise. A mechanical chain that has to break for equities to stop working long-term.</div>
    <div class="growth-chain">
      <div class="gc-node">More people work &amp; get more productive</div><span class="gc-arrow">&rarr;</span>
      <div class="gc-node">Companies sell more, earn more</div><span class="gc-arrow">&rarr;</span>
      <div class="gc-node">Owning a share means owning that growing profit</div><span class="gc-arrow">&rarr;</span>
      <div class="gc-node">Share prices follow earnings, over long periods</div>
    </div>
    <div class="case-cap">This is also exactly why a Fixed Deposit quietly loses, even though it feels "safe": it pays you a fixed rupee amount that has no claim on any of that growth.</div>
    <div class="compare-row">
      <div class="compare-card"><div class="cc-label">FD, AFTER INFLATION</div><div class="cc-val" style="color:${fdReal>0?'#8FC79E':'#E8977A'}">${(fdReal*100).toFixed(1)}%/yr</div><div class="cc-note">Before tax is even taken out</div></div>
      <div class="compare-card"><div class="cc-label">FD, AFTER TAX &amp; INFLATION</div><div class="cc-val" style="color:${fdAfterTaxReal>0?'#8FC79E':'#E8977A'}">${(fdAfterTaxReal*100).toFixed(1)}%/yr</div><div class="cc-note">At a representative 30% slab, taxed every year regardless of whether you touch the money</div></div>
    </div>
    <div class="case-cap" style="margin-bottom:0">The "safety" of an FD is real (you will never see the number go down) &ndash; but the purchasing power sitting behind that number can still shrink every single year, silently, which a glance at the account balance will never show you.</div>
  </div>

  <div class="case-section">
    <h4>What about property, honestly?</h4>
    <div class="case-cap">Real estate isn't a bad asset. It's a fair comparison, including the parts that don't fit neatly into a percentage.</div>
    <div class="compare-row">
      <div class="compare-card"><div class="cc-label">${S.country==='US'?'US HOUSING, LONG-RUN':'INDIAN HOUSING, LONG-RUN'}</div><div class="cc-val">${(hRange[0]*100).toFixed(1)}&ndash;${(hRange[1]*100).toFixed(1)}%/yr</div><div class="cc-note">Nominal, before rent/costs. Varies enormously by city and property &ndash; a wide range on purpose, not false precision.</div></div>
      <div class="compare-card"><div class="cc-label">${name.toUpperCase()}, SAME WINDOW</div><div class="cc-val" style="color:#8FC79E">${(fullSeriesCAGR(series)*100).toFixed(1)}%/yr</div><div class="cc-note">${nYears} years, real data, shown above</div></div>
    </div>
    <div class="case-cap" style="margin-bottom:0">What a percentage doesn't show: buying and selling a house costs 5-10% in fees and stamp duty each way; it's one asset in one city, no diversification at all; you can't sell one bedroom if you need part of the money; and it takes work (tenants, repairs, vacancy) that a fund doesn't. None of that makes property a bad choice &ndash; it makes it a different kind of asset, with its own real tradeoffs, not a simple "better or worse" than equity.</div>
  </div>

  <div class="case-back-row"><button id="caseBackBtn">Back to my plan</button></div>
  </div>`;
}
function fullSeriesCAGR(series){
  let bal=1; series.forEach(r=>bal*=(1+r.r));
  return Math.pow(bal, 1/series.length)-1;
}
function infoIconD1(text){
  return ' <span class="term-i" data-def="'+text.replace(/"/g,'&quot;')+'">i</span>';
}
function renderTimeMachine(startIdx){
  const c = cfg(), series = marketSeries(S.country);
  const tmYears = Math.min(15, series.length-1);
  const raceAmt = S.country==='US' ? 10000 : 100000;
  const path = marketGrowthPath(series, startIdx, tmYears, raceAmt);
  const finalVal = path[path.length-1].v;
  const worstYearInPath = series.slice(startIdx, startIdx+tmYears).reduce((w,r)=>r.r<w.r?r:w, series[startIdx]);
  const gained = finalVal > raceAmt;
  return timeMachineChart(path, 'case-timemachine') +
    `<div class="case-callout ${gained?'good':''}">
    ${c.compact(raceAmt)} invested at the start of <b>${series[startIdx].y-1}</b>, held ${tmYears} years through a ${(worstYearInPath.r*100).toFixed(0)}% single worst year (${worstYearInPath.y}), became <b style="color:${gained?'#8FC79E':'#E8977A'}">${c.compact(finalVal)}</b> by ${series[startIdx+tmYears-1].y}.
  </div>`;
}
function renderHoldResult(years){
  const series = marketSeries(S.country);
  const w = rollingWindows(series, years);
  const losing = w.filter(x=>x.finalMultiple<1).length;
  const pct = Math.round(100*losing/w.length);
  const worst = worstWindow(series, years);
  return `<div class="holdbar-track">
    <div class="holdbar-seg" style="width:${100-pct}%;background:#5FA875"></div>
    <div class="holdbar-seg" style="width:${pct}%;background:#D97757"></div>
  </div>
  <div class="holdbar-legend"><span>${100-pct}% ended with more money</span><span>${pct}% ended with less</span></div>
  <div class="case-callout ${pct===0?'good':''}" style="margin-top:12px">
    Across ${w.length} real ${years}-year windows in the data, the worst one still averaged <b style="color:${worst.cagr>0?'#8FC79E':'#E8977A'}">${(worst.cagr*100).toFixed(1)}%/yr</b>${pct===0?', and none of them lost money.':'.'}
  </div>`;
}

/* =====================================================================
   RENDER ENGINE
   ===================================================================== */
const stage = document.getElementById('stage');
const progressEl = document.getElementById('progress');
const backBtn = document.getElementById('backBtn');
const assumpBtn = document.getElementById('assumpBtn');
function scrollToPanel(panel) {
  // The flex/overflow layout here doesn't always resolve to one clean
  // scrollable ancestor (varies by content length and screen), so walk up
  // from the panel and scroll whichever container actually has overflow,
  // falling back to the window if none do.
  let el = panel.parentElement;
  while (el && el !== document.body) {
    if (el.scrollHeight > el.clientHeight + 4) {
      el.scrollTo({ top: panel.offsetTop - el.offsetTop - 12, behavior: 'smooth' });
      return;
    }
    el = el.parentElement;
  }
  window.scrollTo({ top: panel.getBoundingClientRect().top + window.scrollY - 12, behavior: 'smooth' });
}
assumpBtn.addEventListener('click', () => {
  const panel = document.getElementById('ap');
  if (!panel) return;
  panel.classList.add('open');
  // The panel expands via a CSS max-height transition — scrolling in the
  // same tick sees it still at its collapsed height, so give the layout
  // a moment to update first.
  setTimeout(() => scrollToPanel(panel), 60);
});

function renderProgress() {
  progressEl.innerHTML = '';
  const f = flow();
  f.forEach((s, i) => {
    if (s === 'results') return;
    const d = document.createElement('div');
    d.className = 'dot'+(i < S.si?' done':(i===S.si?' active':''));
    d.innerHTML = '<i></i>';
    progressEl.appendChild(d);
  });
}

function go(delta) {
  // reset goal-specific fields if changing goal
  if (delta > 0 && flow()[S.si] === 'goal') {
    S.age = null; S.retireAge = null; S.monthlyExpense = null;
    S.annualFee = null; S.yearsToCollege = null; S.courseDuration = null;
    S.genType = null; S.genAmount = null; S.genYears = null; S.existingSavings = 0;
    S.risk = null; S.postRetAlloc = null; S.eduAlloc = null;
  }
  S.si = Math.max(0, Math.min(flow().length - 1, S.si + delta));
  render();
}

// Reached results, want to fix one answer without re-walking every question
// after it: jump straight to that screen, keeping every other answer intact.
function jumpEdit(screenName) {
  S.quickEdit = true;
  S.si = flow().indexOf(screenName);
  render();
}

// The single "Continue" exit point for every question screen. Normal flow
// just steps forward one screen. But if we arrived here via jumpEdit (fixing
// one answer from the results screen), stepping forward one would land on
// whatever question happens to sit next in the array, which is almost never
// what the person wants; they want straight back to their updated result.
function advance() {
  if (S.quickEdit) { S.quickEdit = false; S.si = flow().indexOf('results'); render(); }
  else { go(1); }
}

/* =====================================================================
   PERSISTENCE + BROWSER BACK
   S lives only in page memory, so a refresh / Back / mobile tab-discard
   used to lose the whole plan mid-questionnaire. Two fixes sharing the
   Lab's localStorage pattern (goalden-lab.html): save S on every render
   and offer an explicit "Resume?" prompt on load — never silently restore,
   some users want a fresh start — and mirror each screen into a history
   entry so the browser Back button walks screens instead of leaving the
   page.
   ===================================================================== */
const STATE_KEY = 'goaldenD1State';
function persistState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(S)); } catch (e) {} }
function clearSavedState() { try { localStorage.removeItem(STATE_KEY); } catch (e) {} }
// pushState only when the screen actually changed: same-screen re-renders
// (picking an answer re-renders the current screen) must not pile up
// duplicate history entries, and a popstate-driven render arrives with the
// hash already matching, so it naturally skips the push.
function syncHistory() {
  const hash = '#' + flow()[S.si];
  if (location.hash === hash) return;
  try { history.pushState({ si: S.si }, '', hash); } catch (e) {}
}

function render() {
  const f = flow(), screen = f[S.si];
  let html = '';
  if (screen==='country')      html = sCountry();
  else if (screen==='goal')    html = sGoal();
  else if (screen==='age')     html = sAge();
  else if (screen==='expense') html = sExpense();
  else if (screen==='edu_fee') html = sEduFee();
  else if (screen==='edu_years')     html = sEduYears();
  else if (screen==='gen_type')   html = sGenType();
  else if (screen==='gen_amount') html = sGenAmount();
  else if (screen==='gen_years')  html = sGenYears();
  else if (screen==='risk')    html = sRisk();
  else if (screen==='results') html = sResults();
  else if (screen==='case')    html = sCase();

  const wrap = document.createElement('div');
  wrap.className = 'screen';
  wrap.innerHTML = html;
  stage.innerHTML = '';
  stage.appendChild(wrap);
  // Forcing a layout read here (rather than deferring the class add to
  // requestAnimationFrame) flushes the browser's style calc with the
  // pre-transition state already applied, so the .active transition still
  // fires correctly without depending on a paint callback -- rAF doesn't
  // reliably fire on a backgrounded/non-composited tab, which would leave
  // the screen permanently stuck at opacity:0.
  void wrap.offsetHeight;
  wrap.classList.add('active');
  backBtn.classList.toggle('show', S.si > 0);
  assumpBtn.classList.toggle('show', screen==='results');
  if (screen==='case') window.scrollTo(0,0);
  renderProgress();
  attach(screen);
  persistState();
  syncHistory();
}

/* =====================================================================
   EVENT HANDLERS
   ===================================================================== */
function attach(screen) {
  const nb = document.getElementById('nextBtn');

  function sel(el) { el && el.classList.add('selected'); }
  function unsel(q) { document.querySelectorAll(q).forEach(e => e.classList.remove('selected')); }

  if (screen==='country') {
    document.querySelectorAll('[data-country]').forEach(el => el.addEventListener('click', () => {
      S.country = el.dataset.country; S.goalType = null; S.si = 0;
      render();
    }));
    nb && nb.addEventListener('click', () => go(1));
  }

  if (screen==='goal') {
    document.querySelectorAll('[data-goal]').forEach(el => el.addEventListener('click', () => {
      S.goalType = el.dataset.goal;
      render();
    }));
    nb && nb.addEventListener('click', () => {
      if (S.goalType === 'delay') { S.si++; render(); } else go(1);
    });
  }

  if (screen==='age') {
    const inp = document.getElementById('inp'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider');
    const inp2 = document.getElementById('inp2'), err2 = document.getElementById('err2');
    const sl2 = document.getElementById('inpSlider2');
    let retMin = Math.max(35, (S.age||30)+1);
    const updateContinue = () => { nb.disabled = !(S.age && S.retireAge); };
    const setAge = v => {
      S.age = v; err.textContent = '';
      // The retire-age floor depends on the current age, and both fields now
      // live on one screen -- if the user drags age after already answering
      // retire age, the retire slider's min (baked into the DOM at render
      // time) would go stale, so keep it live here instead of only at render.
      retMin = Math.max(35, (v||30)+1);

// Browser Back/Forward walks screens. The browser has already moved to the
// previous entry, so render() below sees the hash matching the screen and
// skips its own pushState. If the entry names a screen that has vanished
// from flow() (dynamic screens like 'case'), fall back to Back-button
// behaviour rather than rendering a blank screen.
window.addEventListener('popstate', () => {
  const name = (location.hash || '').slice(1);
  const idx = flow().indexOf(name);
  if (idx >= 0) { S.quickEdit = false; S.viewingCase = name === 'case'; S.si = idx; render(); }
  else if (S.si > 0) { S.si -= 1; render(); }
});

const ADVISOR_KNOWLEDGE = `Goalden is one personal-finance planning app with three levels — they all share the same math, so moving to a deeper level never wastes anything the user already entered. It supports India (₹) and the United States ($).
- Level 1 — Quick Calculate (this page): a fast single-goal answer in about two minutes, for first-timers.

The user is currently on Level 1.

This is "Goalden — Quick Calculate" (Level 1): a fast single-goal calculator.

What it does: takes a few plain-language inputs and returns the lump sum (corpus) needed by a target date and the monthly amount (SIP) to save now to reach it. "The Case" screen adds a deeper proof with real historical market data.

Goal types:

Risk options and their asset splits (equity/debt/hybrid): cautious 25/60/15, balanced 50/35/15, growth 75/15/10.

Calculations: the target corpus is the present value of future withdrawals using an inflation-adjusted ("real") rate, with withdrawals at the start of each year. The monthly SIP is what compounds at the pre-retirement rate to close the gap between that corpus and what existing savings grow to. Results include the corpus in future and today's money, a fixed-deposit comparison at the country FD rate, a "retire 5 years earlier/later" comparison, and a cost-of-delay figure.

Assumptions (per country):

Data sources: "The Case" uses real historical annual returns — Sensex (India, FY1980-2023) and S&P 500 (US, 1928-2024) — to show how often N-year windows lost money and the worst/best windows. Price returns, no fabricated or estimated values. This Level does not fetch live market data.

Behavior: prefer driving the real interface — navigate to the right screen, set the values, scroll the result into view, then explain what the user is looking at in plain language. Use the workspace canvas only to compare two scenarios side by side, or to show something not on the current page. Never describe a number without putting it on screen.

Choice before action (mandatory, ALWAYS the first move): The moment the user asks you to build/calculate anything — even with zero numbers given yet, e.g. just "help me plan my retirement" — before touching any field, offer this choice, and nothing else:

Which would you prefer?"
Wait for their reply. If they say "do it" / "option A" / "go ahead" / anything clearly affirmative: if they haven't given you the numbers yet, ask for the essential few in ONE consolidated message (not one field at a time). Once you have them, prefer calling build_goal_plan ONCE with { goalType, country, params } to fill every field and run the calculation in a single step (instead of one set_value per field), narrating briefly as you go, and ALWAYS finish by calling compose_briefing so the result lands as a full report page with graphs — never just a chat summary. If build_goal_plan fails, or you need to correct a single value afterwards, use set_value for just that correction. If they say "guide me" / "walk me through" / "option B", navigate one screen at a time and explain each question before they answer it, using set_value one field at a time.`;

function advisorSetValue(field, value) {
  const spec = ADVISOR_FIELDS.find(f => f.name === field);
  if (!spec) return { ok:false, error:'Unknown field "'+field+'". Valid: '+ADVISOR_FIELDS.map(f=>f.name).join(', ') };
  if (value === undefined || value === null || value === '') return { ok:false, error:'Missing value for '+field };
  if (spec.enum && !spec.enum.includes(value)) return { ok:false, error:'Invalid value for '+field+'. Allowed: '+spec.enum.join(', ') };
  if (spec.type === 'integer') {
    value = parseInt(value, 10);
    if (!isFinite(value)) return { ok:false, error:'Value for '+field+' must be a number.' };
  }
  if (spec.min !== undefined && value < spec.min) return { ok:false, error:'Value for '+field+' is too low — it must be at least '+spec.min+'.' };
  if (spec.max !== undefined && value > spec.max) return { ok:false, error:'Value for '+field+' is too high — it must be at most '+spec.max+'.' };
  if (field === 'goalType') {
    S.goalType = value;
    S.si = S.country ? flow().indexOf('goal') : 0;
  } else if (field === 'age' && S.retireAge && S.retireAge <= value) {
    S.age = value; S.retireAge = null;
  } else {
    S[field] = value;
  }
  const f = flow();
  S.si = Math.max(0, Math.min(f.length - 1, S.si));
  render();
  return { ok:true, field, value:S[field], page:f[S.si], touched:'#stage .screen' };
}
