<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goalden — find your number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/echarts.min.js"></script>
<style>
/* Muted text uses ink at .74 opacity (about 4.6:1). The older .4-.6
   opacities came out at 2.2-4.0:1, below WCAG AA's 4.5:1; pastel series
   colours are fill-only, text uses #256F55 / #9C4A2C. Same pass as the Lab. */
:root{
  /* White + shades of blue (Track C repalette). --ink/--paper keep their
     original roles (dark accent-text / primary body text) but both now
     hold dark navy, since the page flipped from a dark canvas to a light
     one -- --bg is the new light canvas colour that used to live in --ink. */
  --bg:#F5F8FC; --ink:#14283F; --ink2:#1B3A63; --paper:#14283F; --card:#FFFFFF;
  --gold:#2557C7; --gold-deep:#1E4FBE; --red:#A03A22;
  --body:#3C5470; --dim:#52647F; --rule:rgba(20,40,63,.14);
  --ok:#22705A; --teal:#2D6E6E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:'Figtree',system-ui,sans-serif;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;flex-shrink:0}
.brand{font-family:'Newsreader',serif;font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--gold);text-decoration:none;display:inline-block}
.brand span{color:var(--paper);font-weight:400;font-style:italic;font-size:14px;margin-left:6px;opacity:.7}
.backbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(20,40,63,.25);background:transparent;color:var(--paper);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.assumpbtn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(37,87,199,.5);background:rgba(37,87,199,.12);color:var(--gold);font-family:'Newsreader',serif;font-style:italic;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.assumpbtn.show{opacity:1;pointer-events:auto}
.backbtn.show{opacity:1;pointer-events:auto}
.progress{display:flex;gap:6px;padding:2px 20px 18px;flex-shrink:0}
.dot{height:4px;flex:1;background:rgba(20,40,63,.16);border-radius:2px;overflow:hidden}
.dot i{display:block;height:100%;width:0%;background:var(--gold);border-radius:2px;transition:width .35s ease}
.dot.done i,.dot.active i{width:100%}

.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;padding:8px 24px 24px;display:flex;flex-direction:column;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .3s ease,transform .3s ease;min-height:0}
/* Same fix as Door 2: switching to position:relative here for the active
   screen drops the height that inset:0 was providing (relative positioning
   only offsets, it doesn't size), so tall content just grew past .stage's
   box and got silently clipped by overflow:hidden with no scrollbar. This
   was never actually applied here before, only in Door 2. */
.screen.active{opacity:1;transform:translateX(0);pointer-events:auto;position:relative;height:100%;min-height:0}

.q-eyebrow{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.q-title{font-family:'Newsreader',serif;font-weight:600;font-size:clamp(22px,7vw,30px);line-height:1.18;color:var(--paper);margin-bottom:8px}
.q-sub{font-size:14px;color:rgba(20,40,63,.74);margin-bottom:26px;max-width:38ch;line-height:1.5}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:16px;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* country grid */
.country-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.country-card{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.14);border-radius:6px 18px 6px 18px;padding:24px 14px;text-align:center;cursor:pointer;transition:all .18s}
.country-card:active{transform:scale(.97)}
.country-card.selected{background:rgba(37,87,199,.16);border-color:var(--gold)}
.country-badge{width:44px;height:44px;border-radius:50%;background:rgba(37,87,199,.14);border:1px solid rgba(37,87,199,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-family:'Newsreader',serif;font-size:22px;color:var(--gold)}
.country-name{font-family:'Newsreader',serif;font-size:17px;font-weight:600;color:var(--paper)}
.country-cur{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);margin-top:3px}

/* goal grid */
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-card{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.14);border-radius:4px 16px 4px 16px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .18s}
.goal-card:active{transform:scale(.97)}
.goal-card.selected{background:rgba(37,87,199,.16);border-color:var(--gold)}
.goal-icon{width:26px;height:26px;margin-bottom:9px;display:block;color:var(--gold)}
.goal-icon svg{width:100%;height:100%}
.goal-name{font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:var(--paper);line-height:1.2}
.goal-tag{font-size:12px;color:rgba(20,40,63,.74);margin-top:4px}

/* generic goal type picker */
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gen-card{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.14);border-radius:4px 14px 4px 14px;padding:14px;text-align:center;cursor:pointer;transition:all .18s}
.gen-card:active{transform:scale(.97)}
.gen-card.selected{background:rgba(37,87,199,.16);border-color:var(--gold)}
.gen-icon{width:22px;height:22px;display:block;margin-bottom:6px;color:var(--gold)}
.gen-icon svg{width:100%;height:100%}
.gen-label{font-size:13.5px;font-weight:600;color:var(--paper)}
.gen-rate{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}

/* number input */
.num-wrap{display:flex;align-items:baseline;gap:8px;padding:18px 0;border-bottom:2px solid rgba(20,40,63,.2)}
.num-prefix{font-family:'Newsreader',serif;font-size:28px;color:var(--gold)}
.num-input{flex:1;background:transparent;border:none;outline:none;color:var(--paper);font-family:'Newsreader',serif;font-size:clamp(30px,10vw,42px);font-weight:600;-moz-appearance:textfield}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-suffix{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--dim);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.chip{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--paper);background:rgba(20,40,63,.08);border:1px solid rgba(20,40,63,.18);padding:9px 15px;border-radius:3px;cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.selected{background:var(--gold);border-color:var(--gold);color:#fff}
.slab-chips{margin-top:8px;gap:6px}
.slab-chips .chip{padding:6px 10px;font-size:12px}
.inline-error{color:#9C4A2C;font-size:13px;margin-top:14px;font-family:'Spline Sans Mono',monospace;min-height:16px}
.value-slider{margin:18px 0 8px}
.value-slider input[type=range]{width:100%;accent-color:var(--gold);height:22px;cursor:pointer}
.value-slider-labels{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}
/* Custom slider thumb + track -- every range input in this app was
   previously the bare OS control, tinted only by accent-color. This
   replaces it everywhere with one consistent tactile design. */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(20,40,63,.14)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(20,40,63,.14)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);margin-top:-6px;box-shadow:0 1px 4px rgba(20,40,63,.3);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 1px 4px rgba(20,40,63,.3);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:hover::-moz-range-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.22);box-shadow:0 2px 8px rgba(37,87,199,.4)}
input[type=range]:active::-moz-range-thumb{transform:scale(1.22);box-shadow:0 2px 8px rgba(37,87,199,.4)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--gold);outline-offset:2px}
input[type=range]:focus-visible::-moz-range-thumb{outline:2px solid var(--gold);outline-offset:2px}
.chips-label{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px}
.optional-field{margin-top:20px;padding-top:20px;border-top:1px dashed rgba(20,40,63,.18)}
.optional-label{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.num-wrap-sm{display:flex;align-items:baseline;gap:6px;padding:10px 0;border-bottom:1px solid rgba(20,40,63,.15)}
.num-prefix-sm{font-family:'Newsreader',serif;font-size:18px;color:rgba(37,87,199,.95)}
.num-input-sm{flex:1;background:transparent;border:none;outline:none;color:rgba(20,40,63,.75);font-family:'Newsreader',serif;font-size:22px;font-weight:600;-moz-appearance:textfield}
.num-input-sm::-webkit-outer-spin-button,.num-input-sm::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* risk */
.risk-stack{display:flex;flex-direction:column;gap:12px}
.risk-card{background:rgba(20,40,63,.06);border:1.5px solid rgba(20,40,63,.14);border-radius:3px 16px 16px 16px;padding:19px 18px;cursor:pointer;transition:all .18s;text-align:left}
.risk-card:active{transform:scale(.98)}
.risk-card.selected{background:rgba(37,87,199,.14);border-color:var(--gold)}
.risk-card h4{font-family:'Newsreader',serif;font-size:16.5px;color:var(--paper);margin-bottom:4px}
.risk-card p{font-size:13px;color:rgba(20,40,63,.74);line-height:1.4}

/* CTA */
.cta-zone{padding:14px 0 4px;flex-shrink:0}
.cta{width:100%;background:var(--gold);color:#fff;border:none;border-radius:9px;font-family:'Figtree',sans-serif;font-weight:700;font-size:16px;padding:17px;cursor:pointer;transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.3;pointer-events:none}

/* results */
.result-scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;min-height:0}
.result-intro{text-align:center;font-family:'Newsreader',serif;font-style:italic;font-size:15px;color:rgba(20,40,63,.74);padding:4px 12px 18px;line-height:1.5}
.hero-number{text-align:center;padding:6px 0 4px}
.hero-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.hero-figure{font-family:'Newsreader',serif;font-weight:600;font-size:clamp(42px,15vw,64px);color:var(--paper);line-height:0.95;letter-spacing:-.01em}
.hero-sub{font-size:13.5px;color:rgba(20,40,63,.74);margin-top:10px}
.action-card{background:var(--gold);color:#fff;border-radius:3px 22px 22px 22px;padding:22px 24px;margin:26px 0 18px}
.action-card .al{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.action-card .af{font-family:'Newsreader',serif;font-weight:700;font-size:28px;margin:5px 0 8px}
.action-card .as{font-size:13.5px;line-height:1.5}
.chart-card{background:rgba(20,40,63,.05);border:1px solid rgba(20,40,63,.12);border-radius:2px 2px 18px 18px;padding:18px 16px 8px;margin-bottom:18px}
/* "The Case" screen */
.case-wrap{padding-bottom:20px;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0}
.case-hero{padding:8px 0 20px;text-align:center}
.case-eyebrow{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.case-title{font-family:'Newsreader',serif;font-size:23px;color:var(--paper);line-height:1.3;margin-bottom:10px}
.case-sub{font-size:13.5px;color:rgba(20,40,63,.74);line-height:1.55;max-width:44ch;margin:0 auto}
.case-section{background:rgba(20,40,63,.045);border:1px solid rgba(20,40,63,.12);border-radius:2px 16px 16px 16px;padding:20px 18px;margin-bottom:16px}
.case-section h4{font-family:'Newsreader',serif;font-size:17px;color:var(--paper);margin-bottom:6px;line-height:1.3}
.case-section .case-cap{font-size:12.5px;color:rgba(20,40,63,.74);line-height:1.5;margin-bottom:14px}
.race-legend{display:flex;gap:14px;justify-content:center;margin:8px 0 14px;flex-wrap:wrap}
.race-legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(20,40,63,.74);font-family:'Spline Sans Mono',monospace}
.race-legend i{width:18px;height:0;display:inline-block}
.race-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.race-stat{background:rgba(20,40,63,.05);border-radius:3px 10px 10px 10px;padding:11px 9px;text-align:center}
.race-stat .rs-label{font-family:'Spline Sans Mono',monospace;font-size:9px;letter-spacing:.04em;color:rgba(20,40,63,.74);margin-bottom:5px}
.race-stat .rs-val{font-family:'Newsreader',serif;font-size:16px;font-weight:600}
.case-slider-row{margin:14px 0 6px}
.case-slider-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:rgba(20,40,63,.74);margin-bottom:8px}
.case-slider-label b{color:var(--gold);font-family:'Spline Sans Mono',monospace}
.case-callout{background:rgba(184,116,15,.08);border:1px solid rgba(184,116,15,.3);border-radius:3px 12px 12px 12px;padding:12px 14px;margin-top:10px;font-size:12.5px;line-height:1.5;color:rgba(20,40,63,.85)}
.case-callout.good{background:rgba(31,138,112,.08);border-color:rgba(31,138,112,.3)}
.holdbar-track{display:flex;height:26px;border-radius:3px;overflow:hidden;margin:12px 0 6px}
.holdbar-seg{transition:width .2s ease}
.holdbar-seg + .holdbar-seg{box-shadow:inset 2px 0 0 #fff}   /* the two colours are close in greyscale; the seam and the legend under the bar tell them apart */
.holdbar-legend{display:flex;justify-content:space-between;font-size:11px;color:rgba(20,40,63,.74);font-family:'Spline Sans Mono',monospace}
.growth-chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:14px 0;font-size:12.5px}
.growth-chain .gc-node{background:rgba(37,87,199,.12);border:1px solid rgba(37,87,199,.3);border-radius:3px 9px 9px 9px;padding:7px 11px;color:rgba(20,40,63,.85)}
.growth-chain .gc-arrow{color:rgba(20,40,63,.74);font-size:14px}
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.compare-card{background:rgba(20,40,63,.05);border-radius:3px 10px 10px 10px;padding:12px}
.compare-card .cc-label{font-family:'Spline Sans Mono',monospace;font-size:9.5px;color:rgba(20,40,63,.74);margin-bottom:5px}
.compare-card .cc-val{font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:var(--paper);margin-bottom:3px}
.compare-card .cc-note{font-size:11px;color:rgba(20,40,63,.74);line-height:1.4}
.case-back-row{padding:16px 0 8px;text-align:center}
.case-back-row button{background:none;border:1px solid rgba(20,40,63,.2);color:rgba(20,40,63,.74);font-family:'Spline Sans Mono',monospace;font-size:12px;padding:10px 20px;border-radius:3px;cursor:pointer}
.term-i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid rgba(20,40,63,.4);color:rgba(20,40,63,.74);font-size:9px;font-family:'Spline Sans Mono',monospace;cursor:pointer;position:relative;margin-left:2px;vertical-align:middle}
.chart-title{font-family:'Newsreader',serif;font-size:15.5px;color:var(--paper);margin-bottom:2px}
.chart-caption{font-size:12px;color:rgba(20,40,63,.74);margin-bottom:10px}
/* allocation strip (replaces the donut and its legend); capped like the other charts so it does not stretch across a wide monitor */
.alloc-strip-wrap{max-width:760px;margin:0 auto}
.alloc-strip{position:relative;height:28px;margin:4px 0 8px}
.alloc-seg{position:absolute;top:0;bottom:0}
.alloc-seg:first-child{border-radius:4px 0 0 4px}
.alloc-seg:last-child{border-radius:0 4px 4px 0}
.alloc-seg:only-child{border-radius:4px}
.alloc-eq{background:#2557C7}
.alloc-de{background:repeating-linear-gradient(45deg,rgba(255,255,255,.38) 0 2px,transparent 2px 7px),#B8740F}
.alloc-hy{background:repeating-linear-gradient(135deg,rgba(255,255,255,.38) 0 2px,transparent 2px 7px),#1F8A70}
.alloc-lbls{position:relative;height:42px;margin-bottom:12px}
.alloc-lbls.has-amt{height:60px}
.alloc-lbl{position:absolute;top:0;padding-left:7px;border-left:1px solid rgba(20,40,63,.18);font-size:12.5px;line-height:1.35;color:rgba(20,40,63,.8);white-space:nowrap;font-variant-numeric:tabular-nums}
.alloc-lbl b{display:block;font-family:'Newsreader',serif;font-size:17px;font-weight:600;line-height:1.2;color:var(--paper)}
.alloc-amt{display:block;font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim)}
.alloc-key{display:none;width:10px;height:10px;border-radius:2px;margin-right:6px;flex:none}
.alloc-lbls.as-list{height:auto;display:grid;gap:5px}
.alloc-lbls.as-list .alloc-lbl{position:static;width:auto!important;border-left:0;padding-left:0;display:flex;align-items:baseline;gap:4px}
.alloc-lbls.as-list .alloc-lbl b{display:inline;margin-right:3px}
.alloc-lbls.as-list .alloc-key{display:inline-block}
.alloc-lbls.as-list .alloc-amt{display:inline;margin-left:6px}
@media print{.alloc-seg,.alloc-key{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.alloc-return-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid rgba(20,40,63,.1)}
.alloc-return-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.04em;margin-bottom:3px}
.alloc-return-value{font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:var(--paper)}
/* Cap only the chart itself, not the surrounding layout: charts were
   designed and tuned around a ~380-480px column, so uncapped they grow to
   fill however wide the card happens to be (600px+ on a real desktop
   monitor), which looks oversized and hard to read. Everything else on
   the page stays genuinely full-width -- this was the actual fix needed,
   not shrinking the whole app into a narrow column, which is worse: it
   leaves most of a normal monitor empty and looks broken. */
.echart{width:100%;max-width:760px;margin:0 auto}
/* 760px, up from 480px: at 480 the charts filled about a third of a desktop
   results card. Still capped, per the note above, so they never stretch
   across a whole wide monitor. */

/* delay card */
.delay-card{background:rgba(37,87,199,.05);border:1px solid rgba(37,87,199,.25);border-radius:16px 3px 16px 16px;padding:19px 20px;margin-bottom:20px}
.delay-title{font-family:'Newsreader',serif;font-size:15px;color:var(--paper);margin-bottom:12px}
.delay-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(20,40,63,.1)}
.delay-row:last-child{border-bottom:none}
.delay-row[data-retire-preview]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.delay-label{font-size:13px;color:rgba(20,40,63,.74)}
.delay-value{font-family:'Newsreader',serif;font-size:15px;color:var(--paper);font-weight:600}
.delay-extra{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--red);margin-left:6px}

.assump-toggle{font-family:'Spline Sans Mono',monospace;font-size:12px;color:rgba(20,40,63,.74);text-align:center;padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tog-caret{display:inline-block;vertical-align:-1px;margin-right:6px;transition:transform .25s ease}
.assump-toggle.open .tog-caret{transform:rotate(180deg)}
.schedule-table{width:100%;border-collapse:collapse;font-family:'Spline Sans Mono',monospace;font-size:11px;margin-top:6px}

<div class="topbar">
  <button class="backbtn" id="backBtn" aria-label="Back">←</button>
  <a href="index.html" class="brand">Goalden<span>quick calculate</span></a>
  <button class="assumpbtn" id="assumpBtn" aria-label="View assumptions" title="What assumptions are we using?">i</button>
</div>
<div class="progress" id="progress"></div>
<div class="stage" id="stage"></div>

<script src="goalden-engine.js"></script>
<script>
'use strict';

echarts.registerTheme('goalden', {
  // The four palette slots (blue, ochre, green, violet), then two neutrals, so a
  // series that sets no colour of its own never gets a generated hue.
  color: ['#2557C7','#B8740F','#1F8A70','#8A4FBF','#56698A','#14283F'],
  backgroundColor: 'transparent',
  textStyle: { fontFamily: "'Spline Sans Mono', monospace", color: 'rgba(20,40,63,.75)' },
  title: { textStyle: { fontFamily: "'Newsreader', serif", color: '#14283F', fontWeight: 600 } },
  grid: { left: 44, right: 16, top: 16, bottom: 30, containLabel: true },
  categoryAxis: { axisLine:{lineStyle:{color:'rgba(20,40,63,.2)'}}, axisLabel:{color:'rgba(20,40,63,.5)'}, splitLine:{show:false} },
  valueAxis: { axisLine:{show:false}, axisLabel:{color:'rgba(20,40,63,.5)'}, splitLine:{lineStyle:{color:'rgba(20,40,63,.08)'}} },
  tooltip: { backgroundColor:'#FFFFFF', borderColor:'rgba(37,87,199,.4)', borderWidth:1, textStyle:{color:'#14283F', fontFamily:"'Spline Sans Mono',monospace", fontSize:11}, extraCssText:'border-radius:3px 8px 8px 8px;box-shadow:0 6px 18px rgba(20,40,63,.16)' },
});
const chartInstances = {};
// True while a quiet (in-place) render is drawing: see render() and initChart().
let chartQuiet = false;
function initChart(id, option, optsOverride){
  const dom = document.getElementById(id);
  if(!dom) return null;
  let entry = chartInstances[id];
  if(entry && entry.dom !== dom){ if(entry.ro) entry.ro.disconnect(); entry.inst.dispose(); entry = null; }
  if(!entry){
    const inst = echarts.init(dom, 'goalden', Object.assign({renderer:'svg'}, optsOverride));
    entry = chartInstances[id] = { inst, dom };
    // ECharts' SVG renderer measures its container once, at init. A chart
    // created while its card is still laying out (a section opening, a
    // grid settling) kept that first width forever -- plots stopped ~90px
    // short of the card edge. Re-measure whenever THIS container resizes.
    if(typeof ResizeObserver!=='undefined'){
      let t; const ro=new ResizeObserver(()=>{ clearTimeout(t); t=setTimeout(()=>{ try{ if(!inst.isDisposed() && dom.isConnected) inst.resize(); }catch(e){} }, 60); });
      ro.observe(dom); entry.ro=ro;
    }
  }
  // An in-place update (a slider drag, a what-if tap) redraws every chart on the result;
  // animating each one on every tick is noise, and reduced motion asks for none at all.
  const still = chartQuiet || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  entry.inst.setOption(still ? Object.assign({ animation: false }, option) : option, true);
  return entry.inst;
}
function disposeChart(id){ if(chartInstances[id]){ if(chartInstances[id].ro) chartInstances[id].ro.disconnect(); chartInstances[id].inst.dispose(); delete chartInstances[id]; } }
function deferChartInit(fn){ setTimeout(fn, 0); }
// The headline follows the pointer: a readout above the chart (never under a
// finger) shows every value at the year being looked at. The chart is also a
// keyboard slider: arrows move one point, Page Up/Down move 5% of the way,
// Home/End jump to the ends, and a screen reader hears the same words as the
// slider's value text. (It is role="slider", not "img": an element that takes
// arrow keys has to say so.) describe(i) returns [[label, value], ...] for
// point i of `count`; `start` is the point shown when nothing is being looked at.
function wireChartScrub(inst, chartId, count, describe, start, seriesIndex){
  const dom = document.getElementById(chartId), ro = document.getElementById(chartId + '-ro');
  if (!inst || !dom || !ro || count < 2) return;
  let idx = start;
  const paint = i => {
    idx = i;
    const parts = describe(i);
    ro.textContent = '';
    parts.forEach(([k, v]) => { const s = document.createElement('span'), b = document.createElement('b'); b.textContent = v; s.append(k + ' ', b); ro.append(s); });
    dom.setAttribute('aria-valuenow', i);
    dom.setAttribute('aria-valuetext', parts.map(([k, v]) => k + ' ' + v).join(', '));
  };
  dom.tabIndex = 0;
  dom.setAttribute('role', 'slider');
  dom.setAttribute('aria-valuemin', 0);
  dom.setAttribute('aria-valuemax', count - 1);
  paint(start);
  inst.off('updateAxisPointer'); inst.getZr().off('globalout');
  inst.on('updateAxisPointer', e => { const a = e.axesInfo && e.axesInfo[0]; if (a && typeof a.value === 'number' && a.value !== idx) paint(a.value); });
  inst.getZr().on('globalout', () => { if (document.activeElement !== dom) paint(start); });
  // Properties, not addEventListener: a re-render cannot stack a second handler.
  dom.onkeydown = e => {
    const big = Math.max(1, Math.round(count / 20));
    const to = { ArrowRight: idx + 1, ArrowUp: idx + 1, ArrowLeft: idx - 1, ArrowDown: idx - 1, PageUp: idx + big, PageDown: idx - big, Home: 0, End: count - 1 }[e.key];
    if (to == null) return;
    e.preventDefault();
    const i = Math.max(0, Math.min(count - 1, to));
    inst.dispatchAction({ type: 'showTip', seriesIndex, dataIndex: i });
    paint(i);
  };
  dom.onblur = () => { inst.dispatchAction({ type: 'hideTip' }); paint(start); };
}

/* =====================================================================
   ENGINE — the shared financial math now lives in goalden-engine.js
   (inflateExpense, realRate, corpusRequired, solveSIP, effectiveMonthlyRate,
   accumulationSchedule, marketSeries, marketName, and the market-history
   helpers), loaded via the <script> tag just above. Tested against solved
   workbooks in engine.test.js (`node --test engine.test.js`).
   ===================================================================== */
function caretSvg() {
  return '<svg class="tog-caret" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
}
function yearlyAmortization(monthlyRows) {
  const years = []; let prevClose = 0, prevContributed = 0;
  for (let m = 0; m < monthlyRows.length; m += 12) {
    const end = monthlyRows[Math.min(m + 11, monthlyRows.length - 1)];
    const contributedThisYear = end.contributed - prevContributed;
    const growthThisYear = end.closeBal - prevClose - contributedThisYear;
    years.push({ year: years.length + 1, contributed: Math.round(contributedThisYear), growth: Math.round(growthThisYear), close: Math.round(end.closeBal) });
    prevClose = end.closeBal; prevContributed = end.contributed;
  }
  return years;
}
// mountainChart() labels each point "Year N" from its raw array index --
// feeding it accumulationSchedule()'s rows directly (one row per MONTH)
// mislabels month 109 as "Year 109" instead of one point per real year.
// Bucket to yearly first, using each year's real cumulative totals (not
// yearlyAmortization()'s per-year deltas, which the chart isn't built for).
function yearlyMountainRows(monthlyRows) {
  const rows = [];
  for (let m = 0; m < monthlyRows.length; m += 12) {
    const end = monthlyRows[Math.min(m + 11, monthlyRows.length - 1)];
    rows.push({ contributed: end.contributed, closeBal: end.closeBal });
  }
  return rows;
}
function drawdownSchedule(opts) {
  const rows = []; let bal = opts.openingCorpus; let w = opts.firstWithdrawal;
  for (let yr = 1; yr <= opts.years; yr++) {
    let close;
    if (opts.due) { const baw = bal - w; close = baw + baw * opts.nominalRate; }
    else { close = (bal + bal * opts.nominalRate) - w; }
    rows.push({ year: yr, openBal: bal, withdrawal: w, closeBal: Math.max(0, close) });
    bal = close;
    w *= (1 + opts.inflation);
  }
  return rows;
}

function flow() {
  if (!S.goalType) return ['country', 'goal'];
  let f;
  if (S.goalType === 'retirement') f = ['country','goal','age','expense','risk','results'];
  else if (S.goalType === 'education')  f = ['country','goal','edu_fee','edu_years','risk','results'];
  else if (S.goalType === 'generic')    f = ['country','goal','gen_type','gen_amount','gen_years','risk','results'];
  else if (S.goalType === 'delay')      f = ['country','goal','delay_corpus','delay_years','results'];
  else return ['country','goal'];
  // "The Case" is an optional deeper screen reached from results, not a
  // forced step -- someone who just wants their number never has to see
  // it, but it's one tap away for anyone who wants to know why.
  if (S.viewingCase) f = [...f, 'case'];
  return f;
}

function cfg() { return C[S.country]; }

function riskAllocation() {
  return RISK.find(x => x.id === S.risk) || RISK[1];
}
function riskRate() {
  const d = cfg().d, a = riskAllocation();
  return a.eq*d.equity + a.de*d.debt + a.hy*d.hybrid;
}
// Same eq/de/hy blend as riskRate(), but for an arbitrary allocation --
// used by the advanced post-goal rate override.
function blendedRate(alloc, d) {
  return alloc.eq*d.equity + alloc.de*d.debt + alloc.hy*d.hybrid;
}
// Turns a single "how much equity" slider into a full eq/de/hy split by
// keeping debt:hybrid in whatever ratio the base risk profile already
// used -- same redistribution idea as a glide path, just applied on
// demand instead of by age.
function allocFromEquityPct(eqPct, base) {
  const eq = eqPct/100;
  const deHyTotal = base.de + base.hy;
  const deShare = deHyTotal > 0 ? base.de/deHyTotal : 0.75;
  const rest = 1 - eq;
  return { eq, de: rest*deShare, hy: rest*(1-deShare) };
}

/* =====================================================================
   CALCULATION
   ===================================================================== */
// Saved browser state and the advisor can both hand calcRetirement a half-formed
// or tampered S.acc, so the boxes are cleaned here rather than trusted: anything
// that is not a positive number becomes 0, whole rupees only, capped at Rs 100
// crore (the ceiling existing savings already has), the PPF deposit capped at its
// yearly limit, and the PF-wage choice is one of two words. Returns null when
// nothing is left, so "no accounts" has exactly one shape.
const ACC_KEYS = ['epfBal', 'epfBasic', 'ppfBal', 'ppfYearly', 'npsBal', 'npsMonthly'];
function accClean(a) {
  if (!a || typeof a !== 'object') return null;
  const out = { epfWage: a.epfWage === 'ceiling' ? 'ceiling' : 'full' };
  let any = false;
  ACC_KEYS.forEach(k => { const v = Math.floor(Number(a[k])); out[k] = isFinite(v) && v > 0 ? Math.min(v, 1e9) : 0; if (out[k] > 0) any = true; });
  out.ppfYearly = Math.min(out.ppfYearly, RETIRE_ACCOUNTS_IN.ppf.yearlyMax);
  return any ? out : null;
}

function calcRetirement() {
  const d = cfg().d, c = cfg();
  const yrs = S.retireAge - S.age;
  const drawYrs = Math.max(5, d.lifeExp - S.retireAge);
  const annualExp = S.monthlyExpense * 12;
  const expAtRet = inflateExpense(annualExp, [{rate: d.inflation, years: yrs}], 0.75);
  const postRetRate = S.postRetAlloc ? blendedRate(S.postRetAlloc, d) : d.postRet;
  const rr = realRate(postRetRate, d.inflation);
  const corpus = corpusRequired(rr, drawYrs, expAtRet, true);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  // Existing savings are assumed to stay invested the same way the new SIP
  // will be, so both compound at the same mRate. That keeps the identity
  // exact: existingFV + gapCorpus equals the target corpus less whatever EPF,
  // PPF and NPS cover (below), which is where the accumulation chart lands.
  const existing = S.existingSavings || 0;
  const existingFV = existing * Math.pow(1 + mRate, yrs * 12);
  // EPF, PPF and NPS (India): what they will hold at retirement is counted
  // against the pot, so the SIP only builds the rest. The accumulation chart
  // therefore ends at corpus - accCounted, not at the full pot, and says so.
  // Pay rises with prices (d.inflation); NPS grows at the plan's own rate.
  const acc = c.code === 'IN' ? accClean(S.acc) : null;
  const accFV = acc ? retirementAccountsFV(acc, yrs, preRate, d.inflation, { retireAge: S.retireAge }) : null;
  const accCounted = accFV ? accFV.counted : 0;
  const gapCorpus = Math.max(0, corpus - existingFV - accCounted);
  const alreadyMet = (existing > 0 || accCounted > 0) && gapCorpus === 0;
  const sip = alreadyMet ? 0 : solveSIP(mRate, yrs * 12, gapCorpus, true);
  // The same plan without the accounts, so the card can say what they save.
  const gapNoAcc = Math.max(0, corpus - existingFV);
  const sipWithoutAcc = accCounted > 0 ? (gapNoAcc === 0 ? 0 : solveSIP(mRate, yrs * 12, gapNoAcc, true)) : sip;
  const realCorpus = corpus / Math.pow(1 + d.inflation, yrs);
  const accRows = accumulationSchedule({sip, rate: mRate, periods: yrs * 12, due: true, opening: existing, stepUp: 0}).rows;
  const drawRows = drawdownSchedule({openingCorpus: corpus, firstWithdrawal: expAtRet, inflation: d.inflation, nominalRate: postRetRate, years: drawYrs, due: true});
  const delay = alreadyMet ? null : calcDelay(gapCorpus, mRate, yrs);
  return {corpus, sip, realCorpus, preRate, postRetRate, expAtRet, yrs, drawYrs, accRows, drawRows, delay, d, existing, existingFV, gapCorpus, alreadyMet, acc: accFV, accCounted, sipWithoutAcc};
}

// A one-tap "what if I retired at a different age" comparison. Reuses
// calcRetirement's exact math for each candidate age (by temporarily
// swapping S.retireAge and restoring it) rather than a separate
// approximation, so this can never quietly disagree with the main result.
function calcRetireAgeCompare() {
  const base = S.retireAge;
  const candidates = Array.from(new Set([base - 5, base, base + 5]))
    .filter(age => age > S.age && age <= 75)
    .sort((a, b) => a - b);
  if (candidates.length < 2) return null;
  const saved = S.retireAge;
  const rows = candidates.map(age => {
    S.retireAge = age;
    const r = calcRetirement();
    return { age, sip: r.sip, alreadyMet: r.alreadyMet, isCurrent: age === base };
  });
  S.retireAge = saved;
  return rows;
}

function calcEducation() {
  const d = cfg().d, c = cfg();
  const feeAtCollege = inflateExpense(S.annualFee, [{rate: d.eduInflation, years: S.yearsToCollege}]);
  const eduPhaseRate = S.eduAlloc ? blendedRate(S.eduAlloc, d) : d.debt;
  const rr = realRate(eduPhaseRate, d.eduInflation);
  const corpus = corpusRequired(rr, S.courseDuration, feeAtCollege, true);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  const existing = S.existingSavings || 0;
  const existingFV = existing * Math.pow(1 + mRate, S.yearsToCollege * 12);
  const gapCorpus = Math.max(0, corpus - existingFV);
  const alreadyMet = existing > 0 && gapCorpus === 0;
  const sip = alreadyMet ? 0 : solveSIP(mRate, S.yearsToCollege * 12, gapCorpus, true);
  const realCorpus = corpus / Math.pow(1 + d.inflation, S.yearsToCollege);
  const accRows = accumulationSchedule({sip, rate: mRate, periods: S.yearsToCollege * 12, due: true, opening: existing, stepUp: 0}).rows;
  const feeYears = Array.from({length: S.courseDuration}, (_, i) =>
    inflateExpense(S.annualFee, [{rate: d.eduInflation, years: S.yearsToCollege + i}])
  );
  const delay = alreadyMet ? null : calcDelay(gapCorpus, mRate, S.yearsToCollege);
  return {corpus, sip, realCorpus, preRate, eduPhaseRate, feeAtCollege, accRows, feeYears, delay, d, existing, existingFV, gapCorpus, alreadyMet};
}

function calcGeneric() {
  const d = cfg().d, c = cfg();
  const inflRate = (c.goalInflation && c.goalInflation[S.genType]) ? c.goalInflation[S.genType] : d.inflation;
  const inflatedGoal = S.genAmount * Math.pow(1 + inflRate, S.genYears);
  const fvSavings = S.existingSavings * Math.pow(1 + d.debt, S.genYears);
  const gap = Math.max(0, inflatedGoal - fvSavings);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  const sip = gap > 0 ? solveSIP(mRate, S.genYears * 12, gap, true) : 0;
  const accRows = sip > 0 ? accumulationSchedule({sip, rate: mRate, periods: S.genYears * 12, due: true, stepUp: 0}).rows : [];
  const delay = gap > 0 ? calcDelay(gap, mRate, S.genYears) : null;
  return {inflatedGoal, fvSavings, gap, sip, preRate, accRows, inflRate, delay, d};
}

function calcDelay(corpus, mRate, yearsRemaining) {
  const now3 = Math.max(1, yearsRemaining - 3);
  const now5 = Math.max(1, yearsRemaining - 5);
  const sipNow = solveSIP(mRate, yearsRemaining * 12, corpus, true);
  const sip3   = solveSIP(mRate, now3 * 12, corpus, true);
  const sip5   = solveSIP(mRate, now5 * 12, corpus, true);
  return { sipNow, sip3, extra3: sip3 - sipNow, sip5, extra5: sip5 - sipNow };
}

// On-chart value tag (same convention as the Lab): numbers printed on the
// chart itself, not only in hover tooltips that phones and printouts never
// show. Dark AA text colours only; pastel series colours are fills.
const CHART_TEXT={ink:'#14283F', blue:'#1E4FBE', good:'#256F55', bad:'#9C4A2C', muted:'#56698A'};
function valueTag(text, color, position){
  return {show:true, formatter:text, position:position||'left', distance:6, color:color||CHART_TEXT.ink,
    fontFamily:"'Spline Sans Mono',monospace", fontSize:10.5, fontWeight:600,
    backgroundColor:'rgba(255,255,255,.88)', padding:[2,5], borderRadius:3};
}
// The plan you just left through a "what if I retired at ..." tap, drawn on "How the pot
// grows" as a dotted line, so the tap shows what it changed. It is only true while every
// other answer is unchanged, so it carries a signature of them and is ignored the moment any
// differs: nothing has to clear it by hand in each of the places an answer can change.
// Not saved: it only makes sense within one visit to the result.
let planGhost = null;   // {retireAge, rows, end, sig, to}; `to` is the age the tap moved to
function ghostSig() { return JSON.stringify([S.country, S.age, S.monthlyExpense, S.risk, S.existingSavings, S.postRetAlloc, S.acc]); }
function rememberGhost() {
  if (S.goalType !== 'retirement') { planGhost = null; return; }
  const r = calcRetirement(), rows = yearlyMountainRows(r.accRows);
  planGhost = r.alreadyMet || !rows.length ? null : { retireAge: S.retireAge, rows, end: rows[rows.length - 1].closeBal, sig: ghostSig() };
}
// `to` matters because the retire age is the one answer the signature leaves out: if the live canvas or the
// advisor moves it again (55 to 58), the line is no longer "the plan you had a moment ago".
function activeGhost() { return planGhost && S.goalType === 'retirement' && planGhost.retireAge !== S.retireAge && planGhost.to === S.retireAge && planGhost.sig === ghostSig() ? planGhost : null; }
// The caption says what the dotted line is, from the same numbers the line's own label carries.
function ghostCaption(c) {
  const g = activeGhost();
  return g ? ' The dotted line is the plan you had a moment ago, retiring at ' + g.retireAge + ', which builds to ' + c.compact(g.end) + '.' : '';
}
function mountainChart(rows, chartId, opts) {
  const withGhost = !!(opts && opts.ghost);
  deferChartInit(()=>renderMountainChartOption(chartId, rows, withGhost));
  return `<div class="scrub-readout" id="${chartId}-ro" aria-hidden="true"></div>` +
    `<div id="${chartId}" class="echart" style="height:200px" aria-label="How the pot grows, year by year. Use the left and right arrow keys to step through the years."></div>`;
}
function renderMountainChartOption(chartId, rows, withGhost){
  const c = cfg();
  const n=rows.length, last=rows[n-1]||{closeBal:0};
  const hasContrib = last.contributed!=null;
  const growthShare = hasContrib && last.closeBal>0 ? Math.round(Math.max(0,last.closeBal-last.contributed)/last.closeBal*100) : null;
  const series=[];
  if(hasContrib) series.push({ name:'Contributed', type:'line', data:rows.map(r=>r.contributed), showSymbol:false, lineStyle:{opacity:0}, areaStyle:{color:'rgba(20,40,63,.16)'}, z:1,
    markPoint:{symbol:'circle', symbolSize:5, silent:true, itemStyle:{color:CHART_TEXT.muted}, data:[{coord:[n-1,last.contributed]}], label:valueTag('You put in '+c.compact(last.contributed), CHART_TEXT.ink)} });
  series.push({ name:'Grows to', type:'line', data:rows.map(r=>r.closeBal), showSymbol:false, lineStyle:{color:'#2557C7', width:1.5},
    areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(37,87,199,.85)'},{offset:1,color:'rgba(37,87,199,.08)'}]}}, z:2,
    markPoint:{symbol:'circle', symbolSize:6, silent:true, itemStyle:{color:'#2557C7'}, data:[{coord:[n-1,last.closeBal]}], label:valueTag('Grows to '+c.compact(last.closeBal), CHART_TEXT.blue)} });
  const ghost = withGhost ? activeGhost() : null;
  const N = Math.max(n, ghost ? ghost.rows.length : 0);
  if (ghost) {
    // Slate and dotted with no fill, so it reads as "the other plan" in greyscale too; the current plan stays blue, solid, filled.
    const gl = ghost.rows.length;
    series.push({ name:'Before', type:'line', data:ghost.rows.map(r=>r.closeBal), showSymbol:false, silent:true, z:3,
      lineStyle:{color:'#56698A', width:1.8, type:[2,3]},
      markPoint:{symbol:'circle', symbolSize:5, silent:true, itemStyle:{color:'#56698A'}, data:[{coord:[gl-1, ghost.end]}],
        label:valueTag('Retire '+ghost.retireAge+': '+c.compact(ghost.end), CHART_TEXT.muted, gl-1 > N*0.7 ? 'left' : 'right')} });
  }
  const inst = initChart(chartId, {
    grid:{left:2,right:2,top:growthShare!=null?24:12,bottom:20,containLabel:false},
    xAxis:{type:'category', data:Array.from({length:N}, (_, i)=>i+1), boundaryGap:false,
      axisLabel:{show:true, interval:(idx)=>idx===0||idx===N-1, formatter:v=>'Year '+v, color:CHART_TEXT.muted, fontSize:10, alignMinLabel:'left', alignMaxLabel:'right'},
      axisLine:{show:false}, axisTick:{show:false}},
    yAxis:{type:'value', show:false, min:0},
    tooltip:{trigger:'axis', formatter(params){
      const grown=params.find(p=>p.seriesName==='Grows to'), contrib=params.find(p=>p.seriesName==='Contributed'), before=params.find(p=>p.seriesName==='Before');
      if(!grown && !before) return '';
      return `Year ${(grown||before).axisValueLabel}`+(grown?`<br/>Grows to: ${c.compact(grown.value)}`:'')+(contrib?`<br/>Contributed: ${c.compact(contrib.value)}`:'')+(before?`<br/>Retire ${ghost.retireAge}: ${c.compact(before.value)}`:'');
    }},
    graphic: growthShare!=null ? [{type:'text', left:2, top:2, style:{text:'Growth is '+growthShare+'% of the final pot', fill:CHART_TEXT.good, fontSize:11, fontWeight:600, fontFamily:"'Spline Sans Mono',monospace"}}] : [],
    series,
  });
  const describe = i => {
    const parts = [['Year', i + 1]];
    if (i < n) {
      const r = rows[i];
      parts.push(['pot', c.compact(r.closeBal)]);
      if (hasContrib) {
        parts.push(['paid in', c.compact(r.contributed)]);
        parts.push(['from growth', (r.closeBal > 0 ? Math.round(Math.max(0, r.closeBal - r.contributed) / r.closeBal * 100) : 0) + '%']);
      }
    }
    if (ghost && i < ghost.rows.length) parts.push(['Retire ' + ghost.retireAge, c.compact(ghost.rows[i].closeBal)]);
    return parts;
  };
  wireChartScrub(inst, chartId, N, describe, n - 1, series.findIndex(s => s.name === 'Grows to'));
}

// Part-to-whole as one labelled strip. Replaces the donut + legend, which the
// chart rules ban. Lengths along one line compare more easily than angles, each
// part is labelled where it stands, and the hatching keeps the parts apart in
// greyscale and print. Plain HTML, so there is no chart instance to manage.
// The strip itself is decorative (aria-hidden): the labels carry the numbers.
const ALLOC_PARTS = [
  { key:'eq', label:'Equity' },
  { key:'de', label:'Debt' },
  { key:'hy', label:'Hybrid' },
];
let allocStripSeq = 0;
// Splits a whole-number monthly amount across the parts so the shown amounts
// add up to it exactly (largest remainder), instead of each being rounded alone.
function allocAmounts(ws, sip) {
  const total = Math.round(sip), raw = ws.map(w => total * w), out = raw.map(Math.floor);
  let rest = total - out.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - out[i], i]).sort((a, b) => b[0] - a[0]).forEach(p => { if (rest > 0) { out[p[1]]++; rest--; } });
  return out;
}
function allocationStrip(eq, de, hy, idPrefix, sip, c) {
  const id = (idPrefix || 'alloc-strip') + '-' + (++allocStripSeq);
  const shown = [eq, de, hy].map((w, i) => ({ p: ALLOC_PARTS[i], w: w })).filter(s => s.w > 0.001);
  const sum = shown.reduce((a, s) => a + s.w, 0);
  shown.forEach(s => { s.w = s.w / sum; });
  const amts = sip > 0 && c ? allocAmounts(shown.map(s => s.w), sip) : null;
  let x = 0;
  const segs = [], lbls = [];
  shown.forEach((s, k) => {
    const last = k === shown.length - 1;
    const pct = Math.round(s.w * 100);
    // 2px of card shows through between parts (the "surface gap").
    const width = last ? (s.w * 100) + '%' : 'calc(' + (s.w * 100) + '% - 2px)';
    segs.push('<span class="alloc-seg alloc-' + s.p.key + '" style="left:' + (x * 100) + '%;width:' + width + '"></span>');
    lbls.push('<div class="alloc-lbl" style="left:' + (x * 100) + '%;width:' + (s.w * 100) + '%">' +
      '<span class="alloc-key alloc-' + s.p.key + '"></span><b>' + pct + '%</b>' + s.p.label +
      (amts ? '<span class="alloc-amt">' + c.fmt(amts[k]) + '/mo</span>' : '') + '</div>');
    x += s.w;
  });
  deferChartInit(() => {
    fitAllocLabels(id);
    // Web fonts arriving late change the label widths.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAllocLabels(id));
  });
  return '<div class="alloc-strip-wrap" id="' + id + '">' +
    '<div class="alloc-strip" aria-hidden="true">' + segs.join('') + '</div>' +
    '<div class="alloc-lbls' + (amts ? ' has-amt' : '') + '">' + lbls.join('') + '</div></div>';
}
// Labels sit under their own part. If any label's text is wider than its part
// at the current width (Hybrid at 10-15% almost always, and every part on a
// narrow phone), stack the labels as a list instead of letting them overlap or
// clip. Measured, not guessed: scrollWidth > clientWidth is exactly "the text
// does not fit its box".
function fitAllocLabels(id) {
  const wrap = document.getElementById(id);
  if (!wrap) return;
  const box = wrap.querySelector('.alloc-lbls');
  box.classList.remove('as-list');
  if ([...box.children].some(l => l.scrollWidth > l.clientWidth + 1)) box.classList.add('as-list');
}
window.addEventListener('resize', () => document.querySelectorAll('.alloc-strip-wrap').forEach(el => fitAllocLabels(el.id)));
// One sentence from the real split, for the card caption (chart rule). With a
// monthly amount it says where that amount goes; without one, "every rupee".
function allocCaption(eq, de, hy, sip, c) {
  const words = { 25: 'A quarter', 50: 'Half', 75: 'Three quarters' };
  const parts = [['equity', eq], ['debt', de], ['hybrid funds', hy]].filter(p => p[1] > 0.001).sort((a, b) => b[1] - a[1]);
  const top = Math.round(parts[0][1] * 100);
  const unit = c && c.sym === '$' ? 'dollar' : 'rupee';
  const lead = (words[top] || top + '%') + ' of ' + (sip > 0 && c ? 'the ' + c.fmt(Math.round(sip)) + ' a month' : 'every ' + unit) + ' goes to ' + parts[0][0];
  const rest = parts.slice(1).map(p => Math.round(p[1] * 100) + '% to ' + p[0]);
  return lead + (rest.length ? ', ' + rest.join(' and ') : '') + '.';
}

// A bare filled shape with no readable numbers on it isn't information,
// it's decoration. This version always shows the actual starting and
// ending amounts, the years the timeline spans, and — the thing that
// actually matters for a drawdown plan — exactly where the pot runs dry
// if it does, marked with a real dot and label, not left for the reader
// to guess from the shape of the line.
function potChart(rows, c, chartId) {
  deferChartInit(()=>renderPotChartOption(chartId, rows, c));
  return `<div id="${chartId}" class="echart" style="height:172px"></div>`;
}
// Reaching exactly zero AT the final year is the plan working correctly —
// that is what "lasts until age X" means, since the corpus is solved to
// just cover that many years of withdrawals. Only flag it as an actual
// shortfall when the money runs out BEFORE the plan says it should.
function renderPotChartOption(chartId, rows, c){
  const fmt = c ? (v => c.compact(v)) : (v => Math.round(v).toLocaleString());
  const n = rows.length;
  let depletedYear = null;
  for (const r of rows) { if (r.closeBal <= 0) { depletedYear = r.year; break; } }
  const prematureDepletion = depletedYear !== null && depletedYear < n;
  const startVal = rows[0].openBal;
  const endVal = rows[n-1].closeBal;
  const endLabelText = prematureDepletion ? `Runs out, yr ${depletedYear}` : (endVal<=0?'Reaches zero as planned':'Ends at '+fmt(endVal));
  const endLabelColor = prematureDepletion ? '#9C4A2C' : '#1F8A70';
  const endTextColor = prematureDepletion ? CHART_TEXT.bad : CHART_TEXT.good; // AA text tokens; the dot wears the chart colour
  initChart(chartId, {
    grid:{left:2,right:2,top:26,bottom:20,containLabel:false},
    xAxis:{type:'category', data:rows.map((r,i)=>'Yr '+(r.year!==undefined?r.year:i+1)), boundaryGap:false,
      axisLabel:{show:true, interval:(idx)=>idx===0||idx===n-1, color:CHART_TEXT.muted, fontSize:10, alignMinLabel:'left', alignMaxLabel:'right'},
      axisLine:{show:false}, axisTick:{show:false}, splitLine:{show:false}},
    yAxis:{type:'value', show:false, min:0},
    tooltip:{trigger:'axis', formatter(params){
      const p=params[0];
      return `${p.axisValueLabel}<br/>Balance: ${fmt(p.value)}`;
    }},
    graphic:[{type:'text', left:2, top:2, style:{text:'Starts at '+fmt(startVal), fill:CHART_TEXT.muted, fontSize:10.5, fontFamily:"'Spline Sans Mono',monospace"}}],
    series:[
      { type:'line', data:rows.map(r=>r.closeBal), showSymbol:false, lineStyle:{color:'#1F8A70', width:1.5},
        areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(31,138,112,.5)'},{offset:1,color:'rgba(31,138,112,.05)'}]}},
        markPoint:{symbol:'circle', symbolSize:8,
          data:[{coord: prematureDepletion?[depletedYear-1,0]:[n-1,endVal], itemStyle:{color:endLabelColor}}],
          label:{show:true, formatter:()=>endLabelText, position:'top', align:(()=>{ const x=prematureDepletion?depletedYear-1:n-1; return x>n*0.7?'right':(x<n*0.3?'left':'center'); })(), color:endTextColor, fontWeight:600, fontFamily:"'Spline Sans Mono',monospace", fontSize:10.5}} },
    ],
  });
}

// The full "risk shrinks with holding period" curve, every year from 1 to
// maxYears in one static chart, with a marker for the currently selected
// point. Shows the whole trend at a glance instead of one number at a time.
// The curve itself is expensive to build (a rollingWindows() pass per
// year), so it's built once on mount; dragging the holding-period slider
// only recomputes the ONE selected year and moves the marker via
// updateRiskShrinkMarker() below, a merge-only setOption that leaves the
// curve series untouched — the same fast path the original hand-rolled
// version used (direct attribute patches instead of a full SVG rebuild).
function riskShrinkPoints(series, maxYears){
  const points = [];
  for (let yr=1; yr<=maxYears; yr++) {
    const win = rollingWindows(series, yr);
    const losing = win.filter(x=>x.finalMultiple<1).length;
    points.push([yr, 100*losing/win.length]);
  }
  return points;
}
function riskShrinkPctAt(series, selectedYears){
  const win = rollingWindows(series, selectedYears);
  const losing = win.filter(x=>x.finalMultiple<1).length;
  return 100*losing/win.length;
}
function riskShrinkMarkerOption(selectedYears, pct){
  return { id:'risk',
    markLine:{silent:true, symbol:['none','none'], lineStyle:{color:'rgba(20,40,63,.3)', type:'dashed'}, data:[{xAxis:selectedYears}]},
    markPoint:{symbol:'circle', symbolSize:9, itemStyle:{color:'#B8740F', borderColor:'var(--ink)', borderWidth:1.5}, label:{show:false}, data:[{coord:[selectedYears, pct]}]},
  };
}

}
function renderRiskShrinkChartOption(chartId, series, maxYears, selectedYears){
  const points = riskShrinkPoints(series, maxYears);

}

// Advanced, opt-in control attached to a flat post-goal rate (post-
// retirement or during-education-study-years). One slider -- how much
// equity stays in the mix at that stage -- with debt/hybrid split to
// preserve the risk profile's own ratio (allocFromEquityPct). Defaults to
// closed/using the flat rate; nothing changes until the user explicitly
// applies a custom mix.
function advAllocControl(kind) {
  const base = riskAllocation();
  const active = kind==='ret' ? S.postRetAlloc : S.eduAlloc;
  const eqPct = active ? Math.round(active.eq*100) : Math.round(base.eq*100);
  const p = 'adv'+kind;
  return '<div class="adv-toggle'+(active?' adv-active open':'')+'" id="'+p+'Toggle">' +
      '<span class="tog-caret">&#9662;</span>Advanced: customize this rate'+(active?' <span class="adv-badge">customized</span>':'') +
    '</div>' +
    '<div class="adv-panel'+(active?' open':'')+'" id="'+p+'Panel"><div class="adv-inner">' +
      '<label class="adv-label">Equity kept at this stage <b id="'+p+'Val">'+eqPct+'%</b></label>' +
      '<input type="range" id="'+p+'Slider" min="0" max="100" step="5" value="'+eqPct+'">' +
      '<div class="adv-preview" id="'+p+'Preview"></div>' +
      '<div class="adv-btn-row"><button id="'+p+'Apply">Use this mix</button>' +
      (active ? '<button id="'+p+'Reset" class="adv-btn-ghost">Reset to default</button>' : '') + '</div>' +
    '</div></div>';
}
function wireAdvAlloc(kind) {
  const p = 'adv'+kind;
  const toggle = document.getElementById(p+'Toggle'), panel = document.getElementById(p+'Panel');
  if (toggle && panel) toggle.addEventListener('click', () => { panel.classList.toggle('open'); toggle.classList.toggle('open'); });
  const slider = document.getElementById(p+'Slider');
  if (!slider) return;
  const d = cfg().d;
  const flatRate = kind==='ret' ? d.postRet : d.debt;
  const updatePreview = (eqPct) => {
    const rate = blendedRate(allocFromEquityPct(eqPct, riskAllocation()), d);
    const valEl = document.getElementById(p+'Val'); if (valEl) valEl.textContent = eqPct+'%';
    const prevEl = document.getElementById(p+'Preview');
    if (prevEl) prevEl.innerHTML = 'New rate: <b>'+(rate*100).toFixed(1)+'%</b> a year (was '+(flatRate*100).toFixed(1)+'%)';
  };
  updatePreview(parseInt(slider.value));
  slider.addEventListener('input', () => updatePreview(parseInt(slider.value)));
  const applyBtn = document.getElementById(p+'Apply');
  if (applyBtn) applyBtn.addEventListener('click', () => {
    const alloc = allocFromEquityPct(parseInt(slider.value), riskAllocation());
    if (kind==='ret') S.postRetAlloc = alloc; else S.eduAlloc = alloc;
    render();
  });
  const resetBtn = document.getElementById(p+'Reset');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    if (kind==='ret') S.postRetAlloc = null; else S.eduAlloc = null;
    render();
  });
}

   value, not only the ones we guessed they'd want. Chips remain as
   quick-jump shortcuts underneath, not the only way in.
   ===================================================================== */
function sliderBounds(chips, extendFactor, minFloorFactor) {
  extendFactor = extendFactor===undefined ? 2.5 : extendFactor;
  minFloorFactor = minFloorFactor===undefined ? 0.3 : minFloorFactor;
  const lo = chips[0] * minFloorFactor;
  const hi = chips[chips.length-1] * extendFactor;
  let raw = hi / 200;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw,1))));
  const norm = raw / mag;
  const step = (norm<1.5?1:norm<3.5?2:norm<7.5?5:10) * mag;
  return { min: Math.max(0, Math.round(lo/step)*step), max: Math.round(hi/step)*step, step };
}
function valueSlider(id, value, min, max, step, loLabel, hiLabel) {
  return '<div class="value-slider">' +
    '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+(value||min)+'">' +
    '<div class="value-slider-labels"><span>'+loLabel+'</span><span>'+hiLabel+'</span></div>' +
    '</div>';
}
// Wires a slider to the same number-input + set() flow a screen already
// uses, so dragging, typing, and tapping a chip all stay in sync.
function wireSlider(sliderId, inp, min, max, setFn) {
  const sl = document.getElementById(sliderId);
  if (!sl) return null;
  sl.addEventListener('input', () => { inp.value = sl.value; setFn(parseInt(sl.value)); });
  return sl;
}
function syncSliderToValue(sl, v, min, max) {
  if (sl && v!=null) sl.value = Math.min(max, Math.max(min, v));
}
