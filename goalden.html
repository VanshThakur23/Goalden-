<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Goalden — find your number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C3A2D; --ink2:#274A3A; --paper:#F1EEE3; --card:#FAF8F0;
  --gold:#C9A455; --gold-deep:#A98B45; --red:#A03A22;
  --body:#3D4A42; --dim:#8A9389; --rule:rgba(28,58,45,.14);
  --ok:#3D7A4F; --teal:#2D6E6E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:'Figtree',system-ui,sans-serif;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;flex-shrink:0}
.brand{font-family:'Newsreader',serif;font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--gold);text-decoration:none;display:inline-block}
.brand span{color:var(--paper);font-weight:400;font-style:italic;font-size:14px;margin-left:6px;opacity:.7}
.backbtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(241,238,227,.25);background:transparent;color:var(--paper);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.assumpbtn{width:30px;height:30px;border-radius:50%;border:1px solid rgba(201,164,85,.5);background:rgba(201,164,85,.12);color:var(--gold);font-family:'Newsreader',serif;font-style:italic;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
.assumpbtn.show{opacity:1;pointer-events:auto}
.backbtn.show{opacity:1;pointer-events:auto}
.progress{display:flex;gap:6px;padding:2px 20px 18px;flex-shrink:0}
.dot{height:4px;flex:1;background:rgba(241,238,227,.16);border-radius:2px;overflow:hidden}
.dot i{display:block;height:100%;width:0%;background:var(--gold);border-radius:2px;transition:width .35s ease}
.dot.done i,.dot.active i{width:100%}

.stage{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;padding:8px 24px 24px;display:flex;flex-direction:column;opacity:0;transform:translateX(24px);pointer-events:none;transition:opacity .3s ease,transform .3s ease;min-height:0}
/* Same fix as Door 2: switching to position:relative here for the active
   screen drops the height that inset:0 was providing (relative positioning
   only offsets, it doesn't size), so tall content just grew past .stage's
   box and got silently clipped by overflow:hidden with no scrollbar. This
   was never actually applied here before, only in Door 2. */
.screen.active{opacity:1;transform:translateX(0);pointer-events:auto;position:relative;height:100%;min-height:0}
.screen.leaving{opacity:0;transform:translateX(-24px)}

.q-eyebrow{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.q-title{font-family:'Newsreader',serif;font-weight:600;font-size:clamp(22px,7vw,30px);line-height:1.18;color:var(--paper);margin-bottom:8px}
.q-sub{font-size:14px;color:rgba(241,238,227,.65);margin-bottom:26px;max-width:38ch;line-height:1.5}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:safe center;gap:16px;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* country grid */
.country-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.country-card{background:rgba(241,238,227,.06);border:1.5px solid rgba(241,238,227,.14);border-radius:6px 18px 6px 18px;padding:24px 14px;text-align:center;cursor:pointer;transition:all .18s}
.country-card:active{transform:scale(.97)}
.country-card.selected{background:rgba(201,164,85,.16);border-color:var(--gold)}
.country-badge{width:44px;height:44px;border-radius:50%;background:rgba(201,164,85,.14);border:1px solid rgba(201,164,85,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-family:'Newsreader',serif;font-size:22px;color:var(--gold)}
.country-name{font-family:'Newsreader',serif;font-size:17px;font-weight:600;color:var(--paper)}
.country-cur{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);margin-top:3px}

/* goal grid */
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-card{background:rgba(241,238,227,.06);border:1.5px solid rgba(241,238,227,.14);border-radius:4px 16px 4px 16px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .18s}
.goal-card:active{transform:scale(.97)}
.goal-card.selected{background:rgba(201,164,85,.16);border-color:var(--gold)}
.goal-icon{width:26px;height:26px;margin-bottom:9px;display:block;color:var(--gold)}
.goal-icon svg{width:100%;height:100%}
.goal-name{font-family:'Newsreader',serif;font-size:15px;font-weight:600;color:var(--paper);line-height:1.2}
.goal-tag{font-size:12px;color:rgba(241,238,227,.55);margin-top:4px}

/* generic goal type picker */
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gen-card{background:rgba(241,238,227,.06);border:1.5px solid rgba(241,238,227,.14);border-radius:4px 14px 4px 14px;padding:14px;text-align:center;cursor:pointer;transition:all .18s}
.gen-card:active{transform:scale(.97)}
.gen-card.selected{background:rgba(201,164,85,.16);border-color:var(--gold)}
.gen-icon{width:22px;height:22px;display:block;margin-bottom:6px;color:var(--gold)}
.gen-icon svg{width:100%;height:100%}
.gen-label{font-size:13.5px;font-weight:600;color:var(--paper)}
.gen-rate{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}

/* number input */
.num-wrap{display:flex;align-items:baseline;gap:8px;padding:18px 0;border-bottom:2px solid rgba(241,238,227,.2)}
.num-prefix{font-family:'Newsreader',serif;font-size:28px;color:var(--gold)}
.num-input{flex:1;background:transparent;border:none;outline:none;color:var(--paper);font-family:'Newsreader',serif;font-size:clamp(30px,10vw,42px);font-weight:600;-moz-appearance:textfield}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num-suffix{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--dim);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.chip{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--paper);background:rgba(241,238,227,.08);border:1px solid rgba(241,238,227,.18);padding:9px 15px;border-radius:3px;cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.selected{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.inline-error{color:#E8977A;font-size:13px;margin-top:14px;font-family:'Spline Sans Mono',monospace;min-height:16px}
.value-slider{margin:18px 0 8px}
.value-slider input[type=range]{width:100%;accent-color:var(--gold);height:22px;cursor:pointer}
.value-slider-labels{display:flex;justify-content:space-between;font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}
.chips-label{font-family:'Spline Sans Mono',monospace;font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px}
.optional-field{margin-top:20px;padding-top:20px;border-top:1px dashed rgba(241,238,227,.18)}
.optional-label{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.num-wrap-sm{display:flex;align-items:baseline;gap:6px;padding:10px 0;border-bottom:1px solid rgba(241,238,227,.15)}
.num-prefix-sm{font-family:'Newsreader',serif;font-size:18px;color:rgba(201,164,85,.6)}
.num-input-sm{flex:1;background:transparent;border:none;outline:none;color:rgba(241,238,227,.75);font-family:'Newsreader',serif;font-size:22px;font-weight:600;-moz-appearance:textfield}
.num-input-sm::-webkit-outer-spin-button,.num-input-sm::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* risk */
.risk-stack{display:flex;flex-direction:column;gap:12px}
.risk-card{background:rgba(241,238,227,.06);border:1.5px solid rgba(241,238,227,.14);border-radius:3px 16px 16px 16px;padding:19px 18px;cursor:pointer;transition:all .18s;text-align:left}
.risk-card:active{transform:scale(.98)}
.risk-card.selected{background:rgba(201,164,85,.14);border-color:var(--gold)}
.risk-card h4{font-family:'Newsreader',serif;font-size:16.5px;color:var(--paper);margin-bottom:4px}
.risk-card p{font-size:13px;color:rgba(241,238,227,.6);line-height:1.4}

/* CTA */
.cta-zone{padding:14px 0 4px;flex-shrink:0}
.cta{width:100%;background:var(--gold);color:var(--ink);border:none;border-radius:9px;font-family:'Figtree',sans-serif;font-weight:700;font-size:16px;padding:17px;cursor:pointer;transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.3;pointer-events:none}

/* results */
.result-scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;min-height:0}
.result-intro{text-align:center;font-family:'Newsreader',serif;font-style:italic;font-size:15px;color:rgba(241,238,227,.72);padding:4px 12px 18px;line-height:1.5}
.hero-number{text-align:center;padding:6px 0 4px}
.hero-label{font-family:'Spline Sans Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.hero-figure{font-family:'Newsreader',serif;font-weight:600;font-size:clamp(42px,15vw,64px);color:var(--paper);line-height:0.95;letter-spacing:-.01em}
.hero-sub{font-size:13.5px;color:rgba(241,238,227,.55);margin-top:10px}
.action-card{background:var(--gold);color:var(--ink);border-radius:3px 22px 22px 22px;padding:22px 24px;margin:26px 0 18px}
.action-card .al{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.action-card .af{font-family:'Newsreader',serif;font-weight:700;font-size:28px;margin:5px 0 8px}
.action-card .as{font-size:13.5px;line-height:1.5}
.chart-card{background:rgba(241,238,227,.05);border:1px solid rgba(241,238,227,.12);border-radius:2px 2px 18px 18px;padding:18px 16px 8px;margin-bottom:18px}
.chart-title{font-family:'Newsreader',serif;font-size:15.5px;color:var(--paper);margin-bottom:2px}
.chart-caption{font-size:12px;color:rgba(241,238,227,.5);margin-bottom:10px}
.alloc-flex{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.alloc-legend{flex:1;min-width:140px}
.alloc-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.alloc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.alloc-name{flex:1;font-size:13px;color:rgba(241,238,227,.8)}
.alloc-pct{font-family:'Spline Sans Mono',monospace;font-size:13px;color:var(--paper);font-weight:600}
.alloc-return-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid rgba(241,238,227,.1)}
.alloc-return-label{font-family:'Spline Sans Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.04em;margin-bottom:3px}
.alloc-return-value{font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:var(--paper)}
svg.chart{width:100%;height:auto;display:block}

/* delay card */
.delay-card{background:rgba(28,58,45,.7);border:1px solid rgba(201,164,85,.35);border-radius:16px 3px 16px 16px;padding:19px 20px;margin-bottom:20px}
.delay-title{font-family:'Newsreader',serif;font-size:15px;color:var(--paper);margin-bottom:12px}
.delay-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(241,238,227,.1)}
.delay-row:last-child{border-bottom:none}
.delay-label{font-size:13px;color:rgba(241,238,227,.7)}
.delay-value{font-family:'Newsreader',serif;font-size:15px;color:var(--paper);font-weight:600}
.delay-extra{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--red);margin-left:6px}

.assump-toggle{font-family:'Spline Sans Mono',monospace;font-size:12px;color:rgba(241,238,227,.5);text-align:center;padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tog-caret{display:inline-block;vertical-align:-1px;margin-right:6px;transition:transform .25s ease}
.assump-toggle.open .tog-caret{transform:rotate(180deg)}
.schedule-table{width:100%;border-collapse:collapse;font-family:'Spline Sans Mono',monospace;font-size:11px;margin-top:6px}
.schedule-table th{text-align:right;padding:6px 7px;color:var(--dim);font-weight:500;border-bottom:1px solid rgba(241,238,227,.15)}
.schedule-table th:first-child,.schedule-table td:first-child{text-align:left}
.schedule-table td{text-align:right;padding:5px 7px;color:rgba(241,238,227,.7);border-bottom:1px solid rgba(241,238,227,.06)}
.schedule-scroll{max-height:280px;overflow-y:auto;border-radius:8px;margin-top:8px}
.edit-row{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 14px}
.edit-chip{font-family:'Spline Sans Mono',monospace;font-size:11px;color:rgba(241,238,227,.65);background:rgba(241,238,227,.06);border:1px solid rgba(241,238,227,.16);border-radius:2px 10px 10px 10px;padding:6px 11px;cursor:pointer;transition:border-color .15s,color .15s}
.edit-chip:hover{border-color:rgba(201,164,85,.5);color:var(--paper)}
.edit-chip::before{content:'edit \2192  ';opacity:.5;font-size:9.5px}
.assump-panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
.assump-panel.open{max-height:500px}
.assump-inner{padding:4px 2px 18px;font-size:12.5px;color:rgba(241,238,227,.6);line-height:1.8}
.assump-inner b{color:var(--paper)}
.restart-row{padding:6px 0 28px;text-align:center}
.restart-row button{background:none;border:1px solid rgba(241,238,227,.2);color:rgba(241,238,227,.7);font-family:'Spline Sans Mono',monospace;font-size:12px;padding:10px 20px;border-radius:3px;cursor:pointer}
</style>
</head>
<body>
<div class="topbar">
  <button class="backbtn" id="backBtn" aria-label="Back">←</button>
  <a href="index.html" class="brand">Goalden<span>quick calculate</span></a>
  <button class="assumpbtn" id="assumpBtn" aria-label="View assumptions" title="What assumptions are we using?">i</button>
</div>
<div class="progress" id="progress"></div>
<div class="stage" id="stage"></div>

<script>
'use strict';

/* =====================================================================
   ENGINE — verbatim port of engine.js. Same functions, same math.
   Tested against solved workbooks in /goalden-engine/engine.test.js.
   ===================================================================== */
function inflateExpense(amt, phases, factor) {
  if (factor === undefined) factor = 1;
  for (const p of phases) amt *= Math.pow(1 + p.rate, p.years);
  return amt * factor;
}
function realRate(r, i) { return (1 + r) / (1 + i) - 1; }
function corpusRequired(rate, years, withdrawal, due) {
  if (rate === 0) return withdrawal * years;
  let pv = withdrawal * (1 - Math.pow(1 + rate, -years)) / rate;
  return due ? pv * (1 + rate) : pv;
}
function solveSIP(rate, periods, fv, due) {
  if (rate === 0) return fv / periods;
  let f = (Math.pow(1 + rate, periods) - 1) / rate;
  return fv / (due ? f * (1 + rate) : f);
}
function effectiveMonthlyRate(r) { return Math.pow(1 + r, 1/12) - 1; }
function accumulationSchedule(opts) {
  const rows = []; let bal = opts.opening || 0; let sip = opts.sip; let total = 0;
  for (let i = 1; i <= opts.years; i++) {
    let close;
    if (opts.due) { const b2 = bal + sip; close = b2 + b2 * opts.rate; }
    else { close = (bal + bal * opts.rate) + sip; }
    total += sip;
    rows.push({ period: i, closeBal: close, contributed: total });
    bal = close;
  }
  return { rows, finalBalance: bal };
}
function caretSvg() {
  return '<svg class="tog-caret" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
}
function yearlyAmortization(monthlyRows) {
  const years = []; let prevClose = 0, prevContributed = 0;
  for (let m = 0; m < monthlyRows.length; m += 12) {
    const end = monthlyRows[Math.min(m + 11, monthlyRows.length - 1)];
    const contributedThisYear = end.contributed - prevContributed;
    const growthThisYear = end.closeBal - prevClose - contributedThisYear;
    years.push({ year: years.length + 1, contributed: Math.round(contributedThisYear), growth: Math.round(growthThisYear), close: Math.round(end.closeBal) });
    prevClose = end.closeBal; prevContributed = end.contributed;
  }
  return years;
}
function drawdownSchedule(opts) {
  const rows = []; let bal = opts.openingCorpus; let w = opts.firstWithdrawal;
  for (let yr = 1; yr <= opts.years; yr++) {
    let close;
    if (opts.due) { const baw = bal - w; close = baw + baw * opts.nominalRate; }
    else { close = (bal + bal * opts.nominalRate) - w; }
    rows.push({ year: yr, openBal: bal, withdrawal: w, closeBal: Math.max(0, close) });
    bal = close;
    w *= (1 + opts.inflation);
  }
  return rows;
}

/* =====================================================================
   CONFIG
   ===================================================================== */
const C = {
  IN: {
    code:'IN', flag:'🇮🇳', name:'India', sym:'₹',
    d: { inflation:.06, eduInflation:.10, debt:.07, hybrid:.10, equity:.12, postRet:.09, lifeExp:78 },
    goalInflation: { house:.075, car:.05, wedding:.07, travel:.05 },
    expChips: [25000, 50000, 100000, 200000],
    feeChips: [50000, 100000, 200000, 500000],
    amtChips: [500000, 1000000, 2500000, 5000000],
    ageChips: [22, 25, 30, 35, 40],
    retireChips: [55, 60, 65],
    collegeChips: [5, 8, 10, 15],
    goalYrChips: [3, 5, 7, 10],
    fmt(amt, dp) {
      if (dp === undefined) dp = 0;
      const s = (amt < 0 ? '-' : ''), a = Math.abs(amt);
      const [i, d] = a.toFixed(dp).split('.');
      const last3 = i.slice(-3), rest = i.slice(0, -3);
      const grouped = (rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' : '') + last3;
      return s + '₹' + grouped + (dp > 0 ? '.' + d : '');
    },
    compact(amt) {
      const a = Math.abs(amt);
      if (a >= 1e7) return '₹' + (a/1e7).toFixed(1) + ' Cr';
      if (a >= 1e5) return '₹' + (a/1e5).toFixed(1) + ' L';
      return this.fmt(amt);
    }
  },
  US: {
    code:'US', flag:'🇺🇸', name:'United States', sym:'$',
    d: { inflation:.025, eduInflation:.05, debt:.045, hybrid:.07, equity:.09, postRet:.06, lifeExp:82 },
    goalInflation: { house:.04, car:.03, wedding:.04, travel:.03 },
    expChips: [2000, 4000, 6000, 10000],
    feeChips: [10000, 20000, 40000, 60000],
    amtChips: [50000, 100000, 250000, 500000],
    ageChips: [22, 25, 30, 35, 40],
    retireChips: [60, 65, 67],
    collegeChips: [5, 8, 10, 15],
    goalYrChips: [3, 5, 7, 10],
    fmt(amt, dp) {
      if (dp === undefined) dp = 0;
      const s = (amt < 0 ? '-' : ''), a = Math.abs(amt);
      const [i, d] = a.toFixed(dp).split('.');
      return s + '$' + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (dp > 0 ? '.' + d : '');
    },
    compact(amt) {
      const a = Math.abs(amt);
      if (a >= 1e6) return '$' + (a/1e6).toFixed(1) + 'M';
      if (a >= 1e3) return '$' + (a/1e3).toFixed(1) + 'K';
      return this.fmt(amt);
    }
  }
};

const RISK = [
  { id:'cautious', title:"I'd rather avoid big swings", desc:'Steadier path, lower growth: mixes safer options with some growth.', eq:.25, de:.60, hy:.15 },
  { id:'balanced', title:'Some ups and downs are fine', desc:'A blend of growth and stability, the middle path most people pick.', eq:.50, de:.35, hy:.15 },
  { id:'growth',   title:"I'm investing for the long run", desc:'More growth-focused. Expect a bumpier ride on the way there.', eq:.75, de:.15, hy:.10 },
];

const ICONS = {
  retirement: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.1 5.1l2.1 2.1M16.8 16.8l2.1 2.1M5.1 18.9L7.2 16.8M16.8 7.2l2.1-2.1"/></svg>',

const S = {

  age: null, retireAge: null, monthlyExpense: null,
  annualFee: null, yearsToCollege: null, courseDuration: null,
  genType: null, genAmount: null, genYears: null, existingSavings: 0,
  risk: null, si: 0, quickEdit: false
};

function flow() {
  if (!S.goalType) return ['country', 'goal'];
  if (S.goalType === 'retirement') return ['country','goal','age','retire','expense','risk','results'];
  if (S.goalType === 'education')  return ['country','goal','edu_fee','edu_years','edu_duration','risk','results'];
  if (S.goalType === 'generic')    return ['country','goal','gen_type','gen_amount','gen_years','risk','results'];
  if (S.goalType === 'delay')      return ['country','goal','delay_corpus','delay_years','results'];
  return ['country','goal'];
}

function cfg() { return C[S.country]; }

function riskAllocation() {
  return RISK.find(x => x.id === S.risk) || RISK[1];
}
function riskRate() {
  const d = cfg().d, a = riskAllocation();
  return a.eq*d.equity + a.de*d.debt + a.hy*d.hybrid;
}

/* =====================================================================
   CALCULATION
   ===================================================================== */
function calcRetirement() {
  const d = cfg().d, c = cfg();
  const yrs = S.retireAge - S.age;
  const drawYrs = Math.max(5, d.lifeExp - S.retireAge);
  const annualExp = S.monthlyExpense * 12;
  const expAtRet = inflateExpense(annualExp, [{rate: d.inflation, years: yrs}], 0.75);
  const rr = realRate(d.postRet, d.inflation);
  const corpus = corpusRequired(rr, drawYrs, expAtRet, true);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  // Existing savings are assumed to stay invested the same way the new SIP
  // will be, so both compound at the same mRate. That keeps the identity
  // exact: existingFV + gapCorpus always equals the full target corpus,
  // which is what the accumulation chart below needs to land on.
  const existing = S.existingSavings || 0;
  const existingFV = existing * Math.pow(1 + mRate, yrs * 12);
  const gapCorpus = Math.max(0, corpus - existingFV);
  const alreadyMet = existing > 0 && gapCorpus === 0;
  const sip = alreadyMet ? 0 : solveSIP(mRate, yrs * 12, gapCorpus, true);
  const realCorpus = corpus / Math.pow(1 + d.inflation, yrs);
  const accRows = accumulationSchedule({sip, rate: mRate, years: yrs * 12, due: true, opening: existing}).rows;
  const drawRows = drawdownSchedule({openingCorpus: corpus, firstWithdrawal: expAtRet, inflation: d.inflation, nominalRate: d.postRet, years: drawYrs, due: true});
  const delay = alreadyMet ? null : calcDelay(gapCorpus, mRate, yrs);
  return {corpus, sip, realCorpus, preRate, expAtRet, yrs, drawYrs, accRows, drawRows, delay, d, existing, existingFV, gapCorpus, alreadyMet};
}

function calcEducation() {
  const d = cfg().d, c = cfg();
  const feeAtCollege = inflateExpense(S.annualFee, [{rate: d.eduInflation, years: S.yearsToCollege}]);
  const rr = realRate(d.debt, d.eduInflation);
  const corpus = corpusRequired(rr, S.courseDuration, feeAtCollege, true);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  const existing = S.existingSavings || 0;
  const existingFV = existing * Math.pow(1 + mRate, S.yearsToCollege * 12);
  const gapCorpus = Math.max(0, corpus - existingFV);
  const alreadyMet = existing > 0 && gapCorpus === 0;
  const sip = alreadyMet ? 0 : solveSIP(mRate, S.yearsToCollege * 12, gapCorpus, true);
  const realCorpus = corpus / Math.pow(1 + d.inflation, S.yearsToCollege);
  const accRows = accumulationSchedule({sip, rate: mRate, years: S.yearsToCollege * 12, due: true, opening: existing}).rows;
  const feeYears = Array.from({length: S.courseDuration}, (_, i) =>
    inflateExpense(S.annualFee, [{rate: d.eduInflation, years: S.yearsToCollege + i}])
  );
  const delay = alreadyMet ? null : calcDelay(gapCorpus, mRate, S.yearsToCollege);
  return {corpus, sip, realCorpus, preRate, feeAtCollege, accRows, feeYears, delay, d, existing, existingFV, gapCorpus, alreadyMet};
}

function calcGeneric() {
  const d = cfg().d, c = cfg();
  const inflRate = (c.goalInflation && c.goalInflation[S.genType]) ? c.goalInflation[S.genType] : d.inflation;
  const inflatedGoal = S.genAmount * Math.pow(1 + inflRate, S.genYears);
  const fvSavings = S.existingSavings * Math.pow(1 + d.debt, S.genYears);
  const gap = Math.max(0, inflatedGoal - fvSavings);
  const preRate = riskRate();
  const mRate = effectiveMonthlyRate(preRate);
  const sip = gap > 0 ? solveSIP(mRate, S.genYears * 12, gap, true) : 0;
  const accRows = sip > 0 ? accumulationSchedule({sip, rate: mRate, years: S.genYears * 12, due: true}).rows : [];
  const delay = gap > 0 ? calcDelay(gap, mRate, S.genYears) : null;
  return {inflatedGoal, fvSavings, gap, sip, preRate, accRows, inflRate, delay, d};
}

function calcDelay(corpus, mRate, yearsRemaining) {
  const now3 = Math.max(1, yearsRemaining - 3);
  const now5 = Math.max(1, yearsRemaining - 5);
  const sipNow = solveSIP(mRate, yearsRemaining * 12, corpus, true);
  const sip3   = solveSIP(mRate, now3 * 12, corpus, true);
  const sip5   = solveSIP(mRate, now5 * 12, corpus, true);
  return { sipNow, sip3, extra3: sip3 - sipNow, sip5, extra5: sip5 - sipNow };
}

function mountainChart(rows, maxOverride) {
  const w = 320, h = 148, p = 4;
  const maxV = maxOverride || rows[rows.length-1].closeBal;
  const n = rows.length;
  const sx = (w - p*2) / (n-1);
  const y = v => h - p - (Math.max(0,v)/maxV) * (h - p*2);
  let gp = 'M'+p+','+h, cp = 'M'+p+','+h;
  rows.forEach((r,i) => {
    const x = (p + i*sx).toFixed(1);
    gp += ' L'+x+','+y(r.closeBal).toFixed(1);
    cp += ' L'+x+','+y(r.contributed).toFixed(1);
  });
  const lx = (p+(n-1)*sx).toFixed(1);
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C9A455" stop-opacity=".85"/><stop offset="100%" stop-color="#C9A455" stop-opacity=".08"/></linearGradient></defs>' +
    '<path d="'+gp+' L'+lx+','+h+' L'+p+','+h+' Z" fill="url(#mg)"/>' +
    '<path d="'+cp+' L'+lx+','+h+' L'+p+','+h+' Z" fill="rgba(241,238,227,.16)"/>' +
    '<line x1="'+p+'" y1="'+h+'" x2="'+(w-p)+'" y2="'+h+'" stroke="rgba(241,238,227,.2)" stroke-width="1"/>' +
    '</svg>';
}

function allocationDonut(eq, de, hy, uid) {
  const size = 132, r = 50, cx = 66, cy = 66, sw = 22;
  const circ = 2 * Math.PI * r;
  const segs = [
    { pct: eq, color: '#C9A455', label: 'Equity' },
    { pct: de, color: '#2D6E6E', label: 'Debt' },
    { pct: hy, color: '#8FC79E', label: 'Hybrid' },
  ].filter(s => s.pct > 0.001);
  let cum = 0;
  const arcs = segs.map(s => {
    const len = circ * s.pct;
    const dash = len.toFixed(2) + ' ' + (circ - len).toFixed(2);
    const dashoffset = (-cum).toFixed(2);
    cum += len;
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'" stroke-dasharray="'+dash+'" stroke-dashoffset="'+dashoffset+'" stroke-linecap="butt"/>';
  }).join('');
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" style="transform:rotate(-90deg);flex-shrink:0">' + arcs + '</svg>';
}
function allocationLegend(eq, de, hy) {

}
// A bare filled shape with no readable numbers on it isn't information,
// it's decoration. This version always shows the actual starting and
// ending amounts, the years the timeline spans, and — the thing that
// actually matters for a drawdown plan — exactly where the pot runs dry
// if it does, marked with a real dot and label, not left for the reader
// to guess from the shape of the line.
function potChart(rows, c) {
  const w = 320, h = 172, p = 4, topPad = 20, botPad = 20;
  const chartH = h - topPad - botPad;
  const maxV = rows[0].openBal;
  const n = rows.length;
  const sx = (w-p*2)/(n-1||1);
  const y = v => topPad + chartH - (Math.max(0,v)/maxV)*chartH;
  let depletedYear = null;
  for (const r of rows) { if (r.closeBal <= 0) { depletedYear = r.year; break; } }
  // Reaching exactly zero AT the final year is the plan working correctly
  // — that is what "lasts until age X" means, since the corpus is solved
  // to just cover that many years of withdrawals. Only flag it as an
  // actual shortfall when the money runs out BEFORE the plan says it
  // should.
  const prematureDepletion = depletedYear !== null && depletedYear < n;
  let pts = 'M'+p+','+y(rows[0].openBal).toFixed(1);
  rows.forEach((r,i) => pts += ' L'+(p+i*sx).toFixed(1)+','+y(r.closeBal).toFixed(1));
  const lx = (p+(n-1)*sx).toFixed(1);
  const baseY = y(0).toFixed(1);
  const endVal = rows[rows.length-1].closeBal;
  const endX = lx, endYv = y(endVal);
  const fmt = c ? (v => c.compact(v)) : (v => Math.round(v).toLocaleString());
  const markX = prematureDepletion ? (p+(depletedYear-1)*sx).toFixed(1) : null;
  const markY = prematureDepletion ? y(0).toFixed(1) : null;
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3D7A4F" stop-opacity=".7"/><stop offset="100%" stop-color="#3D7A4F" stop-opacity=".05"/></linearGradient></defs>' +
    '<path d="'+pts+' L'+lx+','+baseY+' L'+p+','+baseY+' Z" fill="url(#eg)"/>' +
    '<path d="'+pts+'" fill="none" stroke="#8FC79E" stroke-width="1.5"/>' +
    '<line x1="'+p+'" y1="'+baseY+'" x2="'+(w-p)+'" y2="'+baseY+'" stroke="rgba(241,238,227,.2)" stroke-width="1"/>' +
    '<text x="'+p+'" y="12" font-family="Spline Sans Mono,monospace" font-size="9.5" fill="rgba(241,238,227,.55)">Starts at '+fmt(maxV)+'</text>' +
    (prematureDepletion
      ? '<circle cx="'+markX+'" cy="'+markY+'" r="3.2" fill="#E8977A"/>' +
        '<text x="'+markX+'" y="'+(parseFloat(markY)-7)+'" text-anchor="middle" font-family="Spline Sans Mono,monospace" font-size="9.5" font-weight="600" fill="#E8977A">Runs out, yr '+depletedYear+'</text>'
      : '<circle cx="'+endX+'" cy="'+endYv.toFixed(1)+'" r="3" fill="#8FC79E"/>' +
        '<text x="'+(w-p)+'" y="12" text-anchor="end" font-family="Spline Sans Mono,monospace" font-size="9.5" font-weight="600" fill="#8FC79E">'+(endVal<=0?'Reaches zero as planned':'Ends at '+fmt(endVal))+'</text>') +
    '<text x="'+p+'" y="'+(h-6)+'" font-family="Spline Sans Mono,monospace" font-size="9" fill="rgba(241,238,227,.4)">Yr 1</text>' +
    '<text x="'+(w-p)+'" y="'+(h-6)+'" text-anchor="end" font-family="Spline Sans Mono,monospace" font-size="9" fill="rgba(241,238,227,.4)">Yr '+n+'</text>' +
    '</svg>';
}

function feeBarChart(feeYears) {
  const c = cfg();
  const w = 320, h = 120, p = 4;
  const maxFee = Math.max(...feeYears);
  const n = feeYears.length;
  const barW = (w - p*2 - (n-1)*8) / n;
  let bars = '';
  feeYears.forEach((fee, i) => {
    const bh = (fee/maxFee) * (h - p*2 - 20);
    const bx = p + i*(barW+8);
    const by = h - p - bh - 16;
    bars += '<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="#C9A455" rx="3" opacity="'+(0.5+0.5*fee/maxFee).toFixed(2)+'"/>';
    bars += '<text x="'+(bx+barW/2).toFixed(1)+'" y="'+(h-p-2).toFixed(1)+'" fill="rgba(241,238,227,.5)" font-size="9" text-anchor="middle" font-family="monospace">Yr '+(i+1)+'</text>';
    bars += '<text x="'+(bx+barW/2).toFixed(1)+'" y="'+(by-4).toFixed(1)+'" fill="rgba(241,238,227,.8)" font-size="9" text-anchor="middle" font-family="monospace">'+c.compact(fee)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+bars+'</svg>';
}

/* =====================================================================
   SLIDER HELPER — every numeric question gets a real, continuous slider
   (not just a fixed set of preset chips) so a person can land on any
   value, not only the ones we guessed they'd want. Chips remain as
   quick-jump shortcuts underneath, not the only way in.
   ===================================================================== */
function sliderBounds(chips, extendFactor, minFloorFactor) {
  extendFactor = extendFactor===undefined ? 2.5 : extendFactor;
  minFloorFactor = minFloorFactor===undefined ? 0.3 : minFloorFactor;
  const lo = chips[0] * minFloorFactor;
  const hi = chips[chips.length-1] * extendFactor;
  let raw = hi / 200;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw,1))));
  const norm = raw / mag;
  const step = (norm<1.5?1:norm<3.5?2:norm<7.5?5:10) * mag;
  return { min: Math.max(0, Math.round(lo/step)*step), max: Math.round(hi/step)*step, step };
}
function valueSlider(id, value, min, max, step, loLabel, hiLabel) {
  return '<div class="value-slider">' +
    '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+(value||min)+'">' +
    '<div class="value-slider-labels"><span>'+loLabel+'</span><span>'+hiLabel+'</span></div>' +
    '</div>';
}
// Wires a slider to the same number-input + set() flow a screen already
// uses, so dragging, typing, and tapping a chip all stay in sync.
function wireSlider(sliderId, inp, min, max, setFn) {
  const sl = document.getElementById(sliderId);
  if (!sl) return null;
  sl.addEventListener('input', () => { inp.value = sl.value; setFn(parseInt(sl.value)); });
  return sl;
}
function syncSliderToValue(sl, v, min, max) {
  if (sl && v!=null) sl.value = Math.min(max, Math.max(min, v));
}

    '</div>';
}

/* =====================================================================
   RENDER ENGINE
   ===================================================================== */
const stage = document.getElementById('stage');
const progressEl = document.getElementById('progress');
const backBtn = document.getElementById('backBtn');
const assumpBtn = document.getElementById('assumpBtn');
function scrollToPanel(panel) {
  // The flex/overflow layout here doesn't always resolve to one clean
  // scrollable ancestor (varies by content length and screen), so walk up
  // from the panel and scroll whichever container actually has overflow,
  // falling back to the window if none do.
  let el = panel.parentElement;
  while (el && el !== document.body) {
    if (el.scrollHeight > el.clientHeight + 4) {
      el.scrollTo({ top: panel.offsetTop - el.offsetTop - 12, behavior: 'smooth' });
      return;
    }
    el = el.parentElement;
  }
  window.scrollTo({ top: panel.getBoundingClientRect().top + window.scrollY - 12, behavior: 'smooth' });
}
assumpBtn.addEventListener('click', () => {
  const panel = document.getElementById('ap');
  if (!panel) return;
  panel.classList.add('open');
  // The panel expands via a CSS max-height transition — scrolling in the
  // same tick sees it still at its collapsed height, so give the layout
  // a moment to update first.
  setTimeout(() => scrollToPanel(panel), 60);
});

function renderProgress() {
  progressEl.innerHTML = '';
  const f = flow();
  f.forEach((s, i) => {
    if (s === 'results') return;
    const d = document.createElement('div');
    d.className = 'dot'+(i < S.si?' done':(i===S.si?' active':''));
    d.innerHTML = '<i></i>';
    progressEl.appendChild(d);
  });
}

function go(delta) {
  // reset goal-specific fields if changing goal
  if (delta > 0 && flow()[S.si] === 'goal') {
    S.age = null; S.retireAge = null; S.monthlyExpense = null;
    S.annualFee = null; S.yearsToCollege = null; S.courseDuration = null;
    S.genType = null; S.genAmount = null; S.genYears = null; S.existingSavings = 0;
    S.risk = null;
  }
  S.si = Math.max(0, Math.min(flow().length - 1, S.si + delta));
  render();
}

// Reached results, want to fix one answer without re-walking every question
// after it: jump straight to that screen, keeping every other answer intact.
function jumpEdit(screenName) {
  S.quickEdit = true;
  S.si = flow().indexOf(screenName);
  render();
}

// The single "Continue" exit point for every question screen. Normal flow
// just steps forward one screen. But if we arrived here via jumpEdit (fixing
// one answer from the results screen), stepping forward one would land on
// whatever question happens to sit next in the array, which is almost never
// what the person wants; they want straight back to their updated result.
function advance() {
  if (S.quickEdit) { S.quickEdit = false; S.si = flow().indexOf('results'); render(); }
  else { go(1); }
}

function render() {
  const f = flow(), screen = f[S.si];
  let html = '';
  if (screen==='country')      html = sCountry();
  else if (screen==='goal')    html = sGoal();
  else if (screen==='age')     html = sAge();
  else if (screen==='retire')  html = sRetire();
  else if (screen==='expense') html = sExpense();
  else if (screen==='edu_fee') html = sEduFee();
  else if (screen==='edu_years')     html = sEduYears();
  else if (screen==='edu_duration')  html = sEduDuration();
  else if (screen==='gen_type')   html = sGenType();
  else if (screen==='gen_amount') html = sGenAmount();
  else if (screen==='gen_years')  html = sGenYears();
  else if (screen==='risk')    html = sRisk();
  else if (screen==='results') html = sResults();

  const wrap = document.createElement('div');
  wrap.className = 'screen active';
  wrap.innerHTML = html;
  stage.innerHTML = '';
  stage.appendChild(wrap);
  backBtn.classList.toggle('show', S.si > 0);
  assumpBtn.classList.toggle('show', screen==='results');
  renderProgress();
  attach(screen);
}

/* =====================================================================
   EVENT HANDLERS
   ===================================================================== */
function attach(screen) {
  const nb = document.getElementById('nextBtn');

  function sel(el) { el && el.classList.add('selected'); }
  function unsel(q) { document.querySelectorAll(q).forEach(e => e.classList.remove('selected')); }

  if (screen==='country') {
    document.querySelectorAll('[data-country]').forEach(el => el.addEventListener('click', () => {
      S.country = el.dataset.country; S.goalType = null; S.si = 0;
      render();
    }));
    nb && nb.addEventListener('click', () => go(1));
  }

  if (screen==='goal') {
    document.querySelectorAll('[data-goal]').forEach(el => el.addEventListener('click', () => {
      S.goalType = el.dataset.goal;
      render();
    }));
    nb && nb.addEventListener('click', () => {
      if (S.goalType === 'delay') { S.si++; render(); } else go(1);
    });
  }

  if (screen==='age') {
    const inp = document.getElementById('inp'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider');
    const set = v => { S.age = v; nb.disabled = !v; err.textContent = ''; };
    inp.addEventListener('input', () => { set(parseInt(inp.value)||null); syncSliderToValue(sl, S.age, 18, 70); });
    wireSlider('inpSlider', inp, 18, 70, set);
    document.querySelectorAll('[data-age]').forEach(el => el.addEventListener('click', () => { inp.value=el.dataset.age; syncSliderToValue(sl, parseInt(el.dataset.age), 18, 70); set(parseInt(el.dataset.age)); }));
    nb.addEventListener('click', () => {
      if (!S.age||S.age<16||S.age>75){err.textContent='Enter an age between 16 and 75.';return;}
      go(1);
    });
  }

  if (screen==='retire') {
    const inp = document.getElementById('inp'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider');
    const retMin = Math.max(35, (S.age||30)+1);
    const set = v => { S.retireAge = v; nb.disabled = !v; err.textContent=''; };
    inp.addEventListener('input', () => { set(parseInt(inp.value)||null); syncSliderToValue(sl, S.retireAge, retMin, 85); });
    wireSlider('inpSlider', inp, retMin, 85, set);
    document.querySelectorAll('[data-retire]').forEach(el => el.addEventListener('click', () => { inp.value=el.dataset.retire; syncSliderToValue(sl, parseInt(el.dataset.retire), retMin, 85); set(parseInt(el.dataset.retire)); }));
    nb.addEventListener('click', () => {
      if (!S.retireAge||S.retireAge<=S.age){err.textContent='This should be after your current age ('+S.age+').';return;}
      if (S.retireAge>85){err.textContent='Try an age up to 85.';return;}
      advance();
    });
  }

  if (screen==='expense') {
    const c = cfg();
    const inp = document.getElementById('inp'), inpSav = document.getElementById('inpSav'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider'), slSav = document.getElementById('inpSavSlider');
    const b = sliderBounds(c.expChips), bSav = sliderBounds(c.amtChips,6,0);
    const set = v => { S.monthlyExpense = v; nb.disabled = !v; err.textContent=''; };
    inp.addEventListener('input', () => { set(parseInt(inp.value)||null); syncSliderToValue(sl, S.monthlyExpense, b.min, b.max); });
    wireSlider('inpSlider', inp, b.min, b.max, set);
    inpSav && inpSav.addEventListener('input', () => { S.existingSavings = parseInt(inpSav.value)||0; syncSliderToValue(slSav, S.existingSavings, 0, bSav.max); });
    if (slSav) slSav.addEventListener('input', () => { inpSav.value = slSav.value; S.existingSavings = parseInt(slSav.value)||0; });
    document.querySelectorAll('[data-exp]').forEach(el => el.addEventListener('click', () => { inp.value=el.dataset.exp; syncSliderToValue(sl, parseInt(el.dataset.exp), b.min, b.max); set(parseInt(el.dataset.exp)); }));
    nb.addEventListener('click', () => { if(!S.monthlyExpense){err.textContent='Enter your typical monthly spend.';return;} advance(); });
  }

  if (screen==='edu_fee') {
    const c = cfg();
    const inp = document.getElementById('inp'), inpSav = document.getElementById('inpSav'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider'), slSav = document.getElementById('inpSavSlider');
    const b = sliderBounds(c.feeChips), bSav = sliderBounds(c.feeChips,10,0);
    const set = v => { S.annualFee = v; nb.disabled = !v; err.textContent=''; };
    inp.addEventListener('input', () => { set(parseInt(inp.value)||null); syncSliderToValue(sl, S.annualFee, b.min, b.max); });
    wireSlider('inpSlider', inp, b.min, b.max, set);
    inpSav && inpSav.addEventListener('input', () => { S.existingSavings = parseInt(inpSav.value)||0; syncSliderToValue(slSav, S.existingSavings, 0, bSav.max); });
    if (slSav) slSav.addEventListener('input', () => { inpSav.value = slSav.value; S.existingSavings = parseInt(slSav.value)||0; });
    document.querySelectorAll('[data-fee]').forEach(el => el.addEventListener('click', () => { inp.value=el.dataset.fee; syncSliderToValue(sl, parseInt(el.dataset.fee), b.min, b.max); set(parseInt(el.dataset.fee)); }));
    nb.addEventListener('click', () => { if(!S.annualFee){err.textContent='Enter the annual fee.';return;} advance(); });
  }

  if (screen==='edu_years') {
    const inp = document.getElementById('inp'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider');
    const set = v => { S.yearsToCollege = v; nb.disabled = !v; err.textContent=''; };
    inp.addEventListener('input', () => { set(parseInt(inp.value)||null); syncSliderToValue(sl, S.yearsToCollege, 1, 22); });
    wireSlider('inpSlider', inp, 1, 22, set);
    document.querySelectorAll('[data-cy]').forEach(el => el.addEventListener('click', () => { inp.value=el.dataset.cy; syncSliderToValue(sl, parseInt(el.dataset.cy), 1, 22); set(parseInt(el.dataset.cy)); }));
    nb.addEventListener('click', () => {
      if(!S.yearsToCollege||S.yearsToCollege<1){err.textContent='Enter years until college starts.';return;}
      advance();
    });
  }

  if (screen==='edu_duration') {
    const inp = document.getElementById('inp'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider');
    const set = v => { S.courseDuration = v; nb.disabled = !v; err.textContent=''; };
    inp.addEventListener('input', () => { set(parseInt(inp.value)||null); syncSliderToValue(sl, S.courseDuration, 1, 8); });
    wireSlider('inpSlider', inp, 1, 8, set);
    document.querySelectorAll('[data-cd]').forEach(el => el.addEventListener('click', () => { inp.value=el.dataset.cd; syncSliderToValue(sl, parseInt(el.dataset.cd), 1, 8); set(parseInt(el.dataset.cd)); }));
    nb.addEventListener('click', () => { if(!S.courseDuration){err.textContent='Enter course duration.';return;} advance(); });
  }

  if (screen==='gen_type') {
    document.querySelectorAll('[data-gt]').forEach(el => el.addEventListener('click', () => { S.genType = el.dataset.gt; render(); }));
    nb && nb.addEventListener('click', () => advance());
  }

  if (screen==='gen_amount') {
    const c = cfg();
    const inp = document.getElementById('inp'), inpSav = document.getElementById('inpSav'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider'), slSav = document.getElementById('inpSavSlider');
    const b = sliderBounds(c.amtChips), bSav = sliderBounds(c.amtChips,4,0);
    const set = v => { S.genAmount = v; nb.disabled = !v; err.textContent=''; };
    inp.addEventListener('input', () => { set(parseInt(inp.value)||null); syncSliderToValue(sl, S.genAmount, b.min, b.max); });
    wireSlider('inpSlider', inp, b.min, b.max, set);
    inpSav && inpSav.addEventListener('input', () => { S.existingSavings = parseInt(inpSav.value)||0; syncSliderToValue(slSav, S.existingSavings, 0, bSav.max); });
    if (slSav) slSav.addEventListener('input', () => { inpSav.value = slSav.value; S.existingSavings = parseInt(slSav.value)||0; });
    document.querySelectorAll('[data-ga]').forEach(el => el.addEventListener('click', () => { inp.value=el.dataset.ga; syncSliderToValue(sl, parseInt(el.dataset.ga), b.min, b.max); set(parseInt(el.dataset.ga)); }));
    nb.addEventListener('click', () => { if(!S.genAmount){err.textContent='Enter the goal amount.';return;} advance(); });
  }

  if (screen==='gen_years') {
    const inp = document.getElementById('inp'), err = document.getElementById('err');
    const sl = document.getElementById('inpSlider');
    const set = v => { S.genYears = v; nb.disabled = !v; err.textContent=''; };
    inp.addEventListener('input', () => { set(parseInt(inp.value)||null); syncSliderToValue(sl, S.genYears, 1, 30); });
    wireSlider('inpSlider', inp, 1, 30, set);
    document.querySelectorAll('[data-gy]').forEach(el => el.addEventListener('click', () => { inp.value=el.dataset.gy; syncSliderToValue(sl, parseInt(el.dataset.gy), 1, 30); set(parseInt(el.dataset.gy)); }));
    nb.addEventListener('click', () => { if(!S.genYears||S.genYears<1){err.textContent='Enter years until you need it.';return;} advance(); });
  }

  if (screen==='risk') {
    document.querySelectorAll('[data-risk]').forEach(el => el.addEventListener('click', () => { S.risk=el.dataset.risk; render(); }));
    nb && nb.addEventListener('click', () => advance());
  }

  if (screen==='results') {
    document.querySelectorAll('[data-jump]').forEach(el => el.addEventListener('click', () => jumpEdit(el.dataset.jump)));
    const at = document.getElementById('at'), ap = document.getElementById('ap');
    if (at && ap) at.addEventListener('click', () => ap.classList.toggle('open'));
    const st = document.getElementById('st'), sp = document.getElementById('sp');
    if (st && sp) st.addEventListener('click', () => { sp.classList.toggle('open'); st.classList.toggle('open'); });
    const dt = document.getElementById('dt'), dp = document.getElementById('dp');
    if (dt && dp) dt.addEventListener('click', () => { dp.classList.toggle('open'); dt.classList.toggle('open'); });
    const rb = document.getElementById('rb');
    if (rb) rb.addEventListener('click', () => {
      Object.assign(S, {country:null,goalType:null,age:null,retireAge:null,monthlyExpense:null,annualFee:null,yearsToCollege:null,courseDuration:null,genType:null,genAmount:null,genYears:null,existingSavings:0,risk:null,si:0,quickEdit:false});
      render();
    });
  }
}

backBtn.addEventListener('click', () => {
  if (S.quickEdit) { S.quickEdit = false; S.si = flow().indexOf('results'); render(); return; }
  if (S.si>0) go(-1);
});
render();
</script>
